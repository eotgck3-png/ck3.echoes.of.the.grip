l_english:
 # ── TGP, EP3 Governance & CE1 Legends — EotG Setting Overrides ───────────────
 # Sources: dlc/tgp/dlc_tgp_governance_l_english.yml,
 #          dlc/tgp/tgp_china_modifiers_l_english.yml,
 #          dlc/tgp/tgp_dynastic_cycle_flavor_events_l_english.yml,
 #          dlc/tgp/dlc_tgp_situation_decision_events_l_english.yml,
 #          dlc/ep3/ep3_governance_l_english.yml,
 #          dlc/ce1/legends_l_english.yml,
 #          dlc/ce1/ce1_epidemic_events_l_english.yml (dogs key only)
 # Replaces: "peasant/peasantry" → "commoner/commonfolk",
 #            "serf/serfs" → "bonded worker/workers",
 #            "exorcist/exorcism" → "spirit-banisher/banishment rite".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── TGP: Governor Contract Events ────────────────────────────────────────────

 # "the peasantry have taken it as a dire portent"
 tgp_governor_contract_event.0030.desc:0 "I'm deeply engrossed in conversation with [my_councillor.GetFirstName] when [alarmed_councillor.GetFirstName] bursts into the room with uncommon urgency, visibly shaken.\n\n"A messenger from [quaking_in_panic_destination.GetName], [ROOT.Char.Custom('FormOfAddressForLiege')]! There's been an earthquake and the commonfolk have taken it as a dire portent, claiming it to be a sign of divine displeasure!""

 # "I pay little heed to the clamor of peasants."
 tgp_governor_contract_event.0030.b:0 "I pay little heed to the clamor of commoners."

 # "peasants crowding around my escort with plaintive pleas"
 tgp_governor_contract_event.0031.desc:0 "The village is in a clear state of unrest as I arrive, commoners crowding around my escort with plaintive pleas that we assuage Heaven's wrath before another disaster befalls them.\n\nCasting my eyes over the village behind them, the cracked walls and crooked doors of their homes testify as to the source of their fears."

 # "The peasants' fears prove too great to assuage"
 tgp_governor_contract_event.0031.a.failure:0 "The commoners' fears prove too great to assuage"

 # ── TGP: China Modifiers ──────────────────────────────────────────────────────

 # "The peasants of this region are working hard"
 tgp_diligent_workers_modifier_desc:0 "The commoners of this region are working hard to placate their liege in order to keep their young from being levied."

 # ── TGP: Dynastic Cycle Events ────────────────────────────────────────────────

 # "the peasants of [county] forced open the grain stores"
 tgp_dynastic_cycle_events.0020.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ill news." My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] [marshal.GetName] approaches me, [marshal.Custom('quirk_pos_pp')].\n\n"In the dead of night, the commoners of [peasant_county.GetName] forced open the grain stores. If I could hire more guards we may be able to still find them."\n\nEven our realm is not safe from [my_situation.GetTopCurrentPhase.GetName]."

 # "Executed Peasants" — county modifier name
 tgp_executed_peasants_county_modifier:0 "Executed Commoners"

 # "the treatment their starving peasants were given"
 tgp_executed_peasants_county_modifier_desc:0 "This county has not forgotten the treatment their starving commoners were given."

 # "even the peasants forsake my lands for fear of coming turmoil"
 tgp_dynastic_cycle.0081.desc:0 "In an instant, Heaven trembles and the world is overturned.\n\nLoyal ministers flee in search of new masters, soldiers abandon their duties, and now even the commoners forsake my lands for fear of coming turmoil.\n\nAll ills are ascribed to my #EMP iniquitous#! rule, and it is proclaimed far and wide that I have lost the Mandate of Heaven!"

 # "letting provincial peasants into offices"
 tgp_dynastic_cycle.0056.desc.advancement:0 "However, the [ROOT.Char.GetTopLiege.GetName] is blinded by the examinations, letting provincial commoners into offices. Soon, they will denigrate our history."

 # ── EP3: Governor Contract Events ────────────────────────────────────────────

 # "the peasant has come across a buried stash"
 governor_contract_event.2071.desc.fallback:0 "It is a modest-looking chest filled to the brim with an assortment of golden coins minted throughout the region in different periods. My guess would be that the commoner has come across a buried stash from some long-dead crew of outlaws."

 # "every serf of [peasant.GetHerHis] community"
 governor_contract_event.2071.desc.end:0 "\n\n[peasant.GetFirstNameNoTooltip] — and seemingly every bonded worker of [peasant.GetHerHis] community — watches expectantly, breathlessly: "What's to be done with the treasure, wise [ROOT.Char.GetTitleAsName]?""

 # "these serfs #EMP ought#! to pay"
 governor_contract_event.1003.desc_stewardship:0 "Taking careful stock of every [ROOT.Char.Custom('RegionalFarmAnimal')], every stalk of barley, every homespun blanket and clay pot has yielded a good estimate of the taxes these bonded workers #EMP ought#! to pay."

 # "I'll request an official exorcist from the capital."
 governor_contract_event.2051.a:0 "I'll request an official spirit-banisher from the capital."

 # "Bring in a renowned [PriestNeuter] for an exorcism."
 governor_contract_event.2051.b:0 "Bring in a renowned [ROOT.Char.GetFaith.PriestNeuter] for a banishment rite."

 # ── CE1: Legends ──────────────────────────────────────────────────────────────

 # "From Peasant to Basileus" — legend title
 legend_peasant_emperor:0 "From Commoner to Basileus"

 # "Basil was born to peasant farmers"
 legend_peasant_emperor_desc:0 "Basil was born to commoner farmers and entered the employ of the Emperor before marrying his daughter and ascending to the rank of Basileus himself."

 # "a mere peasant in the village of Stadice"
 legend_premysl_desc:0 "Our ancestor began life as a mere commoner in the village of Stadice, but he soon caught the eye of Libuše and married her to become Prince of the Czechs."

 # "a poor peasant requested an audience" — legend chapter motivation
 legend_chapter_motivation_peasant:0 "When a tearful, desperate, poor commoner requested an audience with [ROOT.Legend.GetProtagonist.GetHerHim], the pious [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] could not leave his pleas unattended and quickly set out on an adventure."

 # "a helpless — but truly striking — peasant amidst the melee"
 legend_chapter_battle_maiden_kiss:0 "Upon encountering a helpless — but truly striking — commoner amidst the melee in battle, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] swooped in to carry them away. Our hero was promptly rewarded with a kiss, as truly befits a [ROOT.Legend.GetProtagonist.GetWomanMan] of such gallantry!"

 # "Where once peasants rolled around in squalor"
 legend_chronicle_conclusion_exotic_backstory:0 "Much had changed since [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] had arrived. Where once commoners rolled around in squalor and barbarians bled the land dry, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] had spread the light of civilization. Though there were many rocks in [ROOT.Legend.GetProtagonist.GetHerHis] path, he collected them all as means to build a new [ROOT.Legend.GetProperty( 'location' ).GetFlagName]. All across the realm, babes are named for [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] and the masses sing out in grateful chorus for the stranger from [ROOT.Legend.GetProperty( 'location' ).GetFlagName] who built their great city."

 # "[culture] peasants gurgle about" — legend seed option
 legend_events.0020.c:0 "A [ROOT.Char.GetCulture.GetPrefixNoTooltip] ruler does not care for what [seed_presenter.GetCulture.GetCollectiveNounNoTooltip] commoners gurgle about."

 # ── CE1: Epidemic Events (dogs key not in eotg_epidemic_events_l_english.yml) ─

 # "Peasants now claim that dogs carry the plague"
 epidemic_events.1060.desc.mid.dogs:0 "Commoners now claim that dogs carry the plague — that their eyes gleam with cursed light. Packs are being hunted and tried in mock trials, even burned."
