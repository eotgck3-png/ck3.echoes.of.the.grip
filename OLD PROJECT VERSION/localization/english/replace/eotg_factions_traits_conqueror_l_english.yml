l_english:
 # ── Factions, Traits & Conqueror — EotG Setting Overrides ────────────────────
 # Sources: factions_l_english.yml,
 #          traits_l_english.yml,
 #          conqueror_l_english.yml
 # Replaces: "peasant/peasants/peasantry" → "commoner/commoners/commonfolk".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Factions ──────────────────────────────────────────────────────────────────

 # "Peasant Faction" — faction name
 peasant_faction:0 "Commoner Faction"

 # "The Peasant [faction|E] wants freedom"
 peasant_faction_desc:0 "The Commoner [faction|E] wants freedom for the people from foreign or infidel rule, and will strive to replace a liege who does not share the [culture|E] and [faith|E] of the commoners in the [counties|E]."

 # "A peasant's lot is to serve their lord!"
 FACTION_DEMAND_PEASANT_REFUSE:0 "Never! A commoner's lot is to serve their lord!"

 # "Peasant Rabble"
 FACTION_PEASANT_NAME:0 "Commoner Rabble"

 # "Peasant Revolt"
 FACTION_PEASANT_TITLE_NAME:0 "Commoner Revolt"

 # "Escalated Peasant Faction"
 escalated_peasant_faction:0 "Escalated Commoner Faction"

 # ── Traits ────────────────────────────────────────────────────────────────────

 # "fighting a few actions against recalcitrant peasants"
 trait_education_martial_prowess_2_desc:0 "The Confident Knight is familiar with the ways of their culture's traditional combat, even fighting a few actions against recalcitrant commoners as a teenager."

 # "[name] fighting ... against recalcitrant peasants"
 trait_education_martial_prowess_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is familiar with the ways of [ROOT.GetCharacter.GetHerHis] culture's traditional combat, even fighting a few actions against recalcitrant commoners as a teenager."

 # "Peasant Leader" — trait name
 trait_peasant_leader:0 "Commoner Leader"

 # "a jumped up peasant who revolted against their betters"
 trait_peasant_leader_desc:0 "This character is a jumped up commoner who revolted against their betters."

 # "[name] is a jumped up peasant who revolted"
 trait_peasant_leader_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] is a jumped up commoner who revolted against [ROOT.GetCharacter.GetHerHis] betters."

 # ── Conqueror ─────────────────────────────────────────────────────────────────

 # "From the lowest peasant to the most noble"
 conqueror.0001.desc:0 "It is increasingly clear. From the lowest commoner to the most noble of my vassals — they are all whispering my name, whispering of my might, whispering of #EMP war!#! There's support for my cause, for my people see me as a ruler worthy of the world.\n\nThe strength of the [ROOT.Char.GetPrimaryTitle.GetBaseName] is mine to wield — and wield it I shall. To strike outwards is what's expected of me, to claim by might what should belong to me. I am destined to rule, to subjugate those around me and make them part of my [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip].\n\nWith my people behind me, I cannot fail."

 # "The peasant sputters, prostrating [herself/himself]"
 conqueror.1300.desc:0 ""M'[root_scope.GetLadyLord], m'[ROOT.Char.GetTitleAsNameNoTooltip|l], m'undisputed — most [root_scope.Custom('ComplimentAdjective')] #EMP liege!#!" The commoner sputters, prostrating [portrait_peasant.GetHerselfHimself] before me.\n\n"We of the humble hamlets of the [peasant_barony.GetBaseName] come bearing gifts — grain, game, and gold. We have toiled hard, but we know that you will bring prosperity!" [portrait_peasant.GetSheHe|U] continues.\n\nThey may be the lowliest of my subjects, but they would do anything I ask of them."

 # "Widespread Peasant Support" — modifier name
 peasant_supplies:0 "Widespread Commoner Support"

 # "widely popular among the peasantry"
 peasant_supplies_desc:0 "This character is widely popular among the commonfolk, who willingly give up more supplies than usual."

 # "Peasant Draft" — modifier name
 peasant_draft:0 "Commoner Draft"

 # "Peasants flock to the banners"
 peasant_draft_desc:0 "Commoners flock to the banners of this character, more than willing to take up arms in the levy."

 # "The peasants of the [county] are enthused"
 conqueror_feed_county_gift_desc:0 "The commoners of the [county_target.GetName] are enthused with your conquests and send you gold."