l_english:
 # ── Activities, DLC Yearly & Roaming Events — EotG Setting Overrides ─────────
 # Sources: roaming_activity_l_english.yml,
 #          survey_activity_l_english.yml,
 #          coronation_events_1_l_english.yml,
 #          tournament_activity_oltner_l_english.yml,
 #          dlc/mpo/mpo_feast_events_l_english.yml,
 #          dlc/mpo/mpo_events_tova_l_english.yml,
 #          dlc/bp2/dlc_bp2_activity_adult_education_l_english.yml,
 #          dlc/bp2/dlc_bp2_yearly_2_l_english.yml,
 #          dlc/bp2/dlc_bp2_yearly_4_l_english.yml,
 #          dlc/bp1/dlc_bp1_yearly_events_l_english.yml
 # Replaces: "peasant/peasants" → "commoner/commoners",
 #            "serf/serfs" → "bonded laborer/workers",
 #            "prayer/pray" (hardcoded) → "observance/focus",
 #            "sin" as noun → "transgression".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Roaming Activity ─────────────────────────────────────────────────────────

 # "peasants or serfs toiling in the sun"
 roaming_intro_terrain_snippet_farmlands:0 "Endless rows of crops stretch as far as the eye can see, with workers or bonded laborers toiling in the sun."

 # "I should offer up a small prayer for the dead."
 bp3_roaming.0130.a:0 "I should offer up a small observance for the dead."

 # "offered up a small prayer to the dead" — roaming activity log string
 roaming_battlefield_prayer_key:0 "In [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [host.GetShortUIName] found a forgotten battlefield, where [host.GetSheHe] offered up a small observance for the dead."

 # "just close your eyes and pray"
 bp3_roaming.0140.a:0 "Don't think about it, just close your eyes and focus."

 # ── Survey Activity ───────────────────────────────────────────────────────────

 # "impressed the peasants and nobles taking part"
 apa_survey_small_festival_key:0 "[first.GetShortUIName] took part in a small festival in [apa_province.GetName], and impressed the commoners and nobles taking part."

 # ── Coronation Events ─────────────────────────────────────────────────────────

 # "My slice goes to my peasants!"
 coronation_events.1026.f:0 "My slice goes to my commoners!"

 # ── Tournament Events ─────────────────────────────────────────────────────────

 # "improvised arena, set up by the local peasants"
 tournament_events.9002.desc:0 "Lively noises makes me discover an improvised arena, set up by the local commoners, where two burly wrestlers are putting on a show. They trade blows, weave, duck, and circle each other — until one of them makes a daring move:\n\n"I call this one the #EMP [strongman_1.Custom('GetDescriptorManeuver')] [strongman_1.Custom('GetManeuver')]!#!" [strongman_1.GetSheHe] screams before lifting [strongman_1.GetHerHis] opponent and slamming [strongman_1.GetHerHim] into the ground — making [strongman_2.GetHerHim] yield immediately. "[strongman_1.GetFirstName] the [strongman_1.Custom('ComplimentAdjective')|U] and [strongman_1.Custom('RandomPositiveLookAdjective')|U], victorious yet again!" the victor gloats."

 # "Three peasants in particular seem to be sharing" — scope tokens [peasant_N.GetX] resolve to names/words, not "peasant"
 tournament_events.9005.desc:0 "Food and drink is abundant during the tournament, to the delight of the attendees. Three commoners in particular seem to be sharing what looks like an #EMP entire keg#! of [tournament_host.Custom('RegionalDrink')].\n\n"Ahwi... ahwigetcha' for 'dat, you [peasant_2.Custom2('InsultNoun', SCOPE.sC('peasant_1'))]!" one sputters drunkenly, limply throwing [peasant_1.Custom('ThrowableObjectArticle')] at [peasant_1.GetHerHis] neighbor.\n\n"[peasant_1.GetFirstName], ahmas... ah am sorry! [peasant_1.Custom('GetLaughType')]" the victim covers [peasant_1.GetHerHis] face, deflecting the attack. "Help me, [peasant_3.GetFirstName]! #EMP *hic*#!"\n\n"Yer on yer own 'dere, [peasant_2.GetName]!" the last one exclaims, downing an entire mug in one big gulp."

 # ── MPO: Feast Events ─────────────────────────────────────────────────────────

 # "and peasants small sacks of valuables"
 feast_tsagaan_sar_events.0002.desc:0 "The festivities have begun, and while I am grateful to [host.GetName] for [host.GetHerHis] invitation, I ponder the gift I must give [host.GetHerHim]. This is beyond a matter of tradition: it is one of honor.\n\nI observe other nobles bringing chests of foreign coin, and commoners small sacks of valuables. Others trot on horses, and tend to them in preparation for meeting their new owner. A few guests grant a intangible offering, speaking precious oaths of fidelity.\n\nBut the question arises, what can I give up for my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))], [host.GetFirstNameNoTooltip]?"

 # "word to my astrologer to pray for [host]"
 gift_astrologer_prayer:0 "word to my astrologer to make offerings for [ROOT.Char.GetInvolvedActivity.GetHost.GetHerHim]"

 # ── MPO: Tova Events ─────────────────────────────────────────────────────────

 # "They are peasant rebels posing as actors"
 mpo_events_tova.0003.desc:0 "The ominous caw of a carrion call greets me as I clear the forest edge, where I am met with the sight of empty nooses swaying slightly from the [unruly_province.Custom('GetRandomRegionalWood')] branches. Three men in chains kneel below the nooses. One of them looks almost like [unruly_province_owner.GetTitledFirstName]. \n\n"These lowly curs mocked the rightful rule of our [unruly_province_owner.GetTitleTierName]!" cries the executioner. "They are common rebels posing as actors, and their campaign of slander will end in their deaths." \n\n"Please help us," one of the accused call out to me."

 # ── BP2: Adult Education Activity ─────────────────────────────────────────────

 # "A Party of Peasants" — event title
 bp2_adult_education.9100.t:0 "A Party of Commoners"

 # "two peasants, [HighGodName] knows how they got in here"
 bp2_adult_education.9100.desc:0 "I am suddenly distracted from my midnight studies by a loud #EMP *Crash*#!, an ear-deafening #EMP *SLAM*#! and an expensive-sounding #EMP *Shatter*#!. What in the world is going on!?\n\nThe source of disturbance appears to be two commoners, [ROOT.Char.GetFaith.HighGodName] knows how they got in here, ravenously gulping down a barrel of the university's [ROOT.Char.Custom('GetExpensiveDrink_Singular')]!\n\n"This'll #EMP *hic*#! teach them!" One of them shouts. "Yeah, they think they're better than us just because they can #EMP read!#!" The other follows."

 # ""Peasants — get us more cups, I'm getting the other students!""
 bp2_adult_education.9100.b:0 ""Commoners — get us more cups, I'm getting the other students!""

 # ── BP2: Yearly Events ────────────────────────────────────────────────────────

 # "a sickly-looking peasant child holed up in the corner"
 bp2_yearly.2130.desc:0 "It is a rare occasion that I manage to slip by all my attendants unnoticed and secure a few precious moments to myself — a chance to finally feel like other children must.\n\nClutching my [ROOT.Char.Custom( 'child_favorite_toy' )], I walk the streets of [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] taking in all the sights and smells. People are bustling about; merchants hawking their wares.\n\nI come upon a sickly-looking commoner child holed up in the corner of an alleyway."

 # "an old peasant was praising [parent]" — versioned :1 in vanilla, override at :0
 bp2_yearly.4011.desc:0 "My [famous_dead_parent.GetMotherFather], the great [famous_dead_parent.GetTitledFirstName], [famous_dead_parent.GetDeathReason] a long time ago. Yet the flame of [famous_dead_parent.GetHerHis] life still shines bright. What surrounded [famous_dead_parent.GetHerHim] everywhere now seems to follow me.\n\nMany still consider me [famous_dead_parent.GetHerHis] [ROOT.Char.Custom('GetDaughterSon')], rather than a [ROOT.Char.GetWomanMan] in my own right! Just yesterday an old commoner was praising [famous_dead_parent.GetHerHim] as if [famous_dead_parent.GetSheHe] was still alive!\n\nThe time has come to step out of [famous_dead_parent.GetHerHis] shadow! To make my mark on the world! To be recognized as the great [ROOT.Char.GetTitledFirstName]!"

 # ── BP1: Yearly Events ────────────────────────────────────────────────────────

 # "alongside the unsuspecting peasants with a pickaxe"
 bp1_yearly.5304.desc:0 "The waterlogged, marshy land I have volunteered to help with makes for sweaty work. I labor hard alongside the unsuspecting commoners with a pickaxe, digging trenches and depositing sacks of wet mud away from the area.\n\n[concerned_friend.GetFirstName] and I are taking a break, standing at rest on the narrow strip between two patches of bog, when [waterboy.GetFirstName], one of the children tasked with keeping the workers hydrated, wanders towards me offering a flask. No sooner have I taken a swig than [waterboy.GetFirstNameNoTooltip], reaching for the bottle, overbalances and falls directly into the bog!"

 # "bid farewell to the peasants I had been working alongside"
 bp1_yearly.5305.desc:0 "With my tasks completed, I bid farewell to the commoners I had been working alongside with [concerned_friend.GetFirstName] — they cheerily waved me off, completely unsuspecting as to my noble origins — and returned to my usual lodgings. Though my muscles are sore, I feel flush with strength and vitality.\n\nSpying a large basin of water on the other side of the room, I haul myself to my feet and approach it. Taking off my shirt, in the flicker of the candlelight I regard myself in the water's reflection."

 # "This sin will not stand!"
 bp1_yearly.5716.a:0 "This transgression will not stand!"
