l_english:
 # ── Stewardship, Serf & Misc — EotG Setting Overrides ────────────────────────
 # Sources: event_localization/lifestyle/governance/stewardship_duty_events_l_english.yml,
 #          event_localization/lifestyle/governance/stewardship_domain_events_l_english.yml,
 #          culture/cultural_innovations_l_english.yml,
 #          dlc/ep3/ep3_governance_l_english.yml,
 #          dlc/fp1/dlc_fp1_major_decisions_events_l_english.yml,
 #          event_localization/councillor_task_events/councillor_spouse_events/councillor_spouse_stewardship_events_l_english.yml,
 #          event_localization/court_events/hold_court_events_claudia_l_english.yml,
 #          event_localization/lifestyle/wanderer/journey_l_english.yml,
 #          event_localization/schemes/learn_language/learn_language_outcome_events_l_english.yml,
 #          event_localization/yearly_events/bp1_james_yearly_events_l_english.yml
 # Replaces: "serf/serfs" → "bonded worker/workers",
 #            "peasant" → "commoner" (where also paired with serf).
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Stewardship Duty: Serf Refugees Chain ────────────────────────────────────

 # "Serf Refugees" — event title
 stewardship_duty.1071.t:0 "Bonded Worker Refugees"

 # "An influx of serfs has arrived" + "still in bondage" + "actually [origin]'s serfs"
 stewardship_duty.1071.desc:0 "An influx of bonded workers has arrived in the [target_county.GetName] from the neighboring [origin_county.GetName]. They claim to be fleeing from the abusive rule of [origin_county_owner.Custom2('MyCharacterIntroduction', ROOT.Char)], and that they wish to live in my domain instead of [origin_county_owner.GetHerHis].\n\nLegally speaking they are still in bondage to [origin_county_owner.GetFirstName], but if I let them settle in my lands it would be almost impossible for [origin_county_owner.GetHerHim] to prove that they are actually [origin_county_owner.GetHerHis] bonded workers."

 # "Graciously return the serfs"
 stewardship_duty.1071.a:0 "Graciously return the bonded workers to [origin_county_owner.GetFirstNameNoTooltip]."

 # "Return the serfs, but give a stern rebuke"
 stewardship_duty.1071.b:0 "Return the bonded workers, but give [origin_county_owner.GetFirstNameNoTooltip] a stern rebuke."

 # "Show #EMP my#! serfs to their new farms"
 stewardship_duty.1071.c:0 "Show #EMP my#! bonded workers to their new farms..."

 # "I know you have stolen my serfs from me"
 stewardship_duty.1072.desc.rival:0 "I know you have stolen my bonded workers from me. I may not have any way of recovering them, but do not think I will forget this offense. You have earned my enmity — I hope it was worth it."

 # "Why would you steal my serfs from me!?"
 stewardship_duty.1072.desc.relationship:0 "Why would you steal my bonded workers from me!? I am shocked and deeply hurt that you would betray me so... I do not know if I can ever view you the same way after this."

 # "resettled my serfs in your lands" + "no serfs to work my fields"
 stewardship_duty.1072.desc.vassal:0 "I know you have resettled my bonded workers in your lands. Why would you do that to your own vassal? Have I not been dutiful in paying you the taxes you are owed?\n\nWith no bonded workers to work my fields, I cannot grow any crops. You might as well have just stolen the land itself! This is an offense I will not soon forget."

 # "resettled my serfs in your lands"
 stewardship_duty.1072.desc.subvassal:0 "I know you have resettled my bonded workers in your lands. Such an act subverts the very fabric of our society!\n\nThough I can do nothing about this now, rest assured that [origin_county_owner_liege.GetTitledFirstName] will know why I have fewer taxes for [origin_county_owner_liege.GetHerHim] this year."

 # "Those were your serfs? My apologies"
 stewardship_duty.1072.a:0 "Those were your bonded workers? My apologies, I will return them."

 # ── Stewardship Domain Events ────────────────────────────────────────────────

 # "when I have serfs?"
 stewardship_domain.6011.c:0 "Why would I need their help, when I have bonded workers?"

 # "every acre, serf, and head of livestock"
 stewardship_domain_special.1500.a:0 "I will know every acre, bonded worker, and head of livestock."

 # ── Culture: Manorialism Innovation ──────────────────────────────────────────

 # "may enter our service as bound serfs instead"
 innovation_manorialism_desc:0 "With land ownership consolidated under our elite, many men and women find themselves unable to work. We will establish a manor system where free men can work our fields in exchange for rent, while those who cannot pay may enter our service as bonded workers instead."

 # ── EP3: Governor Prophecy Event ─────────────────────────────────────────────

 # "Pushing through awed and bemused serfs"
 governor_contract_event.2091.desc:0 "\"#EMP THE END IS NIGH! REPENT! REPENT NOW OR BE SMITED!#!\"\n\nWhen I arrive in [ongoing_destination.GetName], I easily find the prophet. Pushing through awed and bemused bonded workers, I trace the sound of screeching to its source.\n\nA [prophet.GetWomanMan] in rags berates the uneasy and terrified crowd with divinely-inspired ire. [prophet.GetNamePossessive] words make real their suspicions of the unknown; [prophet.GetSheHe] speaks to their fear of chaos, their dread of [prophet.GetFaith.NegativeAfterLife], and our common belief in the end of all things."

 # ── FP1: Major Decisions — Kingdom of the Isles ──────────────────────────────

 # "lowliest peasant in the British Isles" + "lowly serf alike"
 fp1_major_decisions.0023.desc:0 "Even the lowliest commoner in the British Isles has heard of the monstrous [founder.GetFirstName], Scourge of the Seas, and [founder.GetHerHis] life-long quest to win recognition for [founder.GetHerHis] dream realm of reaving pirates.\n\nIt's a legend that strikes fear into lordling and lowly bonded worker alike, but it seems the line between myth and history has blurred of late.\n\nAs of today #EMP [founder.GetTitleAsNameNoTooltip]#! [founder.GetFirstNameNoTooltip] announced [founder.GetHerHis] life's work to be completed.\n\nBritannia counts a new kingdom on its shores, and it is terrible to behold."

 # ── Councillor Spouse: Stewardship ───────────────────────────────────────────

 # "Serfs Mollified" — event option label
 councillor_spouse_stewardship.1011.desc.serfs:0 "Bonded Workers Mollified"

 # ── Hold Court: Claudia Events ────────────────────────────────────────────────

 # "make good serfs out of them"
 hold_court.6210.desc:1 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], I regret to inform you that I am at the end of my tether!\" [6210_vassal.Custom2('MyCharacterIntroduction', ROOT.Char)] is clearly exasperated.\n\n\"The people over which I should rule are beyond my understanding, with ridiculous customs and a #EMP terrible#! taste for food! All my efforts so far have been in vain — it just seems impossible to make good bonded workers of them.\n\n\"I am afraid a strong intervention from above is the only solution available now.\""

 # ── Journey Events ────────────────────────────────────────────────────────────

 # "sit down with peasants and serfs!"
 journey_events.50.b.tt:0 "What was wrong with me? Of course I am not going to sit down with commoners and bonded workers!"

 # "popular among their peasants and serfs"
 journey_pauper_king_modifier_desc:0 "Supposedly particularly popular among their commoners and bonded workers due to the many stories of their friendly and personal interactions with those of the lower classes."

 # ── Learn Language Outcome ────────────────────────────────────────────────────

 # "write like an unlettered, blind serf"
 learn_language_outcome.2000.desc:0 "After lots of hard work... nothing! It is #EMP impossible#! to learn the [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] language. No matter how hard I try, I speak like a barely-weaned babe and write like an unlettered, blind bonded worker who's missing most of their fingers!\n\nBah! This was a waste of time..."

 # ── Exploitative Lord Modifier ────────────────────────────────────────────────

 # "exploits even the most desperately poor serfs"
 exploitative_lord_modifier_desc:0 "This character exploits even the most desperately poor bonded workers, if there is coin to be had."
