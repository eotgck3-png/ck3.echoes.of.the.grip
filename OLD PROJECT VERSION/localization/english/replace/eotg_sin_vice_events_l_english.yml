l_english:
 # ── Sin, Vice & Sinner — EotG Setting Overrides ───────────────────────────────
 # Sources: custom_localization/tgp_custom_loc_l_english.yml,
 #          custom_localization/character_descriptions_l_english.yml,
 #          custom_localization/divinity_custom_loc_l_english.yml,
 #          activities/coronation_activity_l_english.yml,
 #          destiny_values_l_english.yml,
 #          diarchies/diarchies_l_english.yml,
 #          artifacts/artifacts_l_english.yml,
 #          artifacts/court_artifacts_l_english.yml,
 #          contracts/task_contracts_l_english.yml,
 #          dlc/ce1/ce1_modifiers_l_english.yml,
 #          dlc/ce1/ce1_legend_spread_events_l_english.yml,
 #          dlc/ep1/dlc_ep1_fund_inspiration_events_l_english.yml,
 #          dlc/bp1/dlc_bp1_yearly_events_nick_l_english.yml,
 #          dlc/bp2/dlc_bp2_yearly_0_5_l_english.yml,
 #          dlc/ach/dlc_ach_coronation_events_6_l_english.yml,
 #          dlc/ach/dlc_ach_coronation_prelude_events_l_english.yml
 # Replaces: "sin/sins" → "failing/failings",
 #            "sinful" → "wicked",
 #            "sinner/sinners" → "transgressor/transgressors".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── TGP Custom Loc Concepts ───────────────────────────────────────────────────

 # sin_concept / sinful_concept — drive [Custom('sin_concept')] calls in TGP text
 sin_concept:0 "failing"
 sin_concept_plural:0 "failings"
 sinful_concept:0 "wicked"

 # ── Character Descriptions ────────────────────────────────────────────────────

 # "disgusting sinner" — deviant trait description
 crime_deviant_desc:0 "wicked transgressor"

 # ── Divinity Custom Loc ───────────────────────────────────────────────────────

 # "will surely suffer in [NegativeAfterLife] for [her/his] sins"
 character_afterlife_negative:0 "will surely suffer in [ROOT.Char.GetFaith.NegativeAfterLife] for [ROOT.Char.GetHerHis] failings"

 # ── Destiny Values ────────────────────────────────────────────────────────────

 # "Has Three Sins"
 three_sins_desc:0 "Has Three Failings"

 # "Has Sinful Traits"
 sinful_traits_difficulty:0 "Has Wicked Traits"

 # ── Coronation Activity ───────────────────────────────────────────────────────

 # "I swear an oath to repent for my sins."
 coronation_events.0100.repent_flavor:0 "I swear an oath to repent for my failings."

 # "repent for my sins, and shed the weight of my wrongdoing"
 repent_oath_decision_desc:0 "I have sworn to repent for my failings, and shed the weight of my wrongdoing: a burden to my heart, and to the realm. $repent_oath_decision_desc_extra$"

 # ── ACH Coronation Events 6 ───────────────────────────────────────────────────

 # "#weak [piety|E] harmed by Sinful, Shunned or Criminal [traits|E]"
 coronation_piety_harmed_by_sinful_traits:0 "#weak [piety|E] harmed by Wicked, Shunned or Criminal [traits|E]#!"

 # "do you repent your manifold sins?"
 coronation_events.6120.desc_low_clergy:0 "I am held in contempt by these petty despots, who deliver their sacred request as a belittling insult.\n\n\"Servant of [ROOT.Char.GetFaith.HighGodName], do you repent your manifold failings? Do you pledge your mortal whims to preserving [ROOT.Char.GetFaith.HighGodNamePossessive] beloved [host.GetFaith.AltPriestTermPlural]?\""

 # "the repenting of [host.GetHerHis] sins"
 coronation_events.6123.desc_low_clergy:0 "Sanctimonious chins held high, they force the [host.GetTitleAsNameNoTooltip|l] to not only swear [host.GetHerHis] safeguarding of the [host.GetFaith.GetAdherentName] faithful, but the repenting of [host.GetHerHis] failings."

 # ── ACH Coronation Prelude Events ────────────────────────────────────────────

 # "no sinner free, no secret truly veiled"
 prelude_events.0070.desc.intrigue:0 "\"It has been said that no lover is safe, no transgressor free, no secret truly veiled, as long as you are around."

 # ── Diarchies: Extravagance ───────────────────────────────────────────────────

 # "far from the sins of normal life"
 viz_extravagance.t1.charity.monastery:0 "This character funds the upkeep (and paid for the creation of) an isolated religious community, far from the failings of normal life."

 # ── Artifacts ─────────────────────────────────────────────────────────────────

 # "unleash a single sin upon the world"
 tiny_box_trinket_description:0 "A tiny but mysterious box. Perhaps it will unleash a single failing upon the world when opened. Crafted by [inspiration_owner.GetTitledFirstNameNoTooltip]."

 # "push even the most stalwart sinner to repentance"
 artifact_pedestal_crucifix_description:0 "A wooden crucifix of exquisite workmanship — the doleful expression on Christ's face can push even the most stalwart transgressor to repentance."

 # ── CE1: Modifiers ────────────────────────────────────────────────────────────

 # "shamed for their sin, and that demand was refused"
 refused_to_repent_desc:0 "The locals of this county recently demanded that a noble be publicly shamed for their failing, and that demand was refused."

 # "The supposedly sinful ways of this character"
 legend_wicked_ways_desc:0 "The supposedly wicked ways of this character has led to some difficulty in spreading positive word of their deeds."

 # "The sinful ways of this character have been buried deep"
 legend_errors_exonerated_desc:0 "The wicked ways of this character have been buried deep due to support from their peers."

 # ── CE1: Legend Spread Events ─────────────────────────────────────────────────

 # "about the sinful, [SinfulTrait] ways of [promoted_legend_owner]"
 legend_spread_events.5330.desc:0 "A good tale should surely be pushed by a good person, no? Yet word keeps reaching me about the wicked, [promoted_legend_owner.Custom('SinfulTrait')|l] ways of [promoted_legend_owner.GetFirstName], the [promoted_legend_owner.GetWomanMan] who so continually hawks [promoted_legend.GetName].\n\nI could distance myself from a character of such ill-repute, but being associated with such a famous tale does do me some good of its own..."

 # "A Sinful Ancestor" — event title
 legend_spread_events.8040.t:0 "A Wicked Ancestor"

 # "the vile sinner [ancestor.GetName]" + "a sinner if ever there was one"
 legend_spread_events.8040.desc:0 "\"You would claim descent from the vile transgressor [ancestor.GetName]?\" [challenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] greets me this morning with an outstretched finger and a rabid look in [challenger.GetHerHis] eyes. \"Blasphemy! [ancestor.GetSheHe|U] was a wicked [ancestor.GetWomanMan] of unholy vices. [ancestor.GetSheHe|U] was not [virtue_trait.GetName(ancestor)] as we've all been lead to believe, [ancestor.GetSheHe] was [sin_trait.GetName(ancestor)], a transgressor if ever there was one!\"\n\nAlong with the conviction in [challenger.GetHerHis] voice, [challenger.GetSheHe] has brought numerous records and written anecdotes of [ancestor.GetNamePossessiveNoTooltip] impious behavior which does not make my claims to [ancestor.GetHerHis] lineage look good..."

 # ── EP1: Fund Inspiration — Zealous Temptation ───────────────────────────────

 # "I cannot give in to these sinful temptations"
 fund_inspiration.2120.desc.me_zealous_homosexuality:0 "This is wrong, by [ROOT.Char.GetFaith.HighGodName], I cannot give in to these wicked temptations..."

 # "Adultery is a sin! This is the temptation of [DevilName]!"
 fund_inspiration.2120.desc.me_zealous_adultery:0 "No, the [ROOT.Char.GetFaith.ReligiousText] is clear! Adultery is a transgression! This is the temptation of [ROOT.Char.GetFaith.DevilName]!"

 # ── BP1: Yearly Events Nick ───────────────────────────────────────────────────

 # "Sins of the [relation]" — event titles
 bp1_yearly.5706.t:0 "Failings of the [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))|U]"
 bp1_yearly.5707.t:0 "Failings of the [SCOPE.sC('rival_child').Custom2('RelationToMeShort', SCOPE.sC('rival_parent'))|U]: In Flagrante"

 # ── BP2: Yearly Events — Regent's Accusations ────────────────────────────────

 # "all the awful little sins [rival_successor] stands accused of"
 bp2_yearly.0631.desc.intro.positive:0 "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has generally proved a loyal [ROOT.Char.GetDiarchTitle], [regent.GetHerHis] advice always trying to keep my best interests at heart.\n\nIt's thus somewhat serious and very worrying when [regent.GetSheHe] tells me of all the awful little failings [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] stands accused of.\n\n"
 bp2_yearly.0631.desc.intro.negative:0 "[regent.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has a... mixed record as my [ROOT.Char.GetDiarchTitle]. [regent.GetSheHe|U] should be my shield and protector, but [regent.GetSheHe] seems more taken with enriching [regent.GetHerselfHimself].\n\nI'm thus unsurprisingly dubious when [regent.GetSheHe] tells me of all the awful little failings [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] stands accused of.\n\n"
 bp2_yearly.0631.desc.intro.vague:0 "[regent.Custom2('MyCharacterIntroductionPossessive', ROOT.Char)|U] service as my [ROOT.Char.GetDiarchTitle] hasn't been everything [regent.GetSheHe] promised it would be; sometimes [regent.GetSheHe] helps me, but just as often [regent.GetSheHe] seems to look out for herself alone.\n\nI'm thus very unsure when [regent.GetSheHe] tells me of all the awful little failings [rival_successor.Custom2('MyCharacterIntroduction', ROOT.Char)] stands accused of.\n\n"

 # "looking for more opportunities for sin and vice"
 bp2_yearly.0631.desc.rationale.criminality:0 "\"... [rival_successor.GetSheHe]'s a known criminal, [ROOT.Char.GetFirstNameNoTooltip], a criminal doubtless looking for more opportunities for vice and transgression. The power afforded [rival_successor.GetHerHim] were [rival_successor.GetSheHe] to become [ROOT.Char.GetDiarchTitle]...\""

 # "want [rival's] sins imprinting on your frail young heart"
 bp2_yearly.0631.desc.rationale.sins:0 "\"... I cannot countenance sharing a table with the [rival_successor.GetWomanMan], no good [regent.GetFaith.GetAdherentName] could — and you shouldn't either [ROOT.Char.GetFirstNameNoTooltip], not unless you want [rival_successor.GetHerHis] failings imprinting on your frail young heart\"."

 # ── EP3 Contracts: Assassination ─────────────────────────────────────────────

 # "The cold light of day washes my sins nearly clean"
 ep3_contract_event.0565.desc.critsuccess:0 "The dispatching of [councillor.GetTitledFirstName] is brutally swift; the [councillor.GetWomanMan] dies in ignominy, silenced before even [councillor.GetHerHis] companions can raise a hue and cry.\n\nThe cold light of day washes my failings nearly clean; a bath in a local stream does the rest.\n\nAn agent awaits on the bank — whether the same as before, I cannot tell — with a clutch of heavy sacks.\n\n\"The [task_contract_employer.GetTitleAsNameNoTooltip] thanks you for your work. [task_contract_employer.GetSheHe|U] has included a further gift as a sign of [task_contract_employer.GetHerHis] gratitude.\""
 ep3_contract_event.0565.desc.success:0 "[councillor.GetTitledFirstName] is no more. The rough act of violence is not perfectly done, but the truth is the same: I have slain my mark.\n\nThe cold light of day washes my failings nearly clean; a bath in a local stream does the rest.\n\nAn agent awaits on the bank — whether the same as before, I cannot tell — with a heavy sack hanging from [messenger.GetHerHis] saddle.\n\n\"The [task_contract_employer.GetTitleAsNameNoTooltip] thanks you for your work. Your service will be remembered.\""
