 # ── Buildings: Monastic Schools ───────────────────────────────────────────────

 # "The prayer halls host sermons and allow for a place of silent contemplation"
 building_monastic_schools_02_desc:0 "The meditation halls host addresses and allow for a place of silent contemplation."

 # ── Decisions: Abandon Crypto Faith ──────────────────────────────────────────

 # "secret sermons and whispered prayers are tiring my patience"
 abandon_crypto_faith_decision.desc:0 "#F All of these secret addresses and whispered devotions are tiring my patience. Meanwhile, I've grown comfortable with my public life in [ROOT.Char.GetFaith.GetName]. Perhaps it's time to lay my old faith to rest once and for all.#!"

 # ── Diarchies: Extravagance ───────────────────────────────────────────────────

 # "filling their festivities with sermons and wandering [PriestNeuterPlural]"
 viz_extravagance.t2.activities.sermons:0 "This character is passionately religious above and beyond what propriety calls for, and makes a point of filling their festivities with addresses and wandering [ROOT.Char.GetDiarchy.GetDiarch.GetFaith.PriestNeuterPlural]."

 # ── EP3: Hasan Events ─────────────────────────────────────────────────────────

 # "As I complete my sermon, I look out across the crowd"
 hasan_sabbah.1031.desc:0 "As I complete my address, I look out across the crowd of enlightened faces staring back at me. My mind turns to their master, [seljuk_equivalent.GetFirstName], the one who lead them away from [ROOT.Char.GetFaith.HighGodName] to begin with. While [seljuk_equivalent.GetSheHe] enjoys a decadent life, [seljuk_equivalent.GetHerHis] subjects clamor in the dirt, obscured from the truth of the almighty.\n\nI feel I can stomach this no longer, and I wish only to see [seljuk_equivalent.GetHerHis] people become free of [seljuk_equivalent.GetHerHim], united in [ROOT.Char.GetFaith.GetAdjective] philosophy!"

 # "A Rousing Sermon" — event title
 hasan_sabbah.1040.t:0 "A Rousing Address"

 # ── EP3: LAAMP Decision Events ────────────────────────────────────────────────

 # "A sermon has just concluded" + "visitors who come here for prayer and reflection"
 ep3_laamp_decision_event.1043.desc_returned_01:0 "An address has just concluded as we return to the [visiting_location.GetCounty.GetFaith.HouseOfWorship]. [laamp_clergy_character.Custom('SisterBrother')|U] [laamp_clergy_character.GetFirstName] is walking around with a broom, gently tidying up and making the holy ground neat for any visitors who come here for devotion and reflection.\n\n[laamp_clergy_character.GetSheHe|U] looks up as I approach, a soft smile creasing [laamp_clergy_character.GetHerHis] lips: \"Welcome back into [visiting_location.GetCounty.GetFaith.HighGodHerHis|U] warm embrace. Why don't you stay a while and take in the scenery?\""

 # ── FP2: Lyonese Monk Events ──────────────────────────────────────────────────

 # "[irate_theocrat]'s most recent sermon to the locals went badly"
 fp2_lyonese_monk.0231.desc:0 "The gossip around court is that [irate_theocrat.Custom2('MyCharacterIntroduction' , acolyte_host)] most recent address to the locals of [acolyte_host.GetCapitalLocation.GetTitle.GetNameNoTier] went #EMP badly#!.\n\nApparently the parishioners began throwing onions mere minutes in, escalating to turnips shortly after that, before culminating in a cabbage large enough that, when it caught [irate_theocrat.GetHerHim] in the face, the [irate_theocrat.GetWomanMan] was floored.\n\n[irate_theocrat.GetFirstNameNoTooltip] has been inconsolable since, and unable to furnish anyone with a good explanation of why [irate_theocrat.GetSheHe] suddenly raised such ire."

 # ── Health Events: Safe Treatment ────────────────────────────────────────────

 # "[DefaultPriestTitle] gave a sermon" + "an hour of silent prayer"
 health.safe_treatment.6.desc:0 "[physician.GetTitledFirstName] arranged a small ceremony in my name. Once my family and closest entourage were all gathered in the main hall, the [ROOT.Char.Custom('DefaultPriestTitle')] gave an address highlighting my virtue and benevolence. The ceremony was ended with an hour of silent devotion.\n\nReaching out to [ROOT.Char.GetFaith.HealthGodName]"

 # ── Bishop Events ─────────────────────────────────────────────────────────────

 # "making a mockery of me during [bishop]'s sermons" + "turned the peasantry against me"
 bishop.2003.desc:0 "Not a day passes by without [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] making a mockery of me during [scoped_bishop.GetHerHis] addresses.\n\nThat obsessed [scoped_bishop.Custom2('InsultNoun', ROOT.Char)] is certain that I am an agent of [ROOT.Char.GetFaith.DevilName] and will not rest until [scoped_bishop.GetSheHe] has turned the commonfolk against me."

 # "complained about... during every sermon"
 bishop.2004.desc:0 "My [scoped_bishop.GetCouncilTitle] [scoped_bishop.GetFirstName] has complained about my supposed 'lack of piety' during every address as of late.\n\nApparently [scoped_bishop.GetSheHe] has gone so far as to call me an 'impious [root_scope.Custom2('InsultNoun', SCOPE.sC('scoped_bishop'))]', and my more zealous vassals are starting to listen to [scoped_bishop.GetHerHim]..."

 # ── Travel Events ─────────────────────────────────────────────────────────────

 # "You delivered a good sermon"
 travel.good_cermon:0 "You delivered a good address"

 # "You delivered a bad sermon"
 travel.bad_cermon:0 "You delivered a bad address"

 # "attend a sermon and learn all about the [faith]"
 travel_events.4038.desc:0 "In the [ROOT.Char.GetFaith.GetAdjective] faith, we observe our own rituals and our own beliefs, but we still hold [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetReligion.GetName] above all other religions and express a kinship for their beliefs.\n\nIt is quite common for [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] to practice [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetReligion.GetNameNoTooltip] in conjunction with traditional [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] worship, and now that I am here in [ROOT.Char.GetCurrentLocation.GetCounty.GetName] I have an opportunity to attend an address and learn all about the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] faith."

 # ── Succession Event Window ───────────────────────────────────────────────────

 # "immortalized in the sermons of all [PriestMalePlural]"
 SUCCESSION_EVENT_WINDOW_DEAD_OUTRO_ACCOMPLISHMENT_SAOSHYANT:0 "The sacred restorer of the Persian Empire, [ROOT.Char.GetHerHis] rise to glory will be immortalized in the addresses of all [ROOT.Char.GetFaith.PriestMalePlural]. Surely, [ROOT.Char.GetSheHe] sits next to [ROOT.Char.GetFaith.HighGodName] now."

 # ── Diarch Interactions ───────────────────────────────────────────────────────

 # "A sermon will be dedicated to [recipient.GetHerHis] efforts"
 diarchy_ending_gift_piety_desc:0 "An address will be dedicated to [recipient.GetHerHis] efforts"

 # ── Relationship Reasons ──────────────────────────────────────────────────────

 # "delivered a fiery religious sermon that left a lasting impression"
 friend_child_sermon:0 "While [CHARACTER.GetShortUIName] were a child, [TARGET_CHARACTER.GetShortUIName] delivered a fiery religious address that left a lasting impression."
 friend_child_sermon_corresponding:0 "While [TARGET_CHARACTER.GetShortUIName] were a child, [CHARACTER.GetShortUIName] delivered a fiery religious address that left a lasting impression."
