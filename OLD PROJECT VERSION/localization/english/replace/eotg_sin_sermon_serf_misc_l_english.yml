 # ── Hold Court: Burgher Mayor Events ─────────────────────────────────────────

 # "grows rich by our burghers' dealings with"
 hold_court.8080.desc.intro:0 "[mayor.GetTitledFirstName] comes forward, proceeding with marked caution. \n\n\"Your grace, my [mayor.GetPrimaryTitle.GetTierAsNameNoTooltip] of [mayor.GetPrimaryTitle.GetNameNoTier] grows rich by our contractors' dealings with"

 # "It seems the burghers forget their place."
 hold_court.8080.e:0 "It seems the contractors forget their place."

 # "Spurned Burghers" — county modifier name
 hold_court_8080_upset_modifier:0 "Spurned Contractors"

 # ── Harm Events: Burgher Pot ──────────────────────────────────────────────────

 # "A burgher's pot catches you on the temple"
 harm.0591.a.tt.failure:0 "A contractor's pot catches you on the temple"

 # "some burgher or other throwing a clay pot"
 harm.0592.desc:0 "Riding through the streets of [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitly], having dealt with some trivial errand in the town, my entourage and I hear a loud crash.\n\nA little investigation shows it was some contractor or other throwing a clay pot from their window, uncaring of whether it might hit someone below.\n\nCallous, yes, but what can you expect?\n\nAt any rate, it's hardly something worth much further thought."

 # ── Middle Europe Decisions: Parliament of Burghers ───────────────────────────

 # "the Burghers to form a new Parliament"
 middle_europe_decisions.0011.desc:0 "[scoped_ruler.GetTitledFirstName] has appointed representatives from the Nobility, the Clergy, and the Contractors to form a new Parliament in the Kingdom of Sicily.\n\nThis advisory body will help the [scoped_ruler.GetTitleTierName] and [scoped_ruler.GetHerHis] successors to govern wisely and efficiently, for the benefit of all their subjects."

 # ── Childhood Personality: Sermon Events ─────────────────────────────────────

 # "The Sermon" — event title
 child_personality.7010.t:0 "The Address"

 # "[sermon_priest]'s sermon" + "As the sermon ends"
 child_personality.7010.desc:0 "\"Listen to my words, children. Today I will tell you about [ROOT.Char.GetFaith.HighGodName], [ROOT.Char.GetFaith.PositiveAfterLife], [ROOT.Char.GetFaith.NegativeAfterLife], and even #EMP [ROOT.Char.GetFaith.DevilName]#! [ROOT.Char.GetFaith.DevilHerselfHimself]!\" [sermon_priest.GetFirstName] exclaims, fervor burning in [sermon_priest.GetHerHis] eyes.\n\nMe and the other children are spellbound by [sermon_priest.GetFirstNamePossessiveNoTooltip] address, who knew that the [ROOT.Char.GetFaith.ReligiousText] could be this #EMP fascinating!#!\n\nAs the address ends, I have to tell [sermon_priest.GetFirstNameNoTooltip] my thoughts."

 # "held a fiery sermon for of all the children"
 child_personality.7011.desc:0 "Today [sermon_priest.GetFirstName] held a fiery address for of all the children of the court, they were apparently spellbound as he zealously read from the [sermon_priest.GetFaith.ReligiousText].\n\nMy [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('child'))] [child.GetFirstName] "

 # ── Festival & Coronation: Sermon ─────────────────────────────────────────────

 # "attempting to divert my festival's joyous energy into a sermon"
 festival.005.desc:0 "As the festival approaches its climax, my [target.chaplain.Custom('MyPriestTitle')] takes to the stage, [target_chaplain.GetHerHis] voice booming above the crowd. [target_chaplain.GetSheHe|U] begins to extol moral reform and spiritual discipline, attempting to divert my festival's joyous energy into an address. Some find [target_chaplain.GetHerHis] words inspiring, while others grumble that the festival is no place for such solemnity."

 # "[hof.GetHerHis] famously fiery sermons"
 ach_coronation.0010.desc.desc_second.zealous:0 "[hof.GetHerHis] famously fiery addresses and exceptional zeal."

 # ── Court: Preaching Tour Sermons ─────────────────────────────────────────────

 # "I cannot give a sermon without a latrine dug underneath me"
 court.4300.preaching_tour_bernard_of_clairvaux_standard:0 "\"I have a grave favor to ask. While [ROOT.GetCharacter.GetFaith.HighGodName] has blessed my mind, [ROOT.GetCharacter.GetFaith.HighGodNameSheHe] has not blessed my bowels. As my continence stands, I cannot give an address without a latrine dug underneath me. Is there anyone who would follow my tour as a Christly pit-digger?\""

 # "delivering sermons to bolster recruitment and funds"
 court.4300.preaching_tour_default:0 "A priest has been blockading the entrance to your throne room, handing out red badges in the shape of crosses for those walking in to affix to their clothing.\n\n\"Thanks to [ROOT.GetCharacter.GetFaith.HighGodName]! I am on a preaching tour through the realms of our pledged allies in the holy war, delivering addresses to bolster recruitment and funds.\""

 # ── Pilgrimage: Sermon ────────────────────────────────────────────────────────

 # "giving a sermon about perseverance in the face of adversity"
 pilgrimage.3001.desc:0 "Even when on pilgrimage, the priests still hold Mass every Sunday. It is held out in the open when no church is nearby, but early this morning, a storm rolled in and has not ceased.\n\nUndeterred, a zealous [ROOT.Char.Custom('DefaultPriestTitle')] is standing out in the pouring rain, giving an address about perseverance in the face of adversity. Despite this, the size of [zealous_priest.GetHerHis] audience is rapidly dwindling as discouraged adherents seek refuge from the torrential rain."

 # ── Pilgrimage: Sin ───────────────────────────────────────────────────────────

 # "do you also wish to absolve your sins?"
 pilgrimage.6810.desc:0 "\"...now you can go, child.\" I hear [bishop_pilgrim.GetTitledFirstName] mutter when I enter the [ROOT.Char.GetFaith.HouseOfWorship]. The pilgrim bows before leaving and I can see the priest's hand glisten with gold.\n\n\"Ah, dear [ROOT.Char.GetTitleAsNameNoTooltip], do you also wish to absolve your failings? [religious_head_scope.GetTitledFirstName] has issued order to grant indulgences to any pilgrims visiting [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] — for the right price, that is.\""

 # ── Pilgrimage: Log Keys ──────────────────────────────────────────────────────

 # "[CHARACTER] repented [CHARACTER.GetHerHis] sinful behavior"
 pilgrimage_repented_log:0 "[CHARACTER.GetShortUIName|U] repented [CHARACTER.GetHerHis] wicked behavior"

 # "Abandon Sin" — log title
 pilgrimage_changed_ways_log_title:0 "Abandon Vice"

 # "[CHARACTER] abandoned [CHARACTER.GetHerHis] sinful ways"
 pilgrimage_changed_ways_log:0 "[CHARACTER.GetShortUIName|U] abandoned [CHARACTER.GetHerHis] wicked ways"

 # "Exorcised" — log title
 pilgrimage_exorcism_log_title:0 "Banished"

 # "Villains Exorcised" — event option title
 pilgrimage.6532.c_success.t:0 "Villains Driven Out"

 # ── Tour Travel: Serf ─────────────────────────────────────────────────────────

 # "A Serf and [angry_peasant.GetHerHis] [ROOT.Char.GetTitleAsNameNoTooltip]" — event title
 tour_travel.1001.title:1 "A Bonded Worker and [angry_peasant.GetHerHis|U] [ROOT.Char.GetTitleAsNameNoTooltip|U]"

 # "countless serfs begging to be blessed with the royal touch"
 tour_travel.1005.desc:0 "Word of my arrival seems to have spread to [county_to_bless_scope.GetName], as our entourage is soon beset with countless bonded workers begging to be blessed with the royal touch.\n\nI could of course simply sprinkle a little water blessed by myself upon them, and they would surely be satisfied, but granting them blessed coins to soothe their infected areas would keep them happy and blessed for much longer."

 # ── Tour Travel: Sin ──────────────────────────────────────────────────────────

 # "These fiends put their sins at other's feet!"
 tour_travel.3030.pinned:1 "These fiends put their failings at other's feet!\""

 # "The Den of Sin" — event title
 tour_travel.9030.t:0 "The Den of Vice"

 # "a wonderful den of sin just a few minutes away"
 tour_travel.9030.desc.outro:0 "\n\n\"By [drunky_entourage.GetFaith.HighGodName]! There is a wonderful den of vice just a few minutes away, my [ROOT.Char.GetTitleAsNameNoTooltip|U]. We must stay here a while and make ourselves stupid with merriment!\""

 # ── Tournament: Sin ───────────────────────────────────────────────────────────

 # "This tournament is a vehicle of sin"
 tournament_events.1200.desc:0 "While nobles and commoners excitedly prepare for the contests and entertainment ahead, [angry_clergy.GetTitledFirstName] makes plain the disapproval of the [angry_clergy.GetFaith.AltPriestTermPlural].\n\n\"This tournament is a vehicle of transgression; good [angry_clergy.GetFaith.GetAdherentNamePluralNoTooltip] will die in pursuit of pride; shed each other's blood for trinkets; forgo [angry_clergy.GetFaith.PositiveAfterLife] for fame.\"\n\n\"These inclinations should be harnessed, turned against [angry_clergy.GetFaith.HighGodNamePossessive] enemies, not fanned and doused in vainglory.\""

 # ── Cultural Festival: Sin & Humors ──────────────────────────────────────────

 # "balance the humors of even the weakest [woman/man]"
 cultural_festival.2080.desc:0 "As I promenade around the festival I notice a hooded figure, selling flasks whose liquid cannot be told.\n\n\"Come and buy my medicines, [ROOT.Char.Custom('FormOfAddressForLiege')], for they work miracles and balance the constitution of even the weakest [ROOT.Char.GetWomanMan].\"\n\nAs I look at the flaskets I observe that one of them shines vermillion, as if it was made of the finest cinnabar. The other is bright green, as if someone had soaked copper plates in fresh wine."

 # "a sinner is the priest" + "[sinful_jester] sinful ways"
 cultural_festival.3070.desc:0 "An idea comes to me like a snapped branch after hearing the bells toll: a Feast of Fools! A world upside down where a transgressor is the priest and we all delight and revel for days!\n\nAh, but who to make my [ROOT.Char.GetFaith.BishopNeuter|U] of Fools...? [rival_jester.GetTitledFirstName]? I never liked [rival_jester.GetHerHim] a bit. Or perhaps [sinful_jester.GetTitledFirstName], [sinful_jester.GetHerHis] wicked ways are well known by everyone."

 # ── Petition Liege: Sin ───────────────────────────────────────────────────────

 # "the sinful multitudes the light of [faith]"
 petition_liege.0201.desc.county_convert:0 "\n\nI fervently explain the situation in my fiefdom, and the need for support in order to bring the wayward multitudes the light of [petition_liege.GetFaith.GetNameNoTooltip]."

 # ── BP1 Yearly: Serf ──────────────────────────────────────────────────────────

 # "Poor Unfortunate Serfs" — event title
 bp1_yearly.9027.t:0 "Poor Unfortunate Folk"

 # ── Feast Laurence: Bloodletting ─────────────────────────────────────────────

 # "You betray my hospitality with bloodletting!"
 feast_default_laurence.102.b:0 "You betray my hospitality with phlebotomy!"

 # ── Intrigue Scheme: Humors ───────────────────────────────────────────────────

 # "afflict whoever touches it with weakness and ill humors"
 intrigue_scheme_ongoing.5005.desc:0 "My [spymaster.GetCouncilTitle], [spymaster.GetTitledFirstName], approaches me with a wicked grin.\n\n\"[ROOT.Char.Custom('FormOfAddressForLiege')|U], this pouch contains a powder most nefarious. If sprinkled on top of something — say a gift for [target.GetTitledFirstName] – it leaves no trace but will afflict whoever touches it with weakness and ill constitution.\""

 # ── Spymaster: Sin ────────────────────────────────────────────────────────────

 # "[secret_holder.GetFaith.GetAdherentNamePlural] consider this a grave sin"
 spymaster_task.0311.sodomy.accepted:1 "\n\n[secret_holder.GetSheHe|U] enjoys the intimate company of other [secret_holder.GetWomenMen]. [secret_holder.GetHerHis|U] fellow [secret_holder.GetFaith.GetAdherentNamePlural] consider this a grave failing, and while that makes little sense, it could give me the leverage I need..."

 # "such a sin against [HighGodName]"
 spymaster_task.0311.secret_sodomy.illegal:0 "\n\n[secret_holder.GetSheHe|U] has been enjoying the intimate company of other [secret_holder.GetWomenMen]. The foolishness of thinking that such a transgression against [ROOT.Char.GetFaith.HighGodName] would go unnoticed..."

 # "committed a sin most foul"
 spymaster_task.0311.secret_incest:0 "\n\n[secret_holder.GetSheHe|U] has committed a transgression most foul, a crime against [ROOT.Char.GetFaith.HighGodName] [ROOT.Char.GetFaith.HighGodHerselfHimself]! Only someone truly sick would engage in carnal relations with their close family."
