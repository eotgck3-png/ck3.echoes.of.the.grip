 # ── Prayer, Devotion & Buildings — EotG Setting Overrides ────────────────────
 # Sources: activities/pilgrimage_activity_l_english.yml,
 #          activities/roaming_activity_l_english.yml,
 #          artifacts/court_artifacts_l_english.yml,
 #          buildings_l_english.yml,
 #          custom_localization/divinity_custom_loc_l_english.yml,
 #          custom_localization/personality_quirks_l_english.yml,
 #          custom_localization/tgp_custom_loc_l_english.yml,
 #          dlc/ach/dlc_ach_coronation_events_6_l_english.yml
 # Replaces: "prayer/prayers/pray" → "devotion/observances/offer devotion",
 #            "Prayer Halls" → "Meditation Halls",
 #            "peasant" → "commoner" (in TGP pray_for_love key).
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Pilgrimage Activity Log ───────────────────────────────────────────────────

 # "[first.GetShortUIName|U] Spent Time in Solitary Prayer"
 apa_prayer_title:0 "[first.GetShortUIName|U] Spent Time in Solitary Devotion"

 # "[first.GetShortUIName|U] lead communal prayer"
 apa_communal_prayer_title:0 "[first.GetShortUIName|U] led communal devotion"

 # ── Roaming Activity ──────────────────────────────────────────────────────────

 # "[host] offered up a small prayer to the dead"
 roaming_battlefield_prayer_key:0 "In [activity.GetCurrentPhase.GetLocation.GetNameNoTooltip] [host.GetShortUIName] found a forgotten battlefield, where [host.GetSheHe] paid a small observance to the dead."

 # "Offer up some prayers." — option text
 bp3_roaming.0250.a:0 "Offer up some observances."

 # ── Artifacts: Book of Prayers ────────────────────────────────────────────────

 # "Prayers for the [faith] [faithful]" — artifact name
 feature_book_title_learning_prayers:0 "Observances for the [Artifact.GetOwner.GetFaith.GetAdjective]"

 # "An imposing book of prayers for the [faith] faithful"
 feature_book_topic_learning_prayers:0 "An imposing book of observances for the [Artifact.GetOwner.GetFaith.GetAdjective] faithful, [Artifact.GetOwner.Custom('ArtifactAdverbWealth')] illustrated."

 # ── Divinity Custom Loc ───────────────────────────────────────────────────────

 # "prayer" — rite label
 rite_prayer:0 "devotion"

 # ── Personality Quirks ────────────────────────────────────────────────────────

 # "[character] quietly offers a prayer to [HighGodName]"
 zealous_neg_quirk_standalone:0 "[ROOT.GetCharacter.GetSheHe|U] quietly offers devotion to [ROOT.GetCharacter.GetFaith.HighGodName]"

 # "offering a prayer to [HighGodName]"
 zealous_neg_quirk_personal_pp:0 "offering devotion to [ROOT.GetCharacter.GetFaith.HighGodName]"

 # ── TGP Custom Loc: Pray For ──────────────────────────────────────────────────

 # "I must pray for rain to turn my family's fortune around"
 pray_for_rain:0 "\"I must appeal for rain to turn my family's fortune around,\" a hungry farmer tells me."

 # "I must pray for my mother's health to improve"
 pray_for_health:0 "\"I must appeal for my mother's health to improve,\" a lowborn tells me."

 # "I overhear a peasant saying... is it so wrong to pray for someone to love me"
 pray_for_love:0 "I overhear a commoner saying, \"It is selfish, I know, but is it so wrong to hope for someone to love me? I am getting old and I need to get married!\""

 # ── Buildings ─────────────────────────────────────────────────────────────────

 # "always plenty of room for the faithful to pray"
 building_temple_03_desc:0 "While the temple can take in a lot of worshipers, that is not its only purpose — it also has to house the clergy, support a large library and protect relics. With the addition of the house of worship there's always plenty of room for the faithful to offer devotion."

 # "citizens are mandated to... pray in the local shrines"
 building_temple_citadel_03_desc:0 "Additional buildings are provided for comfort and efficiency; this place of worship is prepared for most eventualities. Its citizens are mandated to keep watch on the walls as well as offer devotion in the local shrines."

 # "A humble place of quiet worship for the devout to pray and contemplate"
 building_monastic_schools_01_desc:0 "A humble place of quiet worship for the devout to meditate and contemplate."

 # "Prayer Halls" — building name
 building_monastic_schools_02:0 "Meditation Halls"

 # "prayer halls to venerate the dead" — burial site
 building_burial_site_03_desc:0 "The mausoleum has been expanded into a towering monument of the dead. The interior is filled with graves and meditation halls to venerate the dead."

 # "gives them a place to pray, rest and pay homage"
 building_type_holy_site_mosque_01_desc:0 "The [holy_site|E] in this area is a popular destination for devout pilgrims. The grand mosque gives them a place to offer devotion, rest and pay homage before continuing their journey. Its beautiful domes and great intricate spires signal the greatness of god for all to see."

 # "prayer halls, a library and a bazaar"
 building_type_imam_reza_shrine_01_desc:0 "This sanctuary houses the remains of Ali ar-Rida, celebrated by some Shiites as the eighth imam, who was martyred in this land. The ever-expanding complex includes his shrine as well as meditation halls, a library and a bazaar, growing in an eclectic but glorious fashion with the ebb and flow of pilgrims and caravans."

 # "relying only on ladders, ropes, hand-hauling, and #EMP prayers#!"
 building_meteora_02_desc:0 "As more and more hermit monks seeked refuge on the hollowed peaks of Meteora, more and more monasteries started to appear.\nMan's dominion over hostile nature here is still very feeble, though; the monasteries are extremely hard to reach, mostly relying only on ladders, ropes, hand-hauling, and #EMP hopes#!, as the fall in case of equipment's failure is lethal."

 # "a place to worship and pray to the ruling Devaraja"
 building_mandala_capital_01_desc:0 "A humble beginning to a grand legacy, this ornate temple is a place to worship and offer devotion to the ruling Devaraja."

 # "A little prayer can give some test-takers more confidence"
 building_examination_hall_02_desc:0 "A little devotion can give some test-takers more confidence than all the studying and preparation in the world."

 # "while prayers are being expelled"
 building_citadel_shrine_02_desc:0 "Flooded in delicate carvings, the Prang rises above in structural cascades, enhancing the offered impression of height. It is a delightful eye rest while observances are being offered, be it in uttered words or contemplative silence."

 # "allowing its worshipers to pray and pay dutiful homage"
 building_citadel_shrine_08_desc:0 "The Divine Being, frozen in time in a majestic pose, allowing its worshipers to offer devotion and pay dutiful homage in order to receive its blessings."

 # "a place of quiet meditation, prayer and recuperation"
 building_type_vihara_halls_01_desc:0 "A monastic building, built to shelter monks from the rain season, this is a place of quiet meditation, devotion and recuperation. Expanding the halls contributes to the vigor and devotion of its inhabiting religious followers."

 # "Prayer Shrine" — building name
 building_vihara_halls_01:0 "Devotion Shrine"

 # ── ACH Coronation Events 6: Coronation Rite Prayers ─────────────────────────

 # "The prayers rumble on." (christian variant — also used for _guest)
 coronation_events.6100.desc_christian:0 "The glittering [host.Custom('GetRegionalSword')] is girded to my hip. The scepter of sovereign authority — taken up in my hand. My fingers wrap round the [Glossary( 'globus cruciger', 'GLOBUS_CRUCIGER_GLOSS')]; to my body come the [Glossary( 'armills', 'ARMILLS_GLOSS')] and the [Glossary( 'pallium', 'PALLIUM_GLOSS')]. The rites rumble on."
 coronation_events.6100.desc_christian_guest:0 "The glittering [host.Custom('GetRegionalSword')] is girded to [host.GetFirstNamePossessive] hip. The scepter of sovereign authority — taken up in [host.GetHerHis] hand. [host.GetHerHis|U] fingers wrap round the [Glossary( 'globus cruciger', 'GLOBUS_CRUCIGER_GLOSS')]; to [host.GetHerHis] body come the [Glossary( 'armills', 'ARMILLS_GLOSS')] and the [Glossary( 'pallium', 'PALLIUM_GLOSS')]. The rites rumble on."

 # "cry out the final prayers"
 coronation_events.6100.desc_high:0 "The gleaming [host.Custom('GetRegionalSword')] is girded to my hip. The beauteous jewels, the glorious mantles are placed upon me. As one, the best of the [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — the [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] and [host.Custom('KnightCulturePluralNoTooltipLowercase')] of the land — cry out the final invocations, and the last: \"#EMP [host.GetFaith.HighGodName], behold our beloved [host.GetTitleAsNameNoTooltip|l]!#!\""
 coronation_events.6100.desc_high_guest:0 "The gleaming [host.Custom('GetRegionalSword')] is girded to [host.GetFirstNamePossessive] hip. The beauteous jewels, the glorious mantles are placed upon [host.GetHerHim]. As one, the cream of [host.GetHerHis] [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — the [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] and [host.Custom('KnightCulturePluralNoTooltipLowercase')] of that land — cry out the final invocations, and the last: \"#EMP [host.GetFaith.HighGodName], behold our beloved [host.GetTitleAsNameNoTooltip|l]!#!\""

 # "mutter the final prayers"
 coronation_events.6100.desc_low:0 "The old [host.Custom('GetRegionalSword')] is girded to my hip. The gaudy jewels, the worn mantles are placed upon me. Even the surly host of the [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — the [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] and [host.Custom('KnightCulturePluralNoTooltipLowercase')] of this miserable land, even they — are moved to mutter the final invocations, and give the last: \"#EMP [host.GetFaith.HighGodName], behold our [host.GetTitleAsNameNoTooltip|l]!#!\""
 coronation_events.6100.desc_low_guest:0 "The old [host.Custom('GetRegionalSword')] is girded to [host.GetFirstNamePossessive] hip. The gaudy jewels, the worn mantles are placed upon [host.GetHerHim]. Even the surly host of [host.GetHerHis] [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — the [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] and [host.Custom('KnightCulturePluralNoTooltipLowercase')] of that miserable land, even they — are moved to mutter the final invocations, and give the last: \"#EMP [host.GetFaith.HighGodName], behold our [host.GetTitleAsNameNoTooltip|l]!#!\""

 # "recite the final prayers"
 coronation_events.6100.desc_generic:0 "The gleaming [host.Custom('GetRegionalSword')] is girded to my hip. The lacy jewels, the heavy mantles are placed upon my body. As one, the nobility of the [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — the [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] and [host.Custom('KnightCulturePluralNoTooltipLowercase')] of the land — recite the final invocations, and the last: \"#EMP [host.GetFaith.HighGodName], behold our [host.GetTitleAsNameNoTooltip|l]!#!\""
 coronation_events.6100.desc_generic_guest:0 "The gleaming [host.Custom('GetRegionalSword')] is girded to [host.GetFirstNamePossessive] hip. The lacy jewels, the heavy mantles are placed upon [host.GetHerHis] body. As one, the nobility of [host.GetHerHis] [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] — the [host.Custom('GetLowOfficialPlural')], [host.GetFaith.BishopNeuterPlural] and [host.Custom('KnightCulturePluralNoTooltipLowercase')] of that land — recite the final invocations, and the last: \"#EMP [host.GetFaith.HighGodName], behold our [host.GetTitleAsNameNoTooltip|l]!#!\""

 # "The prayers of my lips mingle" + "my subjects and I pray:"
 coronation_events.6102.desc_mid:0 "The invocations of my lips mingle with the swelling chants. Together, my subjects and I cry out: \"#EMP [host.GetFaith.random_GoodGodNames], preserve this [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] under [host.GetFaith.PositiveAfterLife] always, now and forever! Unto the ages of ages! Bless, O [host.GetFaith.random_GoodGodNames], the strength of the [host.GetTitleAsNameNoTooltip]!#!\"\n\n[host.Custom('GetLowOfficialPlural')|U], [host.Custom('KnightCulturePluralNoTooltipLowercase')], [host.Custom('GetLocalCommonerTermPlural')] bow low. I take my sacred seat, the place of my power. #EMP \"Hail [host.GetFirstNameNoTooltipRegnal]!\"#! all cry out. \"#EMP By the will of [host.GetFaith.HighGodName], our [host.GetTitleAsNameNoTooltip|l]!#!\""
 coronation_events.6102.desc_mid_guest:0 "The invocations of [host.GetHerHis] lips mingle with the swelling chants. Together, [host.GetSheHe] and [host.GetHerHis] subjects cry out: \"#EMP [host.GetFaith.random_GoodGodNames], preserve this [host.GetPrimaryTitle.GetTierAsNameNoTooltip|l] under [host.GetFaith.PositiveAfterLife] always, now and forever! Unto the ages of ages! Bless, O [host.GetFaith.random_GoodGodNames], the strength of the [host.GetTitleAsName]!#!\"\n\n[host.Custom('GetLowOfficialPlural')|U], [host.Custom('KnightCulturePluralNoTooltipLowercase')], [host.Custom('GetLocalCommonerTermPlural')] bow low.  [host.GetNameNoTooltipRegnal] takes [host.GetHerHis] sacred seat, the place of [host.GetHerHis] power. #EMP \"Hail [host.GetFirstNameNoTooltipRegnal]!\"#! all cry out. \"#EMP By the will of [host.GetFaith.HighGodName], our [host.GetTitleAsNameNoTooltip|l]!#!\""

 # "A few weak voices strain out sacred prayers."
 coronation_events.6120.desc_low_magnificence:0 "The nobility and [host.GetFaith.AltPriestTermPlural] jostle and backbite into place. A few weak voices strain out sacred observances."
