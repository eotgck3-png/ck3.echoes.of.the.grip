l_english:
 # ── Stewardship & Councillor Events — EotG Setting Overrides ─────────────────
 # Sources: stewardship_domain_events_l_english.yml,
 #          stewardship_duty_events_l_english.yml,
 #          stewardship_general_events_l_english.yml,
 #          steward_task_events_l_english.yml,
 #          marshal_task_events_l_english.yml,
 #          spymaster_task_events_l_english.yml,
 #          councillor_spouse_stewardship_events_l_english.yml
 # Replaces: "peasant" class references → "commoner/worker",
 #            "serf/serfs" (feudal bound labor) → "bonded worker/workers",
 #            "corvée" (feudal labor tax) → "labor duties",
 #            "sins" in spymaster secret context → "failings".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Stewardship Domain Events ─────────────────────────────────────────────────

 # "The peasant's feelings are irrelevant" — dismissive culture clash option
 stewardship_domain.1073.d:0 "The commoner's feelings are irrelevant — I am their ruler."

 # "when I have serfs?" — dismissive option for mason guild event
 stewardship_domain.6011.c:0 "Why would I need their help, when I have bonded workers?"

 # "The peasants will sort this out" — uncaring vassal in mismanagement event
 stewardship_domain_special.1002.desc.uncaring:0 "\n\nA bored-looking [county_holder.GetTitledFirstName] stands before me, seemingly unconcerned. "The commoners will sort this out, eventually. They always do. That is their job, is it not?""

 # "those peasants mess this up so badly? They're dirt-diggers!"
 stewardship_domain_special.1002.desc.blaming:0 "\n\nA frustrated [county_holder.GetTitledFirstName] stands before me, clearly stressed out. "How could those commoners mess this up so badly? That is literally all they do!""

 # "with peasants not far behind" — silk market festival result
 stewardship_domain_special.1103.desc_silk:0 "Fine silk to entice the wealthy folk in [county.GetNameNoTier] to the market, with commoners not far behind — it has been a week of celebration and commerce!"

 # "to entice the peasants to the market" — crop market festival result
 stewardship_domain_special.1103.desc_crops:0 "An abundance of food to entice the commoners to the market and first-class goods in all the stalls kept them coming back — it has been a week of celebration and commerce!"

 # "the peasant workers are so much more efficient" — road construction steward report
 stewardship_domain_special.1319.desc:0 "My steward seems almost shocked. "I have been inspecting the road construction in [project_county.GetNameNoTier], and the common workers are so much more efficient than I expected... Even I might learn a thing or two from them.""

 # "Learning from peasants? The very thought is abhorrent."
 stewardship_domain_special.1319.b:0 "Learning from commoners? The very thought is abhorrent."

 # "Mighthaps my peasantness could request" — commoner foreman awkwardly petitioning
 stewardship_domain_special.1320.desc:0 "It is not often a commoner addresses me directly, but [peasant_leader.GetTitledFirstName] reports on the construction efforts in [project_county.GetNameNoTier].\n\n"The plan for the road was to pass through this field, my liegeness, but I know the kind of soil we're working with. Mighthaps my humble self could request that— that we reroute it through the nearby forest?""

 # "Listen to your betters, peasant!" — dismissive option in road dispute
 stewardship_domain_special.1321.a:0 "Listen to your betters, commoner!"

 # "peasants returning from the fields with light burdens" — tax collection tour
 stewardship_domain_special.1413.desc:0 "As [collector.GetTitledFirstName] shows me around the settlement, all I see are gaunt animals, workers returning from the fields with light burdens. When I comment on it, [collector.GetSheHe] makes [collector.GetHerHis] point.\n\n"These people can barely feed their livestock. If I demand more from them they would starve.""

 # "No peasant can stand against the allure of a healthy plot of land"
 stewardship_domain_special.1425.desc:0 "The bodies are easy enough to be rid of. More of a challenge is finding families willing to settle in a settlement of the dead. No commoner can stand against the allure of a healthy plot of land for long, however. Or against the tip of a prodding spear, for that matter.\n\nOverseeing the beginnings of reconstruction has taught me a lot, too!"

 # "The taxes levied on the peasants of my realm"
 stewardship_domain_special.1442.desc:0 "The taxes levied on the commoners of my realm can at times be so harsh that even life is stifled. Easing it can often be the path to ever greater prosperity for a patient [ROOT.Char.GetTitleTierName]."

 # "will spread among peasants like fleas" — tax dodging lesson learned
 stewardship_domain_special.1444.end:0 "\n\nMatters are different now, but I have learned that mercy and leniency at times only lead to ever greater loss. Any way taxes can be avoided will spread among commoners like fleas."

 # "every acre, serf, and head of livestock" — great survey option
 stewardship_domain_special.1500.a:0 "I will know every acre, bonded worker, and head of livestock."

 # "The peasants shall suffer for their insolence!"
 stewardship_domain_special.3012.c:0 "The commoners shall suffer for their insolence!"

 # "Levy more peasants for the corvée" — construction labor demand options
 stewardship_domain_special.8012.b:0 "Levy more workers for labor duties."
 stewardship_domain_special.8013.b:0 "Conscript workers to make up for time lost."
 stewardship_domain_special.8021.a:0 "The workers will have to work twice as hard, then!"

 # ── Stewardship Duty Events ───────────────────────────────────────────────────
 # The "serf refugee" event chain is fundamentally about unfree labor tied to the
 # land — a feudal institution. "Bonded worker" is the setting-neutral equivalent.

 # Event title
 stewardship_duty.1071.t:0 "Bonded Worker Refugees"

 # Main description — "serfs" ×2
 stewardship_duty.1071.desc:0 "An influx of bonded workers has arrived in the [target_county.GetName] from the neighboring [origin_county.GetName]. They claim to be fleeing from the abusive rule of [origin_county_owner.Custom2('MyCharacterIntroduction', ROOT.Char)], and that they wish to live in my domain instead of [origin_county_owner.GetHerHis].\n\nLegally speaking they are still in bondage to [origin_county_owner.GetFirstName], but if I let them settle in my lands it would be almost impossible for [origin_county_owner.GetHerHim] to prove that they are actually [origin_county_owner.GetHerHis] workers."

 stewardship_duty.1071.a:0 "Graciously return the workers to [origin_county_owner.GetFirstNameNoTooltip]."
 stewardship_duty.1071.b:0 "Return the workers, but give [origin_county_owner.GetFirstNameNoTooltip] a stern rebuke."
 stewardship_duty.1071.c:0 "Show #EMP my#! workers to their new posts..."

 # Accusatory letters about the stolen workers
 stewardship_duty.1072.desc.rival:0 "I know you have taken my bonded workers from me. I may not have any way of recovering them, but do not think I will forget this offense. You have earned my enmity — I hope it was worth it."
 stewardship_duty.1072.desc.relationship:0 "Why would you take my bonded workers from me!? I am shocked and deeply hurt that you would betray me so... I do not know if I can ever view you the same way after this."
 stewardship_duty.1072.desc.vassal:0 "I know you have resettled my bonded workers in your lands. Why would you do that to your own vassal? Have I not been dutiful in paying you the taxes you are owed?\n\nWith no workers to tend my fields, I cannot grow any crops. You might as well have just stolen the land itself! This is an offense I will not soon forget."
 stewardship_duty.1072.desc.subvassal:0 "I know you have resettled my bonded workers in your lands. Such an act subverts the very fabric of our society!\n\nThough I can do nothing about this now, rest assured that [origin_county_owner_liege.GetTitledFirstName] will know why I have fewer taxes for [origin_county_owner_liege.GetHerHim] this year."
 stewardship_duty.1072.a:0 "Those were your workers? My apologies, I will return them."

 # "The peasants tending the roadside field" — incognito stewardship tour
 stewardship_duty_special.1205.desc:0 "The workers tending the roadside field had probably never seen as regal a passage as the one I was spearheading.\n\n"Who is this?" I heard one of them asking another."

 # "I should learn about life as a peasant out here."
 stewardship_duty_special.1205.b:0 "I should learn about life as a commoner out here."

 # ── Councillor Spouse Stewardship ─────────────────────────────────────────────

 # "Serfs Mollified" — result description for spouse stewardship event
 councillor_spouse_stewardship.1011.desc.serfs:0 "Workers Appeased"

 # ── Marshal Task Events ───────────────────────────────────────────────────────

 # "more peasants are rounded up in the towns and villages"
 marshal_task.1001.desc:0 "The harsh recruitment practices of my [councillor.GetCouncilTitle], [councillor.GetTitledFirstName], seem to be having the opposite of the intended effect.\n\nWhile more workers are rounded up in the settlements, large numbers are fleeing from [councillor.GetFirstNamePossessive] troops to escape their obligations of servitude!"

 # ── Spymaster Task Events ─────────────────────────────────────────────────────

 # "not done a good enough job of covering up [secret_holder.GetHerHis] sins"
 spymaster_task.0311.secret_sodomy.illegal_shared:0 "\n\n[secret_holder.GetSheHe|U] enjoys the intimate company of other [secret_holder.GetWomenMen]. Unlike me, however, [secret_holder.GetFirstName] has not done a good enough job of covering up [secret_holder.GetHerHis] failings."

 # ── Steward Task Events ───────────────────────────────────────────────────────

 # "The peasants are complaining about the interference of my [steward]"
 steward_task.2001.desc:0 "The commoners are complaining about the interference of my [councillor.GetCouncilTitle] in the [county.GetName]! [councillor.GetTitledFirstNamePossessive] diversion of workers from all over the [county.GetTitleTierName] means that other construction projects already under way are rarely finished."
