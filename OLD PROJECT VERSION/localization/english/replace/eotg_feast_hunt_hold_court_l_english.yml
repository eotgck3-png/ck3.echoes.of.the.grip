l_english:
 # ── Feast, Hunt, Hold Court & Coronation Events — EotG Setting Overrides ─────
 # Sources: feast_default_events_l_english.yml,
 #          feast_main_befriend_events_l_english.yml,
 #          hunt_events_l_english.yml,
 #          hold_court_events_l_english.yml,
 #          hold_court_events_linnea_l_english.yml,
 #          coronation_events_l_english.yml
 # Replaces: "peasant/peasants" → "commoner/commoners".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Feast Events ─────────────────────────────────────────────────────────────

 # "This must be the way peasants eat!"
 feast_default.1004.desc_meager:0 "What is this? Is there any meat on this bone? Do men usually eat vegetables this small? Are these the kind of meals I can expect in [ROOT.Char.GetFaith.NegativeAfterLife]? Oh, and where are the sweets?\n\nThis must be the way commoners eat!"

 # "Might as well compare me to a peasant."
 feast_main_befriend.2002.a:0 "Might as well compare me to a commoner."

 # ── Hunt Events ───────────────────────────────────────────────────────────────

 # "how much I have in common with a simple peasant"
 hunt.1021.desc:0 "Away from the others I came across a cottage housing one of the most beautiful people I have ever laid my eyes on.\n\n[beautiful_peasant.GetSheHe|U] has invited me to stay and rest, and I am surprised by how much I have in common with a simple commoner.\n\n"Must you return to the hunt so soon, [ROOT.Char.Custom('FormOfAddressForLiege')]? I have never met a [ROOT.Char.GetWomanMan] like you before...""

 # "the [animal] flees in panic from foraging peasants"
 hunt.4006.desc:0 "The [host.GetCurrentLocation.Custom('GetTerrainTree')] truly is 'the mantle of the poor', but as the [activity.Custom('GetAnimalType')] flees in panic from foraging commoners, I feel my patience wearing thin.\n\nSurely there must be better things to do in [host.GetCurrentLocation.GetNameNoTooltip] today than picking roots and mushrooms!"

 # ── Hold Court Events ─────────────────────────────────────────────────────────

 # "A thin, raggedy peasant stands before me"
 hold_court.1021.desc:0 "A thin, raggedy commoner stands before me, gawking at the opulence of my throne room. Obviously distracted, I call [peasant.GetHerHim] to get [peasant.GetHerHis] attention.\n\n"Oh, I'm sorry, [ROOT.Char.Custom('FormOfAddressForLiege')]. I, uh... My village in [county.GetNameNoTier] was hit by blight this year. We lost not only our crop but our seed, too. We have nothing, we shall starve without help!"\n\nGlancing around my throne room again, [peasant.GetSheHe] adds "Surely you have wealth to spare?""

 # "A peasant [woman/man] timidly approaches" — [peasant.GetWomanMan] resolves to "woman/man"
 hold_court.5010.desc:0 "A commoner [peasant.GetWomanMan] timidly approaches my throne, clutching at [peasant.GetHerHis] hat.\n\n"[county.GetName|U] is rampant with unrest and banditry, [ROOT.Char.Custom('FormOfAddressForLiege')]. Spare but a little coin for the region and control may be restored.""

 # ── Coronation Events ─────────────────────────────────────────────────────────

 # "simple-minded #EMP peasants#! insult their liege-lord"
 ach_coronation.0013.ending.disagrees:0 "\n\nHow dare these simple-minded #EMP commoners#! insult their liege-lord so!"

 # "Peasants! I have a proposition."
 ach_coronation.0013.a.weaken_detractors:0 "Commoners! I have a proposition."

 # "The peasants — fear in their eyes — beg for mercy"
 ach_coronation.0013.c.tt.success:0 "The commoners — fear in their eyes — beg for mercy"
