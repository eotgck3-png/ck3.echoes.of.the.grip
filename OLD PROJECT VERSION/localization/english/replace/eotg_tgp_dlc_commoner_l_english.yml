 # ── TGP DLC — EotG Setting Overrides ─────────────────────────────────────────
 # Sources: dlc_tgp_governance_l_english.yml,
 #          dlc_tgp_japan_religion_l_english.yml,
 #          dlc_tgp_situation_decision_events_l_english.yml,
 #          tgp_china_modifiers_l_english.yml,
 #          tgp_china_yearly_events_l_english.yml,
