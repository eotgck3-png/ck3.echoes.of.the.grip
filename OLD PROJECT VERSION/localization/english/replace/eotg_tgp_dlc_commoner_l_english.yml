 # Replaces: "peasant/peasants/peasantry" → "commoner/commoners/commonfolk".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── TGP Governance: Earthquake Contract Events ───────────────────────────────

 # "the peasantry have taken it as a dire portent"
 tgp_governor_contract_event.0030.desc:0 "I'm deeply engrossed in conversation with [my_councillor.GetFirstName] when [alarmed_councillor.GetFirstName] bursts into the room with uncommon urgency, visibly shaken.\n\n"A messenger from [quaking_in_panic_destination.GetName], [ROOT.Char.Custom('FormOfAddressForLiege')]! There's been an earthquake and the commonfolk have taken it as a dire portent, claiming it to be a sign of divine displeasure!""

 # "I pay little heed to the clamor of peasants."
 tgp_governor_contract_event.0030.b:0 "I pay little heed to the clamor of commoners."

 # "peasants crowding around my escort with plaintive pleas"
 tgp_governor_contract_event.0031.desc:0 "The village is in a clear state of unrest as I arrive, commoners crowding around my escort with plaintive pleas that we assuage Heaven's wrath before another disaster befalls them.\n\nCasting my eyes over the village behind them, the cracked walls and crooked doors of their homes testify as to the source of their fears."

 # "The peasants' fears prove too great to assuage"
 tgp_governor_contract_event.0031.a.failure:0 "The commoners' fears prove too great to assuage"

 # ── TGP Japan Religion ────────────────────────────────────────────────────────

 # "Peasant and Populist [factions|E] are more common"
 doctrine_parameter_peasant_and_populist_factions_more_common:0 "Commoner and Populist [factions|E] are more common and more powerful"

 # ── TGP Situation Decision Events ────────────────────────────────────────────

 # "letting provincial peasants into offices"
 tgp_dynastic_cycle.0056.desc.advancement:0 "However, the [ROOT.Char.GetTopLiege.GetName] is blinded by the examinations, letting provincial commoners into offices. Soon, they will denigrate our history."

 # "even the peasants forsake my lands for fear of coming turmoil"
 tgp_dynastic_cycle.0081.desc:0 "In an instant, Heaven trembles and the world is overturned.\n\nLoyal ministers flee in search of new masters, soldiers abandon their duties, and now even the commoners forsake my lands for fear of coming turmoil.\n\nAll ills are ascribed to my #EMP iniquitous#! rule, and it is proclaimed far and wide that I have lost the Mandate of Heaven!"

 # ── TGP China: Modifiers ──────────────────────────────────────────────────────

 # "The peasants of this region are working hard"
 tgp_diligent_workers_modifier_desc:0 "The commoners of this region are working hard to placate their liege in order to keep their young from being levied."

 # ── TGP China: Yearly Events ─────────────────────────────────────────────────

 # "a peasant child trailing in [messenger.GetHerHis] footsteps"
 tgp_china_yearly.0005.eunuch:0 "[messenger.Custom2('MyCharacterIntroduction', ROOT.Char)|U] greets me with a commoner child trailing in [messenger.GetHerHis] footsteps. \n\n"My [ROOT.Char.GetTitleAsName], I found this [grieving_child.Custom('GirlBoy')] outside the gates, asking for an audience with you. [grieving_child.GetSheHe|U] recently lost [grieving_child.GetHerHis] only living relative and has no means for a proper burial. There must be something we can do for [grieving_child.GetHerHim]!""

 # "[messenger] restraining a peasant child"
 tgp_china_yearly.0005.knight:0 "I hear a loud cry and running footsteps coming from the courtyard gates. Following the sound, I find [messenger.GetTitledFirstName] restraining a commoner child. \n\n"Help me, my [ROOT.Char.GetTitleAsNameNoTooltip]!" the child cries. "My [parent.GetMotherFather] is dead and left me all alone. I have no cloth for [parent.GetHerHis] body, no nails for a coffin." From [grieving_child.GetHerHis] red-rimmed eyes and the snot crusting [grieving_child.GetHerHis] nose, I can tell that [grieving_child.GetHerHis] distress is genuine."

 # ── TGP Dynastic Cycle: Flavor Events ────────────────────────────────────────

 # "the peasants of [peasant_county.GetName] forced open the grain stores"
 tgp_dynastic_cycle_events.0020.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], ill news." My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('marshal'))] [marshal.GetName] approaches me, [marshal.Custom('quirk_pos_pp')].\n\n"In the dead of night, the commoners of [peasant_county.GetName] forced open the grain stores. If I could hire more guards we may be able to still find them."\n\nEven our realm is not safe from [my_situation.GetTopCurrentPhase.GetName]."

 # "Executed Peasants" — modifier name
 tgp_executed_peasants_county_modifier:0 "Executed Commoners"

 # "the treatment their starving peasants were given"
 tgp_executed_peasants_county_modifier_desc:0 "This county has not forgotten the treatment their starving commoners were given."

 # ── TGP Governor Contract Events (Tova) ──────────────────────────────────────

 # "The peasant families under my control"
 governor_contract_events_tova.0060.desc:0 ""In times of expansion, it is our duty to muster for potential wars," reads the start of the missive sent by my liege. \n\n"They need not be trained. They need not be equipped. A vanguard of overwhelming proportion will serve to break any opposition." \n\nThe commoner families under my control have already yielded the men in charge of their households, which leaves only their sons for recruitment."

 # ── TGP Mandala: Devaraja Events ─────────────────────────────────────────────

 # "the most wretch specimen of peasantry approaches me"
 devaraja.0001.desc:0 "The [diseased_county_scope.GetName] calls for relief from the malady plaguing its people. If any place in the realm calls for charity now, this is the place. But while inspecting the grounds for a place of healing, the most wretch specimen of commonfolk approaches me. In a gross breach of protocol, [diseased_peasant.GetSheHe] falls to [diseased_peasant.GetHerHis] hands and knees, begging for relief.\n\nAs the #italic Devaraja#!, I am expected to lift up all my subjects, but can... #italic this#! truly be what I must save?"

 # ── TGP Mandala: Task Contracts ───────────────────────────────────────────────

 # "Upset Peasants" — modifier name
 upset_peasants_modifier:0 "Upset Commoners"

 # "the peasants of this county are unruly"
 upset_peasants_modifier_desc:0 "For one reason or another, the commoners of this county are unruly."

 # "Well-armed Peasants" — modifier name
 well_armed_peasants_modifier:0 "Well-armed Commoners"

 # "The peasants in this county are allowed to keep large amounts of spears"
 well_armed_peasants_modifier_desc:0 "The commoners in this county are allowed to keep large amounts of spears."

 # "A peasant steps forward, smiling"
 tgp_east_asia_mandala_task_contract_events.3000.desc:0 "In [ritual_location.GetName], villagers dance around a great effigy — one that isn't mine. #EMP "[ritual_location.GetCounty.GetFaith.WarGodName]! [ritual_location.GetCounty.GetFaith.WarGodName]! [ritual_location.GetCounty.GetFaith.WarGodName]!"#! They cry. My name is never spoken.\n\nA commoner steps forward, smiling. "Come celebrate [ritual_location.GetCounty.GetFaith.WarGodName]!" [local_character.GetSheHe] says.\n\n#bold But I am [ritual_location.GetCounty.GetFaith.WarGodName].\nAnd I am expected to punish them.#!"

 # "These peasants will serve as my example."
 tgp_east_asia_mandala_task_contract_events.3000.b:0 "These commoners will serve as my example."