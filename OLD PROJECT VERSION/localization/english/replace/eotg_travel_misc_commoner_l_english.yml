l_english:
 # ── Travel, Relations, Stewardship & Vanilla Misc — EotG Setting Overrides ───
 # Sources: event_localization/travel_events/travel_events_l_english.yml,
 #          event_localization/travel_events/travel_danger_events_joe_l_english.yml,
 #          event_localization/travel_events/travel_events_filippa_l_english.yml,
 #          event_localization/travel_events/travel_events_fp3_l_english.yml,
 #          event_localization/relation_events/lover_events_l_english.yml,
 #          event_localization/relation_events/sibling_events_l_english.yml,
 #          event_localization/lifestyle/governance/stewardship_domain_events_l_english.yml,
 #          interactions_l_english.yml,
 #          messages_l_english.yml,
