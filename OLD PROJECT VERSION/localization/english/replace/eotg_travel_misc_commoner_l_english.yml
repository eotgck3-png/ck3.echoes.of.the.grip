 # Replaces: "peasant/peasants/peasantry" → "commoner/commoners/commonfolk".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Travel Events ─────────────────────────────────────────────────────────────

 # "I spot a peasant walking along side the road with no shoes"
 travel_events.1000.desc:0 "As the procession rolls through the [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] of [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], I spot a commoner walking along side the road with no shoes. [shoeless_peasant.GetHerHis|U] feet are bloodied and swollen: [shoeless_peasant.GetSheHe|U] clearly must have been walking for a long time.\n\nAs I pass [shoeless_peasant.GetHerHim], I look closely at [shoeless_peasant.GetHerHis] face, the sad, sad eyes, the grimace of pain. Perhaps I could help somehow? "

 # "the peasant gives me a knowing smile"
 travel_events.1001.desc:0 "With shoes now covering [shoeless_peasant.GetHerHis] calloused feet, the commoner gives me a knowing smile and walks to match my pace.\n\n"You are a good and kind [ROOT.Char.GetTitleAsNameNoTooltip|U], and that kindness will be rewarded! I am [shoeless_peasant.GetName] of house [shoeless_peasant.GetDynastyName] and I always reward those with kind hearts.""

 # "this [shoeless_peasant.GetWomanMan] is not a peasant at all, but a poet"
 travel_events.1001.desc.outro.poet:0 "\n\nIt would seem this [shoeless_peasant.GetWomanMan] is not a commoner at all, but a poet of great renown!"

 # "is not a peasant at all, but a noble"
 travel_events.1001.desc.outro:0 "\n\nIt would seem this [shoeless_peasant.GetWomanMan] is not a commoner at all, but a noble of great wealth!"

 # "Tolls are for peasants and I am a [RulerTitle]"
 travel_events.1003.c:0 "Tolls are for commoners and I am a [ROOT.Char.GetTitleAsNameNoTooltip]."

 # "peasants and nobles of every culture" + "are for peasants" (two occurrences)
 travel_events.4019.desc:0 "On our way through [ROOT.Char.GetCurrentLocation.GetName], we appear to have stumbled into a local food market! Everywhere, commoners and nobles of every culture and tongue clamor around exotic food stalls, the air thick with fragrances I never had imagined.\n\nMy nose is drawn to a lowly stall stacked with a dish I could only dream of. I am pulled out of my haze by the halting grasp of [pompous_courtier.GetName].\n\n"Do not waste your palate on this slop, [ROOT.Char.Custom('FormOfAddressForLiege')]. [ROOT.Char.Custom('GetLocalStreetFoodPlural')|U] are for commoners, we have much finer foods at home.""

 # "The peasants told me the gold were buried out here"
 travel_events.4030.desc.mid.noble:0 ""Oh I was just here to collect taxes. The commoners told me the gold were buried out here, and before I knew it, they descended upon me and strung me up like a scarecrow!""

 # "A peculiar and enthusiastic peasant calling [fanboy_character_scope.GetHerselfHimself]"
 travel_events.4037.desc:0 "I had heard that the people of [ROOT.Char.GetCurrentLocation.GetCounty.GetName] practice [ROOT.Char.GetFaith.GetReligion.GetName] in conjunction with their own [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] beliefs, and now that I'm here, I can see that religious interweaving everywhere.\n\nA peculiar and enthusiastic commoner calling [fanboy_character_scope.GetHerselfHimself] [fanboy_character_scope.GetFirstName] enthusiastically approaches my entourage and begins studying our religious iconography with vigor.\n\n"By [fanboy_character_scope.GetFaith.HighGodName], a group of [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] here of all places! Pray tell me, [ROOT.Char.Custom('FormOfAddressForLiege')], would you teach us of the [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ways of worship?""

 # ── Travel Danger Events ──────────────────────────────────────────────────────

 # "passing groups peasants make it plain the place is being pillaged"
 travel_danger_events.6010.raid:0 "As we approach [ROOT.Char.GetCurrentLocation.GetBaronyNameExplicitlyNoTooltip], columns of smoke and passing groups of commoners make it plain the place is being pillaged. The strong can take what they like...\n\n"

 # "Let's blend in with the peasants..."
 travel_danger_events.6010.a:0 "Let's blend in with the commoners..."

 # ── Travel Events: Filippa ────────────────────────────────────────────────────

 # "The peasants working here drag their feet"
 travel_events.2004.desc:0 "The smell of decay hits my nostrils like a pungent punch. The livestock don't look well as I glance around the immediate pastures at [ROOT.Char.GetCurrentLocation.GetName].\n\nThe commoners working here drag their feet and aimlessly wander around trying to look busy. Their clear lack of motivation and morale is rubbing off on the entire populous it would seem, as development of the area has clearly come to a standstill.\n\nI shudder in disbelief as the local leader, [local_farmer.GetFirstName], approaches me. What a mismanaged hole!"

 # "a peasant child " — custom loc snippet
 travel_events.2010.peasant:0 "a commoner child "

 # ""Get in line, #EMP peasant.#!"" — dismissal option
 travel_events.2027.c:0 ""Get in line, #EMP commoner.#!""

 # ── Travel Events: FP3 ────────────────────────────────────────────────────────

 # "I have no time for peasants."
 travel_events_fp3.0050.c:0 "I have no time for commoners."

 # ── Relation Events: Lover ────────────────────────────────────────────────────

 # "A familiar-looking peasant appears before me"
 lover.8102.desc:0 ""Excuse me," A familiar-looking commoner appears before me. As I rack my brain for where I might've met [brothel_worker.GetHerHim] before, [brothel_worker.GetSheHe] answers as if reading my mind.\n\n"We met at a brothel in [brothel_location.GetName]. You paid for my services." A shade of pink spreads across [brothel_worker.GetHerHis] cheeks.\n"For us to be reunited... It has to be fate that"

 # ── Relation Events: Siblings ─────────────────────────────────────────────────

 # "listening to the plight of the peasants"
 sibling.8002.desc:0 "My [ROOT.GetCharacter.Custom('trait_generous_adjective')] [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )], [sibling.GetTitledFirstName], has been traveling [province.GetName], listening to the plight of the commoners, and generously handing out gifts and promises.\n\n[sibling.GetSheHe|U] even made it very clear that these were all kindnesses in the name of #EMP '[ROOT.Char.GetTitledFirstNameNoTooltip] the Good'#!..."

 # "greatly upset the peasants of several villages and towns"
 sibling.8004.desc:0 "Traveling through [province.GetName], my [ROOT.Char.Custom2('RelationToMeShort' , SCOPE.sC('sibling') )] seems to have greatly upset the commoners of several villages and towns. [sibling.GetTitledFirstName] demanded not only housing and to be treated as though [sibling.GetSheHe] was a [ROOT.GetCharacter.Custom2('using_my_title' , SCOPE.sC('sibling') ) ], but [sibling.GetSheHe] also punished people for the slightest display of disrespect."

 # "The peasants of [province.GetName] are not pleased" — tooltip
 peasants_dislike_sibling_tt:0 "The commoners of [province.GetName] are not pleased"

 # ── Stewardship Domain Events ─────────────────────────────────────────────────

 # "The peasant's feelings are irrelevant"
 stewardship_domain.1073.d:0 "The commoner's feelings are irrelevant — I am their ruler."

 # "the peasants have started muttering about #EMP alternative#! solutions"
 stewardship_domain.5031.desc:0 "These are tumultuous times for the [county.GetName]. Report after report arrives detailing the dire states of affairs in the area, and the commoners have started muttering about #EMP alternative#! solutions..."

 # ""The peasants will sort this out, eventually. They always do.""
 stewardship_domain_special.1002.desc.uncaring:0 "\n\nA bored-looking [county_holder.GetTitledFirstName] stands before me, seemingly unconcerned. "The commoners will sort this out, eventually. They always do. That is their job, is it not?""

 # ""How could those peasants mess this up so badly?""
 stewardship_domain_special.1002.desc.blaming:0 "\n\nA frustrated [county_holder.GetTitledFirstName] stands before me, clearly stressed out. "How could those commoners mess this up so badly? They're dirt-diggers! It's all they do!""

 # "with peasants not far behind"
 stewardship_domain_special.1103.desc_silk:0 "Fine silk to entice the wealthy folk in [county.GetNameNoTier] to the market, with commoners not far behind — it has been a week of celebration and commerce!"

 # "to entice the peasants to the market"
 stewardship_domain_special.1103.desc_crops:0 "An abundance of food to entice the commoners to the market and first-class goods in all the stalls kept them coming back — it has been a week of celebration and commerce!"

 # "the peasant workers are so much more efficient than I expected"
 stewardship_domain_special.1319.desc:0 "My steward seems almost shocked. "I have been inspecting the road construction in [project_county.GetNameNoTier], and the commoner workers are so much more efficient than I expected... Even I might learn a thing or two from them.""

 # "Learning from peasants? The very thought is abhorrent."
 stewardship_domain_special.1319.b:0 "Learning from commoners? The very thought is abhorrent."

 # "my peasantness could request" — character self-deprecating dialogue
 stewardship_domain_special.1320.desc:0 "It is not often a commoner addresses me directly, but [peasant_leader.GetTitledFirstName] reports on the construction efforts in [project_county.GetNameNoTier].\n\n"The plan for the road was to pass through this field, my liegeness, but I know the kind of soil we're working with. Mighthaps my commonness could request that— that we reroute it through the nearby forest?""

 # "Listen to your betters, peasant!" — option text
 stewardship_domain_special.1321.a:0 "Listen to your betters, commoner!"

 # "peasants returning from the fields with light burdens"
 stewardship_domain_special.1413.desc:0 "As [collector.GetTitledFirstName] shows me around the village, all I see are gaunt cows, chickens digging in the dirt, and commoners returning from the fields with light burdens. When I comment on it, [collector.GetSheHe] makes [collector.GetHerHis] point.\n\n"These people can barely feed their livestock. If I demand more from them they would starve.""

 # ── Interactions ──────────────────────────────────────────────────────────────

 # "#D Demote to simple peasant#!"
 demote_to_simple_peasant:0 "#D Demote to simple commoner#!"

 # ── Messages ──────────────────────────────────────────────────────────────────

 # "[CHARACTER's] peasants are getting ambitious"
 msg_faction_grows_desc:0 "[LEFT_CHARACTER.GetShortUINamePossessiveNoTooltip] commoners are getting ambitious and are joining the [FACTION.GetName] [faction|E] targeting me."

 # ── Nicknames ─────────────────────────────────────────────────────────────────

 # "eager peasants hope it's because [CharYouSheHe] is generous with [CharYourHerHis] purse"
 nick_ring_desc:0 "No one really knows why the world calls [CharYouHerHim(CHARACTER)] "$nick_ring$", though eager commoners hope it's because [CharYouSheHe(CHARACTER)] [CharAreIs(CHARACTER)] generous with [CharYourHerHis(CHARACTER)] purse."

 # "The peasantry think [CHARACTER] a ghoul"
 nick_the_monster_desc:0 "The commonfolk think [CHARACTER.GetShortUINameNoTooltipNoFormat] a ghoul, a blood-sucking nightmare come to sup on their children's marrow. Hopefully they're wrong."

 # "Children cry, peasants shudder, and milk sours"
 nick_the_terrible_desc:0 "Children cry, commoners shudder, and milk sours when [CharYouSheHe(CHARACTER)] pass[_es(CHARACTER)]. Allegedly."