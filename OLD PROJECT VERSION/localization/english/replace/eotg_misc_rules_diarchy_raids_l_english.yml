 # "Populist and Peasant Factions are unaffected." — realm stability rule options
 setting_lesser_realm_stability_regular_factions_desc:0 "A higher amount of [factions|E] will arise. Populist and Commoner Factions are unaffected."
 setting_higher_realm_stability_regular_factions_desc:0 "A lower amount of [factions|E] will arise. Populist and Commoner Factions are unaffected."
 setting_extreme_realm_stability_regular_factions_desc:0 "A extremely low amount of [factions|E] will arise. Populist and Commoner Factions are unaffected."
 setting_lesser_realm_stability_regular_factions_ai_only_desc:0 "A higher amount of [factions|E] will arise, but only for AI rulers. Populist and Commoner Factions are unaffected."
 setting_higher_realm_stability_regular_factions_ai_only_desc:0 "A lower amount of [factions|E] will arise, but only for AI rulers. Populist and Commoner Factions are unaffected."
 setting_extreme_realm_stability_regular_factions_ai_only_desc:0 "A extremely low amount of [factions|E] will arise, but only for AI rulers. Populist and Commoner Factions are unaffected."

