 death_starving_peasant_horde:0 "was torn apart by a horde of starving commoners"

 # ── Dynasty Legacies ──────────────────────────────────────────────────────────

 # "just rule in the eyes of vassals and peasants alike"
 law_legacy_track_desc:0 "Sound administration, and just rule in the eyes of vassals and commoners alike"

 # ── Struggle Catalysts ────────────────────────────────────────────────────────

 # "Had a populist or peasant uprising"
 catalyst_populist_uprise:0 "Had a populist or commoner uprising [struggle_catalyst_catalyst|E]"

 # "Populist or Peasant Uprising" — in Concept link display text
 catalyst_populist_uprise_desc:0 "Have a [Concept('civil_wars','Populist or Commoner Uprising')|E] as an [struggle_involved|E] [ruler|E]"

 # ── Diarchy Events ────────────────────────────────────────────────────────────

 # "tried to obtain resources from the peasantry" — mandate fail tooltip
 diarchies.0000.diarch_mandate_fail.tt.harass_peasants.liege:0 "[diarch.GetSheHe|U] tried to obtain resources from the commonfolk"

 # "much of the local peasantry to be exempt from military service"
 shift_privileges_scutage_exemptions_modifier_desc:0 "Documents bearing a higher seal than the local ruler's show much of the local commonfolk to be exempt from military service."

 # "You excite the peasantry's imaginations"
 diarchy.2201.b.tt.success:0 "You excite the commonfolk's imaginations"

 # "the notion has the peasantry are up in arms"
 diarchy.2231.desc:0 "The jails and courts of [exploitable_county.GetNameNoTier] have been processing an unfortunately high number of miscreants lately. Under normal circumstances, justice would find these malefactors swiftly, then they'd be turned loose to the wilds or the grave.\n\nLuckily for them, many have ample experience with sword or arrow, and my mandate as [liege.GetDiarchTitle] requires me to find fresh soldiers. The distasteful solution of service in [liege.GetTitledFirstNamePossessive] armies seems obvious, and though this turns up plenty of hardy bandits and eagle-eyed poachers, the notion has the commonfolk are up in arms."

 # ── Raid Events ───────────────────────────────────────────────────────────────

 # "worldly goods of the peasants to my lucky goblet"
 raiding.0003.desc.gold_plundered_vassal:0 "With no aid from my liege, [sacked_barony.GetNameNoTierNoTooltip] stood little chance. Raiders following [raider.GetTitledFirstName] have sacked the settlement, and the bastards took everything from the worldly goods of the commoners to my lucky goblet.\n\nHalf of greater [sacked_county.GetNameNoTierNoTooltip] is burning from the [raider.GetPrimaryTitle.GetAdjectiveNoTooltip] sack, and [raider.GetTitledFirstNameNoTooltip] is out there, somewhere, drinking from my personal cup."

 # "fear of their return keeps the peasants in line"
 recently_sacked_modifier_desc:0 "Raiders will find nothing more to take here, while fear of their return keeps the commoners in line."

 # "noble and peasant alike quail at my approach"
 raiding.0023.desc:0 "For years, I have swept out on devastating raids, bringing the full fury of [raid_leader.GetFaith.HighGodName] to a trembling world, for surely if [raid_leader.GetFaith.HighGodNameSheHe|U] disapproved, [raid_leader.GetFaith.HighGodNameSheHe|U] would have struck me down by now?\n\nInstead, my household sleep surrounded by the stolen fineries of foreign rulers, and exotic slaves warm my bed.\n\nTruly, noble and commoner alike quail at my approach, and parents silence crying children with the threat that I'll visit."

 # ── South Asia Events ─────────────────────────────────────────────────────────

 # "simple-minded peasants need to be brought to heel"
 south_asia.0030.a:0 "These simple-minded commoners need to be brought to heel!"

 # ── Iberia/North Africa Decisions ────────────────────────────────────────────

 # "peasantry and the clergy to my banners" — repudiate false Pope decision
 iberia_north_africa.0111.desc:0 "It's taken years to build the political and spiritual unity to muster this conclave, but I've finally brought enough of both the commonfolk and the clergy to my banners to meaningfully repudiate the false-[pope.GetTitledFirstName].\n\nEven now, the passageways and guest rooms of [religious_leader.GetCapitalLocation.GetTitle.GetBaseNameNoTier] throng with argumentative clerics and impassioned bishops; every aggrieved friar and petty [religious_leader.GetFaith.PriestNeuter] that Rome has ever snubbed clogging my halls.\n\nAll this debate is crucial for legitimacy, but ultimately, as the preeminent [religious_leader.GetFaith.GetAdjective] ruler, #EMP my#! word shall be the final deciding vote."

 # ── Title Events ──────────────────────────────────────────────────────────────

 # "Peasantry, clergy, and even nobles alike have all begun referring to it as such"
 title_event.0015.desc:0 "With the recent creation of the [castille.GetBaseName], [leon_char.Custom2('MyCharacterIntroduction', castille_char)] can no longer be said to truly rule a united [asturias.GetBaseNameNoTier].\n\nWithout the balancing force of my lands in the east, the former-[asturias.GetBaseNameNoTierNoTooltip] is really little more than a [leon.GetBaseName]. Commonfolk, clergy, and even nobles alike have all begun referring to it as such, much to my chagrin."

 # ── TGP Mandala Task Contracts ────────────────────────────────────────────────

 # "the peasants were 'plagued by nightmares'" — battlefield impurity modifier
 plagued_by_nightmares_modifier_desc:0 "After the Devaraja chose not to purify the battlefields, the commoners were 'plagued by nightmares', making them less productive."

 # "A generation of peasants are allowed to grow up in peace"
 generation_of_peace_modifier_desc:0 "A generation of commoners are allowed to grow up in peace, no levy imposed."

 # "Peasants are convinced a nāga dwells in the rivers"
 mandala_realm_contract_0040_desc:0 "Commoners are convinced a [Glossary('nāga', 'NAGA_GLOSS')] dwells in the rivers of [TaskContract.GetLocation.GetNameNoTooltip]. They demand that you lure it away."

 # "cowing peasants" — crocodile god modifier
 river_crocodile_god_modifier_desc:0 "An enormous crocodile, often mistaken for a [Glossary('nāga', 'NAGA_GLOSS')], lurks in the waters of this province — eating besieging armies and cowing commoners."
