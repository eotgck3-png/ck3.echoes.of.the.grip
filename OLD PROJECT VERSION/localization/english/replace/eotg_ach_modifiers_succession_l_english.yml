 # ── Achievement Modifiers, Coronation, Poetry & Succession — EotG Setting Overrides ──
 # Sources: modifiers/activity_coronation_modifiers_l_english.yml,
 #          event_localization/activities/coronation_events_l_english.yml,
 #          custom_localization/poetry_loc_l_english.yml,
 #          gui/succession_event_window_l_english.yml,
 #          modifiers/travel_modifiers_l_english.yml
 # Replaces: "peasant/peasantry" → "commoner/commonfolk".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Achievement Modifiers ─────────────────────────────────────────────────────

 # "Beat Peasants" — modifier name
 ach_beat_peasants_modifier:0 "Beat Commoners"

 # "Awed Peasantry" — modifier name
 ach_awed_peasantry_modifier:0 "Awed Commonfolk"

 # "arrest gossiping peasants" — modifier description
 ach_arrested_rumormongers_character_modifier_desc:0 "This character has gained a reputation for their willingness to arrest gossiping commoners, a mark of fear and some level of insecurity."

 # "rumors of the peasantry" — modifier description
 ach_reign_of_terror_character_modifier_desc:0 "This character has responded to the rumors of the commonfolk with a cruel series of brutal reprisals."

 # ── Travel Modifiers ──────────────────────────────────────────────────────────

 # "disgusting peasant food"
 bad_soup_modifier_desc:0 "This character recently ate some disgusting commoner food."

 # ── Coronation Events ─────────────────────────────────────────────────────────

 # "some peasants may die" — coronation crowd event option
 ach_coronation.0015.e:0 "Oh no, some commoners may die. Anyway..."

 # ── Poetry Generation ─────────────────────────────────────────────────────────

 # "noble and peasant under such rule" — poetry line for incompetent ruler
 GeneratePoem_Intro_Rhyming_Incompetence_03_B_01:0 "Leaving noble and commoner under such rule,"

 # ── Succession Event Window ───────────────────────────────────────────────────

 # "peasantry of the [realm]" — heir trait tooltip (glutton + greedy)
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GLUTTON_GREEDY:0 "A greedy and covetous [ROOT.Char.GetWomanMan], [ROOT.Char.GetSheHe] is unlikely to be popular amongst the commonfolk of the [ROOT.Char.Custom('GetRealmOrDomicile')|l]."

 # "peasantry of the [realm]" — heir trait tooltip (greedy only)
 SUCCESSION_EVENT_WINDOW_HEIR_TRAIT_GREEDY:0 "A greedy [ROOT.Char.GetWomanMan], [ROOT.Char.GetSheHe] is unlikely to garner the favor from the commonfolk of the [ROOT.Char.Custom('GetRealmOrDomicile')|l]."
