l_english:
 # ── Story Cycles & Stress Trait Events — EotG Setting Overrides ──────────────
 # Sources: story_cycle_peasant_affair_l_english.yml,
 #          story_cycles_l_english.yml,
 #          stress_trait_ongoing_events_l_english.yml,
 #          stress_trait_coping_decisions_events_l_english.yml,
 #          trait_specific_ongoing_events_l_english.yml
 # Replaces: "peasant" class references → "commoner",
 #            "humors" (medieval medicine) → "constitution",
 #            "pray/prayer" hardcoded → "call upon/meditation/rite".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Story Cycle: Peasant Affair ───────────────────────────────────────────────
 # Scope tokens like [peasant_character.GetWomanMan] display as "woman/man" —
 # only keys with the literal word "peasant" in player-visible text need replacing.

 # "no signs of this peasant you have us searching for" — failed search report
 peasant_affair.2002.desc_opening:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], we can find no signs of this commoner you have us searching for. With the limited resources at my disposal there is only so much that I can do..."\n\n"

 # "Surely no peasant can be worth this."
 peasant_affair.2002.b:0 "Surely no commoner can be worth this."

 # "The peasant [woman/man] of my dreams fights [searcher's] grasp"
 peasant_affair.2003.desc_dislike:0 "The commoner [peasant_character.GetWomanMan] of my dreams fights [searching_character.GetTitledFirstNamePossessive] grasp, [peasant_character.GetHerHis] face twisted in anger and fear\n\n"Please my [ROOT.Char.GetLadyLord], let me go! That night was a mistake, I only wish to be left alone.""

 peasant_affair.2003.desc_dislike_their_child:0 "The commoner [peasant_character.GetWomanMan] of my dreams fights [searching_character.GetTitledFirstNamePossessive] grasp, [peasant_character.GetHerHis] face twisted in anger and fear as [peasant_character.GetSheHe] clutches [peasant_character.GetHerHis] [peasant_child.Custom('GetDaughterSon')] to [peasant_character.GetHerHis] side.\n\n"Please, [ROOT.Char.Custom('FormOfAddressForLiege')], let us go! I only wish to raise #EMP my#! [peasant_child.Custom('GetDaughterSon')] alone.""

 # "no signs of this peasant you have us searching for. In all likelihood [she/he] is already dead."
 peasant_affair.2004.desc_opening:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U], we can find no signs of this commoner you have us searching for. In all likelihood [peasant_character.GetSheHe] is already dead..."\n\n"

 # ── Story Cycles: Doppelganger ────────────────────────────────────────────────

 # "A peasant bearing your exact likeness has been found"
 story_doppelganger_desc:0 "A commoner bearing your exact likeness has been found — a veritable [Glossary( 'doppelgänger', 'DOPPELGANGER_GLOSS' )]..."

 # "A peasant that looks and talks just like you can be an opportunity... or a curse."
 DOPPELGANGER_STORY_PRACTICAL_INFORMATION_STRING:0 "A commoner that looks and talks just like you can be an opportunity... or a curse. For now, [Story.MakeScope.Var('doppelganger_character').Char.GetUIName] resides in your [court|E]."

 # ── Stress Trait Ongoing Events ───────────────────────────────────────────────

 # "An endless parade of peasants, priests, and problems"
 stress_trait_ongoing.0501.desc:0 "The business of ruling has been so stressful, recently. If it's not this, it's that, if it's not that, it's this. An endless parade of commoners, priests, and problems, all expecting #EMP me#! to solve their every petty concern.\n\nI deserve a day to myself, with no suitors or petitioners, no diplomats or judges. Just me and this large plate of hashish cakes..."

 # ── Stress Trait Coping Decisions Events ─────────────────────────────────────

 # "I am approached out-of-the-blue one afternoon by a peasant woman clutching a babe"
 stress_trait_coping_decisions.2004.desc:0 "I am approached out-of-the-blue one afternoon by a common woman clutching a babe, tears streaming down [prostitute.GetHerHis] cheeks.\n\n"[ROOT.Char.GetTitledFirstNameNoTooltip]!" she chides, "Your antics are not without consequence! This little [baby.Custom('GirlBoy')] is #EMP yours#!!"\n\nI almost choke — but do I recall [prostitute.GetHerHis] face, [prostitute.GetHerHis] body, glowing dimly by candle in some den of iniquity...?"

 # ── Trait-Specific Ongoing Events ────────────────────────────────────────────
 # Seizure/epilepsy treatment chain — physician and chaplain offer remedies.

 # "I will pray to..." — lead-in to dynamic faith-god name options
 trait_specific_ongoing.2010.end.desc:0 "\n\nPerhaps they have chosen me to spread their word, and reward me with their blessings in turn? I will call upon..."

 # "I will pray the darkness away."
 trait_specific_ongoing.2015.a:0 "I will meditate the darkness away."

 # "[chaplain] told me to spend at least three hours a day in focused prayer"
 trait_specific_ongoing.2016.prayer1.desc:0 "[chaplain.GetTitledFirstName] told me to spend at least three hours a day in focused meditation and directed me to a dozen sections in the [ROOT.Char.GetFaith.ReligiousText] for further studies."

 # "Exercise and bodily stimulation are effective in balancing your humors"
 trait_specific_ongoing.3005.desc:0 ""Exercise and bodily stimulation are effective in balancing your constitution," my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] tells me. "You will make three rounds of your [ROOT.Char.Custom('ResidenceBuilding')] every day.""

 # "We will task a [PriestTitle] to pray over you to banish the evil within."
 trait_specific_ongoing.3006.desc:0 ""These bad thoughts and this melancholy are clearly the result of evil spirits or demons," my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('court_physician'))] [court_physician.GetTitledFirstName] tells me. "We will task a [ROOT.Char.Custom('DefaultPriestTitle')] to perform a rite over you to drive out the evil within.""
