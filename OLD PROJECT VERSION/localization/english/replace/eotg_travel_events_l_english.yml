l_english:
 # ── Travel, Journey & Subject Extortion Events — EotG Setting Overrides ──────
 # Sources: travel_events_l_english.yml,
 #          journey_l_english.yml,
 #          internal_affairs_l_english.yml,
 #          subject_extortion_events_l_english.yml
 # Replaces: "peasant/peasantry" class references → "commoner/commonfolk",
 #            "serf/serfs" → "bonded workers",
 #            "sin" as noun → "transgression",
 #            "sermon" → "address".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Travel Events ─────────────────────────────────────────────────────────────

 # "I spot a peasant walking along side the road with no shoes"
 travel_events.1000.desc:0 "As the procession rolls through the [ROOT.Char.GetCurrentLocation.GetTerrain.GetNameNoTooltip|l] of [ROOT.Char.GetCurrentLocation.GetNameNoTooltip], I spot a commoner walking along side the road with no shoes. [shoeless_peasant.GetHerHis|U] feet are bloodied and swollen: [shoeless_peasant.GetSheHe|U] clearly must have been walking for a long time.\n\nAs I pass [shoeless_peasant.GetHerHim], I look closely at [shoeless_peasant.GetHerHis] face, the sad, sad eyes, the grimace of pain. Perhaps I could help somehow? "

 # "the peasant gives me a knowing smile" — disguised noble reveal
 travel_events.1001.desc:0 "With shoes now covering [shoeless_peasant.GetHerHis] calloused feet, the commoner gives me a knowing smile and walks to match my pace.\n\n"You are a good and kind [ROOT.Char.GetTitleAsNameNoTooltip|U], and that kindness will be rewarded! I am [shoeless_peasant.GetName] of house [shoeless_peasant.GetDynastyName] and I always reward those with kind hearts.""

 # "this [woman/man] is not a peasant at all, but a poet of great renown!"
 travel_events.1001.desc.outro.poet:0 "\n\nIt would seem this [shoeless_peasant.GetWomanMan] is not a commoner at all, but a poet of great renown!"

 # "this [woman/man] is not a peasant at all, but a noble of great wealth!"
 travel_events.1001.desc.outro:0 "\n\nIt would seem this [shoeless_peasant.GetWomanMan] is not a commoner at all, but a noble of great wealth!"

 # "the peasant grabs my clothes with [her/his] grubby hands"
 travel_events.1002.desc:0 "As we ride past, the commoner grabs my clothes with [shoeless_peasant.GetHerHis] grubby hands, and stares deep into my eyes.\n\n"This is not behavior fitting a [ROOT.Char.GetTitleAsNameNoTooltip|U], is it? Had you known who I was, you wouldn't have let me go on like this!"\n\n[shoeless_peasant.GetSheHe|U] reveals [shoeless_peasant.GetHerselfHimself] to be a noble from house [shoeless_peasant.GetDynastyName] and seems to hold me now in the highest of contempt."

 # "Tolls are for peasants and I am a [title]."
 travel_events.1003.c:0 "Tolls are for commoners and I am a [ROOT.Char.GetTitleAsNameNoTooltip]."

 # "peasants and nobles of every culture clamor around exotic food stalls" + "[street food] are for peasants"
 travel_events.4019.desc:0 "On our way through [ROOT.Char.GetCurrentLocation.GetName], we appear to have stumbled into a local food market! Everywhere, commoners and nobles of every culture and tongue clamor around exotic food stalls, the air thick with fragrances I never had imagined.\n\nMy nose is drawn to a lowly stall stacked with a dish I could only dream of. I am pulled out of my haze by the halting grasp of [pompous_courtier.GetName].\n\n"Do not waste your palate on this slop, [ROOT.Char.Custom('FormOfAddressForLiege')]. [ROOT.Char.Custom('GetLocalStreetFoodPlural')|U] are for commoners, we have much finer foods at home.""

 # "The peasants told me the gold were buried out here" — tax-collector tied up as scarecrow
 travel_events.4030.desc.mid.noble:0 ""Oh I was just here to collect taxes. The commoners told me the gold were buried out here, and before I knew it, they descended upon me and strung me up like a scarecrow!""

 # "They must be made to understand that [MagicPracticeTerm] is a sin."
 travel_events.4033.a:0 "They must be made to understand that [witch_scope.Custom('MagicPracticeTerm')] is a transgression."

 # "A peculiar and enthusiastic peasant calling [herself/himself] [name]"
 travel_events.4037.desc:0 "I had heard that the people of [ROOT.Char.GetCurrentLocation.GetCounty.GetName] practice [ROOT.Char.GetFaith.GetReligion.GetName] in conjunction with their own [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] beliefs, and now that I'm here, I can see that religious interweaving everywhere.\n\nA peculiar and enthusiastic commoner calling [fanboy_character_scope.GetHerselfHimself] [fanboy_character_scope.GetFirstName] enthusiastically approaches my entourage and begins studying our religious iconography with vigor.\n\n"By [fanboy_character_scope.GetFaith.HighGodName], a group of [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] here of all places! Pray tell me, [ROOT.Char.Custom('FormOfAddressForLiege')], would you teach us of the [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] ways of worship?""

 # "You delivered a good/bad sermon" — result log strings for travel teach-faith event
 travel.good_cermon:0 "You delivered a good address"
 travel.bad_cermon:0 "You delivered a poor address"

 # "attend a sermon and learn all about the [faith]"
 travel_events.4038.desc:0 "In the [ROOT.Char.GetFaith.GetAdjective] faith, we observe our own rituals and our own beliefs, but we still hold [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetReligion.GetName] above all other religions and express a kinship for their beliefs.\n\nIt is quite common for [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] to practice [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetReligion.GetNameNoTooltip] in conjunction with traditional [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] worship, and now that I am here in [ROOT.Char.GetCurrentLocation.GetCounty.GetName] I have an opportunity to attend a gathering and learn all about the [ROOT.Char.GetCurrentLocation.GetCounty.GetFaith.GetAdjective] faith."

 # ── Journey Events (Wanderer Lifestyle) ──────────────────────────────────────

 # "Some sort of ministrel the peasants like" — suggestion to hire a bard
 journey_events.40.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]," My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('suggester_character'))], [suggester_character.GetFirstName] addresses me, as [suggester_character.GetSheHe] enters the room. "Everyone at court knows how happy you are to share your traveling tales and exploits, to everyone's great pleasure I assure you."\n\n[suggester_character.GetSheHe|U] continues, "I heard about a local bard that has become particularly popular as of late. Some sort of ministrel the commoners like. With the right motivation, maybe he could start sharing some of your tales around the realm?""

 # "I am not going to sit down with peasants and serfs!" — haughty option tooltip
 journey_events.50.b.tt:0 "What was wrong with me? Of course I am not going to sit down with commoners and bonded workers!"

 # "several peasants seem to be enjoying themselves over some dice game"
 journey_events.51.desc:0 "I find a seedy yet popular building as I travel through the streets. As soon as I enter, I am handed some alcohol, and the crowd of people pushes me off to a seat in the corner. Nobody has given me a second glance throughout the whole process.\n\nI sit by myself, watching the others at the establishment. A loud group is gathered around a large table, where several commoners seem to be enjoying themselves over some dice game."

 # "I have seen enough peasants for a lifetime."
 journey_events.51.b.tt:0 "I have seen enough commoners for a lifetime."

 # "particularly popular among their peasants and serfs" — Pauper King modifier
 journey_pauper_king_modifier_desc:0 "Supposedly particularly popular among their commoners and bonded workers due to the many stories of their friendly and personal interactions with those of the lower classes."

 # "I come across a group of peasants and monks alike" + "I realize some peasants are of higher stature"
 journey_events.60.desc_spiritual:0 "I come across a group of commoners and monks alike, gathered around in a circle. Their soft hymns fill the air, though I cannot make out if they are singing in praise of [ROOT.Char.GetFaith.HighGodName] or another deity. Upon closer inspection, I realize some commoners are of higher stature, with some even wearing the garb of nobility. Nonetheless, all seem to be in a state of peace, with their reverence of the divine binding them together."

 # ── Internal Affairs Events (Wanderer Lifestyle) ──────────────────────────────

 # "The peasants of [county] do not seem to have given their trust"
 internal_affairs.50.desc:0 "The commoners of [tensions_county.GetNameNoTier] do not seem to have given their trust, nor affections to [tensions_county.GetHolder.GetName]. There is no speculation about the cause of such unease, as [target_faith.GetAdherentNameNoTooltip] monuments are being desecrated, and with the uptick in brawls involving [target_faith.GetAdherentNamePluralNoTooltip] and [opposing_faith.GetAdherentNamePluralNoTooltip] alike. "

 # "You attempt to assist the peasants in asserting their right to practice [faith]."
 internal_affairs.tolerance_desc:0 "You attempt to assist the commoners in asserting their right to practice [target_faith.GetNameNoTooltip]."

 # "You attempt to convert the peasants of [county] to [faith]."
 internal_affairs.conversion_desc:0 "You attempt to convert the commoners of [tensions_county.GetNameNoTierNoTooltip] to [opposing_faith.GetNameNoTooltip]."

 # ── Subject Extortion Events ──────────────────────────────────────────────────

 # "Extort Subjects: Peasants" — event title
 subject_extortion.0002.t:0 "Extort Subjects: Commoners"

 # "The peasants of the [county]... is that not what peasants always do?"
 subject_extortion.0002.desc:0 "The commoners of the [extortion_target.GetName] seem to be doing better than one might expect from the taxes I have collected there. An extra contribution to my treasury should do no harm.\n\nOh, they will complain, but is that not what commoners always do? They will live through this, I am sure of it."
