l_english:
 # ── Activities, Bookmark & Contracts — EotG Setting Overrides ────────────────
 # Sources: activities/roaming_activity_l_english.yml,
 #          activities/tournament_activity_oltner_l_english.yml,
 #          activities/survey_activity_l_english.yml,
 #          bookmark/bookmark_rags_to_riches_1066_l_english.yml,
 #          contracts/laamp_base_learning_contract_events_l_english.yml,
 #          contracts/task_contracts_l_english.yml
 # Replaces: "peasant/peasants/peasantry" → "commoner/commoners/commonfolk".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Roaming Activity ──────────────────────────────────────────────────────────

 # "with peasants or serfs toiling in the sun"
 roaming_intro_terrain_snippet_farmlands:0 "Endless rows of crops stretch as far as the eye can see, with commoners or bonded workers toiling in the sun."

 # ── Tournament Activity ───────────────────────────────────────────────────────

 # "an improvised arena, set up by the local peasants"
 tournament_events.9002.desc:0 "Lively noises makes me discover an improvised arena, set up by the local commoners, where two burly wrestlers are putting on a show. They trade blows, weave, duck, and circle each other — until one of them makes a daring move:\n\n"I call this one the #EMP [strongman_1.Custom('GetDescriptorManeuver')] [strongman_1.Custom('GetManeuver')]!#!" [strongman_1.GetSheHe] screams before lifting [strongman_1.GetHerHis] opponent and slamming [strongman_1.GetHerHim] into the ground — making [strongman_2.GetHerHim] yield immediately. "[strongman_1.GetFirstName] the [strongman_1.Custom('ComplimentAdjective')|U] and [strongman_1.Custom('RandomPositiveLookAdjective')|U], victorious yet again!" the victor gloats."

 # "Three peasants in particular"
 tournament_events.9005.desc:0 "Food and drink is abundant during the tournament, to the delight of the attendees. Three commoners in particular seem to be sharing what looks like an #EMP entire keg#! of [tournament_host.Custom('RegionalDrink')].\n\n"Ahwi... ahwigetcha' for 'dat, you [peasant_2.Custom2('InsultNoun', SCOPE.sC('peasant_1'))]!" one sputters drunkenly, limply throwing [peasant_1.Custom('ThrowableObjectArticle')] at [peasant_1.GetHerHis] neighbor.\n\n"[peasant_1.GetFirstName], ahmas... ah am sorry! [peasant_1.Custom('GetLaughType')]" the victim covers [peasant_1.GetHerHis] face, deflecting the attack. "Help me, [peasant_3.GetFirstName]! #EMP *hic*#!"\n\n"Yer on yer own 'dere, [peasant_2.GetName]!" the last one exclaims, downing an entire mug in one big gulp."

 # ── Survey Activity ───────────────────────────────────────────────────────────

 # "impressed the peasants and nobles taking part"
 apa_survey_small_festival_key:0 "[first.GetShortUIName] took part in a small festival in [apa_province.GetName], and impressed the commoners and nobles taking part."

 # ── Bookmark: Rags to Riches ──────────────────────────────────────────────────

 # "a lowborn peasant with a made-up claim"
 bookmark.1071.desc:0 ""...and that's why you should support my claim on [GetTitleByKey('e_byzantium').GetNameNoTier]!" the monk says, prostrating himself before me. "You will gain an ally you can trust, and all the support you may need!"\n\nThis monk is an obvious fraud. He's not a so-called #EMP 'unjustly deposed Emperor of the Roman Empire'#!, but he #EMP is#! useful.\n\nDespite being a lowborn commoner with a made-up claim, an excuse for war is an excuse for war..."

 # ── LAAMP: Base Learning Contract Events ─────────────────────────────────────

 # "a striking peasant [GirlBoy] has seemingly bewitched my protégé"
 laamp_base_learning_contract_events.4100.desc.distraction.crushing:0 "\n\nFurther ahead, a striking commoner [dummy_gender.Custom('GirlBoy')] has seemingly bewitched my protégé. [child_to_educate.GetSheHe|U] sneaks around, intently observing the [dummy_gender.Custom('GirlBoy')] carrying provisions and #EMP decidedly#! ignores my presence."

 # ── Task Contracts ────────────────────────────────────────────────────────────

 # "panicky peasants"
 laamp_help_increase_control_contract_desc:0 "[TaskContract.GetTarget.GetPrimaryTitle.GetNameNoTierNoTooltip] suffers from rampant bandits, usurious officials, and panicky commoners. Anyone willing to keep all of them in line will be rewarded."

 # "disobedient peasants of [location]"
 ep3_contract_event.0092.desc:0 "[task_contract_councillor.GetName], [task_contract_councillor_liege.GetPrimaryTitle.GetNameNoTierPossessive] [task_contract_councillor.GetCouncilTitle], visits my encampment for the day. As soon as we are left alone, [task_contract_councillor.GetSheHe] begins muttering.\n\n"It is embarrassing to admit... but I need your help dealing with the disobedient commoners of [task_contract_destination.GetName]." The [task_contract_councillor.GetCouncilTitle|l] huffs and glowers.\n\n"They flout their [task_contract_councillor_liege.GetTitleAsNamePossessive] authority!""

 # "#EMP die#!, peasant!" — option text
 ep3_contract_event.0093.a:0 ""Silence your people or #EMP die#!, commoner!""

 # "bending each peasant leader to my will"
 ep3_contract_event.0094.desc:0 "When the clamorous ordeal of bending each commoner leader to my will is complete, we take once more to the road. [task_contract_councillor.GetName] speaks of our next destination.\n\n"We shall go to [corrupt_province.GetName], for better or worse. The local mobs are of grave concern.""

 # "you aided ... more than the peasants" — outcome tooltip
 ep3_contract_event.0094_success:0 "You succeed the [task_contract.GetType.GetName] [task_contract|E]: you aided [task_contract_employer.GetShortUIName] more than the commoners"

 # "you aided the peasants more than [employer]" — outcome tooltip
 ep3_contract_event.0094_fail:0 "You fail the [task_contract.GetType.GetName] [task_contract|E]: you aided the commoners more than [task_contract_employer.GetShortUIName]"

 # "Rights for the peasants!" — option text
 ep3_contract_event.0095.a:0 ""Rights for the commoners!""

 # "Peasants Rise" — message title
 msg_peasant_supported.title:0 "Commoners Rise"

 # "sided with peasants"
 msg_peasant_supported.desc:0 "[task_contract_taker.GetShortUIName] sided with commoners"

 # "Peasants Under Control" — message title
 msg_peasant_controlled.title:0 "Commoners Under Control"

 # "helped us with peasants"
 msg_peasant_controlled.desc:0 "[task_contract_taker.GetShortUIName] helped us with commoners"

 # "unruly peasants understand that [employer] has an ... right to rule"
 laamp_boost_legitimacy_contract_desc:0 "The [TaskContract.GetEmployer.GetTitleAsNameNoTooltip] requires a silver-tongued wordsmith to help [TaskContract.GetEmployer.GetHerHis] realm's unruly commoners understand that [TaskContract.GetEmployer.GetSheHe] has an inimitable right to rule. Local appearances must be made."

 # "swing this peasant's allegiance"
 ep3_contract_event.0510.c:0 "Perhaps a purse of gold might swing this commoner's allegiance..."

 # "The rowdy peasant was determined"
 ep3_contract_event.0520.desc.success:0 "The rowdy commoner was determined, but all determination crumbled before my conviction. The crowd, at first on the verge of being riled to violence, soon begins to quiet.\n\nEventually, they disperse, professing faith in [task_contract_employer.GetTitledFirstNamePossessive] rightful place as ruler of [location.GetName]. Representatives of my employer lay down their arms, professing gratitude for my work and passing on my well-earned reward."

 # "My attempted strong-arming of the peasant"
 ep3_contract_event.0520.desc.critfailure:0 "I truly was not expecting a veritable fortress of opposition.\n\nMy attempted strong-arming of the commoner goes down like a stone in a duckpond, and the situation turns ugly with horrifying speed. As I turn tail and flee, my cloak is soaked with spit and I'm struck with a slew of rotten vegetables.\n\nBy all appearances, [task_contract_employer.GetTitledFirstNamePossessive] reputation is changing in a quite #EMP different#! way than I promised [task_contract_employer.GetHerHim]..."