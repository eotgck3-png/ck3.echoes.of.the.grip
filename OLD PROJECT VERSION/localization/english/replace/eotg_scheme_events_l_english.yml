l_english:
 # ── Scheme & Death Events — EotG Setting Overrides ───────────────────────────
 # Sources: death_management_events_l_english.yml,
 #          befriend_ongoing_events_l_english.yml,
 #          intrigue_scheme_ongoing_events_l_english.yml,
 #          murder_outcome_events_l_english.yml,
 #          seduce_ongoing_events_l_english.yml,
 #          learn_language_ongoing_events_l_english.yml,
 #          learn_language_outcome_events_l_english.yml
 # Replaces: "peasant/peasantry" class references → "commoner/rioter/worker",
 #            "sins" as noun → "failings", "prayer/pray" hardcoded → "meditation/hope",
 #            "humors" → "constitution" in poisoning event.
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Death Management ──────────────────────────────────────────────────────────

 # "forgive me my sins" — prisoner's deathbed monologue
 death_management.4000.neutral_my_prison:0 "I hope you can forgive me my failings. Both what I did to you and all the things I left unsaid."

 # ── Befriend Scheme ───────────────────────────────────────────────────────────

 # "let us pray together in gratitude" — befriend event, friend option
 befriend_ongoing.3007.b:0 "[agent_speaking_highly.GetFirstNameNoTooltip], let us give thanks together."

 # "laughing at the filth and clumsiness of peasants" — malicious activity descriptor
 befriend_ongoing.6015.malicious:0 "spend some time in the outer districts, laughing at the foibles and clumsiness of commoners."

 # "dedicate [themselves] to prayer and contemplation" — submissive target's pastimes
 befriend_ongoing.6015.submissive:0 "dedicate [target.GetHerselfHimself] to quiet meditation, away from the demands of others."

 # "finding entertainment in the outrageous filth and clumsiness of peasants"
 befriend_ongoing.6016.malicious:0 "riding among the settlements, finding entertainment in the outrageous foibles and clumsiness of commoners."

 # ── Intrigue Scheme Ongoing ───────────────────────────────────────────────────

 # "My humors have been unbalanced" — child noticing poisoned gift (humors = medieval medicine)
 intrigue_scheme_ongoing.5007.desc:0 ""[ROOT.Char.GetMotherFather], something is wrong. My constitution has been unstable ever since I helped you pack that gift for [target.GetTitledFirstName]...""

 # ── Murder Outcome — Riot Plot ────────────────────────────────────────────────
 # All murder_outcome keys below are the riot-mob murder method.
 # "peasants" replaced with "commoners" for neutral group references,
 # "rioters" for references to the mob participants in specific legal contexts.

 murder_outcome.1005.desc:0 "With the recent unrest among the commoners of [home_province.GetNameNoTier], one of my agents has presented a unique suggestion for taking care of [target.GetTitledFirstName].\n\nWith coin in the right pockets and agitators on every corner, we could stage an entire riot while the [target.GetTitleTierName] is passing through the streets."

 murder_outcome.2005.opening_1:0 "[target.GetTitledFirstName] is dead, beat and trampled by [target.GetHerHis] own subjects!\n\nThe agitated commoners went wild seeing their liege riding through the streets, and tore both [target.GetHerHim] and several of [target.GetHerHis] $knight_culture_player_plural_no_tooltip_lowercase$ from their mounts, beating them to death!"

 murder_outcome.2005.owner_is_known_1:0 "\n\nMany rioters were hanged, but, tragically, before their execution some of my agitators named me as the perpetrator."

 murder_outcome.2005.no_awareness_1:0 "\n\nMany rioters were hanged, including my agitators, which means it cannot be traced back to me!"

 murder_outcome.4005.failure_declaration_1:0 "[target.GetTitledFirstName] has survived the attack of the rioter horde!"

 murder_outcome.4005.scheme_owner_known:0 "\n\nMany rioters were hanged, and my agitators confessed to my involvement!"

 murder_outcome.4005.scheme_known:0 "\n\nMany rioters were hanged, and the agitators confessed to the involvement of outside forces. Thankfully even they did not know that I was behind it."

 murder_outcome.4005.scheme_unknown:0 "\n\nMany rioters were hanged, but thankfully so were my agitators, which means the riot cannot be traced back to me."

 murder_outcome.4005.a:0 "This incompetence is why we rule, and these commoners do not."

 # "a mob of screaming and shouting peasants" — victim's perspective on riot death
 murder_outcome.5001.riled_up_mob:0 "I am riding through the streets of [ROOT.Char.GetCurrentLocation.GetName] when a mob of screaming and shouting commoners descends on my retinue. Before I realize what is happening, they tear me from my horse and start beating me. I can hear my guards shouting, but long before they reach me the world is fading from my sight."

 # Reworked murder riot variants
 murder_outcome_reworked.0041.desc:0 "An agitated mob of angry commoners was waiting for [target.GetFirstNameNoTooltip] on [target.GetHerHis] way through town.\n\nThe mere sight of the [target.GetLadyLord] riding carelessly by was enough for them to explode into murderous violence. The few guards who accompanied their liege were powerless against the blind fury of a crowd craving blood; [target.GetFirstNameNoTooltip] was trampled, beaten, and stabbed beyond recognition — beyond any chance of survival."

 murder_outcome_reworked.0042.desc:0 "I am all caught up in my thoughts as I ride through town, so I don't pay any attention to the nervous muttering of my guards or the growing crowd blocking our way. By the time I notice, it's too late.\n\nFurious rioters surround us, tear us from our horses, and beat us mercilessly. As relentless hits fall on me, too many to count, my sight is obfuscated by blood, then everything turns to black."

 murder_outcome_reworked.0043.desc:0 "Everything was going so well: my agitators had successfully collected a mob of commoners and adequately riled up their spirits against [target.GetFirstNameNoTooltip].\n\nHowever, when [target.GetFirstNameNoTooltip] made [target.GetHerHis] appearance surrounded by armed guards, the crowd's thirst for blood evaporated like snow in the sun! Only a few stragglers attacked, and they were quickly put down by the soldiers."

 murder_outcome_reworked.0044.desc:0 "As I ride through town with my retinue, I can't help but notice the growing mob surrounding us from every side.\n\nLuckily, this morning I decided to depart with a sizable group of well-armed soldiers, the sight of which is working wonders to cool down the crowd's discontent. When a small contingent of angry-looking rioters attempts to attack us, my guards cut them down with ease, dispersing the remaining ne'er-do-wells."

 # ── Seduce Scheme ─────────────────────────────────────────────────────────────

 # "since the peasants finished planting it in the garden" — garden seduction setup
 seduce_ongoing.1211.desc:0 "The flower display is breathtaking, and since the workers finished planting it in the garden, walks there have become far more popular."

 # "ridiculous peasant superstitions" — failed love potion discussion
 seduce_ongoing.2011.desc:0 "[target.GetFirstName] seemed unimpressed with the "love potion", and I had no more luck trying to discuss ridiculous folk superstitions. In fact [target.GetSheHe] seemed annoyed by it all!"

 # "peasants staring open-mouthed" — market street ride with seduction target
 seduce_ongoing.4012.end:0 "\n\nIt turned out to be a pleasant day, however, as we rode down the market street, chatting about all manner of things as the merchants hawked their wares to the commoners staring open-mouthed at our armor-gleaming entourage."

 # ── Learn Language Scheme ─────────────────────────────────────────────────────

 # "common knowledge among the [culture] peasantry"
 learn_language_ongoing.1100.desc:0 "It's no secret that I'm working hard on learning the [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] language, and it seems that it's becoming common knowledge among the common folk of [target.GetCulture.GetNameNoTooltip].\n\nThey are referring to me as 'the [ROOT.Char.GetTitleTierName] that cares', a flattering thing indeed. Even the lower nobles are lauding my efforts!\n\nI feel like my efforts have brought [ROOT.Char.GetCulture.GetCollectiveNounNoTooltip] and [target.GetCulture.GetCollectiveNounNoTooltip] closer together."

 # "[culture] peasants now respect me a great deal more"
 learn_language_outcome.1000.desc:0 "After lots of hard work I've finally learned the [scheme.GetTargetCharacter.GetCulture.GetLanguage.GetName] language! Endless hours practicing accentuation, sleepless nights mimicking inflection, countless lessons mastering intonation... it was all worth it in the end.\n\nDuring my efforts I looked to emulate [target.GetTitledFirstNamePossessive] accent — I am sure that [target.GetSheHe] would be impressed with my results!\n\nAnd, of course, the common folk of [target.GetCulture.GetNameNoTooltip] now respect me a great deal more."
