l_english:
 # ── Gob-Corp Expanded Event Modifier Names ────────────────────────────────────
 eotg_gobcorp_market_monopoly:0 "Market Monopoly"
 eotg_gobcorp_market_monopoly_desc:0 "A Trade Combine has secured dominant control over a market sector. Revenue flows, but rival factions grow hostile."
 eotg_gobcorp_faction_favoritism:0 "Factional Favoritism"
 eotg_gobcorp_faction_favoritism_desc:0 "Favoring one faction has alienated the others. The Board grows restless."
 eotg_gobcorp_factory_disaster:0 "Industrial Disaster"
 eotg_gobcorp_factory_disaster_desc:0 "A catastrophic accident has disrupted production and shaken public confidence in corporate leadership."
 eotg_gobcorp_worker_unrest:0 "Worker Unrest"
 eotg_gobcorp_worker_unrest_desc:0 "Laborers protest exploitation. County stability suffers as resentment spreads through industrial districts."
 eotg_gobcorp_market_boom:0 "Market Boom"
 eotg_gobcorp_market_boom_desc:0 "Trade profits surge across the realm. The economy hums with industrial energy."
 eotg_gobcorp_market_crash:0 "Market Crash"
 eotg_gobcorp_market_crash_desc:0 "Panic has spread through corporate markets. Revenue collapses and the Board turns anxious."

 # ── Gob-Corp Expanded Events ──────────────────────────────────────────────────
 eotg_gobcorp_flavor_0001_title:0 "A Combine Rises"
 eotg_gobcorp_flavor_0001_desc:0 "One Trade Combine has emerged dominant — its market share eclipsing all rivals. The other Princes watch with barely concealed fury. How the Director-General responds will define the Board's loyalties for years."
 eotg_gobcorp_flavor_0001_opt_support:0 "Back the dominant Combine."
 eotg_gobcorp_flavor_0001_opt_rivals:0 "Quietly fund their rivals."
 eotg_gobcorp_flavor_0001_opt_regulate:0 "Regulate their expansion."

 eotg_gobcorp_flavor_0002_title:0 "The Price-Fixing Rumors"
 eotg_gobcorp_flavor_0002_desc:0 "Accusations ripple through the Board: one Trade Prince has been manipulating prices and throttling the free flow of commerce to pad their own treasury. The other Princes demand action. The accused denies everything."
 eotg_gobcorp_flavor_0002_opt_ignore:0 "Look the other way. Gold is gold."
 eotg_gobcorp_flavor_0002_opt_investigate:0 "Launch a formal investigation."
 eotg_gobcorp_flavor_0002_opt_publicdefend:0 "Publicly defend the accused Prince."

 eotg_gobcorp_flavor_0003_title:0 "Trade War"
 eotg_gobcorp_flavor_0003_desc:0 "Two rival Trade Combines have unleashed their economic weapons on each other — price wars, sabotaged shipments, bribed inspectors. The Board is fractured. Business suffers."
 eotg_gobcorp_flavor_0003_opt_mediate:0 "Mediate a ceasefire between them."
 eotg_gobcorp_flavor_0003_opt_side:0 "Side openly with one Combine."
 eotg_gobcorp_flavor_0003_opt_exploit:0 "Exploit the conflict for personal gain."

 eotg_gobcorp_flavor_0004_title:0 "A Seat at the Table"
 eotg_gobcorp_flavor_0004_desc:0 "A wealthy Trade Prince has delivered an ultimatum: formal Board representation, or they will quietly begin undermining the Director-General's position. Their coffers are deep. Their patience is not."
 eotg_gobcorp_flavor_0004_opt_grant:0 "Grant them a Board Seat."
 eotg_gobcorp_flavor_0004_opt_refuse:0 "Refuse. The Board is already full."
 eotg_gobcorp_flavor_0004_opt_privileges:0 "Offer temporary trading privileges instead."

 eotg_gobcorp_flavor_0005_title:0 "Industrial Sabotage"
 eotg_gobcorp_flavor_0005_desc:0 "Two Trade Princes have stopped pretending to compete fairly. Factories burn. Cargo ships are delayed by mysterious malfunctions. The whole realm can smell the smoke — but neither Prince will admit blame."
 eotg_gobcorp_flavor_0005_opt_allow:0 "Let them fight. Competition breeds strength."
 eotg_gobcorp_flavor_0005_opt_intervene:0 "Intervene directly and impose peace."
 eotg_gobcorp_flavor_0005_opt_encourage:0 "Secretly encourage the weaker side."

 eotg_gobcorp_flavor_0006_title:0 "The Hoarder Prince"
 eotg_gobcorp_flavor_0006_desc:0 "One Trade Prince has accumulated a treasury that dwarfs even the Director-General's. Their holdings expand. Their private security grows. The other Princes eye the situation with naked envy and fear."
 eotg_gobcorp_flavor_0006_opt_tax:0 "Levy a special assessment on their wealth."
 eotg_gobcorp_flavor_0006_opt_ignore:0 "Ignore it. Power enriches everyone eventually."
 eotg_gobcorp_flavor_0006_opt_invest:0 "Demand they invest in realm development."

 eotg_gobcorp_flavor_0007_title:0 "Whispers in the Boardroom"
 eotg_gobcorp_flavor_0007_desc:0 "The meeting rooms grow quiet when the Director-General enters. Conversations stop. Eyes avoid. The Board is whispering about something — and it concerns the Director-General's continued tenure at the head of this empire."
 eotg_gobcorp_flavor_0007_opt_bribe:0 "Distribute generous 'loyalty bonuses' to the Board."
 eotg_gobcorp_flavor_0007_opt_threaten:0 "Make it clear what happens to those who whisper too loudly."
 eotg_gobcorp_flavor_0007_opt_ignore:0 "Ignore it. Whispers are just hot air."

 eotg_gobcorp_flavor_0008_title:0 "The Factory Fire"
 eotg_gobcorp_flavor_0008_desc:0 "An explosion at one of the realm's industrial facilities has killed dozens of workers and halted production for weeks. The cause is unclear — faulty equipment, dangerous conditions, or negligent management. Someone must answer for it."
 eotg_gobcorp_flavor_0008_opt_compensate:0 "Compensate the families. Take responsibility."
 eotg_gobcorp_flavor_0008_opt_coverup:0 "Suppress the incident reports."
 eotg_gobcorp_flavor_0008_opt_blame:0 "Blame the local facility managers."

 eotg_gobcorp_flavor_0009_title:0 "The Labor Problem"
 eotg_gobcorp_flavor_0009_desc:0 "Workers have taken to the streets outside the industrial districts. Their demands are not unreasonable — safer conditions, better pay, shorter shifts. But every concession costs gold, and the Board watches the Director-General's response closely."
 eotg_gobcorp_flavor_0009_opt_wages:0 "Meet their demands. Stability is worth the cost."
 eotg_gobcorp_flavor_0009_opt_security:0 "Deploy corporate security to end the protests."
 eotg_gobcorp_flavor_0009_opt_ignore:0 "Ignore it. Workers always complain."

 eotg_gobcorp_flavor_0010_title:0 "Cargo Through the Shadows"
 eotg_gobcorp_flavor_0010_desc:0 "The Director-General's intelligence network has uncovered what the harbormaster refuses to admit: illegal goods move freely through corporate shipping lanes. Someone is profiting from it. The question is whether to join them or stop them."
 eotg_gobcorp_flavor_0010_opt_profit:0 "Take a cut. Discretion is its own currency."
 eotg_gobcorp_flavor_0010_opt_crackdown:0 "Crack down and root out the network."
 eotg_gobcorp_flavor_0010_opt_partner:0 "Formalize the arrangement. Make it an asset."

 eotg_gobcorp_flavor_0011_title:0 "The Secret Alliance"
 eotg_gobcorp_flavor_0011_desc:0 "Intelligence reports have confirmed what rumors suggested: several powerful Trade Princes have been meeting privately — without the Director-General's knowledge. Whatever they are planning, the timing of their secrecy is not reassuring."
 eotg_gobcorp_flavor_0011_opt_infiltrate:0 "Infiltrate the alliance and learn their plans."
 eotg_gobcorp_flavor_0011_opt_concede:0 "Offer concessions before they act."
 eotg_gobcorp_flavor_0011_opt_expose:0 "Expose the alliance publicly."

 eotg_gobcorp_flavor_0012_title:0 "Leveraged Information"
 eotg_gobcorp_flavor_0012_desc:0 "One of the Director-General's agents has uncovered documentary evidence of financial crimes, illegal dealings, and personal scandals involving several Board members. The information is explosive. Its value depends entirely on how it is used."
 eotg_gobcorp_flavor_0012_opt_quiet:0 "Use it quietly. Hooks are better than headlines."
 eotg_gobcorp_flavor_0012_opt_scandal:0 "Leak it publicly. Destroy their reputations."
 eotg_gobcorp_flavor_0012_opt_sell:0 "Sell it to the highest bidder."

 eotg_gobcorp_flavor_0013_title:0 "Hired Knives"
 eotg_gobcorp_flavor_0013_desc:0 "Rumors from the undermarket: a Trade Prince has been paying for more than cargo. Professional killers, it is whispered, have been hired against business rivals. The Director-General must decide whether to investigate — or to quietly approve."
 eotg_gobcorp_flavor_0013_opt_investigate:0 "Investigate the allegations thoroughly."
 eotg_gobcorp_flavor_0013_opt_ignore:0 "Ignore it. Business has always been brutal."
 eotg_gobcorp_flavor_0013_opt_approve:0 "Quietly approve. One less rival is good for everyone."

 eotg_gobcorp_flavor_0014_title:0 "The Board Banquet"
 eotg_gobcorp_flavor_0014_desc:0 "An invitation arrives: the elite of the realm will gather for a lavish gathering of commerce and culture. The Director-General's presence is expected — and so is the performance that comes with it. These are not ordinary dinners."
 eotg_gobcorp_flavor_0014_opt_impress:0 "Put on an impressive display for the Board."
 eotg_gobcorp_flavor_0014_opt_deals:0 "Use the evening for quiet deal-making."
 eotg_gobcorp_flavor_0014_opt_excessive:0 "Spare no expense. Overwhelm them with wealth."

 eotg_gobcorp_flavor_0015_title:0 "The Young Prodigy"
 eotg_gobcorp_flavor_0015_desc:0 "A child of the Director-General's house has been displaying remarkable talent in the counting rooms — negotiating contracts, tracking ledgers, calculating profit margins with an uncanny instinct for commerce. The Board has noticed."
 eotg_gobcorp_flavor_0015_opt_mentor:0 "Guide them personally. Good habits form early."
 eotg_gobcorp_flavor_0015_opt_push:0 "Push them harder. Excellence demands sacrifice."
 eotg_gobcorp_flavor_0015_opt_exploit:0 "Put their talent to work immediately."

 eotg_gobcorp_flavor_0016_title:0 "Election Season"
 eotg_gobcorp_flavor_0016_desc:0 "The Director-General is not young anymore. The Trade Princes have begun their quiet calculations — who will be next? Who should they support? The political maneuvering has begun, and the Director-General must decide how to respond."
 eotg_gobcorp_flavor_0016_opt_endorse:0 "Publicly endorse a favored successor."
 eotg_gobcorp_flavor_0016_opt_neutral:0 "Stay neutral and preserve authority."
 eotg_gobcorp_flavor_0016_opt_manipulate:0 "Secretly manipulate the outcome."

 eotg_gobcorp_faction_rivalry:0 "Faction Rivalry"
