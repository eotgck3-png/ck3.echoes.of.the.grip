l_english:
 # ── eotg_names_l_english.yml ─────────────────────────────────────────────────
 # Character name keys for the 866 AG cast.
 #
 # CK3 resolves `name = "X"` in history/characters/ through localization, exactly
 # as vanilla does in localization/english/names/character_names_l_english.yml.
 # A name with no key falls back to the raw string, but Tiger flags it and the
 # name cannot then be reused by a culture name_list.
 #
 # Qadir, Rashid, Samir and Serapion are deliberately absent — vanilla already
 # localizes those four, and redefining them here would collide silently.
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Elrossi Imperium ─────────────────────────────────────────────────────────
 Aurelion:0 "Aurelion"
 Vessarion:0 "Vessarion"

 # ── New Cauldron ─────────────────────────────────────────────────────────────
 Marlen:0 "Marlen"
 Lireth:0 "Lireth"

 # ── Gob-Ogre Trade League ────────────────────────────────────────────────────
