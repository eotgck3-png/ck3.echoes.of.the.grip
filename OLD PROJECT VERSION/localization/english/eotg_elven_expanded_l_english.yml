l_english:
 # ── Elven Monarchy Expanded Modifier Names ────────────────────────────────────
 eotg_elven_court_session:0 "Court in Session"
 eotg_elven_court_session_desc:0 "The Eternal Court is assembled and functioning. Ancient deliberations carry weight. Decisions made now will echo for centuries."
 eotg_elven_isolationist_posture:0 "Isolationist Posture"
 eotg_elven_isolationist_posture_desc:0 "The realm has adopted a posture of deliberate withdrawal from outsider affairs. Elven culture is preserved — at the cost of diplomatic reach."
 eotg_elven_subject_unrest:0 "Subject Unrest"
 eotg_elven_subject_unrest_desc:0 "Non-elven populations are restless under discriminatory policies. County control weakens where resentment festers."

 # ── Elven Expanded Events ──────────────────────────────────────────────────────
 eotg_elven_flavor_0001_title:0 "The Court Convenes"
 eotg_elven_flavor_0001_desc:0 "The Eternal Court has assembled — elven nobles gathering in ancient ceremony to deliberate matters of the realm. The traditions are older than memory. The politics are as sharp as ever."
 eotg_elven_flavor_0001_opt_respect:0 "Honor the ancient traditions fully."
 eotg_elven_flavor_0001_opt_manipulate:0 "Use the assembly as cover for political maneuvering."
 eotg_elven_flavor_0001_opt_pressure:0 "Pressure the Regents into rapid compliance."

 eotg_elven_flavor_0002_title:0 "The Heir Is Questioned"
 eotg_elven_flavor_0002_desc:0 "A powerful Celestial Lord has broken the silence of the Court: they have publicly questioned whether the designated heir possesses the qualities befitting an elven sovereign. The question hangs in the air like smoke."
 eotg_elven_flavor_0002_opt_defend:0 "Defend the heir's worthiness publicly."
 eotg_elven_flavor_0002_opt_silence:0 "Silence the critic before this spreads."
 eotg_elven_flavor_0002_opt_concede:0 "Offer concessions to the critic."

 eotg_elven_flavor_0003_title:0 "Court Factions"
 eotg_elven_flavor_0003_desc:0 "Within the Eternal Court, noble blocs have begun to crystallize. Old alliances are being redrawn. New political circles form at the fringes of formal sessions. The Court is no longer a unified body — it is a collection of competing interests."
 eotg_elven_flavor_0003_opt_balance:0 "Balance the factions carefully."
 eotg_elven_flavor_0003_opt_support:0 "Lend support to the most amenable bloc."
 eotg_elven_flavor_0003_opt_undermine:0 "Undermine all factions equally."

 eotg_elven_flavor_0004_title:0 "Outsiders at the Gate"
 eotg_elven_flavor_0004_desc:0 "Foreign envoys have arrived bearing formal correspondence and diplomatic pretensions. Their home nations wish to establish relations. Their presence inside elven lands is, to some at Court, already an affront."
 eotg_elven_flavor_0004_opt_respect:0 "Receive them with diplomatic courtesy."
 eotg_elven_flavor_0004_opt_mock:0 "Openly demonstrate their inferiority."
 eotg_elven_flavor_0004_opt_refuse:0 "Refuse to meet with them at all."

 eotg_elven_flavor_0005_title:0 "The Purists' Demand"
 eotg_elven_flavor_0005_desc:0 "Traditionalist nobles have presented a formal petition: the non-elven populations within the realm's holdings must be subject to stricter separation measures. Their argument is cultural preservation. Their agenda is supremacy."
 eotg_elven_flavor_0005_opt_enforce:0 "Enforce the separation. Elven culture must be protected."
 eotg_elven_flavor_0005_opt_moderate:0 "Moderate the policy. Stability matters more."
 eotg_elven_flavor_0005_opt_reject:0 "Reject the petition. The purists overstep."

 eotg_elven_flavor_0006_title:0 "The Spreading Customs"
 eotg_elven_flavor_0006_desc:0 "It has been noticed: foreign customs, fashions, and practices are seeping into life in the mixed holdings. Elven servants adopting outsider speech. Markets carrying alien goods. The traditionalists are alarmed. Some see opportunity."
 eotg_elven_flavor_0006_opt_suppress:0 "Suppress the foreign influence immediately."
 eotg_elven_flavor_0006_opt_tolerate:0 "Tolerate limited cultural exchange."
 eotg_elven_flavor_0006_opt_embrace:0 "Secretly embrace the new ideas."

 eotg_elven_flavor_0007_title:0 "The Unrest Below"
 eotg_elven_flavor_0007_desc:0 "Non-elven subjects have reached a threshold of resentment. Reports from the holdings describe a growing undercurrent of resistance — quiet at first, but impossible to ignore. The discrimination has been sustained too long."
 eotg_elven_flavor_0007_opt_suppress:0 "Suppress the unrest with force."
 eotg_elven_flavor_0007_opt_ease:0 "Ease the most severe restrictions."
 eotg_elven_flavor_0007_opt_ignore:0 "Ignore it. Subjects do not determine policy."

 eotg_elven_flavor_0008_title:0 "The Talented Outsider"
 eotg_elven_flavor_0008_desc:0 "An outsider official has demonstrated abilities that surpass their elven counterparts in the same role — exceptional organization, financial acuity, administrative competence. The nobility has noticed. Opinions are divided sharply."
 eotg_elven_flavor_0008_opt_secret:0 "Use their skills privately, without public acknowledgment."
 eotg_elven_flavor_0008_opt_publicreward:0 "Publicly recognize their abilities."
 eotg_elven_flavor_0008_opt_reject:0 "Reject their advancement. Such things set dangerous precedents."

 eotg_elven_flavor_0009_title:0 "The Mixed Communities"
 eotg_elven_flavor_0009_desc:0 "In the longer-held territories, something unexpected has happened: elves and outsiders have begun living side by side, sharing markets, sharing festivals, sharing neighborhoods. It is peaceful. The traditionalists find this deeply alarming."
 eotg_elven_flavor_0009_opt_separate:0 "Enforce separation. Communities must not blur."
 eotg_elven_flavor_0009_opt_tolerate:0 "Tolerate the mixed communities."
 eotg_elven_flavor_0009_opt_assimilate:0 "Encourage assimilation into elven culture."

 eotg_elven_flavor_0010_title:0 "The Court's Judgment"
 eotg_elven_flavor_0010_desc:0 "The Eternal Court prepares to judge the designated heir. Ancient procedures will be followed — testimonies, deliberations, declarations. The heir's future — and the realm's stability — hangs on this process."
 eotg_elven_flavor_0010_opt_tradition:0 "Follow tradition fully. Trust the process."
 eotg_elven_flavor_0010_opt_bribe:0 "Ensure favorable outcomes through generous gifts to Regents."
 eotg_elven_flavor_0010_opt_threaten:0 "Make the Regents understand what is expected of them."

 eotg_elven_flavor_0011_title:0 "The Court Deliberates"
 eotg_elven_flavor_0011_desc:0 "The Eternal Court has entered formal deliberation over succession. Arguments are being made for and against the heir. Ancient precedents are being invoked. Some voices speak of alternatives."
 eotg_elven_flavor_0011_opt_accept:0 "Accept the court's authority and trust in the outcome."
 eotg_elven_flavor_0011_opt_concessions:0 "Offer concessions to secure favorable deliberation."
 eotg_elven_flavor_0011_opt_rivalry:0 "Challenge the court's right to question the succession."

 eotg_elven_flavor_0012_title:0 "The Court Fractures"
 eotg_elven_flavor_0012_desc:0 "The Eternal Court has split. Half support the designated heir. Half support a rival claim. The formal body that guarantees elven succession legitimacy is now the source of a legitimacy crisis."
 eotg_elven_flavor_0012_opt_negotiate:0 "Negotiate a compromise that reunites the court."
 eotg_elven_flavor_0012_opt_crush:0 "Crush the rival claimants militarily."
 eotg_elven_flavor_0012_opt_dividepriv:0 "Divide privileges among factions to buy temporary peace."

 eotg_elven_flavor_0013_title:0 "Ancient Blood Claims"
 eotg_elven_flavor_0013_desc:0 "Two noble houses have brought their bloodline dispute before the Eternal Court. Each claims ancient precedent. Each has documented evidence. Each has allies within the nobility. The Sovereign must adjudicate — or decline to."
 eotg_elven_flavor_0013_opt_support:0 "Support the house with stronger Court allies."
 eotg_elven_flavor_0013_opt_proof:0 "Demand formal genealogical proof before ruling."
 eotg_elven_flavor_0013_opt_ignore:0 "Decline to involve the Sovereign's office."

 eotg_elven_flavor_0014_title:0 "The Supremacy Doctrine"
 eotg_elven_flavor_0014_desc:0 "Court scholars have presented a formal treatise: a systematic argument that elven civilization is not merely different from others but inherently superior — destined, by nature and history, to govern lesser peoples. The Court awaits the Sovereign's response."
 eotg_elven_flavor_0014_opt_promote:0 "Endorse and promote the doctrine."
 eotg_elven_flavor_0014_opt_moderate:0 "Acknowledge it without making it state policy."
 eotg_elven_flavor_0014_opt_reject:0 "Reject it publicly as dangerous extremism."

 eotg_elven_flavor_0015_title:0 "The Ambassador's Humiliation"
 eotg_elven_flavor_0015_desc:0 "During a formal reception, noble courtiers insulted the visiting foreign ambassador — ostentatiously, publicly, and with evident enjoyment. The diplomat is furious. The Sovereign must now decide how to respond to the Court's behavior."
 eotg_elven_flavor_0015_opt_encourage:0 "Encourage it. Outsiders deserve no better."
 eotg_elven_flavor_0015_opt_apologize:0 "Offer a diplomatic apology."
 eotg_elven_flavor_0015_opt_punish:0 "Punish the noble responsible."
