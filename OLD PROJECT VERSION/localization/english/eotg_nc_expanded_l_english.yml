l_english:
 # ── NC Democracy Expanded Modifier Names ─────────────────────────────────────
 eotg_nc_senate_gridlock:0 "Senate Gridlock"
 eotg_nc_senate_gridlock_desc:0 "The Senate is paralyzed by partisan conflict. Legislation stalls. The President's agenda slows to a crawl."
 eotg_nc_campaign_season:0 "Campaign Season"
 eotg_nc_campaign_season_desc:0 "Active electioneering is underway. Public messaging, coalition-building, and political positioning dominate the agenda."
 eotg_nc_senate_corruption:0 "Senate Corruption"
 eotg_nc_senate_corruption_desc:0 "Vote-buying and political bribery have taken root in the Senate. The democratic process has been quietly compromised."
 eotg_nc_emergency_powers:0 "Emergency Powers"
 eotg_nc_emergency_powers_desc:0 "The President has invoked executive emergency authority. Senate oversight is bypassed. Senators are furious — and afraid."
 eotg_nc_public_discontent:0 "Public Discontent"
 eotg_nc_public_discontent_desc:0 "Citizens have lost confidence in presidential leadership. Approval collapses. The legitimacy of executive authority weakens."
 eotg_nc_national_mourning:0 "National Mourning"
 eotg_nc_national_mourning_desc:0 "The republic mourns its President. The successor carries the weight of grief alongside the weight of office."

 # ── NC Democracy Expanded Events ──────────────────────────────────────────────
 eotg_nc_flavor_0001_title:0 "The Senate Turns Hostile"
 eotg_nc_flavor_0001_desc:0 "A Senate session has devolved into open confrontation. Senators are no longer offering mild criticism — they are attacking executive leadership directly, publicly, and with evident satisfaction. The chamber echoes with the sound of democracy expressing discontent."
 eotg_nc_flavor_0001_opt_negotiate:0 "Negotiate a compromise on the disputed legislation."
 eotg_nc_flavor_0001_opt_shame:0 "Publicly shame the most aggressive opponents."
 eotg_nc_flavor_0001_opt_delay:0 "Delay the vote until passions cool."

 eotg_nc_flavor_0002_title:0 "The Price of a Vote"
 eotg_nc_flavor_0002_desc:0 "A Senator has made their position clear through diplomatic intermediaries: they will support the President's agenda in exchange for political favors. The request is phrased delicately. The transaction is not."
 eotg_nc_flavor_0002_opt_council:0 "Offer a council position in exchange for support."
 eotg_nc_flavor_0002_opt_promise:0 "Promise future policy favors."
 eotg_nc_flavor_0002_opt_refuse:0 "Refuse. The Senate should vote on the merits."

 eotg_nc_flavor_0003_title:0 "The Regional Bloc"
 eotg_nc_flavor_0003_desc:0 "Several Senators representing adjacent States have formalized their coordination into a voting bloc — a political structure that gives regional interests disproportionate leverage over national policy. Their unity is both their strength and their vulnerability."
 eotg_nc_flavor_0003_opt_court:0 "Court the bloc with targeted policy concessions."
 eotg_nc_flavor_0003_opt_divide:0 "Divide the coalition by offering individual deals."
 eotg_nc_flavor_0003_opt_ignore:0 "Ignore them. Blocs rarely hold together."

 eotg_nc_flavor_0004_title:0 "Campaign Season"
 eotg_nc_flavor_0004_desc:0 "The election cycle has officially begun. Candidates are declaring, platforms are forming, and the media attention that democracy generates in abundance has arrived. The way the President campaigns now will define the result."
 eotg_nc_flavor_0004_opt_aggressive:0 "Campaign aggressively across every district."
 eotg_nc_flavor_0004_opt_elite:0 "Focus resources on securing elite Senate support."
 eotg_nc_flavor_0004_opt_public:0 "Focus on public messaging and popular appeal."

 eotg_nc_flavor_0005_title:0 "A Rival Surges"
 eotg_nc_flavor_0005_desc:0 "A rival candidate has begun outperforming expectations. Their approval numbers climb. Their rallies fill. Their fundraising accelerates. The President must respond or risk watching their lead evaporate before votes are cast."
 eotg_nc_flavor_0005_opt_attack:0 "Attack their record aggressively."
 eotg_nc_flavor_0005_opt_debate:0 "Challenge them to a public debate."
 eotg_nc_flavor_0005_opt_rumors:0 "Spread damaging rumors through trusted channels."

 eotg_nc_flavor_0006_title:0 "The Campaign Promise"
 eotg_nc_flavor_0006_desc:0 "A moment of political opportunity presents itself: a public commitment to reform could mobilize key constituencies and deliver crucial support. Promises are easy to make. The question is what kind of promise to make — and what its future cost might be."
 eotg_nc_flavor_0006_opt_economic:0 "Promise economic reform and working-class prosperity."
 eotg_nc_flavor_0006_opt_military:0 "Promise military expansion and security strength."
 eotg_nc_flavor_0006_opt_anticorrupt:0 "Promise a sweeping anti-corruption campaign."

 eotg_nc_flavor_0007_title:0 "Election Day"
 eotg_nc_flavor_0007_desc:0 "Across New Cauldron's territories, citizens are casting their votes. Returns are coming in from the outer States first — then the urban centers, then the Senate caucuses. The counting has begun. Democracy is reaching its moment of resolution."
 eotg_nc_flavor_0007_opt_clear:0 "A clear mandate. The people have spoken."
 eotg_nc_flavor_0007_opt_narrow:0 "A narrow victory. Enough to govern, barely."
 eotg_nc_flavor_0007_opt_contested:0 "The result is disputed. The crisis is just beginning."

 eotg_nc_flavor_0008_title:0 "The Bribe Offers"
 eotg_nc_flavor_0008_desc:0 "With a critical Senate vote approaching, political reality asserts itself: several Senators have made clear they are open to persuasion of a financial nature. The democratic process is functioning exactly as its critics always warned it might."
 eotg_nc_flavor_0008_opt_expand:0 "Expand the bribery operation. Buy every vote needed."
 eotg_nc_flavor_0008_opt_limited:0 "Limit it to the minimum number of votes required."
 eotg_nc_flavor_0008_opt_record:0 "Record their willingness as leverage for later."

 eotg_nc_flavor_0009_title:0 "The Exposure"
 eotg_nc_flavor_0009_desc:0 "Evidence of vote-buying has surfaced. The Senate is in an uproar. Media outlets are demanding accountability. The President must respond to allegations of corruption in the heart of the democratic process."
 eotg_nc_flavor_0009_opt_deny:0 "Deny everything categorically."
 eotg_nc_flavor_0009_opt_sacrifice:0 "Sacrifice a Senator to contain the damage."
 eotg_nc_flavor_0009_opt_admit:0 "Admit to political realities. Transparency has its costs."

 eotg_nc_flavor_0010_title:0 "The Reform Movement"
 eotg_nc_flavor_0010_desc:0 "A well-organized political movement has emerged, demanding comprehensive anti-corruption reform. Their platform is specific, their advocates are articulate, and their popularity among citizens is genuine. The political establishment is alarmed."
 eotg_nc_flavor_0010_opt_support:0 "Support the reformers. Let them clean house."
 eotg_nc_flavor_0010_opt_suppress:0 "Suppress the movement before it grows stronger."
 eotg_nc_flavor_0010_opt_manipulate:0 "Co-opt the movement and redirect its energy."

 eotg_nc_flavor_0011_title:0 "The Senate Says No"
 eotg_nc_flavor_0011_desc:0 "The Senate has voted to deny war authorization. The President's military agenda has been formally rejected through the democratic process. This is either a constitutional moment or a crisis of executive authority, depending on who is speaking."
 eotg_nc_flavor_0011_opt_respect:0 "Respect the Senate's constitutional authority."
 eotg_nc_flavor_0011_opt_pressure:0 "Apply political pressure to reverse the vote."
 eotg_nc_flavor_0011_opt_emergency:0 "Invoke emergency powers to bypass the Senate."

 eotg_nc_flavor_0012_title:0 "The Executive Override"
 eotg_nc_flavor_0012_desc:0 "Emergency powers are now active. The President has formally bypassed the Senate's authority. The legal basis is defensible. The political implications are severe. How extensively these powers are used will determine whether this is a temporary measure or something else."
 eotg_nc_flavor_0012_opt_limited:0 "Use only the minimum powers required. Return authority quickly."
 eotg_nc_flavor_0012_opt_full:0 "Invoke full executive override. Do what needs to be done."
 eotg_nc_flavor_0012_opt_promise:0 "Publicly promise this will be temporary."

 eotg_nc_flavor_0013_title:0 "The Senate's Outrage"
 eotg_nc_flavor_0013_desc:0 "Senators are not merely unhappy — they are organizing their response to what they call executive overreach. Formal censure motions are being drafted. Some speak of impeachment. The President must respond to institutional resistance."
 eotg_nc_flavor_0013_opt_reassure:0 "Reassure the Senate that democratic norms will be restored."
 eotg_nc_flavor_0013_opt_threaten:0 "Threaten political consequences for continued opposition."
 eotg_nc_flavor_0013_opt_arrest:0 "Arrest the most extremist opposition voices."

 eotg_nc_flavor_0014_title:0 "Secession Threat"
 eotg_nc_flavor_0014_desc:0 "A State government has gone beyond rhetoric: their legislature has passed a formal resolution declaring intent to withdraw from the republic if certain conditions are not met. The declaration is unprecedented. The precedent it would set is catastrophic."
 eotg_nc_flavor_0014_opt_negotiate:0 "Negotiate autonomy arrangements to pull them back."
 eotg_nc_flavor_0014_opt_threaten:0 "Make clear there will be federal consequences."
 eotg_nc_flavor_0014_opt_concede:0 "Concede the demanded terms to preserve unity."

 eotg_nc_flavor_0015_title:0 "Falling Approval"
 eotg_nc_flavor_0015_desc:0 "The polling numbers are unambiguous: public confidence in presidential leadership has collapsed. Citizens cite failed wars, scandals, economic decline, and broken promises as their reasons. The President must find a way to recover — or accept governing from weakness."
 eotg_nc_flavor_0015_opt_address:0 "Address the public directly with a major speech."
 eotg_nc_flavor_0015_opt_blameriva:0 "Redirect public anger toward political rivals."
 eotg_nc_flavor_0015_opt_reform:0 "Promise sweeping reform to regain public trust."

 eotg_nc_flavor_0016_title:0 "The Investigative Report"
 eotg_nc_flavor_0016_desc:0 "Investigative journalists have published an exhaustive report on executive misconduct — corruption networks, abuse of emergency powers, Senate vote-buying, and personal enrichment. The report is detailed. It is accurate. It is spreading rapidly."
 eotg_nc_flavor_0016_opt_suppress:0 "Suppress the story before it spreads further."
 eotg_nc_flavor_0016_opt_respond:0 "Respond publicly and transparently to the allegations."
 eotg_nc_flavor_0016_opt_destroyrep:0 "Destroy the journalists' credibility before they destroy yours."
