l_english:
 # ── Gob-Corp Flavor Events: 0017–0019 ────────────────────────────────────────
 eotg_gobcorp_flavor_0017_title:0 "Market Concessions Demanded"
 eotg_gobcorp_flavor_0017_desc:0 "A Trade Prince has formally requested favorable market terms — lower extraction fees, preferential contract routing, and exemption from the standard board review. The request comes wrapped in the language of partnership, but the message is clear: they expect accommodation."
 eotg_gobcorp_flavor_0017_opt_grant:0 "Grant the concessions. Their cooperation is worth more."
 eotg_gobcorp_flavor_0017_opt_negotiate:0 "Counter-propose. Terms are always negotiable."
 eotg_gobcorp_flavor_0017_opt_refuse:0 "Refuse. No vassal dictates terms to the Director-General."

 eotg_gobcorp_flavor_0018_title:0 "The Outer Combine Speaks"
 eotg_gobcorp_flavor_0018_desc:0 "Representatives from the outer shareholders have filed a formal complaint: decisions that affect their sectors are being made without their input. The inner board, they argue, is no longer representative of the Combine's full holdings. They want seats. They want visibility. They want in."
 eotg_gobcorp_flavor_0018_opt_include:0 "Bring the outer shareholders into the inner circle."
 eotg_gobcorp_flavor_0018_opt_token:0 "Reassign a token board seat. Enough to quiet them."
 eotg_gobcorp_flavor_0018_opt_ignore:0 "The inner board exists for a reason. They earn their place or they do not."

 eotg_gobcorp_flavor_0019_title:0 "The Board Calls for Accountability"
 eotg_gobcorp_flavor_0019_desc:0 "A Trade Prince has raised a challenge in open session: the Director-General's recent operational decisions have produced suboptimal returns. The accusation lands in the boardroom like a dropped ledger. Eyes turn to you. The quarterly numbers are waiting."
 eotg_gobcorp_flavor_0019_opt_prove:0 "Publish the full ledger. The numbers speak for themselves."
 eotg_gobcorp_flavor_0019_opt_silence:0 "Pay them. A dissatisfied shareholder is a manageable risk."
 eotg_gobcorp_flavor_0019_opt_crush:0 "Challenge dismissed. Question the board again and face consequences."

 # ── Corporation Flavor Events: 0016–0018 ─────────────────────────────────────
 eotg_corp_flavor_0016_title:0 "Priority Allocation Requested"
 eotg_corp_flavor_0016_desc:0 "A Director has submitted a formal requisition: their division requires priority access to corporate resources — capital, personnel, and logistics bandwidth. The request is documented and procedurally correct. Whether it deserves approval is another matter."
 eotg_corp_flavor_0016_opt_fund:0 "Fund the division. Loyalty is an investment."
 eotg_corp_flavor_0016_opt_partial:0 "A partial allocation. Nobody gets everything they ask for."
 eotg_corp_flavor_0016_opt_deny:0 "Denied. Resource queues exist for a reason."

 eotg_corp_flavor_0017_title:0 "The Junior Directors Petition"
 eotg_corp_flavor_0017_desc:0 "A coalition of Junior Directors has submitted a formal petition for executive board representation. They argue that decisions affecting their divisions are made without their knowledge or consent. The petition is organized, professionally worded, and carries twenty-three signatures."
 eotg_corp_flavor_0017_opt_grant:0 "Grant limited board representation. Inclusion is cheaper than rebellion."
 eotg_corp_flavor_0017_opt_assign:0 "Give them visible projects. Let them prove themselves first."
 eotg_corp_flavor_0017_opt_dismiss:0 "The board earns its seats. This petition is denied."

 eotg_corp_flavor_0018_title:0 "A Performance Audit is Called"
 eotg_corp_flavor_0018_desc:0 "A Director has publicly called for an independent audit of the CEO's recent decisions, citing a pattern of underperformance and inadequate consultation with the executive tier. The call has reached the press. Silence is no longer an option."
 eotg_corp_flavor_0018_opt_publish:0 "Release the performance data. Transparency is its own defense."
 eotg_corp_flavor_0018_opt_review:0 "Commission an independent review. A controlled audit is better than a hostile one."
 eotg_corp_flavor_0018_opt_shut_down:0 "The CEO answers to no Director. Shut the audit down."

 # ── New Cauldron Flavor Events: 0017–0019 ────────────────────────────────────
 eotg_nc_flavor_0017_title:0 "A Senator Seeks Your Endorsement"
 eotg_nc_flavor_0017_desc:0 "A Senator from one of the founding member-states has requested a private meeting. Their bill — a framework for expanded infrastructure spending in the outer districts — has stalled in committee. They believe a public Presidential endorsement would break the deadlock. The request comes with the unspoken implication that future support is reciprocal."
 eotg_nc_flavor_0017_opt_endorse:0 "Endorse the bill. Political capital earns political capital."
 eotg_nc_flavor_0017_opt_conditional:0 "Conditional support. The bill passes only if amended."
 eotg_nc_flavor_0017_opt_distance:0 "The Presidency does not take sides in Senate business."

 eotg_nc_flavor_0018_title:0 "The Outer States Demand Representation"
 eotg_nc_flavor_0018_desc:0 "A coalition of outer member-states has formally petitioned the Senate to reexamine representational apportionment. Their argument is straightforward: their populations have grown, their contributions to the economy have grown, but their Senate seats have not. They want reform. They want it now."
 eotg_nc_flavor_0018_opt_reform:0 "Convene a constitutional review. Every voice deserves a seat."
 eotg_nc_flavor_0018_opt_study:0 "Commission a representational study. Change takes time and evidence."
 eotg_nc_flavor_0018_opt_deny:0 "The Senate apportionment is established. This petition is out of order."

 eotg_nc_flavor_0019_title:0 "A Senator Questions Your Fitness"
 eotg_nc_flavor_0019_desc:0 "In an open Senate session, a Senator has raised a formal question of presidential capacity — citing what they describe as a pattern of poor decisions, missed opportunities, and declining public confidence. The speech has been reprinted in three broadsheets. The Senate floor is watching."
 eotg_nc_flavor_0019_opt_record:0 "Release the full record of this administration. Let the people judge."
 eotg_nc_flavor_0019_opt_debate:0 "Challenge them to a public debate. Democracy runs on argument."
 eotg_nc_flavor_0019_opt_authority:0 "Use executive authority to end this challenge before it spreads."

 # ── Fringe Flavor Events: 0030–0032 ──────────────────────────────────────────
 eotg_fringe_0030_title:0 "The Captain Wants Better Iron"
 eotg_fringe_0030_desc:0 "One of the captains has brought their crew's concerns directly to you: the equipment is old, the weapons are failing, and the last three raids cost more than they took in. They want funding, or at least a promise of first pick from the next conquest. They are not wrong. A poorly-equipped crew is a dead crew."
 eotg_fringe_0030_opt_fund:0 "Fund the upgrade. Better tools make better raiders."
 eotg_fringe_0030_opt_spoils:0 "Promise them first pick of the next conquest."
 eotg_fringe_0030_opt_refuse:0 "They outfit themselves or they do not raid. That is the Fringe way."

 eotg_fringe_0031_title:0 "The Crew Counts What They Are Owed"
 eotg_fringe_0031_desc:0 "The grievance has been spreading through the lower decks for weeks before it reached you: a substantial share of the last raid's spoils, they claim, was never distributed fairly. Names are being named. Records are being compared. The numbers do not agree with each other. Someone is lying. The only question is who."
 eotg_fringe_0031_opt_pay:0 "Pay what is owed. A raider with a grudge is a liability."
 eotg_fringe_0031_opt_investigate:0 "Investigate. If the claim holds, you act. If it does not, they face consequences."
 eotg_fringe_0031_opt_example:0 "Make an example. Complaints are contagious."

 eotg_fringe_0032_title:0 "The Captain Calls You Out"
 eotg_fringe_0032_desc:0 "In front of their crew and yours, a captain has said the words that cannot be unsaid: that you are slow, soft, and no longer fit to lead the Fringe. They said it loud enough to be heard across two docking bays. The silence that followed was the loudest thing you have heard in years. Everyone is watching what happens next."
 eotg_fringe_0032_opt_accept:0 "Accept the challenge. The Fringe answers questions with blood."
 eotg_fringe_0032_opt_flog:0 "Have them flogged in front of their crew."
 eotg_fringe_0032_opt_command:0 "Give them command of the vanguard. Channel ambition into usefulness."

 # ── PMC Flavor Events: 0015–0017 ─────────────────────────────────────────────
 eotg_pmc_flavor_0015_title:0 "An Operator Wants More"
 eotg_pmc_flavor_0015_desc:0 "A senior operator has filed a formal request for reclassification and hazard pay adjustment. The request cites deployment frequency, casualty exposure, and market rate comparisons with competing firms. The paperwork is impeccable. The precedent it sets is the real concern."
 eotg_pmc_flavor_0015_opt_promote:0 "Promote and pay them. Experienced operators are a finite resource."
 eotg_pmc_flavor_0015_opt_partial:0 "A partial raise. Performance bonus, not a promotion."
 eotg_pmc_flavor_0015_opt_deny:0 "Contracts are fixed. If they do not like the terms, they can leave."

 eotg_pmc_flavor_0016_title:0 "The Operators Petition for Better Terms"
 eotg_pmc_flavor_0016_desc:0 "A collective petition from junior operators has reached your desk. They are requesting improved contract terms: shorter deployment rotations, clarified hazard thresholds, and guaranteed medical coverage beyond the standard package. The petition has been signed by a significant portion of your operational workforce."
 eotg_pmc_flavor_0016_opt_renegotiate:0 "Renegotiate. A better contract is a better operator."
 eotg_pmc_flavor_0016_opt_review:0 "Case-by-case review. Merit determines contract adjustments."
 eotg_pmc_flavor_0016_opt_dismiss:0 "The petition is denied. Market rates are what they are."

 eotg_pmc_flavor_0017_title:0 "Your Tactics Are Being Questioned"
 eotg_pmc_flavor_0017_desc:0 "A senior operator has filed a formal after-action dispute challenging the Contractor-General's recent operational decisions. The document is detailed, technical, and professionally damaging. It has already circulated to three division commanders. The question is no longer whether you respond — it is how."
 eotg_pmc_flavor_0017_opt_defend:0 "Defend the record. Every operation had a reason."
 eotg_pmc_flavor_0017_opt_review:0 "Convene an after-action review. Even the best generals update their doctrine."
 eotg_pmc_flavor_0017_opt_terminate:0 "Terminate the operator's contract. Insubordination is not a service value."

 # ── Elven Monarchy Flavor Events: 0016–0018 ──────────────────────────────────
 eotg_elven_flavor_0016_title:0 "A Petition for Holdings"
 eotg_elven_flavor_0016_desc:0 "A court noble has submitted a formal petition for a grant of unclaimed planetary holdings at the edge of the domain. The lands are unused. The noble's house is old and loyal. The petition itself is procedurally flawless. Whether to reward it is a question of strategy as much as tradition."
 eotg_elven_flavor_0016_opt_grant:0 "Grant the petition. A loyal noble is worth more than unclaimed territory."
 eotg_elven_flavor_0016_opt_lesser:0 "Grant a lesser title. What is given can always be refined."
 eotg_elven_flavor_0016_opt_decline:0 "Decline. The Eternal Court does not redistribute holdings lightly."

 eotg_elven_flavor_0017_title:0 "The Old Blood Remembers"
 eotg_elven_flavor_0017_desc:0 "An ancient noble house has presented formal documentation of titles lost during the wars before the Grip. They claim ancestral rights to holdings now administered by another — and they have brought the seals, the genealogical records, and the ritual proofs required by Eternal Court doctrine. The claim is old. It is not necessarily wrong."
 eotg_elven_flavor_0017_opt_acknowledge:0 "Acknowledge the claim. Memory is the foundation of elven legitimacy."
 eotg_elven_flavor_0017_opt_ceremonial:0 "Grant ceremonial recognition without material concessions."
 eotg_elven_flavor_0017_opt_dismiss:0 "Old claims have no standing. The Eternal Court rules the present, not the past."

 eotg_elven_flavor_0018_title:0 "A Challenge to Eternal Court Doctrine"
 eotg_elven_flavor_0018_desc:0 "A court noble has circulated a formal doctrinal objection, arguing that several recent governance decisions deviate from established Eternal Court precepts. The document is careful, scholarly, and deeply inconvenient. It has been read by every senior counselor in the court. A response is expected."
 eotg_elven_flavor_0018_opt_defend:0 "Defend the governance record. Doctrine is a guide, not a cage."
 eotg_elven_flavor_0018_opt_review:0 "Commission a doctrinal review. Let the Eternal Court itself answer."
 eotg_elven_flavor_0018_opt_silence:0 "Silence the noble. The Sovereign is the Eternal Court's highest expression."

 # ── Cartel Flavor Events: 0017–0019 ──────────────────────────────────────────
 eotg_cartel_flavor_0017_title:0 "A Boss Wants Your Guarantee"
 eotg_cartel_flavor_0017_desc:0 "A territorial Boss has sent word: a rival network is pressing against their borders and they want the Underlord's personal guarantee of protection. Not enforcers. Not a shipment of weapons. Your word. In the cartel, your word is the only currency that never inflates."
 eotg_cartel_flavor_0017_opt_guarantee:0 "Guarantee their sector. Loyalty flows from protection."
 eotg_cartel_flavor_0017_opt_enforcers:0 "Send enforcers instead. Let them handle the problem themselves."
 eotg_cartel_flavor_0017_opt_refuse:0 "Bosses hold their own territory. That is the deal."

 eotg_cartel_flavor_0018_title:0 "The Enforcer Who Already Rules"
 eotg_cartel_flavor_0018_desc:0 "An ambitious enforcer has been operating their sector with the authority of a Boss for longer than anyone cares to formally acknowledge. Now they have stopped pretending. They want the title. They have brought their lieutenants. They have made it clear they will continue ruling the sector regardless — the only question is whether you recognize it or contest it."
 eotg_cartel_flavor_0018_opt_grant:0 "Grant the title. Better to make them a vassal than a rival."
 eotg_cartel_flavor_0018_opt_position:0 "Offer them a position without independence. Keep them close."
 eotg_cartel_flavor_0018_opt_example:0 "Make an example of them before others get ideas."

 eotg_cartel_flavor_0019_title:0 "The Network Is Watching"
 eotg_cartel_flavor_0019_desc:0 "A territorial Boss has said openly — in front of their lieutenants, in front of couriers who will carry it everywhere — that the Underlord no longer controls the network. They said it without drawing a weapon. They did not need to. The question has been asked. The whole cartel is listening for your answer."
 eotg_cartel_flavor_0019_opt_bluff:0 "Call their bluff publicly. Let the network see who blinks."
 eotg_cartel_flavor_0019_opt_demonstration:0 "Arrange a private demonstration of what happens to doubters."
 eotg_cartel_flavor_0019_opt_crush:0 "Crush them. Doubt is a disease and this is the cure."
