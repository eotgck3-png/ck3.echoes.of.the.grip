l_english:
 # ── PMC Expanded Modifier Names ────────────────────────────────────────────────
 eotg_pmc_active_contract:0 "Active Contract"
 eotg_pmc_active_contract_desc:0 "The PMC is currently engaged under a military services contract. Revenue flows — and so do obligations."
 eotg_pmc_operator_discontent:0 "Operator Discontent"
 eotg_pmc_operator_discontent_desc:0 "Operators are unhappy with their compensation, command decisions, or conditions. Loyalty is becoming a negotiable commodity."
 eotg_pmc_elite_unit:0 "Elite Unit"
 eotg_pmc_elite_unit_desc:0 "A legendary PMC unit has emerged from the campaigns. Their reputation precedes them — and their effectiveness reflects on the entire organization."
 eotg_pmc_war_profits:0 "War Profits"
 eotg_pmc_war_profits_desc:0 "Active contracts are generating exceptional returns. The machinery of organized violence is very profitable when running efficiently."

 # ── PMC Expanded Events ────────────────────────────────────────────────────────
 eotg_pmc_flavor_0001_title:0 "The Contract Offer"
 eotg_pmc_flavor_0001_desc:0 "A messenger arrives bearing terms: a foreign power wishes to retain military services for an upcoming campaign. The payment is substantial. The obligations are significant. This is the core of what the PMC exists to do."
 eotg_pmc_flavor_0001_opt_accept:0 "Accept the contract."
 eotg_pmc_flavor_0001_opt_negotiate:0 "Negotiate for better terms first."
 eotg_pmc_flavor_0001_opt_reject:0 "Decline the offer."

 eotg_pmc_flavor_0002_title:0 "Payment Delayed"
 eotg_pmc_flavor_0002_desc:0 "The client has missed the contracted payment schedule. Their envoy offers explanations — 'temporary cash flow difficulties,' 'administrative delays,' 'circumstances beyond our control.' The operators notice when payday doesn't arrive."
 eotg_pmc_flavor_0002_opt_demand:0 "Demand immediate payment or consequences."
 eotg_pmc_flavor_0002_opt_continue:0 "Continue operations and absorb the delay."
 eotg_pmc_flavor_0002_opt_seize:0 "Seize client assets as compensation."

 eotg_pmc_flavor_0003_title:0 "Terms Violated"
 eotg_pmc_flavor_0003_desc:0 "The client has violated the agreement — in ways that are both specific and undeniable. They know what they did. The PMC knows what they did. The question now is what recourse a military contractor takes when a client breaks their word."
 eotg_pmc_flavor_0003_opt_enforce:0 "Enforce the contract militarily."
 eotg_pmc_flavor_0003_opt_negotiate:0 "Negotiate a settlement."
 eotg_pmc_flavor_0003_opt_abandon:0 "Terminate the contract and walk away."

 eotg_pmc_flavor_0004_title:0 "The Pay Dispute"
 eotg_pmc_flavor_0004_desc:0 "Operators are talking. The complaints are circulating through the ranks: the pay is inadequate for the risks being taken, the conditions are worse than promised, the leadership seems indifferent to their welfare. Discontent has a momentum of its own."
 eotg_pmc_flavor_0004_opt_increase:0 "Increase compensation immediately."
 eotg_pmc_flavor_0004_opt_promise:0 "Promise substantial future bonuses."
 eotg_pmc_flavor_0004_opt_threaten:0 "Make it clear that discontent is insubordination."

 eotg_pmc_flavor_0005_title:0 "The Veterans Speak"
 eotg_pmc_flavor_0005_desc:0 "Veteran operators — people who have bled for this organization across multiple campaigns — have begun openly questioning command decisions. Their criticism is specific, technical, and uncomfortably accurate. They are not speaking quietly."
 eotg_pmc_flavor_0005_opt_listen:0 "Listen seriously and incorporate their feedback."
 eotg_pmc_flavor_0005_opt_punish:0 "Discipline the dissenters publicly."
 eotg_pmc_flavor_0005_opt_replace:0 "Replace senior officers with more compliant personnel."

 eotg_pmc_flavor_0006_title:0 "The Legendary Unit"
 eotg_pmc_flavor_0006_desc:0 "Word has spread through the ranks: one PMC unit distinguished itself beyond all expectations in the last campaign. Operators speak of them with something approaching reverence. Their reputation is an asset — and a potential complication."
 eotg_pmc_flavor_0006_opt_reward:0 "Reward the unit formally and materially."
 eotg_pmc_flavor_0006_opt_propaganda:0 "Use them for organizational propaganda and recruitment."
 eotg_pmc_flavor_0006_opt_control:0 "Maintain tight control over their public presence."

 eotg_pmc_flavor_0007_title:0 "Discipline Breaks Down"
 eotg_pmc_flavor_0007_desc:0 "The command structure is fraying. Operators ignore orders they disagree with. Units act independently. The chain of command exists on paper only. A military force without discipline is not a force — it is a liability."
 eotg_pmc_flavor_0007_opt_brutal:0 "Reimpose discipline through brutal enforcement."
 eotg_pmc_flavor_0007_opt_reform:0 "Reform training standards to address root causes."
 eotg_pmc_flavor_0007_opt_ignore:0 "Ignore it. They still fight well enough."

 eotg_pmc_flavor_0008_title:0 "The Looting"
 eotg_pmc_flavor_0008_desc:0 "Following a successful campaign, operators have begun systematically looting conquered territory — civilian property, civilian goods, anything of value. They haven't asked permission. They haven't received it. It is already underway."
 eotg_pmc_flavor_0008_opt_allow:0 "Allow it. Victory has its rewards."
 eotg_pmc_flavor_0008_opt_punish:0 "Punish those responsible and return what can be returned."
 eotg_pmc_flavor_0008_opt_organize:0 "Organize the looting. Make it an official operation."

 eotg_pmc_flavor_0009_title:0 "Expanded Objectives"
 eotg_pmc_flavor_0009_desc:0 "The client has delivered new instructions: the original contract scope is insufficient. They want more — more territory secured, more operations conducted, more capacity committed. They expect this without renegotiating the original payment terms."
 eotg_pmc_flavor_0009_opt_accept:0 "Accept the expanded objectives."
 eotg_pmc_flavor_0009_opt_refuse:0 "Refuse. The original contract was the contract."
 eotg_pmc_flavor_0009_opt_morepay:0 "Demand additional payment for expanded work."

 eotg_pmc_flavor_0010_title:0 "The Civilian Dead"
 eotg_pmc_flavor_0010_desc:0 "PMC operations have resulted in civilian casualties — the numbers are disputed, but the bodies are not. Reports are reaching outside authorities. The client is distancing themselves. The operators involved are waiting to see how leadership responds."
 eotg_pmc_flavor_0010_opt_suppress:0 "Suppress the reports before they spread."
 eotg_pmc_flavor_0010_opt_regret:0 "Publicly regret the incident and acknowledge responsibility."
 eotg_pmc_flavor_0010_opt_justify:0 "Justify the violence as militarily necessary."

 eotg_pmc_flavor_0011_title:0 "The Commander's Followers"
 eotg_pmc_flavor_0011_desc:0 "A field commander has been building something that looks increasingly like a personal army. The operators under their command are loyal to the commander — not to the organization, not to the contract, not to the Contractor-General."
 eotg_pmc_flavor_0011_opt_promote:0 "Promote the commander. Their loyalty is an asset."
 eotg_pmc_flavor_0011_opt_reassign:0 "Reassign them to separate them from their followers."
 eotg_pmc_flavor_0011_opt_undermine:0 "Quietly undermine their authority from within."

 eotg_pmc_flavor_0012_title:0 "The Coup Rumors"
 eotg_pmc_flavor_0012_desc:0 "Word has reached the Contractor-General through back channels: senior officers are discussing the possibility of a command change — one that doesn't involve an election or a succession process. The rumors are specific enough to be alarming."
 eotg_pmc_flavor_0012_opt_investigate:0 "Investigate carefully. Find the ringleaders."
 eotg_pmc_flavor_0012_opt_purge:0 "Purge suspected officers before they act."
 eotg_pmc_flavor_0012_opt_loyalists:0 "Elevate loyal officers to counter the threat."

 eotg_pmc_flavor_0013_title:0 "The Profitable War"
 eotg_pmc_flavor_0013_desc:0 "The active contract is generating revenue that exceeds projections. Multiple engagements, extended operations, and favorable contract terms have combined to fill the treasury. This is what success looks like in the PMC business."
 eotg_pmc_flavor_0013_opt_reinvest:0 "Reinvest profits into military expansion."
 eotg_pmc_flavor_0013_opt_operators:0 "Distribute bonuses to operators. Buy their loyalty."
 eotg_pmc_flavor_0013_opt_enrich:0 "Enrich leadership. They earned it."

 eotg_pmc_flavor_0014_title:0 "The Peace Problem"
 eotg_pmc_flavor_0014_desc:0 "Peace is bad for business. Without active contracts, the PMC's revenue has dried up. Operators are idle, equipment is depreciating, and the organization's purpose becomes abstract. Something needs to be done — or the force itself begins to atrophy."
 eotg_pmc_flavor_0014_opt_seekwars:0 "Actively seek new conflicts to contract into."
 eotg_pmc_flavor_0014_opt_downsize:0 "Downsize the force to match reduced revenue."
 eotg_pmc_flavor_0014_opt_manufacture:0 "Create instability elsewhere to generate demand."
