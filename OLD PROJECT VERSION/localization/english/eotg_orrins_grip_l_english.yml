l_english:
 # ═══════════════════════════════════════════════════════════════════════════════
 # THE WEIGHT OF 866 — opening story cycle localization
 #
 # Three framing events, fired five days into every campaign. This is the mod's
 # first impression: the cataclysm behind the setting, the migration still under
 # way, and the war that has just caught light.
 #
 # LORE DISCIPLINE: the Grip is 866 years past — history, not living memory. The
 # eotg_grip_survivor trait is bloodline heritage, never personal experience. The
 # Titans are Orrin (Void) and Yu (Dream), and they are still at war somewhere out
 # in the dark. There is no Galactic League at this date, and no arbitrator of any
 # kind — that is the whole texture of the era.
 # ═══════════════════════════════════════════════════════════════════════════════

 # ── eotg_orrins_grip.0001 — the cataclysm ────────────────────────────────────
 eotg_orrins_grip_0001_title:0 "The Weight of the Grip"
 eotg_orrins_grip_0001_desc:0 "Eight hundred and sixty-six years.\n\nThat is the distance between this court and Orrin's Grip — the tunnel torn through the hells, the sundering of two planes, the hour that ended the Second Era and began the one you are standing in. No one alive remembers it. Everyone alive lives inside its consequences.\n\nThe stars overhead are not the stars your ancestors charted. The gods that answered them answer faintly now, or not at all. And somewhere past every map anyone has drawn, Orrin and Yu are still at war — Void against Dream, indifferent to the fact that the ground they broke is where the rest of us have had to build.\n\nEight hundred and sixty-six years is long enough that the Grip has become history. It is not nearly long enough for it to have become past."
 eotg_orrins_grip_0001_desc_survivor:0 "Eight hundred and sixty-six years, and your blood still keeps the account.\n\nThe line you come from was standing when the tunnel opened — through the sundering, through the hells that came through it, through everything the Second Era's ending asked of the people who were there. You did not witness it. You are made of the people who did, and something of what it cost them was set down in the bone and passed along.\n\nThe archivists call it heritage. It reads more like a debt whose original creditor is long dead.\n\nOrrin and Yu war on out in the dark, no closer to a resolution than the day they broke the sky. Your ancestors endured that. The inheritance is that you are expected to endure whatever this era brings."
 eotg_orrins_grip_0001_opt_reflect:0 "Sit with what was lost. It deserves that much."
 eotg_orrins_grip_0001_opt_steel:0 "The past is fuel. Let it burn for something."

 # ── eotg_orrins_grip.0002 — the ongoing Exodus ───────────────────────────────
 eotg_orrins_grip_0002_title:0 "The Fleets Still Come"
 eotg_orrins_grip_0002_desc:0 "Seven hundred and thirty-five years ago, Mikey the Great's people crashed into the ruins of a dead capital, named the mountains around the wreck a cauldron, and started again.\n\nThe fleets that followed them have never stopped.\n\nThe Titanworld is not dead. It is only, year on year, a little less survivable — and so the ships keep coming, as they have every season since 131 AG. Whole cultures in some holds. In most, whoever reached a hull in time. They arrive carrying their faiths, their trades, their feuds, and an entirely reasonable expectation that somewhere in settled space there is a port that will have them.\n\nYour harbormasters report sails inbound. They are asking what the standing policy is, which is a polite way of asking whether you have one."
 eotg_orrins_grip_0002_opt_open:0 "Open the ports. The fleets talk to each other."
 eotg_orrins_grip_0002_opt_harden:0 "Harden the pickets. Charity invites chaos."
 eotg_orrins_grip_0002_opt_watch:0 "Watch the skies and decide when they arrive."

 # ── eotg_orrins_grip.0003 — the Cluster Wars ignite ──────────────────────────
 eotg_orrins_grip_0003_title:0 "The Clusters Burn"
 eotg_orrins_grip_0003_desc:0 "Sixteen years ago, four powers reached for the Myr Clusters in the same decade, and the fires they lit there have not gone out.\n\nThe Elrossi Imperium fights through the Prince of Myr, keeping the blood a comfortable distance from its own cathedrals. New Cauldron's mercenary legions are under contract to more sides than their own senate can account for. The Gob-Ogre Trade League moves corporate armies in behind its survey ships. The Coldiron Caliphate advances, and calls the advance holy.\n\nNone of them has declared a general war. All of them are fighting one.\n\nThere is no League to arbitrate this, no shared law, no neutral power that could compel anybody to stop. That will not exist for another eight centuries. Whatever happens in the Myr Clusters happens because someone with ships made it happen — which is the condition of this entire era, stated plainly."
 eotg_orrins_grip_0003_desc_involved:0 "Sixteen years ago the Myr Clusters caught light, and your realm is standing in the fire.\n\nFour powers are contesting those stars — the Elrossi Imperium through its Prince of Myr, New Cauldron through legions it rents to all comers, the Trade League behind its survey fleets, the Coldiron Caliphate under holy colors. Not one of them has declared a general war. Every one of them is fighting one, and your name is on their maps.\n\nThere is no League to appeal to. No arbitrator, no shared law, no power that can order any of this stopped — that machinery is eight centuries from existing. In the Clusters there is what you hold, what you can take, and what someone else can take from you.\n\nThe fires are early yet. Early enough to be fed, or starved."
 eotg_orrins_grip_0003_opt_opportunity:0 "The Clusters are opportunity. Sharpen the blades."
 eotg_orrins_grip_0003_opt_peace:0 "The peace must hold. Someone has to keep their head."
 eotg_orrins_grip_0003_opt_distance:0 "Distant fires warm no one. Tend our own realm."
