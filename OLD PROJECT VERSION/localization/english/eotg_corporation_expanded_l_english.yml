l_english:
 # ── Corporation Expanded Modifier Names ───────────────────────────────────────
 eotg_corporation_financial_sabotage:0 "Financial Sabotage"
 eotg_corporation_financial_sabotage_desc:0 "Revenue streams have been deliberately disrupted. The damage looks accidental — but it is not."
 eotg_corporation_exposed_schemer:0 "Exposed Schemer"
 eotg_corporation_exposed_schemer_desc:0 "Evidence of corporate sabotage has surfaced. Reputation suffers while rivals circle."
 eotg_corporation_pr_crisis:0 "PR Crisis"
 eotg_corporation_pr_crisis_desc:0 "Public confidence in corporate leadership has collapsed. Image repair is urgently needed."

 # ── Corporation Expanded Events ───────────────────────────────────────────────
 eotg_corp_flavor_0001_title:0 "Financial Irregularities Detected"
 eotg_corp_flavor_0001_desc:0 "A rival executive's division reports massive, unexplained losses. The numbers don't add up. Someone has been systematically bleeding their accounts dry — and the evidence trail is surprisingly easy to follow, if one knows where to look."
 eotg_corp_flavor_0001_opt_leak:0 "Leak the information publicly."
 eotg_corp_flavor_0001_opt_blackmail:0 "Use it for private leverage."
 eotg_corp_flavor_0001_opt_profit:0 "Quietly profit from their collapse."

 eotg_corp_flavor_0002_title:0 "Systems Failure"
 eotg_corp_flavor_0002_desc:0 "Corporate infrastructure across a rival's holdings has begun failing in suspiciously coordinated ways — logistics networks, communication arrays, supply chain systems. Either the universe has a grudge, or someone is very skilled."
 eotg_corp_flavor_0002_opt_escalate:0 "Escalate. Press the advantage."
 eotg_corp_flavor_0002_opt_sympathy:0 "Offer public sympathy. Smile publicly."
 eotg_corp_flavor_0002_opt_blameforeign:0 "Blame foreign competitors."

 eotg_corp_flavor_0003_title:0 "The Evidence Points Back"
 eotg_corp_flavor_0003_desc:0 "The sabotage operation has been discovered. Evidence has surfaced — not enough to prove guilt in any court, but more than enough to make the Board ask uncomfortable questions. Someone must answer for this."
 eotg_corp_flavor_0003_opt_deny:0 "Deny everything. Challenge them to prove it."
 eotg_corp_flavor_0003_opt_sacrifice:0 "Sacrifice a subordinate as the scapegoat."
 eotg_corp_flavor_0003_opt_threaten:0 "Publicly threaten whoever brought the accusation."

 eotg_corp_flavor_0004_title:0 "The Price of Support"
 eotg_corp_flavor_0004_desc:0 "Several Regional Directors have delivered the same message through different intermediaries: they require concessions in exchange for continued support of executive leadership. The message is polite. The implication is not."
 eotg_corp_flavor_0004_opt_grant:0 "Grant their demands."
 eotg_corp_flavor_0004_opt_promise:0 "Promise future rewards."
 eotg_corp_flavor_0004_opt_refuse:0 "Refuse. The CEO does not negotiate with subordinates."

 eotg_corp_flavor_0005_title:0 "A Director Speaks Out"
 eotg_corp_flavor_0005_desc:0 "A powerful Regional Director has broken the unwritten rule: they have publicly criticized executive leadership in front of peers. The speech was measured, professional, devastating. The Board watched in silence."
 eotg_corp_flavor_0005_opt_debate:0 "Engage them in public debate."
 eotg_corp_flavor_0005_opt_blackmail:0 "Find leverage and silence them quietly."
 eotg_corp_flavor_0005_opt_remove:0 "Remove them from their position."

 eotg_corp_flavor_0006_title:0 "Eroding Confidence"
 eotg_corp_flavor_0006_desc:0 "Board influence is draining away like water through cracked pipes. Failed initiatives, missed projections, whispered criticism — the executive's authority is being quietly hollowed out from within."
 eotg_corp_flavor_0006_opt_prcampaign:0 "Launch a comprehensive PR campaign."
 eotg_corp_flavor_0006_opt_contracts:0 "Offer lucrative executive contracts to secure loyalty."
 eotg_corp_flavor_0006_opt_threaten:0 "Threaten the dissenters publicly."

 eotg_corp_flavor_0007_title:0 "The Acquisition Offer"
 eotg_corp_flavor_0007_desc:0 "A formal acquisition proposal has been sent to a rival entity — a clinical, precise document outlining terms for the peaceful transfer of assets. The offer is generous. But whether it will be accepted peacefully is another question."
 eotg_corp_flavor_0007_opt_accept:0 "The terms are reasonable. Proceed."
 eotg_corp_flavor_0007_opt_negotiate:0 "Negotiate for better terms."
 eotg_corp_flavor_0007_opt_reject:0 "Reject the offer and escalate."

 eotg_corp_flavor_0008_title:0 "Growth Demands"
 eotg_corp_flavor_0008_desc:0 "The Board has delivered a clear directive: the realm's economic prosperity creates an obligation to expand aggressively. Investors expect returns. Shareholders expect growth. Standing still is not a strategy — it is failure."
 eotg_corp_flavor_0008_opt_pursue:0 "Pursue aggressive acquisition targets."
 eotg_corp_flavor_0008_opt_stability:0 "Focus on consolidation and stability."
 eotg_corp_flavor_0008_opt_manipulate:0 "Manipulate investor expectations."

 eotg_corp_flavor_0009_title:0 "Rumors of Violence"
 eotg_corp_flavor_0009_desc:0 "The rumor circuit has lit up: executives are reportedly hiring professional killers to eliminate business rivals. No one will confirm the allegations. No one will deny them either."
 eotg_corp_flavor_0009_opt_investigate:0 "Investigate quietly."
 eotg_corp_flavor_0009_opt_ignore:0 "Ignore it. This is how business works."
 eotg_corp_flavor_0009_opt_weaponize:0 "Weaponize the rumors against rivals."

 eotg_corp_flavor_0010_title:0 "The Leak"
 eotg_corp_flavor_0010_desc:0 "Confidential internal documents have found their way into unauthorized hands. Strategic plans, communication logs, financial projections — all of it is potentially in play. How the executive responds will determine the damage."
 eotg_corp_flavor_0010_opt_suppress:0 "Suppress the leak aggressively."
 eotg_corp_flavor_0010_opt_blameriva:0 "Blame it on rival corporations."
 eotg_corp_flavor_0010_opt_exploit:0 "Exploit the chaos to weaken rivals."

 eotg_corp_flavor_0011_title:0 "Public Trust Collapse"
 eotg_corp_flavor_0011_desc:0 "The scandals, the rumors, the failures — they have accumulated. Public trust in corporate leadership has fractured. The Board is watching. The media is watching. Everyone is watching. Something must be done."
 eotg_corp_flavor_0011_opt_prcampaign:0 "Launch a massive public relations campaign."
 eotg_corp_flavor_0011_opt_suppress:0 "Suppress the coverage and control the narrative."
 eotg_corp_flavor_0011_opt_blame:0 "Blame rogue employees for the failures."

 eotg_corp_flavor_0012_title:0 "The Charity Gala"
 eotg_corp_flavor_0012_desc:0 "An opportunity presents itself: the corporation could publicly fund humanitarian projects, generating goodwill and positive coverage. The question is whether the gesture is genuine — or simply good business strategy."
 eotg_corp_flavor_0012_opt_genuine:0 "Make a genuine contribution to those in need."
 eotg_corp_flavor_0012_opt_hidden:0 "Structure it as a profit opportunity."
 eotg_corp_flavor_0012_opt_propaganda:0 "Pure image management. Nothing more."

 eotg_corp_flavor_0013_title:0 "The Ambitious Climber"
 eotg_corp_flavor_0013_desc:0 "One executive has been systematically sabotaging colleagues — stealing credit, planting false reports, engineering failures. The practice is working: their career is ascending rapidly. The question is how leadership responds to ruthless talent."
 eotg_corp_flavor_0013_opt_reward:0 "Reward the ruthlessness. Results matter."
 eotg_corp_flavor_0013_opt_punish:0 "Punish them. This behavior corrodes the organization."
 eotg_corp_flavor_0013_opt_encourage:0 "Quietly encourage it among all executives."

 eotg_corp_flavor_0014_title:0 "The Succession Race"
 eotg_corp_flavor_0014_desc:0 "The executive is no longer young. The Board has noticed. Quietly, systematically, the race for the next CEO position has begun. Loyalties are shifting. Alliances are forming. The current executive must decide their role in what comes next."
 eotg_corp_flavor_0014_opt_endorse:0 "Endorse a preferred successor."
 eotg_corp_flavor_0014_opt_sabotage:0 "Sabotage potential rivals for the position."
 eotg_corp_flavor_0014_opt_neutral:0 "Stay neutral. Let the Board decide."

 eotg_corp_flavor_0015_title:0 "Investor Panic"
 eotg_corp_flavor_0015_desc:0 "The treasury is thinning. Word has reached major investors that the corporation may be in financial difficulty. Their confidence — and their capital — is at risk. The executive must act before the panic spreads."
 eotg_corp_flavor_0015_opt_reassure:0 "Reassure investors with confident messaging."
 eotg_corp_flavor_0015_opt_hidenumbers:0 "Hide the numbers until conditions improve."
 eotg_corp_flavor_0015_opt_sacrifice:0 "Sacrifice weaker divisions to protect the core."
