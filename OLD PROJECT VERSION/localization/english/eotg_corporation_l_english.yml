l_english:
 # ── Corporation Government ────────────────────────────────────────────────────
 eotg_corporation_government:0 "Corporation Government"
 eotg_corporation_government_desc:0 "A sleek cyberpunk corporate oligarchy. The CEO rules through Board Influence — a finite political capital spent on wars, major decisions, and holding the Regional Directors in line. When influence runs dry, the Board moves."
 eotg_corporation_government_adjective:0 "Corporate"
 eotg_corporation_government_realm:0 "the Corporation"

 # ── Customizable Localization — Corporation ───────────────────────────────────
 eotg_holding_name_corporation:0 "Corporate Holding"
 eotg_vassal_tier_one_corporation:0 "Account Director"
 eotg_vassal_tier_two_corporation:0 "Operations Chief"
 eotg_vassal_tier_three_corporation:0 "Regional Director"
 eotg_ruler_title_corporation_male:0 "CEO"
 eotg_ruler_title_corporation_female:0 "CEO"
 eotg_realm_name_corporation:0 "[Root.GetPrimaryTitle.GetName]"
 eotg_succession_flavor_corporation:0 "The Board convenes to elect a new CEO."
 eotg_faction_name_corporation:0 "The [Root.GetHouse.GetBaseName] Division"

 # ── Subject Contracts ─────────────────────────────────────────────────────────
 eotg_quarterly_assessment:0 "Quarterly Assessment"
 eotg_quarterly_assessment_desc:0 "The periodic financial report and revenue share submitted to the CEO. Higher assessments fuel corporate growth but breed resentment among Regional Directors."
 eotg_assessment_minimal:0 "Minimal Assessment"
 eotg_assessment_minimal_desc:0 "A token contribution. Keeps the lights on at headquarters."
 eotg_assessment_minimal_short:0 "Minimal"
 eotg_assessment_standard:0 "Standard Assessment"
 eotg_assessment_standard_desc:0 "The expected contribution. Operations are profitable for both parties."
 eotg_assessment_standard_short:0 "Standard"
 eotg_assessment_full:0 "Full Extraction"
 eotg_assessment_full_desc:0 "Maximum revenue extraction. Headquarters profits enormously. Regional Directors do not forget this."
 eotg_assessment_full_short:0 "Full Extraction"

 eotg_corp_security_contribution:0 "Security Contribution"
 eotg_corp_security_contribution_desc:0 "The military assets each division contributes to corporate security operations. Kept deliberately low — the Corporation's military is a corporate asset, not a vassal's burden."
 eotg_corp_security_minimal:0 "Minimal Security"
 eotg_corp_security_minimal_desc:0 "A token force. Headquarters handles most military operations directly."
 eotg_corp_security_minimal_short:0 "Minimal"
 eotg_corp_security_standard:0 "Standard Security"
 eotg_corp_security_standard_desc:0 "Full contribution to corporate security operations."
 eotg_corp_security_standard_short:0 "Standard"

 eotg_corp_board_seat_rights:0 "Board Seat"
 eotg_corp_board_seat_rights_desc:0 "Whether this Regional Director holds a formal seat on the CEO's advisory board. Board members carry greater weight in succession elections and governance proceedings."
 eotg_corp_board_seat_none:0 "No Board Seat"
 eotg_corp_board_seat_none_desc:0 "This vassal holds no formal board position."
 eotg_corp_board_seat_none_short:0 "No Seat"
 eotg_corp_board_seat_granted:0 "Board Seat Granted"
 eotg_corp_board_seat_granted_desc:0 "This Regional Director holds a formal Board Seat, granting them elevated standing in succession elections and governance decisions."
 eotg_corp_board_seat_granted_short:0 "Board Seat"

 eotg_corporation_vassal:0 "Corporate Obligations"
 eotg_corporation_vassal_desc:0 "The standard obligations between a CEO and the Regional Directors of a Corporation government."

 # ── Decisions ─────────────────────────────────────────────────────────────────
 eotg_corporation_vote_no_confidence:0 "Vote of No Confidence"
 eotg_corporation_vote_no_confidence_desc:0 "The CEO's Board Influence has collapsed. The Regional Directors have lost faith. Convene the Board and demand a reckoning."
 eotg_corporation_vote_no_confidence_tooltip:0 "The Board has been notified. The CEO will be confronted."
 eotg_corporation_vote_no_confidence_confirm:0 "Convene the Board"

 eotg_corporate_interference:0 "Corporate Interference"
 eotg_corporate_interference_desc:0 "Before the succession election, spend gold and political capital to suppress a rival Regional Director's vote weight. A very P&D Co move."
 eotg_corporate_interference_tooltip:0 "A target Regional Director will have their election weight suppressed. This may be discovered."
 eotg_corporate_interference_confirm:0 "Execute the interference"

 # ── Scheme ────────────────────────────────────────────────────────────────────
 eotg_sabotage_rival:0 "Sabotage Rival"
 eotg_sabotage_rival_action:0 "Sabotage"
 eotg_sabotage_rival_desc:0 "Undermine a rival Account Director or Operations Chief — sabotage their financial infrastructure, corrupt their subordinates, and leave their division in disarray."
 EOTG_SABOTAGE_RIVAL_SUCCESS_DESC:0 "The operation succeeded. [target.GetTitledFirstName]'s division is compromised."
 EOTG_SABOTAGE_RIVAL_DISCOVERY_DESC:0 "The operation was blown. [target.GetTitledFirstName] knows it was you."
 eotg_sabotage_rival_target_stewardship_defense:0 "[target.GetTitledFirstName] runs a tight operation."
 eotg_sabotage_rival_target_stewardship_high:0 "[target.GetTitledFirstName]'s stewardship is exceptional — almost impenetrable."
 eotg_sabotage_rival_already_undermined:0 "Already undermined — harder to exploit further."

 # ── Scheme Events ─────────────────────────────────────────────────────────────
 eotg_corp_scheme_0001_title:0 "Operation Successful"
 eotg_corp_scheme_0001_desc:0 "The operation concluded cleanly. [target.GetTitledFirstName]'s division is compromised — revenue streams disrupted, subordinates flipped, reputation among peers quietly shredded. They will feel this for years."
 eotg_corp_scheme_0001_opt_success:0 "Excellent work."

 eotg_corp_scheme_0002_title:0 "Operation Blown"
 eotg_corp_scheme_0002_desc:0 "[target.GetTitledFirstName] found out. Someone talked. The operation is burned, and now [target.GetTitledFirstName] holds enough on you to cause serious damage if they choose to use it."
 eotg_corp_scheme_0002_opt_caught:0 "Damage control. Immediately."

 eotg_corp_scheme_0003_title:0 "Operation Aborted"
 eotg_corp_scheme_0003_desc:0 "The operation fell apart before it reached its target. No progress made. No lasting exposure — but time and resources wasted."
 eotg_corp_scheme_0003_opt_failed:0 "Regroup."

 # ── Board Events ──────────────────────────────────────────────────────────────
 eotg_corp_board_0001_title:0 "The Board Is Growing Restless"
 eotg_corp_board_0001_desc:0 "The Board Influence readings are critical. Regional Directors are making noise — small alliances, pointed questions, conspicuously absent from council sessions. Without action, the Vote of No Confidence becomes available to them."
 eotg_corp_board_0001_opt_noted:0 "I need to act quickly."

 eotg_corp_board_0002_title:0 "The Board Has Elected a New CEO"
 eotg_corp_board_0002_desc_winner:0 "The election results are in. The Board has elected you as the new CEO. The weight of the entire Corporation now rests on your shoulders."
 eotg_corp_board_0002_desc_observer:0 "The election results are in. [eotg_election_winner.GetTitledFirstName] carries the majority of the Board's weight. A new CEO emerges from the succession."
 eotg_corp_board_0002_opt_acknowledge:0 "Noted. Adapt accordingly."
 eotg_corp_board_0002_opt_assume_office:0 "The Corporation answers to me now."

 eotg_corp_board_0003_title:0 "Acquisition Complete"
 eotg_corp_board_0003_desc:0 "The deal is done. The Regional Director accepted the terms and stepped aside. The titles transfer cleanly — no war, no blood, just gold and paperwork. Very corporate."
 eotg_corp_board_0003_opt_deal_done:0 "Business concluded."

 eotg_corp_board_0004_title:0 "Acquisition Refused"
 eotg_corp_board_0004_desc:0 "They refused. The offer was fair — they simply do not want to sell. The Proxy War casus belli is now available if you wish to take what they would not sell."
 eotg_corp_board_0004_opt_declare_war:0 "Then we do this the hard way."

 eotg_corp_board_0005_title:0 "The Board Demands Your Resignation"
 eotg_corp_board_0005_desc:0 "The Regional Directors have convened. Your Board Influence is exhausted. They stand united in demanding you step down as CEO. You may leave with dignity — or refuse, and see what happens to CEOs who defy the Board."
 eotg_corp_board_0005_opt_step_down:0 "I step down. The Corporation endures."
 eotg_corp_board_0005_opt_refuse:0 "I built this Corporation. I am not leaving."

 eotg_corp_board_0006_title:0 "The Vote Has Been Called"
 eotg_corp_board_0006_desc:0 "The no-confidence motion is in. The Regional Directors are aligned. The CEO will receive the Board's demand and must choose — yield or resist."
 eotg_corp_board_0006_opt_delivered:0 "The motion has been filed."

 eotg_corp_board_0007_title:0 "Choose Your Target"
 eotg_corp_board_0007_desc:0 "The succession election is coming. Choose a Regional Director to suppress — feed disinformation to their allies, undercut their financial standing before the vote, ensure they do not emerge as the Board's choice."
 eotg_corp_board_0007_opt_target_rival:0 "Target the front-runner."

 eotg_corp_board_0008_title:0 "A Dignified Resignation"
 eotg_corp_board_0008_desc:0 "The CEO has stepped down gracefully. The succession election will proceed in due course. Rare for a Corporation CEO to leave with any dignity intact — but it happened."
 eotg_corp_board_0008_opt_noted:0 "A clean exit."

 eotg_corp_board_0009_title:0 "Corporate Interference Detected"
 eotg_corp_board_0009_desc:0 "Your intelligence networks flagged it. The CEO has been running Corporate Interference against your election prospects — quietly, carefully, and illegally by Board charter. You now hold something over them."
 eotg_corp_board_0009_opt_expose:0 "File this away for the right moment."

 # ── Interface Messages ────────────────────────────────────────────────────────
 eotg_corp_no_confidence_refused_title:0 "The CEO Has Refused to Step Down"
 eotg_corp_no_confidence_refused_desc:0 "The CEO refused the Board's demand. Regional Directors may now initiate Hostile Acquisition or other pressure against headquarters."
 eotg_proxy_war_available_tooltip:0 "The #bold Proxy War# casus belli is now available. War has become a legitimate option."
 eotg_corp_board_influence_critical_tooltip:0 "Board Influence is critically low. Regional Directors may now call a Vote of No Confidence."

 # ── Modifiers ─────────────────────────────────────────────────────────────────
 eotg_corporate_undermined:0 "Corporate Undermined"
 eotg_corporate_undermined_desc:0 "This character's division has been sabotaged. Revenue is disrupted, subordinates are compromised, and reputation among peers is quietly shredded."
 eotg_corp_board_seat:0 "Board Seat"
 eotg_corp_board_seat_desc:0 "This Regional Director holds a formal seat on the CEO's advisory board."
 eotg_corp_interference_suppressed:0 "Election Interference"
 eotg_corp_interference_suppressed_desc:0 "This character's election prospects are being quietly undermined. Their vote weight in the upcoming succession is reduced."
 eotg_corp_full_extraction_active:0 "Full Revenue Extraction"
 eotg_corp_full_extraction_active_desc:0 "Corporate headquarters is extracting maximum revenue from all divisions."

 # ── Opinion Modifiers ─────────────────────────────────────────────────────────
 eotg_sabotage_caught_opinion:0 "Caught Sabotaging Me"

 # ── Casus Belli ───────────────────────────────────────────────────────────────
 eotg_proxy_war:0 "Proxy War"
 EOTG_PROXY_WAR_NAME:0 "Proxy War for [TITLE.GetBaseName]"
 EOTG_PROXY_WAR_NAME_FALLBACK:0 "Proxy War"
 eotg_proxy_war_victory_desc:0 "The proxy war concluded. The disputed titles have changed hands."
 eotg_proxy_war_victory_attacker_desc:0 "The proxy war succeeded. The Regional Director's titles are yours."
 eotg_proxy_war_victory_defender_desc:0 "The proxy war has ended in defeat. Your titles have been taken."
 eotg_proxy_war_defeat_desc:0 "The proxy war ended in defeat for the attacker."
 eotg_proxy_war_defeat_attacker_desc:0 "The proxy war has failed. Your target held their ground."
 eotg_proxy_war_defeat_defender_desc:0 "You repelled the proxy war. Your titles remain yours."
 eotg_proxy_war_white_peace_desc:0 "The proxy war ended without resolution. Both sides return to the negotiating table."
 eotg_proxy_war_invalidated_desc:0 "The proxy war is no longer valid."

 # ── Interactions ──────────────────────────────────────────────────────────────
 eotg_hostile_acquisition_interaction:0 "Hostile Acquisition"
 eotg_hostile_acquisition_interaction_desc:0 "Make [recipient.GetTitledFirstName] a buy-out offer they cannot refuse. Agree: gold changes hands, titles transfer. Refuse: the Proxy War casus belli becomes available."
 eotg_hostile_acquisition_notification:0 "[actor.GetTitledFirstName] is making an acquisition offer."
 eotg_hostile_acquisition_cost_desc:0 "Acquisition payment — scales with their realm size."