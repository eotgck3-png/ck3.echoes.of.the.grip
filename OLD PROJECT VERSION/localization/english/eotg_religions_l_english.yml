l_english:
 # ── eotg_religions_l_english.yml ──────────────────────────────────────────────
 # Adjective, adherent, adherent_plural and description keys for every EOTG
 # religion and faith. CK3 requires all five forms per religion/faith key:
 #   <key>  <key>_adj  <key>_adherent  <key>_adherent_plural  <key>_desc
 # The bare <key> names live in eotg_l_english.yml and eotg_bookmark_chars_l_english.yml
 # — do NOT redefine them here, duplicate keys collide silently.
 #
 # Pantheon per docs/SETTING LORE and its ERRATA block: Yu the Stained (sealed in
 # the Dream) and Orrin the Eye are Titans; Carrigore is the third.
 # NOTE the erratum — the Void was Orrin's prison but no longer holds him; he is
 # in the material plane. The Void still exerts an influence and that influence is
 # UNEXPLAINED. Never write text asserting Orrin is sealed there or speaks through
 # it; in-world attributions to the Eye are belief, not narrated fact.
 # Yu's sons are Elross (light/justice), Bohemut (balance/knowledge) and
 # Malvrick (darkness/void/secrets). Frozt is the elder deity of ice and
 # righteous loss worshipped by the Coldiron Caliphate.
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Religion Families ─────────────────────────────────────────────────────────
 eotg_rf_divine_order_desc:0 "The cosmology of Yu and his sons. Yu the Stained lies sealed in the Dream, so his authority reaches the world only through Elross, Bohemut and Malvrick — light, balance and darkness, each claiming to speak for the same sealed father. Faiths of the Divine Order argue bitterly over which son has the right to. None of them doubts the father is real."
 eotg_rf_titan_worship_desc:0 "The older cosmology, which looks past the sons to the Titans themselves — Yu sealed in the Dream, Orrin the Eye somewhere loose in the world, Carrigore feeding at the edges of it. Its faiths share very little else and would object to being grouped at all. What they hold in common is a refusal to pretend the Grip was anything other than a Titan's work, and a corresponding lack of interest in which son is currently in charge."
 eotg_rf_ancestral_desc:0 "Four peoples who share no pantheon and no scripture, and who arrived independently at the same conviction: that obligation runs backwards through the generations as surely as it runs forwards. The centaurs run with their dead ahead of them, the Broken Daimyo recite their rolls before anything irreversible, the forge halls sign work for people not yet born, and the Warrens will not surrender a depth their grandmothers consecrated. None of them would accept that these are the same idea. They are."
 eotg_rf_pragmatic_desc:0 "The family that declines the question. Since 850 AG it has been difficult to argue in public that the gods do not exist, so these faiths no longer bother — they argue instead that existing is not the same as being owed obedience. What binds a person here is the contract signed, the charter voted, the maintenance log kept current. Their neighbours find this either admirable or blasphemous, and the Codebound have noticed that it depends almost entirely on who is currently winning."

 # ── Faith of Elross ───────────────────────────────────────────────────────────
 eotg_religion_elross_adj:0 "Elrossi"
 eotg_religion_elross_adherent:0 "Elrossi"
 eotg_religion_elross_adherent_plural:0 "Elrossi"
 eotg_religion_elross_desc:0 "Elross, Son of Yu, is the light that survived the Grip. Where his father lies sealed in the Dream, Elross acts — and since 850 AG he has been acting openly, blessing crusaders and marking the unworthy in ways nobody can any longer file under coincidence. His faithful hold that light is not comfort but obligation: justice owed, righteousness enforced, the dark pushed back one system at a time."

 eotg_faith_elross_canonical_adj:0 "Orthodox Elrossi"
 eotg_faith_elross_canonical_adherent:0 "Orthodox Elrossi"
 eotg_faith_elross_canonical_adherent_plural:0 "Orthodox Elrossi"
 eotg_faith_elross_canonical_desc:0 "The Imperium's official reading of Elross, governed from Elyria and enforced wherever the Imperium's writ runs. Orthodoxy holds that the light admits no local variation: one canon, one hierarchy, one ruling on what justice requires. That the Imperium's crusades and Elross's will have never yet been found to differ is, to the orthodox, evidence of alignment rather than of convenience."

 # ── The Profitable Path ───────────────────────────────────────────────────────
 eotg_religion_commerce_adj:0 "Mercantile"
 eotg_religion_commerce_adherent:0 "Bohemite"
 eotg_religion_commerce_adherent_plural:0 "Bohemites"
 eotg_religion_commerce_desc:0 "Bohemut, Son of Yu, keeps the balance his brothers keep trying to tip. His followers hold that equilibrium is not a mood but an accounting — debts settle, knowledge compounds, and a trade struck freely between two parties is a small act of cosmic order. Scholars and merchants read the same scripture and reliably take different lessons from it."

 eotg_faith_commerce_adj:0 "Creed-Sworn"
 eotg_faith_commerce_adherent:0 "Creed-Sworn"
 eotg_faith_commerce_adherent_plural:0 "Creed-Sworn"
 eotg_faith_commerce_desc:0 "The trading houses' working version of Bohemut's balance, with the scholarly half quietly set aside. The Creed teaches that a contract honoured is a prayer completed and a contract broken is blasphemy with interest accruing. It has made its adherents enormously wealthy, which its critics consider the entire argument against it."

 # ── The Plutocracy ────────────────────────────────────────────────────────────
 eotg_religion_plutocracy_adj:0 "Plutocratic"
 eotg_religion_plutocracy_adherent:0 "Hoarder"
 eotg_religion_plutocracy_adherent_plural:0 "Hoarders"
 eotg_religion_plutocracy_desc:0 "The goblins trade alongside the Bohemites, bank with them, and share a federation with them, and they have never once shared their religion. The Profitable Path holds that a fair exchange is a small act of cosmic order. The Plutocracy holds that this is sentimental nonsense — the sacred act is not the exchange but the accumulation, and a sum that stops growing has died. It recognises no god because it does not need one: the Hoard is observable, it answers prayers in proportion to the effort invested, and it has never once required faith."

 eotg_faith_goblin_plutocracy_adj:0 "Goblin Plutocratic"
 eotg_faith_goblin_plutocracy_adherent:0 "Shareholder"
 eotg_faith_goblin_plutocracy_adherent_plural:0 "Shareholders"
 eotg_faith_goblin_plutocracy_desc:0 "As practised in the goblin counting-vaults of the Gob-Ogre Trade League. Worth is measured, publicly and continuously, and a goblin's standing is their ledger — which makes the faith brutally meritocratic, since the ledger does not care who your mother was. Its assessors tax unbelievers as a devotional act, and its congregations have been known to convert wholesale overnight when the numbers favour it. Their trading partners find this alarming. The goblins find the alarm difficult to follow."

 # ── Coldiron Faith ────────────────────────────────────────────────────────────
 eotg_religion_coldiron_adj:0 "Coldiron"
 eotg_religion_coldiron_adherent:0 "Ironbound"
 eotg_religion_coldiron_adherent_plural:0 "Ironbound"
 eotg_religion_coldiron_desc:0 "Frozt teaches through cold and through loss — not loss as accident, but loss as curriculum: the thing taken from you honestly, which you were never owed, and which leaves you harder for its absence. His warrior-monks hold the frozen reaches and treat comfort as a form of dishonesty. Since 850 AG Frozt has been answering them directly, which they find considerably less surprising than everyone else does."

 eotg_faith_coldiron_adj:0 "Covenant"
 eotg_faith_coldiron_adherent:0 "Covenanter"
 eotg_faith_coldiron_adherent_plural:0 "Covenanters"
 eotg_faith_coldiron_desc:0 "The Caliphate's binding form of Frozt's teaching. Every warrior swears the Covenant, and the Covenant asks for endurance rather than victory — it fights defensively by doctrine and expands only where doctrine permits. The Caliphate's neighbours have learned not to mistake that for passivity. The Covenant remembers the Elrossi crusades in detail."

 # ── Faith of the Great Run ────────────────────────────────────────────────────
 eotg_religion_stampede_adj:0 "Stampede"
 eotg_religion_stampede_adherent:0 "Herd-Sworn"
 eotg_religion_stampede_adherent_plural:0 "Herd-Sworn"
 eotg_religion_stampede_desc:0 "The centaur faith holds that the dead do not depart — they run ahead. The Great Run is a whole people in motion across generations: ancestors at the front, the unborn somewhere behind, and the living obliged not to break stride. Clan oaths are sworn to the Run rather than to any individual, which is why breaking one is judged a theft from the dead."

 eotg_faith_stampede_adj:0 "Orthodox Stampede"
 eotg_faith_stampede_adherent:0 "Oathrunner"
 eotg_faith_stampede_adherent_plural:0 "Oathrunners"
 eotg_faith_stampede_desc:0 "The Khanate's codified Run, hardened by the War of Broken Hooves into something closer to law than to devotion. Orthodoxy fixes which clans run where, in what order, and under whose oath — questions once settled by custom and now settled by the Mercenary Council. The arrangement holds. Nobody calls it healed."

 # ── Ancestor Veneration ───────────────────────────────────────────────────────
 eotg_religion_ancestor_veneration_adj:0 "Ancestral"
 eotg_religion_ancestor_veneration_adherent:0 "Ancestor-Keeper"
 eotg_religion_ancestor_veneration_adherent_plural:0 "Ancestor-Keepers"
 eotg_religion_ancestor_veneration_desc:0 "Where the gods have been distant, unreliable, or lately far too present, the dead have at least been consistent. Ancestor Veneration asks nothing of the pantheons and everything of lineage: the names are kept, the deeds recited, and a decision judged by whether the people who made you would recognise it. The Grip killed enough ancestors to make the practice urgent."

 eotg_faith_ancestor_veneration_adj:0 "Ancestral"
 eotg_faith_ancestor_veneration_adherent:0 "Name-Keeper"
 eotg_faith_ancestor_veneration_adherent_plural:0 "Name-Keepers"
 eotg_faith_ancestor_veneration_desc:0 "The practised form: a household keeps its rolls, recites them at the turning of the year, and consults them before anything irreversible. The Way makes no cosmological claim it cannot support — which its adherents consider its principal virtue in an age when the gods have started answering."

 # ── Void Reverence ────────────────────────────────────────────────────────────
 eotg_religion_void_reverence_adj:0 "Void-Reverent"
 eotg_religion_void_reverence_adherent:0 "Voidwalker"
 eotg_religion_void_reverence_adherent_plural:0 "Voidwalkers"
 eotg_religion_void_reverence_desc:0 "Malvrick, the son nobody wants, holds darkness and secrets and the Void — which was built to be Orrin's prison, does not hold him any longer, and has not on that account gone quiet. His Voidwalkers were hunted across five centuries and are, officially, extinct. What survived is smaller and quieter and preoccupied with the question the Divine Order has spent 866 years declining to ask: if the cell is empty, what is still speaking out of it?"

 eotg_faith_void_cult_adj:0 "Grip-Reverent"
 eotg_faith_void_cult_adherent:0 "Grip-Touched"
 eotg_faith_void_cult_adherent_plural:0 "Grip-Touched"
 eotg_faith_void_cult_desc:0 "The remnant cult venerates the breach itself — not whatever the orthodox insist was behind it, but the moment the fabric tore and the universe was briefly honest about what it is. Its celebrants argue endlessly over what answers them and have never agreed. Membership is a capital offence across most of settled space. The rifts re-activating since 850 AG have done more for recruitment than a century of preaching."

 # ── The Firstlight ────────────────────────────────────────────────────────────
 eotg_religion_firstlight_adj:0 "Firstlight"
 eotg_religion_firstlight_adherent:0 "Dawnkeeper"
 eotg_religion_firstlight_adherent_plural:0 "Dawnkeepers"
 eotg_religion_firstlight_desc:0 "The elven light-faith, older than the Elrossi canon and unwilling to be absorbed into it. The Firstlight holds that light did not begin with Elross and belongs to no empire's hierarchy — it was first, it was here before the Grip, and it will outlast whoever currently claims to speak for it. The Imperium finds the position irritating rather than heretical, which is largely why it survives."

 eotg_faith_firstlight_adj:0 "Firstlit"
 eotg_faith_firstlight_adherent:0 "Firstlit"
 eotg_faith_firstlight_adherent_plural:0 "Firstlit"
 eotg_faith_firstlight_desc:0 "As kept in the elven realms: dawn observances, unbroken lamps, and a long memory for what was lost when the waters and the rifts came. Its priests teach that the light asks to be tended rather than obeyed — a distinction the Elrossi hierarchy has never accepted and the Firstlit have never stopped making."

 # ── Industrial Survivalism ────────────────────────────────────────────────────
 eotg_religion_survivalism_adj:0 "Survivalist"
 eotg_religion_survivalism_adherent:0 "Survivalist"
 eotg_religion_survivalism_adherent_plural:0 "Survivalists"
 eotg_religion_survivalism_desc:0 "The Grip proved that the universe will not catch you. What caught the survivors was machinery — shelters that held, filters that ran, salvage that could be made to work again. Industrial Survivalism raises that into doctrine: the sacred act is maintenance, the cardinal sin is letting a working thing fail, and a god who needs prayer is less use than a pump that needs a gasket."

 eotg_faith_industrial_survivalism_adj:0 "Creedwright"
 eotg_faith_industrial_survivalism_adherent:0 "Creedwright"
 eotg_faith_industrial_survivalism_adherent_plural:0 "Creedwrights"
 eotg_faith_industrial_survivalism_desc:0 "The Creed as kept in the salvage sectors and the Helix remnants: every hand learns a trade, every trade is owed to the collective, nothing is discarded while it can still be repaired. Its congregations meet in workshops. Its scripture is a maintenance log, and it is read seriously."

 # ── Secular Codes ─────────────────────────────────────────────────────────────
 eotg_religion_secular_codes_adj:0 "Secular"
 eotg_religion_secular_codes_adherent:0 "Codebound"
 eotg_religion_secular_codes_adherent_plural:0 "Codebound"
 eotg_religion_secular_codes_desc:0 "Not a denial that the gods exist — since 850 AG that position has become difficult to hold in public — but a refusal to let them hold office. The Codes teach that authority must be written down, bounded, and answerable to people who can read it, and that a power which cannot be audited is owed no obedience regardless of what it is."

 eotg_faith_secular_contract_adj:0 "Contract"
 eotg_faith_secular_contract_adherent:0 "Contract-Sworn"
 eotg_faith_secular_contract_adherent_plural:0 "Contract-Sworn"
 eotg_faith_secular_contract_desc:0 "The mercenary companies' code, and the reason legions get hired by people with every reason to distrust them. The Contract is the whole of the law: terms are met, clients are not betrayed mid-engagement, and a company that breaks either is finished in a profession with a very long memory. Sentiment is not part of the arrangement. Neither is treachery."

 eotg_faith_civic_secular_adj:0 "Civic"
 eotg_faith_civic_secular_adherent:0 "Citizen"
 eotg_faith_civic_secular_adherent_plural:0 "Citizens"
 eotg_faith_civic_secular_desc:0 "New Cauldron's founding conviction, kept for seven centuries: the republic answers to its voters and to nothing standing above them. Civic Secularism treats the franchise itself as the sacred thing — the election held on time, the count observed, the office surrendered when the count says so. Cauldronites will tell you this is remarkable. They are right, and they will tell you again."

 # ── The Forge Tradition ───────────────────────────────────────────────────────
 eotg_religion_forge_tradition_adj:0 "Forge"
 eotg_religion_forge_tradition_adherent:0 "Forgeborn"
 eotg_religion_forge_tradition_adherent_plural:0 "Forgeborn"
 eotg_religion_forge_tradition_desc:0 "Stone endures, and what is worked into stone endures with it. The Forge Tradition venerates foundation over flourish: the hall cut to last, the joint that will still hold in a thousand years, the work signed by a maker who expects to be judged by people not yet born. Its adherents regard haste as a species of cowardice."

 eotg_faith_forge_tradition_adj:0 "Forge-Sworn"
 eotg_faith_forge_tradition_adherent:0 "Forge-Sworn"
 eotg_faith_forge_tradition_adherent_plural:0 "Forge-Sworn"
 eotg_faith_forge_tradition_desc:0 "The working rite of the great industrial holds. A life is measured by what it left standing, a master's marks are kept on record for centuries, and an apprentice inherits an obligation rather than a trade. The ogre foundries and the mountain halls disagree about nearly everything else and have never once disagreed about this."

 # ── Deep Warren Faith ─────────────────────────────────────────────────────────
 eotg_religion_deep_warren_adj:0 "Warren"
 eotg_religion_deep_warren_adherent:0 "Warrenfolk"
 eotg_religion_deep_warren_adherent_plural:0 "Warrenfolk"
 eotg_religion_deep_warren_desc:0 "Down is safety, and down is also where everyone who came before you is. The ratfolk survived the Grip by being underneath it, and they have never entirely stopped treating the sky as a temporary condition — but the deep galleries are not merely shelter. Each one was cut by a named generation, and the names are kept. To go further down is to go further back, past your grandmothers' work into your great-grandmothers', which is why depth is holy and why abandoning a gallery is not a retreat but a desertion."

 eotg_faith_deep_warren_adj:0 "Deepkeeper"
 eotg_faith_deep_warren_adherent:0 "Deepkeeper"
 eotg_faith_deep_warren_adherent_plural:0 "Deepkeepers"
 eotg_faith_deep_warren_desc:0 "The Warrens' codified practice: the deep galleries are consecrated, the shallow ones merely useful, and every settlement maintains a way further down. A Deepkeeper can recite which forebear cut which gallery and in what year, and consults them before any digging — the dead are not asked for blessings so much as for precedent. Doctrine forbids surrendering a consecrated depth, which is why the Warrens have never been taken, and why their isolationism is a matter of scripture rather than of caution."
