l_english:
 # ── Gob-Corp Government ───────────────────────────────────────────────────────
 eotg_gobcorp_government:0 "Gob-Corp Government"
 eotg_gobcorp_government_desc:0 "A Victorian industrial oligarchy built around 50 Trade Princes, their factional market competition, and the precarious authority of the Director-General. Internal politics are as dangerous as external wars."

 # ── Customizable Localization — Gob-Corp ──────────────────────────────────────
 eotg_holding_name_gobcorp:0 "Corporate Holding"
 eotg_vassal_tier_one_gobcorp:0 "Trade Prince"
 eotg_vassal_tier_two_gobcorp:0 "Trade Prince (Senior)"
 eotg_vassal_tier_three_gobcorp:0 "Merchant Lord"
 eotg_ruler_title_gobcorp_male:0 "Director-General"
 eotg_ruler_title_gobcorp_female:0 "Director-General"
 eotg_realm_name_gobcorp:0 "[Root.GetPrimaryTitle.GetName]"
 eotg_succession_flavor_gobcorp:0 "The Board convenes to select a new Director-General."
 eotg_faction_name_gobcorp:0 "The Trade Combine"

 # ── Subject Contracts ─────────────────────────────────────────────────────────
 eotg_market_tithe:0 "Market Tithe"
 eotg_market_tithe_desc:0 "The portion of revenue each Trade Prince submits to the Trade League. Higher extraction yields more gold but strains loyalty and faction allegiance."
 eotg_tithe_minimum:0 "Minimum Contribution"
 eotg_tithe_minimum_short:0 "Min. Tithe"
 eotg_tithe_minimum_desc:0 "A nominal tithe. Relations remain cordial, but the League's coffers see little benefit."
 eotg_tithe_standard:0 "Standard Yield"
 eotg_tithe_standard_short:0 "Std. Tithe"
 eotg_tithe_standard_desc:0 "The expected contribution. Trade Princes grumble but comply."
 eotg_tithe_full:0 "Full Extraction"
 eotg_tithe_full_short:0 "Full Tithe"
 eotg_tithe_full_desc:0 "Maximum extraction. The League profits greatly. The Trade Princes do not forgive easily."

 eotg_corporate_security_levy:0 "Corporate Security Levy"
 eotg_corporate_security_levy_desc:0 "The military contribution each holding provides to the League's corporate security forces. Low by default — military is a corporate expense, not a vassal obligation."
 eotg_levy_standard:0 "Standard Security Obligation"
 eotg_levy_standard_short:0 "Std. Levy"
 eotg_levy_standard_desc:0 "A modest levy. The League provides most of its own military muscle."

 eotg_board_seat_rights:0 "Seat on the Board"
 eotg_board_seat_rights_desc:0 "Whether this vassal holds a formal position on the Director-General's advisory board. Board members carry greater weight in No Confidence proceedings."
 eotg_board_seat_none:0 "No Board Seat"
 eotg_board_seat_none_desc:0 "This vassal holds no formal board position."
 eotg_board_seat_granted:0 "Board Seat Granted"
 eotg_board_seat_granted_desc:0 "This vassal holds a Seat on the Board, granting them formal council standing and increased influence over succession and governance."

 # ── Decisions ─────────────────────────────────────────────────────────────────
 eotg_gobcorp_no_confidence_vote:0 "Vote of No Confidence"
 eotg_gobcorp_no_confidence_vote_desc:0 "The Director-General's grip on power has weakened. Call a vote among the Trade Princes and Merchant Lords — if sufficient weight of gold, prestige, and faction loyalty aligns against the DG, the Board can demand their resignation."
 eotg_gobcorp_no_confidence_vote_tooltip:0 "A vote is tallied. If the board's collective weight exceeds the threshold, the Director-General will be confronted."

 # ── Vote Events ───────────────────────────────────────────────────────────────
 eotg_gobcorp_vote_0001_title:0 "The Vote Is Called"
 eotg_gobcorp_vote_0001_desc_passed:0 "The tallies are in. The weight of gold, prestige, and faction allegiance has reached the threshold. The Board stands behind us. [eotg_vote_dg.GetTitledFirstName] cannot ignore this."
 eotg_gobcorp_vote_0001_desc_failed:0 "The numbers disappoint. Too many Trade Princes remain neutral or loyal to [eotg_vote_dg.GetTitledFirstName]. The vote cannot move forward — not today."
 eotg_gobcorp_vote_0001_opt_announce:0 "Deliver the Board's verdict."
 eotg_gobcorp_vote_0001_opt_insufficient:0 "The Board will not move against [eotg_vote_dg.GetTitledFirstName]. Not yet."

 eotg_gobcorp_vote_0002_title:0 "The Board Demands You Step Aside"
 eotg_gobcorp_vote_0002_desc:0 "The Trade Princes and Merchant Lords have spoken. The vote has passed. They demand your resignation as Director-General. You may depart with dignity — or refuse, and let the League tear itself apart."
 eotg_gobcorp_vote_0002_opt_step_down:0 "I will step down. Let the League remember me well."
 eotg_gobcorp_vote_0002_opt_refuse:0 "I will not yield. Let them come."

 eotg_gobcorp_vote_0003_title:0 "A Dignified Departure"
 eotg_gobcorp_vote_0003_desc:0 "You step down from the directorship with your head held high. Gold in hand, prestige intact, and a reputation that will outlast your successors. The Trade League does not often see exits this clean."
 eotg_gobcorp_vote_0003_opt_accept:0 "A graceful exit."

 eotg_gobcorp_vote_0004_title:0 "The Board Has Been Defied"
 eotg_gobcorp_vote_0004_desc:0 "You refuse to yield. The vote is meaningless to you — authority is taken, not handed over. But the Merchant Lords will not accept this. The boardroom war has begun."
 eotg_gobcorp_vote_0004_opt_hold:0 "Let them declare war on me. I will hold."

 eotg_gobcorp_vote_0005_title:0 "The Board Is Crushed"
 eotg_gobcorp_vote_0005_desc:0 "You have broken them. Every Trade Prince who raised a hand against you has been reminded why defying the Director-General is fatal. No vote will ever threaten your seat again."
 eotg_gobcorp_vote_0005_opt_victory:0 "The League belongs to me."

 # ── Interface Messages ────────────────────────────────────────────────────────
 eotg_gobcorp_boardroom_war_unlocked_title:0 "The Director-General Has Refused"
 eotg_gobcorp_boardroom_war_unlocked_desc:0 "[Root.GetTitledFirstName] has refused to step down. Merchant Lords may now declare a Boardroom War to claim the directorship by force."
 eotg_gobcorp_boardroom_war_available_tooltip:0 "Merchant Lords in this realm may now declare the #bold Boardroom War# casus belli against [Root.GetTitledFirstName]."
 eotg_gobcorp_survived_vote_tooltip:0 "[Root.GetTitledFirstName] has survived a Boardroom War and is permanently immune to Votes of No Confidence."

 # ── Faction Events ────────────────────────────────────────────────────────────
 eotg_gobcorp_faction_0001_opt:0 "Continue."
 eotg_gobcorp_faction_0002_opt:0 "Continue."
 eotg_gobcorp_faction_0003_title:0 "A Faction Rises to Dominance"
 eotg_gobcorp_faction_0003_desc:0 "The [eotg_dominant_faction_leader.GetHouse.GetBaseName] Combine has accumulated overwhelming market share within the Trade League. Their leader, [eotg_dominant_faction_leader.GetTitledFirstName], now commands more economic influence than any rival faction."
 eotg_gobcorp_faction_0003_opt_acknowledge:0 "Monitor the situation."

 # ── Traits ────────────────────────────────────────────────────────────────────
 trait_eotg_honorable_exit:0 "Honorable Exit"
 eotg_honorable_exit:0 "Honorable Exit"
 eotg_honorable_exit_desc:0 "This character stepped down from the Director-Generalship gracefully when the Board demanded it. Rare in the Trade League. Remembered."

 # ── Modifiers ─────────────────────────────────────────────────────────────────
 eotg_gobcorp_dg_instability:0 "Political Instability"
 eotg_gobcorp_dg_instability_desc:0 "The Director-General's hold on the League is weakening. Vassals sense opportunity."
 eotg_gobcorp_board_seat:0 "Seat on the Board"
 eotg_gobcorp_board_seat_desc:0 "This character holds a formal advisory position on the Director-General's board."

 # ── Casus Belli ───────────────────────────────────────────────────────────────
 EOTG_BOARDROOM_WAR_NAME:0 "Boardroom War for [TITLE.GetBaseName]"
 EOTG_BOARDROOM_WAR_NAME_FALLBACK:0 "Boardroom War"
 eotg_boardroom_war_victory_desc:0 "The Director-General has been deposed. A new hand controls the Trade League."
 eotg_boardroom_war_victory_attacker_desc:0 "Your boardroom war has succeeded. The directorship is yours."
 eotg_boardroom_war_victory_defender_desc:0 "The boardroom war has ended in defeat. The Director-General's seat has been taken."
 eotg_boardroom_war_defeat_desc:0 "The Director-General survived the boardroom war. No vote will threaten them again."
 eotg_boardroom_war_defeat_attacker_desc:0 "The boardroom war has failed. The Director-General stands stronger than ever."
 eotg_boardroom_war_defeat_defender_desc:0 "You have crushed the boardroom war. The League will not challenge you again."
 eotg_boardroom_war_white_peace_desc:0 "The boardroom war has ended without resolution."
 eotg_boardroom_war_invalidated_desc:0 "The boardroom war is no longer valid."
 eotg_boardroom_war:0 "Boardroom War"

