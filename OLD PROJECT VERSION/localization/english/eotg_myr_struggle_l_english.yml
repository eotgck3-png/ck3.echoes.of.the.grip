l_english:
 # ═══════════════════════════════════════════════════════════════════════════════
 # THE MYR CLUSTER WARS — struggle localization
 #
 # Ignited 850 AG, sixteen years before the bookmark. Four great powers contest
 # the Myr Clusters: the Elrossi Imperium (through the Prince of Myr), New
 # Cauldron's mercenary legions, the Gob-Ogre Trade League, and the Coldiron
 # Caliphate — fought across the homes of the Helix remnant locals who live there.
 # Historically the wars grind on until 1300 AG.
 # ═══════════════════════════════════════════════════════════════════════════════

 # ── Struggle ─────────────────────────────────────────────────────────────────
 eotg_myr_struggle:0 "The Myr Cluster Wars"
 eotg_myr_struggle_desc:0 "Four powers reached for the Myr Clusters at once, and none of them will let go. The Elrossi Imperium fights at arm's length through the Prince of Myr, keeping the blood far from its own cathedrals. New Cauldron sells its mercenary legions to every side that can pay. The Gob-Ogre Trade League moves corporate armies in behind its survey ships. The Coldiron Caliphate advances under banners that call the whole thing holy. Beneath all four live the Helix remnant peoples, whose worlds these are, and whose consent no one has asked for. The fires were lit in 850 AG. Nothing since has put them out."

 # ── Phases ───────────────────────────────────────────────────────────────────
 struggle_eotg_myr_phase_ignition:0 "Ignition"
 struggle_eotg_myr_phase_ignition_desc:0 "The first phase, and the one the galaxy is living in now. No power has declared a general war, and every power is fighting one. Survey fleets arrive with escorts. Border pickets trade fire and call it an accident. Mercenary recruiters work the docks openly. Everyone still speaks of the Clusters as a dispute that reasonable parties might settle, and everyone is quietly moving to be holding the ground when reason runs out."
 struggle_eotg_myr_phase_escalation:0 "Escalation"
 struggle_eotg_myr_phase_escalation_desc:0 "The pretence is gone. Fleets move in the open, contracts are signed without discretion, and the Clusters have become the market every mercenary company in settled space is trying to reach. Wars are cheap to start and cheaper to justify. Development stalls across the contested worlds — nobody builds what a rival may hold next season."
 struggle_eotg_myr_phase_attrition:0 "Attrition"
 struggle_eotg_myr_phase_attrition_desc:0 "The wars have outlived the ambitions that began them. Levies come back thin and come back slower. Armies cost more to keep in the field than the ground they hold is worth. Control bleeds away from every distant holding, and the powers keep fighting mostly because none of them can afford to be the first to stop."
 struggle_eotg_myr_phase_settlement:0 "Settlement"
 struggle_eotg_myr_phase_settlement_desc:0 "Envoys are meeting in neutral space. The shooting has not ended, but it has become an argument conducted at the negotiating table by other means. Wars are harder to start and harder to sell. The contested worlds begin, cautiously, to rebuild — and a ruler with enough standing could end this thing outright."
 struggle_eotg_myr_phase_conclusion:0 "Accord"
 struggle_eotg_myr_phase_conclusion_desc:0 "The Accord of the Clusters is signed. The Myr Cluster Wars are over — not won by anyone, which was always the only way they could end."

 # ── Phase effect headers ─────────────────────────────────────────────────────
 eotg_myr_ignition_war_effects:0 "Skirmish and Posture (War)"
 eotg_myr_ignition_other_effects:0 "Watching the Clusters (Other)"
 eotg_myr_escalation_war_effects:0 "Open War in the Clusters (War)"
 eotg_myr_escalation_other_effects:0 "Profiting from the Fires (Other)"
 eotg_myr_attrition_war_effects:0 "The Long Grind (War)"
 eotg_myr_attrition_other_effects:0 "The Weight of the Wars (Other)"
 eotg_myr_settlement_war_effects:0 "Envoys and Truces (War)"

 # ── Struggle parameters ──────────────────────────────────────────────────────
 struggle_parameter_eotg_myr_wars_active:0 "The Cluster Wars are actively being fought"
 struggle_parameter_eotg_myr_skirmish_raiding:0 "Border skirmishing and raiding go unpunished across the Clusters"
 struggle_parameter_eotg_myr_mercenary_boom:0 "Every mercenary company in settled space is bidding for Cluster contracts"
 struggle_parameter_eotg_myr_war_exhaustion:0 "Years of war have exhausted the manpower and treasuries of every side"
 struggle_parameter_eotg_myr_peace_talks:0 "Peace talks are under way in neutral space"

 # ── Catalysts ────────────────────────────────────────────────────────────────
 eotg_catalyst_myr_time:0 "The wars grind on"
 eotg_catalyst_myr_time_desc:0 "Simply enduring another year of the Cluster Wars pushes the conflict toward its next phase."
 eotg_catalyst_myr_war_declared:0 "A war was declared in the Clusters"
 eotg_catalyst_myr_war_declared_desc:0 "An involved ruler has opened a new front, hardening every position in the Clusters."
 eotg_catalyst_myr_war_concluded:0 "A war in the Clusters ended"
 eotg_catalyst_myr_war_concluded_desc:0 "A war fought over the Clusters has run its course, and the survivors are counting the cost."
 eotg_catalyst_myr_ruler_slain:0 "An involved ruler died with the wars unresolved"
 eotg_catalyst_myr_ruler_slain_desc:0 "A power in the Clusters has lost its ruler before the fighting was settled, and the succession will be tested in the field."
 eotg_catalyst_myr_aggression:0 "Deliberate escalation"
 eotg_catalyst_myr_aggression_desc:0 "Raids, sabotage and open provocation have driven the Clusters further toward general war."
 eotg_catalyst_myr_diplomacy:0 "Deliberate restraint"
 eotg_catalyst_myr_diplomacy_desc:0 "Envoys, truces and refused provocations have pulled the Clusters back from the brink."

 # ── Ending decision ──────────────────────────────────────────────────────────
 eotg_decision_myr_settlement:0 "The Accord of the Clusters"
 eotg_decision_myr_settlement_desc:0 "The envoys have been talking in neutral space for a season now, and they have gone as far as envoys can go. What remains needs a name on it — someone with standing enough that the other powers can sign beside them without calling it surrender. The Clusters have burned for a generation. It would take very little now to let them burn for another."
 eotg_decision_myr_settlement_tooltip:0 "End the Myr Cluster Wars"
 eotg_decision_myr_settlement_confirm:0 "Put your name to the Accord"

 # ── Proxy war interaction ────────────────────────────────────────────────────
 eotg_direct_proxy_war_interaction:0 "Direct a Proxy War"
 eotg_direct_proxy_war_interaction_desc:0 "Fund a lesser power of your own faith to fight your war in the Myr Clusters. Their armies, their casualties, your objectives — the pattern the Elrossi Imperium perfected with the Prince of Myr. A war chest buys them veteran companies and buys you a war you never formally declared."
 eotg_direct_proxy_war_notification:0 "A war chest has arrived from a distant patron, and instructions arrived with it."
 eotg_myr_proxy_funded:0 "Funded my war in the Clusters"
 eotg_myr_proxy_defied:0 "Refused to serve as an instrument in the Clusters"

 # ── Modifiers ────────────────────────────────────────────────────────────────
 eotg_myr_veteran_companies:0 "Veteran Cluster Companies"
 eotg_myr_veteran_companies_desc:0 "Hardened mercenary companies out of the Myr Clusters, bought while the market was flooded and the survivors were cheap. They have fought in the Clusters and they will tell anyone who asks."

 # ═══════════════════════════════════════════════════════════════════════════════
 # EVENTS — eotg_myr
 # ═══════════════════════════════════════════════════════════════════════════════

 # ── eotg_myr.0001 — struggle start notification ──────────────────────────────
 eotg_myr_0001_title:0 "The Clusters Burn"
 eotg_myr_0001_desc:0 "The reports come in from the Myr Clusters faster than the couriers can be paid. A survey convoy fired upon. A garrison landed on a world that had no garrison last season. Four separate powers each insisting, in careful language, that they are responding to the aggression of the others.\n\nNone of them has declared a war. All of them are fighting one. Whatever the Clusters were before this season, they are a battlefield now — and every court in settled space is working out what that will cost them, or what it might be worth."
 eotg_myr_0001_opt_ok:0 "So it begins."

 # ── eotg_myr.0002 — phase change notification ────────────────────────────────
 eotg_myr_0002_title:0 "The Wars Shift"
 eotg_myr_0002_desc_generic:0 "Word out of the Myr Clusters has changed its shape. The dispatches use different words than they did last season, and the men who write them sound like they are describing a different war."
 eotg_myr_0002_desc_escalation:0 "The careful language is finished. Fleets are moving in the open, under their own banners, and nobody is troubling to call it a border incident any longer. The recruiters have stopped being discreet — there is not a mercenary company in settled space that has not been approached about the Clusters, and the rates being offered are extraordinary.\n\nThis is the general war everyone spent sixteen years insisting would not happen."
 eotg_myr_0002_desc_attrition:0 "The Clusters have stopped producing victories. They produce casualty returns, requisition orders, and requests for reinforcement that go unanswered.\n\nThe levies come back thin. The companies that were so expensive last decade are cheap now, because so many of them are dead. Nobody in the Clusters can remember what winning was supposed to look like — only that stopping first would mean the whole cost was paid for nothing."
 eotg_myr_0002_desc_settlement:0 "Envoys are meeting in neutral space. It is not peace, and everyone involved is careful to say so, but the shooting has become an argument conducted between negotiating sessions rather than the other way around.\n\nFor the first time in a generation there is a table in the Myr Clusters with all four powers seated at it."
 eotg_myr_0002_opt_ok:0 "Note it, and adjust."

 # ── eotg_myr.0003 — drawn into the wars ──────────────────────────────────────
 eotg_myr_0003_title:0 "Drawn Into the Wars"
 eotg_myr_0003_desc:0 "It was not a decision. It rarely is. A contract signed, a border held, a kinsman's claim acknowledged — and somewhere in that chain of small reasonable steps, the Myr Cluster Wars became a thing that is happening to you rather than a thing happening at a distance.\n\nThe other powers have already adjusted their maps. Your name is on them now."
 eotg_myr_0003_opt_ok:0 "Then we fight in the Clusters."

 # ── eotg_myr.0011 — ignition flavor ──────────────────────────────────────────
 eotg_myr_0011_title:0 "Skirmishes on the Spinward Marches"
 eotg_myr_0011_desc:0 "A picket on the spinward edge of the Clusters exchanged fire with a rival patrol for eleven minutes before both sides broke off. Two ships lost, no formal complaint filed, and both commanders reporting that the other fired first.\n\nIt is the fourth such incident this year. Your officers want to know what the standing order is — because the one they are operating under now was written for a peace that no longer exists."
 eotg_myr_0011_opt_strike:0 "Answer the next provocation with force. Let them count the cost."
 eotg_myr_0011_opt_restraint:0 "Hold the line and lodge a protest. Someone must keep their head."
 eotg_myr_0011_opt_fortify:0 "Say nothing, and quietly fortify the marches."

 # ── eotg_myr.0012 — escalation flavor ────────────────────────────────────────
 eotg_myr_0012_title:0 "The Mercenary Boom"
 eotg_myr_0012_desc:0 "The Clusters have made mercenaries rich. Every company with a hull and a reputation is being bid over by four separate powers, and New Cauldron's legions are reportedly fighting on three sides of the same war without any of their employers thinking it strange.\n\nYour treasurer has noticed. So have your captains, who have been approached individually, discreetly, and at rates your treasury cannot match."
 eotg_myr_0012_opt_sell:0 "Sell our service to the highest bidder. Their war, our coin."
 eotg_myr_0012_opt_refuse:0 "We will not feed those fires for money."
 eotg_myr_0012_opt_buy:0 "Buy while the buying is good — veterans are cheap this season."

 # ── eotg_myr.0013 — attrition flavor ─────────────────────────────────────────
 eotg_myr_0013_title:0 "The Long War Grinds"
 eotg_myr_0013_desc:0 "The quartermaster's returns are on the table and they say the same thing they said last year, only worse. Replacement rates below losses. Hulls in dock that will not come out. A generation of officers who have known nothing but the Clusters, commanding levies who were children when this started.\n\nNobody at this court can now articulate what victory in the Myr Clusters would actually look like. They can all describe, in detail, what stopping would cost."
 eotg_myr_0013_opt_push:0 "Double down. The Clusters go to whoever endures."
 eotg_myr_0013_opt_talks:0 "Sound out the other powers. Quietly."
 eotg_myr_0013_opt_rebuild:0 "Turn inward and repair what the wars have broken."

 # ── eotg_myr.0014 — settlement flavor ────────────────────────────────────────
 eotg_myr_0014_title:0 "Envoys in Neutral Space"
 eotg_myr_0014_desc:0 "A station in neutral space, chosen because none of the four powers has ever wanted it. Envoys from all of them are aboard, along with — for the first time in the whole miserable business — a delegation of the Helix remnant peoples whose worlds have been the battlefield throughout.\n\nThe talks are fragile. They could be made, or broken, by any power with the standing to matter. Yours is among them."
 eotg_myr_0014_opt_champion:0 "Throw our weight behind the talks. Let peace have a sponsor."
 eotg_myr_0014_opt_sabotage:0 "The wars are not finished serving us. Break the conference."
 eotg_myr_0014_opt_watch:0 "Attend. Listen. Commit to nothing."

 # ── eotg_myr.0020 — proxy war directive ──────────────────────────────────────
 eotg_myr_0020_title:0 "A Patron's Instructions"
 eotg_myr_0020_desc:0 "The war chest arrived first — enough coin to put veteran companies under your banner, more than your treasury has seen in years. The instructions came with the same courier, phrased as a request between co-religionists and meaning nothing of the kind.\n\nYou are to fight in the Clusters. Their objectives, your casualties, and their hands stay clean at a distance of several hundred light years. It is the Prince of Myr's arrangement exactly, and everyone involved knows how that story is generally told."
 eotg_myr_0020_opt_comply:0 "Take the coin and wage their war."
 eotg_myr_0020_opt_stall:0 "Take the coin. Serve no distant throne."

 # ── eotg_myr.0090 — conclusion ───────────────────────────────────────────────
 eotg_myr_0090_title:0 "The Accord of the Clusters"
 eotg_myr_0090_desc:0 "It is signed. No power took the Myr Clusters, which is the only outcome any of them would have accepted from the others.\n\nThe terms are unglamorous — withdrawal schedules, contested-world protocols, a recognition of Helix remnant title that ought to have been the first clause rather than the last. There will be no triumphs. A generation fought over those stars and the settlement gives them back, more or less, to the people who were living there when it began.\n\nThe fires are out. That is the whole of the victory, and it is not nothing."
 eotg_myr_0090_opt_ok:0 "Let the histories record that it ended."
