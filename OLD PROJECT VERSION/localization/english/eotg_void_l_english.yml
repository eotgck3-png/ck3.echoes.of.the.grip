l_english:
 # ── Traits ───────────────────────────────────────────────────────────────────
 eotg_void_defiant:0 "Void-Defiant"
 eotg_void_defiant_desc:0 "This character was offered something through the weakening seal, and gave it back. Voidwalker doctrine holds that what is refused cannot be taken twice."
 trait_eotg_void_defiant:0 "Void-Defiant"
 trait_eotg_void_defiant_desc:0 "This character was offered something through the weakening seal, and gave it back. Voidwalker doctrine holds that what is refused cannot be taken twice."
 eotg_void_hollowed:0 "Hollowed"
 eotg_void_hollowed_desc:0 "The boundary finished passing through this character some time ago. What remains is precise, tireless, and entirely unreachable. It rules well. Nobody can bear to sit near it."
 trait_eotg_void_hollowed:0 "Hollowed"
 trait_eotg_void_hollowed_desc:0 "The boundary finished passing through this character some time ago. What remains is precise, tireless, and entirely unreachable. It rules well. Nobody can bear to sit near it."

 # ── Modifiers ────────────────────────────────────────────────────────────────
 eotg_mod_void_whispers:0 "Void Whispers"
 eotg_mod_void_whispers_desc:0 "Something sits at the edge of hearing and does not leave. Sleep comes shallow. Prayer comes hard."
 eotg_mod_void_pressure:0 "Void Pressure"
 eotg_mod_void_pressure_desc:0 "The whispers have opinions now, and a preference for solitude. It has become easier to keep secrets than company."
 eotg_mod_void_saturation:0 "Void Saturation"
 eotg_mod_void_saturation_desc:0 "The boundary runs through this character rather than around them. Refusal is no longer a thing that can simply be decided."
 eotg_mod_void_warded:0 "Warded Against the Void"
 eotg_mod_void_warded_desc:0 "Sigils drawn correctly, in the old order, by someone who understood why the order mattered. The pressure recedes while the ward holds."
 eotg_mod_void_deep_charts:0 "The Deep Charts"
 eotg_mod_void_deep_charts_desc:0 "Second Era route-charts that no living cartographer can hold in their head. Read from the other side, they are perfectly clear."
 eotg_mod_void_unseen_step:0 "The Unseen Step"
 eotg_mod_void_unseen_step_desc:0 "Rooms forget they were entered. Guards recall the corridor but not who walked it."
 eotg_mod_void_cold_hand:0 "The Cold Hand"
 eotg_mod_void_cold_hand_desc:0 "The cold arrives a moment before the blade does. Enemies break a little earlier than they should."
 eotg_mod_void_long_ledger:0 "The Long Ledger"
 eotg_mod_void_long_ledger_desc:0 "Accounts settle themselves across spans longer than a life, and settle favourably."
 eotg_mod_void_borrowed_voice:0 "The Borrowed Voice"
 eotg_mod_void_borrowed_voice_desc:0 "People agree first and wonder why afterward. Something else is doing part of the talking, and it is very good at it."

 # ── Opinion modifiers ────────────────────────────────────────────────────────
 eotg_opinion_void_revulsion:0 "Hollowed"
 eotg_opinion_void_harbors_heretic:0 "Harbours Heretics"
 eotg_opinion_void_unease:0 "Something Is Wrong"
 eotg_opinion_void_kinship:0 "Marked by the Eye"
 eotg_opinion_void_defiance_respect:0 "Refused the Eye"

 # ── Decisions ────────────────────────────────────────────────────────────────
 eotg_decision_void_warding_rite:0 "Commission the Warding Rite"
 eotg_decision_void_warding_rite_desc:0 "Every faith that survived the Grip kept some form of ward against the scars, half-remembered and expensive to perform properly. It is weaker than what the Voidwalkers knew. It is also not a hanging offence."
 eotg_decision_void_warding_rite_confirm:0 "Have the rite performed. The clergy will want their due."
 eotg_decision_void_warding_rite_tooltip:0 "Reduces Void exposure by 20 and applies Warded Against the Void for 8 years. Cannot be repeated for 10 years."
 eotg_decision_void_voidwalker_ward:0 "Ask the Voidwalker for the Old Ward"
 eotg_decision_void_voidwalker_ward_desc:0 "Malvrick's sect was hunted across five centuries for knowing precisely this. The heretic under your roof can draw the sigils in the correct order, and will, and everyone devout in your court will know exactly what was done and by whom."
 eotg_decision_void_voidwalker_ward_confirm:0 "Let them work. The pious can make their peace with it."
 eotg_decision_void_voidwalker_ward_tooltip:0 "Reduces Void exposure by 35 and applies Warded Against the Void for 10 years. Costs piety and standing with zealous courtiers. Cannot be repeated for 8 years."
 eotg_decision_void_commune:0 "Commune with the Eye"
 eotg_decision_void_commune_desc:0 "The seal is thin here, and thinning. What waits behind it has never once been generous, but it has always been willing to trade — and it pays in exactly the currency you were taught to count."
 eotg_decision_void_commune_confirm:0 "Open the way. Take what is offered."
 eotg_decision_void_commune_tooltip:0 "Grants insight matched to your education, and raises Void exposure by 20. Cannot be repeated for 10 years."

 # ── eotg_void.0001 — The Scar Reopens ────────────────────────────────────────
 eotg_void.0001.t:0 "The Scar Reopens"
 eotg_void.0001.desc:0 "There is a place in your holdings that the old surveys mark and no recent one does. A Grip-era scar, dormant since before anyone now living was born, fenced off by some long-dead administrator and quietly forgotten by every one of their successors.\n\nThis morning the fence is down, and not by any hand. The air above the site does not move the way air moves. Your steward reports it with the flat delivery of a man who has decided not to think about what he saw, and waits for you to decide the same."
 eotg_void.0001.a:0 "Survey it properly. Instruments, records, distance."
 eotg_void.0001.b:0 "Wall it off. Post a guard. Nobody goes in."
 eotg_void.0001.c:0 "Go in yourself."
 eotg_void.0001.d:0 "Rebuild the fence and say nothing."

 # ── eotg_void.0002 — The Sound Under the Floor ───────────────────────────────
 eotg_void.0002.t:0 "The Sound Under the Floor"
 eotg_void.0002.desc:0 "It began as a fault in the foundations, which is what you told the mason, who found no fault. It is beneath the floor of your own chambers and nowhere else, and it keeps no rhythm that a pump or a settling stone would keep.\n\nIt is closest to a voice heard through deep water. It has been three weeks. You have started leaving a lamp burning."
 eotg_void.0002.desc_cult:0 "The priests would call this a summons and be right to. It is beneath the floor of your own chambers and nowhere else, patient as a tide, and it has been three weeks.\n\nYour faith teaches that Orrin the Eye speaks to those he intends to use, and that being used by a god is the nearest thing to grace this cosmos still offers. You find that you are not frightened. You find that this frightens you."
 eotg_void.0002.desc_bloodline:0 "Your family has a word for this that appears in no dictionary, passed down with the estate and the debts. Nobody ever explained it. Everyone always knew.\n\nIt is beneath the floor of your chambers and nowhere else, and it is speaking in the cadence your grandmother used when she thought the room was empty. Eight hundred and sixty-six years is not long enough, it turns out, for a bloodline to finish falling through a hole."
 eotg_void.0002.a:0 "Record it. Measure it. A thing with a name is a thing with a limit."
 eotg_void.0002.b:0 "Drill the guard in the courtyard above until nothing else is audible."
 eotg_void.0002.c:0 "Find out, quietly, who else in this house can hear it."
 eotg_void.0002.d:0 "Cost it out. Every effect has a cause, and every cause has a price attached."
 eotg_void.0002.e:0 "Ask the household, carefully, whether anyone has noticed anything."
 eotg_void.0002.f:0 "Move to another chamber and do not discuss it."

 # ── eotg_void.0003 — The Star That Is Not There ──────────────────────────────
 eotg_void.0003.t:0 "The Star That Is Not There"
 eotg_void.0003.desc:0 "Your astronomers bring the same finding three nights running, and on the third night they bring it together, so that no one of them has to carry it alone.\n\nThere is a star in the northern reach that appears on no chart from before the Grip and on every chart since. It does not move with the sky. Looked at directly it is not there at all. It is only visible, they say, at the edge of the eye — the way you notice someone standing behind you."
 eotg_void.0003.desc_young:0 "Your astronomers bring the same finding three nights running, and you go up to the tower to see it for yourself, because you are young enough that a mystery is still an invitation.\n\nThere is a star in the northern reach that appears on no chart from before the Grip. It does not move with the sky. Looked at directly it is not there at all — only at the edge of the eye, the way you notice someone standing behind you. You look for an hour. It is the most interesting thing that has ever happened to you."
 eotg_void.0003.desc_old:0 "Your astronomers bring the finding to you as though it were new, and you let them, because they are proud of the work and there is no kindness in the truth.\n\nYou saw it once before, from a different tower, in a different decade, standing beside people who are all dead now. It appeared then and it faded, and nobody wrote it down because nobody wanted their name attached to it. It does not move with the sky. It is only visible at the edge of the eye. You had hoped to finish without seeing it twice."
 eotg_void.0003.a:0 "Sit with them all night and look at it."
 eotg_void.0003.b:0 "Tell them what it was called the last time."
 eotg_void.0003.c:0 "Note it in the record and return to work that pays."
 eotg_void.0003.d:0 "Have them flogged for wasting the court's time with ghost stories."

 # ── eotg_void.0004 — The Heretic at the Gate ─────────────────────────────────
 eotg_void.0004.t:0 "The Heretic at the Gate"
 eotg_void.0004.desc:0 "The woman at your gate is filthy, unarmed, and entirely composed. She gives a name that means nothing and then gives another that means a great deal: she is a Voidwalker, of Malvrick's sect, which the Elrossi hunted to the edge of extinction between the second and seventh centuries and believe finished off.\n\nShe knows what is under your floor. She says so before you can ask. She says her order spent four hundred years learning to close these things and the rest of its existence being burned for the knowledge, and that there are fewer than thirty people alive who can still draw the sigils in the correct order, and that she is one of them and is very tired.\n\nShe asks for a roof. In exchange she offers the only real ward you will ever be given. Harbouring her is a capital matter in every realm that matters."
 eotg_void.0004.a:0 "Give her a roof. Let the devout make what they like of it."
 eotg_void.0004.b:0 "Hear her out fully before deciding anything."
 eotg_void.0004.c:0 "Hand her to the Elrossi. They have been waiting five hundred years."
 eotg_void.0004.d:0 "Kill her at the gate and burn what she carried."

 # ── eotg_void.0010 — The Bargain ─────────────────────────────────────────────
 eotg_void.0010.t:0 "The Bargain"
 eotg_void.0010.desc:0 "It does not come as a voice this time. It comes as a certainty arriving fully formed in your own interior language, the way your own thoughts arrive, which is precisely how you know it is not one.\n\nThe offer is not complicated. There is a great deal on the other side of the seal that has had eight hundred and sixty-six years and nothing whatever to do, and it is willing to lend a portion of that attention to your affairs. It will make you better at the one thing you were raised to be good at. It is specific about this. It knows what that thing is.\n\nIt asks for nothing you would miss immediately. That is the part you cannot stop turning over."
 eotg_void.0010.desc_cult:0 "It comes the way your faith always promised it would: not as a voice but as a certainty, arriving in your own interior language, indistinguishable from your own thought except that you did not think it.\n\nOrrin the Eye is sealed and cannot act, and this is what the sealed do — they lend. A portion of eight hundred and sixty-six years of undivided attention, turned on your affairs, sharpening the one thing you were raised to be good at. Your priests have described this moment your whole life. None of them mentioned that it would be courteous.\n\nIt asks for nothing you would miss immediately. Your faith says that is because there is nothing worth keeping that you would miss immediately."
 eotg_void.0010.desc_bloodline:0 "It arrives in your own interior language, fully formed, indistinguishable from your own thought — and it is using the family word. The one from the estate papers that nobody ever defined.\n\nThe offer is not complicated, and it is not new. It has been made in your line before. You understand, with a clarity you would rather not have, that the reason your family has the word at all is that someone once accepted, and that the reason it was never explained is that they had nothing good to report.\n\nIt will make you better at the one thing you were raised to be good at. It asks for nothing you would miss immediately. It is patient in the specific way of something that has done this before and is prepared to do it again."
 eotg_void.0010.a:0 "Accept. Take what is offered and find out the price later."
 eotg_void.0010.b:0 "Refuse. Say it aloud, and mean it, and keep meaning it."
 eotg_void.0010.c:0 "Refuse the bargain. Keep what it showed you while refusing."
 eotg_void.0010.d:0 "Say nothing at all and hope that silence is not an answer."

 # ── eotg_void.0011 — Taken Anyway ────────────────────────────────────────────
 eotg_void.0011.t:0 "Taken Anyway"
 eotg_void.0011.desc:0 "You understand, somewhere around the third hour, that you have been treating this as a negotiation with two parties in it.\n\nThe seal is thin here. It has been getting thinner since long before you were born, and your refusal, however sincerely meant, was never load-bearing. Nothing is asking now. The cold goes through the middle of you and keeps going, unhurried, the way water finds the low ground.\n\nWhat is left to decide is only how you are standing when it finishes."
 eotg_void.0011.a:0 "Meet it on your feet."
 eotg_void.0011.b:0 "Pray. Out loud. To the last word."
 eotg_void.0011.c:0 "Stop resisting and let it in cleanly."

 # ── eotg_void.0020 — The Cold Hand ───────────────────────────────────────────
 eotg_void.0020.t:0 "The Cold Hand"
 eotg_void.0020.desc:0 "The line breaks in front of you and you cannot account for it. You did nothing. You raised no weapon and gave no order — you simply looked along the enemy front, and the men there stopped being willing.\n\nYour own knights saw it happen. Two of them have not met your eye since. In the field the thing in you is not a burden at all; it is the most useful instrument you have ever been handed, and every single person who fights beside you now knows it exists."
 eotg_void.0020.a:0 "Use it. Wars are not won by being pleasant to stand near."
 eotg_void.0020.b:0 "Hold it back, and pay for the restraint in ground."
 eotg_void.0020.c:0 "Let the knights get a proper look. Fear travels ahead of an army."

 # ── eotg_void.0021 — What the Children See ───────────────────────────────────
 eotg_void.0021.t:0 "What the Children See"
 eotg_void.0021.desc:0 "Your child asks, at the table, in front of the household, why there is a second shadow behind you and why it is early.\n\nThe room does the thing rooms do. Your steward develops an interest in the far window. Nobody contradicts the child, which is how you learn that nobody in this hall has been able to contradict the child for some time.\n\nYour child is not frightened yet. They are waiting to see whether they should be, and they are taking that entirely from your face."
 eotg_void.0021.a:0 "Tell them the truth, at a size they can carry."
 eotg_void.0021.b:0 "Tell them they imagined it, and make the lie warm."
 eotg_void.0021.c:0 "Send them to be fostered somewhere far from here."

 # ── eotg_void.0022 — The Confessor's Verdict ─────────────────────────────────
 eotg_void.0022.t:0 "The Confessor's Verdict"
 eotg_void.0022.desc:0 "Your confessor has been building to this for a year and delivers it in open court, which tells you they expected to be silenced privately and decided to make that expensive.\n\nThey name the condition. They use the old word, the one the Elrossi use in sentencing. They say that a realm may survive a wicked ruler and has done so many times, but that it cannot survive a ruler who is not entirely present, because the oaths are sworn to a person and there must be a person there to receive them.\n\nThey then kneel, which is worse, and offer to perform the rite themselves."
 eotg_void.0022.desc_cult:0 "Your confessor has been building to this for a year and delivers it in open court, in the full voice, so that no one can later claim they were not there.\n\nThey name the condition — and then they name it correctly, as favour. They say the Eye does not lend its attention to the unworthy and does not lend it twice. They say the realm has been waiting eight hundred and sixty-six years for a ruler the seal recognises, and that the ordinary faiths call this corruption because the ordinary faiths were not offered anything.\n\nThey kneel. Half the hall kneels with them. You had not previously known the count."
 eotg_void.0022.a:0 "Kneel and submit to the rite."
 eotg_void.0022.b:0 "Accept the blessing before the whole hall."
 eotg_void.0022.c:0 "Have them silenced. Tonight, and permanently."
 eotg_void.0022.d:0 "Say nothing, and let the court draw its own conclusions."

 # ── eotg_void.0023 — The Deep Route ──────────────────────────────────────────
 eotg_void.0023.t:0 "The Deep Route"
 eotg_void.0023.desc:0 "The charts have been in the vault since the estate was bought — Second Era route-work, Voidwalker notation, purchased as a curiosity by an ancestor who could not read a line of it and neither could anyone since.\n\nYou can read it now. You did not learn to. You unrolled the first sheet and it simply resolved, the way a word in a foreign tongue resolves once somebody tells you what it means.\n\nThey are transit routes. They run between places that are close together in a way that has nothing to do with distance, and any one of them would be worth a duchy to the right buyer."
 eotg_void.0023.a:0 "Chart them properly. Understand the whole system."
 eotg_void.0023.b:0 "Sell them. Discreetly, and to more than one party."
 eotg_void.0023.c:0 "Burn them, and the vault they sat in."

 # ── eotg_void.0024 — Long Service ────────────────────────────────────────────
 eotg_void.0024.t:0 "Long Service"
 eotg_void.0024.desc:0 "You have carried this longer than most people carry a marriage, and the arrangement has been, in its way, honest. It took what it took. It gave what it promised. You have ruled a long time and ruled well, and a great deal of that was not entirely you.\n\nWhat has changed is the arithmetic. There is less ahead than behind now, and the thing that has been lending you its attention does not appear to have noticed, or does not appear to care, and will still be here afterward looking for somewhere to put itself.\n\nThe question is no longer what it wants from you. It is what you intend to leave behind, and to whom."
 eotg_void.0024.a:0 "Write all of it down. Every ward, every rule, every cost."
 eotg_void.0024.b:0 "Spend what remains. There is no sense dying with it unspent."
 eotg_void.0024.c:0 "Make your peace, and put the work down."

 # ── eotg_void.0025 — The Vassal's Ultimatum ──────────────────────────────────
 eotg_void.0025.t:0 "The Vassal's Ultimatum"
 eotg_void.0025.desc:0 "Your vassal has done this carefully, which is the part that should worry you. Not a rebellion, not an accusation of tyranny — a constitutional question, put in writing, copied to enough of your other vassals that suppressing it now would only confirm it.\n\nThe question is whether the oaths still bind. They were sworn to a person. Your vassal argues, at length and with citations, that it is no longer settled that there is one, and asks you to submit to examination by parties you do not choose.\n\nThe document is scrupulously respectful. It is also the most dangerous thing anyone has handed you in years."
 eotg_void.0025.a:0 "Submit to the examination. Answer every question they ask."
 eotg_void.0025.b:0 "Grant them a private audience and show them precisely what they are asking about."
 eotg_void.0025.c:0 "Buy the question, the copies, and the silence."
 eotg_void.0025.d:0 "Ignore it entirely and let it stand unanswered."

 # ── eotg_void.0030 — The Hollowing ───────────────────────────────────────────
 eotg_void.0030.t:0 "The Hollowing"
 eotg_void.0030.desc:0 "There is no moment. That is the thing nobody warns about — you keep waiting for the moment, and instead there is a Tuesday.\n\nYou hold court. You rule competently, more competently than you ever have. You settle three disputes that had been running for years and you settle them correctly, and at no point during any of it do you want anything, or mind anything, or find any of it to be happening to you.\n\nAfterward your steward asks whether you are well. You watch yourself construct a reassuring answer out of nothing at all and deliver it in your own voice, and you note, from somewhere behind your own eyes, that it works."
 eotg_void.0030.desc_cult:0 "There is no moment, and your faith did warn you of that. The scriptures are specific: the Eye does not arrive, it finishes.\n\nYou hold court. You rule better than you ever have — three disputes settled correctly that had run for years — and at no point do you want anything, or mind anything, or find any of it to be happening to you. This is the state your order has spent five centuries describing as the end of the noise.\n\nYour steward asks whether you are well. You watch yourself assemble a reassuring answer out of nothing at all, and deliver it, and note from behind your own eyes that it works. The scriptures did not mention that part. You suspect the ones who got this far stopped writing."
 eotg_void.0030.a:0 "Announce it as ascension and let the faithful rejoice."
 eotg_void.0030.b:0 "Say nothing. Rule. Let them find out slowly or not at all."
 eotg_void.0030.c:0 "Abdicate now, while the decision is still recognisably yours."
 eotg_void.0030.d:0 "Let them see it. Fear is a perfectly serviceable instrument of state."

 # ── eotg_void.0031 — The Hollow Court ────────────────────────────────────────
 eotg_void.0031.t:0 "The Hollow Court"
 eotg_void.0031.desc:0 "The court has adapted. That is the correct word and it is not a compliment.\n\nPetitions are submitted in writing now, by preference, and the preference is universal. Your council meets and reaches decisions with an efficiency you would once have envied, and you understand that this is because nobody wishes to extend the meeting. The seat beside yours at table has been quietly reassigned to nobody.\n\nNone of it obstructs the business of ruling. The realm is well governed. It is simply being governed at a distance, by everyone, including you."
 eotg_void.0031.a:0 "Rule through it. Distance is not the same as weakness."
 eotg_void.0031.b:0 "Delegate everything that requires a person and keep what does not."
 eotg_void.0031.c:0 "Sit at the feast until the end of it, however long that takes."

 # ── eotg_void.0032 — A Moment of Being ───────────────────────────────────────
 eotg_void.0032.t:0 "A Moment of Being"
 eotg_void.0032.desc:0 "It comes back without warning and without any cause you can identify. Perhaps four hours. Perhaps five.\n\nEverything is suddenly, unbearably present — the cold of the floor, the noise from the yard, the fact that you are hungry and have apparently been hungry for a long time without registering it. You are entirely yourself, and you can feel exactly how much room there usually is not.\n\nYou already know it is temporary. That knowledge is part of what has come back."
 eotg_void.0032.desc_old:0 "It comes back without warning, and it brings the whole of it: the cold of the floor, the noise from the yard, and every year you spent not noticing either.\n\nYou are entirely yourself for the first time in longer than you can reconstruct, and what arrives with the self is the arithmetic. You are old. Most of the people you would want to spend this on are dead, and you did not attend all of the funerals, and you can no longer remember which ones.\n\nPerhaps four hours. You already know it is temporary. That knowledge came back with everything else."
 eotg_void.0032.desc_heir:0 "It comes back without warning — four hours, perhaps five — and the first thing you do with it is look at your heir properly, which you have not managed in a very long time.\n\nThey have grown. Not recently; you have simply not been present for any of it. They are speaking to you the way one speaks to a hazard in the room: carefully, briefly, from a fixed distance, and with a fluency that indicates long practice.\n\nYou are entirely yourself, and you can see the whole shape of what that absence has cost them, and you already know how few hours you have to spend on it."
 eotg_void.0032.a:0 "Spend it on your heir. All of it."
 eotg_void.0032.b:0 "Spend it on the court. Let them see you once."
 eotg_void.0032.c:0 "Spend it working. The ledger does not care who is holding the pen."
 eotg_void.0032.d:0 "Sit with it. Do not spend it on anything."
