l_english:
 # ── Cartel Expanded Modifier Names ────────────────────────────────────────────
 eotg_cartel_rule_of_fear:0 "Rule of Fear"
 eotg_cartel_rule_of_fear_desc:0 "Fear is the foundation of this empire's loyalty. Subordinates obey because they must — not because they want to."
 eotg_cartel_smuggling_network:0 "Smuggling Network"
 eotg_cartel_smuggling_network_desc:0 "A lucrative illegal trade network is operating under the Grand Underlord's protection. Revenue flows through shadow channels."
 eotg_cartel_protection_racket:0 "Protection Racket"
 eotg_cartel_protection_racket_desc:0 "Businesses throughout the territory pay tribute for 'protection.' The income is reliable — as long as the fear holds."
 eotg_cartel_untouchable:0 "The Untouchable"
 eotg_cartel_untouchable_desc:0 "Legends of the ruler's cunning and indestructibility have spread. Every assassination attempt has failed. Every rival who challenged them is gone. The aura of invincibility serves as its own armor."

 # ── Cartel Expanded Events ─────────────────────────────────────────────────────
 eotg_cartel_flavor_0001_title:0 "Loyalty Through Blood"
 eotg_cartel_flavor_0001_desc:0 "The rebellion has been crushed. Bodies have been made available as evidence. Now comes the question of how thoroughly to demonstrate what happens to those who raise their hands against the Grand Underlord."
 eotg_cartel_flavor_0001_opt_display:0 "Display the bodies publicly. Let everyone see."
 eotg_cartel_flavor_0001_opt_quiet:0 "Quiet executions. Clean and efficient."
 eotg_cartel_flavor_0001_opt_spare:0 "Spare one survivor as a living warning."

 eotg_cartel_flavor_0002_title:0 "Fear Curdles Into Hatred"
 eotg_cartel_flavor_0002_desc:0 "The dread is working — too well. Lieutenants obey instantly, without hesitation, without expression. But the eyes tell a different story. The obedience is hollow. Somewhere beneath the compliance, hatred is quietly organizing itself."
 eotg_cartel_flavor_0002_opt_security:0 "Increase personal security. Trust no one."
 eotg_cartel_flavor_0002_opt_purge:0 "Purge the most visibly resentful lieutenants."
 eotg_cartel_flavor_0002_opt_ignore:0 "Ignore it. Fear always looks like hatred from close up."

 eotg_cartel_flavor_0003_title:0 "A Demand for Respect"
 eotg_cartel_flavor_0003_desc:0 "A lieutenant has requested a private meeting. Their tone in the message is unusual — formal, measured, carefully controlled. They feel they have been overlooked, underpaid, and disrespected for too long. They want to discuss it."
 eotg_cartel_flavor_0003_opt_reward:0 "Reward them generously. Better loyal than resentful."
 eotg_cartel_flavor_0003_opt_threaten:0 "Make the consequences of discontent clear."
 eotg_cartel_flavor_0003_opt_humiliate:0 "Humiliate them publicly as an example."

 eotg_cartel_flavor_0004_title:0 "The Shadow Route"
 eotg_cartel_flavor_0004_desc:0 "A new smuggling route has been discovered — one that could move contraband across borders without attracting attention from rival enforcers or legitimate authorities. The potential profit is significant. So is the exposure if it fails."
 eotg_cartel_flavor_0004_opt_exploit:0 "Exploit it aggressively. Take every coin it can carry."
 eotg_cartel_flavor_0004_opt_secret:0 "Keep it quiet and use it carefully."
 eotg_cartel_flavor_0004_opt_share:0 "Share the profits with lieutenants to build loyalty."

 eotg_cartel_flavor_0005_title:0 "Unwanted Attention"
 eotg_cartel_flavor_0005_desc:0 "Local authorities — encouraged, perhaps, by a rival power — have begun investigating the smuggling network. Shipments are being stopped. Agents are asking questions. The operation is at risk."
 eotg_cartel_flavor_0005_opt_bribe:0 "Bribe the investigators and make this go away."
 eotg_cartel_flavor_0005_opt_assassinate:0 "Eliminate the investigators permanently."
 eotg_cartel_flavor_0005_opt_relocate:0 "Relocate operations to safer territory."

 eotg_cartel_flavor_0006_title:0 "Skimmers in the Network"
 eotg_cartel_flavor_0006_desc:0 "The ledgers don't match. Someone — possibly several someones — has been taking slightly more than their authorized cut from the smuggling operation. The amounts are small. The principle is not."
 eotg_cartel_flavor_0006_opt_punish:0 "Make an example of anyone caught skimming."
 eotg_cartel_flavor_0006_opt_blackmail:0 "Quietly blackmail them into future compliance."
 eotg_cartel_flavor_0006_opt_ignore:0 "Ignore minor theft. A happy crew works harder."

 eotg_cartel_flavor_0007_title:0 "Crew War"
 eotg_cartel_flavor_0007_desc:0 "Two criminal crews have gone to war over territory and profit shares. The violence is spreading beyond their districts. Civilians are being caught in it. The Grand Underlord's tolerance for internal chaos has limits — and those limits are being tested."
 eotg_cartel_flavor_0007_opt_backcrew:0 "Back the stronger crew and end this quickly."
 eotg_cartel_flavor_0007_opt_forcepeace:0 "Force a ceasefire and impose mediated peace."
 eotg_cartel_flavor_0007_opt_bleach:0 "Let them kill each other. Fewer problems."

 eotg_cartel_flavor_0008_title:0 "The Growing Army"
 eotg_cartel_flavor_0008_desc:0 "Reports have reached the Grand Underlord: a lieutenant has been quietly building independent forces. New recruits, private weapons caches, loyal enforcers who answer only to them. It might be self-protection. It might be something else."
 eotg_cartel_flavor_0008_opt_disarm:0 "Demand they disarm immediately."
 eotg_cartel_flavor_0008_opt_allownow:0 "Allow it for now. Watch them carefully."
 eotg_cartel_flavor_0008_opt_sabotage:0 "Sabotage their operation from within."

 eotg_cartel_flavor_0009_title:0 "The Infiltrators"
 eotg_cartel_flavor_0009_desc:0 "Rumors are moving through the cartel's inner ranks: informants have gotten inside the organization. Someone is passing information to outside authorities. The paranoia this generates may be more dangerous than any actual spy."
 eotg_cartel_flavor_0009_opt_investigate:0 "Launch a careful internal investigation."
 eotg_cartel_flavor_0009_opt_torture:0 "Interrogate suspects aggressively until someone talks."
 eotg_cartel_flavor_0009_opt_ignorerumors:0 "Ignore it. Paranoia is the real enemy."

 eotg_cartel_flavor_0010_title:0 "The Protection Expansion"
 eotg_cartel_flavor_0010_desc:0 "The empire's prosperity has attracted attention: there are more businesses than ever operating in the territory, and all of them could be contributing to the cartel's protection income. The question is how aggressively to press the advantage."
 eotg_cartel_flavor_0010_opt_expand:0 "Expand aggressively. Every business pays."
 eotg_cartel_flavor_0010_opt_moderate:0 "Keep demands moderate. Sustainable extraction."
 eotg_cartel_flavor_0010_opt_violence:0 "Use selective violence to set expectations."

 eotg_cartel_flavor_0011_title:0 "The Flood"
 eotg_cartel_flavor_0011_desc:0 "The illegal trade network is generating more volume than expected — far more. The goods are moving faster than the distribution infrastructure can handle. This is an opportunity. It is also a crisis waiting to happen."
 eotg_cartel_flavor_0011_opt_flood:0 "Flood the market. Maximum extraction now."
 eotg_cartel_flavor_0011_opt_control:0 "Control distribution. Steady profits matter more."
 eotg_cartel_flavor_0011_opt_restrict:0 "Restrict supply to drive up prices."

 eotg_cartel_flavor_0012_title:0 "The Public Execution"
 eotg_cartel_flavor_0012_desc:0 "A traitor has been caught — someone who passed information, stole resources, or planned betrayal. The cartel demands judgment. The question is not whether they will be executed, but how, and how publicly."
 eotg_cartel_flavor_0012_opt_brutal:0 "Make it as brutal and visible as possible."
 eotg_cartel_flavor_0012_opt_quick:0 "A clean execution. Efficient justice."
 eotg_cartel_flavor_0012_opt_spare:0 "Spare them publicly. Show calculated mercy."

 eotg_cartel_flavor_0013_title:0 "The Enforcers Go Too Far"
 eotg_cartel_flavor_0013_desc:0 "Cartel enforcers have been exceeding their mandate — terrorizing civilian populations, shaking down businesses beyond authorized limits, committing acts of violence that serve no strategic purpose. The reports are becoming impossible to ignore."
 eotg_cartel_flavor_0013_opt_encourage:0 "Encourage the terror. Fear is the point."
 eotg_cartel_flavor_0013_opt_restrain:0 "Restrain them. Excessive violence breeds resistance."
 eotg_cartel_flavor_0013_opt_profitchaos:0 "Profit from the chaos they create."

 eotg_cartel_flavor_0014_title:0 "The Succession Question"
 eotg_cartel_flavor_0014_desc:0 "The Grand Underlord is not getting younger, and the lieutenants know it. The quiet competition has already begun — favors being traded, alliances being tested, weaknesses being catalogued. Succession in a cartel is never peaceful."
 eotg_cartel_flavor_0014_opt_name:0 "Name a successor and shore up the transition."
 eotg_cartel_flavor_0014_opt_compete:0 "Encourage competition. The strongest will emerge."
 eotg_cartel_flavor_0014_opt_elimrivals:0 "Quietly eliminate the most dangerous rivals."

 eotg_cartel_flavor_0015_title:0 "The Legend Grows"
 eotg_cartel_flavor_0015_desc:0 "Stories are spreading across the underworld — tales of the Grand Underlord's cunning, brutality, and indestructibility. The stories are exaggerated. They are also useful. A legend is a kind of armor."
 eotg_cartel_flavor_0015_opt_encourage:0 "Encourage the myth. Fear of a legend is better than fear of a person."
 eotg_cartel_flavor_0015_opt_publicpersona:0 "Build a more visible public persona."
 eotg_cartel_flavor_0015_opt_shadows:0 "Remain hidden. Shadows protect better than legends."

 eotg_cartel_flavor_0016_title:0 "The Feast of the Underworld"
 eotg_cartel_flavor_0016_desc:0 "The operation has been prosperous, and prosperity demands celebration — lavish, visible, unapologetic. The cartel's inner circle gathers for a feast where business is conducted between courses and loyalties are tested over strong drink."
 eotg_cartel_flavor_0016_opt_reward:0 "Reward loyal lieutenants generously."
 eotg_cartel_flavor_0016_opt_secretdeals:0 "Use the occasion for quiet deal-making."
 eotg_cartel_flavor_0016_opt_excess:0 "Spare nothing. Show absolute wealth."
