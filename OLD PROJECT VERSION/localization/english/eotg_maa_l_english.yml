l_english:
 # ── Men-at-Arms — Echoes of the Grip ─────────────────────────────────────────
 # Localization for common/men_at_arms_types/eotg_maa_types.txt.
 # Names and intent are taken from that file's own "Loc intent" comments —
 # it was written with the copy in place and the loc deferred. This closes it.
 #
 # These are the highest-traffic strings in the military panel, so they carry
 # most of the weight in making armies read as post-Grip rather than medieval:
 # no horses, no bowmen, no siege engines.
 # ─────────────────────────────────────────────────────────────────────────────

 # heavy_infantry — the backbone
 eotg_maa_line_troopers:0 "Line Troopers"
 eotg_maa_line_troopers_flavor:0 "Sealed-suit infantry in matched plate, moving at the pace of the slowest rebreather. Every successor state fields them, every one of them claims to have invented them, and none of the surviving patterns predate the Grip. This is what post-Grip war looks like when nobody is being clever."

 # skirmishers — counters heavy infantry
 eotg_maa_recon_drones:0 "Recon Drone Teams"
 eotg_maa_recon_drones_flavor:0 "A handler, a launch rack, and a swarm that goes looking for the seam where two armor plates disagree. They are gone before the reply arrives, which is fortunate, because a handler carries nothing that would survive one."

 # archers — counters skirmishers
 eotg_maa_railgun_teams:0 "Railgun Teams"
 eotg_maa_railgun_teams_flavor:0 "Crew-served hypervelocity fire delivered from the next ridge over, or the one after that. Nothing lightly armored crosses open ground toward a dug-in railgun team twice. In close country they are so much expensive scrap with a long barrel."

 # pikemen — counters cavalry
 eotg_maa_aegis_wardens:0 "Aegis Wardens"
 eotg_maa_aegis_wardens_flavor:0 "Barrier-projector lines advancing in step — a wall of hardened light that walks. What charges it stops, abruptly and at its own expense. Wardens ask only for level, dry ground and a power feed that nobody has cut."

 # light_cavalry — counters archers
 eotg_maa_strike_speeders:0 "Strike Speeders"
 eotg_maa_strike_speeders_flavor:0 "Grav-effect skimmers running a handspan off the deck, built for the flank, the pursuit, and the long knife-work after a line comes apart. Give them open expanse and they are ruinous. Give them broken ground or standing water and they are a very fast way to lose good crews."

 # heavy_cavalry — the elite shock unit
 eotg_maa_combat_walkers:0 "Combat Walkers"
 eotg_maa_combat_walkers_flavor:0 "Salvage-pattern war frames, three times the height of the crew inside them, and the closest thing to Second Era armor still marching anywhere in settled space. No one alive can build a new one. Every walker in the galaxy is a repair of a repair, and they are still the most terrifying thing most systems will ever see."

 # siege_weapon — sieges, reimagined
 eotg_maa_orbital_breachers:0 "Orbital Breachers"
 eotg_maa_orbital_breachers_flavor:0 "Target-designation teams whose entire function is to hold a mark steady until the bombardment window opens overhead. They carry no weapon worth the name. Sieges end differently now, and they end from directly above."

 # heavy_infantry elite — PMC and corporate only
 eotg_maa_operators:0 "Operators"
 eotg_maa_operators_flavor:0 "The contract-soldier elite of the PMC and corporate outfits — small teams, superb equipment, and an hourly rate that reads like a siege budget. They are available strictly to the organizations that can bill for them, which is the entire point of the arrangement."
