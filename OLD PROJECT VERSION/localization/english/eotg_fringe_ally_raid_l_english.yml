l_english:
 # ── Fringe Ally Raid Events ──────────────────────────────────────────────────

 # Event 0001 — Fringe ruler: choose posture after raiding ally
 eotg_fringe_ally_raid_0001_title:0 "An Ally's Holdings Plundered"
 eotg_fringe_ally_raid_0001_desc:0 "Your raiders have hit [eotg_raid_ally.GetName]'s holdings. The smoke is still rising. Word will reach them within hours — and they will demand an answer. The question is: what answer do you give?"

 eotg_fringe_ally_raid_0001_opt_bold:0 "No quarter, not even for friends. The Fringe respects strength."
 eotg_fringe_ally_raid_0001_opt_tribute:0 "Send a share of the spoils ahead. Frame it as a tax."
 eotg_fringe_ally_raid_0001_opt_deny:0 "Blame the lieutenants. It was unauthorized."

 # Event 0002 — Allied target reacts
 eotg_fringe_ally_raid_0002_title:0 "Raiders in Our Lands"
 eotg_fringe_ally_raid_0002_desc_bold:0 "[eotg_raid_raider.GetName] has raided our holdings and sent no apology — not even a token gesture. This is a deliberate provocation."
 eotg_fringe_ally_raid_0002_desc_tribute:0 "[eotg_raid_raider.GetName] has raided our holdings and sent a share of the spoils as tribute. The gesture is there, but the insult is real."
 eotg_fringe_ally_raid_0002_desc_deny:0 "[eotg_raid_raider.GetName] claims the raid was unauthorized — rogue captains acting without orders. We can accept that story, or call it the lie it almost certainly is."

 eotg_fringe_ally_raid_0002_opt_demand:0 "Demand reparations — or face the consequences."
 eotg_fringe_ally_raid_0002_opt_protest:0 "Lodge a formal protest. The alliance is strained."
 eotg_fringe_ally_raid_0002_opt_accept:0 "Accept it. This is the Fringe. We knew who we were allying with."

 # Event 0003 — Fringe ruler receives reaction
 eotg_fringe_ally_raid_0003_title:0 "The Ally's Answer"
 eotg_fringe_ally_raid_0003_desc_demand:0 "[eotg_result_ally.GetName] is furious. Their messenger arrived with a list of demands — gold, a formal apology, or the promise of future restraint. They want compensation, or they want war."
 eotg_fringe_ally_raid_0003_desc_protest:0 "[eotg_result_ally.GetName] has responded through formal channels — a protest, measured and cold. They are not declaring war. Not yet. But the alliance is fraying at the seams."
 eotg_fringe_ally_raid_0003_desc_accept:0 "[eotg_result_ally.GetName] has swallowed the insult. Their response was silence — then a curt acknowledgment. They are not happy. But they are not breaking the alliance over it."

 eotg_fringe_ally_raid_0003_opt_demand_pay:0 "Pay them. A grudging peace is still peace."
 eotg_fringe_ally_raid_0003_opt_demand_refuse:0 "Refuse. Strength doesn't apologize."
 eotg_fringe_ally_raid_0003_opt_protest_acknowledge:0 "Acknowledge the protest. Send reassurances."
 eotg_fringe_ally_raid_0003_opt_protest_dismiss:0 "Dismiss it. Protests mean nothing in the Fringe."
 eotg_fringe_ally_raid_0003_opt_accept:0 "Good. They understand how the Fringe works."
