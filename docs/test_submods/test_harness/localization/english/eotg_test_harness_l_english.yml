l_english:
 # In-game test harness (docs/qa/TEST_HARNESS.md). Debug only. GENERATED by docs/tools/gen_test_harness.py.
 eotg_decision_test_cy1_tier_ladder:0 "(Test) CY1: Tier Ladder"
 eotg_decision_test_cy1_tier_ladder_desc:0 "Testing only. Initiates you, then raises you to Enhanced and Overclocked a day apart, and checks the tier and the prowess total at each step (+2, +4, +8). Start from an unaugmented character. Results go to logs/debug.log on lines starting EOTG_TEST CY1."
 eotg_decision_test_cy1_tier_ladder_tooltip:0 "Testing only: Tier Ladder"
 eotg_decision_test_cy1_tier_ladder_confirm:0 "Run the test"
 eotg_decision_test_cy2_neurofractured:0 "(Test) CY2: Neurofractured End State"
 eotg_decision_test_cy2_neurofractured_desc:0 "Testing only. As a ruler with the cybernetics trait: adds the Neurofractured trait, as the session plan does, and checks that it replaced the cybernetics trait. Run CY1 first. Results go to logs/debug.log on lines starting EOTG_TEST CY2."
 eotg_decision_test_cy2_neurofractured_tooltip:0 "Testing only: Neurofractured End State"
 eotg_decision_test_cy2_neurofractured_confirm:0 "Run the test"
 eotg_decision_test_cy3_seamless:0 "(Test) CY3: Seamless End State"
 eotg_decision_test_cy3_seamless_desc:0 "Testing only. Adds the Seamless trait with 3 residue, as the session plan does, and checks the trait. The Frontier flavour exclusion is a look check. Results go to logs/debug.log on lines starting EOTG_TEST CY3."
 eotg_decision_test_cy3_seamless_tooltip:0 "Testing only: Seamless End State"
 eotg_decision_test_cy3_seamless_confirm:0 "Run the test"
 eotg_decision_test_cy4_cascade_threshold:0 "(Test) CY4: Neural Cascade at the Threshold"
 eotg_decision_test_cy4_cascade_threshold_desc:0 "Testing only. As an Overclocked ruler: sets the fracture risk to the threshold (80) and runs the yearly Overclocked pulse once, then checks that the Neural Cascade made you Neurofractured and reset the risk. Run CY1 first. Results go to logs/debug.log on lines starting EOTG_TEST CY4."
 eotg_decision_test_cy4_cascade_threshold_tooltip:0 "Testing only: Neural Cascade at the Threshold"
 eotg_decision_test_cy4_cascade_threshold_confirm:0 "Run the test"
 eotg_decision_test_cy5_track_ai_values:0 "(Test) CY5: Track AI Values on a Courtier"
 eotg_decision_test_cy5_track_ai_values_desc:0 "Testing only. Initiates an unaugmented adult AI courtier, then raises them a tier every 3 days. Hover them in debug mode at each step and note the AI values. Results go to logs/debug.log on lines starting EOTG_TEST CY5."
 eotg_decision_test_cy5_track_ai_values_tooltip:0 "Testing only: Track AI Values on a Courtier"
 eotg_decision_test_cy5_track_ai_values_confirm:0 "Run the test"
 eotg_decision_test_cy6_wound_repair:0 "(Test) CY6: Wound Rank 3 and the Repair Offer"
 eotg_decision_test_cy6_wound_repair_desc:0 "Testing only. As an augmented ruler: clears the real repair cooldown (eotg_flag_aug_repair_cooldown), raises your wound to rank 3 without ever passing it, then checks that the repair hook saw the wound. Results go to logs/debug.log on lines starting EOTG_TEST CY6."
 eotg_decision_test_cy6_wound_repair_tooltip:0 "Testing only: Wound Rank 3 and the Repair Offer"
 eotg_decision_test_cy6_wound_repair_confirm:0 "Run the test"
 eotg_decision_test_fr1a_start_military:0 "(Test) FR1a: Start a Military Frontier"
 eotg_decision_test_fr1a_start_military_desc:0 "Testing only. Marks your capital Shoal Unsettled and starts a Military Frontier there with you as the founder, then checks the state. Results go to logs/debug.log on lines starting EOTG_TEST FR1a."
 eotg_decision_test_fr1a_start_military_tooltip:0 "Testing only: Start a Military Frontier"
 eotg_decision_test_fr1a_start_military_confirm:0 "Run the test"
 eotg_decision_test_fr1b_start_settlement:0 "(Test) FR1b: Start a Settlement Frontier"
 eotg_decision_test_fr1b_start_settlement_desc:0 "Testing only. Marks your capital Shoal Unsettled and starts a Settlement Frontier there with you as the founder, then checks the state. Results go to logs/debug.log on lines starting EOTG_TEST FR1b."
 eotg_decision_test_fr1b_start_settlement_tooltip:0 "Testing only: Start a Settlement Frontier"
 eotg_decision_test_fr1b_start_settlement_confirm:0 "Run the test"
 eotg_decision_test_fr1c_start_religious:0 "(Test) FR1c: Start a Religious Frontier"
 eotg_decision_test_fr1c_start_religious_desc:0 "Testing only. Marks your capital Shoal Unsettled and starts a Religious Frontier there with you as the founder, then checks the state. Results go to logs/debug.log on lines starting EOTG_TEST FR1c."
 eotg_decision_test_fr1c_start_religious_tooltip:0 "Testing only: Start a Religious Frontier"
 eotg_decision_test_fr1c_start_religious_confirm:0 "Run the test"
 eotg_decision_test_fr2_force_completion:0 "(Test) FR2: Force Frontier Completion"
 eotg_decision_test_fr2_force_completion_desc:0 "Testing only. On the Frontier at your capital: sets progress to 100, raises development by 5 and control to 100, runs one Frontier year, then checks a week later that it completed. Answer the completion event as soon as it appears. Results go to logs/debug.log on lines starting EOTG_TEST FR2."
 eotg_decision_test_fr2_force_completion_tooltip:0 "Testing only: Force Frontier Completion"
 eotg_decision_test_fr2_force_completion_confirm:0 "Run the test"
 eotg_decision_test_fr3_clamps:0 "(Test) FR3: Progress and Strain Clamps"
 eotg_decision_test_fr3_clamps_desc:0 "Testing only. On the Frontier at your capital: pushes progress past 100, strain past 8 and progress below 0 through the real change effects, a day apart, and checks the clamps. Results go to logs/debug.log on lines starting EOTG_TEST FR3."
 eotg_decision_test_fr3_clamps_tooltip:0 "Testing only: Progress and Strain Clamps"
 eotg_decision_test_fr3_clamps_confirm:0 "Run the test"
 eotg_decision_test_fr4a_persistence_mark:0 "(Test) FR4a: Mark Persistence Probes"
 eotg_decision_test_fr4a_persistence_mark_desc:0 "Testing only. On the Frontier at your capital: adds the Remote trait and records the progress. Then save, quit to the menu, reload, and run FR4b. Results go to logs/debug.log on lines starting EOTG_TEST FR4A."
 eotg_decision_test_fr4a_persistence_mark_tooltip:0 "Testing only: Mark Persistence Probes"
 eotg_decision_test_fr4a_persistence_mark_confirm:0 "Run the test"
 eotg_decision_test_fr4b_persistence_check:0 "(Test) FR4b: Check Persistence"
 eotg_decision_test_fr4b_persistence_check_desc:0 "Testing only. After a save and reload: checks that the capital is still a Frontier with the same progress and the Remote trait. Run FR4a first. Results go to logs/debug.log on lines starting EOTG_TEST FR4B."
 eotg_decision_test_fr4b_persistence_check_tooltip:0 "Testing only: Check Persistence"
 eotg_decision_test_fr4b_persistence_check_confirm:0 "Run the test"
 eotg_decision_test_fr5_exploration:0 "(Test) FR5: Mark the Capital Unexplored"
 eotg_decision_test_fr5_exploration_desc:0 "Testing only. Marks your capital Shoal Unknown with the real effect, checks the exploration state, then clears it again so the capital is not left Unknown. Skipped while the capital is a Frontier. Results go to logs/debug.log on lines starting EOTG_TEST FR5."
 eotg_decision_test_fr5_exploration_tooltip:0 "Testing only: Mark the Capital Unexplored"
 eotg_decision_test_fr5_exploration_confirm:0 "Run the test"
 eotg_decision_test_gv1_cartel_schedule:0 "(Test) GV1: Cartel Payment Schedule"
 eotg_decision_test_gv1_cartel_schedule_desc:0 "Testing only. As an independent Cartel ruler: tops up your dread, puts one independent neighbour on the payment schedule through the real effect, and checks the contract, the payer count and that the baseline rose by 4. Results go to logs/debug.log on lines starting EOTG_TEST GV1."
 eotg_decision_test_gv1_cartel_schedule_tooltip:0 "Testing only: Cartel Payment Schedule"
 eotg_decision_test_gv1_cartel_schedule_confirm:0 "Run the test"
 eotg_decision_test_gv2_cartel_walk_off:0 "(Test) GV2: Cartel Walk-Off"
 eotg_decision_test_gv2_cartel_walk_off_desc:0 "Testing only. As a Cartel ruler with payers: runs the dread walk-off once, as the yearly tick would, and checks that exactly one payer left. Results go to logs/debug.log on lines starting EOTG_TEST GV2."
 eotg_decision_test_gv2_cartel_walk_off_tooltip:0 "Testing only: Cartel Walk-Off"
 eotg_decision_test_gv2_cartel_walk_off_confirm:0 "Run the test"
 eotg_decision_test_gv3_elective_candidate:0 "(Test) GV3: Elective Candidate Rule"
 eotg_decision_test_gv3_elective_candidate_desc:0 "Testing only. As a Corporation, Trade Oligarchy or Cartel ruler: checks that the projected successor is of your dynasty (candidates are limited to the dynasty; electors are not). Results go to logs/debug.log on lines starting EOTG_TEST GV3."
 eotg_decision_test_gv3_elective_candidate_tooltip:0 "Testing only: Elective Candidate Rule"
 eotg_decision_test_gv3_elective_candidate_confirm:0 "Run the test"
 eotg_decision_test_gv4_cartel_core:0 "(Test) GV4: Cartel Resource Core"
 eotg_decision_test_gv4_cartel_core_desc:0 "Testing only. As a landed Cartel ruler: checks the Payment Schedule story and the baseline modifier that init gives every landed Cartel ruler. Results go to logs/debug.log on lines starting EOTG_TEST GV4."
 eotg_decision_test_gv4_cartel_core_tooltip:0 "Testing only: Cartel Resource Core"
 eotg_decision_test_gv4_cartel_core_confirm:0 "Run the test"
 eotg_decision_test_al1_frontier_breaking:0 "(Test) AL1: Alert: Frontier at Breaking Strain"
 eotg_decision_test_al1_frontier_breaking_desc:0 "Testing only. On the Frontier at your capital: sets strain to 6 and checks the alert condition. Then look at the top bar. Results go to logs/debug.log on lines starting EOTG_TEST AL1."
 eotg_decision_test_al1_frontier_breaking_tooltip:0 "Testing only: Alert: Frontier at Breaking Strain"
 eotg_decision_test_al1_frontier_breaking_confirm:0 "Run the test"
 eotg_decision_test_al2_frontier_founderless:0 "(Test) AL2: Alert: Frontier Without a Founder"
 eotg_decision_test_al2_frontier_founderless_desc:0 "Testing only. On the Frontier at your capital: removes the founder record and checks the alert condition. Then look at the top bar. Results go to logs/debug.log on lines starting EOTG_TEST AL2."
 eotg_decision_test_al2_frontier_founderless_tooltip:0 "Testing only: Alert: Frontier Without a Founder"
 eotg_decision_test_al2_frontier_founderless_confirm:0 "Run the test"
 eotg_decision_test_al3_establish_ready:0 "(Test) AL3: Alert: A Frontier Can Be Established"
 eotg_decision_test_al3_establish_ready_desc:0 "Testing only. Marks your capital Shoal Unsettled (if it has no Frontier state) and checks the alert condition. Then look at the top bar. Skipped while a Frontier runs or the capital is Unknown. Results go to logs/debug.log on lines starting EOTG_TEST AL3."
 eotg_decision_test_al3_establish_ready_tooltip:0 "Testing only: Alert: A Frontier Can Be Established"
 eotg_decision_test_al3_establish_ready_confirm:0 "Run the test"
 eotg_decision_test_al4_calibration_lapsed:0 "(Test) AL4: Alert: Implant Calibration Lapsed"
 eotg_decision_test_al4_calibration_lapsed_desc:0 "Testing only. As a ruler with the cybernetics trait: removes the calibration modifier, then says whether the top-bar alert should show. A look test. Results go to logs/debug.log on lines starting EOTG_TEST AL4."
 eotg_decision_test_al4_calibration_lapsed_tooltip:0 "Testing only: Alert: Implant Calibration Lapsed"
 eotg_decision_test_al4_calibration_lapsed_confirm:0 "Run the test"
 eotg_decision_test_gr1_game_rules:0 "(Test) GR1: Read the Game Rules"
 eotg_decision_test_gr1_game_rules_desc:0 "Testing only. Logs the active setting of every mod game rule, and fails any rule that reads no known setting. Results go to logs/debug.log on lines starting EOTG_TEST GR1."
 eotg_decision_test_gr1_game_rules_tooltip:0 "Testing only: Read the Game Rules"
 eotg_decision_test_gr1_game_rules_confirm:0 "Run the test"
 eotg_decision_test_gp1_pmc_standing:0 "(Test) GP1: PMC Resource Follows a Change"
 eotg_decision_test_gp1_pmc_standing_desc:0 "Testing only. As a landed PMC ruler: reads your standing, moves it by +10 (or -10 near the top) through its only writer, then by 120 past the cap, and checks the story counter, the modifier and the clamp each time. Results go to logs/debug.log on lines starting EOTG_TEST GP1."
 eotg_decision_test_gp1_pmc_standing_tooltip:0 "Testing only: PMC Resource Follows a Change"
 eotg_decision_test_gp1_pmc_standing_confirm:0 "Run the test"
 eotg_decision_test_gc1_corp_influence:0 "(Test) GC1: Corporation Resource Follows a Change"
 eotg_decision_test_gc1_corp_influence_desc:0 "Testing only. As a landed Corporation ruler: reads your board influence, moves it by +10 (or -10 near the top) through its only writer, then by 120 past the cap, and checks the story counter, the modifier and the clamp each time. Results go to logs/debug.log on lines starting EOTG_TEST GC1."
 eotg_decision_test_gc1_corp_influence_tooltip:0 "Testing only: Corporation Resource Follows a Change"
 eotg_decision_test_gc1_corp_influence_confirm:0 "Run the test"
 eotg_decision_test_gt1_gobcorp_share:0 "(Test) GT1: Trade Oligarchy Resource Follows a Change"
 eotg_decision_test_gt1_gobcorp_share_desc:0 "Testing only. As a landed Trade Oligarchy ruler: reads your market share, moves it by +10 (or -10 near the top) through its only writer, then by 120 past the cap, and checks the story counter, the modifier and the clamp each time. Results go to logs/debug.log on lines starting EOTG_TEST GT1."
 eotg_decision_test_gt1_gobcorp_share_tooltip:0 "Testing only: Trade Oligarchy Resource Follows a Change"
 eotg_decision_test_gt1_gobcorp_share_confirm:0 "Run the test"
 eotg_decision_test_gp2_pmc_battle_feed:0 "(Test) GP2: PMC Battle Feed Values"
 eotg_decision_test_gp2_pmc_battle_feed_desc:0 "Testing only. As a landed PMC ruler with standing between 3 and 97: applies the battle-won value, then the battle-lost value, through the standing writer, and checks +2 then -3 exactly. The battle hook itself is a look check. Results go to logs/debug.log on lines starting EOTG_TEST GP2."
 eotg_decision_test_gp2_pmc_battle_feed_tooltip:0 "Testing only: PMC Battle Feed Values"
 eotg_decision_test_gp2_pmc_battle_feed_confirm:0 "Run the test"
 eotg_decision_test_gc2a_court_board_record:0 "(Test) GC2a: Court the Board, Record (Normal Path)"
 eotg_decision_test_gc2a_court_board_record_desc:0 "Testing only. As a Corporation vassal under a Corporation liege: records your influence, the projected value and your liege's influence and erosion state. Then take Court the Board yourself, and run GC2c the next day. Results go to logs/debug.log on lines starting EOTG_TEST GC2A."
 eotg_decision_test_gc2a_court_board_record_tooltip:0 "Testing only: Court the Board, Record (Normal Path)"
 eotg_decision_test_gc2a_court_board_record_confirm:0 "Run the test"
 eotg_decision_test_gc2b_court_board_record:0 "(Test) GC2b: Court the Board, Record (Liege Already Eroded)"
 eotg_decision_test_gc2b_court_board_record_desc:0 "Testing only. As a Corporation vassal under a Corporation liege: marks your liege as already eroded this year (the decision's own guard), then records the same values. Then take Court the Board yourself, and run GC2c the next day. Results go to logs/debug.log on lines starting EOTG_TEST GC2B."
 eotg_decision_test_gc2b_court_board_record_tooltip:0 "Testing only: Court the Board, Record (Liege Already Eroded)"
 eotg_decision_test_gc2b_court_board_record_confirm:0 "Run the test"
 eotg_decision_test_gc2c_court_board_check:0 "(Test) GC2c: Court the Board, Check"
 eotg_decision_test_gc2c_court_board_check_desc:0 "Testing only. After GC2a or GC2b and the real Court the Board: checks your gain and that your liege lost exactly 5 only if not already eroded this year and only if your projected value was above theirs. Results go to logs/debug.log on lines starting EOTG_TEST GC2C."
 eotg_decision_test_gc2c_court_board_check_tooltip:0 "Testing only: Court the Board, Check"
 eotg_decision_test_gc2c_court_board_check_confirm:0 "Run the test"
 eotg_decision_test_gt2a_corner_record:0 "(Test) GT2a: Corner the Market, Record"
 eotg_decision_test_gt2a_corner_record_desc:0 "Testing only. As the top Trade Oligarch with Trade Oligarchy vassals: records your share and each vassal Prince's, and marks one Prince as already cornered this year when you have two or more. Then take Corner the Market, and run GT2b the next day. Results go to logs/debug.log on lines starting EOTG_TEST GT2A."
 eotg_decision_test_gt2a_corner_record_tooltip:0 "Testing only: Corner the Market, Record"
 eotg_decision_test_gt2a_corner_record_confirm:0 "Run the test"
 eotg_decision_test_gt2b_corner_check:0 "(Test) GT2b: Corner the Market, Check"
 eotg_decision_test_gt2b_corner_check_desc:0 "Testing only. After GT2a and the real Corner the Market: checks your gain, that every Prince not yet cornered lost exactly 5 and is now marked, and that the pre-marked Prince lost nothing. Results go to logs/debug.log on lines starting EOTG_TEST GT2B."
 eotg_decision_test_gt2b_corner_check_tooltip:0 "Testing only: Corner the Market, Check"
 eotg_decision_test_gt2b_corner_check_confirm:0 "Run the test"
 eotg_decision_test_ge1_corp_bands:0 "(Test) GE1: Corporation Election Bands"
 eotg_decision_test_ge1_corp_bands_desc:0 "Testing only. As a landed Corporation ruler: moves your value to each vote-strength band edge, a day apart, and says what the succession tooltip should show. Then restores the value. Results go to logs/debug.log on lines starting EOTG_TEST GE1."
 eotg_decision_test_ge1_corp_bands_tooltip:0 "Testing only: Corporation Election Bands"
 eotg_decision_test_ge1_corp_bands_confirm:0 "Run the test"
 eotg_decision_test_ge2_gobcorp_bands:0 "(Test) GE2: Trade Oligarchy Election Bands"
 eotg_decision_test_ge2_gobcorp_bands_desc:0 "Testing only. As a landed Trade Oligarchy ruler: moves your value to each vote-strength band edge, a day apart, and says what the succession tooltip should show. Then restores the value. Results go to logs/debug.log on lines starting EOTG_TEST GE2."
 eotg_decision_test_ge2_gobcorp_bands_tooltip:0 "Testing only: Trade Oligarchy Election Bands"
 eotg_decision_test_ge2_gobcorp_bands_confirm:0 "Run the test"
 eotg_decision_test_vd1_void_bands:0 "(Test) VD1: Void Exposure Bands"
 eotg_decision_test_vd1_void_bands_desc:0 "Testing only. As a ruler who is not Hollowed: moves Void exposure through 24, 25, 50 and 75 with its only writer, a day apart, and checks that exactly the right band modifier follows each time. Then restores your exposure. Results go to logs/debug.log on lines starting EOTG_TEST VD1."
 eotg_decision_test_vd1_void_bands_tooltip:0 "Testing only: Void Exposure Bands"
 eotg_decision_test_vd1_void_bands_confirm:0 "Run the test"
 eotg_decision_test_vd2_void_hollowing_path:0 "(Test) VD2: The Hollowing Through the Yearly Pulse"
 eotg_decision_test_vd2_void_hollowing_path_desc:0 "Testing only. Makes you Void-Touched with exposure 100 through the system's own effects, clears the Void event cooldown, runs the real yearly Void pulse once, and checks that the pulse set the cooldown itself. The Hollowing event follows: answer it (avoid stepping down if you want to keep playing this ruler), then run VD3. Skips if a Voidwalker is at court (VD4 leaves one). This ruler stays Hollowed: throwaway save. Results go to logs/debug.log on lines starting EOTG_TEST VD2."
 eotg_decision_test_vd2_void_hollowing_path_tooltip:0 "Testing only: The Hollowing Through the Yearly Pulse"
 eotg_decision_test_vd2_void_hollowing_path_confirm:0 "Run the test"
 eotg_decision_test_vd3_void_depth:0 "(Test) VD3: Hollowing Depth Bands and Drift"
 eotg_decision_test_vd3_void_depth_desc:0 "Testing only. As a Hollowed ruler (run VD2 first): checks the Hollowed state, moves Hollowing depth through 50, 85 and 10 with its only writer and checks the depth band each time, then runs the yearly Void pulse once and checks the +4 drift. Restores your depth. Results go to logs/debug.log on lines starting EOTG_TEST VD3."
 eotg_decision_test_vd3_void_depth_tooltip:0 "Testing only: Hollowing Depth Bands and Drift"
 eotg_decision_test_vd3_void_depth_confirm:0 "Run the test"
 eotg_decision_test_vd4_voidwalker:0 "(Test) VD4: The Voidwalker at Court"
 eotg_decision_test_vd4_voidwalker_desc:0 "Testing only. Creates and seats a Voidwalker with the same effects as option a of The Voidwalker at the Gate, then checks that the yearly accrual fell by exactly 6 and that the Voidwalker Ward decision can be taken. Results go to logs/debug.log on lines starting EOTG_TEST VD4."
 eotg_decision_test_vd4_voidwalker_tooltip:0 "Testing only: The Voidwalker at Court"
 eotg_decision_test_vd4_voidwalker_confirm:0 "Run the test"
 eotg_decision_test_vd5_void_insight:0 "(Test) VD5: One Insight per Character"
 eotg_decision_test_vd5_void_insight_desc:0 "Testing only. Runs the Void Insight effect twice and checks that both runs gave their +2 skill but only one Insight modifier was ever added. Results go to logs/debug.log on lines starting EOTG_TEST VD5."
 eotg_decision_test_vd5_void_insight_tooltip:0 "Testing only: One Insight per Character"
 eotg_decision_test_vd5_void_insight_confirm:0 "Run the test"
 eotg_decision_test_effect_tt:0 "Sets up the test scenario on this save and writes the result to logs/debug.log. Use a throwaway save."
