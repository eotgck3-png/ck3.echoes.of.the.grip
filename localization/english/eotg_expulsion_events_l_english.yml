l_english:

 # ── eotg_expulsion_events ─────────────────────────────────────────────────────

 # ── Event 0001: The Edict of Displacement (elven ruler) ──────────────────────

 eotg_expulsion.0001.t:0 "The Edict of Displacement"
 eotg_expulsion.0001.desc:0 "The surveys confirm what the prefects have been reporting for years — significant populations persist across multiple sectors within the sphere, and they do not share elven heritage. Their presence complicates cultural administration, strains institutional continuity, and undermines the coherence of the realm's identity. The Edict of Displacement has ample precedent within the sphere's legal tradition. The populations will be relocated. What remains is the question of method."

 eotg_expulsion.0001.a:0 "Issue formal relocation mandates. Give them timeframes and a designated direction."
 eotg_expulsion.0001.b:0 "Announce the edict and leave enforcement to the local prefects. They know the sectors."
 eotg_expulsion.0001.c:0 "Deploy the Sanctified Wardens directly. The sectors must be cleared — not merely encouraged toward the exit."

 # ── Event 0002: The Refugees At Our Door (neighboring ruler) ─────────────────

 eotg_expulsion.0002.t:0 "The Refugees At Our Door"
 eotg_expulsion.0002.desc:0 "[eotg_expulsion_expeller_char.GetFirstName] has issued a formal displacement edict covering populations across multiple sectors in [eotg_expulsion_expeller_char.GetPrimaryTitle.GetNameNoTier]. The first waves are already appearing at our frontier relay stations — laborers, professionals, families. They carry what they were able to recover. They have no declared destination. Their numbers will only grow."
 eotg_expulsion.0002.desc_violent:0 "The Sanctified Wardens of [eotg_expulsion_expeller_char.GetFirstName] have been given free enforcement authority across the displaced populations in [eotg_expulsion_expeller_char.GetPrimaryTitle.GetNameNoTier]. What is arriving at our border is not an organized migration. It is a rout. Wounded. Frightened. Largely unarmed. And completely without options."

 eotg_expulsion.0002.a:0 "Refugees are not invaders. Direct them to settlement sectors and extend formal protection."
 eotg_expulsion.0002.b:0 "They want land and stability. I will offer them a sector — at a price."
 eotg_expulsion.0002.c:0 "This is not our crisis to absorb. Turn them back at the border."
 eotg_expulsion.0002.d:0 "Route them toward [eotg_third_ruler.GetFirstName]'s borders instead. That is a problem I can make someone else's."
 eotg_expulsion.0002.e:0 "They are foreign nationals entering sovereign space without authorization. Treat this as a hostile incursion."

 # ── Event 0003: The Desperate Stand (ruler who drove them off) ───────────────

 eotg_expulsion.0003.t:0 "The Desperate Stand"
 eotg_expulsion.0003.desc:0 "They have nothing left to lose. The displaced populations turned away from our border have organized under a warlord who has made a simple calculation: if the sector will not take them in, the sector will be taken from it. A warband is moving on the frontier. The pressed claim is filed. The war is coming whether we answer it or not."

 eotg_expulsion.0003.a:0 "Call the garrison fleets. This ends here — one way or another."
 eotg_expulsion.0003.b:0 "Let the claim stand and the war be fought properly. We will face them in the field."
 eotg_expulsion.0003.c:0 "They want a sector to call their own. Perhaps that was always all they were asking for."
 eotg_expulsion.0003.d:0 "We cannot afford the war. Give them the border sector and close the file."

 # ── Event 0004: A Problem Resolved (elven expeller notification) ─────────────

 eotg_expulsion.0004.t:0 "A Problem Resolved — By Others"
 eotg_expulsion.0004.desc:0 "The displaced populations cleared by the edict have been received by [eotg_expulsion_receiver_char.GetFirstName]. They are establishing themselves beyond the sphere's boundary. The sectors are clear. The edict held. What remains is a question of satisfaction."

 eotg_expulsion.0004.a:0 "Satisfactory. They are no longer our concern."
 eotg_expulsion.0004.b:0 "They settled too close. [eotg_expulsion_receiver_char.GetFirstName] will hear my position on this arrangement."
 eotg_expulsion.0004.c:0 "Send word that this settlement arrangement requires considerably more distance from our sphere of administration."

 # ── Event 0005: An Uninvited Migration (third ruler — chain deflected) ────────

 eotg_expulsion.0005.t:0 "An Uninvited Migration"
 eotg_expulsion.0005.desc:0 "[eotg_expulsion_deflector_char.GetFirstName] has redirected a displacement wave toward our territory — without consultation, without agreement, without warning. [eotg_expulsion_deflector_char.GetHerHis] realm found it convenient. We are left to manage the consequences of an edict we had no part in issuing and a decision we were never given the chance to refuse."

 eotg_expulsion.0005.a:0 "They are here. Accept them and put the sectors to use."
 eotg_expulsion.0005.b:0 "We did not ask for this. Push them back — they are not our burden."
 eotg_expulsion.0005.c:0 "Accept them. And make certain [eotg_expulsion_deflector_char.GetFirstName] understands exactly what kind of neighbor [eotg_expulsion_deflector_char.GetSheHe] has chosen to be."

 # ── Event 0006: The Dust Settles (military aftermath beat) ───────────────────

 eotg_expulsion.0006.t:0 "The Dust Settles"
 eotg_expulsion.0006.desc_victory:0 "The warband is broken. The contested sector held — barely — but the frontier survives under your banner. The warlord has scattered. The cost was real. The result was ours."
 eotg_expulsion.0006.desc_stalemate:0 "The fighting ended without a clean resolution. The sector stands, but the damage runs deep — control is fractured, infrastructure is wrecked, and the warlord retreated to the margins with enough force to be a persistent problem. It is over for now. Whether it stays over is another question."
 eotg_expulsion.0006.desc_defeat:0 "The defense collapsed. The sector has been taken. The culture and faith that were there are gone, replaced by the very people who were turned away at our border. The warlord holds what was ours. We do not."
 eotg_expulsion.0006.a:0 "Mark the outcome and move on."

 # ── Modifier Names ────────────────────────────────────────────────────────────

 eotg_expulsion_relocation_zone:0 "Relocation Zone"
 eotg_expulsion_relocation_zone_desc:0 "This sector has been designated under a cultural displacement edict. The population is in transition, infrastructure is strained, and administrative continuity is disrupted."

 eotg_expulsion_refugee_settlement:0 "Refugee Settlement"
 eotg_expulsion_refugee_settlement_desc:0 "Displaced populations from a neighboring expulsion edict have been settled in this sector. Cultural identity is shifting; integration is ongoing."

 eotg_expulsion_desperate_border:0 "Desperate Border"
 eotg_expulsion_desperate_border_desc:0 "Turned-away refugee populations are massing at the frontier. Control is deteriorating and the risk of organized violence is rising."

 eotg_expulsion_contested_sector:0 "Contested Sector"
 eotg_expulsion_contested_sector_desc:0 "This sector is disputed following a refugee uprising. Governance is unstable, control is contested, and the situation has not fully resolved."

 eotg_expulsion_exile_edict_issued:0 "Exile Edict Issued"
 eotg_expulsion_exile_edict_issued_desc:0 "This ruler has issued a formal displacement edict against non-elven populations within the sphere. The precedent is set; the political consequences are accumulating."

 eotg_expulsion_harboring_refugees:0 "Harboring the Displaced"
 eotg_expulsion_harboring_refugees_desc:0 "This ruler has accepted displaced populations from a neighboring expulsion. Administrative strain is elevated; relations with the expelled culture are improved."

 eotg_expulsion_massacre_infamy:0 "Massacre Infamy"
 eotg_expulsion_massacre_infamy_desc:0 "This ruler ordered the execution of unarmed displaced populations. The act is known. The piety debt is vast. The cultural rage from surviving communities will not fade quickly."

 eotg_expulsion_integration_strife:0 "Integration Strife"
 eotg_expulsion_integration_strife_desc:0 "Displaced populations have settled in this sector but integration has failed. Cultural friction is straining governance and suppressing development."

 eotg_expulsion_commander_advantage:0 "Pre-War Positioning"
 eotg_expulsion_commander_advantage_desc:0 "Forces are well-positioned ahead of the expected refugee uprising. Tactical advantage is on your side."

 eotg_expulsion_commander_weakness:0 "Forces Scattered"
 eotg_expulsion_commander_weakness_desc:0 "The displacement crisis has left your forces dispersed and poorly coordinated. You are entering the coming conflict from a weakened position."

 # ── Opinion Modifier Names ────────────────────────────────────────────────────

 eotg_expulsion_opinion_chain_deflection:0 "Forced Migration Resentment"
 eotg_expulsion_opinion_proximity_grievance:0 "Settled Too Close"
 eotg_expulsion_opinion_elven_pressure:0 "Elven Diplomatic Pressure"
 eotg_expulsion_opinion_massacre:0 "Executed Our Refugees"
 eotg_expulsion_opinion_diplomatic_censure:0 "Formal Diplomatic Censure"
