 eotg_aug_start_tamper.tt.agent_focus_speed:0 "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_footpad' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_physic' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]"
 eotg_aug_start_tamper.tt.agent_focus_secrecy:0 "$schemes.tt.agent_packages.list_boilerplate$\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_lookout' ).GetName]\n$EFFECT_LIST_BULLET$[secrecy_i] [GetAgentSlotType( 'agent_decoy' ).GetName]\n$EFFECT_LIST_BULLET$[success_chance_max_i] [GetAgentSlotType( 'agent_physic' ).GetName]\n$EFFECT_LIST_BULLET$[scheme_speed_i] [GetAgentSlotType( 'agent_infiltrator' ).GetName]"
 eotg_aug_offer_accepted_toast:0 "[recipient.GetName] Accepts the Implants"
 eotg_aug_offer_declined_toast:0 "[recipient.GetName] Declines the Implants"
 eotg_aug_demand_accepted_toast:0 "[recipient.GetName] Agrees to the Removal"
 eotg_aug_demand_declined_toast:0 "[recipient.GetName] Refuses the Removal"
 eotg_aug_examine_declined_toast:0 "[recipient.GetName] Will Not Be Examined"
 eotg_aug_demand_removal_effect_tt:0 "Every implant comes out. How it goes is decided on the table."
 eotg_aug_salvage_effect_tt:0 "The hardware comes out. What else comes with it is decided on the table."
 eotg_aug_tamper_foiled_toast:0 "Hands on My Hardware"
 eotg_aug_tamper_foiled_toast_desc:0 "[owner.GetName]'s agents were caught at your implants."
 eotg_aug_trace_success_tt:0 "The trail can be followed: tool marks, a replaced seal, someone who talked."
 eotg_aug_trace_failure_tt:0 "The trail goes cold. Nothing was left to follow."
 EOTG_AUG_AI_LIEGE:0 "A liege's wish"
 EOTG_AUG_AI_AMBITIOUS:0 "Ambitious"
 EOTG_AUG_AI_CYNICAL:0 "Cynical"
 EOTG_AUG_AI_BRAVE:0 "Brave"
 EOTG_AUG_AI_GREEDY:0 "Greedy"
 EOTG_AUG_AI_LOSS:0 "Wants what was lost restored"
 EOTG_AUG_AI_CRAVEN:0 "Craven"
 EOTG_AUG_AI_CONTENT:0 "Content"
 EOTG_AUG_AI_PARANOID:0 "Paranoid"
 EOTG_AUG_AI_HUMBLE:0 "Humble"
 EOTG_AUG_AI_ZEALOUS:0 "Zealous"
 EOTG_AUG_AI_FORMER:0 "Has had implants taken out before"
 EOTG_AUG_AI_CLINIC:0 "A sanctioned clinic does the work"
 EOTG_AUG_AI_PHYSICIAN:0 "A physician does the work"
 EOTG_AUG_AI_BACKSTREET:0 "Back-street hands"
 EOTG_AUG_AI_TIER_AUGMENTED:0 "Only lightly augmented"
 EOTG_AUG_AI_TIER_ENHANCED:0 "Enhanced"
 EOTG_AUG_AI_TIER_OVERCLOCKED:0 "Overclocked"
 EOTG_AUG_AI_STUBBORN:0 "Stubborn"
 EOTG_AUG_AI_ARROGANT:0 "Arrogant"
 EOTG_AUG_AI_STRESS:0 "Under strain"
 EOTG_AUG_AI_COUNTDOWN:0 "The hardware is failing"
 EOTG_AUG_AI_ILLEGAL:0 "Black-market implants"
 EOTG_AUG_AI_TRUSTING:0 "Trusting"
 EOTG_AUG_AI_DECEITFUL:0 "Deceitful"
 eotg_aug_tamper:0 "Tamper with Implants"
 eotg_aug_tamper_action:0 "Tampering with Implants"
 eotg_aug_tamper_desc:0 "Agents need a few unwatched hours, an open maintenance hatch, and a target who does not wake."
 eotg_aug_tamper_desc_general:0 "Get hands on a target's hardware while no one is watching, and leave it worse than it was fitted."
 EOTG_AUG_TAMPER_SUCCESS_DESC:0 "The target's hardware is left with a fault. It misbehaves, and whoever opens it next will find the work harder."
 EOTG_AUG_TAMPER_DISCOVERY_DESC:0 "If the target learns whose hands it was, you can be imprisoned for it."
 eotg_aug_tamper_invalidated_title:0 "Tampering Abandoned"
 eotg_aug_tamper_invalidated_dead:0 "[target.GetName] is dead. There is no one left to work on."
 eotg_aug_tamper_invalidated_removed:0 "[target.GetName]'s hardware is out of reach: taken out, or integrated past anything the agents could open."
 EOTG_AUG_TAMPER_TARGET_PHYSICIAN:0 "A physician checks the hardware"
 EOTG_AUG_TAMPER_TARGET_ILLEGAL:0 "Back-street hardware, no seals on the panels"
 EOTG_AUG_TAMPER_TARGET_HARDENED:0 "Overclocked hardware is watched"
 EOTG_AUG_TAMPER_TARGET_FRACTURED:0 "Restrained or sedated, and handled by wardens"
 EOTG_AUG_TAMPER_OWNER_KNOWS:0 "Knows how this hardware is fitted"
 eotg_opinion_aug_forced_procedure:0 "Forced Procedure"
 eotg_opinion_aug_demanded_removal:0 "Demanded Implant Removal"
 eotg_opinion_aug_salvaged_me:0 "Cut Out My Implants"
 eotg_opinion_aug_salvaged_family_member:0 "Cut Out a Relative's Implants"
 eotg_opinion_aug_tampered:0 "Tampered with My Implants"
 eotg_aug_int.001.t:0 "The Physician's Report"
 eotg_aug_int.001.desc:0 "The examination is finished. The report on [eotg_examined.GetName]'s hardware is short and plain."
 eotg_aug_int.001.desc_fractured:0 "\n\nNone of the units is stable. The readings will not hold still long enough to be written down."
 eotg_aug_int.001.desc_oc_bad:0 "\n\nThe overclocked units are running hot, and have been for some time."
 eotg_aug_int.001.desc_oc_ok:0 "\n\nThe overclocked units run hot, but within tolerance."
 eotg_aug_int.001.desc_stable:0 "\n\nEverything is within tolerance. The fittings are clean."
 eotg_aug_int.001.desc_flaw:0 "\n\nOne unit is not what it was sold as. The part is cheaper than its casing claims, and it will not last."
 eotg_aug_int.001.desc_tampered:0 "\n\nSomeone has had a panel open. The seals have been replaced, and the calibration is not as it was fitted."
 eotg_aug_int.001.desc_infection:0 "\n\nThe tissue around the fittings is inflamed, and there is debris in it that should have come out."
 eotg_aug_int.001.desc_illegal:0 "\n\nIt is back-street work: no maker's marks, no records, fittings filed to size."
 eotg_aug_int.001.a:0 "Treat what you can."
 eotg_aug_int.001.b:0 "Fix the fault."
 eotg_aug_int.001.c:0 "Note it."
 eotg_aug_int.001.d:0 "Trace the tampering."
 eotg_aug_int.001.e:0 "Let me do it myself."
 eotg_aug_int.001.b.tt:0 "The fault is opened up and reworked. How it goes is decided on the table."
 eotg_aug_int.001.d.success:0 "Tool marks, a replaced seal, and a technician who talked. It leads to [eotg_saboteur.GetName]."
 eotg_aug_int.001.d.failure:0 "The trail goes cold. Whoever opened the panel left nothing to follow."
 eotg_aug_int.002.t:0 "What Came Out"
 eotg_aug_int.002.desc:0 "Everything taken from [recipient.GetName] has been cleaned and laid out on a tray. It is yours to do with as you like."
 eotg_aug_int.002.desc_augmented:0 "\n\nFirst-tier work: a handful of units on standard fittings. Worth something, not much."
 eotg_aug_int.002.desc_enhanced:0 "\n\nA full set of enhancements, well kept. A dealer would pay properly for it."
 eotg_aug_int.002.desc_overclocked:0 "\n\nOverclocked hardware, scorched along the heat sinks and still worth a great deal. Few can afford to buy it new."
 eotg_aug_int.002.desc_fractured:0 "\n\nOverclocked hardware, worn past its limits. The casings are scored and the cabling is fused in places. It still sells."
 eotg_aug_int.002.desc_died:0 "\n\n[recipient.GetName] did not survive the table. Everything came out anyway."
 eotg_aug_int.002.desc_maimed:0 "\n\nIt did not come out cleanly. [recipient.GetName] lost more on the table than the implants."
 eotg_aug_int.002.desc_fragments:0 "\n\nNot all of it came out. What is left in [recipient.GetName] will stay there."
 eotg_aug_int.002.a:0 "Sell it to a dealer."
 eotg_aug_int.002.b:0 "Have it fitted to me."
 eotg_aug_int.002.c:0 "Keep it for spare parts."
 eotg_aug_int.002.d:0 "Destroy it."
 eotg_aug_int.002.e:0 "Take it apart. Learn how it was made."
 eotg_aug_tamper.002.t:0 "The Work Is Done"
 eotg_aug_tamper.002.desc:0 "The agents report before the next watch. For hours [target.GetName]'s implants were in the agents' hands, panel open, while [target.GetSheHe] slept under a dose."
 eotg_aug_tamper.002.desc_tier1:0 "\n\nThere was little to reach: a few first-tier units. They loosened what they could."
 eotg_aug_tamper.002.desc_tier2:0 "\n\nThe enhancements were all within reach. They set the calibration a little wrong and left the seals looking whole."
 eotg_aug_tamper.002.desc_tier3:0 "\n\nThe overclocked units are guarded, but not for those hours. The agents set them to run hotter than they should."
 eotg_aug_tamper.002.desc_fractured:0 "\n\nThose implants were already failing, so what follows can never be laid cleanly at the agents' door."
 eotg_aug_tamper.002.desc_discovered:0 "\n\nThey were not careful enough. Someone saw them leave."
 eotg_aug_tamper.002.a:0 "Done. Let the fault find [target.GetHerHim]."
 eotg_aug_tamper.002.b:0 "Let [target.GetHerHim] know whose hands."
 eotg_aug_tamper.003.t:0 "Hands Withdrawn"
 eotg_aug_tamper.003.desc:0 "The agents never got the panel open. They were interrupted, or lost their nerve, and came back with nothing done."
 eotg_aug_tamper.003.desc_tier3:0 "\n\nOverclocked hardware is watched. Someone was always awake beside it."
 eotg_aug_tamper.003.desc_discovered:0 "\n\nWorse, the agents were seen. [target.GetName] will know who sent them."
 eotg_aug_tamper.003.a:0 "Let it go."
 eotg_aug_tamper.003.b:0 "Again."
 eotg_aug_tamper.004.t:0 "A Fault in the Hardware"
 eotg_aug_tamper.004.desc:0 "Something has gone wrong in your fittings. The overlay stutters at its edges, and a limb responds a beat late."
 eotg_aug_tamper.004.desc_aug:0 "\n\nIt is small: a sensor that drifts, a grip that slips. Small enough to ignore, for now."
 eotg_aug_tamper.004.desc_enh:0 "\n\nThe enhancements are out of step with each other. Reflexes fire in the wrong order."
 eotg_aug_tamper.004.desc_oc:0 "\n\nThe overclocked units run hotter than they should, and the cooling cannot keep up."
 eotg_aug_tamper.004.desc_nf:0 "\n\nThe system was unstable before this. It is worse now, and what was done to it cannot be told apart from the rest."
 eotg_aug_tamper.004.desc_unknown:0 "\n\nThe seals on one panel are new. Someone had their hands on it while you slept."
 eotg_aug_tamper.004.desc_known:0 "\n\n[owner.GetName]'s people opened the panel while you slept, and made sure you would know it."
 eotg_aug_tamper.004.desc_known_discovered:0 "\n\nWhoever opened the panel was found out. The access log at the hatch and a tool case left behind both trace to [owner.GetName]'s people. [owner.GetFirstName] did not mean you to know."
 eotg_aug_tamper.004.a:0 "The clinic."
 eotg_aug_tamper.004.b:0 "My own physician."
 eotg_aug_tamper.004.c:0 "Someone cheaper."
 eotg_aug_tamper.004.d:0 "Live with it."
 eotg_aug_tamper.004.e:0 "Find the hands."
 eotg_aug_tamper.004.tt:0 "The fault is opened up and reworked. How it goes is decided on the table."
 eotg_aug_tamper.004.e.success:0 "A bribed technician and a door left unlocked. The trail ends at [owner.GetName]."
 eotg_aug_tamper.004.e.failure:0 "Whoever it was left nothing to follow."
 eotg_aug_proc.002.desc_salvaged:0 "The component has been out for some weeks now. It was cut out for its resale value, not for your sake, and the incisions show it. Whoever closed the seam did it fast, and did not much care what lay beside the hardware."
 eotg_aug_proc.002.desc_repair_fault:0 "The faulty component was unsealed and reworked some weeks ago. The fitter runs a probe along the freshly closed housing and reads the result at the panel, and the tissue around the port is still stiff and tender to the touch."
 eotg_aug_proc.020.desc_salvaged:0 "\n\nIt was cut out of you for its value. The reflex reaches for it anyway."
 eotg_aug_offer_augmentation_interaction_extra_icon:0 "$hook_extra_icon$"
 eotg_aug_demand_removal_interaction_extra_icon:0 "$hook_extra_icon$"
 eotg_aug_policy_laws:0 "Augmentation"
 eotg_aug_policy_ban:0 "Augmentation Prohibited"
 eotg_aug_policy_ban_effects:0 "No hands in your realm may fit an implant.\n\nAugmentation is prohibited in your realm.\nNo sanctioned clinic operates in your realm.\nImplant work on anyone living under your law is a crime, and its discovery gives their liege reason to imprison them.\nRefusing your order to remove implants is a crime.\nAugmented vassals and courtiers resent it."
 eotg_aug_policy_license:0 "Augmentation Licensed"
 eotg_aug_policy_license_effects:0 "Implants are lawful in your realm if the right hands fit them.\n\nOnly implant work by sanctioned hands is lawful in your realm.\nSanctioned clinics are vetted under your law.\nBack-street implant work is a crime.\nRefusing your order to remove unlawful implants is a crime."
 eotg_aug_policy_tolerate:0 "Augmentation Tolerated"
 eotg_aug_policy_tolerate_effects:0 "What anyone has fitted is their own affair.\n\nYour law says nothing on augmentation."
 eotg_aug_policy_favor:0 "Augmentation Favoured"
 eotg_aug_policy_favor_effects:0 "Your court makes no secret of whose company it prefers.\n\nYou hold the augmented in open regard at your court.\nOffers of implant work come more readily.\nFewer look closely at back-street work."
 eotg_aug_policy_cooldown_tt:0 "The Augmentation law has not been changed recently"
 eotg_aug_policy_set_by_liege_tt:0 "Set by the ruler at the head of your realm, for all of it."
 eotg_aug_clinic_closed_tt:0 "Augmentation is not prohibited in the realm"
 eotg_opinion_aug_contraband:0 "Unlawful Implants"
 eotg_opinion_aug_defied_law:0 "Refused a Lawful Order"
 eotg_opinion_aug_outlawed:0 "Outlawed My Implants"
 eotg_opinion_aug_barred:0 "Barred Me from the Field"
 eotg_aug_demand_removal_crime_desc:0 "\n\nUnder the law of your realm, refusing this order is a crime."
 eotg_aug_demand_crime_toast:0 "[recipient.GetName] Refuses a Lawful Order"
 eotg_aug_demand_crime_toast_desc:0 "Refusing was a crime under your realm's law. You have reason to imprison [recipient.GetHerHim]."
 EOTG_AUG_AI_REFUSAL_IS_CRIME:0 "Refusing would break the realm's law"
 EOTG_AUG_AI_BANNED:0 "Prohibited in the realm"
 EOTG_AUG_AI_FAVORED:0 "Favoured in the realm"
 eotg_aug_implant_technician_court_position:0 "Implant Technician"
 eotg_aug_implant_technician_court_position_desc:0 "A specialist in fitting and servicing implants, kept at court."
 eotg_aug_implant_technician_employer_desc:0 "Operates on you and those in your care, more safely and more cheaply than a physician. Services your implants by hand, and keeps overclocked hardware running cooler."
 eotg_aug_technician_aptitude_augmented:0 "Wears hardware, and knows how it fails."
 eotg_aug_technician_aptitude_former:0 "Has had implants taken out, and knows how they come out."
 eotg_aug_technician_banned_tt:0 "Augmentation is not prohibited in your realm, or you set your realm's law"
 eotg_aug_opt_technician:0 "My implant technician."
 eotg_aug_borrow_technician_interaction:0 "Borrow Their Technician"
 eotg_aug_borrow_technician_interaction_desc:0 "Ask for the services of [recipient.GetHerHis] Implant Technician for a year, for a fee."
 eotg_aug_borrow_technician_interaction_notification:0 "[actor.GetName] asks for your Implant Technician's services for a year, for a fee."
 eotg_aug_borrow_accepted_toast:0 "[recipient.GetName] Lends [recipient.GetHerHis] Technician"
 eotg_aug_borrow_accepted_toast_desc:0 "[eotg_lent_technician.GetName] will see to your implants for a year."
 eotg_aug_borrow_declined_toast:0 "[recipient.GetName] Keeps [recipient.GetHerHis] Technician"
 eotg_aug_borrow_none_held_tt:0 "No lent technician is already seeing to your implants"
 EOTG_AUG_AI_ALLIED:0 "Allied"
 EOTG_AUG_AI_FAMILY:0 "Family"
 EOTG_AUG_AI_GENEROUS:0 "Generous"
 EOTG_AUG_AI_NEEDS_TECHNICIAN:0 "Needs the technician personally"
 eotg_aug_act.001.t:0 "The Rules of the Field"
 eotg_aug_act.001.desc:0 "The marshals find you before the first bout. Some of the entrants carry hardware: limbs on actuators, optics behind the eyes. The rules of the field were written for flesh, and never imagined it."
 eotg_aug_act.001.desc_many:0 "\n\nThere is more than one. [eotg_aug_entrant.GetName] is only the most obvious."
 eotg_aug_act.001.desc_entrant_oc:0 "\n\n[eotg_aug_entrant.GetName] is overclocked. The casings are scorched along the heat sinks, and the stands can see it."
 eotg_aug_act.001.desc_entrant_nf:0 "\n\n[eotg_aug_entrant.GetName]'s hardware is unstable. A hand twitches on the rail, and those beside [eotg_aug_entrant.GetHerHim] keep a step back."
 eotg_aug_act.001.desc_ban:0 "\n\nYour law prohibits augmentation. On your field, that is reason enough."
 eotg_aug_act.001.desc_ban_v:0 "\n\nThe law of your realm prohibits augmentation. On a field in that realm, that is reason enough."
 eotg_aug_act.001.a:0 "Let them compete."
 eotg_aug_act.001.b:0 "Bar them from the field."
 eotg_aug_act.001.c:0 "No powered output on the field."
 eotg_aug_act.001.d:0 "Make them the main event."
 eotg_aug_act.001.e:0 "My field is for flesh. Bar them all."
 eotg_aug_act.001.barred_toast:0 "Barred from the Field"
 eotg_aug_act.001.barred_toast_desc:0 "The host has barred augmented entrants. You will not compete."
 eotg_aug_act.002.t:0 "Past Spec"
 eotg_aug_act.002.desc:0 "The bout is close. Your implants could give more than the rules of the field expect."
 eotg_aug_act.002.desc_physical:0 "\n\nPush the actuators past their rating, and you will move before anyone else on the field can."
 eotg_aug_act.002.desc_board:0 "\n\nThe overlay has already played the next three moves. Only your hand is waiting."
 eotg_aug_act.002.desc_hot:0 "\n\nThe housings are already warm. They have been running close to the limit for some time."
 eotg_aug_act.002.desc_ban:0 "\n\nAugmentation is prohibited in the host's realm. Anything you do with it here will be noticed."
 eotg_aug_act.002.a:0 "Run it past spec."
 eotg_aug_act.002.b:0 "Within the rules."
 eotg_aug_act.002.c:0 "Throttle it down."
 eotg_aug_act.002.d:0 "Let them think it's skill."
 eotg_aug_act.002.e:0 "Declare my implants to the marshal."
 eotg_aug_act.002.a.seen:0 "Someone in the stands saw the heat shimmer off your casing. Word has reached the host."
 eotg_aug_act.003.t:0 "Foul Play?"
 eotg_aug_act.003.desc:0 "Between bouts, [eotg_aug_accuser.GetName] seeks you out. [eotg_aug_accuser.GetSheHe|U] says [eotg_aug_accused.GetName] wins with implants, not skill: a strike too fast for any arm, and a casing hot to the touch after every bout."
 eotg_aug_act.003.desc_hot:0 "\n\nEven from your seat, the heat coming off [eotg_aug_accused.GetName]'s casing is plain to see."
 eotg_aug_act.003.desc_ban:0 "\n\nYour law prohibits augmentation. Whatever the field's rules say, your realm's say more."
 eotg_aug_act.003.desc_ban_v:0 "\n\nThe law of your realm prohibits augmentation. Whatever the field's rules say, that law says more."
 eotg_aug_act.003.desc_license:0 "\n\nYour law allows implants fitted by sanctioned hands, and no others. Nobody has yet asked whose hands fitted these."
 eotg_aug_act.003.desc_license_v:0 "\n\nThe law of your realm allows implants fitted by sanctioned hands, and no others. Nobody has yet asked whose hands fitted these."
 eotg_aug_act.003.a:0 "Disqualify [eotg_aug_accused.GetHerHim]."
 eotg_aug_act.003.b:0 "I see no foul play."
 eotg_aug_act.003.c:0 "Have [eotg_aug_accused.GetHerHim] examined."
 eotg_aug_act.003.d:0 "Let them settle it on the field."
 eotg_aug_act.003.e:0 "Hear them both, then rule."
 eotg_aug_act.003.c.hot:0 "Up close, the casing is scorched and the heat sinks are still warm from the bout. It was run past spec. [eotg_aug_accused.GetName] is withdrawn from the field."
 eotg_aug_act.003.c.clean:0 "Up close, the casing is cool and within its rating. The accusation does not stand."
 eotg_aug_act.003.c.tt:0 "The casing is opened and inspected. The verdict follows."
 eotg_aug_act.004.t:0 "A Hum at the Table"
 eotg_aug_act.004.desc:0 "The servo in your wrist ticks as you lift the cup. Nobody hears it over the talk, until somebody does. Now the guests nearest you are watching your hand, not your face."
 eotg_aug_act.004.desc_host:0 "\n\nIt is your feast. Every eye in the hall finds its way back to the head of the table."
 eotg_aug_act.004.desc_oc:0 "\n\nThe overclocked units run warm, and their coil whine carries further than a servo's tick."
 eotg_aug_act.004.desc_nf:0 "\n\nThe hand does not quite stop when you set the cup down. The guests nearest you have stopped talking."
 eotg_aug_act.004.a:0 "Show them what it does."
 eotg_aug_act.004.b:0 "Keep it out of sight."
 eotg_aug_act.004.c:0 "Answer their questions plainly."
 eotg_aug_act.004.d:0 "Make it the talk of the feast."
 eotg_aug_act.004.e:0 "Excuse yourself early."
 eotg_aug_act.005.t:0 "Quarry in the Overlay"
 eotg_aug_act.005.desc:0 "The optics pick out a trail invisible to the rest of the party: a bent stem, a warm track, a heat trace fading in the cover."
 eotg_aug_act.005.desc_senses:0 "\n\nYour senses read the trail truer still. The quarry's path hangs in the overlay, a step ahead of it."
 eotg_aug_act.005.desc_hum:0 "\n\nThe quarry hears the coil whine before it sees you."
 eotg_aug_act.005.a:0 "Let the optics track it."
 eotg_aug_act.005.b:0 "Hunt the old way."
 eotg_aug_act.005.c:0 "Power down and wait."
 eotg_aug_act.005.d:0 "Run it down at full output."
 eotg_aug_act.005.e:0 "Tune it to the trail."
 eotg_aug_act.006.t:0 "At the Holy Site"
 eotg_aug_act.006.desc:0 "Those who tend the site look at your hardware before they look at you. Nobody bars the way. Nobody steps aside, either."
 eotg_aug_act.006.desc_hot:0 "\n\nAfter the long approach, your casings are warm to the touch, and the heat sinks tick as they cool."
 eotg_aug_act.006.a:0 "Kneel as I am."
 eotg_aug_act.006.b:0 "Cover it, and kneel."
 eotg_aug_act.006.c:0 "Stay the week, and rest."
 eotg_aug_act.006.d:0 "Keep the full vigil."
 eotg_aug_act.006.e:0 "Leave before the rites."
 eotg_aug_realm.001.t:0 "Contraband Hardware"
 eotg_aug_realm.001.desc:0 "Word has reached you: [eotg_contraband_subject.GetName] has had implant work done that your realm's law does not allow."
 eotg_aug_realm.001.desc_ban:0 "\n\nYour law prohibits augmentation, and [eotg_contraband_subject.GetSheHe] lives under it."
 eotg_aug_realm.001.desc_ban_v:0 "\n\nThe law of your realm prohibits augmentation, and [eotg_contraband_subject.GetSheHe] lives under it."
 eotg_aug_realm.001.desc_license:0 "\n\nYour law allows implant work by sanctioned hands only. These hands were not."
 eotg_aug_realm.001.desc_license_v:0 "\n\nThe law of your realm allows implant work by sanctioned hands only. These hands were not."
 eotg_aug_realm.001.desc_aug:0 "\n\nFirst-tier work: a handful of units on standard fittings."
 eotg_aug_realm.001.desc_enh:0 "\n\nA full set of enhancements, recently fitted."
 eotg_aug_realm.001.desc_oc:0 "\n\nOverclocked hardware. Whoever fitted it knew exactly what they were doing."
 eotg_aug_realm.001.desc_nf:0 "\n\n[eotg_contraband_subject.GetHerHis|U] implants were unstable before this. Whoever touched them last has made them no better."
 eotg_aug_realm.001.desc_courtier:0 "\n\n[eotg_contraband_subject.GetSheHe|U] lives under your roof."
 eotg_aug_realm.001.a:0 "Arrest [eotg_contraband_subject.GetHerHim]."
 eotg_aug_realm.001.b:0 "Have it taken out."
 eotg_aug_realm.001.c:0 "A fine will do."
 eotg_aug_realm.001.d:0 "Look the other way."
 eotg_aug_realm.001.e:0 "The realm's law holds, for everyone."
 eotg_aug_realm.001.f:0 "A fine. A large one."
 eotg_aug_patron.006.f:0 "Burn the terms. Send no answer."
 eotg_aug_patron_paper_sold_tt:0 "None of the syndicate's hardware is left in you to stop servicing. It will sell your paper to someone who collects in person."
 eotg_aug_patron.009.t:0 "The Collector"
 eotg_aug_patron.009.desc:0 "Your paper has a new holder. [ROOT.Char.Custom('eotg_aug_cl_syndicate')|U] sold it to [eotg_patron_collector.GetName], who is at your residence as a guest to say so. [eotg_patron_collector.GetSheHe|U] brings the original terms, and under them, in the syndicate's hand, an account of how you broke them. The paper came with a case of the syndicate's stock, made to your measure, and that has come too. [eotg_patron_collector.GetHerHis|U] people wait outside. No threat is spoken. [eotg_patron_collector.GetSheHe|U] names the sum, and then the alternatives."
 eotg_aug_patron.009.desc_envoy_dead:0 "\n\n[eotg_patron_collector.GetSheHe|U] asks after [eotg_patron_envoy.GetName] once, and does not ask again."
 eotg_aug_patron.009.a:0 "Pay what the paper says."
 eotg_aug_patron.009.b:0 "Sign the lien on my revenues."
 eotg_aug_patron.009.c:0 "Take the syndicate's stock, and call the debt settled."
 eotg_aug_patron.009.d:0 "There is no debt. We are done."
 eotg_aug_patron.009.d.tt:0 "[eotg_patron_collector.GetName] takes the answer without argument, and stays on as your guest. [eotg_patron_collector.GetHerHis|U] people are patient."
 eotg_aug_patron.009.e:0 "Seize the collector, and the paper."
 eotg_aug_patron.009.e.success:0 "[eotg_patron_collector.GetName] is taken before [eotg_patron_collector.GetHerHis] people can move. The paper burns."
 eotg_aug_patron.009.e.failure:0 "[eotg_patron_collector.GetHerHis|U] people are at the door before your guards are. Nobody draws, and nobody is taken. [eotg_patron_collector.GetName] stays on as your guest, and keeps the paper."
 eotg_innovation_self_repairing_machinery:0 "Self-Repairing Machinery"
 # eotg_lint: allow L014 engine reads innovation _desc by naming convention
 eotg_innovation_self_repairing_machinery_desc:0 "Mechanisms that measure their own wear and correct it: tolerances re-zeroed, a loose contact re-seated, a failed path routed around, and the worn part recorded for the next pair of hands. They cannot make a part. They only put off the day one is needed."
 eotg_innovation_self_repairing_machinery_custom:0 "Augmented characters of this culture can have self-repairing hardware fitted."
 eotg_decision_aug_self_repair:0 "Commission Self-Repairing Hardware"
 eotg_decision_aug_self_repair_desc:0 "Our scholars have built machinery that keeps itself in tolerance. Fitted into the implants you already carry, it would mean calibrating them less often. The work is deep, and the price is ruinous."
 eotg_decision_aug_self_repair_tooltip:0 "Have your implants refitted with self-repairing hardware. Choose who performs it."
 eotg_decision_aug_self_repair_confirm:0 "Arrange the refit."
 eotg_decision_aug_self_repair_selection_tt:0 "Have your implants refitted with hardware that keeps itself in tolerance."
 eotg_decision_aug_self_repair_no_provider_tt:0 "A clinic will do this work for you here, or someone at your court can"
 eotg_mod_aug_self_repair:0 "Self-Repairing Hardware"
 eotg_mod_aug_self_repair_desc:0 "The implants measure their own wear and correct it, and hold their calibration longer. They keep themselves in tolerance. You are another matter."
 eotg_aug_proc.005.t:0 "Within Tolerance"
 eotg_aug_proc.005.desc:0 "Our scholars' hardware is ready for fitting: units that measure their own wear and correct it between calibrations. It keeps the machinery true. It does nothing for the one wearing it. The refit goes deep into what you already carry, and the price is ruinous."
 eotg_aug_proc.005.desc_overclocked:0 "\n\nThe overclocked units wear fastest of all. These are the units the refit was made for."
 eotg_aug_proc.005.desc_surgeon:0 "\n\nSomeone at your court knows this hardware well enough to fit it, for less than the clinic asks."
 eotg_aug_proc.005.a:0 "The clinic."
 eotg_aug_proc.005.b:0 "My own physician."
 eotg_aug_proc.005.c:0 "Not yet."
 eotg_aug_proc.005.tt:0 "The refit begins. How it goes is decided on the table."
 eotg_aug_proc.002.desc_refit:0 "The refitted component has been in place for some weeks now. Read at the diagnostic panel, the record already shows the first internal fault the unit found in itself and corrected. The fitter shines a work light across the seal, checking the housing."
 eotg_aug_act.001.f:0 "Units above tolerance are barred. The rest may compete."
 eotg_aug_act.002.f:0 "Take the throttle off the reflexes."
 eotg_aug_act.002.g:0 "Run the schedule it has already drafted."
 eotg_aug_act.003.f:0 "Run the heat readings through the overlay."
 eotg_aug_act.003.g:0 "Casing temperatures noted. A ruling follows."
 eotg_aug_act.004.f:0 "Let it finish my sentences."
 eotg_aug_act.004.g:0 "It is only a first fitting. Let them feel it work."
 eotg_aug_nr.003.f:0 "I know these symptoms. Take my maintenance slot."
 eotg_aug_nr.003.g:0 "Maintenance scheduled. Fault logged."
 eotg_aug_tier2.014.d:0 "Read their faces through the overlay while they haggle."
 eotg_aug_tier2.016.d:0 "Recalibrate the response curves by hand, from my own logs."
 eotg_aug_tier2.021.c:0 "Lower the threshold. Let it flag more."
 eotg_aug_tier2.021.d:0 "Correct the model, and say so before the court."
 eotg_aug_tier3.006.e:0 "Hand them my diagnostic logs."
 eotg_aug_tier3.006.e.tt:0 "The delegation reads the logs. Its verdict follows."
 eotg_aug_tier3.006.e.clean:0 "[eotg_delegation_leader.GetName] reads the logs twice and finds nothing to fear. The delegation leaves reassured."
