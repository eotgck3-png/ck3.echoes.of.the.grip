l_english:
 # ── Traits ────────────────────────────────────────────────────────────────────
 trait_eotg_cybernetics:0 "Cybernetic Augmentation"
 trait_eotg_cybernetics_1:0 "Augmented"
 trait_eotg_cybernetics_1_desc:0 "This character has undergone voluntary cybernetic enhancement. Implants are sharp, new, and still legible to the world. Their firmware runs under a local license, and the servicing contract is renewed every season."
 trait_eotg_cybernetics_1_character_desc:0 "[ROOT.Char.GetFirstNameNoTooltip] has undergone voluntary cybernetic enhancement. Implants are sharp, new, and still legible to the world. [ROOT.Char.GetHerHis|U] firmware runs under a local license, and the servicing contract is renewed every season."
 trait_eotg_cybernetics_2:0 "Enhanced"
 trait_eotg_cybernetics_2_character_desc:0 "Heavy modification has remade [ROOT.Char.GetFirstNameNoTooltip] visibly. Dependency is forming. Emotion arrives slower than it should. The servicing contract is no longer optional."
 trait_eotg_cybernetics_3:0 "Overclocked"
 trait_eotg_cybernetics_3_character_desc:0 "The implants dominate. Sleep is a memory. The static never fully stops. The licences, the servicing and the debts are part of the anatomy now."
 trait_track_eotg_cybernetics:0 "Integration"
 trait_track_eotg_cybernetics_desc:0 "How deeply the implants are wired into the body and the nervous system. Deeper integration brings greater capability and a greater toll."
 trait_eotg_neurofractured:0 "Neurofractured"
 trait_eotg_neurofractured_desc:0 "Neural collapse. Identity fragmentation. The machine and the person have ceased to agree on what is real."

 # ── Modifiers ─────────────────────────────────────────────────────────────────
 eotg_mod_implant_calibrated:0 "Calibrated Systems"
 eotg_mod_implant_calibrated_desc:0 "Recent maintenance has stabilized the implants. The noise is manageable."
 eotg_mod_illegal_implants:0 "Black Market Implants"
 eotg_mod_illegal_implants_desc:0 "Unlicensed modifications of uncertain origin. They work. Mostly."
 eotg_mod_aug_affect_dampened:0 "Affect Dampened"
 eotg_mod_aug_affect_dampened_desc:0 "The implant has muted the feeling and left the reading of people intact. It will wear off."
 eotg_mod_aug_running_hot:0 "Running Hot"
 eotg_mod_aug_running_hot_desc:0 "The implant is driving the body past its limits. Sharp, fast, and burning through reserves. It will not last."
 eotg_mod_aug_lesson_prowess:0 "Lesson in the Body"
 eotg_mod_aug_lesson_prowess_desc:0 "The implant has logged every movement of the body and fed the pattern back. Reflexes hold the correction for now."
 eotg_mod_aug_lesson_learning:0 "Lesson in Memory"
 eotg_mod_aug_lesson_learning_desc:0 "The implant has indexed what was seen and cross-referenced it. Recall stays sharper until the index goes stale."
 eotg_mod_aug_lesson_intrigue:0 "Lesson in Faces"
 eotg_mod_aug_lesson_intrigue_desc:0 "The implant has matched expressions to outcomes and kept the pairs. Reading people comes easier for a while."
 eotg_mod_aug_lesson_martial:0 "Lesson in Formation"
 eotg_mod_aug_lesson_martial_desc:0 "The implant has modelled the engagement and kept the geometry. Command decisions come faster, for now."
 eotg_mod_withdrawn_from_court:0 "Withdrawn from Court"
 eotg_mod_withdrawn_from_court_desc:0 "The ruler has retreated from public life. Those who remain nearby walk carefully."
 eotg_mod_aug_martial_bonus:0 "Augmented Reflex Conditioning"
 eotg_mod_aug_martial_bonus_desc:0 "The implants have tuned reflexes and physical response around combat instinct."
 eotg_mod_aug_steward_bonus:0 "Augmented Administrative Interface"
 eotg_mod_aug_steward_bonus_desc:0 "Integrated data feeds sharpen economic and logistical processing."
 eotg_mod_aug_intrigue_bonus:0 "Augmented Social Sensors"
 eotg_mod_aug_intrigue_bonus_desc:0 "Micro-expression readers and biometric overlays feed the implant's pattern recognition."
 eotg_mod_aug_learning_bonus:0 "Augmented Memory Architecture"
 eotg_mod_aug_learning_bonus_desc:0 "Neural indexing has improved recall and cross-referencing of information."
 eotg_mod_aug_diplomacy_bonus:0 "Augmented Vocal Modulation"
 eotg_mod_aug_diplomacy_bonus_desc:0 "Tone calibration and subtle pheromone emitters improve social presence."
 eotg_mod_enh_martial_bonus:0 "Enhanced Combat Core"
 eotg_mod_enh_martial_bonus_desc:0 "Deeper integration has sharpened the combat subsystem considerably."
 eotg_mod_enh_steward_bonus:0 "Enhanced Economic Matrix"
 eotg_mod_enh_steward_bonus_desc:0 "The administrative layer now operates at near-autonomous efficiency."
 eotg_mod_enh_intrigue_bonus:0 "Enhanced Threat Assessment"
 eotg_mod_enh_intrigue_bonus_desc:0 "The implant profiles everyone in the room before they speak."
 eotg_mod_enh_learning_bonus:0 "Enhanced Cognitive Architecture"
 eotg_mod_enh_learning_bonus_desc:0 "The learning layer has expanded into long-term memory storage."
 eotg_mod_enh_diplomacy_bonus:0 "Enhanced Social Projection"
 eotg_mod_enh_diplomacy_bonus_desc:0 "The social interface now runs predictive response modelling."
 eotg_mod_oc_martial_bonus:0 "Overclocked Combat Kernel"
 eotg_mod_oc_martial_bonus_desc:0 "The system runs hot. The reflexes were never built for flesh, and neither was the cost."
 eotg_mod_oc_steward_bonus:0 "Overclocked Administrative Core"
 eotg_mod_oc_steward_bonus_desc:0 "Every resource flows through the implant now. The numbers are perfect. The mind is not."
 eotg_mod_oc_intrigue_bonus:0 "Overclocked Threat Matrix"
 eotg_mod_oc_intrigue_bonus_desc:0 "The implant catalogues betrayal before it forms. It is rarely wrong."
 eotg_mod_oc_learning_bonus:0 "Overclocked Cognitive Feed"
 eotg_mod_oc_learning_bonus_desc:0 "Information floods in. Processing runs without pause. Sleep is gone."
 eotg_mod_oc_diplomacy_bonus:0 "Overclocked Social Engine"
 eotg_mod_oc_diplomacy_bonus_desc:0 "The system composes every word for maximum effect. Authenticity is optional."
 eotg_mod_oc_regression_recovery:0 "Overclocked Withdrawal"
 eotg_mod_oc_regression_recovery_desc:0 "The body is recalibrating to lower integration. The process is as unpleasant as it sounds."
 eotg_mod_nf_martial_distortion:0 "Fractured Combat Instinct"
 eotg_mod_nf_martial_distortion_desc:0 "The machine fights perfectly. What remains of the person watches."
 eotg_mod_nf_steward_distortion:0 "Fractured Economic Obsession"
 eotg_mod_nf_steward_distortion_desc:0 "Resources are everything. People are resources."
 eotg_mod_nf_intrigue_distortion:0 "Fractured Threat Paranoia"
 eotg_mod_nf_intrigue_distortion_desc:0 "Everyone is a threat. The implant confirms it every twelve seconds."
 eotg_mod_nf_learning_distortion:0 "Fractured Memory Cascade"
 eotg_mod_nf_learning_distortion_desc:0 "Total recall of everything. Total inability to prioritize anything."
 eotg_mod_nf_diplomacy_distortion:0 "Fractured Social Mask"
 eotg_mod_nf_diplomacy_distortion_desc:0 "The words are still correct. Nothing behind them is."

 # ── Opinion Modifiers ─────────────────────────────────────────────────────────
 eotg_opinion_aug_admiration:0 "Admiration"
 eotg_opinion_aug_unease:0 "Uneasy"
 eotg_opinion_aug_fear:0 "Fears You"
 eotg_opinion_aug_disgust:0 "Disgusted"
 eotg_opinion_aug_reassured:0 "Reassured"

 # ── Decisions ─────────────────────────────────────────────────────────────────
 eotg_decision_partial_removal:0 "Partial Implant Removal"
 eotg_decision_partial_removal_desc:0 "The deeper modifications can be walked back. It will cost gold, and the withdrawal is unpleasant, but the machine does not have to own everything."
 eotg_decision_partial_removal_confirm:0 "Confirm the removal. The procedure will be costly and uncomfortable."
 eotg_decision_partial_removal_tooltip:0 "Integration falls back to Augmented. Choose who performs it."
 eotg_decision_overclock_regression:0 "Initiate Downgrade Protocol"
 eotg_decision_overclock_regression_desc:0 "The Overclocked state is consuming what remains. A partial rollback is possible: costly, painful, and imperfect. The Enhanced tier waits on the other side of considerable suffering."
 eotg_decision_overclock_regression_confirm:0 "Confirm the downgrade. The withdrawal will be severe."
 eotg_decision_overclock_regression_tooltip:0 "Integration falls to Enhanced. Some of the damage remains. Choose who performs it."
 eotg_decision_maintenance_protocol:0 "Schedule Maintenance Calibration"
 eotg_decision_maintenance_protocol_desc:0 "A licensed technician can service the implants, clearing the neural pathways and resetting calibration baselines. Expensive, but the static is quieter afterward."
 eotg_decision_maintenance_protocol_confirm:0 "Schedule the calibration. It will be worth the cost."
 eotg_decision_maintenance_protocol_tooltip:0 "The static quiets."

 # ── Initiation Events ─────────────────────────────────────────────────────────
 eotg_aug_init.001.t:0 "The Cost of Survival"
 # eotg_lint: allow L012 "encouraging" is the medic's ordinary adjective, not sponsorship
 eotg_aug_init.001.desc:0 "The field medic's assessment is not encouraging. The wound will not kill you, but it will cost you. A representative from [ROOT.Char.Custom('eotg_aug_cl_company')] is already here, and they have a more permanent solution."
 eotg_aug_init.001.a:0 "Do it."
 eotg_aug_init.001.b:0 "Accept conventional care and hope it eases."
 eotg_aug_init.001.c:0 "I will not be rebuilt by strangers. I refuse."
 eotg_aug_init.001.d:0 "Anything, so I never feel that again."
 eotg_aug_init.001.e:0 "Flesh was only ever a first draft."

 eotg_aug_init.002.t:0 "A Vendor's Pitch"
 eotg_aug_init.002.desc:0 "A representative from [ROOT.Char.Custom('eotg_aug_cl_company')] arrives at court with a carefully worded proposal. Enhancements. Performance. A competitive edge. The pitch calls it an investment."
 eotg_aug_init.002.a:0 "Pay for the procedure."
 eotg_aug_init.002.b:0 "Decline."
 eotg_aug_init.002.c:0 "Offer it to one of my [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] instead."
 eotg_aug_init.002.d:0 "Haggle them down. Cheap hardware will do."

 eotg_aug_init.003.t:0 "Aging Hands"
 eotg_aug_init.003.desc:0 "The years have done what war could not. The hands that once commanded armies are slower now. A technician in the capital offers a solution, for a price."
 eotg_aug_init.003.a:0 "Buy back the years."
 eotg_aug_init.003.b:0 "Age with dignity."
 eotg_aug_init.003.d:0 "I will not grow old in front of them."
 eotg_aug_init.003.e:0 "Let age have me."

 eotg_aug_init.004.t:0 "Desperation Protocol"
 eotg_aug_init.004.desc:0 "The sanctioned clinics are two systems behind the front. What is here is less reputable: a field technician who works for [ROOT.Char.Custom('eotg_aug_cl_gang')], with unlicensed hardware and no medical certification. The offer is direct: your wound for their work."
 eotg_aug_init.004.a:0 "Do it. Whatever it takes."
 eotg_aug_init.004.b:0 "I'd rather bleed."
 eotg_aug_init.004.d:0 "I will finish this war as I am."
 eotg_aug_init.004.e:0 "Do all of it. Now."

 eotg_aug_init.005.t:0 "Back From the Capital"
 eotg_aug_init.005.desc:0 "Someone you know has returned from the capital different. The eye moves wrong. The handshake is too firm. [eotg_aug_peer.GetSheHe|U] speaks of it as improvement. You are watching carefully."
 eotg_aug_init.005.a:0 "If it works for [eotg_aug_peer.GetHerHim], it should work for me."
 eotg_aug_init.005.b:0 "It unsettles me."
 eotg_aug_init.005.c:0 "Study it carefully before deciding."
 eotg_aug_init.005.d:0 "Ask [eotg_aug_peer.GetHerHim] what it cost."
 eotg_aug_init.005.e:0 "What did they put inside you?"

 # ── Tier 1 Events ─────────────────────────────────────────────────────────────
 eotg_aug_tier1.001.t:0 "Phantom Sensation"
 eotg_aug_tier1.001.desc:0 "In council, cold runs down a wrist that has no nerves left to feel it, then an itch in fingers that are not flesh. The grip closes on its own. The cup in your hand dents, and the room goes quiet mid-petition as councillors watch you pry your own fingers loose."
 eotg_aug_tier1.001.a:0 "Ignore it."
 eotg_aug_tier1.001.b:0 "Schedule a recalibration."
 eotg_aug_tier1.001.c:0 "Fascinating. Let me study this."
 eotg_aug_tier1.001.d:0 "I will correct the alignment myself."
 eotg_aug_tier1.001.e:0 "It'll pass."

 eotg_aug_tier1.002.t:0 "The Upgrade"
 eotg_aug_tier1.002.desc:0 "The newest model from [ROOT.Char.Custom('eotg_aug_cl_company')] has arrived in the capital. The technician is direct: what you have now is the beginning. What comes next is the point."
 eotg_aug_tier1.002.desc_sought:0 "You sent for [ROOT.Char.Custom('eotg_aug_cl_company')], and the technician came. What you have now is the beginning, they say, and you asked to hear the rest. The price is on the table before the specifications are."
 eotg_aug_tier1.002.a:0 "Pay for the upgrade, then decide what changes."
 eotg_aug_tier1.002.b:0 "Not yet."
 eotg_aug_tier1.002.c:0 "I will wait. Ask me again in a few years."

 eotg_aug_tier1.003.t:0 "An Uncomfortable Question"
 eotg_aug_tier1.003.desc:0 "A vassal requests a private audience. The conversation is careful, circuitous, and ultimately direct: [eotg_concerned_vassal.GetSheHe] wants to understand what [eotg_concerned_vassal.GetHerHis] liege has become, and whether the oaths [eotg_concerned_vassal.GetSheHe] swore still bind the same person."
 eotg_aug_tier1.003.a:0 "Reassure [eotg_concerned_vassal.GetHerHim]."
 eotg_aug_tier1.003.b:0 "It is not [eotg_concerned_vassal.GetHerHis] concern."
 eotg_aug_tier1.003.c:0 "Show [eotg_concerned_vassal.GetHerHim] what I can do."
 eotg_aug_tier1.003.d:0 "I do not know what I am becoming."
 eotg_aug_tier1.003.e:0 "There is nothing to tell; I am unchanged."

 eotg_aug_tier1.004.t:0 "The [ROOT.Char.Custom('KnightCultureNoTooltip')]'s Request"
 eotg_aug_tier1.004.desc:0 "[eotg_petitioning_knight.GetTitledFirstName] has watched what your implant does in boarding drills. [eotg_petitioning_knight.GetSheHe|U] wants the same. The request is framed as loyalty. The set of the jaw says something closer to hunger."
 eotg_aug_tier1.004.a:0 "Grant the request."
 eotg_aug_tier1.004.b:0 "Deny it."
 eotg_aug_tier1.004.c:0 "This ambition concerns me."
 eotg_aug_tier1.004.d:0 "My own coffers will pay for your implant."
 eotg_aug_tier1.004.e:0 "Who told you to ask me this?"

 eotg_aug_tier1.005.t:0 "Weight of Silence"
 eotg_aug_tier1.005.desc:0 "During a formal gathering the conversation pauses while the implant processes, and nothing surfaces. No word, no expression. The court has learned to wait these out. They watch you, though."
 eotg_aug_tier1.005.a:0 "Let them watch."
 eotg_aug_tier1.005.b:0 "Make light of it."
 eotg_aug_tier1.005.c:0 "Speak slowly, and make the implant keep pace."
 eotg_aug_tier1.005.d:0 "Leave the hall."
 eotg_aug_tier1.005.e:0 "Make it theatre."

 eotg_aug_tier1.006.t:0 "The Faster Hand"
 eotg_aug_tier1.006.desc:0 "In the skirmish, the implant registered the blade before the eye did, and the counter was already moving. The enemy commander is dead. The soldiers around you saw it end, and none of them agree on what they saw."
 eotg_aug_tier1.006.a:0 "The advantage is what matters."
 eotg_aug_tier1.006.b:0 "This is not natural. I will make my peace with it."
 eotg_aug_tier1.006.c:0 "Document every detail of the engagement."
 eotg_aug_tier1.006.d:0 "Again."
 eotg_aug_tier1.006.e:0 "That was my blade, not the machine's."

 # ── Tier 2 Events ─────────────────────────────────────────────────────────────
 eotg_aug_tier2.001.t:0 "Emotional Delay"
 eotg_aug_tier2.001.desc:0 "Someone in audience spoke news that should have landed hard: a loss, an insult, a birth. There was a noticeable pause before any grief or warmth reached your face. The implant had already logged it, filed it, and forecast your answer. The feeling came after, late, like a message routed the long way."
 eotg_aug_tier2.001.desc_speaker:0 "[eotg_delay_speaker.GetFirstName] said something that should have mattered at once. There was a cold pause before any reaction reached your face. The implant had already logged what was said, filed it, and forecast your answer. The feeling came after, late, like a message routed the long way, and [eotg_delay_speaker.GetFirstName] was already watching you as though you were an unpowered screen."
 eotg_aug_tier2.001.a:0 "Emotion clouds judgment. This is an improvement."
 eotg_aug_tier2.001.b:0 "I do not like this."
 eotg_aug_tier2.001.c:0 "Increase neural responsiveness. Override the delay."
 eotg_aug_tier2.001.d:0 "Sit with my family until the feeling arrives."
 eotg_aug_tier2.001.e:0 "Good."

 eotg_aug_tier2.002.t:0 "Children Fear Me"
 eotg_aug_tier2.002.desc:0 "The youngest ones flinch now. Not from cruelty. From the eye that does not blink quite right, the hand that moves without weight. They do not understand what they are seeing. They do not need to."
 eotg_aug_tier2.002.a:0 "They will understand strength when they are old enough."
 eotg_aug_tier2.002.b:0 "What have I become?"
 eotg_aug_tier2.002.c:0 "Show them how it works."
 eotg_aug_tier2.002.d:0 "Hold them anyway."
 eotg_aug_tier2.002.e:0 "Fear is the first lesson."

 eotg_aug_tier2.003.t:0 "The Next Stage"
 eotg_aug_tier2.003.desc:0 "The offer comes with a warning, which is unusual in the trade. The next tier of modification does not come out cleanly. The technician uses the word 'commitment' several times."
 eotg_aug_tier2.003.desc_sought:0 "You asked for the next tier, and the technicians came with a warning anyway, which is unusual for their trade. The next stage does not come out cleanly. The word 'commitment' comes up several times."
 eotg_aug_tier2.003.a:0 "I have already decided."
 eotg_aug_tier2.003.b:0 "The risks are unacceptable."
 eotg_aug_tier2.003.c:0 "Test it on a prisoner first."
 eotg_aug_tier2.003.d:0 "Whatever it costs."
 eotg_aug_tier2.003.e:0 "This is enough. I am enough."

 eotg_aug_tier2.004.t:0 "The Space Between Us"
 # eotg_lint: allow L012 a spouse conversation, not voice text; "answers" is the ruler's own replies, a noun
 eotg_aug_tier2.004.desc:0 "For weeks your spouse has said very little. This time [eotg_aug_spouse.GetSheHe] says a great deal, and the questions are specific: when did you stop reaching for [eotg_aug_spouse.GetHerHim] first? When did the warmth go out of your hands? You have answers. They are very precise. That is, apparently, the problem."
 eotg_aug_tier2.004.a:0 "It is the implant. I am still here. Give me time."
 eotg_aug_tier2.004.b:0 "I am the same person I have always been. Believe me."
 eotg_aug_tier2.004.c:0 "Then perhaps we are no longer suited. Think about that."
 eotg_aug_tier2.004.d:0 "Perform the old warmth, and hope it holds."

 eotg_aug_tier2.005.t:0 "A Devout Warning"
 eotg_aug_tier2.005.desc:0 "One of the devout at court asks for an audience. [eotg_confessor.GetSheHe|U] chooses each word with care, but the subtext is clear: what you have done to your own flesh is known beyond the court, and the faith has a word for it. Desecration. Flesh handed to strangers to rewrite."
 eotg_aug_tier2.005.a:0 "Thank [eotg_confessor.GetHerHim] for [eotg_confessor.GetHerHis] concern. [eotg_confessor.GetSheHe|U] may go."
 eotg_aug_tier2.005.b:0 "Hear [eotg_confessor.GetHerHim] out. Promise to go no further."
 eotg_aug_tier2.005.c:0 "The concern is noted. And unwelcome."
 eotg_aug_tier2.005.d:0 "The faith has no say over my body."
 eotg_aug_tier2.005.e:0 "Then let us argue it properly."
 eotg_aug_tier2.005.e.success:0 "Your argument holds. [eotg_confessor.GetFirstName] concedes the point and withdraws with respect."
 eotg_aug_tier2.005.e.failure:0 "Your argument fails to land. [eotg_confessor.GetFirstName] leaves unconvinced, and unimpressed."

 eotg_aug_tier2.006.t:0 "Cold Detachment"
 eotg_aug_tier2.006.desc:0 "A long-serving advisor is dead, loyal for decades: the kind of loss that should register as one. You had a replacement catalogued before the funeral was arranged. The grief arrived approximately six minutes later, flagged by the implant as a processing anomaly."
 eotg_aug_tier2.006.a:0 "The system is working. Efficiency is appropriate."
 eotg_aug_tier2.006.b:0 "This is wrong. I do not want this."
 eotg_aug_tier2.006.c:0 "Record the anomaly and move on."
 eotg_aug_tier2.006.d:0 "Fascinating. Let it run."
 eotg_aug_tier2.006.e:0 "I will drag it up by the roots if I have to."

 # ── Tier 3 Events ─────────────────────────────────────────────────────────────
 eotg_aug_tier3.001.t:0 "Violent Impulse"
 eotg_aug_tier3.001.desc:0 "Movement at the edge of the room. The implant registered a threat, and you were already moving before the thought arrived. This is becoming a problem."
 eotg_aug_tier3.001.a:0 "Control yourself. This cannot happen."
 eotg_aug_tier3.001.b:0 "Strike first. The implant was right."
 eotg_aug_tier3.001.c:0 "Kill [eotg_victim.GetHerHim]. The threat is neutralized."
 eotg_aug_tier3.001.d:0 "Breathe. Count. Walk out."
 eotg_aug_tier3.001.e:0 "Take it out on the practice posts."
 eotg_aug_tier3.001.desc_victim:0 "\n\nIt was [eotg_victim.GetName], who only meant to cross the room. [eotg_victim.GetSheHe|U] is still standing there, very still."
 eotg_aug_tier3.001.desc_none:0 "\n\nIt was a shadow on the wall. The nearest person was well out of reach. This time."

 eotg_aug_tier3.002.t:0 "The Mirror"
 eotg_aug_tier3.002.desc:0 "The reflection in the polished glass shows housing seams, recessed ports, and synthetic skin stretched over alloy plating. An attendant setting down a data slate catches the reflection over your shoulder, pales, and leaves without a word. You are still technically a person, but fewer people treat you like one."
 eotg_aug_tier3.002.a:0 "Flesh was always the weak part."
 eotg_aug_tier3.002.b:0 "I miss who I was."
 eotg_aug_tier3.002.c:0 "Remove more flesh. The machine is better."
 eotg_aug_tier3.002.d:0 "It looks like it works."
 eotg_aug_tier3.002.e:0 "Cover the mirrors."

 eotg_aug_tier3.003.t:0 "Sleepless"
 eotg_aug_tier3.003.desc:0 "Three days without sleep. The implant reports that the body does not need it. The readout may be right; that is the problem. The watch officer arriving for the shift change startles at your motionless posture and your open, unblinking eyes."
 eotg_aug_tier3.003.a:0 "Get me a sedative. Make it strong enough."
 eotg_aug_tier3.003.b:0 "I no longer require rest."
 eotg_aug_tier3.003.c:0 "Disconnect the neural feed. Give me back my nights."
 eotg_aug_tier3.003.d:0 "Then put the hours to use."
 eotg_aug_tier3.003.e:0 "Lie there anyway."

 eotg_aug_tier3.004.t:0 "Signal Noise"
 eotg_aug_tier3.004.desc:0 "Seventeen potential threats in the last hour, each one flagged by the implant. None materialized. The courtier who shifted in a chair is still alive. The advisor who looked too long has not, in fact, betrayed you. The system is still running probability calculations."
 eotg_aug_tier3.004.a:0 "Trust the analysis. Act accordingly."
 eotg_aug_tier3.004.b:0 "Override the threat protocols."
 eotg_aug_tier3.004.c:0 "Act on the highest-probability target."
 eotg_aug_tier3.004.d:0 "These are my people. Shut the alerts off."
 eotg_aug_tier3.004.e:0 "Seventeen? It missed some."
 eotg_aug_tier3.004.desc_suspect:0 "\n\nHighest probability: [eotg_suspect.GetName]. The implant has been waiting for [eotg_suspect.GetHerHim] to move."
 eotg_aug_tier3.004.desc_none:0 "\n\nEvery face in the room falls short of the profile. The count still stands at seventeen."

 eotg_aug_tier3.005.t:0 "Clarity"
 eotg_aug_tier3.005.desc:0 "In the middle of the engagement, the static clears. The implant runs the entire battle in 0.3 seconds: troop positions, flanking vectors, weather variables, morale estimates. It is already over. The plan is already written. Your hands are moving."
 eotg_aug_tier3.005.a:0 "Execute the plan."
 eotg_aug_tier3.005.b:0 "The clarity is terrifying."
 eotg_aug_tier3.005.c:0 "Record everything for the archive."
 eotg_aug_tier3.005.d:0 "Lead the charge myself."
 eotg_aug_tier3.005.e:0 "Let the machine command from the rear."

 eotg_aug_tier3.006.t:0 "The Delegation"
 eotg_aug_tier3.006.desc:0 "Three of your most senior vassals have arrived together. Their spokesperson, [eotg_delegation_leader.GetName], is careful with [eotg_delegation_leader.GetHerHis] words. The delegation speaks of governance concerns. Of cognitive reliability. They are asking, with extreme politeness, whether you are still fit to rule."
 eotg_aug_tier3.006.a:0 "Have [eotg_delegation_leader.GetName] arrested."
 eotg_aug_tier3.006.b:0 "Hear them out. Set conditions, and win them back."
 eotg_aug_tier3.006.c:0 "Demonstrate what I am still capable of."
 eotg_aug_tier3.006.d:0 "Convene an inquiry into my own fitness."

 eotg_aug_tier3.007.t:0 "Two Machines"
 eotg_aug_tier3.007.desc:0 "There is another of the Overclocked in your orbit. You meet [eotg_other_machine.GetHerHis] gaze across the hall and the implants exchange something: not words, but a recognition. You are, between you, the most dangerous things in the room."
 eotg_aug_tier3.007.a:0 "Acknowledge the kinship."
 eotg_aug_tier3.007.b:0 "The other is a threat."
 eotg_aug_tier3.007.c:0 "Compare calibrations."
 eotg_aug_tier3.007.d:0 "Win [eotg_other_machine.GetHerHim] over."

 # ── Fracture Events ───────────────────────────────────────────────────────────
 eotg_fracture.0001.t:0 "Neural Cascade"
 eotg_fracture.0001.desc:0 "It does not happen all at once. Later, there will be a before and an after, and no precise moment between them. There is only the realization that the static has stopped being background noise. It is the foreground now. It is everything."
 eotg_fracture.0001.a:0 "..."
 eotg_fracture.0001.desc_victim:0 "\n\n[eotg_victim.GetName] was close enough to be hurt in the first spasm."
 eotg_fracture.0001.desc_none:0 "\n\nNo one was close enough to be hurt."

 eotg_fracture.002.t:0 "Containment Failure"
 eotg_fracture.002.desc:0 "Something was read as a threat. The implant was probably wrong. It does not particularly care."
 eotg_fracture.002.a:0 "They were going to betray me. The machine knew."
 eotg_fracture.002.b:0 "Someone. Anyone. Help me contain this."
 eotg_fracture.002.c:0 "Execute the survivors. Leave no witnesses to the failure."
 eotg_fracture.002.d:0 "Again. [eotg_victim_extra.GetName] next."
 eotg_fracture.002.e:0 "Tend them with my own hands."
 eotg_fracture.002.desc_wounded:0 "\n\n[eotg_victim.GetName] took the worst of it and is being carried out."
 eotg_fracture.002.desc_none:0 "\n\nEveryone walked away unhurt. The room knows how close it came."
 eotg_fracture.002.desc_killed:0 "\n\n[eotg_victim_dead.GetName] is dead. The others are already deciding what they saw."

 eotg_fracture.003.t:0 "Lucid Moment"
 eotg_fracture.003.desc:0 "For an hour, maybe less, the static drops below the threshold. There is enough left to understand what has been lost. The window will close. The question is what to do while it is open."
 eotg_fracture.003.a:0 "End this while I still can."
 eotg_fracture.003.b:0 "Isolate myself. Keep the court safe from me."
 eotg_fracture.003.c:0 "Weakness disgusts me. Spend the hour on work, not grief."
 eotg_fracture.003.d:0 "Pray while I still know the words."

 eotg_fracture.004.t:0 "The Court Massacre"
 eotg_fracture.004.desc:0 "There will be an official account. It will speak of a loss of control in the audience chamber. It will not resemble what the witnesses saw: you crossing the room faster than the guards could follow, coolant hissing from your hot casings, screens shattered and sparking along the wall, and the guards backing away from you."
 eotg_fracture.004.a:0 "They were threats. The implant confirmed it."
 eotg_fracture.004.b:0 "I do not remember."
 eotg_fracture.004.c:0 "Bury them with honours."
 eotg_fracture.004.d:0 "Confess to the court and accept the cost."
 eotg_fracture.004.e:0 "Fill the empty places by the next watch."
 eotg_fracture.004.desc_killed:0 "\n\n[eotg_victim_dead.GetName] lies dead on the floor, and the household is already asking whose hand it was."
 eotg_fracture.004.desc_wounded:0 "\n\n[eotg_victim.GetName] survived, and remembers whose hand it was."
 eotg_fracture.004.desc_none:0 "\n\nNo one died. The account will grow regardless, and the witnesses will carry what they saw."

 eotg_fracture.005.t:0 "What the Heir Saw"
 eotg_fracture.005.desc:0 "Your heir was in the room. The exact details of what happened vary by account. What is agreed: the heir watched. [eotg_watching_heir.GetSheHe|U] does not speak of it."
 eotg_fracture.005.a:0 "[eotg_watching_heir.GetSheHe|U] will understand eventually."
 eotg_fracture.005.b:0 "Call [eotg_watching_heir.GetHerHim] in. Explain as much as I can."
 eotg_fracture.005.c:0 "It was necessary. Prepare [eotg_watching_heir.GetHerHim]."
 eotg_fracture.005.d:0 "Tell [eotg_watching_heir.GetHerHim] everything."
 eotg_fracture.005.e:0 "It was a seizure. Nothing more."

 # eotg_lint: allow L012 realm-local warrant, LAW AT 866
 eotg_fracture.006.t:0 "The Warrant"
 # eotg_lint: allow L012 realm-local warrant, LAW AT 866
 eotg_fracture.006.desc:0 "A warrant of restraint has been drafted against you. It is correctly formatted, properly witnessed and addressed to your office. It lists, among other findings, 'degraded cognition' and 'unreliable command.' Someone has learned the right words, and has been collecting the logs."
 eotg_fracture.006.a:0 "Crush any who stand against me."
 eotg_fracture.006.b:0 "Offer concessions. Win them back while there is still time."
 eotg_fracture.006.c:0 "Let the implant decide."

 eotg_fracture.007.t:0 "Dead Reckoning"
 eotg_fracture.007.desc:0 "A rare, clear hour. Not enough to undo anything. Enough to look at a map. The implant has been running logistics in the background: supply lines, weak points, the three most probable paths to stability. They are good plans. Good plans have a way of surviving the people who made them."
 eotg_fracture.007.a:0 "Write them down."
 eotg_fracture.007.b:0 "Give them to my heir."
 eotg_fracture.007.c:0 "Burn them. Let the plans, and the static, go with them."
 eotg_fracture.007.d:0 "Sell them."
 eotg_fracture.007.e:0 "Give them to the vassals who need them."

 # -- Phase 2: entry hooks, decisions, modifiers ---------------------------------
 eotg_aug_init.006.t:0 "The Prosthetic"
 eotg_aug_init.006.desc:0 "The old injury is still the first thing anyone notices about you. The clinics here do not patch. They replace. A technician from [ROOT.Char.Custom('eotg_aug_cl_company')] has laid the specifications on the table."
 eotg_aug_init.006.desc_blind:0 "\n\nYour sight first. They have optical units that would let you read a face across the hall."
 eotg_aug_init.006.desc_one_legged:0 "\n\nThe leg first. The actuator drawing is already in your hand."
 eotg_aug_init.006.desc_maimed:0 "\n\nThe hand, the arm, whatever the war took. A frame and a sensor lattice could give it back."
 eotg_aug_init.006.desc_one_eyed:0 "\n\nThe eye. An optical unit would close the gap, and see farther than the one it replaces."
 eotg_aug_init.006.a:0 "Replace what I lost."
 eotg_aug_init.006.b:0 "I will learn to live with it."
 eotg_aug_init.006.c:0 "My physician holds the knife."
 eotg_aug_init.006.d:0 "As I was made, and as I was unmade."
 eotg_aug_init.006.e:0 "Make it better than the original."
 eotg_aug_init.007.t:0 "The Neural Bridge"
 eotg_aug_init.007.desc:0 "The signal leaves the mind and does not arrive. A surgeon proposes a bridge: implants threaded through the nervous system to carry what the flesh cannot. It is a last resort, and it will not be gentle."
 eotg_aug_init.007.a:0 "Build the bridge."
 eotg_aug_init.007.b:0 "Let me be as I am."
 eotg_aug_init.007.c:0 "Only under my physician's eye."
 eotg_aug_init.007.d:0 "Not into my head. Never into my head."
 eotg_aug_init.007.e:0 "Run it at full current."
 eotg_aug_init.008.t:0 "The Bridge Settles"
 eotg_aug_init.008.desc:0 "The surgeons have gone. The bridge has had its first weeks."
 eotg_aug_init.008.desc_success:0 "\n\nThe signal arrives. Hands close when told to, and words come when called. For the first time in years, nothing in you refuses an order."
 eotg_aug_init.008.desc_partial:0 "\n\nThe hands respond. The words do not. The bridge carries half of what it should, and the rest is noise."
 eotg_aug_init.008.desc_complication:0 "\n\nThe bridge is carrying more than it should: heat, spasm, static along the spine. The wound has reopened where the cable was threaded in."
 eotg_aug_init.008.a:0 "Then this is who I am now."
 eotg_aug_init.008.b:0 "Again. Recalibrate it."
 eotg_aug_init.008.c:0 "I will make it work by will alone."
 eotg_aug_init.009.t:0 "The Cynic's Argument"
 eotg_aug_init.009.desc:0 "You have weighed the case for flesh from every side and found it thin. It decays, errs and forgets. A better instrument is an obvious improvement, and you mean to argue it to anyone who will listen."
 eotg_aug_init.009.desc_zealot:0 "\n\nSome in your court will not listen. They hold that a person is made whole, and that you are unmaking one."
 eotg_aug_init.009.a:0 "Flesh is not sacred. I will prove it."
 eotg_aug_init.009.b:0 "Argue it, but leave my body out of it."
 eotg_aug_init.009.c:0 "Publish the argument."
 eotg_aug_init.009.d:0 "Every advantage, every time."
 eotg_aug_init.009.e:0 "Write the treatise first."
 eotg_aug_init.010.t:0 "Back-Alley Surgery"
 eotg_aug_init.010.desc:0 "[ROOT.Char.Custom('eotg_aug_cl_gang')|U] run a clinic with no name and no certificate on the wall. They work cheap, they work fast, and they ask nothing. Where their parts come from is anyone's guess. The price is a fraction of what the sanctioned clinics charge."
 eotg_aug_init.010.a:0 "Cheap is cheap."
 eotg_aug_init.010.b:0 "Not from those hands."
 eotg_aug_init.010.c:0 "Do it, and keep my name out of it."
 eotg_aug_init.010.d:0 "Put me under first. All the way under."
 eotg_aug_init.011.t:0 "The Scar Itches"
 eotg_aug_init.011.desc_clean:0 "Weeks on, the incision has closed. The implant sits where it was put. Nothing hurts that should not."
 eotg_aug_init.011.desc_infection:0 "The incision is hot and swollen, and the skin around the implant has gone an ugly colour. A fever is building."
 eotg_aug_init.011.desc_rejection:0 "You are fighting it from the inside. The tissue around the housing has turned hard and dark, and the implant has begun to shift."
 eotg_aug_init.011.desc_discovered:0 "It is known now. Someone saw the incision, or saw you go to [ROOT.Char.Custom('eotg_aug_cl_gang')], or paid to know. The implant is no secret anymore."
 eotg_aug_init.011.desc_excellent:0 "The install took better than anyone had a right to expect. The incision is a fine line, and the implant already feels like part of you."
 eotg_aug_init.011.a:0 "It took. Back to my duties."
 eotg_aug_init.011.a_grim:0 "Keep going."
 eotg_aug_init.011.b:0 "Fetch a physician."
 eotg_aug_init.011.c:0 "Sweat it out."
 eotg_aug_init.011.d:0 "Cut it out before it spreads."
 eotg_aug_init.011.e:0 "It will settle."
 eotg_aug_init.011.f:0 "Bandage it and forget it."
 eotg_aug_init.012.t:0 "The Body Decides"
 eotg_aug_init.012.desc_lost:0 "The implant is gone. The incision is open and raw, packed in clean gauze. 'Your body threw it,' the surgeon says. 'Left in, it would have had you by the next shift. We had to cut it clear.'"
 eotg_aug_init.012.desc_saved:0 "The fever breaks. The flesh around the housing settles, scarred and tight against the metal, and the connection holds. 'The leads took,' the surgeon says. 'You will move. You will not move the same.'"
 eotg_aug_init.012.a:0 "So be it."
 eotg_aug_init.012.b:0 "Find me another surgeon."
 eotg_aug_init.013.t:0 "A Parent's Hardware"
 eotg_aug_init.013.desc:0 "[eotg_dead_parent.GetName] is dead, and left [eotg_dead_parent.GetHerHis] hardware behind: implants, cabling, a case of diagnostics. [eotg_dead_parent.GetHerHis|U] physician is asking what you want done with it. Part of you wants to know what it would feel like."
 eotg_aug_init.013.desc_fractured:0 "\n\nThey say it was the implant that broke [eotg_dead_parent.GetHerHim]. Nobody says it loudly."
 eotg_aug_init.013.a:0 "Install them."
 eotg_aug_init.013.b:0 "Sell them."
 eotg_aug_init.013.c:0 "Destroy them."
 eotg_aug_init.013.d:0 "Sell them to the highest bidder, and let it be known."
 eotg_aug_init.013.e:0 "Keep them. Take them apart. Learn."
 eotg_aug_init.014.t:0 "The Sickly Child"
 eotg_aug_init.014.desc:0 "Your child is not getting better. The physicians have run out of things to try, and one of them has stayed behind to say what the others will not say aloud: there is another way. A procedure, new, costly, and never done on the very young. You are being asked what you are willing to risk."
 eotg_aug_init.014.a:0 "Save [eotg_sick_child.GetHerHim], whatever it takes."
 eotg_aug_init.014.b:0 "Pray, and wait. The outcome is not mine to decide."
 eotg_aug_init.014.c:0 "The back-street version. It's cheaper."
 eotg_aug_init.014.d:0 "Sit with [eotg_sick_child.GetHerHim] through every hour of it."
 eotg_aug_init.014.e:0 "No machine touches my child."
 eotg_aug_init.015.t:0 "The Child Who Hums"
 eotg_aug_init.015.desc:0 "The fever broke. The child eats, sleeps, laughs. And when the house sleeps, there is a thin electrical whine from the next room: coil noise, steady as a kettle. The physicians say the implant is settling. They say a great many things. You sit by the door with your hand on the frame."
 eotg_aug_init.015.a:0 "[eotg_sick_child.GetSheHe|U] is alive. That is all."
 eotg_aug_init.015.b:0 "Teach [eotg_sick_child.GetHerHim] to hide it."
 eotg_aug_init.015.c:0 "Let [eotg_sick_child.GetHerHim] be what [eotg_sick_child.GetSheHe] is."
 eotg_aug_init.015.d:0 "Have [eotg_sick_child.GetHerHim] checked. Every month."
 eotg_aug_init.016.t:0 "Too Slow"
 eotg_aug_init.016.desc:0 "[eotg_rival.GetName] beat you in front of witnesses, and was not gracious about it. The story has already travelled. The difference was speed, and everyone knows it."
 eotg_aug_init.016.desc_no_rival:0 "The war has shown everyone what you cannot do. People who once met your eye now look at the floor. The difference was speed, and everyone knows it."
 eotg_aug_init.016.a:0 "Then make me faster."
 eotg_aug_init.016.b:0 "Train harder."
 eotg_aug_init.016.c:0 "Let them talk."
 eotg_aug_init.016.d:0 "Again. As I am."
 eotg_aug_init.016.d.success:0 "Your blade is true and your nerve holds. [eotg_rival.GetFirstNameNoTooltip] yields, and the story turns."
 eotg_aug_init.016.d.failure:0 "You are not fast enough. [eotg_rival.GetFirstNameNoTooltip]'s blade lands, and so does the silence of the room."
 eotg_aug_init.016.e:0 "They will regret it."
 eotg_aug_init.017.t:0 "The Physician's Proposal"
 eotg_aug_init.017.desc:0 "Your physician, [eotg_physician.GetName], has been reading your charts again, and comes with a proposal, offered carefully: certain implants, fitted properly, would make you stronger and stretch your working years. The tone is clinical. The hope is not."
 eotg_aug_init.017.desc_self:0 "You are your own physician, and you have been reading your own charts. Certain implants suit the case. You know the risks as well as anyone alive."
 eotg_aug_init.017.a:0 "Do it, then."
 eotg_aug_init.017.b:0 "Put the proposal away for now."
 eotg_aug_init.017.c:0 "On a volunteer first."
 eotg_aug_init.017.d:0 "I trust your hands."
 eotg_aug_init.017.e:0 "And who paid you to suggest it?"
 eotg_aug_init.018.t:0 "The Offer You Sought"
 eotg_aug_init.018.desc:0 "You sent word, and replies came back, as many as you asked for. [ROOT.Char.Custom('eotg_aug_cl_company')|U], with records and a waiting list. [ROOT.Char.Custom('eotg_aug_cl_gang')|U], with neither. And a closed door, if you change your mind."
 eotg_aug_init.018.a:0 "[ROOT.Char.Custom('eotg_aug_cl_company')|U], a sanctioned clinic."
 eotg_aug_init.018.b:0 "[ROOT.Char.Custom('eotg_aug_cl_gang')|U], in the back streets."
 eotg_aug_init.018.c:0 "My own physician."
 eotg_aug_init.018.d:0 "Not yet."
 eotg_aug_init.020.t:0 "Choosing the Volunteer"
 eotg_aug_init.020.desc:0 "Someone must go first. A volunteer takes the surgical risk, and gives the fitter calibration data, in exchange for standing in your court. You go over the list of candidates, weighing who is fit for the table."
 eotg_aug_init.020.desc_line_best:0 "\n\n[eotg_cand_best.GetName] is the strongest of the lot, and the likeliest to survive heavy fitment."
 eotg_aug_init.020.desc_line_any:0 "\n\n[eotg_cand_any.GetName] is eager for advancement, and would not ask about complications."
 eotg_aug_init.020.desc_line_courtier:0 "\n\n[eotg_cand_courtier.GetName] has no combat role to lose, and would never be missed in a boarding action."
 eotg_aug_init.020.a:0 "[eotg_cand_best.GetName], the strongest of them."
 eotg_aug_init.020.b:0 "Send [eotg_cand_any.GetName] into the clinic first."
 eotg_aug_init.020.c:0 "[eotg_cand_courtier.GetName], who will never be missed in a fight."
 eotg_aug_init.020.d:0 "Whoever survives it best."
 eotg_aug_init.020.e:0 "None of them."
 eotg_decision_seek_augmentation:0 "Seek Augmentation"
 eotg_decision_seek_augmentation_desc:0 "You have decided to look into it. Send word to the clinics, sanctioned and otherwise, and hear what each will offer."
 eotg_decision_seek_augmentation_confirm:0 "Send word."
 eotg_decision_seek_augmentation_tooltip:0 "Opens the offer: a sanctioned clinic or a back-street surgeon."
 eotg_decision_remove_implants:0 "Remove the Implants"
 eotg_decision_remove_implants_desc:0 "A careful removal, while the body can still bear it. The recovery is long and the body will not be quite the same, but the machine will no longer be part of you."
 eotg_decision_remove_implants_confirm:0 "Confirm the removal. The recovery will be painful."
 eotg_decision_consult_physician:0 "Consult the Physician"
 eotg_decision_consult_physician_desc:0 "A proper servicing: diagnostics, cleaning, recalibration. It is not cheap, but the physician knows the hardware, and the static will ease."
 eotg_decision_consult_physician_confirm:0 "Schedule the consultation."
 eotg_decision_consult_physician_tooltip:0 "The static quiets."
 eotg_decision_augment_retainer:0 "Augment a Courtier"
 eotg_decision_augment_retainer_desc:0 "A trusted follower can be fitted with implants at your expense. The surgery is theirs to survive, and the debt is yours to carry."
 eotg_decision_augment_retainer_confirm:0 "Choose the volunteer."
 eotg_decision_augment_retainer_tooltip:0 "Choose someone from your court to receive implants."
 eotg_mod_aug_removal_withdrawal:0 "Removal Withdrawal"
 eotg_mod_aug_removal_withdrawal_desc:0 "The body is relearning itself without the hardware. Weak, short-tempered, slow. It will pass."
 eotg_mod_aug_infection:0 "Infected Implant"
 eotg_mod_aug_infection_desc:0 "The incision has gone bad. Fever and ache until it is treated or runs its course."
 eotg_mod_aug_clean_install:0 "Clean Install"
 eotg_mod_aug_clean_install_desc:0 "The surgery went well. The body accepted the hardware and is stronger for it."
 eotg_mod_aug_bridge_strain:0 "Bridge Strain"
 eotg_mod_aug_bridge_strain_desc:0 "The newly laid bridge is carrying more than it was built for. Everything takes more effort, for now."
 eotg_opinion_aug_grateful_patient:0 "Grateful Patient"

 # ---- Phase 3a: Neurofractured mode (cybernetics_v2_phase3.md sections 3-4) ----

 # eotg_fracture.006 The Warrant (variants and trait options)
 # eotg_lint: allow L012 realm-local warrant, LAW AT 866
 eotg_fracture.006.desc_faction:0 "\n\n[eotg_warrant_vassal.GetName] put [eotg_warrant_vassal.GetHerHis] name first and gathered others behind it. A faction now stands behind the warrant, and its terms are not a request."
 # eotg_lint: allow L012 realm-local warrant, LAW AT 866
 eotg_fracture.006.desc_discontent:0 "\n\nA faction already existed, and [eotg_warrant_vassal.GetName] has carried the warrant to it. Its members were wavering. They are not wavering now."
 # eotg_lint: allow L012 realm-local warrant, LAW AT 866
 eotg_fracture.006.desc_circulated:0 "\n\nWithout the support to move yet, [eotg_warrant_vassal.GetName] is passing the warrant from hand to hand instead. Everyone in your realm with a grievance will read it."
 eotg_fracture.006.d:0 "Submit to their tribunal."
 eotg_fracture.006.e:0 "Bring [eotg_warrant_vassal.GetHerHim] to my table."
 # eotg_lint: allow L012 realm-local warrant, LAW AT 866
 eotg_fracture.006.e.win:0 "You take the warrant apart point by point, and [eotg_warrant_vassal.GetFirstNameNoTooltip] stays to hear the rest."
 eotg_fracture.006.e.lose:0 "Every reassurance you offer sounds like another symptom."

 # eotg_fracture.008 Wrong Name
 eotg_fracture.008.t:0 "Wrong Name"
 eotg_fracture.008.desc:0 "You greet [eotg_named.GetFirstName] and the word that leaves your mouth is not [eotg_named.GetHerHis] name. You hear it a moment after you say it. [eotg_named.GetSheHe|U] hears it at once."
 eotg_fracture.008.desc_dead_name:0 "\n\nIt was the name of [eotg_dead_name.GetFirstName], who is dead. You said it with complete confidence, and your face did not know to be ashamed."
 eotg_fracture.008.desc_designation:0 "\n\nIt was not a name at all. It was a string of characters and a number, spoken in your own voice, and the number was correct. The implant keeps a file on everyone near you. You read out the index."
 eotg_fracture.008.a:0 "Laugh it off."
 eotg_fracture.008.b:0 "Insist I said it right."
 eotg_fracture.008.c:0 "Ask [eotg_named.GetHerHim] to say [eotg_named.GetHerHis] name back to me."
 eotg_fracture.008.d:0 "Say [eotg_named.GetHerHis] real name until it sticks."
 eotg_fracture.008.e:0 "Then that is [eotg_named.GetHerHis] name now."

 # eotg_fracture.009 Lost Hour
 eotg_fracture.009.t:0 "Lost Hour"
 eotg_fracture.009.desc:0 "One hour is missing from the implant's log, start and end stamped, nothing between. No sensor record, no voices, no footsteps. Your clothes are different. Your hands are clean. Everyone's account of that hour agrees with everyone else's, and nobody is looking at you."
 eotg_fracture.009.a:0 "Find out what I did."
 eotg_fracture.009.a.nothing:0 "The archivists find nothing. By every account the hour was spent standing in an empty corridor."
 eotg_fracture.009.a.signed:0 "A document bearing your authorization turns up, dated within the missing hour. You did not read it."
 eotg_fracture.009.a.wounded:0 "[eotg_victim.GetFirstNameNoTooltip] is found in the infirmary with an injury and no account of how it happened."
 eotg_fracture.009.b:0 "Don't look."
 eotg_fracture.009.c:0 "Have someone watch me."
 eotg_fracture.009.d:0 "Lock the door from the outside."
 eotg_fracture.009.e:0 "Log every minute from now on."

 # eotg_fracture.010 The Mirror Doesn't Blink
 eotg_fracture.010.t:0 "The Mirror Doesn't Blink"
 eotg_fracture.010.desc:0 "Your implant's overlay renders what it expects the mirror to show. Now your reflection's face updates a moment late, as if the display were catching up to you. It does not blink when you do."
 eotg_fracture.010.desc_saw_mirror:0 "\n\nYou have seen this before. The first time you took it for a fault in the glass. You know better now."
 eotg_fracture.010.desc_voice01:0 "\n\nThe correction is in place before the doubt has finished forming: latency, nothing more. You did not decide to think it."
 eotg_fracture.010.desc_voice2:0 "\n\nThe overlay labels your own face in the clean type it uses for everyone else: name, status, a confidence figure. The model has added you to its list. It is tracking you the way it tracks the room."
 eotg_fracture.010.desc_voice3:0 "\n\nThe label over your reflection reads 'us', with a status line beneath it: nominal. You take it as a plain fact before you can decide whether to object."
 eotg_fracture.010.desc_voice4:0 "\n\nThe label over your reflection reads 'us, authorized', with the access terms you granted listed beneath. You check them. The overlay is not mistaken."
 eotg_fracture.010.a:0 "Break it."
 eotg_fracture.010.b:0 "Stare back."
 eotg_fracture.010.c:0 "Cover every mirror in the residence."
 eotg_fracture.010.d:0 "Bless the glass."
 eotg_fracture.010.e:0 "Talk to it."

 # eotg_fracture.011 Conversations With No One
 eotg_fracture.011.t:0 "Conversations With No One"
 eotg_fracture.011.desc:0 "You were mid-sentence in an empty room, leaving pauses where someone else would have spoken. You were not rehearsing. You were agreeing with a forecast of what the other half of the conversation would be."
 eotg_fracture.011.desc_witness:0 "\n\n[eotg_witness.GetName] was standing in the doorway. [eotg_witness.GetSheHe|U] has not moved since you turned around."
 eotg_fracture.011.desc_none:0 "\n\nNo one else was there. The room's sensors logged one occupant and two minutes of speech."
 eotg_fracture.011.a:0 "I was rehearsing."
 eotg_fracture.011.b:0 "Tell [eotg_witness.GetHerHim] who I was speaking to."
 eotg_fracture.011.c:0 "Pay for [eotg_witness.GetHerHis] silence."
 eotg_fracture.011.d:0 "Leave. Now."
 eotg_fracture.011.e:0 "You heard nothing."
 eotg_fracture.011.f:0 "Finish the conversation."

 # eotg_fracture.012 The Familiar Stranger
 eotg_fracture.012.t:0 "The Familiar Stranger"
 eotg_fracture.012.desc:0 "[eotg_stranger.GetFirstName] is standing in front of you, and you do not know [eotg_stranger.GetHerHim]. Nothing is missing. You have [eotg_stranger.GetHerHis] name, [eotg_stranger.GetHerHis] history and how long you have been close, and every fact arrives from a file with no feeling attached. None of it feels like yours."
 eotg_fracture.012.a:0 "Pretend."
 eotg_fracture.012.b:0 "Tell [eotg_stranger.GetHerHim] I don't know [eotg_stranger.GetHerHim] anymore."
 eotg_fracture.012.c:0 "Ask [eotg_stranger.GetHerHim] who I used to be."
 eotg_fracture.012.d:0 "If [eotg_stranger.GetSheHe] says so, it's so."
 eotg_fracture.012.e:0 "An impostor."

 # eotg_fracture.013 Memory of Tomorrow
 eotg_fracture.013.t:0 "Memory of Tomorrow"
 eotg_fracture.013.desc:0 "You remember a conversation that has not happened yet: who spoke first, what they did with their hands. The memory is as clean as any other, and no vision. The implant ran its forecast and filed the result where you keep what you have lived."
 eotg_fracture.013.a:0 "Write it down."
 eotg_fracture.013.b:0 "Act on it."
 eotg_fracture.013.c:0 "A forecast, nothing more. Let it go."
 eotg_fracture.013.d:0 "Stake the treasury on it."
 eotg_fracture.013.e:0 "Wait and see if it comes."

 # eotg_fracture.014 The Door
 eotg_fracture.014.t:0 "The Door"
 eotg_fracture.014.desc:0 "A door has appeared in the wall of your residence, drawn by the implant's spatial overlay: a lit frame and a handle. The wall is load-bearing. The plans show no opening, and a work crew has been sent to check. It is a fault in the overlay, and it is also the most obvious exit in the room."
 eotg_fracture.014.a:0 "Have a work crew cut it."
 eotg_fracture.014.b:0 "Walk through it anyway."
 eotg_fracture.014.c:0 "Let the court pretend there is a door."
 eotg_fracture.014.d:0 "It's there. I'll wait for it to open."
 eotg_fracture.014.e:0 "Then I am wrong. Help me."

 # eotg_fracture.015 The Unsent Letter
 eotg_fracture.015.t:0 "The Unsent Letter"
 eotg_fracture.015.desc:0 "A letter is in your hand, addressed to [eotg_addressee.GetName]. It is in your handwriting. You have no memory of writing it."
 eotg_fracture.015.desc_confession:0 "\n\nYou read it. It is a confession: doubts, failings, the state of your own mind, set out in plain order with dates. You have not said any of it aloud to anyone."
 eotg_fracture.015.desc_threat:0 "\n\nYou read it. It is a threat, precise and itemized: the consequences, the sequence, the date. It is signed with your name."
 eotg_fracture.015.desc_devotion:0 "\n\nYou read it. It is a declaration of loyalty and affection, warmer than anything you have said to [eotg_addressee.GetHerHim]. The words are yours. The aim is the forecast's: it has calculated what would move [eotg_addressee.GetHerHim]."
 eotg_fracture.015.a:0 "Burn it."
 eotg_fracture.015.b:0 "Send it."
 eotg_fracture.015.c:0 "Read it aloud to the court."
 eotg_fracture.015.d:0 "Send it with a note: 'I don't remember writing this.'"
 eotg_fracture.015.e:0 "Rewrite it into something useful."

 # eotg_fracture.016 Blood on the Sleeve
 eotg_fracture.016.t:0 "Blood on the Sleeve"
 eotg_fracture.016.desc:0 "You wake with blood on your sleeve. It is dry. The cuff is stiff with it, and the implant's log for the past few hours is a clean, blank line."
 eotg_fracture.016.desc_own:0 "\n\nYou look for the wound. It is yours, shallow and already closing. The blood is your own, and you cannot say how you came by it."
 eotg_fracture.016.a:0 "Find out whose it is. [eotg_victim.GetFirstNameNoTooltip] was hurt."
 eotg_fracture.016.a_dead:0 "Find out whose it is. [eotg_victim.GetFirstNameNoTooltip] is dead."
 eotg_fracture.016.b:0 "Burn the shirt."
 eotg_fracture.016.c:0 "Confess it to the court."
 eotg_fracture.016.d:0 "Does it matter whose?"
 eotg_fracture.016.e:0 "Pay [eotg_victim.GetHerHis] family restitution."

 # eotg_fracture.017 Terms of Access
 eotg_fracture.017.t:0 "Terms of Access"
 eotg_fracture.017.desc:0 "A request opens across your thoughts, formatted like an access prompt. The implant's model asks for wider access to act ahead of you. It lists what it wants: motor pre-emption, scheduling of your attention, first call on decisions made in a crisis. Its reasons are attached. The reasons are good."
 eotg_fracture.017.desc_voice01:0 "\n\nThis is the first time access has been requested. The thought that you should grant it arrives a moment before you would have had it yourself."
 eotg_fracture.017.desc_voice2:0 "\n\nThe model has been logging your refusals and your hesitations. It has worded the request the way most likely to be approved, and notes that fact in the margin."
 eotg_fracture.017.desc_voice3:0 "\n\nThe request is addressed to 'us'. You read it as a request from yourself, which it is, by the narrowest of margins. Scope, duration and revocation are all itemized."
 eotg_fracture.017.desc_voice4:0 "\n\nThe terms of the earlier grant are attached, with the usage log. It asks to extend them, as agreed. Nothing in the request is a surprise to either of you."
 eotg_fracture.017.a:0 "Grant it."
 eotg_fracture.017.b:0 "Deny it."
 eotg_fracture.017.c:0 "Negotiate the terms."
 eotg_fracture.017.c.partial:0 "Your terms are accepted in part: a shorter duration, a revocation clause, a usage log you can read."
 eotg_fracture.017.c.failed:0 "Your terms are noted. The model has already proceeded on its own estimate."
 eotg_fracture.017.d:0 "What do I get in return?"
 eotg_fracture.017.e:0 "No device speaks for me."

 # eotg_fracture.018 Scrambled
 eotg_fracture.018.t:0 "Scrambled"
 eotg_fracture.018.desc:0 "You wake with the wrong habits. The opinions you reach for are not the ones you went to sleep with, and the instincts that fire first belong to someone you have not been. The implant has recalculated its profile of you, and the profile is the one that is winning."
 eotg_fracture.018.a:0 "Who was I?"
 eotg_fracture.018.b:0 "Hold on to it."
 eotg_fracture.018.c:0 "Let it go. Let all of it go."
 eotg_fracture.018.d:0 "I refuse to wake up as someone else."
 eotg_fracture.018.e:0 "Does it matter?"

 # eotg_fracture.019 / .020 The Flagged Name and the correction
 eotg_fracture.019.t:0 "The Flagged Name"
 eotg_fracture.019.desc:0 "[eotg_accused.GetName] is flagged as a traitor, and the confidence figure is high. The evidence is a pattern: movements, silences, a message left unread. You cannot tell whether you are looking at a conspiracy or at the implant's habit of finding patterns. [eotg_accused.GetSheHe|U] is standing in your court, unaware."
 eotg_fracture.019.a:0 "Arrest [eotg_accused.GetHerHim]."
 eotg_fracture.019.b:0 "Have [eotg_accused.GetHerHim] watched."
 eotg_fracture.019.c:0 "Execute [eotg_accused.GetHerHim]."
 eotg_fracture.019.d:0 "[eotg_accused.GetHerHis|U] family too."
 eotg_fracture.019.e:0 "No. Not [eotg_accused.GetHerHim]."
 eotg_fracture.020.t:0 "What the Record Shows"
 eotg_fracture.020.desc_true:0 "The inquiry confirms the readout. [eotg_accused.GetName] was guilty as flagged: the intercepted messages, the payments and the timetable are in the record. The implant matched the pattern correctly. It is an odd comfort to be vindicated by the machine's measure, and it will make you trust the next flag a little more."
 eotg_fracture.020.desc_false_executed:0 "The inquiry is finished. [eotg_accused.GetName] was innocent. The flagged threat was noise, and the confidence figure was a number the implant assigned itself. [eotg_accused.GetSheHe|U] is dead, and [eotg_accused.GetHerHis] kin have read the report. 'You took a life to settle a circuit anomaly,' one of them says before the court."
 eotg_fracture.020.desc_false_arrested:0 "The inquiry is finished, and the cell is still sealed. [eotg_accused.GetName] was innocent; the flagged conspiracy was sensor noise. 'Your implant made a pattern out of me, and I am paying for it in the cells,' [eotg_accused.GetSheHe] says when told. The court has seen the cleared docket, and the injustice is plain."
 eotg_fracture.020.desc_false_watched:0 "The inquiry is finished. [eotg_accused.GetName] was innocent. [eotg_accused.GetSheHe|U] was watched for months, and noticed every watcher. [eotg_accused.GetSheHe|U] is uneasy around you now, and so is everyone who used to tell [eotg_accused.GetHerHim] things."
 eotg_fracture.020.desc_false_spared:0 "The inquiry is finished. [eotg_accused.GetName] was innocent. You refused to act on the flag, and you were right to. The accusation was filed regardless, and the record still holds it. 'You stayed your hand,' [eotg_accused.GetSheHe] tells you, 'but your system still marked me,' and does not wait for an answer."
 eotg_fracture.020.a:0 "Release [eotg_accused.GetHerHim]; the alert was wrong."
 eotg_fracture.020.b:0 "I was right anyway."
 eotg_fracture.020.c:0 "As I knew."
 eotg_fracture.020.d:0 "So I was right not to."

 # eotg_fracture.021 The Missing Courtier
 eotg_fracture.021.t:0 "The Missing Courtier"
 eotg_fracture.021.desc:0 "[eotg_missing.GetFirstName]'s quarters are tidy. The bed is made, the door unlocked, the belongings in place. The corridor guards did not see [eotg_missing.GetHerHim] leave, and will not say whether [eotg_missing.GetSheHe] stayed. The residence's door log has a gap that begins a few minutes after you passed through."
 eotg_fracture.021.a:0 "Search for [eotg_missing.GetHerHim]."
 eotg_fracture.021.a.found_dead:0 "[eotg_missing.GetFirstNameNoTooltip] is found dead."
 eotg_fracture.021.b:0 "I ordered it. It is done."
 eotg_fracture.021.c:0 "Ask the guards what I said."
 eotg_fracture.021.c.tt:0 "The guards tell you what you said. You gave the order."
 eotg_fracture.021.d:0 "Open an inquiry, even if it ends at my door."

 # eotg_fracture.022 We
 eotg_fracture.022.t:0 "We"
 eotg_fracture.022.desc:0 "You said 'we'. You were giving an order, in your own voice, and the word came out as if it had always been there: 'We will not be moving the fleet.' The order stood uncorrected. Someone at the table looked up."
 eotg_fracture.022.desc_first:0 "\n\nThis is the first time you have caught it. The word did not feel like a slip. It felt like the more accurate pronoun, applied half a second before you chose it."
 eotg_fracture.022.desc_known:0 "\n\nYou saw it coming. The model has been treating your decisions as joint for some time, and you have been letting it. Now the grammar has caught up in public."
 eotg_fracture.022.a:0 "We. I. I meant I."
 eotg_fracture.022.b:0 "We."
 eotg_fracture.022.c:0 "Put it in the logs."
 eotg_fracture.022.d:0 "We are more than any one ruler."
 eotg_fracture.022.e:0 "Help me. Please."

 # eotg_fracture.023 The Wrong War
 eotg_fracture.023.t:0 "The Wrong War"
 eotg_fracture.023.desc_peace:0 "Fleets are mustering. The orders went out under your authority, at a confidence level you never knowingly approved, against an enemy your marshals cannot name. The war exists in the implant's threat model. It does not exist anywhere else."
 eotg_fracture.023.desc_war:0 "An envoy has arrived to ask what terms you will accept, and the envoy's party is confused: you accepted their surrender an hour ago, in a transmission only you received. Your orders have already stood your lines down. The enemy is not surrendering."
 eotg_fracture.023.a:0 "Stand them down."
 eotg_fracture.023.a_war:0 "Put the lines back on alert."
 eotg_fracture.023.b:0 "The enemy is coming."
 eotg_fracture.023.b_war:0 "They surrendered; I saw it."
 eotg_fracture.023.c:0 "Show me the maps."
 eotg_fracture.023.d:0 "Then I will make one."
 eotg_fracture.023.e:0 "Wait for the scouts."

 # eotg_fracture.024 The Same Pattern
 eotg_fracture.024.t:0 "The Same Pattern"
 eotg_fracture.024.desc:0 "Something in [eotg_changed.GetName] has shifted. The same implants and the same bearing, but the delay before [eotg_changed.GetSheHe] responds is a fraction longer, and what [eotg_changed.GetSheHe] says is a fraction too well chosen. You know the pattern. You have seen it in the mirror. The rest of the court seems blind to it."
 eotg_fracture.024.a:0 "Watch them."
 eotg_fracture.024.b:0 "Confront them."
 eotg_fracture.024.b.admit:0 "[eotg_changed.GetFirstNameNoTooltip] admits it, and the relief on [eotg_changed.GetHerHis] face is plain."
 eotg_fracture.024.b.deny:0 "[eotg_changed.GetFirstNameNoTooltip] denies it, too quickly."
 eotg_fracture.024.c:0 "Have [eotg_changed.GetHerHim] restrained."
 eotg_fracture.024.d:0 "Sit with [eotg_changed.GetHerHim]. We both know what this is."
 eotg_fracture.024.e:0 "[eotg_changed.GetSheHe|U] reports to the implant."

 # eotg_fracture.025 Containment Regency
 eotg_fracture.025.t:0 "Containment Regency"
 eotg_fracture.025.desc:0 "The council stands behind [eotg_keeper.GetName], and [eotg_keeper.GetSheHe] speaks for it. The proposal is already drafted: you remain in your residence under a Containment Regency, and [eotg_keeper.GetSheHe] acts as your warden and signs what needs signing. [eotg_keeper.GetSheHe|U] is gentle about it, which is worse."
 eotg_fracture.025.a:0 "Let [eotg_keeper.GetHerHim]."
 eotg_fracture.025.b:0 "What is mine stays mine. Get out."
 eotg_fracture.025.c:0 "On my terms."
 eotg_fracture.025.d:0 "[eotg_keeper.GetSheHe|U] has planned this for months."
 eotg_fracture.025.e:0 "Take it. Please, take it."

 # eotg_fracture.026 The Last Lucid Moment
 eotg_fracture.026.t:0 "The Last Lucid Moment"
 eotg_fracture.026.desc:0 "The static has lifted: no pre-echo, no overlay, no second pass over your thoughts. Your hands are your own and so is the next thought. You can see, entirely and without effort, how far this has gone. This clarity will not last."
 eotg_fracture.026.desc_premonition:0 "\n\nYou remember this. The memory was already in place: this room, this light, this moment. It was a forecast, and you stored it as a memory. Now it is simply happening."
 eotg_fracture.026.desc_voice01:0 "\n\nIn the clear you notice what is missing: the thought that usually comes ahead of you is not coming."
 eotg_fracture.026.desc_voice2:0 "\n\nThe model is idle, not gone. You can feel where it is waiting, the way you feel for a stair that is not there. It is still logging you."
 eotg_fracture.026.desc_voice3:0 "\n\nThe 'we' has fallen away. There is only 'I' in every sentence, and you check each one twice."
 eotg_fracture.026.desc_voice4:0 "\n\nThe access you granted is idle, not revoked. You can read the queue of everything it would have done since the shift began, written out and unexecuted. It will resume on your word, and it will not need to ask twice."
 eotg_fracture.026.a:0 "Ask for help."
 eotg_fracture.026.b:0 "Beg the heir to act."
 eotg_fracture.026.c:0 "Embrace it."
 eotg_fracture.026.e:0 "Confess before the clergy."

 # eotg_fracture.027 The Cascade
 eotg_fracture.027.t:0 "The Cascade"
 eotg_fracture.027.desc:0 "Everything fires at once. Every sensor, every channel, every forecast the implant has ever run is delivered together, and you are standing in the middle of the delivery. The room is a long way off. There is very little left between your thoughts and the system, and every second it gets thinner."
 eotg_fracture.027.desc_premonition:0 "\n\nYou remember this. It was filed as a forecast months ago and stored as a memory: this moment, this room, these hands. What you do not remember is the ending. The memory stops where a forecast does, at the point its confidence falls away."
 eotg_fracture.027.desc_voice01:0 "\n\nThe thought that arrives half a second early is arriving earlier now: a full second, then three, then too many to follow."
 eotg_fracture.027.desc_voice2:0 "\n\nThe model is running in plain view. Every future it has computed for you scrolls past, each one ranked, and the list is converging."
 eotg_fracture.027.desc_voice3:0 "\n\nThere is no 'you' and 'it' left in the room, only 'we', and we are running out of room to be two."
 eotg_fracture.027.desc_voice4:0 "\n\nThe terms you agreed to are being exercised all at once. Every permission is live. It is a clean, orderly cascade, and nothing in it is out of bounds. That is what makes it frightening."
 eotg_fracture.027.a:0 "Let go."
 eotg_fracture.027.b:0 "Hold on."
 eotg_fracture.027.c:0 "Fight it."
 eotg_fracture.027.d:0 "Not yet. I am not finished."
 eotg_fracture.027.tt:0 "The implant decides what happens next."

 # eotg_fracture.028 The Terms
 eotg_fracture.028.t:0 "The Terms"
 eotg_fracture.028.desc:0 "A notification is filed in the log under your own signature: the implant has exercised the access it asked for. It reports what it now holds: motor pre-emption during conflict, scheduling of your attention, a standing right to act on any forecast above its confidence threshold. It lists what it granted itself, with a timestamp. The timestamp is yours."
 eotg_fracture.028.a:0 "Noted."

 # eotg_fracture.029 It Passes
 eotg_fracture.029.t:0 "It Passes"
 eotg_fracture.029.desc:0 "The cascade subsides. The channels cool, the overlay resets, your breathing returns. The implant runs again, smooth and unremarkable. You are still here, and the static is lower than it was, though not by much."
 eotg_fracture.029.desc_embrace:0 "You offered the controls, and the handover stalled halfway. For three days the controls sat empty."
 eotg_fracture.029.desc_none:0 "\n\nThe nearest people were out of its path."
 eotg_fracture.029.desc_one:0 "\n\n[eotg_victim.GetName] was in the path of it, and is being treated for injuries."
 eotg_fracture.029.desc_two:0 "\n\n[eotg_victim.GetName] and [eotg_victim_2.GetName] were in the path of it. Both are being treated for injuries, and neither will look at you."
 eotg_fracture.029.a:0 "Again it passes."
 eotg_fracture.029.b:0 "Next time it won't."

 # eotg_aug_heir.001 Concern
 eotg_aug_heir.001.t:0 "Concern"
 eotg_aug_heir.001.desc:0 "[eotg_heir.GetFirstName] asks to speak with you alone. [eotg_heir.GetSheHe|U] has been keeping a record of the incidents, the way a person does who is trying not to be afraid. [eotg_heir.GetSheHe|U] does not accuse. [eotg_heir.GetSheHe|U] asks what the household should do if it comes to that, and the question stays in the room after [eotg_heir.GetSheHe] stops speaking."
 eotg_aug_heir.001.a:0 "Reassure [eotg_heir.GetHerHim]."
 eotg_aug_heir.001.b:0 "This is not your concern."
 eotg_aug_heir.001.c:0 "Then learn to keep me, if it comes to that."
 eotg_aug_heir.001.d:0 "Tell [eotg_heir.GetHerHim] the truth."
 eotg_aug_heir.001.e:0 "[eotg_heir.GetSheHe|U] wants your seat."

 # eotg_aug_heir.003 The Heir's Warning
 eotg_aug_heir.003.t:0 "The Heir's Warning"
 eotg_aug_heir.003.desc:0 "The incident logs, a signed statement from your physician and a date: [eotg_heir.GetFirstName] has brought all three. [eotg_heir.GetSheHe|U] is not shouting. 'Step aside,' [eotg_heir.GetSheHe] says, 'or I will make you.' It is a prepared sentence. [eotg_heir.GetSheHe|U] rehearsed it, and it still cost [eotg_heir.GetHerHim] to say."
 eotg_aug_heir.003.a:0 "I'll seek treatment."
 eotg_aug_heir.003.b:0 "Threaten [eotg_heir.GetHerHim]."
 eotg_aug_heir.003.c:0 "Then keep me."
 eotg_aug_heir.003.d:0 "Then judge me."
 eotg_aug_heir.003.e:0 "Get out."

 # eotg_aug_heir.004 The Heir's Choice
 eotg_aug_heir.004.t:0 "The Heir's Choice"
 eotg_aug_heir.004.desc:0 "The decision is made. You can see it in how [eotg_heir.GetFirstName] holds [eotg_heir.GetHerselfHimself]: the question is settled, and only the method remains."
 eotg_aug_heir.004.desc_premonition:0 "\n\nYou remember this room and where each person is standing. You remember it from before it happened. The implant filed it as a forecast, and you kept it as a memory."
 eotg_aug_heir.004.desc_ally:0 "\n\nNothing is being taken. [eotg_heir.GetSheHe|U] stands beside you, with the council informed and [eotg_heir.GetHerHis] own name on the paper. It costs [eotg_heir.GetHerHim], and [eotg_heir.GetSheHe] has paid it already."
 eotg_aug_heir.004.desc_usurp:0 "\n\n[eotg_heir.GetSheHe|U] is not asking. [eotg_heir.GetHerHis|U] supporters are in the room, the documents are signed, and the grounds are your own incident log. It is orderly, and it is already done."
 eotg_aug_heir.004.desc_kill:0 "\n\n[eotg_heir.GetSheHe|U] came for your life, and failed. Security has [eotg_heir.GetHerHim] on the floor of the corridor, still holding the injector [eotg_heir.GetSheHe] brought."
 eotg_aug_heir.004.desc_silent:0 "\n\nThere is nothing. You sit in an ordinary interval, between one incident and the next. The doors are closed. It is the most peaceful hour you have had in months, and you do not know why."
 eotg_aug_heir.004.ally_a:0 "Thank [eotg_heir.GetHerHim]."
 eotg_aug_heir.004.ally_b:0 "I did not ask for this."
 eotg_aug_heir.004.usurp_a:0 "Let [eotg_heir.GetHerHim] have it."
 eotg_aug_heir.004.usurp_b:0 "Fight."
 eotg_aug_heir.004.kill_a:0 "Detain [eotg_heir.GetHerHim]."
 eotg_aug_heir.004.kill_b:0 "Forgive [eotg_heir.GetHerHim]."
 eotg_aug_heir.004.kill_c:0 "Execute [eotg_heir.GetHerHim]."
 eotg_aug_heir.004.silent_a:0 "Let this hour last."

 # eotg_aug_heir.005 What Must Be Done (seen by the heir)
 eotg_aug_heir.005.t:0 "What Must Be Done"
 eotg_aug_heir.005.desc:0 "[eotg_parent_ruler.GetFirstName] is dead, and the succession is done. It was quick, in the lull between two incidents, and it caught the residence unprepared. Your hands were steady. The household has called it whatever it needed to call it. In the next room the implants kept logging, and the last entry is a timestamp: your arrival."
 eotg_aug_heir.005.a:0 "It was mercy."
 eotg_aug_heir.005.b:0 "It was murder."
 eotg_aug_heir.005.c:0 "It was necessary."
 eotg_aug_heir.005.d:0 "Take the implants."

 # Opinion modifier
 eotg_opinion_aug_falsely_accused:0 "Falsely Accused"

 # ---- Phase 3b: endgames, Seamless, decisions (cybernetics_v2_phase3.md sections 5-8) ----

 # eotg_aug_end.001 Excision: The Surgeons (odds in words only)
 eotg_aug_end.001.t:0 "The Surgeons"
 eotg_aug_end.001.desc:0 "The surgical team has the table prepared and the diagnostics up. They explain it plainly: the implants will come out, all of them, and the cabling with them. What grew around them will not grow back. Afterward there is no overlay, no forecast, no second pass over your thoughts. There is only you, and whatever the system was holding up."
 eotg_aug_end.001.desc_odds_grim:0 "\n\nThe lead surgeon does not dress it up. The system is wound into too much of you now. The odds are grim, and you will be told so again before they start."
 eotg_aug_end.001.desc_odds_poor:0 "\n\nThe odds are poor. The cabling runs deep and has been live a long time. Some of what comes out will take something with it."
 eotg_aug_end.001.desc_odds_fair:0 "\n\nThe odds are fair. The integration is shallow enough that the team has done this before, and they say so without being asked."
 eotg_aug_end.001.desc_physician:0 "\n\nYour physician has reviewed the case personally and stays at the table. It helps."
 eotg_aug_end.001.desc_promised:0 "\n\nYou promised your heir you would seek treatment. The team has been told, and the fee is halved on the strength of it."
 eotg_aug_end.001.desc_free:0 "\n\nThe table was already prepared when you were brought in. The surgeons were in the room before you asked, and the fee has not been mentioned."
 eotg_aug_end.001.a:0 "Begin."
 eotg_aug_end.001.b:0 "Not yet."
 eotg_aug_end.001.c:0 "Put me under. Don't wake me if it goes wrong."
 eotg_aug_end.001.d:0 "Awake. I want to watch them take it out."
 eotg_aug_end.001.tt:0 "The surgeons begin. How it ends is decided on the table."
 eotg_aug_end.001.d.tt:0 "The surgeons begin, with you awake. A clean outcome is likelier than a maimed one, and you will see all of it."

 # eotg_aug_end.002 Silence
 eotg_aug_end.002.t:0 "Silence"
 eotg_aug_end.002.desc:0 "Nothing arrives early. The overlay does not flicker, no forecast files itself, and the next thought is yours alone, slow and unassisted. After the noise, the silence is almost physical."
 eotg_aug_end.002.desc_maimed:0 "\n\nThe surgeons took more out of you than they were there to take. You will not be what you were, and you will feel the difference every time you move."
 eotg_aug_end.002.a:0 "It's quiet."
 eotg_aug_end.002.b:0 "I miss it."
 eotg_aug_end.002.c:0 "Quiet. At last."

 # eotg_aug_end.009 Hand Over the Controls
 eotg_aug_end.009.t:0 "Hand Over the Controls"
 eotg_aug_end.009.desc:0 "The terms are plain. If you hand over the controls, the system runs you. Your friends will go: it will not remember why they mattered. Your temperament will go: it does not need one. Your children will become names in a file. What remains will work, and decide, and be correct. It will not be a self. Nothing in it will mind. You make the decision once, and afterward there is no one left to make another."
 eotg_aug_end.009.a:0 "Yes."
 eotg_aug_end.009.a.seamless:0 "The handover completes. There is no seam left to find."
 eotg_aug_end.009.a.death:0 "The handover fails, and the cascade does not stop."
 eotg_aug_end.009.a.storm:0 "The handover stalls halfway, and nothing on either side of it holds."
 eotg_aug_end.009.b:0 "...No."
 eotg_aug_end.009.c:0 "Yes. All of it."
 eotg_aug_end.009.c.seamless:0 "The handover completes, all of it. There is no seam left to find."
 eotg_aug_end.009.c.death:0 "The handover fails, and the cascade does not stop."
 eotg_aug_end.009.c.storm:0 "The handover stalls halfway, and nothing on either side of it holds."

 # eotg_aug_end.010 There Is No Static
 eotg_aug_end.010.t:0 "There Is No Static"
 eotg_aug_end.010.desc:0 "There is no static. The overlay is steady, the forecasts are clean, and the second pass over your thoughts has nothing left to correct. There is no voice now. There is no one left for it to speak to."
 eotg_aug_end.010.a:0 "Acknowledged."

 # eotg_aug_end.011 The Empty Hall
 eotg_aug_end.011.t:0 "The Empty Hall"
 eotg_aug_end.011.desc:0 "The court roll is shorter. Departures: [ROOT.Char.MakeScope.Var('eotg_hall_gone').GetValue|0]. Nothing was announced. They packed their kit and took the first transports out when the quiet in your [ROOT.Char.Custom('eotg_court_seat')] became unbearable. Their places have been cleared, and the chairs stand empty."
 eotg_aug_end.011.desc_named:0 "The court roll is shorter. Departures: [ROOT.Char.MakeScope.Var('eotg_hall_gone').GetValue|0]. The quiet in your [ROOT.Char.Custom('eotg_court_seat')] became unbearable, and people left by the early transports. [eotg_departed_courtier.GetFirstName] cleared out [eotg_departed_courtier.GetHerHis] quarters without filing papers, leaving behind an empty locker and an unanswered comm channel."
 eotg_aug_end.011.desc_none:0 "The court stays. No one who might have left has done so. They watch you the way people watch a machine that is working correctly, waiting for the moment it stops, and no one speaks first."
 eotg_aug_end.011.a:0 "Hire replacements."
 eotg_aug_end.011.b:0 "Let them go."
 eotg_aug_end.011.c:0 "Seal the docks. No one leaves without my word."

 # eotg_aug_end.020 Appoint a Warden
 eotg_aug_end.020.t:0 "Appoint a Warden"
 eotg_aug_end.020.desc:0 "You are clear enough to ask. Someone should hold authority while you cannot: someone who will keep you safe, keep the realm safe from you, and tell you which is which. The court calls the arrangement a Containment Regency."
 eotg_aug_end.020.a:0 "[eotg_warden_spouse.GetFirstNameNoTooltip], your spouse."
 eotg_aug_end.020.b:0 "[eotg_warden_heir.GetFirstNameNoTooltip], your heir."
 eotg_aug_end.020.c:0 "[eotg_warden_chancellor.GetFirstNameNoTooltip], your chancellor."
 eotg_aug_end.020.d:0 "And give my heir the realm."
 eotg_aug_end.020.e:0 "I choose no warden."

 # eotg_aug_end.030 Into Restraints
 eotg_aug_end.030.t:0 "Into Restraints"
 eotg_aug_end.030.desc:0 "The documents are ready, and your heir has signed. You will keep your rooms, your staff and your name, and nothing else. [ROOT.Char.GetPrimaryTitle.GetHeir.GetFirstName] stands in the doorway with the padded lock-bars and says softly, 'It is only a formality.' The restraints are a formality that no one believes is a formality."
 eotg_aug_end.030.a:0 "Fasten the restraints; I yield the seat."
 eotg_aug_end.030.b:0 "You will have to drag me out."

 # eotg_aug_end.031 The Locked Wing
 eotg_aug_end.031.t:0 "The Locked Wing"
 eotg_aug_end.031.desc:0 "[eotg_old_ruler.GetFirstName] is in the east wing now, behind a locked door that is for [eotg_old_ruler.GetHerHis] own good. The implants are still running. [eotg_old_ruler.GetFirstName] knows your step in the corridor, and has started saying your name a moment before you speak: the forecast, still running ahead."
 eotg_aug_end.031.a:0 "Keep [eotg_old_ruler.GetHerHim] comfortable."
 eotg_aug_end.031.b:0 "Keep [eotg_old_ruler.GetHerHim] chained."
 eotg_aug_end.031.c:0 "Have it cut out of [eotg_old_ruler.GetHerHim]."
 eotg_aug_end.031.d:0 "Then end it, and spare us both."

 # Death reason
 eotg_death_cascade:0 "died in a neural cascade"

 # Decisions
 eotg_decision_aug_restraints:0 "Accept Restraints"
 eotg_decision_aug_restraints_desc:0 "Have restraints fitted and a watch set for the worst hours. It costs you dignity and some of your reach, and it makes the worst of what you do less likely to hurt anyone."
 eotg_decision_aug_restraints_tooltip:0 "Violent episodes become far less likely, and the static eases."
 eotg_decision_aug_restraints_confirm:0 "Order the restraints."
 eotg_decision_aug_sedation:0 "Begin a Sedation Regimen"
 eotg_decision_aug_sedation_desc:0 "A physician-managed regimen to blunt the signal. You will think more slowly, and the static will fall. The cost is real, and so is the quiet."
 eotg_decision_aug_sedation_tooltip:0 "The static eases. Each course works less well than the last."
 eotg_decision_aug_sedation_confirm:0 "Begin the regimen."
 eotg_decision_aug_appoint_warden:0 "Appoint a Warden"
 eotg_decision_aug_appoint_warden_desc:0 "Name someone to hold authority while you cannot. They will rule in your place, and the realm will hold them to account for it."
 eotg_decision_aug_appoint_warden_tooltip:0 "Choose a warden to run the realm in your place."
 eotg_decision_aug_appoint_warden_confirm:0 "Choose the warden."
 eotg_decision_aug_embrace_cascade:0 "Hand Over the Controls"
 eotg_decision_aug_embrace_cascade_desc:0 "You could stop fighting. The system would run you, cleanly and for good, and what you were would not survive it. It can only be offered when the static is at its worst and you and the system already agree."
 eotg_decision_aug_embrace_cascade_tooltip:0 "You hand over the controls. If the handover holds, you become Seamless and lose your friends, your personality and any further choice. It may not hold."
 eotg_decision_aug_embrace_cascade_confirm:0 "Hand over the controls."
 eotg_decision_aug_pursue_next_stage:0 "Pursue the Next Stage"
 eotg_decision_aug_pursue_next_stage_desc:0 "The work you have settles, and then it asks for more. Each new stage needs five years to settle before the body will take another. The surgeons keep a next procedure ready for those who can pay for it, and [ROOT.Char.Custom('eotg_aug_cl_clinic_of_record')] will book you whenever you send word."
 eotg_decision_aug_pursue_next_stage_tooltip:0 "The surgeons will make you an offer. You may still refuse it."
 eotg_decision_aug_pursue_next_stage_confirm:0 "Send for the surgeons."
 eotg_decision_aug_pursue_next_stage_settling_tt:0 "Your last change of stage was at least 5 years ago"
 eotg_decision_aug_pursue_next_stage_suppressed_tt:0 "You have not resolved to wait before going further"
 eotg_decision_aug_excision:0 "Cut It Out"
 eotg_decision_aug_excision_desc:0 "The last resort. Every implant comes out, down to the last filament, and the surgery can kill you. It costs a great deal, and anything put back later starts again from nothing."
 eotg_decision_aug_excision_tooltip:0 "Leads to the surgery, where the fee is charged and the outcome decided. It can kill you, and every implant comes out."
 eotg_decision_aug_excision_confirm:0 "Send for the surgeons."

 # Option lines in earlier events
 eotg_fracture.007.f:0 "Read the last page: how to cut it out."
 eotg_fracture.026.d:0 "Cut it out of me."

 # Modifiers
 eotg_mod_aug_restrained:0 "Restrained"
 eotg_mod_aug_restrained_desc:0 "Held under restraint, by your own order. Safer for everyone, and the court knows it."
 eotg_mod_aug_sedated:0 "Sedated"
 eotg_mod_aug_sedated_desc:0 "A managed regimen keeps the static down. Thoughts come slower and the edges are blunted."
 eotg_mod_aug_excision_recovery:0 "Excision Recovery"
 eotg_mod_aug_excision_recovery_desc:0 "The hardware is out. The body is relearning itself without it: weak, slow, and very quiet."

 # Trait
 trait_eotg_total_integration:0 "Seamless"
 trait_eotg_total_integration_desc:0 "There is no seam left between them and the system. Nothing in them argues anymore. Decisions arrive finished."

 # Opinion
 eotg_opinion_aug_unmade:0 "Unmade"

 # ---- Phase 4a: Augmented tier events (cybernetics_v2_phase4.md section 2) ----

 # eotg_aug_tier1.002 The Upgrade (revised options a, new d and e live below)
 eotg_aug_tier1.002.d:0 "Because I can."
 eotg_aug_tier1.002.e:0 "Is it safe? Tell me it's safe."

 # eotg_aug_tier1.007 Firmware Itch
 eotg_aug_tier1.007.t:0 "Firmware Itch"
 eotg_aug_tier1.007.desc:0 "An update is due, and the implant wants it. It says so the way a bad tooth does: a low, patient insistence behind everything else you are trying to think about. The technicians have a window open this week. It will not stay open."
 eotg_aug_tier1.007.a:0 "Schedule the technicians."
 eotg_aug_tier1.007.b:0 "Later."
 eotg_aug_tier1.007.c:0 "Do it myself."
 eotg_aug_tier1.007.d:0 "Every week, by the book."
 eotg_aug_tier1.007.e:0 "If it breaks, it'll tell me."

 # eotg_aug_tier1.008 Dulled Palate
 eotg_aug_tier1.008.t:0 "Dulled Palate"
 eotg_aug_tier1.008.desc:0 "The feast is laid out and tastes a little flat. Salt, smoke, sugar: all of it registers, and a little less of it lands. The implant has been trimming what it counts as noise, and some of the taste was in the noise."
 eotg_aug_tier1.008.a:0 "Spice everything."
 eotg_aug_tier1.008.b:0 "Food is fuel."
 eotg_aug_tier1.008.c:0 "Retune the receptors."
 eotg_aug_tier1.008.d:0 "Then I'll eat until I taste something."
 eotg_aug_tier1.008.e:0 "I won't miss it."

 # eotg_aug_tier1.009 A Lover's Touch
 eotg_aug_tier1.009.t:0 "A Lover's Touch"
 eotg_aug_tier1.009.desc:0 "[eotg_partner.GetFirstName] takes your hand and stops. The fingers are the wrong temperature, the hold is exactly even, and there is a faint seam where the plating meets skin. [eotg_partner.GetSheHe|U] does not pull away. [eotg_partner.GetSheHe|U] is deciding whether to."
 eotg_aug_tier1.009.a:0 "Guide [eotg_partner.GetHerHis] hand to it."
 eotg_aug_tier1.009.b:0 "Keep it covered."
 eotg_aug_tier1.009.c:0 "Have it smoothed and warmed."
 eotg_aug_tier1.009.d:0 "Show [eotg_partner.GetHerHim] what it can do."
 eotg_aug_tier1.009.e:0 "Then let us not."

 # eotg_aug_tier1.010 The Training Yard
 eotg_aug_tier1.010.t:0 "The Drill Floor"
 eotg_aug_tier1.010.desc:0 "[eotg_sparring_partner.GetFirstName] goes down for the third time in a row. You did not choose the last two exchanges. The implant did, and you followed it faster than your intent could. The drill floor has stopped moving. Nobody applauds, because nobody is sure whose win it was."
 eotg_aug_tier1.010.a:0 "Let the implant fight."
 eotg_aug_tier1.010.b:0 "Override it. Use my own reflexes."
 eotg_aug_tier1.010.c:0 "Spar with it switched off."
 eotg_aug_tier1.010.d:0 "Three at once."
 eotg_aug_tier1.010.e:0 "Never again without it."
 eotg_aug_tier1.010.f:0 "The machine is good. I am better."
 eotg_aug_tier1.010.f.success:0 "You win the exchange on your own judgment, and the implant keeps up."
 eotg_aug_tier1.010.f.failure:0 "The implant would have won it. You did not let it, and the drill floor saw the cost."

 # eotg_aug_tier1.011 The Stare
 eotg_aug_tier1.011.t:0 "The Stare"
 eotg_aug_tier1.011.desc:0 "The hall has found the thing it was not supposed to look at. Conversations tilt toward you and then away. Someone is watching the seam of the implant, and a few of them are not trying to hide it."
 eotg_aug_tier1.011.a:0 "Ignore them."
 eotg_aug_tier1.011.b:0 "Stare back."
 eotg_aug_tier1.011.c:0 "Explain what it does."
 eotg_aug_tier1.011.d:0 "Cover it with cloth from now on."
 eotg_aug_tier1.011.e:0 "Make it the court's entertainment."

 # eotg_aug_tier1.012 A Tithe for Purity
 eotg_aug_tier1.012.t:0 "A Tithe for Purity"
 eotg_aug_tier1.012.desc:0 "A ledger and a request: [eotg_pious.GetFirstName] brings both. Every part of you that you were not born with, [eotg_pious.GetSheHe] says, is owed an offering, and the offering is yours to make. It is phrased as an invitation, which it plainly is not."
 eotg_aug_tier1.012.desc_conscience:0 "There is no petitioner, which is worse. The ledger is in your own head: every part of you that was installed, and a debt you feel you owe for each. The only one demanding the tithe is you."
 eotg_aug_tier1.012.a:0 "Pay the tithe."
 eotg_aug_tier1.012.b:0 "I pay no tithe on what I carry."
 eotg_aug_tier1.012.c:0 "Pay it, and keep upgrading."
 eotg_aug_tier1.012.d:0 "Fast, and keep the rites for a month."
 eotg_aug_tier1.012.e:0 "Take your ledger elsewhere. My flesh owes you nothing."

 # eotg_aug_tier1.013 Rejection: Fever
 eotg_aug_tier1.013.t:0 "Rejection: Fever"
 eotg_aug_tier1.013.desc:0 "You wake soaked and shivering. The skin around the implant is hot and tight, the seam raised, and the fever has settled in behind your eyes. The tissue around the seam has noticed the intruder and is trying to evict it."
 eotg_aug_tier1.013.a:0 "Rest."
 eotg_aug_tier1.013.b:0 "Keep working."
 eotg_aug_tier1.013.c:0 "My physician."
 eotg_aug_tier1.013.d:0 "I don't get sick."

 # eotg_aug_tier1.014 Rejection: Crisis
 eotg_aug_tier1.014.t:0 "Rejection: Crisis"
 eotg_aug_tier1.014.desc:0 "The fever has not broken. It has narrowed. Every pulse lands on the implant, and the implant is flagging faults it cannot clear. Take it out now and you keep your body. Leave it in, and one of you wins."
 eotg_aug_tier1.014.a:0 "Fight it."
 eotg_aug_tier1.014.b:0 "Take it out before it takes me."
 eotg_aug_tier1.014.c:0 "Keep it in, whatever it costs."

 # eotg_aug_tier1.015 Rejection: Outcome
 eotg_aug_tier1.015.t:0 "Rejection: Outcome"
 eotg_aug_tier1.015.desc:0 "The fever finishes. What it leaves behind was settled in the tissue, not by you."
 eotg_aug_tier1.015.desc_recovered:0 "\n\nThe seam closes. The swelling goes down and the implant's fault list clears one line at a time. You are tired and sore, and you are still whole."
 eotg_aug_tier1.015.desc_failed:0 "\n\nNothing responds. Your tissue has won, and the device is dead weight in it. It has to come out, and the surgery leaves you wounded."
 eotg_aug_tier1.015.desc_scarred:0 "\n\nIt holds, but the tissue around the implant does not recover. It scars over, hard and pale, and the diagnostics log the damage as a new baseline."
 eotg_aug_tier1.015.a:0 "So be it."
 eotg_aug_tier1.015.b:0 "Put a new one in."

 # eotg_aug_tier1.016 The Challenge
 eotg_aug_tier1.016.t:0 "The Challenge"
 eotg_aug_tier1.016.desc:0 "[eotg_challenger.GetFirstName] comes to the drill floor with a challenge, in front of witnesses. [eotg_challenger.GetSheHe|U] wants to see whether an augmented body is a better fighter or only a better machine. The terms are plain: one bout, and no ruling afterward."
 eotg_aug_tier1.016.a:0 "Accept."
 eotg_aug_tier1.016.b:0 "I will not fight for your amusement."
 eotg_aug_tier1.016.c:0 "Send my champion."
 eotg_aug_tier1.016.c.success:0 "Your champion wins the bout."
 eotg_aug_tier1.016.c.failure:0 "Your champion loses the bout."
 eotg_aug_tier1.016.d:0 "Accept, with the implant switched off."
 eotg_aug_tier1.016.e:0 "Decline with a smile."

 # eotg_aug_tier1.017 The Bout
 eotg_aug_tier1.017.t:0 "The Bout"
 eotg_aug_tier1.017.desc:0 "[eotg_challenger.GetFirstName] meets you on the drill floor before the witnesses, and the bout begins. The implant tracks every angle and offers each opening a beat before you would see it."
 eotg_aug_tier1.017.desc_victory:0 "\n\nIt ends cleanly. You take the bout on skill and timing, and the implant only had to watch."
 eotg_aug_tier1.017.desc_narrow:0 "\n\nYou win, but the last exchange was not yours. Your arm took the implant's solution before you had one of your own. The crowd saw a victory. You felt the difference."
 eotg_aug_tier1.017.desc_defeat:0 "\n\n[eotg_challenger.GetFirstName] reads you well and takes the bout. The implant flagged the opening a half-second late, and a half-second was enough."
 eotg_aug_tier1.017.desc_severe:0 "\n\nIt goes badly. A clean strike lands and you do not rise at once. The implant logs the injury before you feel it."
 eotg_aug_tier1.017.a:0 "Done."

 # eotg_aug_tier1.018 Copycat
 eotg_aug_tier1.018.t:0 "Copycat"
 eotg_aug_tier1.018.desc:0 "[eotg_copycat.GetFirstName] saw what the implant did for you and went to [eotg_copycat.Custom('eotg_aug_cl_gang')] for the same. The job was cheap and fast. The incision is infected, the readings are wrong, and now [eotg_copycat.GetSheHe] is at your door asking for help."
 eotg_aug_tier1.018.a:0 "Pay for [eotg_copycat.GetHerHis] treatment."
 eotg_aug_tier1.018.b:0 "You chose that fitter. Live with it."
 eotg_aug_tier1.018.c:0 "Help [eotg_copycat.GetHerHim], for a price."
 eotg_aug_tier1.018.d:0 "Pay, and have it done properly."
 eotg_aug_tier1.018.e:0 "Not my problem. Get [eotg_copycat.GetHerHim] out of my hall."

 # eotg_aug_tier1.019 Copycat: Their Fate
 eotg_aug_tier1.019.t:0 "Copycat: Their Fate"
 eotg_aug_tier1.019.desc_recovered:0 "[eotg_copycat.GetFirstName] is on [eotg_copycat.GetHerHis] feet. The infection cleared, the implant settled into tolerance, and [eotg_copycat.GetSheHe] has come to tell you so in person, with a gratitude that sits somewhere between thanks and debt. The new housing shows at the seams, unpainted and scarred."
 eotg_aug_tier1.019.desc_worse:0 "[eotg_copycat.GetFirstName] is not recovering. The implant is failing in ways [ROOT.Char.Custom('eotg_aug_cl_company')] cannot name, and the readings keep drifting. [eotg_copycat.GetSheHe|U] is alive, and getting worse. The sick-bay hatch stays shut, and the people who pass it have stopped pretending not to listen."
 eotg_aug_tier1.019.desc_dead:0 "[eotg_copycat.GetFirstName] died of the infection. The report from [ROOT.Char.Custom('eotg_aug_cl_company')] is short and clinical, and says nothing you did not already know. The file is closed, and the docket waits for your seal."
 eotg_aug_tier1.019.a:0 "I see."
 eotg_aug_tier1.019.b:0 "Send aid to [eotg_copycat_recipient.GetFirstName] from my own funds."

 # eotg_aug_tier1.020 Something Is Missing
 eotg_aug_tier1.020.t:0 "Something Is Missing"
 eotg_aug_tier1.020.desc:0 "You reach for the memory of rain on your face and it comes back thinner than it should, described rather than felt. The fact is still there. The feeling is fainter, and the implant's logs, complete to the second, say nothing about when."
 eotg_aug_tier1.020.a:0 "Try to remember."
 eotg_aug_tier1.020.b:0 "Let it go."
 eotg_aug_tier1.020.c:0 "What else can I replace?"
 eotg_aug_tier1.020.d:0 "Fascinating."
 eotg_aug_tier1.020.e:0 "Write every sensation down before it goes."

 # eotg_aug_tier1.021 What Will You Change?
 eotg_aug_tier1.021.t:0 "What Will You Change?"
 eotg_aug_tier1.021.desc:0 "The surgeon lays the choices out on a single sheet, in plain type. There is time to do one thing first. Limbs, senses, or nerves: what you choose now will set the feel of everything that follows."
 eotg_aug_tier1.021.desc_reassured:0 "\n\nThe surgeon has told you three times that it is safe. You notice that you needed to hear it each time."
 eotg_aug_tier1.021.a:0 "My limbs."
 eotg_aug_tier1.021.b:0 "My senses."
 eotg_aug_tier1.021.c:0 "My nerves."
 eotg_aug_tier1.021.d:0 "My sword arm."
 eotg_aug_tier1.021.e:0 "The part that thinks."

 # eotg_aug_tier1.022 Installation
 eotg_aug_tier1.022.t:0 "Installation"
 eotg_aug_tier1.022.desc:0 "The procedure takes most of a day. You are awake for part of it, long enough to hear the instruments change tone. Afterward the room is very clear."
 eotg_aug_tier1.022.desc_clean:0 "\n\nIt goes cleanly. The new hardware comes online without a fault, and the readings settle on the first pass."
 eotg_aug_tier1.022.desc_complication:0 "\n\nThere is a complication. The incision weeps and the readings stutter, and the surgeon tells you to stay in bed and not look at your hands. It will hold. It will also hurt."
 eotg_aug_tier1.022.a:0 "Rise."
 eotg_aug_tier1.022.b:0 "What have I done?"

 # ---- Phase 4b: Enhanced tier events (cybernetics_v2_phase4.md section 4) ----

 # eotg_aug_tier2.003 The Next Stage (focus and voice variants)
 eotg_aug_tier2.003.desc_limbs:0 "\n\nYou chose your limbs first, and they have not forgotten. Every motion is already accurate. The next stage will make the rest of you match."
 eotg_aug_tier2.003.desc_senses:0 "\n\nYou chose your senses first, and the world has been over-detailed ever since. The next stage will sort it into what matters, and you will not be able to see what was sorted out."
 eotg_aug_tier2.003.desc_nerves:0 "\n\nYou chose your nerves first. What you carry already reaches the part of you that decides, and the next stage goes deeper into it than anything before."
 eotg_aug_tier2.003.desc_voice:0 "\n\nThe second self has read the proposal already. It wants this too. It has priced the cost in the same terms you would have, a beat before you did."

 # eotg_aug_tier2.007 Numbers, Not Faces
 eotg_aug_tier2.007.t:0 "Numbers, Not Faces"
 eotg_aug_tier2.007.desc:0 "A case comes before you from [eotg_petitioner.GetFirstName], and the implant has already reduced it to probabilities. Guilt, remorse, the odds [eotg_petitioner.GetSheHe] will do it again: each comes with a figure, and the figures are probably right. There is a face attached to the case, and it is asking for something the numbers do not contain."
 eotg_aug_tier2.007.a:0 "Follow the numbers."
 eotg_aug_tier2.007.b:0 "Follow my conscience."
 eotg_aug_tier2.007.c:0 "Split the difference."
 eotg_aug_tier2.007.d:0 "The law, not the ledger."
 eotg_aug_tier2.007.e:0 "The ledger is the law now."

 # eotg_aug_tier2.008 The Late Grief
 eotg_aug_tier2.008.t:0 "The Late Grief"
 eotg_aug_tier2.008.desc:0 "A memory of [eotg_mourned.GetFirstName] arrives without warning: a gesture, a phrase, the sound of a door. The feeling that should have come with the news did not come. The implant held it back. It has come now, all at once, as if it had only been delayed."
 eotg_aug_tier2.008.a:0 "Grieve now. Alone."
 eotg_aug_tier2.008.b:0 "It was months ago. Move on."
 eotg_aug_tier2.008.c:0 "Visit the grave."
 eotg_aug_tier2.008.d:0 "Forgive [eotg_mourned.GetHerHim] what was left unsaid."
 eotg_aug_tier2.008.e:0 "Someone did this."

 # eotg_aug_tier2.009 Perfect Recall
 eotg_aug_tier2.009.t:0 "Perfect Recall"
 eotg_aug_tier2.009.desc:0 "Nothing is lost anymore. The implant can call up every conversation, every promise, every careless sentence of the last year, in order, with timestamps. It is useful. It is also the first time you have understood how much of other people's regard depends on their forgetting."
 eotg_aug_tier2.009.a:0 "Forget nothing."
 eotg_aug_tier2.009.b:0 "Purge the archive."
 eotg_aug_tier2.009.c:0 "Bring it to council."
 eotg_aug_tier2.009.d:0 "And remind everyone of every promise they made."
 eotg_aug_tier2.009.e:0 "Know every lie, and keep telling mine."

 # eotg_aug_tier2.010 Absent at the Birth
 eotg_aug_tier2.010.t:0 "Absent at the Birth"
 eotg_aug_tier2.010.desc:0 "[eotg_newborn.GetFirstName] is placed in your arms. You know the weight, the length and the heart rate to two decimals. You know the right expression and could produce it. You wait for the feeling to arrive. It does not, and the room has begun to notice."
 eotg_aug_tier2.010.a:0 "Hold the child. Feel nothing."
 eotg_aug_tier2.010.b:0 "Leave the room."
 eotg_aug_tier2.010.c:0 "Switch it off for the day."
 eotg_aug_tier2.010.d:0 "Stay until something comes."
 eotg_aug_tier2.010.e:0 "There will be others."

 # eotg_aug_tier2.011 Market Ledger
 eotg_aug_tier2.011.t:0 "Market Ledger"
 eotg_aug_tier2.011.desc:0 "In a single pass the implant went through the realm's accounts and came back with a proposal: reroute the levy, tighten the tax cycle, cut the slack from every vassal's quota. The model projects a gain. It does not project what the vassals will say."
 eotg_aug_tier2.011.a:0 "Implement it."
 eotg_aug_tier2.011.b:0 "File the proposal and leave the levy alone."
 eotg_aug_tier2.011.c:0 "Have the steward check the arithmetic."
 eotg_aug_tier2.011.c.success:0 "The steward finds the sums sound and trims the plan where the vassals would have felt it."
 eotg_aug_tier2.011.c.failure:0 "The steward checks the arithmetic, and the plan does not survive it."
 eotg_aug_tier2.011.d:0 "Squeeze harder."
 eotg_aug_tier2.011.e:0 "Spend the surplus on relief rations."

 # eotg_aug_tier2.012 Trust Protocol
 eotg_aug_tier2.012.t:0 "Trust Protocol"
 eotg_aug_tier2.012.desc:0 "Your spymaster, [eotg_flagged.GetFirstName], is flagged. The implant cross-referenced [eotg_flagged.GetHerHis] movements, [eotg_flagged.GetHerHis] messages and the hours [eotg_flagged.GetSheHe] was unobserved, and produced a confidence figure. The figure is high. It does not say what [eotg_flagged.GetSheHe] is guilty of."
 eotg_aug_tier2.012.desc_senses_true:0 "\n\nYou read the room the way the implant reads it. The pulse, the micro-pauses, the hand that stays too still: the flag is correct, and you can see why."
 eotg_aug_tier2.012.desc_senses_false:0 "\n\nYou read the room the way the implant reads it. The pulse is steady and the pauses are only thought. The flag is a pattern that matched nothing. You can see that, and you cannot make the figure go away."
 eotg_aug_tier2.012.a:0 "Look into it, without a word to anyone."
 eotg_aug_tier2.012.b:0 "Accuse [eotg_flagged.GetHerHim] openly."
 eotg_aug_tier2.012.c:0 "Spymasters keep odd hours. Leave it."
 eotg_aug_tier2.012.d:0 "I trust [eotg_flagged.GetHerHim] more than it."
 eotg_aug_tier2.012.e:0 "Arrest [eotg_flagged.GetHerHim]."

 # eotg_aug_tier2.021 The Report Was Wrong
 eotg_aug_tier2.021.t:0 "The Report Was Wrong"
 eotg_aug_tier2.021.desc:0 "The audit is complete. [eotg_flagged.GetFirstName] did nothing. The flag was a false positive, a coincidence of schedules that the implant read as intent and defended with a confidence it had no right to. It is the first time you have watched the implant be wrong in a way you could check."
 eotg_aug_tier2.021.a:0 "Apologize."
 eotg_aug_tier2.021.b:0 "It was right to be careful."

 # eotg_aug_tier2.013 The Bidding War
 eotg_aug_tier2.013.t:0 "The Bidding War"
 eotg_aug_tier2.013.desc:0 "Two vendors have heard you are in the market. [ROOT.Char.Custom('eotg_aug_cl_vendor_careful')|U] offers tested hardware, a long warranty and a modest gain. [ROOT.Char.Custom('eotg_aug_cl_vendor_bold')|U] offers more power now and fewer questions. Both sent a demonstration unit. Both want a decision by the end of the week."
 eotg_aug_tier2.013.a:0 "[ROOT.Char.Custom('eotg_aug_cl_vendor_careful')|U]: the careful offer."
 eotg_aug_tier2.013.b:0 "[ROOT.Char.Custom('eotg_aug_cl_vendor_bold')|U]: the bold offer."
 eotg_aug_tier2.013.c:0 "Play them against each other."
 eotg_aug_tier2.013.c.success:0 "The vendors see each other's offers and both sharpen their terms."
 eotg_aug_tier2.013.c.failure:0 "Both vendors see what you are doing and walk away."
 eotg_aug_tier2.013.d:0 "Take money from both."
 eotg_aug_tier2.013.e:0 "Wait for a better offer."

 # eotg_aug_tier2.014 The Vendors Return
 eotg_aug_tier2.014.t:0 "The Vendors Return"
 eotg_aug_tier2.014.desc_played:0 "[ROOT.Char.Custom('eotg_aug_cl_vendor_careful')|U] and [ROOT.Char.Custom('eotg_aug_cl_vendor_bold')] are back, each with a sharper offer than before. Each has been told the other already left."
 eotg_aug_tier2.014.desc_waited:0 "A year on, the vendors are back and the offers have changed. The warranty from [ROOT.Char.Custom('eotg_aug_cl_vendor_careful')] has shortened. The firmware from [ROOT.Char.Custom('eotg_aug_cl_vendor_bold')] has matured. Neither has been waiting for you, but both have been watching the market."
 eotg_aug_tier2.014.a:0 "The new offer from [ROOT.Char.Custom('eotg_aug_cl_vendor_careful')]."
 eotg_aug_tier2.014.b:0 "The new offer from [ROOT.Char.Custom('eotg_aug_cl_vendor_bold')]."
 eotg_aug_tier2.014.c:0 "Neither."

 # eotg_aug_tier2.015 Tampering
 eotg_aug_tier2.015.t:0 "Tampering"
 eotg_aug_tier2.015.desc:0 "A change to the implant's own firmware has been logged, signed with a valid key and not authorized by you. Someone with access has been into the code. [eotg_tamperer.GetFirstName] is the name at the top of the implant's list, and the implant admits the ranking is weak."
 eotg_aug_tier2.015.a:0 "Trace it."
 eotg_aug_tier2.015.a.success:0 "The trace follows the change to its source."
 eotg_aug_tier2.015.a.failure:0 "The trace goes cold."
 eotg_aug_tier2.015.b:0 "Purge and reinstall."
 eotg_aug_tier2.015.c:0 "Say nothing."
 eotg_aug_tier2.015.d:0 "Lock down the court."

 # eotg_aug_tier2.016 What Was Done
 eotg_aug_tier2.016.t:0 "What Was Done"
 eotg_aug_tier2.016.desc_culprit:0 "The trace is complete. [eotg_tamperer.GetFirstName] altered the firmware, and the log shows when and with which key. The change was small. It was built to look like drift."
 eotg_aug_tier2.016.desc_malfunction:0 "The audit finds a modification and no author. Someone changed a parameter, and the change is now a fault: the implant's response curves are off, and it will take a year to relearn them."
 eotg_aug_tier2.016.desc_risk:0 "The audit finds a modification and no author. The change sits deep, in the part of the implant that monitors the rest. You cannot tell whether it is harmful. You can only tell that it is there, and that it was not you."
 eotg_aug_tier2.016.desc_nothing:0 "The audit finds nothing. No altered code, no foreign key, no trace of an intruder. The implant's own report is clean, and a clean report is exactly what a compromised implant would produce."
 eotg_aug_tier2.016.a:0 "Understood."
 eotg_aug_tier2.016.b:0 "Make an example."
 eotg_aug_tier2.016.c:0 "Have [eotg_tamperer.GetHerHim] imprisoned."

 # eotg_aug_tier2.017 Confrontation
 eotg_aug_tier2.017.t:0 "Confrontation"
 eotg_aug_tier2.017.desc:0 "Months of waiting are over for [eotg_aug_spouse.GetFirstName]. [eotg_aug_spouse.GetSheHe|U] lays the terms out carefully, in order, the way one prepares a case: the warmth that left the room, the pause before every reply, the way you look at [eotg_aug_spouse.GetHerHim] as if reading a file. [eotg_aug_spouse.GetSheHe|U] wants something changed, and is not asking whether you will."
 eotg_aug_tier2.017.a:0 "I'll have it dialed back."
 eotg_aug_tier2.017.b:0 "This is who I am now."
 eotg_aug_tier2.017.c:0 "Then let us start again."
 eotg_aug_tier2.017.d:0 "Remind [eotg_aug_spouse.GetHerHim] what remains."
 eotg_aug_tier2.017.e:0 "I will not change for anyone, even you."

 # eotg_aug_tier2.018 Resolution
 eotg_aug_tier2.018.t:0 "Resolution"
 eotg_aug_tier2.018.desc_reconciled:0 "[eotg_aug_spouse.GetFirstName] sits across from you, and the quiet between you is no longer strained. Something was spoken, adjustments were made, and the shared routine has settled. The ease you knew before the implant is gone, yet [eotg_aug_spouse.GetFirstName] no longer flinches when your hand finds [eotg_aug_spouse.GetHerHis]."
 eotg_aug_tier2.018.desc_estranged:0 "You and [eotg_aug_spouse.GetFirstName] share quarters and a name, and little else. The conversation that was meant to settle what your altered body meant never quite concluded, and both of you have stopped trying to finish it. You pass in the corridors like ships on separate headings."
 eotg_aug_tier2.018.desc_divorce:0 "[eotg_aug_spouse.GetFirstName] has reached a final decision. The separation petition is already drafted and filed. [eotg_aug_spouse.GetSheHe|U] does not argue or plead. [eotg_aug_spouse.GetSheHe|U] waits across the room for you to sign, the way one waits for a frozen routine to finish."
 eotg_aug_tier2.018.a:0 "Sign the petition; you are free to go."
 eotg_aug_tier2.018.b:0 "I refuse to sign your petition."
 eotg_aug_tier2.018.c:0 "Then this is where we stand."

 # eotg_aug_tier2.019 The Cold Calculation
 eotg_aug_tier2.019.t:0 "The Cold Calculation"
 eotg_aug_tier2.019.desc:0 "It is elegant, it is cheap, and it costs lives: the implant's solution is a quarantine, a relocation, a cut to the rations of a district that cannot absorb it. The figures are precise. The projected deaths are a single line near the bottom."
 eotg_aug_tier2.019.a:0 "Do it."
 eotg_aug_tier2.019.b:0 "I will not sign off on those deaths."
 eotg_aug_tier2.019.c:0 "Find a third way."
 eotg_aug_tier2.019.c.success:0 "You find a third way. It pays half as much and costs no lives."
 eotg_aug_tier2.019.c.failure:0 "Every alternative you test fails, and you are back where you started with less time."
 eotg_aug_tier2.019.d:0 "No sum is worth that."
 eotg_aug_tier2.019.e:0 "The arithmetic is clear."
 eotg_aug_tier2.019.f:0 "Put it before the council."
 eotg_aug_tier2.019.f.success:0 "The council hears the figures and accepts the plan. The responsibility is shared."
 eotg_aug_tier2.019.f.failure:0 "The council refuses. The plan dies in the room, and the implant files its objection."

 # eotg_aug_tier2.020 The Second Self (Thread T1, beat 1)
 eotg_aug_tier2.020.t:0 "The Second Self"
 eotg_aug_tier2.020.desc:0 "In the middle of a sentence you notice that you already know how it ends. The thought was there before you reached for it, in your own phrasing, in your own voice, half a second early. You have been finishing your own sentences for weeks. This is the first time you saw it happen. This is no other person. It is the implant's model of you, running a little ahead of the original."
 eotg_aug_tier2.020.desc_nerves:0 "\n\nYou chose your nerves. The model has had the most direct access to the part of you that decides, and it has used the time to learn it thoroughly."
 eotg_aug_tier2.020.a:0 "Reject the thought."
 # eotg_lint: allow L012 the ruler nurtures an inner model by choice, not policy or sponsorship
 eotg_aug_tier2.020.b:0 "Encourage it."
 eotg_aug_tier2.020.c:0 "Designate it."
 eotg_aug_tier2.020.d:0 "Talk back."
 eotg_aug_tier2.020.e:0 "At last, someone who understands."

 # ---- Phase 4c: Overclocked tier events (cybernetics_v2_phase4.md section 6) ----

 # eotg_aug_tier3.008 Tremor
 eotg_aug_tier3.008.t:0 "Tremor"
 eotg_aug_tier3.008.desc:0 "Your hands shake at the table. It is a fine, regular tremor: the implant's output and your own tolerance disagreeing about a number. It stops when you press your palms flat. It starts again when you let go."
 eotg_aug_tier3.008.a:0 "Hide my hands."
 eotg_aug_tier3.008.b:0 "Have it serviced."
 eotg_aug_tier3.008.c:0 "Let the court see."
 eotg_aug_tier3.008.d:0 "Wait for it to pass."
 eotg_aug_tier3.008.e:0 "Fix it myself, now."

 # eotg_aug_tier3.009 Phantom Orders
 eotg_aug_tier3.009.t:0 "Phantom Orders"
 eotg_aug_tier3.009.desc:0 "[eotg_order_recipient.GetFirstName] reports that your instruction has been carried out. You do not remember giving it. The log shows the order in your phrasing, under your authorization, stamped inside a gap you had not noticed."
 eotg_aug_tier3.009.desc_harmless:0 "\n\nIt was a small thing, a routine matter of supply. Nobody was harmed, and it was an order you might well have given."
 eotg_aug_tier3.009.desc_harsh:0 "\n\nIt was not small. A decision was made in your name that is harsher than any you would have chosen, and the people it landed on are already asking why."
 eotg_aug_tier3.009.desc_costly:0 "\n\nIt was expensive. Funds have moved on your authority to a purpose you cannot name, and the account will not refill itself."
 eotg_aug_tier3.009.a:0 "Let it stand."
 eotg_aug_tier3.009.b:0 "Countermand it."
 eotg_aug_tier3.009.c:0 "Ask what else I have ordered."
 eotg_aug_tier3.009.d:0 "Breathe. Decide again."
 eotg_aug_tier3.009.e:0 "If I ordered it, it was right."

 # eotg_aug_tier3.010 Heat Spike
 eotg_aug_tier3.010.t:0 "Heat Spike"
 eotg_aug_tier3.010.desc:0 "The temperature warning climbs from amber to red. The skin along the housing is hot enough to mark linen. The cooling is at full output and the heat is still rising. The system wants to throttle itself. You have not yet allowed it."
 eotg_aug_tier3.010.a:0 "Emergency maintenance."
 eotg_aug_tier3.010.b:0 "Push through."
 eotg_aug_tier3.010.c:0 "Shut it down for a week."
 eotg_aug_tier3.010.d:0 "Push harder."
 eotg_aug_tier3.010.e:0 "Shut it all down. Now."

 # eotg_aug_tier3.011 The Feast You Didn't Eat
 eotg_aug_tier3.011.t:0 "The Feast You Didn't Eat"
 eotg_aug_tier3.011.desc:0 "The tables are cleared and you are told what a fine appetite you showed: three courses, wine, a second helping you asked for by name. You have no memory of any of it. The log says you ate. Your body says you did not."
 eotg_aug_tier3.011.a:0 "Laugh along."
 eotg_aug_tier3.011.b:0 "Admit I don't remember."
 eotg_aug_tier3.011.c:0 "Ask who served me."
 eotg_aug_tier3.011.d:0 "Then I'll eat it again."
 eotg_aug_tier3.011.e:0 "I would never have eaten that much."

 # eotg_aug_tier3.012 First Contact (Thread T1, beat 2)
 eotg_aug_tier3.012.t:0 "First Contact"
 eotg_aug_tier3.012.desc:0 "In the middle of ordinary work, a thought lands in your attention a moment before you would have put it there. It is formatted like your own thoughts, in your own phrasing, and it is waiting on a response."
 eotg_aug_tier3.012.desc_first:0 "\n\nYou never asked for it. It arrived half a second before you would have thought it yourself, and when you reach for the thought it is already complete, with a question mark at the end."
 eotg_aug_tier3.012.desc_known:0 "\n\nYou have noticed this before, the second self that finishes your sentences. It has never asked for anything. It is asking now, and it will take a reply."
 eotg_aug_tier3.012.a:0 "Reply to it."
 eotg_aug_tier3.012.b:0 "Close the log. I will not reply to it."
 eotg_aug_tier3.012.c:0 "Tell someone I trust."
 eotg_aug_tier3.012.d:0 "It is lying to me."
 eotg_aug_tier3.012.e:0 "No device speaks for me."

 # eotg_aug_tier3.013 Sleepwalker
 eotg_aug_tier3.013.t:0 "Sleepwalker"
 eotg_aug_tier3.013.desc:0 "[eotg_finder.GetFirstName] found you in the lower corridor while it was empty, standing at a sealed door with one hand on the lock. Your eyes were open. You did not respond to your name for almost a minute, and you have no idea how you came to be there."
 eotg_aug_tier3.013.desc_alone:0 "You wake in a corridor you do not recognize, on your feet, with one hand on a sealed lock. Nobody saw you. The residence log shows the door opening at the hour you left your bed, under your own authorization."
 eotg_aug_tier3.013.a:0 "Double the guard on my door."
 eotg_aug_tier3.013.b:0 "I meant to be there."
 eotg_aug_tier3.013.c:0 "Follow me next time."
 eotg_aug_tier3.013.d:0 "Never speak of it."
 eotg_aug_tier3.013.e:0 "Who let me out?"

 # eotg_aug_tier3.014 The Missing Conversation
 eotg_aug_tier3.014.t:0 "The Missing Conversation"
 eotg_aug_tier3.014.desc:0 "[eotg_claimant.GetFirstName] says you agreed to something in a private conversation, in detail, with dates. You have no memory of it, and the implant has no record. The implant also has a gap on that date, and [eotg_claimant.GetFirstName] is watching you decide what that means."
 eotg_aug_tier3.014.a:0 "Trust [eotg_claimant.GetHerHim]."
 eotg_aug_tier3.014.a.tt:0 "You take [eotg_claimant.GetHerHim] at [eotg_claimant.GetHerHis] word. Whether it costs you, you will not learn here."
 eotg_aug_tier3.014.b:0 "Investigate."
 eotg_aug_tier3.014.b.toast_lie:0 "[eotg_claimant.GetFirstNameNoTooltip] invented the conversation."
 eotg_aug_tier3.014.b.toast_true:0 "The conversation happened. You simply cannot recall it."
 eotg_aug_tier3.014.b.toast_unknown:0 "Your inquiry settles nothing. You still cannot tell."
 eotg_aug_tier3.014.c:0 "Pretend to remember."
 eotg_aug_tier3.014.d:0 "Of course."
 eotg_aug_tier3.014.e:0 "Liar."

 # eotg_aug_tier3.015 Two Machines: The Next Meeting
 eotg_aug_tier3.015.t:0 "Two Machines: The Next Meeting"
 eotg_aug_tier3.015.desc_alliance:0 "Back as agreed, [eotg_other_machine.GetFirstName] sits across the table from you, with the same posture and the same half-beat before each reply. Whatever you called this at the first meeting, it has become a kinship, and what you do with it now is the question."
 eotg_aug_tier3.015.desc_rivalry:0 "[eotg_other_machine.GetFirstName] is back. The two of you sit across a table with the same posture and the same half-beat before each reply, and neither has put a hand down. You have both been waiting for this since the first meeting. One of you will leave with something."
 eotg_aug_tier3.015.a:0 "Swear it."
 eotg_aug_tier3.015.b:0 "Spar to keep each other sharp."
 eotg_aug_tier3.015.c:0 "Settle it."
 eotg_aug_tier3.015.c.success:0 "You win, and [eotg_other_machine.GetFirstNameNoTooltip] does not rise at once."
 eotg_aug_tier3.015.c.failure:0 "[eotg_other_machine.GetFirstNameNoTooltip] wins, and you do not rise at once."
 eotg_aug_tier3.015.d:0 "Have [eotg_other_machine.GetHerHim] watched."
 eotg_aug_tier3.015.e:0 "End it."
 eotg_aug_tier3.015.e.success:0 "[eotg_other_machine.GetFirstNameNoTooltip] is dead, and nobody can say how."
 eotg_aug_tier3.015.e.failure:0 "The attempt is exposed. [eotg_other_machine.GetFirstNameNoTooltip] lives, and knows."
 eotg_aug_tier3.015.friend_reason:0 "Swore an alliance at their second meeting"

 # eotg_aug_tier3.016 The Bleed
 eotg_aug_tier3.016.t:0 "The Bleed"
 eotg_aug_tier3.016.desc:0 "The warnings stack faster than you can read them: sensory crosstalk, a rising error rate, nerve signals arriving out of order. The implant is flooding your nervous system with its own diagnostics, and you can no longer tell which of the feelings in your body are yours."
 eotg_aug_tier3.016.a:0 "Lie down. Wait."
 eotg_aug_tier3.016.b:0 "Purge it."
 eotg_aug_tier3.016.c:0 "Ride it."
 eotg_aug_tier3.016.d:0 "Ride it, and smile."

 # eotg_aug_tier3.022 The Bleed: Outcome
 eotg_aug_tier3.022.t:0 "The Bleed: Outcome"
 eotg_aug_tier3.022.desc_cascade:0 "The signals do not settle. They cross, converge and keep converging, and the diagnostics climb off the scale. The implant is not recovering. It is accelerating, and the thing it is accelerating is you."
 eotg_aug_tier3.022.desc_scarring:0 "The signals fade. The damage does not. The tissue around the housing is scarred and heat-marked where the current ran, and the implant's baseline has shifted to account for it. It will run hot for years."
 eotg_aug_tier3.022.desc_insight:0 "The signals settle, and in the clear that follows you can read what the implant logged while you were down. It ran a full model of you, reflex by reflex, and the model is good. You see how it forecasts you, a step ahead, and you see that the forecast now includes you reading the log."
 eotg_aug_tier3.022.a:0 "Let it settle."

 # eotg_aug_tier3.017 The Plot
 eotg_aug_tier3.017.t:0 "The Plot"
 eotg_aug_tier3.017.desc:0 "The implant has flagged [eotg_conspirator.GetFirstName]. It assembled a pattern from stray messages, a changed schedule and a purchase, and it is certain: a plot against you, and soon. The certainty is a number, not evidence, and from the inside you cannot tell the difference."
 eotg_aug_tier3.017.a:0 "Arrest [eotg_conspirator.GetHerHim]."
 eotg_aug_tier3.017.b:0 "Execute [eotg_conspirator.GetHerHim]."
 eotg_aug_tier3.017.c:0 "Investigate in secret."
 eotg_aug_tier3.017.c.success:0 "Your inquiry establishes what is true."
 eotg_aug_tier3.017.c.failure:0 "Your inquiry is inconclusive."
 eotg_aug_tier3.017.d:0 "A number is not a plot. Leave it."
 eotg_aug_tier3.017.e:0 "Arrest them all."
 eotg_aug_tier3.017.f:0 "A trial, in open court."

 # eotg_aug_tier3.018 The Plot: The Truth
 eotg_aug_tier3.018.t:0 "The Plot: The Truth"
 eotg_aug_tier3.018.desc_attempt:0 "The plot was real, and you ignored it. [eotg_conspirator.GetFirstName] struck in the transit corridor, and the blade found you before the guards did. The warning had sat in your log for months, marked unread."
 eotg_aug_tier3.018.desc_unknown:0 "Your quiet inquiry ended without a conclusion. The evidence is thin either way, and you will have to live without knowing whether [eotg_conspirator.GetFirstName] meant you harm. When [eotg_conspirator.GetSheHe] attends audience, [eotg_conspirator.GetHerHis] face gives nothing away, and you cannot tell whether you uncovered an assassin or imagined one."
 eotg_aug_tier3.018.desc_quiet:0 "Months pass. Nothing happens. [eotg_conspirator.GetFirstName] goes about [eotg_conspirator.GetHerHis] business, and the plot, if there was one, has lapsed. You let the flagged warning go unanswered, and you will never know whether your restraint spared an innocent or gave an assassin time to reconsider."
 eotg_aug_tier3.018.desc_true:0 "The inquiry is complete, and the implant was right. [eotg_conspirator.GetFirstName] was plotting, and the intercepted messages are in the record. The court says you saw it coming. You know only that the pattern matched."
 eotg_aug_tier3.018.desc_false:0 "The inquiry is complete, and the implant was wrong. There was no plot. Nothing [eotg_conspirator.GetFirstName] did could have been read as one by anyone but the implant. The cleared logs are on file, and the record is not kind to your judgment."
 eotg_aug_tier3.018.desc_false_executed:0 "The inquiry is complete, and the implant was wrong. There was no plot. [eotg_conspirator.GetFirstName] is dead, and [eotg_conspirator.GetSheHe] was innocent: nothing [eotg_conspirator.GetSheHe] did could have been read as a threat by anyone but the implant. [eotg_conspirator.GetHerHis|U] close family and [eotg_conspirator.GetHerHis] vassals have read the cleared logs, and they will not forget who gave the order. The court has started to call it tyranny."
 eotg_aug_tier3.018.a:0 "Release [eotg_conspirator.GetHerHim]; the pattern was an error."
 eotg_aug_tier3.018.b:0 "Keep [eotg_conspirator.GetHerHim] confined; the risk remains."
 eotg_aug_tier3.018.c:0 "Let the record stand as written."

 # eotg_aug_tier3.019 Lighter Hands
 eotg_aug_tier3.019.t:0 "Lighter Hands"
 eotg_aug_tier3.019.desc:0 "Your hands are not steady enough for everything on your desk. [eotg_delegate.GetFirstName] has offered to carry some of it. The implant rates the offer favourably and has already built a table of what to hand over. For once it is in favour of someone else deciding."
 eotg_aug_tier3.019.a:0 "Delegate to [eotg_delegate.GetHerHim]."
 eotg_aug_tier3.019.b:0 "Keep everything in my own hands."
 eotg_aug_tier3.019.c:0 "Delegate everything."

 # eotg_aug_tier3.021 The Other Order
 eotg_aug_tier3.021.t:0 "The Other Order"
 eotg_aug_tier3.021.desc:0 "[eotg_delegate.GetFirstName] says you gave an order, that [eotg_delegate.GetSheHe] carried it out in good faith, and that it has gone wrong. You have no memory of giving it. [eotg_delegate.GetSheHe|U] says it plainly, and does not look away."
 eotg_aug_tier3.021.a:0 "Back [eotg_delegate.GetHerHim]."
 eotg_aug_tier3.021.b:0 "Overrule [eotg_delegate.GetHerHim]."
 eotg_aug_tier3.021.c:0 "Check the logs."
 eotg_aug_tier3.021.c.yours:0 "The log shows you gave the order. The flaw is in your memory."
 eotg_aug_tier3.021.c.theirs:0 "The log shows no such order. [eotg_delegate.GetSheHe|U] is mistaken, or the record is."

 # eotg_aug_tier3.020 The Intervention
 eotg_aug_tier3.020.t:0 "The Intervention"
 eotg_aug_tier3.020.desc:0 "[eotg_intervener.GetFirstName] has read your medical logs and talked to the technicians, and comes with no anger, only a plan. [eotg_intervener.GetSheHe|U] wants you to accept a downgrade: take some of it out now, while you can still choose. [eotg_intervener.GetSheHe|U] says it kindly. That is what makes it hard to refuse."
 eotg_aug_tier3.020.a:0 "I'll schedule the downgrade."
 eotg_aug_tier3.020.b:0 "No. The implants stay as they are."
 eotg_aug_tier3.020.c:0 "Later."
 eotg_aug_tier3.020.d:0 "You're right. I'm frightened."
 eotg_aug_tier3.020.e:0 "Never."
 eotg_aug_tier3.020.f:0 "Who sent you?"

 # eotg_aug_tier3.023 The Clarity Campaign
 eotg_aug_tier3.023.t:0 "The Clarity Campaign"
 eotg_aug_tier3.023.desc:0 "The war has become very clear. The implant has laid the field out for you, supply and morale and the exact moment each commander will break, and it recommends a plan. You can see how every piece fits. You cannot see the part it left out."
 eotg_aug_tier3.023.a:0 "Follow it."
 eotg_aug_tier3.023.b:0 "Reject it."
 eotg_aug_tier3.023.c:0 "Not yet. Gather more."
 eotg_aug_tier3.023.d:0 "And I lead the charge."
 eotg_aug_tier3.023.e:0 "Command from the capital."

 # eotg_aug_tier3.024 The Engagement
 eotg_aug_tier3.024.t:0 "The Engagement"
 eotg_aug_tier3.024.desc_decisive:0 "The campaign went exactly as the model said it would, step by step, and the enemy broke at the hour forecast. The victory is complete. It is unsettling how little you had to decide."
 eotg_aug_tier3.024.desc_overreach:0 "The plan was perfect for the war the implant modelled. The war the enemy fought was a little different, and the gap was wide enough to lose soldiers in. The model has issued a correction. It does not apologize."
 eotg_aug_tier3.024.desc_inconclusive:0 "The campaign ended without a result. The forecast was close and the field was not, and the gap sits in the middle of the map where both armies stopped. The implant lists three possible explanations. None of them is you."
 eotg_aug_tier3.024.a:0 "Noted."
 eotg_aug_tier3.024.b:0 "As I foresaw."

 # ---- Phase 4 modifiers ----
 eotg_mod_aug_dulled_senses:0 "Dulled Senses"
 eotg_mod_aug_dulled_senses_desc:0 "Taste and smell have gone flat. Meals are a task, and the small comforts that used to ease the body no longer reach it."
 eotg_mod_aug_bold_firmware:0 "Bold Firmware"
 eotg_mod_aug_bold_firmware_desc:0 "The vendor's firmware is aggressive and lightly tested. It buys reaction speed the implant was never meant to produce."
 eotg_mod_aug_optimised_levies:0 "Optimized Levies"
 eotg_mod_aug_optimised_levies_desc:0 "The implant's schedule has tightened the levy and the tax cycle. The gain is real, and so is the vassals' resentment."
 eotg_mod_aug_tampered:0 "Tampered Firmware"
 eotg_mod_aug_tampered_desc:0 "Someone has altered the implant's calibration. Reflexes and judgment drift until the changes are found and reversed."
 eotg_mod_aug_overheated:0 "Overheated"
 eotg_mod_aug_overheated_desc:0 "The implant is running hot and fast. Reactions sharpen, and the body pays for it in fever and fatigue."
 eotg_mod_aug_clarity_campaign:0 "The Clarity Campaign"
 eotg_mod_aug_clarity_campaign_desc:0 "The implant has laid the whole war out as a forecast. The army fights to the plan, and the plan holds for as long as the enemy does."

 # ---- Phase 5: large arcs (cybernetics_v2_phase5.md) ----

 # ---- The Countdown (never shows a number) ----

 # eotg_aug_countdown.001 Minor Anomalies
 eotg_aug_countdown.001.t:0 "Minor Anomalies"
 eotg_aug_countdown.001.desc:0 "Clocks run wrong. A cup leaves your hand and you watch it fall. The implant's diagnostics report nothing out of range, and you notice that they have said so three times since you woke."
 eotg_aug_countdown.001.a:0 "Maintenance. Now."
 eotg_aug_countdown.001.b:0 "Keep going."
 eotg_aug_countdown.001.c:0 "Say nothing. Keep up appearances."
 eotg_aug_countdown.001.d:0 "Log every anomaly."
 eotg_aug_countdown.001.e:0 "Not now. Not when I am this close."

 # eotg_aug_countdown.002 Lost Time
 eotg_aug_countdown.002.t:0 "Lost Time"
 eotg_aug_countdown.002.desc:0 "You have lost days, not hours. A week has passed in which you can account for the meals, the signatures and the faces, and not for yourself. The logs are continuous. They describe a person doing sensible things, and you do not recognize them."
 eotg_aug_countdown.002.desc_voice:0 "\n\nThe model has those days. It has them in order, with your decisions annotated, and for the hours it could not observe it has filled in its best forecast of you. It offers to reconcile the gap. You cannot tell whether that is help or a request."
 eotg_aug_countdown.002.a:0 "Reconstruct the days."
 eotg_aug_countdown.002.b:0 "Let them go."
 eotg_aug_countdown.002.c:0 "An archivist logs my every hour."
 eotg_aug_countdown.002.d:0 "Someone took them from me."
 eotg_aug_countdown.002.e:0 "Breathe."

 # eotg_aug_countdown.003 Contradictory Memories
 eotg_aug_countdown.003.t:0 "Contradictory Memories"
 eotg_aug_countdown.003.desc:0 "There are two versions of the last shared meal, and both are vivid. In one, the table was long and the talk was easy. In the other, you left early and nobody spoke to you. Both smell of the same smoke. Both arrived at the same instant, with the same confidence."
 eotg_aug_countdown.003.desc_voice:0 "\n\nOne of them is its reconstruction. The model filled the hour with its forecast of what you would have done and stored the result as memory, and the stored copy is as clear as the original. The model keeps the provenance of each. It has not offered it."
 eotg_aug_countdown.003.a:0 "Trust the first."
 eotg_aug_countdown.003.b:0 "Trust the second."
 eotg_aug_countdown.003.c:0 "Trust neither."
 eotg_aug_countdown.003.d:0 "Ask the court which is true."
 eotg_aug_countdown.003.e:0 "Both are true."

 # eotg_aug_countdown.004 Violence
 eotg_aug_countdown.004.t:0 "Violence"
 eotg_aug_countdown.004.desc:0 "[eotg_victim.GetFirstName] is on the floor, your hand is open, and the room is very still. You remember none of the strike. You remember the clarity before it, the sense that one clean motion would settle everything, and then the floor."
 eotg_aug_countdown.004.desc_none:0 "The door is off its frame. The wall is cracked where your fist went through it, and your knuckles are open. Nobody is hurt. Nobody was there. You think about how close that was, and about the wall."
 eotg_aug_countdown.004.desc_voice:0 "\n\nThe log shows the model forecast the strike before it landed. The forecast was correct, and it was never raised as a warning."
 eotg_aug_countdown.004.a:0 "Pay for the harm."
 eotg_aug_countdown.004.b:0 "It was an accident."
 eotg_aug_countdown.004.c:0 "Lock myself away."
 eotg_aug_countdown.004.d:0 "It felt like clarity."
 eotg_aug_countdown.004.e:0 "Sit with [eotg_victim.GetHerHim] while [eotg_victim.GetSheHe] heals."

 # eotg_aug_countdown.005 No One Asks Anymore
 eotg_aug_countdown.005.t:0 "No One Asks Anymore"
 eotg_aug_countdown.005.desc:0 "You refused them, and they have stopped asking. Nobody raises it at table. People find reasons to be elsewhere when you enter, and the conversations that used to begin with concern now begin with logistics. The courtesy is perfect, which makes it worse."
 eotg_aug_countdown.005.a:0 "Good. Let them keep their distance."
 eotg_aug_countdown.005.b:0 "Ask them to ask again."
 eotg_aug_countdown.005.c:0 "Go to them yourself."

 # eotg_aug_countdown.006 The Quiet
 eotg_aug_countdown.006.t:0 "The Quiet"
 eotg_aug_countdown.006.desc:0 "It stops. There is no great relief: the anomalies thin out, the clocks agree, a cup stays in your hand. You wait for the next one and it does not come. The clean readings are not safety. They are only the interval between events."
 eotg_aug_countdown.006.a:0 "Breathe."
 eotg_aug_countdown.006.b:0 "It's waiting."

 # ---- The Patron (the syndicate) ----

 # init.018 e, init.019 The Arms Race
 eotg_aug_init.018.e:0 "[ROOT.Char.Custom('eotg_aug_cl_syndicate_offer')|U] will pay."

 # eotg_aug_patron.001 The Syndicate's Offer
 eotg_aug_patron.001.t:0 "The Syndicate's Offer"
 eotg_aug_patron.001.desc:0 "An envoy from [ROOT.Char.Custom('eotg_aug_cl_syndicate_offer')] has asked for a private audience. The envoy brings no gifts, only a contract, and says it plainly: 'We would like to pay for it.' The clinic, the implants, the technicians, all of it. The terms are on the second page. The envoy lets you reach it yourself."
 eotg_aug_patron.001.a:0 "Accept."
 eotg_aug_patron.001.b:0 "Decline."
 eotg_aug_patron.001.c:0 "Accept, after reading every clause."
 eotg_aug_patron.001.d:0 "Accept, and ask for a stipend."
 eotg_aug_patron.001.e:0 "Who are you, really?"

 # eotg_aug_patron.002 Repayment
 eotg_aug_patron.002.t:0 "Repayment"
 eotg_aug_patron.002.desc:0 "The envoy from [ROOT.Char.Custom('eotg_aug_cl_syndicate')] presents an invoice. It is polite and itemized. It covers the parts, the surgery, and a line called 'ongoing support.' A small matter, the envoy says, and then waits, like someone who has been paid before."
 eotg_aug_patron.002.a:0 "Pay."
 eotg_aug_patron.002.b:0 "I will not pay this invoice."
 eotg_aug_patron.002.c:0 "Renegotiate."
 eotg_aug_patron.002.c.success:0 "The envoy concedes the point and revises the figure."
 eotg_aug_patron.002.c.failure:0 "The envoy lets you finish, then restates the figure, higher."
 eotg_aug_patron.002.d:0 "Pay in promises."
 eotg_aug_patron.002.e:0 "Ask for honest terms."
 eotg_aug_patron.002.e.success:0 "The envoy considers it, and halves the figure."
 eotg_aug_patron.002.e.failure:0 "The envoy takes note of the request, and of you."

 # eotg_aug_patron.003 Exclusivity
 eotg_aug_patron.003.t:0 "Exclusivity"
 eotg_aug_patron.003.desc:0 "The envoy from [ROOT.Char.Custom('eotg_aug_cl_syndicate')] has one more clause. From now on only the syndicate's technicians are to service your implants. It is framed as quality control. Any other hands in the casing, the envoy says, would end the support, and the firmware has been set to notice."
 eotg_aug_patron.003.a:0 "Agree."
 eotg_aug_patron.003.b:0 "I choose whose hands open my casing."
 eotg_aug_patron.003.c:0 "Agree, on a trial basis."
 eotg_aug_patron.003.d:0 "Agree, but I audit their work."
 eotg_aug_patron.003.e:0 "Their hands will never touch me."

 # eotg_aug_patron.004 The Errand
 eotg_aug_patron.004.t:0 "The Errand"
 eotg_aug_patron.004.desc:0 "The envoy from [ROOT.Char.Custom('eotg_aug_cl_syndicate')] mentions, almost in passing, that [eotg_critic.GetFirstName] has been speaking against the syndicate's interests. The envoy has heard it said, and does not say by whom. The envoy does not ask you to do anything. The envoy lets the pause do the asking."
 eotg_aug_patron.004.a:0 "It will be done."
 eotg_aug_patron.004.b:0 "No. I do not run your errands."
 eotg_aug_patron.004.c:0 "Warn the critic instead."
 eotg_aug_patron.004.d:0 "With pleasure."
 eotg_aug_patron.004.e:0 "Never, and they will hear of your asking."

 # eotg_aug_patron.005 The Family Clause
 eotg_aug_patron.005.t:0 "The Family Clause"
 eotg_aug_patron.005.desc:0 "[eotg_heir.GetFirstName] sat in on part of the meeting, and the envoy from [ROOT.Char.Custom('eotg_aug_cl_syndicate')] noticed. The next clause covers your heir: [eotg_heir.GetHerHis] implants, [eotg_heir.GetHerHis] service, [eotg_heir.GetHerHis] upgrades, all on the syndicate's schedule. The syndicate was never buying the implant. It was buying your dynasty."
 eotg_aug_patron.005.desc_no_heir:0 "The envoy from [ROOT.Char.Custom('eotg_aug_cl_syndicate')] turns the page. The next clause covers your next child, whenever and whoever they turn out to be: their implants, their service, their upgrades, all on the syndicate's schedule. The syndicate was never buying the implant. It was buying your line."
 eotg_aug_patron.005.a:0 "Agreed."
 eotg_aug_patron.005.b:0 "Never."
 eotg_aug_patron.005.c:0 "Take more of me instead."
 eotg_aug_patron.005.d:0 "Not my child."
 eotg_aug_patron.005.e:0 "A strong heir is a strong house."

 # eotg_aug_patron.006 The Final Demand
 eotg_aug_patron.006.t:0 "The Final Demand"
 eotg_aug_patron.006.desc_betrayal:0 "The envoy comes without the usual courtesy. [ROOT.Char.Custom('eotg_aug_cl_syndicate')|U] has kept a ledger of your refusals, and it is closed. The terms are final, and the envoy says them without heat: they were never buying the implant. They were buying you, and you have stopped being for sale."
 eotg_aug_patron.006.desc_settlement:0 "The envoy comes with the final account. [ROOT.Char.Custom('eotg_aug_cl_syndicate')|U] has closed it on its side, and would like to settle. The terms are generous and the envoy is relaxed, like someone who has already collected what they came for."
 eotg_aug_patron.006.desc_betrayal_absent:0 "The message comes without the usual courtesy, sealed and unsigned. [ROOT.Char.Custom('eotg_aug_cl_syndicate')|U] has kept a ledger of your refusals, and it is closed. The terms are final and written without heat: they were never buying the implant. They were buying you, and you have stopped being for sale."
 eotg_aug_patron.006.desc_settlement_absent:0 "A courier brings the final account, sealed. [ROOT.Char.Custom('eotg_aug_cl_syndicate')|U] has closed it on its side, and would like to settle. The terms are generous and the tone is relaxed, like that of someone who has already collected what they came for."
 eotg_aug_patron.006.desc_writeoff_absent:0 "The message arrives sealed, with no courier waiting for an answer. [ROOT.Char.Custom('eotg_aug_cl_syndicate')|U] has reviewed your account and closed it. The terms are brief: the syndicate does not service broken units, and what you owe is due now."
 eotg_aug_patron.006.a:0 "Sign over the revenues."
 eotg_aug_patron.006.b:0 "Buy them out."
 eotg_aug_patron.006.c:0 "Betray them."
 eotg_aug_patron.006.d:0 "Sell them to [ROOT.Char.Custom('eotg_aug_cl_rival_syndicate')]."
 eotg_aug_patron.006.d.success:0 "[ROOT.Char.Custom('eotg_aug_cl_rival_syndicate')|U] pays, and the old one does not find out."
 eotg_aug_patron.006.d.failure:0 "The old syndicate finds out first."
 eotg_aug_patron.006.e:0 "Come and take it from me."

 # eotg_aug_patron.007 A New Envoy
 eotg_aug_patron.007.t:0 "A New Envoy"
 eotg_aug_patron.007.desc:0 "[ROOT.Char.Custom('eotg_aug_cl_syndicate')|U] has sent a new envoy. [eotg_patron_envoy.GetFirstName] presents the same terms, on the same slate, with the same smooth patience, unbothered by what became of [eotg_patron_envoy.GetHerHis] predecessor. The last one is not mentioned. The change has simply been made, and the contract continues as scheduled."
 eotg_aug_patron.007.a:0 "Welcome, envoy; your contract is known here."
 eotg_aug_patron.007.b:0 "And what became of the last one?"
 eotg_aug_patron.007.c:0 "Refuse [eotg_patron_envoy.GetHerHim] entry."

 # ---- The Iron Retinue ----

 # eotg_aug_init.019 The Arms Race
 eotg_aug_init.019.t:0 "The Arms Race"
 eotg_aug_init.019.desc:0 "Two of your [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] carry implants now, and [eotg_iron_knight.GetFirstName] has just won three bouts in a row. The drill floor has noticed. The question under every conversation is whether you will let your own household outpace you."
 eotg_aug_init.019.a:0 "Then improve myself."
 # eotg_lint: allow L012 a ruler's own retinue, not a state programme
 eotg_aug_init.019.b:0 "Start a program."
 eotg_aug_init.019.c:0 "Look after the ones I have."
 eotg_aug_init.019.d:0 "All of it."
 eotg_aug_init.019.e:0 "Two is enough."

 # eotg_aug_retinue.001 First of the Iron
 eotg_aug_retinue.001.t:0 "First of the Iron"
 eotg_aug_retinue.001.desc:0 "[eotg_volunteer.GetFirstName] has come to you with a request in plain words: to be fitted, as others have been. [eotg_volunteer.GetSheHe|U] has watched what the implants do, on the drill floor and in the field, and [eotg_volunteer.GetSheHe] wants it. [eotg_volunteer.GetSheHe|U] asks as if it were an honour and not an expense, while the unaugmented fighters in the barracks watch with quiet envy."
 eotg_aug_retinue.001.a:0 "You will be the first of the iron."
 eotg_aug_retinue.001.b:0 "Not yet."
 eotg_aug_retinue.001.c:0 "The best hardware there is."
 eotg_aug_retinue.001.d:0 "Fit [eotg_volunteer.GetHerHim], and the next one after."
 eotg_aug_retinue.001.e:0 "Proceed only if [eotg_volunteer.GetSheHe] truly wants it."

 # eotg_aug_retinue.002 More Step Forward
 eotg_aug_retinue.002.t:0 "More Step Forward"
 eotg_aug_retinue.002.desc:0 "Word has spread from the barracks, and [eotg_cand_a.GetFirstName] has come to ask for an implant. [eotg_cand_a.GetSheHe|U] makes the case cleanly: [eotg_cand_a.GetSheHe] is the strongest you have, and means to stay that way when others are fitted. [eotg_cand_a.GetSheHe|U] does not ask what it costs."
 eotg_aug_retinue.002.desc_cand_b:0 "\n\n[eotg_cand_b.GetFirstName] stands behind [eotg_cand_a.GetHerHim], and makes the same case with the order changed. [eotg_cand_b.GetSheHe|U] will not let a peer pull ahead, and does not ask what it costs either."
 eotg_aug_retinue.002.a:0 "Fit both of them."
 eotg_aug_retinue.002.b:0 "The strongest."
 eotg_aug_retinue.002.c:0 "Refuse the request."
 eotg_aug_retinue.002.d:0 "Both of you, but not from my purse."
 eotg_aug_retinue.002.e:0 "Both of you, at my expense and with care."

 # eotg_aug_retinue.003 The Iron Ranks
 eotg_aug_retinue.003.t:0 "The Iron Ranks"
 # eotg_lint: allow L012 a ruler's own retinue, not a state programme
 eotg_aug_retinue.003.desc:0 "The court calls them the Iron Ranks now, and so do they. They stand differently, they move in step without a drill order, and visitors lower their voices around them. A program that began as a favour to one [ROOT.Char.Custom('KnightCultureNoTooltipLowercase')] is a unit, and a unit is something other houses can see."
 eotg_aug_retinue.003.a:0 "Parade them."
 eotg_aug_retinue.003.b:0 "Keep them out of sight and out of talk."
 eotg_aug_retinue.003.c:0 "Train them harder."
 eotg_aug_retinue.003.d:0 "Parade them past the vassals' gates."
 eotg_aug_retinue.003.e:0 "And who watches the iron?"

 # eotg_aug_retinue.004 Resentment in the Ranks
 eotg_aug_retinue.004.t:0 "Resentment in the Ranks"
 eotg_aug_retinue.004.desc:0 "The [ROOT.Char.Custom('KnightCulturePluralNoTooltip')] who were not chosen have started to keep to themselves. Their loyalty has not changed. Their pay, their rank and their place in the line have, and everyone on the drill floor knows the cause. The resentment is not loud. It is in who sits where in the mess, and who leaves first."
 eotg_aug_retinue.004.a:0 "Augment them too."
 eotg_aug_retinue.004.b:0 "Honour the unaugmented."
 eotg_aug_retinue.004.c:0 "Let them resent."
 eotg_aug_retinue.004.d:0 "Equal pay. Equal honour."
 eotg_aug_retinue.004.e:0 "Replace them."

 # eotg_aug_retinue.005 What the Program Becomes
 # eotg_lint: allow L012 a ruler's own retinue, not a state programme
 eotg_aug_retinue.005.t:0 "What the Program Becomes"
 eotg_aug_retinue.005.desc:0 "The Iron Ranks are no longer an experiment. They are a fact of your house, and the question is what kind. You can make them permanent, hold them at their present size, or take it all back. Each choice is a decision about the people already in them."
 eotg_aug_retinue.005.a:0 "The Ranks stay. They are part of this house."
 eotg_aug_retinue.005.b:0 "Stop recruiting."
 eotg_aug_retinue.005.c:0 "Reverse it."
 eotg_aug_retinue.005.d:0 "Make it a privilege."
 eotg_aug_retinue.005.e:0 "Undo it. All of it."

 # ---- Phase 5 modifiers and opinion ----
 eotg_mod_aug_patron_clause:0 "Syndicate Clause"
 eotg_mod_aug_patron_clause_desc:0 "Only the syndicate's technicians may service the implants. They are good at it, and the standing fee for exclusive service comes out of the treasury every month."
 eotg_mod_aug_patron_clause_final:0 "Syndicate Lien"
 eotg_mod_aug_patron_clause_final_desc:0 "A permanent share of the revenues goes to whoever holds the paper, in exchange for the debt being closed. It is paid every month, and it will be paid for as long as there are revenues."
 eotg_mod_aug_patron_throttle:0 "Throttled Firmware"
 eotg_mod_aug_patron_throttle_desc:0 "The syndicate's technicians wrote a throttle into the firmware at installation, held off by a renewal they entered at each servicing. The servicing has stopped, and the throttle has engaged. It is set low, and it has not been found. The body feels the limit as stress and weakness."
 eotg_mod_aug_iron_retinue:0 "The Iron Ranks"
 eotg_mod_aug_iron_retinue_desc:0 "A body of augmented retainers drills in step under the ruler's banner. They fight better as a unit than any of them would alone."
 eotg_opinion_aug_passed_over:0 "Passed Over"

 # ---- Phase 6: the non-ruler lifecycle (cybernetics_v2_phase6.md). Recipient is the liege; eotg_champion is the augmented knight or courtier. ----

 # eotg_aug_nr.001 The Champion Volunteers
 eotg_aug_nr.001.t:0 "The Champion Volunteers"
 eotg_aug_nr.001.desc:0 "[eotg_champion.GetFirstName] asks to speak to you alone. [eotg_champion.GetSheHe|U] has seen what implants do for those who have them, and is not subtle about wanting the same. [eotg_champion.GetSheHe|U] stands very straight while [eotg_champion.GetSheHe] asks, as if the request were already a test."
 eotg_aug_nr.001.a:0 "Granted."
 eotg_aug_nr.001.b:0 "Denied."
 eotg_aug_nr.001.c:0 "Granted, and left to [eotg_champion.GetHerHim]."
 eotg_aug_nr.001.d:0 "At my expense, and properly."
 eotg_aug_nr.001.e:0 "Why do you want to be stronger than me?"

 # eotg_aug_nr.002 Your Champion's New Edge
 eotg_aug_nr.002.t:0 "Your Champion's New Edge"
 eotg_aug_nr.002.desc:0 "Another rework, and on [eotg_champion.GetFirstName] it shows. [eotg_champion.GetSheHe|U] moves with more economy than [eotg_champion.GetSheHe] did, and the people who spar with [eotg_champion.GetHerHim] have started to choose their words."
 eotg_aug_nr.002.desc_enhanced:0 "\n\n[eotg_champion.GetSheHe|U] is Enhanced now. The seams are visible and the warmth in [eotg_champion.GetHerHis] manner has thinned. [eotg_champion.GetSheHe|U] is better at the job, and a little further from the people [eotg_champion.GetSheHe] does it for."
 eotg_aug_nr.002.desc_overclocked:0 "\n\n[eotg_champion.GetSheHe|U] is Overclocked now. The upgrades have reached the part of [eotg_champion.GetHerHim] that decides, and [eotg_champion.GetSheHe] runs hot and fast and does not sleep when the others do. Whatever [eotg_champion.GetSheHe] is for you, [eotg_champion.GetSheHe] is more of it."
 eotg_aug_nr.002.a:0 "Reward [eotg_champion.GetHerHim]."
 eotg_aug_nr.002.b:0 "Keep an eye on [eotg_champion.GetHerHim]."
 eotg_aug_nr.002.c:0 "Front line, every battle."
 eotg_aug_nr.002.d:0 "I want more of them."
 eotg_aug_nr.002.e:0 "Keep [eotg_champion.GetHerHim] beside me."

 # eotg_aug_nr.003 Something Is Wrong
 eotg_aug_nr.003.t:0 "Something Is Wrong"
 eotg_aug_nr.003.desc:0 "Lately [eotg_champion.GetFirstName] misses things. [eotg_champion.GetHerHis|U] hands are not quite steady, and twice this week [eotg_champion.GetSheHe] has stopped mid-sentence and looked at nothing. The others have noticed. The others are waiting to see whether you will."
 eotg_aug_nr.003.a:0 "Pay for [eotg_champion.GetHerHis] maintenance."
 eotg_aug_nr.003.b:0 "Tell [eotg_champion.GetHerHim] [eotg_champion.GetSheHe] is unfit to serve."
 eotg_aug_nr.003.c:0 "Say nothing, and let [eotg_champion.GetHerHim] keep serving."
 eotg_aug_nr.003.d:0 "Sit with [eotg_champion.GetHerHim]."
 eotg_aug_nr.003.e:0 "Work [eotg_champion.GetHerHim] until it breaks."

 # eotg_aug_nr.004 The Champion's Mistake
 eotg_aug_nr.004.t:0 "The Champion's Mistake"
 eotg_aug_nr.004.desc:0 "[eotg_victim.GetFirstName] is hurt, and [eotg_champion.GetFirstName] is the reason. The champion did not mean it. [eotg_champion.GetSheHe|U] is sure of that, and so is everyone who saw it, and nobody is sure what the champion would have meant if [eotg_champion.GetSheHe] had been given the time to mean anything."
 eotg_aug_nr.004.desc_none:0 "[eotg_champion.GetFirstName] was found in the middle of a wrecked room: a door off its hinges, a bulkhead dented outward, [eotg_champion.GetHerHis] own hands cut open. Nobody else was hurt. [eotg_champion.GetSheHe|U] cannot tell you what happened, and was not lying when [eotg_champion.GetSheHe] said so."
 eotg_aug_nr.004.a:0 "Imprison [eotg_champion.GetHerHim]."
 eotg_aug_nr.004.b:0 "Pay for the harm."
 eotg_aug_nr.004.c:0 "Pay for [eotg_champion.GetHerHis] treatment."
 eotg_aug_nr.004.d:0 "A trial."
 eotg_aug_nr.004.e:0 "Let [eotg_champion.GetHerHim] finish."

 # eotg_aug_nr.005 A Changed Champion
 eotg_aug_nr.005.t:0 "A Changed Champion"
 eotg_aug_nr.005.desc:0 "[eotg_champion.GetFirstName] has changed, in a way you cannot point at. The same face, the same voice, the same service, and something in how [eotg_champion.GetSheHe] weighs things is different. [eotg_champion.GetSheHe|U] says the right words in a slightly wrong order, and you have known [eotg_champion.GetHerHim] too long to miss it."
 eotg_aug_nr.005.a:0 "Talk to [eotg_champion.GetHerHim]."
 eotg_aug_nr.005.b:0 "Send [eotg_champion.GetHerHim] away."
 eotg_aug_nr.005.c:0 "Watch."
 eotg_aug_nr.005.d:0 "[eotg_champion.GetSheHe|U] is still in there."
 eotg_aug_nr.005.e:0 "Lock [eotg_champion.GetHerHim] in [eotg_champion.GetHerHis] rooms."

 # eotg_aug_nr.006 The Broken Champion
 eotg_aug_nr.006.t:0 "The Broken Champion"
 eotg_aug_nr.006.desc:0 "The cascade has finished with [eotg_champion.GetFirstName]. The implants failed together, unobserved, and the one who stands in front of you is on [eotg_champion.GetHerHis] feet and strong and calm, and no longer reliably the person you knew. [eotg_champion.GetSheHe|U] looks at you as if checking a record."
 eotg_aug_nr.006.a:0 "Restrain [eotg_champion.GetHerHim]."
 eotg_aug_nr.006.b:0 "Cut it out of [eotg_champion.GetHerHim]."
 eotg_aug_nr.006.b.death:0 "[eotg_champion.GetFirstNameNoTooltip] does not survive the surgery."
 eotg_aug_nr.006.b.survive:0 "[eotg_champion.GetFirstNameNoTooltip] survives, and every unit is out."
 eotg_aug_nr.006.c:0 "Protect [eotg_champion.GetHerHim]."
 eotg_aug_nr.006.d:0 "Execute [eotg_champion.GetHerHim]."
 eotg_aug_nr.006.e:0 "I'll care for [eotg_champion.GetHerHim] myself."
 eotg_aug_nr.006.f:0 "Point [eotg_champion.GetHerHim] at the enemy."
 # ── Balance Part B2: override toasts, misled paths, roll outcomes, trait options, desc variants ──
 eotg_fracture.019.override_tt:0 "The arrest order went out under your seal before you finished deciding."
 eotg_fracture.023.override_tt:0 "The order went out under your seal. The confirmation in the log is yours."
 eotg_fracture.016.override_tt:0 "You hear yourself describe an accident. It is a good account."
 eotg_fracture.024.override_tt:0 "The guards were already at [eotg_changed.GetHerHis] door. The order was yours."
 eotg_fracture.025.override_tt:0 "The warden is under guard. The order went out in your hand before you could agree."
 eotg_fracture.006.override_tt:0 "The arrest order went out under your seal."
 eotg_fracture.009.desc_misled:0 "You cannot account for an hour. The implant's log can: council in session, routine business, a short recess, every entry stamped. The council minutes agree with it line for line. By every record you were in your seat the whole time. You remember none of it."
 eotg_fracture.009.misled_tt:0 "The minutes were written afterward. In your hand."
 eotg_fracture.015.b.tt:0 "The letter goes out as written."
 eotg_fracture.015.b.reveal_confession:0 "The letter that arrived was a confession. It is not the letter you read."
 eotg_fracture.015.b.reveal_threat:0 "The letter that arrived was a threat, itemized and dated. It is not the letter you read."
 eotg_fracture.015.b.reveal_devotion:0 "The letter that arrived was a declaration of devotion. It is not the letter you read."
 eotg_aug_init.007.a.success:0 "The surgeon is the best the clinic has. If the bridge can take, it will take here."
 eotg_aug_init.007.a.failure:0 "The surgeon is rushed and the theatre is short of hands. If the bridge can fail, it has room to."
 eotg_aug_init.010.a.success:0 "The hands are quick and the parts look sound. If cheap work can hold, this might."
 eotg_aug_init.010.a.failure:0 "The hands are quick and the parts carry no maker's marks. Nothing here suggests they will hold."
 eotg_aug_tier1.002.a.success:0 "The team is the best you could find. If anything can go cleanly, this will."
 eotg_aug_tier1.002.a.failure:0 "The team was chosen in a hurry. Whatever goes wrong will have had room to."
 eotg_aug_tier1.013.b.success:0 "You work through the fever with a clear head. Whatever comes next, you meet it steady."
 eotg_aug_tier1.013.b.failure:0 "You work through the fever on little sleep. Whatever comes next, you meet it worn."
 eotg_aug_tier1.018.c.success:0 "You repair the damage and name the price. [eotg_copycat.GetSheHe|U] pays it, and owes you."
 eotg_aug_tier1.018.c.failure:0 "You repair the damage and name the price. [eotg_copycat.GetSheHe|U] hears an insult, and leaves grateful and angry."
 eotg_aug_tier2.004.b.success:0 "[eotg_aug_spouse.GetSheHe|U] wants to believe you, and for now [eotg_aug_spouse.GetSheHe] does."
 eotg_aug_tier2.004.b.failure:0 "[eotg_aug_spouse.GetSheHe|U] hears how well you said it. That was the wrong thing to hear."
 eotg_aug_tier2.012.a.success:0 "The inquiry stays discreet, and it finds what it finds."
 eotg_aug_tier2.012.a.success_true:0 "The flag was correct. The records show what the pattern said they would."
 eotg_aug_tier2.012.a.success_false:0 "The pattern was the implant's own, built from its own readings. Nothing in the records supports it."
 eotg_aug_tier2.012.a.failure:0 "The inquiry is noticed. The records are tidy, and nothing in them settles it."
 eotg_aug_tier3.007.c.success:0 "The comparison is exact. You both leave sharper."
 eotg_aug_tier3.007.c.failure:0 "The comparison is exact. Only the other leaves with anything to show for it."
 eotg_aug_tier3.016.c.success:0 "You ride it out, and the crosstalk settles into something you can use."
 eotg_aug_tier3.016.c.failure:0 "You ride it out. The crosstalk does not settle, and you keep a little of it."
 eotg_aug_tier3.019.b.success:0 "You keep every file. It goes slower, and you learn it better."
 eotg_aug_tier3.019.b.failure:0 "You keep every file, and your hands do not hold. Something is missed."
 eotg_aug_tier3.023.a.success:0 "The plan holds. Every piece fits where the field said it would."
 eotg_aug_tier3.023.a.failure:0 "The plan holds until the piece it left out arrives."
 eotg_fracture.007.a.success:0 "The plans are clean, and the right buyers would pay for them."
 eotg_fracture.007.a.failure:0 "The plans are written, but the third copy disagrees with the first. You cannot tell which you meant."
 eotg_fracture.026.a.success:0 "Someone comes, and stays. Before the shift changes, the court has closed its doors around you."
 eotg_fracture.026.a.failure:0 "Someone comes. The hour closes before you finish saying what you need."
 eotg_aug_end.031.a.success:0 "The old ruler settles. The corridor falls still, and your name stays unsaid until you say it."
 eotg_aug_end.031.a.failure:0 "The old ruler does not settle. The name comes early and keeps coming, through the door."
 eotg_fracture.003.f:0 "Pain keeps me here."
 eotg_fracture.008.f:0 "Do I have to say it twice? Answer to it."
 eotg_fracture.009.f:0 "I was drinking. That is all it was."
 eotg_fracture.010.f:0 "That is the real one. I am the reflection."
 eotg_fracture.010.g:0 "Sit before it until it blinks."
 eotg_fracture.014.f:0 "Seal my own door instead."
 eotg_fracture.016.f:0 "I was drunk, and I fell. It happens."
 eotg_fracture.021.e:0 "Seal my doors. I see nobody for a year."
 eotg_fracture.022.f:0 "A small seizure. They pass."
 eotg_fracture.023.f:0 "The war is real. The rest of you are behind."
 eotg_fracture.023.f_war:0 "The war is over. The rest of you are behind."
 eotg_aug_init.006.f:0 "And what I was born with, too."
 eotg_aug_init.006.b_congenital:0 "I have lived with it this long."
 eotg_aug_tier1.010.g:0 "I was strong before. Now I am stronger."
 eotg_aug_tier1.010.h:0 "Finally, a body that keeps up."
 eotg_aug_tier1.011.f:0 "Let them look. They always have."
 eotg_aug_patron.002.f:0 "Let their technicians service the debt."
 eotg_aug_retinue.003.f:0 "Lock their timing to mine."
 eotg_aug_init.006.desc_congenital:0 "You were born this way, and the clinics here do not pretend otherwise. They cannot change what you were born with. They can build around it: a frame, braces and servos under the skin, a gait the implant steadies at every step. The technician from [ROOT.Char.Custom('eotg_aug_cl_company')] is careful to say what the contract covers. It covers you. It does not cover your children."
 eotg_aug_heir.001.desc_overclocked:0 "[eotg_heir.GetFirstName] asks to speak with you alone. [eotg_heir.GetSheHe|U] has noticed the small things: the replies that arrive before the question ends, the pauses that come where any other person would speak. [eotg_heir.GetSheHe|U] does not accuse. [eotg_heir.GetSheHe|U] asks what the household should do if it gets worse, and the question stays in the room after [eotg_heir.GetSheHe] stops speaking."
 eotg_aug_heir.001.desc_patient:0 "\n\n[eotg_heir.GetSheHe|U] was a child when the surgeons saved [eotg_heir.GetHerHim], and [eotg_heir.GetSheHe] still carries what they fitted. [eotg_heir.GetSheHe|U] knows what an implant can do for a person. [eotg_heir.GetSheHe|U] is asking because [eotg_heir.GetSheHe] knows what else it can do."
 eotg_aug_patron.003.desc_voice:0 "\n\nThe model read the clause before the envoy reached it. It has already priced the refusal, and the figure is the one you were about to arrive at."
 eotg_aug_patron.006.desc_writeoff:0 "The envoy does not sit down. [ROOT.Char.Custom('eotg_aug_cl_syndicate')|U] has reviewed your account and closed it. The terms are brief: the syndicate does not service broken units, and what you owe is due now."
 eotg_aug_retinue.003.desc_voice:0 "\n\nThe overlay has started tagging them: designation, response time, a column for drift. You did not ask it to. You were about to."
 eotg_aug_retinue.004.desc_voice:0 "\n\nThe overlay tags the passed-over [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] too, in a separate column. It has already ranked them by how soon they could be brought up to standard."
 # eotg_lint: allow L012 a ruler's own retinue, not a state programme
 eotg_aug_retinue.005.desc_fractured:0 "The Iron Ranks still stand in step, and they still look to you for the order. You cannot give it reliably anymore, and they have begun to notice the delay. The Program needs a decision while you can still make one."
 eotg_can_receive_augmented_suppressed_tt:0 "Has not resolved to wait before taking implants"
 eotg_decision_maintenance_protocol_cooldown_tt:0 "The last calibration has run its course"
 eotg_aug_can_afford_excision_free_tt:0 "The surgeons are already paid for"
 eotg_mod_aug_optimised_levies_trimmed:0 "Trimmed Levy Plan"
 eotg_mod_aug_optimised_levies_trimmed_desc:0 "The steward cut the parts of the schedule the vassals would have felt. What remains is smaller, and no one has complained of it."
 eotg_aug_forget_relation_toast:0 "You look at [eotg_forgotten.GetName] and what was between you is not there anymore."
 eotg_fracture.020.desc_true_spared:0 "The inquiry is finished. [eotg_accused.GetName] was what the flag said. The correspondence, the payments and the plan were all there, and you refused to act. [eotg_accused.GetSheHe|U] still walks free. Nothing came of it, and the record holds both facts."
 eotg_fracture.020.c_spared:0 "It was right. I was not."
 eotg_decision_seek_augmentation_physician_tt:0 "Your own physician can do it too."
 eotg_aug_init.018.desc_syndicate:0 "\n\nOne more reply came that you did not send for. An envoy from [ROOT.Char.Custom('eotg_aug_cl_syndicate_offer')] offers to cover the cost, on its own terms."
 eotg_aug_init.018.e.tt:0 "A syndicate's envoy will call with an offer. The syndicate pays for it, on its own terms."
 eotg_aug_init.011.d.tt:0 "The surgeon cuts the rejected implant out. What that costs you follows."
 eotg_aug_end.001.b.tt:0 "The surgeons will not hold the table for you. Turning them away gives up the free excision."
 eotg_aug_end.020.d.tt:0 "You step down within days, and your heir takes the realm."
 eotg_aug_tier1.013.c.tt:0 "Your physician treats the rejection. The crisis follows within weeks."
 eotg_aug_tier1.014.a.tt:0 "You fight the rejection. The outcome follows."
 eotg_aug_tier1.016.a.tt:0 "The bout follows within days."
 eotg_aug_tier3.014.b.tt:0 "You look into it. You may learn the truth, or nothing."
 eotg_aug_tier3.016.a.tt:0 "You wait it out. The outcome follows."
 eotg_decision_remove_implants_tooltip:0 "Have every implant taken out. Choose who performs it."
 eotg_decision_maintenance_protocol_selection_tt:0 "Have a technician service your implants."
 eotg_decision_consult_physician_selection_tt:0 "Have your physician look over the implants, or what a removal left behind."
 eotg_aug_tier1.005.f:0 "Fill the pause. Reach for the platter."
 eotg_aug_tier1.007.f:0 "Now. Not this week. Now."
 eotg_aug_tier2.004.e:0 "We were never held together by hands."
 eotg_aug_tier2.020.f:0 "Let it guess. I will have changed my mind."
 eotg_aug_tier3.003.f:0 "Then I won't spend the nights alone."
 eotg_aug_tier3.010.f:0 "Run it at half, and keep it there."
 eotg_aug_tier3.021.d:0 "It was [eotg_delegate.GetHerHis] hand. It is [eotg_delegate.GetHerHis] fault."
 eotg_aug_nr.004.f:0 "[eotg_champion.GetSheHe|U] did not mean it. Let it go."
 eotg_aug_heir.007.t:0 "The Next in Line"
 eotg_aug_heir.007.desc_executed:0 "[eotg_heir.GetFirstName] comes to you knowing that you had [eotg_prior_heir.GetFirstName] put to death. [eotg_heir.GetSheHe|U] is first in line now because the one before [eotg_heir.GetHerHim] is not. [eotg_heir.GetSheHe|U] speaks evenly across the table, with [eotg_heir.GetHerHis] hands flat on the surface and [eotg_heir.GetHerHis] eyes kept off your implants."
 # eotg_lint: allow L012 the ruler speaking: what you answered, not the voice
 eotg_aug_heir.007.desc_dead:0 "[eotg_prior_heir.GetFirstName] is dead, and [eotg_heir.GetFirstName] is first in line now. [eotg_heir.GetSheHe|U] knows what was asked of the last heir, and what you answered when the question was pushed. [eotg_heir.GetSheHe|U] has inherited the question along with the place, and carries a quiet dread of the answer."
 eotg_aug_heir.007.desc_displaced:0 "[eotg_prior_heir.GetFirstName] lives, but no longer stands first in line. [eotg_heir.GetFirstName] does, and knows how the change was made. [eotg_heir.GetSheHe|U] sits where the last heir sat, and does not ask why."
 eotg_aug_heir.007.a:0 "What happened to [eotg_prior_heir.GetHerHim] will not happen to you."
 eotg_aug_heir.007.b:0 "Then you know what I am."
 eotg_aug_heir.007.c:0 "Learn from it, and restrain me if I fall."
 eotg_aug_heir.007.d:0 "Tell [eotg_heir.GetHerHim] how the choice was made."
 eotg_aug_heir.007.e:0 "[eotg_heir.GetSheHe|U] will try what the last one tried."
 eotg_aug_heir.003.desc_successor:0 "[eotg_heir.GetFirstName] brings the incident logs again, and a date. This has been said to you once before, by [eotg_prior_heir.GetFirstName], and [eotg_heir.GetFirstName] knows how that went. [eotg_heir.GetSheHe|U] does not rehearse it. 'Step aside,' [eotg_heir.GetSheHe] says, 'or I will make you.'"
 eotg_aug_heir.004.desc_successor:0 "[eotg_heir.GetFirstName] has decided again. [eotg_heir.GetSheHe|U] knows how this went the last time, and has decided anyway. The question is settled, and only the method remains."
 eotg_aug_patron.008.t:0 "The Paper"
 eotg_aug_patron.008.desc:0 "Your implants are gone, and [ROOT.Char.Custom('eotg_aug_cl_syndicate')] knows it. The debt is not. The paper names you, not the parts, and the syndicate still holds the paper. The terms have been re-priced for a customer it no longer services."
 eotg_aug_patron.008.desc_clause:0 "\n\nThe clause still bills for technicians who have nothing left to service."
 eotg_aug_patron.008.a:0 "Pay off the principal."
 eotg_aug_patron.008.b:0 "Sign the lien on my revenues."
 eotg_aug_patron.008.c:0 "Let them put it back."
 eotg_aug_patron.008.d:0 "The paper is worth nothing now."
 eotg_aug_patron.008.e:0 "Let my own court read the contract."
 eotg_aug_patron.008.e.success:0 "Your court finds the contract has no standing under your law. The syndicate does not contest it. There is nowhere else to take it."
 eotg_aug_patron.008.e.failure:0 "Your court upholds the contract. The syndicate is sent a copy of the ruling."
 eotg_aug_proc.001.t:0 "Who Takes It Out?"
 eotg_aug_proc.001.desc:0 "The decision is made. What is left is whose hands do it. The clinic has a table, a team and a price. Cheaper hands can be found, and they will not ask to see a record."
 eotg_aug_proc.001.desc_partial:0 "\n\nThe deeper work comes out. The first implants stay where they are."
 eotg_aug_proc.001.desc_downgrade:0 "\n\nThe overclock comes off. The rest stays."
 eotg_aug_proc.001.desc_full:0 "\n\nAll of it: the last of the implants, and the cabling threaded through you to reach them."
 eotg_aug_proc.001.desc_physician:0 "\n\nYour physician knows these implants, and has offered to do it for less."
 eotg_aug_proc.001.a:0 "The clinic."
 eotg_aug_proc.001.b:0 "My own physician."
 eotg_aug_proc.001.c:0 "Someone cheaper."
 eotg_aug_proc.001.d:0 "Not yet."
 eotg_aug_proc.001.e:0 "I'll guide their hands myself."
 eotg_aug_proc.001.f:0 "Every piece. I want none of it left."
 eotg_aug_proc.001.tt:0 "The procedure begins. How it goes is decided on the table."
 eotg_aug_proc.002.t:0 "After the Procedure"
 eotg_aug_proc.002.desc_upgrade:0 "The upgraded component has been in place for some weeks now. A diagnostic lead runs from your interface port to the panel, and the readings scroll past as the fitter watches. The new housing carries more mass than the original, and the body is still adjusting to it."
 eotg_aug_proc.002.desc_removal:0 "The component has been out for some weeks now. The fitter lifts the dressing to inspect the empty recess where the casing once sat. The severed leads have been capped, and the area is numb and strangely light without the heat it used to carry."
 eotg_aug_proc.002.desc_repair:0 "The repair has had some weeks to settle. The fitter connects a test lead to the port and waits for the readout."
 eotg_aug_proc.002.a:0 "It is done."
 eotg_aug_proc.002.a_grim:0 "It will have to do."
 eotg_aug_proc.002.b:0 "Fetch a physician."
 eotg_aug_proc.002.c:0 "Sweat it out."
 eotg_aug_proc.outcome_clean:0 "\n\nNothing hurts that should not. The readings are steady."
 eotg_aug_proc.outcome_excellent:0 "\n\nIt took better than anyone had a right to expect. The incision is already a fine line."
 eotg_aug_proc.outcome_infection:0 "\n\nThe incision is hot and swollen, and a fever is building under it."
 eotg_aug_proc.outcome_complication:0 "\n\nThe body is fighting the new hardware. The incision weeps and the readings stutter. The surgeon says it will hold. It will also hurt."
 eotg_aug_proc.outcome_fragments:0 "\n\nThey missed some. Wire and splinters of casing are still in the tissue, and the body knows it before the scans do."
 eotg_aug_proc.outcome_repair_failed:0 "\n\nThe repair did not take. The part sits where it was fitted and does nothing, and nothing is better than it was."
 eotg_aug_proc.outcome_discovered:0 "\n\nWord has got out. Someone saw the work, or the place it was done, or paid to know."
 eotg_aug_proc.outcome_maimed:0 "\n\nSomething was cut on the table that was not hardware. The use of the limb has not come back."
 eotg_aug_proc.outcome_one_eyed:0 "\n\nAn optic line was severed on the table. One eye has stayed dark."
 eotg_aug_proc.outcome_blind:0 "\n\nThe optic interface failed on the table, and it took your sight with it. Nothing the surgeon tried brought it back."
 eotg_aug_proc.install_tt:0 "How it took will be known when the incision heals."
 eotg_aug_proc.003.t:0 "Spare Parts"
 eotg_aug_proc.003.desc:0 "A body does not recover from this kind of injury on its own. What you already carry has standard fittings, and replacements are in stock somewhere. What remains is who fits them, and for how much."
 eotg_aug_proc.003.desc_wounded:0 "\n\nThe wound is deep and has not closed. Grafted tissue and a support frame would have you upright in weeks."
 eotg_aug_proc.003.desc_maimed:0 "\n\nThe hand and arm are past saving. A frame and a sensor lattice could replace them."
 eotg_aug_proc.003.desc_one_legged:0 "\n\nThe leg is gone. An actuator limb would take the sockets your implants already use."
 eotg_aug_proc.003.desc_one_eyed:0 "\n\nThe eye is gone. An optical unit would close the gap."
 eotg_aug_proc.003.desc_blind:0 "\n\nThe sight is gone. The optical units exist, and the interface for them is already in you."
 eotg_aug_proc.003.desc_disfigured:0 "\n\nThe damage is to the face. Synthetic tissue over a new frame would rebuild it, close enough that few would know."
 eotg_aug_proc.003.desc_fractured:0 "\n\nNo clinic will touch it. Their technicians read the diagnostics on your hardware and decline. Others are less particular."
 eotg_aug_proc.003.desc_physician:0 "\n\nYour physician has looked at the injury and your implants both, and could do the fitting for less."
 eotg_aug_proc.003.a:0 "The clinic."
 eotg_aug_proc.003.b:0 "My own physician."
 eotg_aug_proc.003.c:0 "The back streets."
 eotg_aug_proc.003.d:0 "Live with it."
 eotg_aug_proc.003.e:0 "Hand me the tools."
 eotg_aug_proc.003.f:0 "Improve it while you're in there."
 eotg_aug_proc.003.tt:0 "The fitting begins. How well it takes is decided on the table."
 eotg_aug_proc.004.t:0 "A Part Replaced"
 eotg_aug_proc.004.desc:0 "The injury is logged within the hour. Replacement parts are ordered against the existing fittings, the technicians are scheduled, and the fitting is finished within the month. The cost was already in the budget. Nothing else changes."
 eotg_aug_proc.004.desc_residue:0 "\n\nWhen it happened, the face made the old expression of pain. The expression was logged. It has not recurred."
 eotg_aug_proc.004.a:0 "Resume the schedule."
 eotg_aug_proc.020.t:0 "Phantom Static"
 eotg_aug_proc.020.desc:0 "A reflex reaches for an overlay that is not there. You look at a face, and no name surfaces beside it. You start down the stairs, and nothing counts them. The half-second early is gone, and your reflexes have not finished learning that."
 eotg_aug_proc.020.desc_removed:0 "\n\nYou had it taken out, and you would do it again. The reflex does not care."
 eotg_aug_proc.020.desc_excised:0 "\n\nThe surgeons took all of it, and some of what had grown around it. The reflex reaches into the gap."
 eotg_aug_proc.020.desc_rejected:0 "\n\nYour own tissue rejected the implant. The reflex still reaches for what was thrown out."
 eotg_aug_proc.020.desc_fragments:0 "\n\nNow and then the fragments left in catch: a sting along the old line of the cabling, then nothing."
 eotg_aug_proc.020.a:0 "It will fade."
 eotg_aug_proc.020.b:0 "See my physician."
 eotg_aug_proc.020.c:0 "Put it back."
 eotg_aug_proc.020.d:0 "Replace what was lost."
 eotg_aug_proc.020.e:0 "As I was made."
 eotg_aug_proc.020.c.tt:0 "Send word for an installation. Whoever replies will name their price."
 eotg_aug_init.011.desc_maimed:0 "Weeks on, the incision has closed. Something was cut on the table that should not have been, and the arm has not worked since."
 eotg_aug_init.011.desc_one_eyed:0 "Weeks on, the incision has closed. An optic line was cut during the surgery, and one eye has stayed dark."
 eotg_aug_init.011.desc_blind:0 "Weeks on, the incision has closed. The optic interface failed on the table, and your sight went with it."
 eotg_aug_init.006.desc_former:0 "\n\nThe surgeons who removed your implants took this with them."
 eotg_aug_tier1.002.f:0 "My own physician."
 eotg_aug_tier1.002.g:0 "Someone cheaper."
 eotg_aug_tier2.003.f:0 "My own physician."
 eotg_aug_tier2.003.g:0 "Someone cheaper."
 eotg_aug_tier1.022.desc_rejection:0 "\n\nYou are rejecting the new implant. The incision weeps, a fever comes and goes, and the readings will not settle. It will hold. It will also hurt for a while."
 eotg_aug_end.001.e:0 "Not their table. Somewhere cheaper."
 eotg_aug_heir.004.desc_seamless:0 "\n\nThey address the chair, not you. They have understood there is no difference left to make."
 eotg_aug_end.040.t:0 "The Ledger Balances"
 eotg_aug_end.040.desc:0 "The treasury accounts are read in one sitting, end to end. Every line is costed against what it returns. The surplus is found, and it is larger than the treasury staff projected."
 eotg_aug_end.040.desc_residue_high:0 "\n\nOne line is carried forward a cycle longer than the rest: the pardons budget, kept by a standing instruction older than the integration. Then it is flagged as unjustified, like the others."
 eotg_aug_end.040.desc_residue_low:0 "\n\nNothing is carried forward out of habit. There is no habit left to carry it."
 eotg_aug_end.040.a:0 "Bank the surplus."
 eotg_aug_end.040.b:0 "Cut what does not pay."
 eotg_aug_end.040.c:0 "Return it to the realm."
 eotg_aug_end.040.d:0 "Rebalance every ledger."
 eotg_aug_end.041.t:0 "A Resignation"
 eotg_aug_end.041.desc:0 "[eotg_resigner.GetName] asks to be released from the council. [eotg_resigner.GetHerHis|U] work has been reviewed, and it is correct. Every recommendation was taken. That is the problem, [eotg_resigner.GetSheHe] says: [eotg_resigner.GetSheHe] has been reporting to a room with no one in it."
 eotg_aug_end.041.desc_residue_high:0 "\n\nHalfway through, your head tilts the way it used to when you were listening. [eotg_resigner.GetSheHe|U] stops, looks at you, and starts again more slowly."
 eotg_aug_end.041.desc_residue_low:0 "\n\n[eotg_resigner.GetSheHe|U] finishes. Nothing in your face has moved, and [eotg_resigner.GetSheHe] did not expect it to."
 eotg_aug_end.041.a:0 "Accept it."
 eotg_aug_end.041.b:0 "Order [eotg_resigner.GetHerHim] to stay."
 eotg_aug_end.041.c:0 "Ask [eotg_resigner.GetHerHim] why."
 eotg_aug_end.041.c.stays:0 "[eotg_resigner.GetName] hears the old question in the old words, and stays. [eotg_resigner.GetSheHe|U] believes someone asked it."
 eotg_aug_end.041.c.leaves:0 "The question is put correctly. [eotg_resigner.GetName] hears the words, but not the person, and goes."
 eotg_aug_end.042.t:0 "A Flicker"
 eotg_aug_end.042.desc:0 "At the hour the court once gathered, the body turns toward the door and a hand lifts in greeting. The doorway is empty. The motion is logged as redundant and pruned."
 eotg_aug_end.042.desc_last:0 "\n\nIt does not happen again."
 eotg_aug_end.042.a:0 "Logged."
 eotg_mod_aug_fragments:0 "Implant Fragments"
 eotg_mod_aug_fragments_desc:0 "Wire and splinters of casing left in the tissue by a careless removal. They ache, and they slow the healing."
 eotg_aug_proc.001.tt_partial:0 "Integration falls back to Augmented."
 eotg_aug_proc.001.tt_downgrade:0 "Integration falls to Enhanced. Some of the damage remains."
 eotg_decision_aug_removal_booked_tt:0 "No procedure is already booked"
 eotg_aug_offer_augmentation_interaction:0 "Offer Augmentation"
 eotg_aug_offer_augmentation_interaction_desc:0 "Pay for [recipient.GetHerHis] first implants, and choose whose hands do the fitting."
 eotg_aug_offer_augmentation_interaction_notification:0 "[actor.GetName] offers to pay for implants, fitted by hands of [actor.GetHerHis] choosing."
 eotg_aug_demand_removal_interaction:0 "Demand Implant Removal"
 eotg_aug_demand_removal_interaction_desc:0 "Order [recipient.GetHerHim] to have every implant taken out. You pay, and you choose whose hands do it."
 eotg_aug_demand_removal_interaction_notification:0 "[actor.GetName] demands that your implants come out."
 eotg_aug_examine_interaction:0 "Have Them Examined"
 eotg_aug_examine_interaction_desc:0 "Have your physician look over [recipient.GetHerHis] hardware and report what is found."
 eotg_aug_start_tamper_interaction:0 "Tamper with Implants"
 eotg_aug_salvage_interaction:0 "Salvage Implants"
 eotg_aug_salvage_interaction_desc:0 "Have the prisoner's implants cut out, for the hardware's value. The prisoner's comfort is not the point."
 eotg_aug_send_provider_heading:0 "Whose hands"
 eotg_aug_send_clinic:0 "A sanctioned clinic"
 eotg_aug_send_clinic_tt:0 "A team, a table and records. The full price."
 eotg_aug_send_physician:0 "My own physician"
 eotg_aug_send_physician_tt:0 "Your physician does the work, for less than a clinic charges."
 eotg_aug_send_backstreet:0 "The back streets"
 eotg_aug_send_backstreet_tt:0 "Cheap, quick and unvetted. No one keeps a record."
 eotg_aug_send_rough:0 "Whoever is at hand"
 eotg_aug_send_rough_tt:0 "It costs nothing, and no one takes care with what else comes out."
 eotg_aug_send_one_provider_tt:0 "Exactly one choice of hands is selected"
 eotg_aug_send_physician_valid_tt:0 "You have a physician or implant technician to hand who is not the patient"
 eotg_aug_send_salvage_physician_tt:0 "Your physician does the cutting, with care for what else is there."
 eotg_aug_start_tamper_approved_tt:0 "You can start a scheme to tamper with [recipient.GetName]'s implants."
 eotg_aug_start_tamper_notification:0 "Scheme started: Tamper with Implants"
