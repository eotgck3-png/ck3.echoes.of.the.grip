 # ── Bookmarks ────────────────────────────────────────────────────────────────
 eotg_bookmark_866:0 "866 AG — The Galaxy in Flux"
 eotg_bookmark_866_desc:0 "The Titan Exodus is not yet over. Refugee fleets still cross the void, trailing the wars and faiths of the Titanworld behind them. In the Myr Clusters, the first great conflict of the new era ignites — four empires circling resources that none will share. New Cauldron stands 735 years strong, built from the very ruins of Orrin's Grip. The gods are weak. The League does not yet exist. And somewhere in the dark between stars, Orrin and Yu still war. This is 866 AG."

