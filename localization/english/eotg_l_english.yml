 # ── Events: eotg_orrins_grip ──────────────────────────────────────────────────
 eotg_orrins_grip.0001.t:0 "The Weight of the Grip"
 eotg_orrins_grip.0001.desc:0 "The histories speak of Orrin's Grip — the tunnel through the hells that sundered two planes of existence and heralded the Third Era. My bloodline carries that wound. The stars above are not the stars my ancestors knew."
 eotg_orrins_grip.0001.a:0 "Let the past remain buried."
 eotg_orrins_grip.0001.b:0 "We survived. That is enough."

