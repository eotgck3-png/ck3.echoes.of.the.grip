 # ── Traits ───────────────────────────────────────────────────────────────────
 eotg_grip_survivor:0 "Grip Survivor"
 eotg_grip_survivor_desc:0 "This character's bloodline traces back to those who endured the horrors of Orrin's Grip — the tunnel through the hells that shattered the Second Material Plane. They carry resilience born from unimaginable suffering."

 eotg_void_touched:0 "Void-Touched"
 eotg_void_touched_desc:0 "Exposure to Void energies has left a mark on this character's mind and body. They are drawn to shadow and subterfuge, but the corruption slowly eats away at their health."

