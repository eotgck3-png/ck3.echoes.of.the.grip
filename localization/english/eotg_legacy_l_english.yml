l_english:
 # ═══════════════════════════════════════════════════════════════════════════════
 # CONFLUENCE LEGACIES — localization
 #
 # Orrin's Grip fused worlds, stations, and planes into the Third Era's strange
 # geography. Every county may hold a layer that does not belong: a buried
 # district, ownerless industry, a dead court's archive, a sealed fragment of
 # Hell. The system: discover a site, choose Recover / Exploit / Seal / Claim,
 # and live with what the choice attracts.
 # ═══════════════════════════════════════════════════════════════════════════════

 # ── Survey decision ──────────────────────────────────────────────────────────
 eotg_decision_survey_legacies:0 "Survey Confluence Legacies"
 eotg_decision_survey_legacies_desc:0 "The Confluence left every settled system stitched together from wreckage — districts, machines, and archives from worlds that no longer exist, buried under eight centuries of ordinary life. A proper survey of the domain may find what the ground has been keeping."
 eotg_decision_survey_legacies_tooltip:0 "Commission a survey of your held counties for Confluence sites"
 eotg_decision_survey_legacies_effect_tooltip:0 "Surveyors will report their findings in the coming weeks"
 eotg_decision_survey_legacies_confirm:0 "Send the surveyors"

 # ── Survey events ────────────────────────────────────────────────────────────
 eotg_legacy_0002_title:0 "The Map That Contradicts the Sky"
 eotg_legacy_0002_desc:0 "The survey team returns not with ore samples but with a star chart — Second Era work, beautifully drawn, meticulously wrong. Its route network cannot be matched to the present heavens no matter how the navigators turn it. But one of its terminals falls squarely inside [eotg_legacy_county.GetName], on ground the maps of the living call empty."
 eotg_legacy_0002_opt_excavate:0 "Fund a full excavation."
 eotg_legacy_0002_opt_recalculate:0 "Recalculate the old heavens first."
 eotg_legacy_0002_opt_sell:0 "Sell the coordinates. Quietly."
 eotg_legacy_0002_opt_burn:0 "Burn the chart."

 eotg_legacy_0003_title:0 "The Surveyors Have Stopped Reporting"
 eotg_legacy_0003_desc:0 "The expedition into the exposed seam beneath [eotg_legacy_county.GetName] reported on schedule for nine days. On the tenth, nothing. On the eleventh, nothing. The relay drones return with their message queues empty and their hulls scored by something the technicians decline to speculate about."
 eotg_legacy_0003_opt_relief:0 "I will lead the relief force myself."
 eotg_legacy_0003_opt_recover:0 "Fund a careful recovery. Every one of them comes home."
 eotg_legacy_0003_opt_abandon:0 "Mark them lost. The survey continues."
 eotg_legacy_0003_opt_investigate:0 "First, learn why they stopped."
 eotg_legacy_0003_opt_wait:0 "Send a second expedition, better equipped."

 eotg_legacy_0004_title:0 "Honest Geology"
 eotg_legacy_0004_desc:0 "The survey concludes without wonder: rock that has always been rock, dust that has always been dust. In a galaxy stitched together from the wreckage of worlds, there is something almost restful about ground with no secrets in it."
 eotg_legacy_0004_opt_ok:0 "Reassuring, in its way."

 # ── Buried Metropolis ────────────────────────────────────────────────────────
 eotg_legacy_0010_title:0 "The Street of Foreign Suns"
 eotg_legacy_0010_desc:0 "Beneath [eotg_legacy_county.GetName] the excavators break into a boulevard. Shopfronts stand intact under vapor lamps that failed eight centuries ago. The architecture belongs to no local tradition; the script on the signage reads right to left in an alphabet the archivists cannot place; the orrery in the plaza models a star system that is not ours. An entire district of a vanished city-world, folded into our ground by the Confluence — waiting, all this time, under the fields."
 eotg_legacy_0010_opt_restore:0 "Restore it as a living district."
 eotg_legacy_0010_opt_concessions:0 "Issue rebuilding concessions and audit them."
 eotg_legacy_0010_opt_sell:0 "Sell the fabric of the old city."
 eotg_legacy_0010_opt_monument:0 "Declare it a monument of the realm."
 eotg_legacy_0010_opt_seal:0 "Close the shafts. Post wardens."

 eotg_legacy_0011_title:0 "What the District Wants"
 eotg_legacy_0011_desc_governed:0 "The recovered district of [eotg_legacy_county.GetName] has filled with life — and the life has organized. A delegation stands in your hall: descendants, or people who believe themselves descendants, of the world the district came from. They have relearned its script, revived its festivals, and they ask for what revived communities always ask for eventually. Recognition. Protection. Standing."
 eotg_legacy_0011_desc_extracted:0 "The salvage concessions in [eotg_legacy_county.GetName] have run ahead of their charters. Crews strip the old district faster than the assessors can catalogue it, wages run late, and last month a work gang sealed themselves into a gallery rather than accept a new quota. The contractors call it efficiency. The county calls it desecration."
 eotg_legacy_0011_opt_protect:0 "Grant the enclave protected status."
 eotg_legacy_0011_opt_refuse:0 "The district is territory, not a nation."
 eotg_legacy_0011_opt_reform:0 "Fund reforms before this turns ugly."
 eotg_legacy_0011_opt_press:0 "The quotas stand."

 # ── Archive Fragment ─────────────────────────────────────────────────────────
 eotg_legacy_0020_title:0 "The Court in the Vault"
 eotg_legacy_0020_desc:0 "The vault under [eotg_legacy_county.GetName] holds no treasure — it holds paperwork, which may be worse. A complete legal apparatus of a dead Second Era polity: land registers, genealogies, treaties, and a succession protocol still formally in force, awaiting claimants from a world that no longer exists. Whoever keeps these records decides what they mean. Whoever decides what they mean inherits a dead court's authority — and its enemies."
 eotg_legacy_0020_opt_custody:0 "Restore the archive's chain of custody."
 eotg_legacy_0020_opt_witness:0 "Invite the interested houses to witness the opening."
 eotg_legacy_0020_opt_mandate:0 "Adopt the dead polity's mandate as my own."
 eotg_legacy_0020_opt_copy:0 "Copy the useful records. Only those."
 eotg_legacy_0020_opt_catalogue:0 "Guard it, and catalogue slowly."

 eotg_legacy_0021_title:0 "The Archive Names an Heir"
 eotg_legacy_0021_desc:0 "The genealogists were thorough, and thoroughness has consequences. The dead court's succession protocol, applied to the living, produces a name — [eotg_legacy_heir.GetName], whose line survived the Confluence without knowing what it carried. The finding is defensible. The finding is dangerous. And the finding is now standing in your antechamber, having heard the rumors before you could decide what to do about them."
 eotg_legacy_0021_opt_recognize:0 "Recognize [eotg_legacy_heir.GetFirstName] as a client of my court."
 eotg_legacy_0021_opt_instrument:0 "Support them — at arm's length, on my terms."
 eotg_legacy_0021_opt_publish:0 "Publish the finding, whatever it costs."
 eotg_legacy_0021_opt_suppress:0 "Suppress it. All of it."

 # ── Relic Works ──────────────────────────────────────────────────────────────
 eotg_legacy_0030_title:0 "The Foundry Still Burns"
 eotg_legacy_0030_desc:0 "Eight hundred meters under [eotg_legacy_county.GetName], the survey lights fall on a foundry floor that never cooled. Second Era fabricators idle at their stations, feedstock hoppers half-full, a maintenance queue eight centuries deep and patiently waiting. It could produce again. Its safety systems were engineered for a workforce, an atmosphere, and a world that no longer exist — details the first eager concession-bidder will not mention."
 eotg_legacy_0030_opt_audit:0 "Recommission it under audited concessions."
 eotg_legacy_0030_opt_arm:0 "Convert the lines to armaments."
 eotg_legacy_0030_opt_output:0 "Run it at full output. Now."
 eotg_legacy_0030_opt_slow:0 "Bring it online slowly, system by system."
 eotg_legacy_0030_opt_seal:0 "Pour the access shafts full of concrete."

 eotg_legacy_0031_title:0 "What the Works Produce"
 eotg_legacy_0031_desc_governed:0 "The relic works in [eotg_legacy_county.GetName] runs clean, which is precisely the problem: everyone can see what it is worth. Two delegations arrived within a week of each other, each carrying a concession proposal, each politely declining to acknowledge the other's existence. The works can enrich its patron, its landlord, or its county — the bidders differ on which, and they are no longer being subtle."
 eotg_legacy_0031_desc_extracted:0 "The alarms in the relic works under [eotg_legacy_county.GetName] were designed to warn a species with different ears. By the time anyone understood them, the fire had the lower galleries. The extraction crews got out — most of them — and now stand in the ash asking the question every stripped machine eventually asks: whether their lord will pay to mend what profit broke."
 eotg_legacy_0031_opt_exclusive:0 "Grant one exclusive concession."
 eotg_legacy_0031_opt_divide:0 "Divide access among the bidders."
 eotg_legacy_0031_opt_charter:0 "Negotiate a public charter, openly."
 eotg_legacy_0031_opt_assure:0 "Promise each side everything."
 eotg_legacy_0031_opt_relief:0 "Pay for the relief crews. All of them."
 eotg_legacy_0031_opt_burnout:0 "Let it burn out. The ledgers stay in profit."

 # ── Hell Pocket ──────────────────────────────────────────────────────────────
 eotg_legacy_0040_title:0 "The Infernal Ledger"
 eotg_legacy_0040_desc:0 "The sealed badland in [eotg_legacy_county.GetName] is not a wasteland. Past the heat-shimmer boundary there are roads, tollhouses, a functioning market — a fragment of one of Hell's administrative layers, folded into our world by the Confluence and carrying on with commendable procedure. Its clerks have noticed the new management. They have prepared terms. The ledger they present is old, precise, and patient, and it is signed at the bottom by everything it has ever owned."
 eotg_legacy_0040_opt_bargain:0 "Take the ledger's terms."
 eotg_legacy_0040_opt_audit:0 "Audit the bargain before anything is signed."
 eotg_legacy_0040_opt_reject:0 "This is blasphemy, and blasphemy burns."
 eotg_legacy_0040_opt_warden:0 "The gate needs a warden. It has one."
 eotg_legacy_0040_opt_seal:0 "Seal the boundary. Permanently."

 eotg_legacy_0041_title:0 "The Debt Comes Due"
 eotg_legacy_0041_desc:0 "The clerk arrives on the appointed day, as the ledger said it would. It does not threaten; entities with perfect records never need to. It simply opens the book to the page bearing your seal, sets a stylus beside the column marked settlement, and waits with the patience of something that has collected from empires."
 eotg_legacy_0041_opt_gold:0 "Pay it in gold."
 eotg_legacy_0041_opt_kind:0 "Pay it in kind, from the county's substance."
 eotg_legacy_0041_opt_defy:0 "The realm does not honor this debt."

 # ── Shared aftermath pool ────────────────────────────────────────────────────
 eotg_legacy_0101_title:0 "The Rival's Archaeologist"
 eotg_legacy_0101_desc:0 "Fame travels, and the site in [eotg_legacy_county.GetName] has become famous. A foreign delegation presents itself with charts, genealogies, and a scholar who speaks very quickly — the substance of it being that the Legacy under your ground belonged to their patron's ancestors, and its recovery to their patron's treasury. The evidence is thinner than the confidence. The confidence is backed by a fleet."
 eotg_legacy_0101_opt_negotiate:0 "Compensation buys quiet. Pay it."
 eotg_legacy_0101_opt_expose:0 "Put their evidence to a scholar's trial."
 eotg_legacy_0101_opt_defy:0 "The ground is mine. What lies in it is mine."
 eotg_legacy_0102_title:0 "The Concession's Beneficiaries"
 eotg_legacy_0102_desc:0 "The extraction concessions were meant to enrich the realm. They have — selectively. [eotg_legacy_beneficiary.GetName] has turned site access into a private fortune: new retainers, new ships, and a new habit of arriving late to councils. The wealth came out of your ground. The power it is buying answers to someone else."
 eotg_legacy_0102_opt_tax:0 "Tax the windfall."
 eotg_legacy_0102_opt_leverage:0 "Turn their profit into leverage."
 eotg_legacy_0102_opt_accept:0 "Wealthy friends have their uses."
 eotg_legacy_0103_title:0 "The Cult Beneath the Monument"
 eotg_legacy_0103_desc:0 "The site in [eotg_legacy_county.GetName] was supposed to be settled business. But damaged, half-quiet places gather meaning the way ruins gather dust, and something has begun meeting there after dark — lamps in the lower galleries, offerings at the boundary markers, songs in a language the county does not speak. Whatever they worship, they found it under your ground."
 eotg_legacy_0103_opt_purge:0 "Purge it before it roots."
 eotg_legacy_0103_opt_infiltrate:0 "Infiltrate it. Learn its names first."
 eotg_legacy_0103_opt_tolerate:0 "Faith finds strange soil everywhere. Let it."
 eotg_legacy_0104_title:0 "The Exhausted Legacy"
 eotg_legacy_0104_desc:0 "The site beneath [eotg_legacy_county.GetName] has given everything it had, and the taking has consequences. Galleries collapse into galleries; the seam that held two worlds together shifts like a wound reopening. What was an inheritance is now a hole in the county — unstable, unprofitable, and not entirely finished changing."
 eotg_legacy_0104_opt_stabilize:0 "Stabilize the ruin, whatever it costs."
 eotg_legacy_0104_opt_abandon:0 "Abandon it to the seam."
 eotg_legacy_0104_opt_deeper:0 "The collapse has revealed a deeper layer..."
 eotg_legacy_0105_title:0 "The Seam Changes Hands"
 eotg_legacy_0105_desc:0 "With [eotg_legacy_county.GetName] comes everything under it. The stewards present the site's papers to their new lord: the charters granted, the debts outstanding, the arrangements a previous hand signed and a previous seal ratified. The Legacy does not care whose banner flies above it. Its obligations convey with the ground."
 eotg_legacy_0105_opt_honor:0 "Honour the standing arrangements."
 eotg_legacy_0105_opt_strip:0 "New lord, new ledger. Strip the old beneficiaries."
 eotg_legacy_0105_opt_reseal:0 "Whatever it was to them, it is closed to us."

 # ── County modifiers ─────────────────────────────────────────────────────────
 eotg_legacy_metropolis_governed:0 "Restored District"
 eotg_legacy_metropolis_governed_desc:0 "A recovered district of a vanished city-world lives again beneath this county, its streets lit for the first time in eight centuries."
 eotg_legacy_archive_governed:0 "Chartered Archive"
 eotg_legacy_archive_governed_desc:0 "A Second Era archive is kept here under a proper chain of custody, its records lending weight to the county's law."
 eotg_legacy_works_governed:0 "Audited Relic Works"
 eotg_legacy_works_governed_desc:0 "Second Era industry runs beneath this county under audited concessions, producing wealth at a sustainable burn."
 eotg_legacy_hellpocket_warded:0 "Warded Gate"
 eotg_legacy_hellpocket_warded_desc:0 "The infernal fragment beneath this county is contained under permanent watch, and the watchers are taken seriously."
 eotg_legacy_extracted_site:0 "Extraction Concessions"
 eotg_legacy_extracted_site_desc:0 "The Confluence site here is being stripped for value faster than it can ever be restored."
 eotg_legacy_sealed_site:0 "Sealed Site"
 eotg_legacy_sealed_site_desc:0 "The Confluence site here is closed, forbidden, and quiet — for now."
 eotg_legacy_unstable_site:0 "Unstable World-Seam"
 eotg_legacy_unstable_site_desc:0 "The seam where two worlds were fused has not agreed to be one place. The ground itself is unreliable."
 eotg_legacy_loyal_enclave:0 "Protected Enclave"
 eotg_legacy_loyal_enclave_desc:0 "A community recovered from the Confluence holds protected status here, and repays it in loyalty."
 eotg_legacy_grim_rumors:0 "Grim Rumors"
 eotg_legacy_grim_rumors_desc:0 "Abandoned surveyors, sealed galleries, songs after dark — the county repeats stories its lord would prefer it forgot."

 # ── Character modifiers ──────────────────────────────────────────────────────
 eotg_legacy_arsenal:0 "Relic Arsenal"
 eotg_legacy_arsenal_desc:0 "Second Era fabricators turn out arms and armor for the levies — equipment no living smith could copy."
 eotg_legacy_warden:0 "Warden of the Gate"
 eotg_legacy_warden_desc:0 "This ruler personally holds the wardenship of a contained infernal gate. The honor is immense. So is the weight."

 # ── Opinion modifiers (not Tiger-checked; players see these) ─────────────────
 eotg_legacy_claim_defied:0 "Dismissed Our Claim"
 eotg_legacy_taxed_concession:0 "Taxed Our Concession"
 eotg_legacy_concession_honored:0 "Honored Our Concession"
 eotg_legacy_enclave_protected:0 "Protected Our People"
