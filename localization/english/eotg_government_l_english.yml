 eotg_cartel_government_realm:0 "Cartel Realm"
 eotg_cartel_government_desc:0 "An organized syndicate grown into a state. A council of bosses rules smuggling routes, salvage and black markets through fear, and keeps its neighbours on a payment schedule. Dread is its currency, and the top is always under threat from within. It grows by tribute rather than raids. Vassals owe a loyalty tax and tribute from their territory."
