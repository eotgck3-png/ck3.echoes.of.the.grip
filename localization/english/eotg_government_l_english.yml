 eotg_corporation_government:0 "Corporation"
 eotg_corporation_government_adjective:0 "Corporate"
 eotg_corporation_government_realm:0 "Corporate Realm"
 eotg_corporation_government_desc:0 "A company state run by a board. Branch directors and operations chiefs hold territory for the company and scheme against one another for the board's favour, while the board above them plays a slow game of influence. Ports are its engine and Bastions its security. Vassals owe an assessment in cash and a small security levy."
