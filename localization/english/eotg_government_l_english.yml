 eotg_gobcorp_government:0 "Trade Oligarchy"
 eotg_gobcorp_government_adjective:0 "Oligarchic"
 eotg_gobcorp_government_realm:0 "Trade Oligarchy"
 eotg_gobcorp_government_desc:0 "Trade Princes are bound by a shared charter, each competing for market share, with no single head over them. Merchant houses and the muscle they bargain with sit side by side, partners of every stripe. Power is bought and counted, and every Prince keeps armies of their own. Ports carry the trade and Bastions guard it. Vassals owe market dues and a security levy, and rivalry inside the charter is as dangerous as war outside it."
