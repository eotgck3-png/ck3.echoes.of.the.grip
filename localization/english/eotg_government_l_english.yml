l_english:
 eotg_pmc_government:0 "PMC"
 eotg_pmc_government_adjective:0 "PMC"
 eotg_pmc_government_realm:0 "PMC Realm"
 eotg_pmc_government_desc:0 "A command hierarchy that sells force. Contractors hold territory in return for fees and fighting strength, and rank is earned by results in the field. Its Bastions are garrison posts and its Ports pay the bills. Vassals owe their ruler a fee and an operational levy rather than a pledge, and the ruler's best fighters serve as Operators."
 eotg_pmc_government_with_icon:0 "@government_type_mercenary! $eotg_pmc_government$"
 eotg_pmc_government_filter_option:0 "PMC"
 eotg_pmc_government_filter_option_desc:0 "Show only rulers who govern as a PMC."
