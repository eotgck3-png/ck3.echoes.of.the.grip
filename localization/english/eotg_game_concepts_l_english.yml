l_english:
 game_concept_eotg_augmentation:0 "Augmentation"
 game_concept_eotg_augmentation_desc:0 "Augmentation is the elective fitting of cybernetic implants. Hardware is bought and fitted: in clinics, by physicians, and by back-street fitters who ask fewer questions.\n\nA fitted character advances along [eotg_aug_integration|E]. The gains are real, and so are the costs: stress, wear on the body, and the risk of a fracture between the person and the machine.\n\nEach realm sets its own [eotg_aug_policy|E]. Rulers may ban implants, license them, tolerate them or favour them. A court may also keep an [eotg_implant_technician|E]."
 game_concept_eotg_implant:0 "Implant"
 game_concept_eotg_implants:0 "Implants"
 game_concept_eotg_aug_integration:0 "Integration"
 game_concept_eotg_aug_integration_desc:0 "Integration is how far the machine has been worked into a character. It is a single trait that advances in stages: Augmented, Enhanced and [eotg_overclocked|E].\n\nA character moves up a stage by choosing it or by accepting an offer of more work. A procedure can move a character back down.\n\nThe last step beyond the stages is [eotg_seamless|E]."
 game_concept_eotg_aug_stage:0 "Stage"
 game_concept_eotg_aug_stages:0 "Stages"
 game_concept_eotg_overclocked:0 "$trait_eotg_cybernetics_3$"
 game_concept_eotg_overclocked_desc:0 "Overclocked is the highest [eotg_aug_stage|E]. It gives the strongest benefits and the heaviest wear on the body.\n\nAn Overclocked character depends on upkeep. Neglected hardware is how a person drifts toward [eotg_neurofractured|E]."
 game_concept_eotg_neurofractured:0 "$trait_eotg_neurofractured$"
 game_concept_eotg_neurofractured_desc:0 "A fracture. The person and the machine no longer agree, and the character is not reliably themselves.\n\nExcision exists, and it is a hard procedure with no promise attached. Fitting too much, too fast, or keeping up too little, is how this begins."
 game_concept_eotg_seamless:0 "$trait_eotg_total_integration$"
 game_concept_eotg_seamless_desc:0 "Integration is complete. The machine's forecast and the person no longer differ, and no self remains apart from it. Seamless ends the self; it does not copy or store it. Events record a Seamless character as a log, never in the first person."
 game_concept_eotg_aug_policy:0 "Augmentation Law"
 game_concept_eotg_aug_policy_desc:0 "An Augmentation Law is a realm's position on implants. There are four: $eotg_aug_policy_ban$, $eotg_aug_policy_license$, $eotg_aug_policy_tolerate$ and $eotg_aug_policy_favor$.\n\nThe ruler at the head of the realm sets it, and it holds for the whole realm. No authority stands above the realm to set it for them.\n\nSee [eotg_augmentation|E] for what the law governs."
 game_concept_eotg_aug_policies:0 "Augmentation Laws"
 game_concept_eotg_implant_technician:0 "$eotg_aug_implant_technician_court_position$"
 game_concept_eotg_implant_technician_desc:0 "The Implant Technician is a [court_position|E] for a skilled fitter kept at court. Procedures done under their hand are cheaper and safer.\n\nA ruler can lend their technician to another court. Lending one is a favour that is remembered."
 game_concept_eotg_implant_technicians:0 "Implant Technicians"
 game_concept_eotg_frontier:0 "Frontier"
 game_concept_eotg_frontier_desc:0 "A Frontier is a project to settle a [county|E] that is Unsettled or abandoned. It is held by the holder of that Shoal and ends in one of two ways: a new holding, or failure.\n\nIt advances through [eotg_frontier_progress|E] and is held back by [eotg_frontier_strain|E]. A [eotg_frontier_founder|E] leads the work, and a [eotg_frontier_sponsor|E] may help pay for it."
 game_concept_eotg_frontiers:0 "Frontiers"
 game_concept_eotg_frontier_progress:0 "Frontier Progress"
 game_concept_eotg_frontier_progress_desc:0 "Frontier Progress grows each year from investment, infrastructure and events. It is the measure of how settled the place has become.\n\nReaching a new band, such as Foothold, opens more infrastructure slots. Progress is what a [eotg_frontier|E] needs to finish."
 game_concept_eotg_frontier_strain:0 "Strain"
 game_concept_eotg_frontier_strain_desc:0 "Strain is the hardship of the settlers. It rises when there is no [eotg_frontier_founder|E], when war or danger touches the Shoal, and when the settlers quarrel.\n\nAt the breaking point a [eotg_frontier|E] can fail, and the settlers go."
 game_concept_eotg_strain:0 "Strain"
 game_concept_eotg_frontier_founder:0 "Founder"
 game_concept_eotg_frontier_founder_desc:0 "The Founder leads the work on a [eotg_frontier|E]. Without one, [eotg_frontier_strain|E] climbs.\n\nA Founder is appointed by decision. On completion they may be named the [eotg_local_ruler|E]."
 game_concept_eotg_founder:0 "Founder"
 game_concept_eotg_founders:0 "Founders"
 game_concept_eotg_local_ruler:0 "Local Ruler"
 game_concept_eotg_local_ruler_desc:0 "When a [eotg_frontier|E] is completed, its [eotg_frontier_founder|E] may be given the new holding to rule.\n\nThe Local Ruler holds it from the one who held the Shoal."
 game_concept_eotg_local_rulers:0 "Local Rulers"
 game_concept_eotg_frontier_sponsor:0 "Backer"
 game_concept_eotg_frontier_sponsor_desc:0 "A Backer is another ruler who pays toward a [eotg_frontier|E].\n\nA Backer gains no claim on the Shoal and no say in how it is run. What they get is the goodwill of those they paid."
 game_concept_eotg_backer:0 "Backer"
 game_concept_eotg_backers:0 "Backers"
 game_concept_eotg_frontier_project:0 "Frontier Project"
 game_concept_eotg_frontier_project_desc:0 "A Frontier Project is the kind of work a [eotg_frontier|E] sets out to do. There are seven: Settlement, Trade, Mining, Military, Religious, Research and Administrative.\n\nThe type is chosen when the Frontier is established, and it shapes what the finished holding is good for."
 game_concept_eotg_frontier_projects:0 "Frontier Projects"
 game_concept_eotg_unsettled_region:0 "Unsettled Shoal"
 game_concept_eotg_unsettled_region_desc:0 "An Unsettled Shoal is a [county|E] whose Systems were never properly settled, or were abandoned. It is where a [eotg_frontier|E] can begin.\n\nCrews can chart it first. See [eotg_region_charts|E]."
 game_concept_eotg_unsettled_shoals:0 "Unsettled Shoals"
 game_concept_eotg_region_charts:0 "Shoal Charts"
 game_concept_eotg_region_charts_desc:0 "Shoal Charts record how much is known of a [county|E]. A Shoal is Unknown, Partial or Known.\n\nExpeditions chart a Shoal. A [eotg_frontier|E] begun there afterwards gets a head start."
 game_concept_eotg_unclaimed_region:0 "Unclaimed Shoal"
 game_concept_eotg_unclaimed_region_desc:0 "An Unclaimed Shoal is a [county|E] that no ruler holds. No court keeps it, and the [eotg_unsworn|E] live there.\n\nA ruler can take it with Raise Your Colours, at a cost in gold and prestige. Armies that enter one suffer attrition. No other body files, registers or recognizes the claim; it holds as long as the one who raised it can hold it."
 game_concept_eotg_unclaimed_shoals:0 "Unclaimed Shoals"
 game_concept_eotg_unsworn:0 "$trait_eotg_unclaimed_folk$"
 game_concept_eotg_unsworn_desc:0 "The Unsworn are the scattered people of an [eotg_unclaimed_region|E]. They have no court and no oath.\n\nA ruler who takes the Shoal inherits them as commoners, and they remember who came."
 game_concept_eotg_pmc:0 "$eotg_pmc_government$"
 game_concept_eotg_pmc_desc:0 "$eotg_pmc_government_desc$"
 game_concept_eotg_corporation:0 "$eotg_corporation_government$"
 game_concept_eotg_corporation_desc:0 "$eotg_corporation_government_desc$"
