l_english:
 eotg_decision_frontier_establish:0 "Establish a Frontier"
 eotg_decision_frontier_establish_desc:0 "One of your Regions has never been properly settled. Systems there remain open, and someone with resources and nerve could make something of them."
 eotg_decision_frontier_establish_tooltip:0 "Fund an expedition to one of your Unsettled or abandoned Regions and choose what it will build."
 eotg_decision_frontier_establish_confirm:0 "Send the expedition"
 eotg_decision_frontier_establish_gold_tt:0 "You can fund an expedition"
 eotg_decision_frontier_establish_peace_tt:0 "You are not at war"
 eotg_decision_frontier_establish_effect_tt:0 "Choose what the expedition will build in the selected Region."
 eotg_decision_frontier_establish_pick_tt:0 "The chosen Region is yours and open for settlement"
 eotg_decision_frontier_invest:0 "Invest in a Frontier"
 eotg_decision_frontier_invest_desc:0 "Send money, parts and people to one of your Frontier Regions."
 eotg_decision_frontier_invest_tooltip:0 "Send money, parts and people to one of your Frontiers. The work there moves faster."
 eotg_decision_frontier_invest_confirm:0 "Send the shipment"
 eotg_decision_frontier_invest_ready_tt:0 "A Frontier you hold has not been invested in this year"
 eotg_decision_frontier_invest_effect_tt:0 "The selected Frontier gets the shipment, and the work there moves faster."
 eotg_decision_frontier_invest_pick_tt:0 "The chosen Region is your Frontier, not yet invested in this year"
 eotg_decision_frontier_invest_waiting_tt:0 "This Frontier's work is done. It is waiting on the Region's development or your hold on it, and more money will not hurry that."
 eotg_decision_frontier_sponsor:0 "Back a Frontier"
 eotg_decision_frontier_sponsor_desc:0 "Other rulers are trying to settle the open places of the galaxy. You could put your money behind one of them. It buys you no claim and no say, only a part in whether the venture succeeds."
 eotg_decision_frontier_sponsor_tooltip:0 "Offer to back a Frontier another ruler holds. Its holder decides."
 eotg_decision_frontier_sponsor_confirm:0 "Look for a venture"
 eotg_decision_frontier_sponsor_effect_tt:0 "Choose a Frontier to back. Its holder decides whether to accept. Backing it gives you no claim on it."
 eotg_decision_frontier_withdraw:0 "Withdraw Your Backing"
 eotg_decision_frontier_withdraw_desc:0 "Stop paying for a Frontier you have been supporting."
 eotg_decision_frontier_withdraw_tooltip:0 "Stop paying for the Frontier you back."
 eotg_decision_frontier_withdraw_confirm:0 "Stop the payments"
 eotg_decision_frontier_withdraw_effect_tt:0 "The Frontier you back loses your support, and the settlers there will feel it."
 eotg_decision_frontier_abandon:0 "Abandon a Frontier"
 eotg_decision_frontier_abandon_desc:0 "Call off the work in one of your Frontiers. What was built stays where it stands, and someone may try again one day."
 eotg_decision_frontier_abandon_tooltip:0 "Call off the work in one of your Frontiers. It can be settled again later."
 eotg_decision_frontier_abandon_confirm:0 "Call them home"
 eotg_decision_frontier_abandon_effect_tt:0 "The selected Frontier is abandoned. Its ruins remain, and a later expedition will find the work easier."
 eotg_decision_frontier_abandon_pick_tt:0 "The chosen Region is your Frontier"
 eotg_decision_frontier_debug_mark_unsettled:0 "(Debug) Mark Capital Region Unsettled"
 eotg_decision_frontier_debug_mark_unsettled_desc:0 "Testing only. Marks your capital Region as Unsettled so a Frontier can be established there."
 eotg_decision_frontier_debug_mark_unsettled_tooltip:0 "Testing only: mark your capital Region Unsettled."
 eotg_decision_frontier_debug_mark_unsettled_confirm:0 "Mark it"
 eotg_decision_frontier_debug_mark_unsettled_valid_tt:0 "Your capital Region is not Unsettled, a Frontier or abandoned already"
 eotg_decision_frontier_debug_tick:0 "(Debug) Run the Frontier Year"
 eotg_decision_frontier_debug_tick_desc:0 "Testing only. Runs the yearly Frontier update on every Frontier you hold, now."
 eotg_decision_frontier_debug_tick_tooltip:0 "Testing only: run the yearly Frontier update now."
 eotg_decision_frontier_debug_tick_confirm:0 "Run it"
 eotg_frontier_mod_unsettled:0 "Unsettled Region"
 eotg_frontier_mod_unsettled_desc:0 "No permanent settlement has taken hold here yet. Systems remain open for settlement, along with whatever earlier travellers left behind."
 eotg_frontier_mod_outpost:0 "Frontier: Outpost"
 eotg_frontier_mod_outpost_desc:0 "The first stations are up and the first settlers have arrived. Almost everything here is still being built."
 eotg_frontier_mod_foothold:0 "Frontier: Foothold"
 eotg_frontier_mod_foothold_desc:0 "The Frontier is holding. Supply runs keep to a schedule, and the settlers have started to stay."
 eotg_frontier_mod_established:0 "Frontier: Nearly Settled"
 eotg_frontier_mod_established_desc:0 "The Frontier is thriving. A little more, and this Region will no longer be a Frontier at all."
 eotg_frontier_mod_waiting_development:0 "Frontier: Waiting on Development"
 eotg_frontier_mod_waiting_development_desc:0 "The settlers have done all they can for now. Before the Frontier can become a settlement, the Region itself needs to grow."
 eotg_frontier_mod_waiting_control:0 "Frontier: Waiting on Control"
 eotg_frontier_mod_waiting_control_desc:0 "The settlers have done all they can for now. Before the Frontier can become a settlement, your officials need a firmer hold on the Region."
 eotg_frontier_mod_new_settlement:0 "New Settlement"
 eotg_frontier_mod_new_settlement_desc:0 "The Frontier here has become a permanent settlement. Its first years are busy ones."
 eotg_frontier_mod_abandoned_works:0 "Abandoned Works"
 eotg_frontier_mod_abandoned_works_desc:0 "Empty stations and cold berths mark where an earlier attempt to settle this Region gave up."
 eotg_frontier_mod_hard_year:0 "Hard Year"
 eotg_frontier_mod_hard_year_desc:0 "The settlers were driven hard through a lean year, and the local order is the worse for it."
 eotg_frontier_toast_sponsor_inherited:0 "A Frontier's backer has died. The heir keeps up the support."
 eotg_frontier_toast_sponsor_lapsed:0 "A Frontier has lost its backer, and the settlers are feeling the gap."
 eotg_frontier_toast_faith_backer_succeeded:0 "A Frontier's backer has died. The faith's new leader takes over."
 eotg_frontier_toast_sponsor_withdrew:0 "A backer has withdrawn support from your Frontier."
 eotg_frontier_toast_sponsor_replaced:0 "A Frontier you backed has found a different backer."
 eotg_frontier.001.t:0 "An Opportunity Here"
 eotg_frontier.001.desc:0 "[eotg_frontier_county.GetName] has never been properly settled. Its Systems are open: rock and ice, a few hardy families, signals nobody has answered in years."
 eotg_frontier.001.desc_other:0 "\n\n[eotg_frontier_candidate.GetFirstName] has looked over the surveys and thinks it can be done. The question is what we build first."
 eotg_frontier.001.desc_self:0 "\n\nYou have looked over the surveys yourself, and it can be done. The question is what we build first."
 eotg_frontier.001.desc_resettle:0 "\n\nThis is not the first attempt. An earlier expedition left stations and records behind, and the next one will not be starting from nothing."
 eotg_frontier.001.a:0 "Settlers first. Homes, berths and the people to fill them."
 eotg_frontier.001.b:0 "A trading post. Trade will bring everything else."
 eotg_frontier.001.c:0 "There is ore out there. Mine it."
 eotg_frontier.001.d:0 "A garrison. Whoever holds it, holds the approaches."
 eotg_frontier.001.e:0 "A mission. People need something to believe in, out that far."
 eotg_frontier.001.f:0 "Study it first. Find out what is really out there."
 eotg_frontier.001.g:0 "Bring it into proper order: surveys, officials, records."
 eotg_frontier.001.h:0 "Not now."
 eotg_frontier.001.start_tt:0 "[eotg_frontier_county.GetName] becomes a Frontier, with [eotg_frontier_candidate.GetName] leading the work."
 eotg_frontier.001.start_self_tt:0 "[eotg_frontier_county.GetName] becomes a Frontier, with you leading the work."
 eotg_frontier.002.t:0 "A Hard Year"
 eotg_frontier.002.t_no_founder:0 "The Frontier Without a Founder"
 eotg_frontier.002.desc_low:0 "Word comes from [eotg_frontier_county.GetName]. A supply run was late, a pressure seal failed, and one of the outlying stations went dark for a week. Nothing that cannot be fixed, if it is fixed soon."
 eotg_frontier.002.desc_mid:0 "The reports from [eotg_frontier_county.GetName] have been getting shorter. Supplies are thin, tempers are short, and some of the settlers have started asking whether this was ever going to work."
 eotg_frontier.002.desc_high:0 "[eotg_frontier_county.GetName] is close to breaking. Stations are being stripped for parts to keep the others running, and the settlers want to know whether anyone back home still remembers the Frontier."
 eotg_frontier.002.desc_no_founder:0 "Nobody is leading the work in [eotg_frontier_county.GetName] any more. The crews keep going out of habit, but every week without someone in charge costs the Frontier."
 eotg_frontier.002.a:0 "Ship in supplies. Whatever they need."
 eotg_frontier.002.b:0 "Push through. They knew it would be hard."
 eotg_frontier.002.c:0 "Call on our backing. This is what it is for."
 eotg_frontier.002.d:0 "Send [eotg_frontier_candidate.GetFirstName]. [eotg_frontier_candidate.GetSheHe|U] will take charge."
 eotg_frontier.002.e:0 "I will lead it myself."
 eotg_frontier.002.f:0 "They will have to manage."
 eotg_frontier.002.ease_tt:0 "The pressure on the Frontier eases."
 eotg_frontier.002.push_tt:0 "The work goes faster, but the settlers pay for it."
 eotg_frontier.002.founder_tt:0 "The Frontier has someone to lead it again."
 eotg_frontier.002.f_tt:0 "Without a leader, the pressure on the Frontier keeps building."
 eotg_frontier.003.t:0 "An Offer of Backing"
 eotg_frontier.003.desc:0 "[eotg_frontier_sponsor.GetTitledFirstName] has heard about the work in [eotg_frontier_county.GetName], and offers to help pay for it: regular shipments of money and supplies for as long as the Frontier needs them.\n\nThe offer comes with no claim attached. If the Frontier succeeds, [eotg_frontier_sponsor.GetSheHe] will share the credit. If it fails, the loss."
 eotg_frontier.003.desc_replace:0 "\n\nThe Frontier already has a backer. Accepting would end that arrangement."
 eotg_frontier.003.a:0 "We accept, gladly."
 eotg_frontier.003.b:0 "We will manage without [eotg_frontier_sponsor.GetHerHim]."
 eotg_frontier.003.accept_tt:0 "[eotg_frontier_sponsor.GetName] backs the Frontier in [eotg_frontier_county.GetName], and the first shipment arrives at once."
 eotg_frontier.003.refuse_tt:0 "The Frontier stays as it is."
 eotg_frontier.004.t:0 "No Longer a Frontier"
 eotg_frontier.004.desc:0 "The last report from [eotg_frontier_county.GetName] reads differently from the others. There are no requests for supplies and no lists of what broke. The settlers write like people who intend to stay. [eotg_frontier_county.GetName] is no longer a Frontier."
 eotg_frontier.004.desc_settlement:0 "\n\nThe settlers have built homes, berths and a market, and they have already chosen someone to speak for them."
 eotg_frontier.004.desc_trade:0 "\n\nShips that used to pass through now stop. The trading post has become a real port of call."
 eotg_frontier.004.desc_mining:0 "\n\nThe mines are running steadily, and the ore is paying its way."
 eotg_frontier.004.desc_military:0 "\n\nThe garrison has dug in for good, and the approaches to the Region are watched day and night."
 eotg_frontier.004.desc_religious:0 "\n\nThe mission has put down roots, and the faithful have made the place their own."
 eotg_frontier.004.desc_research:0 "\n\nThe surveys are done. The ruins and strange readings that drew the researchers here have been mapped, and what was learned has been put to use."
 eotg_frontier.004.desc_administrative:0 "\n\nThe surveys are filed and the officials are in place. The Region answers to the realm like any other."
 eotg_frontier.004.a:0 "Pay [eotg_frontier_founder.GetFirstName] well, for all of it."
 eotg_frontier.004.b:0 "Honour [eotg_frontier_founder.GetFirstName] publicly. [eotg_frontier_founder.GetSheHe|U] earned it."
 eotg_frontier.004.c:0 "The work is its own reward."
 eotg_frontier.004.complete_tt:0 "[eotg_frontier_county.GetName] is settled. Anything newly built there is yours."
 eotg_frontier.005.t:0 "The Frontier Falters"
 eotg_frontier.005.desc:0 "[eotg_frontier_county.GetName] cannot go on as it is. The settlers are packing what can be carried, and the crews have stopped repairing anything not needed to survive."
 eotg_frontier.005.desc_no_founder:0 "\n\nNobody has led the work for too long, and nobody stepped up to take it on."
 eotg_frontier.005.desc_low_control:0 "\n\nYour officials never had much hold out here, and the settlers stopped looking to them."
 eotg_frontier.005.desc_occupied:0 "\n\nEnemy ships hold the Region. No supply run can get through."
 eotg_frontier.005.desc_war:0 "\n\nThe war has taken the ships, the money and the people the Frontier needed."
 eotg_frontier.005.desc_sponsor_lapsed:0 "\n\nThe money stopped. Without its backer, the Frontier could not pay its way."
 eotg_frontier.005.desc_hardship:0 "\n\nToo many hard years in a row. The settlers have nothing left to give."
 eotg_frontier.005.a:0 "Let it go."
 eotg_frontier.005.b:0 "New hands. Find someone else to lead it."
 eotg_frontier.005.c:0 "Scale it back to a plain settlement."
 eotg_frontier.005.d:0 "Call on our backer for everything the arrangement allows."
 eotg_frontier.005.abandon_tt:0 "The Frontier is abandoned. Its ruins remain, and a later attempt will find the work easier."
 eotg_frontier.005.restart_tt:0 "The Frontier survives, but half the work is lost."
 eotg_frontier.005.sponsor_tt:0 "Under the arrangement, the backer pays double, and the pressure on the Frontier eases a great deal."
 eotg_frontier.010.t:0 "Whom to Back"
 eotg_frontier.010.desc:0 "Other rulers are trying to settle open Regions, and some could use a backer. Whichever you choose, its holder will decide whether to take your money."
 eotg_frontier.010.desc_offer_3_late:0 "\n\n[eotg_frontier_offer_3.GetName]: nearly settled, needing only a final push."
 eotg_frontier.010.desc_offer_3_mid:0 "\n\n[eotg_frontier_offer_3.GetName]: holding on, with supply runs on a schedule."
 eotg_frontier.010.desc_offer_3_early:0 "\n\n[eotg_frontier_offer_3.GetName]: just begun, still mostly surveys and promises."
 eotg_frontier.010.desc_offer_2_late:0 "\n\n[eotg_frontier_offer_2.GetName]: nearly settled, needing only a final push."
 eotg_frontier.010.desc_offer_2_mid:0 "\n\n[eotg_frontier_offer_2.GetName]: holding on, with supply runs on a schedule."
 eotg_frontier.010.desc_offer_2_early:0 "\n\n[eotg_frontier_offer_2.GetName]: just begun, still mostly surveys and promises."
 eotg_frontier.010.desc_offer_1_late:0 "\n\n[eotg_frontier_offer_1.GetName]: nearly settled, needing only a final push."
 eotg_frontier.010.desc_offer_1_mid:0 "\n\n[eotg_frontier_offer_1.GetName]: holding on, with supply runs on a schedule."
 eotg_frontier.010.desc_offer_1_early:0 "\n\n[eotg_frontier_offer_1.GetName]: just begun, still mostly surveys and promises."
 eotg_frontier.010.a:0 "The work in [eotg_frontier_offer_1.GetName]."
 eotg_frontier.010.b:0 "The work in [eotg_frontier_offer_2.GetName]."
 eotg_frontier.010.c:0 "The work in [eotg_frontier_offer_3.GetName]."
 eotg_frontier.010.d:0 "On second thought, none of them."
 eotg_frontier.010.offer_tt:0 "Your offer goes to the Region's holder."
 eotg_frontier.option_passed:0 "The moment has passed."
 eotg_decision_frontier_debug_readout:0 "(Debug) Frontier Readout"
 eotg_decision_frontier_debug_readout_desc:0 "Testing only. Shows the hidden numbers of every Frontier you hold."
 eotg_decision_frontier_debug_readout_confirm:0 "Show them"
 eotg_decision_frontier_debug_readout_tooltip:0 "Testing only: show each Frontier's progress, strain and completion floors."
 # MakeScope.Var('x').GetValue|0: confirmed (coronation_activity_l_english.yml:675, 817). Debug only; the readout variables are set on this county before the toast. _waiting: a completion floor is not met yet.
 eotg_frontier_debug_readout_toast:0 "[eotg_frontier_county.GetName]: progress [eotg_frontier_county.MakeScope.Var('eotg_frontier_progress').GetValue|0]/100, strain [eotg_frontier_county.MakeScope.Var('eotg_frontier_strain').GetValue|0]/8, development [eotg_frontier_county.MakeScope.Var('eotg_frontier_debug_dev').GetValue|0] (needs [eotg_frontier_county.MakeScope.Var('eotg_frontier_debug_floor_dev').GetValue|0]), control [eotg_frontier_county.MakeScope.Var('eotg_frontier_debug_control').GetValue|0] (needs [eotg_frontier_county.MakeScope.Var('eotg_frontier_debug_floor_control').GetValue|0]). Floors met."
 eotg_frontier_debug_readout_toast_waiting:0 "[eotg_frontier_county.GetName]: progress [eotg_frontier_county.MakeScope.Var('eotg_frontier_progress').GetValue|0]/100, strain [eotg_frontier_county.MakeScope.Var('eotg_frontier_strain').GetValue|0]/8, development [eotg_frontier_county.MakeScope.Var('eotg_frontier_debug_dev').GetValue|0] (needs [eotg_frontier_county.MakeScope.Var('eotg_frontier_debug_floor_dev').GetValue|0]), control [eotg_frontier_county.MakeScope.Var('eotg_frontier_debug_control').GetValue|0] (needs [eotg_frontier_county.MakeScope.Var('eotg_frontier_debug_floor_control').GetValue|0]). Waiting on a floor."
 # == Phase 2 (docs/specs/frontier_v2.md) ===================================
 eotg_frontier.001.desc_known:0 "\n\nWe are not going in blind. Earlier surveys have already told us something about the place, and the choice should reflect it."
 eotg_frontier.005.desc_danger:0 "\n\nThe Region was never safe, and the crews could not hold it. Every lightly guarded convoy was a risk, and too many of those risks came due."
 eotg_frontier_toast_discovery:0 "The first expedition to [eotg_frontier_county.GetName] has reported back. The Region is now better known."
 eotg_frontier_trait_rich_resources:0 "Rich Resources"
 eotg_frontier_trait_rich_resources_desc:0 "Surveys of this Region show ore, ice and volatiles in quantities worth the trouble of getting them out."
 eotg_frontier_trait_trade_route:0 "Valuable Trade Route"
 eotg_frontier_trait_trade_route_desc:0 "Ships already pass through this Region on their way elsewhere. A place for them to stop would not stay empty for long."
 eotg_frontier_trait_strategic:0 "Strategic Location"
 eotg_frontier_trait_strategic_desc:0 "This Region sits across approaches that matter. Whoever holds it firmly holds more than the Region itself."
 eotg_frontier_trait_habitable:0 "Habitable"
 eotg_frontier_trait_habitable_desc:0 "Somewhere in this Region, people can live without sealed habitats around them. Settlers will come more readily."
 eotg_frontier_trait_ancient_ruins:0 "Ancient Ruins"
 eotg_frontier_trait_ancient_ruins_desc:0 "Ruins older than any record lie in this Region. Nobody knows who built them, and the people who study such things want to find out."
 eotg_frontier_trait_ancient_infrastructure:0 "Ancient Infrastructure"
 eotg_frontier_trait_ancient_infrastructure_desc:0 "Old stations and docks survive in this Region, battered but sound enough to build on."
 eotg_frontier_trait_anomalous:0 "Anomalous"
 eotg_frontier_trait_anomalous_desc:0 "The instruments in this Region return readings nobody can account for. Researchers find it irresistible; work crews find it unsettling."
 eotg_frontier_trait_hostile:0 "Hostile Environment"
 eotg_frontier_trait_hostile_desc:0 "Radiation, cold and bad air make every day in this Region a fight. Without proper shelter, the settlers never get a rest from it."
 eotg_frontier_trait_remote:0 "Remote"
 eotg_frontier_trait_remote_desc:0 "This Region is a long way from anywhere. Supply runs take longer, and nobody expects it to be held as tightly as the core of the realm."
 eotg_frontier_trait_dangerous:0 "Dangerous"
 eotg_frontier_trait_dangerous_desc:0 "Raiders, wreckers and worse use this Region. A weakly held settlement here is a target."
 eotg_frontier_infra_habitat:0 "Frontier Habitat"
 eotg_frontier_infra_habitat_desc:0 "Pressurized homes and berths for the settlers, built to last."
 eotg_frontier_infra_orbital_station:0 "Frontier Orbital Station"
 eotg_frontier_infra_orbital_station_desc:0 "A station in orbit gives the work crews a safe place to live and work from, however hostile the ground below."
 eotg_frontier_infra_navigation_beacon:0 "Frontier Navigation Beacon"
 eotg_frontier_infra_navigation_beacon_desc:0 "A beacon marks the approaches, and pilots who once avoided the Region now find their way in."
 eotg_frontier_infra_trade_station:0 "Frontier Trade Station"
 eotg_frontier_infra_trade_station_desc:0 "Docks, warehouses and a market for passing ships. Trade has somewhere to stop."
 eotg_frontier_infra_mining_complex:0 "Frontier Mining Complex"
 eotg_frontier_infra_mining_complex_desc:0 "Extractors, smelters and the crews to run them. The Region's resources are starting to pay."
 eotg_frontier_infra_research_facility:0 "Frontier Research Facility"
 eotg_frontier_infra_research_facility_desc:0 "Laboratories and survey stores where what the Region holds can be studied properly."
 eotg_frontier_infra_mission:0 "Frontier Mission"
 eotg_frontier_infra_mission_desc:0 "A place to gather and to worship. The faithful have made the Frontier feel less far from home."
 eotg_frontier_infra_garrison_post:0 "Frontier Garrison Post"
 eotg_frontier_infra_garrison_post_desc:0 "A fortified post with a standing garrison. Raiders now think twice about this Region."
 eotg_frontier_mod_legacy_trade:0 "Frontier Legacy: Trade"
 eotg_frontier_mod_legacy_trade_desc:0 "The Frontier left this Region a place where ships stop and goods change hands."
 eotg_frontier_mod_legacy_industry:0 "Frontier Legacy: Industry"
 eotg_frontier_mod_legacy_industry_desc:0 "The Frontier left this Region its mines and works, and the trade in what they produce."
 eotg_frontier_mod_legacy_defence:0 "Frontier Legacy: Defence"
 eotg_frontier_mod_legacy_defence_desc:0 "The Frontier left this Region well guarded, with people used to holding what is theirs."
 eotg_frontier_mod_legacy_learning:0 "Frontier Legacy: Learning"
 eotg_frontier_mod_legacy_learning_desc:0 "The Frontier left this Region its surveys, its records and the habit of study."
 eotg_frontier_mod_legacy_faith:0 "Frontier Legacy: Faith"
 eotg_frontier_mod_legacy_faith_desc:0 "The Frontier's mission became the Region's heart, and its people still gather there."
 eotg_frontier_mod_concessions:0 "Settlers' Terms"
 eotg_frontier_mod_concessions_desc:0 "The settlers were granted lighter dues while the Frontier finds its feet, and they have not forgotten it."
 eotg_frontier_opinion_pleased:0 "Pleased by Frontier Dealings"
 eotg_frontier_opinion_slighted:0 "Slighted over a Frontier"
 eotg_frontier_opinion_dropped:0 "Dropped as a Frontier's Backer"
 eotg_decision_frontier_survey:0 "Survey a Region"
 eotg_decision_frontier_survey_desc:0 "Send a survey team to one of your Regions that is still open for settlement, and learn what is really there before committing to it."
 eotg_decision_frontier_survey_tooltip:0 "Survey one of your Unsettled, Abandoned or Frontier Regions and learn something about it."
 eotg_decision_frontier_survey_confirm:0 "Send the survey team"
 eotg_decision_frontier_survey_effect_tt:0 "A survey team goes to the selected Region."
 eotg_decision_frontier_survey_pick_tt:0 "The chosen Region is yours and still has something to learn"
 eotg_decision_frontier_build:0 "Build Frontier Infrastructure"
 eotg_decision_frontier_build_desc:0 "Fund something lasting in one of your Frontier Regions: homes, a station, a beacon, or whatever the project needs most."
 eotg_decision_frontier_build_tooltip:0 "Build infrastructure in one of your Frontiers. It speeds the work there, and it lasts once the Region is settled."
 eotg_decision_frontier_build_confirm:0 "Choose what to build"
 eotg_decision_frontier_build_room_tt:0 "A Frontier you hold has room to build, and nothing was built there this year"
 eotg_decision_frontier_build_gold_tt:0 "You can pay for the work"
 eotg_decision_frontier_build_effect_tt:0 "Pick what to build in the selected Frontier."
 eotg_decision_frontier_build_pick_tt:0 "The chosen Region is your Frontier, with room to build and nothing built there this year"
 eotg_frontier.020.t:0 "Survey Report"
 eotg_frontier.020.desc:0 "The survey team is back from [eotg_frontier_county.GetName], with charts, samples and more opinions than anyone asked for."
 eotg_frontier.020.desc_rich_resources:0 "\n\nThe samples are the news. Ore, ice and volatiles, in quantities worth digging for."
 eotg_frontier.020.desc_trade_route:0 "\n\nThe team counted the ships passing through, and there were more than anyone expected. The Region sits on a route people already use."
 eotg_frontier.020.desc_strategic:0 "\n\nThe charts make it plain: the Region sits across approaches that matter. Whoever holds it watches who comes and goes."
 eotg_frontier.020.desc_habitable:0 "\n\nThe best of it is that people can live there. Hard living, but living, without the sealed habitats the rest of the Region would demand."
 eotg_frontier.020.desc_ancient_ruins:0 "\n\nThe team found ruins, older than any record, and could not say who built them."
 eotg_frontier.020.desc_ancient_infrastructure:0 "\n\nThe team found old stations and docks, battered but sound. Someone built here long ago, and some of it can be used again."
 eotg_frontier.020.desc_anomalous:0 "\n\nThe instruments returned readings nobody can explain. The researchers want to go back; the pilots would rather not."
 eotg_frontier.020.desc_hostile:0 "\n\nThe report is grim reading. Radiation, cold and bad air: nobody will live there without proper shelter."
 eotg_frontier.020.desc_remote:0 "\n\nMostly the report is about distance. The Region is a long way from anywhere, and every supply run will take its time."
 eotg_frontier.020.desc_dangerous:0 "\n\nThe team was shadowed most of the way, and one of its ships came back holed. Raiders know the Region well."
 eotg_frontier.020.desc_nothing:0 "\n\nThe report adds little to what was already known."
 eotg_frontier.020.a:0 "File the report."
 eotg_frontier.020.b:0 "Send them back in, deeper."
 eotg_frontier.020.progress_tt:0 "The work in the Frontier moves a little faster for the survey."
 eotg_frontier.020.data_tt:0 "The report is kept on file. Whoever settles the Region next will start ahead."
 eotg_frontier.020.deeper_tt:0 "The team goes back for a second, closer look, and may learn more about the Region."
 eotg_frontier.021.t:0 "What to Build"
 eotg_frontier.021.desc:0 "The crews in [eotg_frontier_county.GetName] have sent up a list of everything the work needs, and it is a long one. There is money for one thing this year. What will it be?"
 eotg_frontier.021.a:0 "Homes and berths. A habitat for the settlers."
 eotg_frontier.021.b:0 "An orbital station to work from."
 eotg_frontier.021.c:0 "A navigation beacon on the approaches."
 eotg_frontier.021.d:0 "A trade station for passing ships."
 eotg_frontier.021.e:0 "A mining complex."
 eotg_frontier.021.f:0 "A research facility."
 eotg_frontier.021.g:0 "A mission for the faithful."
 eotg_frontier.021.h:0 "A garrison post."
 eotg_frontier.021.i:0 "Nothing this year."
 eotg_frontier.021.a_tt:0 "The Frontier grows faster, especially a settlement. Once settled, the Region keeps the homes."
 eotg_frontier.021.b_tt:0 "The Frontier grows faster, especially an administrative one, and a hostile Region troubles the settlers less. Once settled, the Region is easier to hold."
 eotg_frontier.021.c_tt:0 "The Frontier grows faster, and in a remote Region the distance tells less and supply runs go astray less often. Once settled, the Region keeps the traffic."
 eotg_frontier.021.d_tt:0 "The Frontier grows faster, especially a trading post. Once settled, the Region keeps a trade it can tax."
 eotg_frontier.021.e_tt:0 "The Frontier grows faster, especially a mining venture. Once settled, the Region keeps its industry."
 eotg_frontier.021.f_tt:0 "The Frontier grows faster, especially a research venture. Once settled, the Region keeps the habit of study."
 eotg_frontier.021.g_tt:0 "The Frontier grows faster, especially a mission. Once settled, the faithful keep the Region close."
 eotg_frontier.021.h_tt:0 "The Frontier grows faster, especially a garrison, and raiders stop troubling a dangerous Region. Once settled, the Region is well defended."
 eotg_frontier.030.t:0 "A Rival Backer"
 eotg_frontier.030.desc:0 "[eotg_frontier_rival.GetTitledFirstName] has been watching the work in [eotg_frontier_county.GetName], and offers to back it on better terms than [eotg_frontier_sponsor.GetFirstName] does.\n\nTaking the offer would mean ending the arrangement with [eotg_frontier_sponsor.GetFirstName], who will not take it kindly. Neither of them would gain any claim on the Region either way."
 eotg_frontier.030.a:0 "Better terms are better terms."
 eotg_frontier.030.b:0 "We keep faith with [eotg_frontier_sponsor.GetFirstName]."
 eotg_frontier.030.a_tt:0 "[eotg_frontier_rival.GetName] backs the Frontier in [eotg_frontier_county.GetName] instead, and the first shipment arrives at once."
 eotg_frontier.031.t:0 "The Backer Wants a Say"
 eotg_frontier.031.desc:0 "[eotg_frontier_sponsor.GetTitledFirstName] has paid for a good part of the work in [eotg_frontier_county.GetName], and now wants a voice in how the Region is run: who is appointed, what is built, where the money goes.\n\nThat is not [eotg_frontier_sponsor.GetHerHis] to have. The Region is yours, under your law and nobody else's, and the backing never came with a say. Still, [eotg_frontier_sponsor.GetSheHe] will want something for [eotg_frontier_sponsor.GetHerHis] trouble."
 eotg_frontier.031.a:0 "The Region is mine. Your money buys no say in it."
 eotg_frontier.031.b:0 "Let [eotg_frontier_sponsor.GetHerHim] share the honour instead."
 eotg_frontier.031.c:0 "Offer [eotg_frontier_sponsor.GetHerHim] a share of the first returns."
 eotg_frontier.031.a_tt:0 "The backing continues, but the friction slows the work and costs the settlers."
 eotg_frontier.031.no_say_tt:0 "[eotg_frontier_sponsor.GetName] gains no claim on the Region and no say in how it is run."
 eotg_frontier.032.t:0 "Terms Demanded"
 eotg_frontier.032.desc_settlers:0 "The settlers in [eotg_frontier_county.GetName] have chosen spokespeople, and the spokespeople have a list. Lighter dues while the Frontier finds its feet.\n\nThe work is hard, and the settlers are right to say so. But the settlers are not the only ones who paid for it."
 eotg_frontier.032.desc_liege:0 "[eotg_frontier_overlord.GetTitledFirstName] has heard how well the work in [eotg_frontier_county.GetName] is going, and expects a share of what it will bring. As your liege, [eotg_frontier_overlord.GetSheHe] is entitled to ask; whether [eotg_frontier_overlord.GetSheHe] is entitled to this much is another matter."
 eotg_frontier.032.a:0 "Grant the terms. A content camp works harder."
 eotg_frontier.032.b:0 "Refuse. The terms stand as they are."
 eotg_frontier.032.c:0 "Talk them round."
 eotg_frontier.032.d:0 "Pay the share."
 eotg_frontier.032.c_liege:0 "Talk [eotg_frontier_overlord.GetHerHim] round."
 eotg_frontier.032.b_tt:0 "The refusal sours the mood, and the settlers feel it."
 eotg_frontier.033.t:0 "A Quarrel in the Camps"
 eotg_frontier.033.desc:0 "[eotg_frontier_founder.GetFirstName] wants the crews in [eotg_frontier_county.GetName] working longer shifts until the next stage is done. The crews say they are already working all the hours there are, and some have stopped working at all until someone listens.\n\nBoth sides are waiting to hear from you."
 eotg_frontier.033.a:0 "Back [eotg_frontier_founder.GetFirstName]. The work comes first."
 eotg_frontier.033.b:0 "Side with the settlers. Nobody works well exhausted."
 eotg_frontier.033.c:0 "I will settle this myself, and pay what it takes."
 eotg_frontier.033.b_tt:0 "The settlers rest, the pressure eases, and the work slows for a while."
 eotg_frontier.034.t:0 "A Supply Run Lost"
 eotg_frontier.034.desc:0 "A supply run bound for [eotg_frontier_county.GetName] never arrived. Its cargo was spare parts, medicine and food: what the Frontier needs most and has least of."
 eotg_frontier.034.desc_remote:0 "\n\nThe Region is so far out that by the time anyone noticed the run was missing, there was no trace of it left to find."
 eotg_frontier.034.desc_dangerous:0 "\n\nWreckage was found later. Raiders had been waiting for it."
 eotg_frontier.034.a:0 "Replace it at once, whatever it costs."
 eotg_frontier.034.b:0 "Make do with what they have."
 eotg_frontier.034.c:0 "Our backer covers the loss, as arranged."
 eotg_frontier.034.a_tt:0 "A second run sets out, and the Frontier barely feels the loss."
 eotg_frontier.034.b_tt:0 "The settlers go without, and the work slows."
 eotg_frontier.034.c_tt:0 "Under the arrangement, the backer pays for a second run."
 eotg_frontier.035.t:0 "What the Crews Found"
 eotg_frontier.035.desc_ruins:0 "Crews clearing a site in [eotg_frontier_county.GetName] broke into something nobody expected: ruins, older than any record, half buried and wholly silent. Nobody can say who built the place.\n\nThe crews want to know whether to stop and look, or to carry on."
 eotg_frontier.035.desc_derelict:0 "Among the ruins in [eotg_frontier_county.GetName], the crews have found a derelict station that is not ruined at all. Its frame is sound and some of its systems might be made to run again.\n\nRestoring it would take time. Stripping it would take a single shift."
 eotg_frontier.035.a:0 "Stop the work and study the ruins properly."
 eotg_frontier.035.b:0 "Strip it for parts. We need them now."
 eotg_frontier.035.c:0 "Restore it. It will serve us for years."
 eotg_frontier.035.a_tt:0 "The ruins are surveyed and recorded. The work pauses, unless the Frontier is a research venture, which has found exactly what it came for."
 eotg_frontier.035.b_tt:0 "The salvage goes straight into the Frontier, and the work leaps ahead."
 eotg_frontier.035.c_tt:0 "The restoration costs the crews some time now, and the Region gains old infrastructure to build on."
 eotg_frontier.036.t:0 "A Rich Seam"
 eotg_frontier.036.desc:0 "A survey crew in [eotg_frontier_county.GetName] has struck a seam richer than anything on the charts. The crew chief wants to start cutting tomorrow. The surveyors want to know how far it runs first."
 eotg_frontier.036.a:0 "Survey it properly first."
 eotg_frontier.036.b:0 "Start cutting. We need it now."
 eotg_frontier.036.a_tt:0 "The seam is charted, and the Region is known to be rich in resources."
 # == Expansion B1 (frontier_v2.md §B1): Phase 1 events react to traits =====
 eotg_frontier.002.desc_hostile:0 "\n\nThe place itself is part of the trouble. Without proper shelter, the cold and the bad air wear everyone down."
 eotg_frontier.002.desc_remote:0 "\n\nAnd everything takes longer out there. By the time help arrives, the problem has usually grown."
 eotg_frontier.002.desc_dangerous:0 "\n\nRaiders have been seen near the outlying stations again, and nobody sleeps well."
 eotg_frontier.004.desc_built_much:0 "\n\nWhat the Frontier built stays: the stations, the works and the people who ran them are part of the Region now."
 eotg_frontier.004.desc_studied:0 "\n\nThe surveys of what was found here are filed, and they will be read for years."
 eotg_frontier.004.desc_hard_won:0 "\n\nNothing about this Region made it easy. That it was settled at all will be remembered."
 # == Expansion B2 (frontier_v2.md §B2): salvage on resettlement ==============
 eotg_frontier.001.desc_salvage:0 "\n\nSome of what the last attempt built is still standing. Stripped and patched, it will give the new expedition a start."
 # == Expansion B3 (frontier_v2.md §B3): the ruins study reports back ========
 eotg_frontier.037.t:0 "What the Ruins Held"
 eotg_frontier.037.desc:0 "The study of the ruins in [eotg_frontier_county.GetName] is finished, or as finished as such things get. Nobody can yet say who built the place. But whoever it was knew how to make things last out here, and some of the old methods still work."
 eotg_frontier.037.a:0 "Share what was learned. Let everyone know who found it."
 eotg_frontier.037.b:0 "Keep it for the Frontier's own crews."
 eotg_frontier.037.a_tt:0 "The findings bring you some renown, and draw skilled people to the Frontier."
 eotg_frontier.037.b_tt:0 "The crews put the old methods to work at once."
 # == Phase 3a (frontier_v3.md): Exploration =================================
 eotg_frontier_mod_unknown:0 "Unexplored Region"
 eotg_frontier_mod_unknown_desc:0 "This Region has never been properly charted. Until an expedition goes in, what lies there is anyone's guess, and settlers will not risk it."
 eotg_frontier_mod_partial:0 "Partly Explored Region"
 eotg_frontier_mod_partial_desc:0 "An expedition has charted part of this Region. There is more to learn, but it is open for settlement."
 eotg_decision_frontier_explore:0 "Send an Expedition"
 eotg_decision_frontier_explore_desc:0 "A Region within reach has never been properly charted. Send ships and surveyors in to find out what is there."
 eotg_decision_frontier_explore_tooltip:0 "Send an expedition into an unexplored or partly explored Region: one of yours, or an Unclaimed Region within reach."
 eotg_decision_frontier_explore_confirm:0 "Send the expedition"
 eotg_decision_frontier_explore_effect_tt:0 "An expedition goes into the selected Region and charts what it finds."
 eotg_decision_frontier_explore_pick_tt:0 "The chosen Region is unexplored or partly explored, had no expedition this year, and is yours or an Unclaimed Region within reach"
 eotg_decision_frontier_debug_mark_unknown:0 "(Debug) Mark Capital Region Unknown"
 eotg_decision_frontier_debug_mark_unknown_desc:0 "Testing only. Marks your capital Region as unexplored, and Unsettled, so exploration can be tested there."
 eotg_decision_frontier_debug_mark_unknown_tooltip:0 "Testing only: mark your capital Region unexplored."
 eotg_decision_frontier_debug_mark_unknown_confirm:0 "Mark it"
 eotg_frontier.042.t:0 "The Expedition Returns"
 eotg_frontier.042.desc:0 "The expedition to [eotg_frontier_county.GetName] is back, short of fuel and long on stories."
 eotg_frontier.042.desc_partial:0 "\n\nThe crews charted the approaches and the nearest Systems, enough to say what kind of place it is. The far side of the Region is still a blank on the charts."
 eotg_frontier.042.desc_known:0 "\n\nThis time the expedition went all the way through. [eotg_frontier_county.GetName] is charted end to end, and the last of the blanks are filled in."
 eotg_frontier.042.desc_nothing:0 "\n\nThe crews found little that was not already known."
 eotg_frontier.042.a:0 "File the charts."
 eotg_frontier.042.b:0 "Send them straight back out."
 eotg_frontier.042.a_partial_tt:0 "The charts are filed. The rest of the Region waits for the next expedition."
 eotg_frontier.042.b_tt:0 "The expedition turns around and charts the rest of the Region now."
 # == Phase 3a (frontier_v3.md): Mercenaries ================================
 eotg_frontier_mod_merc_escort:0 "Mercenary Escort"
 eotg_frontier_mod_merc_escort_desc:0 "A hired company flies with the convoys. Raiders who once preyed on the Region now look for easier work."
 eotg_frontier.040.t:0 "Guns for Hire"
 eotg_frontier.040.desc:0 "[eotg_frontier_company.GetTitledFirstName] has heard about the work in [eotg_frontier_county.GetName], and about the trouble on its approaches. [eotg_frontier_company.GetSheHe|U] leads a mercenary company that is looking for steady work, and offers it: guards for the convoys, for a fee.\n\nA contract buys the company's guns and its ships, and nothing more. The Region stays yours."
 eotg_frontier.040.desc_military:0 "[eotg_frontier_company.GetTitledFirstName] has heard that [eotg_frontier_county.GetName] is being taken by force. [eotg_frontier_company.GetSheHe|U] leads a mercenary company looking for steady work, and offers to put its money behind the venture.\n\nA contract buys the company's guns and its ships, and nothing more. The Region stays yours."
 eotg_frontier.040.desc_none:0 "Word came of a mercenary company looking for work near [eotg_frontier_county.GetName], but by the time anyone went to find it, it had moved on."
 eotg_frontier.040.a:0 "Hire them to guard the convoys."
 eotg_frontier.040.b:0 "Let the company back the venture."
 eotg_frontier.040.c:0 "We will hold it ourselves."
 eotg_frontier.040.a_tt:0 "The company guards the convoys for five years, and while it does, the Region's dangers no longer slow the work. The pressure on the Frontier eases."
 eotg_frontier.040.b_tt:0 "[eotg_frontier_company.GetName] backs the Frontier in [eotg_frontier_county.GetName] and pays toward it each year, with the first shipment at once. The company gains no claim on the Region and no say in how it is run."
 # == Phase 3a (frontier_v3.md): Religious organizations ====================
 eotg_frontier_fervor_mission_settled:0 "A Frontier mission became a settlement"
 eotg_frontier.041.t:0 "A Faithful Offer"
 eotg_frontier.041.desc_head:0 "Word of the mission in [eotg_frontier_county.GetName] has reached [eotg_frontier_faith_backer.GetTitledFirstName], who leads your faith. [eotg_frontier_faith_backer.GetSheHe|U] offers to help pay for the work, or at least to give it [eotg_frontier_faith_backer.GetHerHis] blessing.\n\nWhatever [eotg_frontier_faith_backer.GetSheHe] gives, the Region stays yours. Backing a mission brings no claim on it, no say in how it is run and no authority over it."
 eotg_frontier.041.desc_order:0 "Word of the mission in [eotg_frontier_county.GetName] has reached a holy order of your faith. [eotg_frontier_faith_backer.GetTitledFirstName], who leads it, offers to help pay for the work, or at least to give it the order's blessing.\n\nWhatever the order gives, the Region stays yours. Backing a mission brings no claim on it, no say in how it is run and no authority over it."
 eotg_frontier.041.desc_none:0 "The faithful in [eotg_frontier_county.GetName] had hoped for help from the wider faith, but none has come."
 eotg_frontier.041.a:0 "Accept the backing, gladly."
 eotg_frontier.041.b:0 "Ask only for a blessing."
 eotg_frontier.041.c:0 "The mission stands on its own."
 eotg_frontier.041.a_tt:0 "[eotg_frontier_faith_backer.GetName] backs the Frontier in [eotg_frontier_county.GetName] and pays toward it each year, with the first shipment at once. The backer gains no claim on the Region, no say in how it is run and no authority over it."
 eotg_frontier.041.b_tt:0 "The blessing lifts the settlers' spirits, and the work goes a little faster."

 # event_quality_v1 W3: outcome toasts and messages (title-only)
 eotg_frontier_toast_milestone_2:0 "The Frontier Nears Completion"
 eotg_frontier_toast_milestone_1:0 "The Frontier Takes Hold"
