 eotg_court_seat_castle:0 "bastion"
 eotg_court_seat_city:0 "port"
 eotg_court_seat_church:0 "sanctum"
 eotg_court_seat_tribal:0 "clanhold"
 # STOPGAP: the glossary has no word for these three 1.20 holdings (CB-08).
 eotg_court_seat_nomad:0 "encampment"
 eotg_court_seat_herder:0 "camp"
 eotg_court_seat_temple_citadel:0 "citadel"
