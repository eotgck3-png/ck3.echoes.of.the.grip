 l_english:
 # ── Cartel Government ──────────────────────────────────────────────────────────

 eotg_cartel_government:0 "Cartel"
 eotg_cartel_government_adjective:0 "Cartel"
 eotg_cartel_government_realm:0 "Syndicate"
 eotg_cartel_government_desc:0 "A criminal enterprise that has achieved statehood. Dread is the currency of power. The Grand Underlord rules through fear, Loyalty Tax demands, and the threat of violent purge. Those who stop projecting strength invite their own destruction."

 # ── Customizable Localization ──────────────────────────────────────────────────

 eotg_holding_name_cartel:0 "Den"
 eotg_vassal_tier_one_cartel:0 "Street Lord"
 eotg_vassal_tier_two_cartel:0 "Underboss"
 eotg_vassal_tier_three_cartel:0 "Boss"
 eotg_ruler_title_cartel_male:0 "Grand Underlord"
 eotg_ruler_title_cartel_female:0 "Grand Underlord"
 eotg_realm_name_cartel:0 "The Syndicate"
 eotg_succession_flavor_cartel:0 "The organization has a new head. The violence was... expected."
 eotg_faction_name_cartel:0 "The Outfit"

 # ── Contract Obligations ───────────────────────────────────────────────────────

 eotg_cartel_vassal:0 "Cartel Obligations"
 eotg_cartel_vassal_desc:0 "The terms under which Bosses serve the Grand Underlord."

 eotg_cartel_loyalty_tax:0 "Loyalty Tax"
 eotg_cartel_loyalty_tax_desc:0 "The Grand Underlord's primary revenue extraction. Higher rates fund power at the cost of Boss loyalty."

 eotg_cartel_tax_token:0 "Token Payment"
 eotg_cartel_tax_token_short:0 "Token"
 eotg_cartel_tax_token_desc:0 "A minimal tribute — enough to acknowledge the Grand Underlord's authority without straining the territory."

 eotg_cartel_tax_standard:0 "Standard Tribute"
 eotg_cartel_tax_standard_short:0 "Standard"
 eotg_cartel_tax_standard_desc:0 "The expected share of territorial earnings. Sustainable but resented."

 eotg_cartel_tax_heavy:0 "Heavy Extraction"
 eotg_cartel_tax_heavy_short:0 "Heavy"
 eotg_cartel_tax_heavy_desc:0 "The Grand Underlord takes an aggressive cut. Bosses will remember."

 eotg_cartel_territory_tribute:0 "Territory Tribute"
 eotg_cartel_territory_tribute_desc:0 "Muscle provided to the Grand Underlord's operations. Street Lords and Underbosses field enforcer gangs."

 eotg_cartel_tribute_minimal:0 "Light Commitment"
 eotg_cartel_tribute_minimal_short:0 "Light"
 eotg_cartel_tribute_minimal_desc:0 "Token muscle. Enough to show solidarity, not enough to matter in a real fight."

 eotg_cartel_tribute_full:0 "Full Mobilization"
 eotg_cartel_tribute_full_short:0 "Full"
 eotg_cartel_tribute_full_desc:0 "Every available enforcer deployed for the Grand Underlord's campaigns."

 eotg_cartel_enforcement_rights:0 "Enforcement Rights"
 eotg_cartel_enforcement_rights_desc:0 "The right to run operations — raiding, extortion, enforcement — through Boss territory without restriction."

 eotg_cartel_enforcement_none:0 "Restricted Operations"
 eotg_cartel_enforcement_none_short:0 "Restricted"
 eotg_cartel_enforcement_none_desc:0 "The Grand Underlord's agents operate with Boss approval only."

 eotg_cartel_enforcement_granted:0 "Open Operations"
 eotg_cartel_enforcement_granted_short:0 "Open"
 eotg_cartel_enforcement_granted_desc:0 "The Grand Underlord's agents move freely through the territory. The Boss does not ask questions."

 # ── Decisions ─────────────────────────────────────────────────────────────────

 eotg_cartel_demand_loyalty_tax:0 "Demand Loyalty Tax"
 eotg_cartel_demand_loyalty_tax_confirm:0 "Send collectors to all Bosses. Those who refuse will face consequences."
 eotg_cartel_demand_loyalty_tax_desc:0 "Send collectors to all Bosses. Those who pay acknowledge your authority. Those who refuse invite consequences."
 eotg_cartel_demand_loyalty_tax_tooltip:0 "Demand payment from all Bosses under your authority."
 eotg_cartel_demand_loyalty_tax_effect_tooltip:0 "All Bosses will receive a demand event. Payment replenishes dread and prestige. Refusal costs prestige and accelerates dread decay."

 eotg_cartel_join_shakedown_faction:0 "Join the Shakedown Faction"
 eotg_cartel_join_shakedown_faction_confirm:0 "Commit to the Shakedown faction and demand reduced Loyalty Tax."
 eotg_cartel_join_shakedown_desc:0 "The Grand Underlord's dread has slipped. An opportunity to demand a permanent reduction in the Loyalty Tax rate — collectively, the Bosses have leverage."
 eotg_cartel_join_shakedown_tooltip:0 "Join other Bosses demanding reduced Loyalty Tax."
 eotg_cartel_join_shakedown_effect_tooltip:0 "You commit to the Shakedown faction. When enough Bosses join, the Grand Underlord must negotiate or escalate."

 eotg_cartel_hostile_takeover:0 "Declare Hostile Takeover"
 eotg_cartel_hostile_takeover_confirm:0 "Press your claim against the Grand Underlord. Civil war begins."
 eotg_cartel_hostile_takeover_desc:0 "The Grand Underlord is weak. Press your claim on the empire title. Seize control through force — the organization will fall in line once the blood dries."
 eotg_cartel_hostile_takeover_tooltip:0 "Press your claim against the vulnerable Grand Underlord."
 eotg_cartel_hostile_takeover_war_tooltip:0 "The Hostile Takeover faction has declared. Civil war for the Grand Underlord title is now active."
 eotg_cartel_hostile_takeover_active_tooltip:0 "Your claim against the Grand Underlord is active."

 eotg_cartel_issue_purge_demand:0 "Issue Purge Demand"
 eotg_cartel_issue_purge_demand_confirm:0 "Publicly demand the submission or elimination of the most defiant Boss."
 eotg_cartel_issue_purge_demand_desc:0 "Make an example. Publicly demand the elimination or submission of the most defiant Boss. Fear is the only currency that matters."
 eotg_cartel_issue_purge_demand_tooltip:0 "Demand the submission or elimination of a defiant Boss."
 eotg_cartel_purge_demand_effect_tooltip:0 "The targeted Boss must choose: flee, submit, or resist and join the Hostile Takeover faction."

 # ── Modifiers ─────────────────────────────────────────────────────────────────

 eotg_cartel_gl_paranoia:0 "Paranoid"
 eotg_cartel_gl_paranoia_desc:0 "Dread has slipped dangerously low. The Bosses are watching. Any sign of weakness invites a Hostile Takeover."

 eotg_cartel_defiant_boss:0 "Defiant"
 eotg_cartel_defiant_boss_desc:0 "This Boss refused the Grand Underlord's Loyalty Tax demand. A target for purge, an asset for factions."

 eotg_cartel_defiance_pressure:0 "Defiance Pressure"
 eotg_cartel_defiance_pressure_desc:0 "Bosses are openly refusing to pay. Dread decays faster as the organization senses vulnerability."

 eotg_cartel_shakedown_standoff:0 "Shakedown Standoff"
 eotg_cartel_shakedown_standoff_desc:0 "A critical mass of Bosses are withholding compliance. The Grand Underlord must negotiate or crush the faction before it grows."

 # ── Loyalty Tax Events ────────────────────────────────────────────────────────

 eotg_cartel_tax_0001_title:0 "The Tax Collector Arrives"
 eotg_cartel_tax_0001_desc:0 "A courier bearing the Grand Underlord's seal arrives at your den. The message is terse: pay your share, or prepare for a visit from collectors with considerably less patience."

 eotg_cartel_tax_0001_opt_pay:0 "Pay the tribute."
 eotg_cartel_tax_0001_opt_refuse:0 "Refuse. Let them come."

 eotg_cartel_tax_0002_title:0 "Defiance Reported"
 eotg_cartel_tax_0002_desc:0 "One of your Bosses has refused the Loyalty Tax. Word will spread. Every other Boss is watching to see what you do next."

 eotg_cartel_tax_0002_opt_accept:0 "Absorb the insult. Not worth escalating."
 eotg_cartel_tax_0002_opt_punish:0 "Send a message. Make them bleed a little."

 eotg_cartel_tax_0003_title:0 "The Grand Underlord's Response"
 eotg_cartel_tax_0003_desc:0 "The Grand Underlord's enforcers arrive. They take what they want and leave a clear warning about what happens next time."

 eotg_cartel_tax_0003_opt_endure:0 "Endure it. Plan for later."

 eotg_cartel_tax_0004_title:0 "The Bosses Are Withholding"
 eotg_cartel_tax_0004_desc:0 "Too many Bosses have refused this cycle. This is no longer individual defiance — it's organized. The Shakedown Faction has critical mass."

 eotg_cartel_tax_0004_opt_hold_firm:0 "Hold firm. Show no weakness."
 eotg_cartel_tax_0004_opt_settle:0 "Settle the standoff. Pay them out."

 eotg_cartel_shakedown_standoff_tooltip:0 "The Shakedown Standoff modifier is now active. Bosses are watching for signs of further weakness."

 # ── Faction Events ────────────────────────────────────────────────────────────

 eotg_cartel_faction_0001_title:0 "The Shakedown Faction Moves"
 eotg_cartel_faction_0001_desc:0 "The Shakedown Faction has coordinated. Enough Bosses have committed to their demands that they now speak with one voice: reduce the Loyalty Tax rate permanently, or face a collective economic standoff."

 eotg_cartel_faction_0001_opt_crack_down:0 "Crush the faction. Make examples."
 eotg_cartel_faction_0001_opt_negotiate:0 "Negotiate. Pay them off and move on."

 eotg_cartel_shakedown_momentum_title:0 "The Shakedown Faction Has Momentum"
 eotg_cartel_shakedown_momentum_desc:0 "The Grand Underlord has been confronted with the faction's demands. The outcome will reshape the terms of doing business in the Syndicate."

 eotg_cartel_faction_0002_title:0 "A Hostile Takeover is Declared"
 eotg_cartel_faction_0002_desc:0 "A Boss has pressed a claim on your title. This isn't politics. This is a knife aimed at your throat."

 eotg_cartel_faction_0002_opt_rally:0 "Rally the organization. Show who commands here."

 eotg_cartel_civil_war_notice_title:0 "Civil War in the Syndicate"
 eotg_cartel_civil_war_notice_desc:0 "A Boss has declared against the Grand Underlord. The Syndicate tears itself apart — choose your side carefully."

 eotg_cartel_faction_0003_title:0 "The Takeover Begins"
 eotg_cartel_faction_0003_desc:0 "You've declared against the Grand Underlord. Your claim is active. Victory means control of the entire Syndicate. Defeat means your organization gets absorbed or dismantled."

 eotg_cartel_faction_0003_opt_press_claim:0 "Press the claim. All or nothing."

 eotg_cartel_faction_0004_title:0 "A Purge Demand Has Been Issued"
 eotg_cartel_faction_0004_desc:0 "The Grand Underlord has singled you out. The message reaches every Boss in the Syndicate: your submission or your destruction. The organization is watching."

 eotg_cartel_faction_0004_opt_flee:0 "Flee. Abandon the territory and survive."
 eotg_cartel_faction_0004_opt_submit:0 "Submit. Pay the tribute and beg forgiveness."
 eotg_cartel_faction_0004_opt_resist:0 "Resist. Press a counter-claim and fight back."

 # ── Opinion Modifier ──────────────────────────────────────────────────────────

 eotg_cartel_crackdown_opinion:0 "Crackdown Resentment"
 eotg_cartel_crackdown_opinion_desc:0 "The Grand Underlord crushed the Shakedown faction by force. We do not forget."
