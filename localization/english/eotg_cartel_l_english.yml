l_english:
 # Cartel G2 batch C1 (resource core). Spec: docs/specs/governments_v2_g2_cartel.md section 9.
 eotg_cartel_schedule_modifier:0 "The Payment Schedule"
 eotg_cartel_schedule_modifier_desc:0 "Every payer on the schedule keeps the ruler's reputation for violence fresh. The more neighbours pay, the higher the fear floor sits."
 eotg_cartel_schedule_scale_desc:0 "Each payer on the schedule adds 4, up to a total of 40"
 eotg_story_cartel_schedule:0 "The Payment Schedule"
 eotg_story_cartel_schedule_info:0 "Dread keeps the schedule alive.\n\nBelow 20, one payer walks away each year.\nAt 40, a ruler can take up the Cartel government.\nAt 80, a neighbour can be compelled to pay.\n\nVassals are never on the schedule. When a ruler dies, payers stay with the heir for 3 years before anyone can walk away."
 eotg_story_cartel_schedule_dread_label:0 "Dread"
 eotg_story_cartel_schedule_min_label:0 "0"
 eotg_story_cartel_schedule_max_label:0 "100"
 eotg_story_cartel_schedule_tt:0 "This counter shows your [dread|E]. It can lag behind your actual dread by up to a month.\n\nEach payer raises your dread baseline. Below 20 dread, one payer walks away each year. Vassals never do; they are not payers."

 # Batch C2 (tribute)
 eotg_cartel_put_on_schedule_interaction:0 "Put on the Schedule"
 eotg_cartel_put_on_schedule_interaction_desc:0 "Spend [dread|E] to make [recipient.GetShortUINameNoTooltip] a [tributary|E] on a low-tax payment schedule"
 eotg_cartel_put_on_schedule_notification:0 "I can see that your borders are long and your routes are not safe. For regular payments, I offer protection."
 eotg_cartel_compel_option:0 "Compel with [dread|E]"
 eotg_cartel_compel_tt:0 "[actor.GetShortUIName] compels [recipient.GetShortUIName] through [dread|E]"
 eotg_cartel_schedule_dread_tt:0 "You have enough [dread|E]: 10 for a Shoal, 15 for a Sector, 25 for an Expanse, 35 for a Cluster, and 10 more to compel"
 eotg_cartel_schedule_refused_tt:0 "[recipient.GetShortUIName] has not refused you in the last 3 years"
 eotg_cartel_schedule_toast:0 "A New Payer"
 eotg_cartel_schedule_toast_desc:0 "[recipient.GetTitledFirstName] is now on your payment schedule"
 eotg_cartel_walk_off_toast:0 "A Payer Walks"
 eotg_cartel_walk_off_toast_desc:0 "[eotg_cartel_walker.GetTitledFirstName] no longer fears you enough to pay and has left your payment schedule"
 eotg_refused_protection_opinion:0 "Refused My Protection"
 eotg_compelled_to_pay_opinion:0 "Compelled to Pay"
 eotg_schedule_tightened_opinion:0 "Raised My Payments"
 eotg_cartel_tributary:0 "Payment Schedule"
 eotg_cartel_tributary_desc:0 "A payer to a Cartel. The arrangement holds only while the Cartel is feared, and passes to its heir. Vassals are not on the schedule."

 # Batches C3 and C4 (decisions, transitions), and the C2 refusal toast
 eotg_cartel_schedule_refused_toast:0 "Protection Refused"
 eotg_cartel_schedule_refused_toast_desc:0 "[recipient.GetTitledFirstName] refused your protection. The called bluff costs you [dread|E], and [recipient.GetSheHe] will not hear the offer again for 3 years."
 eotg_decision_cartel_tighten_schedule:0 "Tighten the Schedule"
 eotg_decision_cartel_tighten_schedule_desc:0 "Every payer on your schedule who still pays at the low rate can be made to pay more. The payments rise, and so does the resentment. Each payer who is raised will remember who asked."
 eotg_decision_cartel_tighten_schedule_tooltip:0 "Squeeze your payers harder, at a price in fear"
 eotg_decision_cartel_tighten_schedule_confirm:0 "Raise the payments"
 eotg_decision_cartel_tighten_schedule_payers_tt:0 "At least one payer on your schedule is still paying the low rate"
 eotg_decision_cartel_tighten_schedule_dread_tt:0 "You have enough [dread|E]: 5 for each payer at the low rate, at least 10 and at most 40"
 eotg_decision_cartel_tighten_schedule_effect_tt:0 "Every payer on your schedule at the low rate now pays the high rate, and takes a lasting dislike to you"
 eotg_decision_cartel_lean_on_locals:0 "Lean on the Locals"
 eotg_decision_cartel_lean_on_locals_desc:0 "Remind your own capital Shoal who it pays. You gain [dread|E]. For 5 years the Shoal pays more in taxes and likes you less. If your liege is a Cartel, word travels up and they are feared a little more too."
 eotg_decision_cartel_lean_on_locals_tooltip:0 "Remind your own Shoal who it pays"
 eotg_decision_cartel_lean_on_locals_confirm:0 "Make an example"
 eotg_decision_cartel_adopt:0 "Run the Realm as a Cartel"
 eotg_decision_cartel_adopt_desc:0 "You are already feared. Rule openly through that fear and keep your neighbours on a payment schedule. Only you change: your vassals keep their governments, but land you grant from now on is run the Cartel way."
 eotg_decision_cartel_adopt_tooltip:0 "Turn your realm's fear into a government"
 eotg_decision_cartel_adopt_confirm:0 "Run it as a Cartel"
 eotg_decision_cartel_adopt_dread_tt:0 "You have at least 40 [dread|E]"
 eotg_decision_cartel_go_legitimate:0 "Go Legitimate"
 eotg_decision_cartel_go_legitimate_desc:0 "Leave the Cartel behind and become Feudal. Your fear turns into [legitimacy|E], 2 for each point of dread up to 200, and half of your dread fades away. The payment schedule is released and your Cartel vassals become Feudal with you."
 eotg_decision_cartel_go_legitimate_tooltip:0 "Trade fear for standing"
 eotg_decision_cartel_go_legitimate_confirm:0 "Go straight"
 eotg_decision_cartel_go_legitimate_effect_tt:0 "Every payer on your schedule is released, and your Cartel vassals become Feudal with you"
 eotg_cartel_leaned_on_modifier:0 "Leaned On"
 eotg_cartel_leaned_on_modifier_desc:0 "This Shoal has been reminded who it pays. It pays more in taxes and resents it."
