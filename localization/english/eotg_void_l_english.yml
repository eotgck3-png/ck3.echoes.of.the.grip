l_english:
 # Void Corruption v2 (docs/specs/void_corruption_v2.md §7). Register: the Void is EXTERNAL (floor, scar, cold, edge of hearing); it never arrives in the character's own thoughts. Orrin claims are belief, never narration.

 # Traits
 trait_eotg_grip_survivor:0 "Grip Survivor"
 trait_eotg_grip_survivor_desc:0 "Descended from those who lived through Orrin's Grip. The line is hardier than most, and carries something from that time that it has never managed to put into words."
 trait_eotg_void_touched:0 "Void-Touched"
 trait_eotg_void_touched_desc:0 "Something from the far side of a Void scar came through and stayed close. This character is sharper in some ways and harder to sit beside in all of them. The cold under the floor follows them from room to room."
 trait_eotg_void_defiant:0 "Void-Defiant"
 trait_eotg_void_defiant_desc:0 "This character was offered something through a Void scar and refused it aloud. The Voidwalkers say that what is refused cannot be offered twice."
 trait_eotg_void_hollowed:0 "Hollowed"
 trait_eotg_void_hollowed_desc:0 "Whatever came through the scar has finished passing through this character. What remains is precise, tireless and entirely unreachable. It rules well. Nobody can bear to sit near it."

 # Modifiers
 eotg_mod_void_whispers:0 "Void Whispers"
 eotg_mod_void_whispers_desc:0 "Something sits at the edge of hearing and will not leave. Sleep comes shallow. Prayer comes hard."
 eotg_mod_void_pressure:0 "Void Pressure"
 eotg_mod_void_pressure_desc:0 "The sound under the floor has weight now, and it presses hardest when company is near. Secrets have become easier to keep than friends."
 eotg_mod_void_saturation:0 "Void Saturation"
 eotg_mod_void_saturation_desc:0 "The cold no longer comes up from below. It comes through. Refusal is no longer a thing that can simply be decided."
 eotg_mod_void_hollow_far:0 "Far Off"
 eotg_mod_void_hollow_far_desc:0 "Present at every meeting, answering every question, and somehow farther away each season."
 eotg_mod_void_hollow_quiet:0 "Gone Quiet"
 eotg_mod_void_hollow_quiet_desc:0 "Nothing comes back now, not even in the small hours. The court has stopped waiting for it to."
 eotg_mod_void_warded:0 "Warded Against the Void"
 eotg_mod_void_warded_desc:0 "Wards drawn correctly, in the old order, by someone who understood why the order mattered. The cold under the floor recedes while the ward holds."
 eotg_mod_void_aura:0 "Void Aura"
 eotg_mod_void_aura_desc:0 "A draft with no source follows this character into every room. Flames lean away from them, and conversations end a little early."
 eotg_mod_void_deep_charts:0 "The Deep Charts"
 eotg_mod_void_deep_charts_desc:0 "Second Era route-charts that no living cartographer can hold in their head. Read with a cold draft at the back of the neck, they are perfectly clear."
 eotg_mod_void_unseen_step:0 "The Unseen Step"
 eotg_mod_void_unseen_step_desc:0 "Rooms forget they were entered. Guards recall the corridor but not who walked it."
 eotg_mod_void_cold_hand:0 "The Cold Hand"
 eotg_mod_void_cold_hand_desc:0 "The cold reaches the enemy line with the blade. Enemies break a little earlier than they should."
 eotg_mod_void_long_ledger:0 "The Long Ledger"
 eotg_mod_void_long_ledger_desc:0 "Accounts settle themselves across spans longer than a life, and settle favourably."
 eotg_mod_void_borrowed_voice:0 "The Borrowed Voice"
 eotg_mod_void_borrowed_voice_desc:0 "People agree first and wonder why afterward. A cold note sits under every word, and the room leans toward it."

 # Opinion modifiers
 eotg_opinion_void_unreachable:0 "Unreachable"
 eotg_opinion_void_shelters_voidwalker:0 "Keeps a Voidwalker"
 eotg_opinion_void_unease:0 "Something Is Wrong"
 eotg_opinion_void_kinship:0 "Believes Them Eye-Marked"
 eotg_opinion_void_defiance_respect:0 "Respects Their Resolve"

 # Decisions
 eotg_decision_void_warding_rite:0 "Commission the Warding Rite"
 eotg_decision_void_warding_rite_desc:0 "Most faiths keep some ward against the scars, half-remembered and expensive to perform properly. It is weaker than what the Voidwalkers know. It is also entirely respectable."
 eotg_decision_void_warding_rite_tooltip:0 "Have the clergy push back the cold under the floor, for a time"
 eotg_decision_void_warding_rite_confirm:0 "Have the rite performed"
 eotg_decision_void_voidwalker_ward:0 "Ask the Voidwalker for the Old Ward"
 eotg_decision_void_voidwalker_ward_desc:0 "The Voidwalker at your court can draw the full ward, in the right order, the way the Malvrick Orders teach it. It holds better than anything the clergy can offer. Everyone devout at court will know exactly whose hands drew it."
 eotg_decision_void_voidwalker_ward_tooltip:0 "Have your Voidwalker close the scar properly, at a cost in piety"
 eotg_decision_void_voidwalker_ward_confirm:0 "Let them work"
 eotg_decision_void_ward_cooldown_tt:0 "No ward has been drawn for you in recent years"
 eotg_decision_void_commune:0 "Commune at the Scar"
 eotg_decision_void_commune_desc:0 "Those who call themselves the Marked teach that what speaks through the scars is the Eye, and that it trades. Nobody can prove what speaks there. Everyone who has listened agrees that it pays in exactly the currency you were taught to count."
 eotg_decision_void_commune_tooltip:0 "Listen at the scar and take what is offered"
 eotg_decision_void_commune_confirm:0 "Open the way"

 # eotg_void.0001 The Scar Reopens
 eotg_void.0001.t:0 "The Scar Reopens"
 eotg_void.0001.desc:0 "There is a place in my holdings that the old surveys mark and no recent one does: a Grip-era scar, dormant since before anyone now living was born, closed off by some long-dead administrator and forgotten by every successor.\n\nNow the barrier is down, and no hand brought it down. The air above the site does not move the way air moves. My steward reports it flatly and waits for me to decide not to think about it. "The instruments say nothing is there," my steward adds. "The instruments are wrong.""
 eotg_void.0001.a:0 "Survey it properly. Instruments, records, distance."
 eotg_void.0001.b:0 "Wall it off and post a guard. Nobody goes in."
 eotg_void.0001.c:0 "I will go in myself."
 eotg_void.0001.d:0 "Rebuild the barrier and say nothing."

 # eotg_void.0002 The Sound Under the Floor
 eotg_void.0002.t:0 "The Sound Under the Floor"
 eotg_void.0002.desc:0 "It began as a fault in the foundations. That is what I told the engineers, and they found no fault. It is under the floor of my own chambers and nowhere else, and it keeps no rhythm a pump or a settling plate would keep.\n\nIt is closest to a voice heard through deep water, coming up from below. It has been three weeks. I have started leaving a lamp lit."
 eotg_void.0002.desc_cult:0 "The priests of my faith would call this a summons. It is under the floor of my own chambers and nowhere else, patient as a tide, and it has been three weeks.\n\nMy faith teaches that Orrin the Eye still speaks through the Void to those he means to use, and that being used by a god is the nearest thing to grace left in this cosmos. That is the teaching. Nobody can tell me what is actually down there. I find that I am not frightened, and that frightens me."
 eotg_void.0002.desc_bloodline:0 "My family has a word for this that appears in no dictionary, handed down with the holdings and the debts. Nobody ever explained it. Everyone always knew.\n\nIt is under the floor of my chambers and nowhere else, and it comes up through the boards in the cadence my grandmother used when she thought the room was empty. All the generations since the Grip, it turns out, are not enough for a bloodline to finish falling through a hole."
 eotg_void.0002.a:0 "Record it. Measure it. A thing with a name is a thing with a limit."
 eotg_void.0002.b:0 "Drill the guard in the yard above until nothing else can be heard."
 eotg_void.0002.c:0 "Find out, quietly, who else in this house can hear it."
 eotg_void.0002.d:0 "Cost it out. Every effect has a cause, and every cause has a price."
 eotg_void.0002.e:0 "Ask the household, carefully, whether anyone has noticed anything."
 eotg_void.0002.f:0 "Move to another chamber and do not discuss it."

 # eotg_void.0003 The Star That Is Not There
 eotg_void.0003.t:0 "The Star That Is Not There"
 eotg_void.0003.desc:0 "The observers bring the same finding three watches running, and on the third watch they bring it together, so that no one of them has to carry it alone.\n\nThere is a star in the far reach that appears on no chart at all, though every one of them has found it in the sky. It does not move with the sky. Looked at directly, it is not there. "Only at the edge of the eye," the eldest of them says. "The way you notice someone standing behind you.""
 eotg_void.0003.desc_young:0 "The observers bring the same finding three watches running, and I go up to the array to see it myself, because I am young enough that a mystery is still an invitation.\n\nThere is a star in the far reach that appears on no chart from before the Grip. It does not move with the sky. Looked at directly, it is not there; it waits at the edge of the eye, the way someone waits behind me in an empty room. I look for an hour. It is the most interesting thing that has ever happened to me."
 eotg_void.0003.desc_old:0 "My observers bring the finding as though it were new, and I let them, because they are proud of the work and there is no kindness in the truth.\n\nI saw it once before, from a different array, in a different decade, beside people who are all dead now. It came and it faded, and nobody wrote it down, because nobody wanted a name attached to it. It does not move with the sky. It waits at the edge of the eye. I had hoped to finish without seeing it twice."
 eotg_void.0003.a:0 "Sit the whole watch with them and look at it."
 eotg_void.0003.b:0 "Tell them what it was called the last time."
 eotg_void.0003.c:0 "Note it in the record and return to work that pays."
 eotg_void.0003.d:0 "Have them disciplined for wasting the court's time with ghost stories."

 # eotg_void.0004 The Voidwalker at the Gate
 eotg_void.0004.t:0 "The Voidwalker at the Gate"
 eotg_void.0004.desc:0 "The traveller at the gate is dusty, armed and entirely composed. [eotg_void_voidwalker.GetSheHe|U] gives a name, and then the name of an order: a Voidwalker, a sworn blade of the Malvrick Orders, one of those who go where the Void has left a mark and carry away what should not be left lying there.\n\n[eotg_void_voidwalker.GetSheHe|U] knows what is under the floor before anyone can say. "Your scar is awake," [eotg_void_voidwalker.GetSheHe] tells the court. "I can hold it shut, for a time, if I am close enough to hear it. I would need a roof, and your clergy's patience."\n\nA Voidwalker in residence makes for a quieter house. It also puts a Malvrick blade at the ruler's table, and the devout will count that."
 eotg_void.0004.a:0 "Give [eotg_void_voidwalker.GetHerHim] a place at court. The devout can make of it what they like."
 eotg_void.0004.b:0 "Hear [eotg_void_voidwalker.GetHerHim] out, take the ward, and let [eotg_void_voidwalker.GetHerHim] go on."
 eotg_void.0004.c:0 "Turn [eotg_void_voidwalker.GetHerHim] away, in front of the clergy."
 eotg_void.0004.d:0 "Have [eotg_void_voidwalker.GetHerHim] killed at the gate, and burn what [eotg_void_voidwalker.GetSheHe] carried."

 # eotg_void.0010 The Bargain
 eotg_void.0010.t:0 "The Bargain"
 eotg_void.0010.desc:0 "It does not come as a sound this time. It comes up through the floor as weight, as the cold of a door left open somewhere far below, and with it, plainly, an offer. Not in my head. In the room, at the edge of hearing, from the side of the wall where there is nothing.\n\nThe offer is not complicated. Something on the far side of the scar will lend a portion of its attention to my affairs. It will make me better at the one thing I was raised to be good at. It is specific about this. It knows what that thing is. I do not know what it is.\n\nIt asks for nothing I would miss at once. That is the part I cannot stop turning over."
 eotg_void.0010.desc_cult:0 "It comes the way my faith always said it would: up through the floor, from the far side of the scar, an offer spoken at the edge of hearing and not inside my head at all.\n\nThose who call themselves the Marked believe this is Orrin the Eye reaching back through the Void that once held him, lending his attention to the faithful. Nothing in the room says whether that is true. What it offers is plain: it will sharpen the one thing I was raised to be good at. My priests have described this moment my whole life. None of them mentioned that it would be courteous.\n\nIt asks for nothing I would miss at once. My faith says that is because nothing worth keeping is missed at once."
 eotg_void.0010.desc_bloodline:0 "It comes up through the floor, from the far side of the scar, and it is using the family word. The one from the old papers that nobody ever defined.\n\nThe offer is not complicated, and it is not new. It has been made in my line before. I understand, with a clarity I would rather not have, that my family has the word at all because someone once accepted, and that nobody explained it because they had nothing good to report.\n\nIt will make me better at the one thing I was raised to be good at. It asks for nothing I would miss at once. It waits at the edge of hearing with the patience of something that has done this before."
 eotg_void.0010.a:0 "Accept. Take what is offered and learn the price later."
 eotg_void.0010.b:0 "Refuse. Say it aloud, mean it, and keep meaning it."
 eotg_void.0010.c:0 "Refuse the bargain, and keep what it showed me while I refused."
 eotg_void.0010.d:0 "Say nothing at all, and hope silence is not an answer."

 # eotg_void.0011 Taken Anyway
 eotg_void.0011.t:0 "Taken Anyway"
 eotg_void.0011.desc:0 "Somewhere around the third hour, you understand that you have been treating this as a negotiation with two parties in it.\n\nThe scar is thin here. It has been thinning since long before you were born, and your refusal, however sincerely meant, was never holding anything up. Nothing is asking now. The cold comes up through the floor and through the middle of you and keeps going, unhurried, the way water finds low ground.\n\nAll that is left to decide is how you are standing when it finishes."
 eotg_void.0011.a:0 "Meet it on my feet."
 eotg_void.0011.b:0 "Pray, aloud, to the last word."
 eotg_void.0011.c:0 "Stop resisting and let it through cleanly."

 # eotg_void.0020 The Cold Hand
 eotg_void.0020.t:0 "The Cold Hand"
 eotg_void.0020.desc:0 "The line breaks in front of [ROOT.Char.GetFirstName], and [ROOT.Char.GetSheHe] cannot account for it. No weapon was raised and no order given. [ROOT.Char.GetSheHe|U] looked along the enemy front, the cold came off [ROOT.Char.GetHerHim] like air from an opened vault, and the soldiers there stopped being willing.\n\n[ROOT.Char.GetHerHis|U] own [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] saw it. Two of them have not met [ROOT.Char.GetHerHis] eye since. In the field this thing is the most useful instrument [ROOT.Char.GetSheHe] has ever been handed, and everyone who fights alongside [ROOT.Char.GetHerHim] now knows it exists."
 eotg_void.0020.a:0 "Use it. Wars are not won by being pleasant to stand near."
 eotg_void.0020.b:0 "Hold it back, and pay for the restraint in ground."
 eotg_void.0020.c:0 "Let the [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')] get a proper look. Fear travels ahead of an army."

 # eotg_void.0021 What the Children See
 eotg_void.0021.t:0 "What the Children See"
 eotg_void.0021.desc:0 "[eotg_void_child.GetFirstName] asks it at the table, in front of the household. "Why is there a second shadow behind you? Why is it always cold where it stands?"\n\nThe room does what rooms do. My steward develops an interest in the far window. Nobody contradicts the child, which is how I learn that nobody in this hall has been able to contradict the child for some time.\n\n[eotg_void_child.GetSheHe|U] is not frightened yet. [eotg_void_child.GetSheHe|U] is waiting to see whether to be, and is reading the answer from my face."
 eotg_void.0021.a:0 "Tell [eotg_void_child.GetHerHim] the truth, at a size [eotg_void_child.GetSheHe] can carry."
 eotg_void.0021.b:0 "Say it was imagined, and make the lie warm."
 eotg_void.0021.c:0 "Keep [eotg_void_child.GetHerHim] away from me for now. Other rooms, other hours."

 # eotg_void.0022 The Confessor's Verdict
 eotg_void.0022.t:0 "The Confessor's Verdict"
 eotg_void.0022.desc:0 "[eotg_void_confessor.GetFirstName] has been building to this for a year and delivers it in open court, which tells the whole hall that [eotg_void_confessor.GetSheHe] expected to be silenced in private and decided to make that expensive.\n\n[eotg_void_confessor.GetSheHe|U] names the condition with the old word the courts use in sentencing. "A realm can survive a wicked ruler," [eotg_void_confessor.GetSheHe] says. "It cannot survive one who is not #EMP there#!. The oaths were sworn to a person."\n\nThen [eotg_void_confessor.GetSheHe] kneels, which is worse, and offers to perform the rite personally."
 eotg_void.0022.desc_cult:0 "[eotg_void_confessor.GetFirstName] has been building to this for a year and delivers it in open court, in full voice, so that nobody can later claim not to have been there.\n\n[eotg_void_confessor.GetSheHe|U] names the condition, and then names it the way those who call themselves the Marked do: as favour. "The Eye does not lend its attention to the unworthy," [eotg_void_confessor.GetSheHe] says. "The ordinary faiths call this corruption because they were never offered anything."\n\n[eotg_void_confessor.GetSheHe|U] kneels. Half the hall kneels too. Nobody at court had known how many there were."
 eotg_void.0022.a:0 "Kneel, and submit to the rite."
 eotg_void.0022.b:0 "Accept the blessing before the whole hall."
 eotg_void.0022.c:0 "Have [eotg_void_confessor.GetHerHim] dragged from the hall in front of everyone."
 eotg_void.0022.d:0 "Say nothing, and let the court draw its own conclusions."

 # eotg_void.0023 The Deep Route
 eotg_void.0023.t:0 "The Deep Route"
 eotg_void.0023.desc:0 "The charts have sat in my vault since before my time: Second Era route-work in a notation nobody could read, bought as a curiosity by an ancestor who could not read a line of it either.\n\nI can read it now. I did not learn to. I unrolled the first sheet, and under the cold off the page, the notation resolved, the way a word in a foreign tongue resolves once somebody says what it means. The draft came as if from under a door.\n\nThey are transit routes between places that are close together in a way that has nothing to do with distance. Any one of them would be worth a fortune to the right buyer."
 eotg_void.0023.a:0 "Chart them properly. Understand the whole system."
 eotg_void.0023.b:0 "Sell them, discreetly, to more than one buyer."
 eotg_void.0023.c:0 "Burn them, and the vault they sat in."

 # eotg_void.0024 Long Service
 eotg_void.0024.t:0 "Long Service"
 eotg_void.0024.desc:0 "I have carried this longer than most people carry a marriage, and the arrangement has been honest, in its way. It took what it took. It gave what it promised. I have ruled a long time and ruled well, and a great deal of that was not entirely me.\n\nWhat has changed is the arithmetic. There is less ahead than behind now, and the cold under the floor has not noticed, or does not care, and will still be there afterward, looking for somewhere to settle.\n\nThe question is no longer what it wants from me. It is what I mean to leave behind, and to whom."
 eotg_void.0024.a:0 "Write all of it down. Every ward, every rule, every cost."
 eotg_void.0024.b:0 "Spend what remains. There is no sense dying with it unspent."
 eotg_void.0024.c:0 "Make my peace, and put the work down."

 # eotg_void.0025 The Vassal's Ultimatum
 eotg_void.0025.t:0 "The Vassal's Ultimatum"
 eotg_void.0025.desc:0 "[eotg_void_vassal.GetFirstName] has done this carefully. Not a rebellion, not an accusation of tyranny: a constitutional question, put in writing and copied to enough of the other vassals that suppressing it now would only confirm it.\n\nThe question is whether the oaths still bind. Every oath was sworn to a person. "With respect," the document reads, "it is no longer settled that there is one." It asks that the ruler submit to examination by parties the ruler does not choose.\n\nThe document is scrupulously respectful. It is also the most dangerous thing anyone has handed this court in years."
 eotg_void.0025.a:0 "Submit to the examination. Answer every question they ask."
 eotg_void.0025.b:0 "Grant a private audience, and show them exactly what they are asking about."
 eotg_void.0025.c:0 "Buy the question, the copies and the silence."
 eotg_void.0025.d:0 "Ignore it, and let it stand unanswered."

 # eotg_void.0030 The Hollowing
 eotg_void.0030.t:0 "The Hollowing"
 eotg_void.0030.desc:0 "There is no moment. Nobody warns about that. I keep waiting for the moment, and instead there is an ordinary day.\n\nI hold court. I rule better than I ever have. I settle three disputes that had run for years and I settle them correctly, and at no point do I want anything, or mind anything, or find any of it happening to me. The cold that used to come up through the floor has stopped coming. There is nowhere left for it to go.\n\nAfterward my steward asks whether I am well. I give a reassuring answer. It costs me nothing to give, and it works."
 eotg_void.0030.desc_cult:0 "There is no moment, and my faith did warn me of that. Those who call themselves the Marked teach that the Eye does not arrive; it finishes.\n\nI hold court. I rule better than I ever have, and at no point do I want anything, or mind anything, or find any of it happening to me. The cold under the floor is gone. This is the state those who call themselves the Marked have spent generations calling the end of the noise.\n\nMy steward asks whether I am well. I give a reassuring answer. It costs me nothing to give, and it works. The teachings did not mention that part. I suspect the ones who got this far stopped writing."
 eotg_void.0030.a:0 "Announce it as ascension, and let the faithful rejoice."
 eotg_void.0030.b:0 "Say nothing. Rule. Let them find out slowly, or not at all."
 eotg_void.0030.c:0 "Step down now, while the decision is still recognizably mine."
 eotg_void.0030.d:0 "Let them see it. Fear is a perfectly serviceable instrument of state."

 # eotg_void.0031 The Hollow Court
 eotg_void.0031.t:0 "The Hollow Court"
 eotg_void.0031.desc:0 "The court has adapted. That is the correct word, and it is not a compliment.\n\nPetitions arrive in writing now, by preference, and the preference is universal. The council reaches its decisions with an efficiency that would once have been envied, because nobody wishes to extend the meeting. The seat beside the ruler's at table has been quietly reassigned to nobody.\n\nNone of it obstructs the business of ruling. The realm is well governed. It is simply governed at a distance, by everyone, the ruler included."
 eotg_void.0031.a:0 "Rule through it. Distance is not weakness."
 eotg_void.0031.b:0 "Delegate everything that needs a person, and keep what does not."
 eotg_void.0031.c:0 "Sit at the table to the end of the meal, however long that takes."

 # eotg_void.0032 A Moment of Being
 eotg_void.0032.t:0 "A Moment of Being"
 eotg_void.0032.desc:0 "It comes back without warning and without any cause I can find. Perhaps four hours. Perhaps five.\n\nEverything is suddenly, unbearably present: the cold of the floor, the noise from the yard, the fact that I am hungry and have apparently been hungry a long time without noticing. I am entirely myself, and I can feel exactly how much room there usually is not.\n\nI already know it is temporary. That knowledge is part of what has come back."
 eotg_void.0032.desc_old:0 "It comes back without warning, and it brings the whole of it: the cold of the floor, the noise from the yard, and every year I spent not noticing either.\n\nI am entirely myself for the first time in longer than I can reconstruct, and what arrives with the self is the arithmetic. I am old. Most of the people I would want to spend this on are dead, and I did not attend all of the funerals, and I can no longer remember which ones.\n\nPerhaps four hours. I already know it is temporary. That knowledge came back with everything else."
 eotg_void.0032.desc_heir:0 "It comes back without warning, four hours or perhaps five, and the first thing I do with it is look at my heir properly, which I have not managed in a very long time.\n\nMy heir has grown. Not recently; I have simply not been present for any of it. They speak to me the way people speak to a hazard in the room: carefully, briefly, from a fixed distance, and with the fluency of long practice.\n\nI am entirely myself, and I can see the whole shape of what that absence has cost, and I already know how few hours I have to spend on it."
 eotg_void.0032.a:0 "Spend it on my heir. All of it."
 eotg_void.0032.b:0 "Spend it on the court. Let them see me once."
 eotg_void.0032.c:0 "Spend it working. The ledger does not care who holds the pen."
 eotg_void.0032.d:0 "Sit with it. Do not spend it on anything."
