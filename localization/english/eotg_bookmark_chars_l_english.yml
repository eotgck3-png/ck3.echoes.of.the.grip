 # ── Lanius Event Localization ─────────────────────────────────────────────────
 eotg_lanius.0001.t:0 "The Title Without a Throne"
 eotg_lanius.0001.desc:0 "I have embraced the title 'Prince of Myr.' The Synod condemns it in private letters. Rumors are already spreading — of forged records, fabricated bloodlines, manipulated archives. Let them spread."
 eotg_lanius.0001.a:0 "If history is weak, it deserves replacement."
 eotg_lanius.0001.b:0 "I will prove worthy of the title."
 eotg_lanius.0001.c:0 "Let them whisper. Fear works too."

 eotg_lanius.0002.t:0 "The Price of Recognition"
 eotg_lanius.0002.desc:0 "The Synod will not recognize me without sacrifice. They speak of devotion, restraint, the willingness to suffer for Myr. Very well. I will give them one thing."
 eotg_lanius.0002.a:0 "Fund the restoration of the Ashen Cathedrals."
 eotg_lanius.0002.b:0 "Send my finest soldiers to defend the pilgrimage routes."
 eotg_lanius.0002.c:0 "Grant the Synod judicial authority."

 eotg_lanius.0003.t:0 "The Hollow Throne"
 eotg_lanius.0003.desc:0 "The Wardens have summoned me. This is not a military test. They want to know what I believe. They ask: why should Myr follow a liar?"
 eotg_lanius.0003.a:0 "Because truth alone never saved kingdoms."
 eotg_lanius.0003.b:0 "Because people need something to believe."
 eotg_lanius.0003.c:0 "Because I will succeed where the real rulers failed."

 eotg_lanius.0004.t:0 "The Whispers of Myr"
 eotg_lanius.0004.desc:0 "Pilgrims call me Prince of Myr without being told to. The Synod is fracturing. Traditionalists insist I am dangerous. Restorationists argue the myth is politically useful. I can feel the story taking on a life of its own."
 eotg_lanius.0004.a:0 "Encourage the stories quietly."
 eotg_lanius.0004.b:0 "Turn the myth into doctrine."
 eotg_lanius.0004.c:0 "Remain silent."

 eotg_lanius.0005.t:0 "The Prince Acknowledged"
 eotg_lanius.0005.desc:0 "The Synod and the Wardens have issued a declaration. They do not confirm my bloodline. They state only that the title 'Prince of Myr may serve the restoration of order.' That deliberate ambiguity is the most powerful thing they could have given me."
 eotg_lanius.0005.a:0 "Then let Myr remember my name."
 eotg_lanius.0005.b:0 "This is only the beginning."
 eotg_lanius.0005.c:0 "I never needed their blessing."

 # ── Clayd Event Localization ──────────────────────────────────────────────────
 eotg_clayd.0001.t:0 "The Bar Massacre"
 eotg_clayd.0001.desc:0 "Eleven Rooks. Dead at the table. I was away — wrong place, right timing. I still won't use their names. I remember: silence. Broken glasses. Blood. Nobody fought back long enough."
 eotg_clayd.0001.a:0 "Count the dead."
 eotg_clayd.0001.b:0 "File it away."
 eotg_clayd.0001.c:0 "Find out where they went."

 eotg_clayd.0002.t:0 "Coppervein Street"
 eotg_clayd.0002.desc:0 "The demolition contract. I knew people were inside. I said the building was clear. The explosives erased evidence tied to the police assassination. I remember letting them walk past me. I didn't stop them."
 eotg_clayd.0002.a:0 "It was business."
 eotg_clayd.0002.b:0 "I should've stopped them."
 eotg_clayd.0002.c:0 "You survive by seeing the move before it happens."

 eotg_clayd.0003.t:0 "The Year of Regret"
 eotg_clayd.0003.desc:0 "The clusters are quiet. Too quiet. I cannot stop replaying the encounters. Could I have killed them? Or would I just be dead too? The question doesn't go away."
 eotg_clayd.0003.a:0 "Nobody could've stopped them."
 eotg_clayd.0003.b:0 "I should've killed them when I had the chance."
 eotg_clayd.0003.c:0 "The problem was weakness."

 eotg_clayd.0004.t:0 "The Systems That Failed"
 eotg_clayd.0004.desc:0 "The recovered Helix archives are damning. Executives ignored every warning. Corruption spread throughout. Contingency systems failed repeatedly. Helix was already dead before Xerxes drowned."
 eotg_clayd.0004.a:0 "Then Helix deserves burial."
 eotg_clayd.0004.b:0 "Then Helix must become disciplined."
 eotg_clayd.0004.c:0 "No committees. No weakness. Never again."

 eotg_clayd.0005.t:0 "Karim's Shadow"
 eotg_clayd.0005.desc:0 "A smuggler claims someone matching Karim's profile was seen near old Helix trade routes. No confirmation. No proof. Just enough to make the back of my neck tighten."
 eotg_clayd.0005.a:0 "Find him."
 eotg_clayd.0005.b:0 "Prepare for him."
 eotg_clayd.0005.c:0 "If he comes back, he dies."

 eotg_clayd.0006.t:0 "The Heir and the Future"
 eotg_clayd.0006.desc:0 "For the first time, I look at my heir and think beyond my own survival. What should Helix become? What am I actually building here?"
 eotg_clayd.0006.a:0 "They deserve stability."
 eotg_clayd.0006.b:0 "Helix should rule what weaker systems couldn't."
 eotg_clayd.0006.c:0 "Nothing will ever catch us unprepared again."

 eotg_clayd.0007.t:0 "The Thing That Survived"
 eotg_clayd.0007.desc:0 "I stand overlooking a reconstructed Helix facility. Drainage tunnels. Gangs. Collapsed systems. Dead executives. Fear. Everything above me failed. And I did not."
 eotg_clayd.0007.a:0 "Survival is enough."
 eotg_clayd.0007.b:0 "The world belongs to those willing to become harder."
 eotg_clayd.0007.c:0 "I will build something that outlives fear."

 # ── 7th Legion Event Localization ────────────────────────────────────────────
 eotg_7thlegion.0001.t:0 "The Board Vote"
 eotg_7thlegion.0001.desc:0 "The Legion Board has convened. A proposal: should the 7th remain a mercenary organization, or evolve into an independent strategic force? New Cauldron observers are watching nervously."
 eotg_7thlegion.0001.a:0 "We are soldiers-for-hire. Nothing more."
 eotg_7thlegion.0001.b:0 "Contracts are leverage."
 eotg_7thlegion.0001.c:0 "We decide where the Legion marches."

 eotg_7thlegion.0002.t:0 "The Leak"
 eotg_7thlegion.0002.desc:0 "A leaked report has surfaced in New Cauldron media. It accuses the 7th Legion of civilian disappearances, black-site operations, and battlefield executions. Public outrage is spreading."
 eotg_7thlegion.0002.a:0 "Deny everything."
 eotg_7thlegion.0002.b:0 "Blame subcontractors."
 eotg_7thlegion.0002.c:0 "Fear keeps order."

 eotg_7thlegion.0003.t:0 "The Contract Problem"
 eotg_7thlegion.0003.desc:0 "We have received conflicting contracts. One comes from a Myr border ruler. Another indirectly benefits New Cauldron. Neutrality is becoming impossible."
 eotg_7thlegion.0003.a:0 "Honor the contract."
 eotg_7thlegion.0003.b:0 "Choose strategic advantage."
 eotg_7thlegion.0003.c:0 "Let Lyssa solve it quietly."

 eotg_7thlegion.0004.t:0 "The Nightglass Files"
 eotg_7thlegion.0004.desc:0 "Lyssa has revealed what Nightglass has collected: dossiers on senators, governors, military officers, corporate executives. She is proposing we use them."
 eotg_7thlegion.0004.a:0 "Use the files carefully."
 eotg_7thlegion.0004.b:0 "Release enough to frighten them."
 eotg_7thlegion.0004.c:0 "Destroy them."

 eotg_7thlegion.0005.t:0 "The Sovereignty Question"
 eotg_7thlegion.0005.desc:0 "Foreign rulers have begun referring to us as 'The Seventh State.' It started as a joke. It isn't anymore. I have to decide what the Legion truly is."
 eotg_7thlegion.0005.a:0 "We are still contractors."
 eotg_7thlegion.0005.b:0 "We are protectors."
 eotg_7thlegion.0005.c:0 "We are what survives war."

 eotg_7thlegion.0006.t:0 "The Future of the Legion"
 eotg_7thlegion.0006.desc:0 "The Legion has grown beyond anyone's expectations. Contracts alone no longer define it. Lyssa and I debate what comes next."
 eotg_7thlegion.0006.a:0 "We endure through discipline."
 eotg_7thlegion.0006.b:0 "Power belongs to those who know secrets."
 eotg_7thlegion.0006.c:0 "No ruler commands us again."

 # ── New Cauldron Char Event Localization ──────────────────────────────────────
 eotg_newcauldron_char.0001.t:0 "The Legion Question"
 eotg_newcauldron_char.0001.desc:0 "Following the Echelon-12 Massacre, public trust in mercenary institutions is collapsing. The Senate is debating what to do with the 7th Legion. I have become the public face of the anti-Legion bloc."
 eotg_newcauldron_char.0001.a:0 "Keep them under scrutiny."
 eotg_newcauldron_char.0001.b:0 "Investigate everything."
 eotg_newcauldron_char.0001.c:0 "Avoid open confrontation."

 eotg_newcauldron_char.0002.t:0 "The Public Panic"
 eotg_newcauldron_char.0002.desc:0 "Media outlets have released survivor testimonies tied to Legion operations. Fear is spreading rapidly. Citizens are asking: who really governs the Cluster?"
 eotg_newcauldron_char.0002.a:0 "Calm the public."
 eotg_newcauldron_char.0002.b:0 "Use the panic."
 eotg_newcauldron_char.0002.c:0 "Blame the Senate opposition."

 eotg_newcauldron_char.0003.t:0 "The Committee Hearings"
 eotg_newcauldron_char.0003.desc:0 "The Senate Oversight Committees have summoned representatives tied to Legion contracts. Evidence of illegal detentions and off-book funding is emerging. But proving anything is difficult."
 eotg_newcauldron_char.0003.a:0 "Push for accountability."
 eotg_newcauldron_char.0003.b:0 "Quietly negotiate."
 eotg_newcauldron_char.0003.c:0 "Bury the hearings."

 eotg_newcauldron_char.0004.t:0 "The Nightglass Scandal"
 eotg_newcauldron_char.0004.desc:0 "Evidence has emerged that Nightglass operatives have infiltrated Senate offices, press networks, and committee staff. The Republic has already been penetrated. I don't know how deep it goes."
 eotg_newcauldron_char.0004.a:0 "Purge compromised officials."
 eotg_newcauldron_char.0004.b:0 "Counter-infiltrate."
 eotg_newcauldron_char.0004.c:0 "Hide this from the public."

 eotg_newcauldron_char.0005.t:0 "Emergency Powers"
 eotg_newcauldron_char.0005.desc:0 "Several senators are demanding authority expansion. Can the Republic survive this without compromising itself? That is not a rhetorical question anymore."
 eotg_newcauldron_char.0005.a:0 "Emergency powers are temporary."
 eotg_newcauldron_char.0005.b:0 "The Republic must defend itself aggressively."
 eotg_newcauldron_char.0005.c:0 "Reject emergency authority."

 eotg_newcauldron_char.0006.t:0 "The Future of New Cauldron"
 eotg_newcauldron_char.0006.desc:0 "The Republic has survived. But it has changed. I look at what we have become and ask: did preserving the Republic require becoming something harsher?"
 eotg_newcauldron_char.0006.a:0 "Transparency is strength."
 eotg_newcauldron_char.0006.b:0 "Trust must be monitored."
 eotg_newcauldron_char.0006.c:0 "Freedom means nothing if the Republic dies."

 # ── Trade League Event Localization ──────────────────────────────────────────
 eotg_tradeleague.0001.t:0 "The Scrap Yards"
 eotg_tradeleague.0001.desc:0 "The League prospers from massive scrapyard and industrial reclamation operations. Rughan argues too much is stripped and sold immediately. I disagree. Profit is not a sin."
 eotg_tradeleague.0001.a:0 "Sell everything not bolted down."
 eotg_tradeleague.0001.b:0 "Reserve strategic infrastructure."
 eotg_tradeleague.0001.c:0 "Let the ogres manage reconstruction."

 eotg_tradeleague.0002.t:0 "The Ogre Bargain"
 eotg_tradeleague.0002.desc:0 "Historical records have surfaced regarding the original Ogre Bargain. The promises made to the ogres were never truly honored. Rughan is furious. I see political danger."
 eotg_tradeleague.0002.a:0 "The old agreements are irrelevant."
 eotg_tradeleague.0002.b:0 "Offer limited concessions."
 eotg_tradeleague.0002.c:0 "Rebuild the bargain properly."

 eotg_tradeleague.0003.t:0 "The Cost of Profit"
 eotg_tradeleague.0003.desc:0 "Industrial overharvesting has begun damaging key production zones. Rughan warns that eventually there will be nothing left to salvage. I see slowing profit margins."
 eotg_tradeleague.0003.a:0 "Expand extraction."
 eotg_tradeleague.0003.b:0 "Slow production."
 eotg_tradeleague.0003.c:0 "Industrialize instead of scavenging."

 eotg_tradeleague.0004.t:0 "The Builder's Question"
 eotg_tradeleague.0004.desc:0 "Rughan has presented a formal proposal: stop acting like scavengers and start building permanent infrastructure. Much of the goblin merchant elite opposes this. So do I."
 eotg_tradeleague.0004.a:0 "Profit comes first."
 eotg_tradeleague.0004.b:0 "Build carefully."
 eotg_tradeleague.0004.c:0 "Let Rughan lead the reconstruction effort."

 eotg_tradeleague.0005.t:0 "The Industrial Divide"
 eotg_tradeleague.0005.desc:0 "The League is fracturing. One side wants endless profit extraction. The other wants stable industrial civilization. I must choose which future I am willing to fight for."
 eotg_tradeleague.0005.a:0 "Protect the shareholders."
 eotg_tradeleague.0005.b:0 "Balance profit and stability."
 eotg_tradeleague.0005.c:0 "The future belongs to builders."

 eotg_tradeleague.0006.t:0 "The Future of the League"
 eotg_tradeleague.0006.desc:0 "The League has become enormously powerful. But what is it now? A machine for profit? Or the foundation of something permanent? I cannot avoid the question any longer."
 eotg_tradeleague.0006.a:0 "Everything has a price."
 eotg_tradeleague.0006.b:0 "A stable system outlives quick profit."
 eotg_tradeleague.0006.c:0 "Builders should rule the future."

 # ── Coldiron Event Localization ───────────────────────────────────────────────
 eotg_coldiron.0001.t:0 "The Ice Mandate"
 eotg_coldiron.0001.desc:0 "A senior cleric has questioned whether the Caliphate has grown too rigid to survive modern instability. I must publicly define what the Ice Mandate means now — for this era, not the last one."
 eotg_coldiron.0001.a:0 "Discipline preserves civilization."
 eotg_coldiron.0001.b:0 "Stability requires adaptation."
 eotg_coldiron.0001.c:0 "Fear keeps weak men obedient."

 eotg_coldiron.0002.t:0 "The Brothers"
 eotg_coldiron.0002.desc:0 "My younger brothers have begun gathering supporters. Neither openly rebels. Both quietly prepare. The court has noticed. So have I."
 eotg_coldiron.0002.a:0 "Keep them close."
 eotg_coldiron.0002.b:0 "Divide their influence."
 eotg_coldiron.0002.c:0 "Remind them who rules."

 eotg_coldiron.0003.t:0 "The Young Sons"
 eotg_coldiron.0003.desc:0 "I watch my sons train. Too young. Too untested. Yet the realm may soon depend on them. The clergy have begun discussing succession openly. That cannot be allowed to continue unchecked."
 eotg_coldiron.0003.a:0 "Prepare them carefully."
 eotg_coldiron.0003.b:0 "Shield them from politics."
 eotg_coldiron.0003.c:0 "Make them understand fear early."

 eotg_coldiron.0004.t:0 "The Clerical Divide"
 eotg_coldiron.0004.desc:0 "The clergy has fractured into two blocs: the Preservers, who demand rigid tradition, and the Renewalists, who believe adaptation is necessary. The realm cannot survive open theological warfare."
 eotg_coldiron.0004.a:0 "Support the Preservers."
 eotg_coldiron.0004.b:0 "Support the Renewalists."
 eotg_coldiron.0004.c:0 "Suppress both factions."

 eotg_coldiron.0005.t:0 "The Frozen Threshold"
 eotg_coldiron.0005.desc:0 "Riots have erupted near industrial shrine districts. People fear the succession crisis, economic decline, divine abandonment. The realm has begun to fear its own future."
 eotg_coldiron.0005.a:0 "Reassure the people."
 eotg_coldiron.0005.b:0 "Strengthen enforcement."
 eotg_coldiron.0005.c:0 "Redirect fear toward external enemies."

 eotg_coldiron.0006.t:0 "The Future of the Caliphate"
 eotg_coldiron.0006.desc:0 "I reflect on what the Caliphate has become. A realm can survive through discipline, reform, or fear. But never without cost. The weight beneath the ice is what I leave behind."
 eotg_coldiron.0006.a:0 "Continuity is victory."
 eotg_coldiron.0006.b:0 "Rigidity breaks. Adaptation survives."
 eotg_coldiron.0006.c:0 "Fear preserves what weakness destroys."

 # ── Ratfolk Event Localization ────────────────────────────────────────────────
 eotg_ratfolk.0001.t:0 "The Broken Weave"
 eotg_ratfolk.0001.desc:0 "I have been studying old tunnel maps. Entire transport systems no longer function properly. The ratfolk world is literally splitting apart underground. Separation cannot continue forever."
 eotg_ratfolk.0001.a:0 "Rebuild the networks."
 eotg_ratfolk.0001.b:0 "Prepare for war."
 eotg_ratfolk.0001.c:0 "The Vessels must be infiltrated first."

 eotg_ratfolk.0002.t:0 "Beneath the Tunnels"
 eotg_ratfolk.0002.desc:0 "Scouts report worsening tunnel collapses. Entire food lines are failing. The Vessels blame my reforms. I blame their doctrinal stagnation. One of us is right."
 eotg_ratfolk.0002.a:0 "Stabilize the lower routes."
 eotg_ratfolk.0002.b:0 "Redirect supplies militarily."
 eotg_ratfolk.0002.c:0 "Let the shortages weaken the Vessels."

 eotg_ratfolk.0003.t:0 "The Doctrine of Unity"
 eotg_ratfolk.0003.desc:0 "Both sides are now publicly claiming that only their vision can reunify the ratfolk. The ideological divide has become irreversible. What we do next will determine everything."
 eotg_ratfolk.0003.a:0 "Unity requires adaptation."
 eotg_ratfolk.0003.b:0 "Unity requires obedience."
 eotg_ratfolk.0003.c:0 "Unity requires survival at any cost."

 eotg_ratfolk.0004.t:0 "Rust and Hunger"
 eotg_ratfolk.0004.desc:0 "The Blooded Frontier is deteriorating. Rust-slurry contamination spreads. Refugees are flooding nearby tunnel sectors. The pressure is becoming unbearable."
 eotg_ratfolk.0004.a:0 "Aid the refugees."
 eotg_ratfolk.0004.b:0 "Seal compromised sectors."
 eotg_ratfolk.0004.c:0 "Use the chaos."

 eotg_ratfolk.0005.t:0 "The Reunification War"
 eotg_ratfolk.0005.desc:0 "Negotiations have failed completely. The tunnels erupt into total conflict. Both sides have declared that reunification is now unavoidable. The war has begun."
 eotg_ratfolk.0005.a:0 "Crush them quickly."
 eotg_ratfolk.0005.b:0 "Break their supply tunnels."
 eotg_ratfolk.0005.c:0 "Turn their people against them."

 eotg_ratfolk.0006.t:0 "The Future of the Warrens"
 eotg_ratfolk.0006.desc:0 "The war has ended. The warrens are united again. But what kind of civilization survives? That question remains unanswered."
 eotg_ratfolk.0006.a:0 "The warrens must function together again."
 eotg_ratfolk.0006.b:0 "Order must never fracture again."
 eotg_ratfolk.0006.c:0 "Weakness nearly destroyed us."

 # ── Xerxes Event Localization ─────────────────────────────────────────────────
 eotg_xerxes.0001.t:0 "The Waters Recede"
 eotg_xerxes.0001.desc:0 "The waters continue pulling back from the ruined districts. Collapsed towers emerge from the surf. Old roads reappear. The people celebrate. Others fear what still lies beneath the mud."
 eotg_xerxes.0001.a:0 "Xerxes belongs to the elves once more."
 eotg_xerxes.0001.b:0 "We rebuild carefully."
 eotg_xerxes.0001.c:0 "The flood changed us forever."

 eotg_xerxes.0002.t:0 "Who Saved Xerxes?"
 eotg_xerxes.0002.desc:0 "Bards, priests, survivors, and scholars argue endlessly about who truly banished the Great Water Oni. Whoever history credits may shape Xerxes' identity for centuries. I will choose which legend becomes truth."
 eotg_xerxes.0002.a:0 "It was Chaddy-O who froze the demon tides."
 eotg_xerxes.0002.b:0 "Skrit shattered the Oni's hold through industry and will."
 eotg_xerxes.0002.c:0 "Nimbus stood for Xerxes when all others fled."
 eotg_xerxes.0002.d:0 "Only a monster could destroy another monster."
 eotg_xerxes.0002.e:0 "Calix technology weakened the Oni before its banishment."

 eotg_xerxes.0003.t:0 "The Reclamation Debate"
 eotg_xerxes.0003.desc:0 "More flooded districts have become accessible. The question erupts: who deserves reclaimed lands? The answer I give will set a precedent for everything that follows."
 eotg_xerxes.0003.a:0 "Return them to old elven houses."
 eotg_xerxes.0003.b:0 "Reward those who survived the flood."
 eotg_xerxes.0003.c:0 "Hold the lands under crown authority."

 eotg_xerxes.0004.t:0 "The Sea-Born Question"
 eotg_xerxes.0004.desc:0 "Some elves still bear sea-born traits from the flood years. Traditionalists demand exclusion. Others argue they are victims too. I cannot avoid this decision any longer."
 eotg_xerxes.0004.a:0 "They are still our people."
 eotg_xerxes.0004.b:0 "Keep them separate."
 eotg_xerxes.0004.c:0 "Purge the corruption."

 eotg_xerxes.0005.t:0 "The Purity of Xerxes"
 eotg_xerxes.0005.desc:0 "The flood is becoming memory. Memory is becoming politics. I realize now that what Xerxes chooses to remember will determine what it becomes."
 eotg_xerxes.0005.a:0 "A restored homeland."
 eotg_xerxes.0005.b:0 "A stronger people forged by catastrophe."
 eotg_xerxes.0005.c:0 "A realm that never forgets."

 eotg_xerxes.0006.t:0 "The Future of Xerxes"
 eotg_xerxes.0006.desc:0 "The waters have fully receded from much of Xerxes. Ruins remain. Scars remain. But civilization endures. What was truly saved?"
 eotg_xerxes.0006.a:0 "We reclaimed what was ours."
 eotg_xerxes.0006.b:0 "The flood changed us. We survived anyway."
 eotg_xerxes.0006.c:0 "Forgetting invites ruin."

 # ── Rughan Event Localization ─────────────────────────────────────────────────
 eotg_rughan.0001.t:0 "The Scrap Mountains"
 eotg_rughan.0001.desc:0 "I oversee colossal scrapyards. Entire districts are dismantled and sold piece by piece. I realize: very little is actually being built anymore. Only stripped."
 eotg_rughan.0001.a:0 "Scrap keeps us alive."
 eotg_rughan.0001.b:0 "We should be rebuilding."
 eotg_rughan.0001.c:0 "One day there will be nothing left to tear apart."

 eotg_rughan.0002.t:0 "The Mercenary's Story"
 eotg_rughan.0002.desc:0 "A 7th Legion mercenary visits the dismantling yard. Drunk and exhausted, he speaks about Helix collapse, corporate arrogance, Karim, systems built only for extraction. I listen carefully."
 eotg_rughan.0002.a:0 "Empires always collapse."
 eotg_rughan.0002.b:0 "Then we build stronger systems."
 eotg_rughan.0002.c:0 "Weak leadership caused collapse."

 eotg_rughan.0003.t:0 "The Ogre Bargain"
 eotg_rughan.0003.desc:0 "I have studied the records of the original Ogre Bargain. The promises were clear: partnership, shared prosperity, territorial rights. Instead, ogres became dependent specialists under goblin financial control. I am furious."
 eotg_rughan.0003.a:0 "The bargain was broken."
 eotg_rughan.0003.b:0 "The bargain can still be repaired."
 eotg_rughan.0003.c:0 "Power respects leverage, not fairness."

 eotg_rughan.0004.t:0 "The Builder's Anger"
 eotg_rughan.0004.desc:0 "I tour a ruined industrial district. Collapsed rail systems. Stripped foundries. Abandoned worker sectors. The League consumes faster than it creates. I have run out of patience."
 eotg_rughan.0004.a:0 "Rebuild the districts."
 eotg_rughan.0004.b:0 "Centralize industrial authority."
 eotg_rughan.0004.c:0 "Let collapse teach them."

 eotg_rughan.0005.t:0 "The Fracture in the League"
 eotg_rughan.0005.desc:0 "Goblin elites have begun viewing me as dangerous. Workers and engineers increasingly support my position. A split has emerged: profit extraction elites versus industrial reconstruction bloc."
 eotg_rughan.0005.a:0 "Compromise with the goblins."
 eotg_rughan.0005.b:0 "Force restructuring."
 eotg_rughan.0005.c:0 "The engineers should govern."

 eotg_rughan.0006.t:0 "The Future Built From Ruin"
 eotg_rughan.0006.desc:0 "I stand overlooking rebuilt infrastructure. For the first time in generations, something new is being constructed instead of dismantled. What should survive after us?"
 eotg_rughan.0006.a:0 "Prosperity must be sustainable."
 eotg_rughan.0006.b:0 "Builders deserve control of the future."
 eotg_rughan.0006.c:0 "Weakness created decay."

 # ── Epilogue Event Localization ───────────────────────────────────────────────

 # eotg_xerxes.0007 — The Shore That Remained
 eotg_xerxes.0007.t:0 "The Shore That Remained"
 eotg_xerxes.0007.desc_restored:0 "The old houses have reclaimed their halls. Flooded districts are mapped, registered, and returned to elven lineages that survived the Oni's storm. The waters are gone. What they left behind belongs to the elves once more. Xerxes stands as it was — or as close as anything can stand to what it was, after all this."
 eotg_xerxes.0007.desc_forged:0 "A people who survived a god's fury and kept fighting do not simply return to what they were. The flood forged Xerxes into something harder, stranger, more enduring. The rebuilt city is not the old Xerxes. It is better."
 eotg_xerxes.0007.desc_vigilant:0 "Memory is now policy. The names of the drowned are carved into every public wall. Every flood district is a monument. No one in Xerxes will be allowed to forget — and in that refusal to forget, there is a kind of power no invader can strip away."
 eotg_xerxes.0007.opt_restored:0 "Xerxes is what it was always meant to be."
 eotg_xerxes.0007.opt_forged:0 "We are forged, not restored. That is the greater achievement."
 eotg_xerxes.0007.opt_vigilant:0 "Memory is the only fortress that never floods."

 # eotg_clayd.0008 — What the Scar Left Behind
 eotg_clayd.0008.t:0 "What the Scar Left Behind"
 eotg_clayd.0008.desc_survived:0 "Fear kept you alive through things that destroyed better-equipped and better-connected people. It did not destroy you. Not yet. You sit in a functional Helix facility and realize that survival, plain and stubborn and unbeautiful, is its own kind of victory."
 eotg_clayd.0008.desc_hardened:0 "You became harder than the world that tried to break you. Maybe that was always what survival required. The paranoia sharpened into something useful. The fear became a tool. Whether it still serves you, or whether you now serve it, is the question you no longer ask."
 eotg_clayd.0008.desc_built:0 "The fear is still there. It will always be there. But the thing you built from it — the system, the continuity, the future that will outlast your own paranoia — that is real. That is yours. That is what outlives a scar."
 eotg_clayd.0008.opt_survived:0 "Surviving was enough. That was always enough."
 eotg_clayd.0008.opt_hardened:0 "The world belongs to those willing to become what it required."
 eotg_clayd.0008.opt_built:0 "Fear ends. What I built does not."

 # eotg_coldiron.0007 — What the Caliphate Endures
 eotg_coldiron.0007.t:0 "What the Caliphate Endures"
 eotg_coldiron.0007.desc_enduring:0 "The ice holds. The doctrine holds. The Caliphate holds. Centuries of rigid tradition were not weakness — they were the architecture of survival. The clerics who doubted you are silent now. The ones who believed have been vindicated."
 eotg_coldiron.0007.desc_reformed:0 "What adapted survived. The Renewalists found their voice within the framework you preserved, and the result is a Caliphate that breathes rather than freezes. The brothers who schemed to undermine you misjudged both your patience and your purpose."
 eotg_coldiron.0007.desc_frozen:0 "Fear works until it doesn't. For now, it has worked — longer than patience ever did in this realm. The brothers are quiet. The clerics are careful. The people obey. Whether that outlasts you is someone else's problem."
 eotg_coldiron.0007.opt_enduring:0 "The Caliphate was built to last. It has."
 eotg_coldiron.0007.opt_reformed:0 "What bends survives. What breaks did not deserve to."
 eotg_coldiron.0007.opt_frozen:0 "They fear, therefore they obey. That has always been enough."

 # eotg_lanius.0006 — The Name Myr Will Carry
 eotg_lanius.0006.t:0 "The Name Myr Will Carry"
 eotg_lanius.0006.desc_recognized:0 "The declaration was real. The recognition, once given, holds weight in every court that touches Myr's orbit. You did not manufacture a legend — you became one, with the Synod's own words as testament. The title will outlast the politics that made it necessary."
 eotg_lanius.0006.desc_ambitious:0 "The Synod's blessing was never the point. The point was always what came after — the territory held, the alliances sealed, the realm that forms around a name powerful enough to claim it. You will not be remembered as someone who needed their permission."
 eotg_lanius.0006.desc_independent:0 "Their blessing was withheld and it changed nothing. You ruled despite them. You expanded despite them. The title held despite them. In the end, that is the harder proof of legitimacy — not recognition, but the impossibility of denial."
 eotg_lanius.0006.opt_recognized:0 "The record is set. Let Myr carry it."
 eotg_lanius.0006.opt_ambitious:0 "The Synod was never the prize. Only the beginning."
 eotg_lanius.0006.opt_independent:0 "Their silence was acknowledgment enough."

 # eotg_ratfolk.0007 — The Warren That Holds
 eotg_ratfolk.0007.t:0 "The Warren That Holds"
 eotg_ratfolk.0007.desc_restored:0 "The networks reconnect, tunnel by tunnel, passage by passage. The old maps become useful again. What was broken has been rebuilt differently — not quite what it was, but functional, breathing, alive. The warrens hold."
 eotg_ratfolk.0007.desc_disciplined:0 "Order was won by violence. It is kept by fear. The Vessel factions were crushed completely and their remnant systems absorbed into yours. The warrens hold — rigid, silent, intact. No one celebrates. No one fractures."
 eotg_ratfolk.0007.desc_dominant:0 "Survival was always the doctrine. The weak factions tested it and proved it. The strong tunnels swallowed the rest. What remains is unified — not by agreement, not by love, but by the inability to resist any longer."
 eotg_ratfolk.0007.opt_restored:0 "The warrens breathe again. That was always the goal."
 eotg_ratfolk.0007.opt_disciplined:0 "Order is the only mercy a warren can afford."
 eotg_ratfolk.0007.opt_dominant:0 "Strength was always the answer. Everything else was noise."

 # eotg_rughan.0007 — The Builder's Shape
 eotg_rughan.0007.t:0 "The Builder's Shape"
 eotg_rughan.0007.desc_reformed:0 "The League changed form. What was built now outlasts what was scavenged. Foundries produce instead of strip. The investment was slow, painful, and deeply resisted — and it was correct. The sustainable system endures beyond the scavenger's reach."
 eotg_rughan.0007.desc_engineer:0 "The engineers govern now. Slowly, with great argument, with zero tolerance for financial sleight-of-hand, and with a precision that the merchant class never had and always resented. You were right. Builders should control the future."
 eotg_rughan.0007.desc_industrial:0 "The regime held. The weak were replaced or absorbed. The production held. The problem was always weak leadership — structures that invited collapse by design. You cut it out and built something that could not be easily destroyed."
 eotg_rughan.0007.opt_reformed:0 "Sustainability is not a luxury. It is the only structure that survives."
 eotg_rughan.0007.opt_engineer:0 "The builders govern now. As they always should have."
 eotg_rughan.0007.opt_industrial:0 "Weak systems collapse. Strong ones endure. I built a strong one."

 # eotg_7thlegion.0007 — The Legion's Final Account
 eotg_7thlegion.0007.t:0 "The Legion's Final Account"
 eotg_7thlegion.0007.desc_professional:0 "The Legion's honor survived its controversies. The accusations were real — so were the defenses, the discipline, the record. What remains is an institution that endures because its word, when given, holds. That is rare in the Fringe."
 eotg_7thlegion.0007.desc_shadow:0 "Lyssa's files outlasted every tribunal, every press campaign, every official inquiry. So did her network. The Nightglass operation became something permanent — not a crisis but a structure. Power, properly maintained, is indistinguishable from legitimacy."
 eotg_7thlegion.0007.desc_warstate:0 "No ruler calls you mercenary now. No senate summons you to answer for contracts. The Legion is the authority in its territory, and that authority was earned by the willingness to take and hold it. No one commands you anymore."
 eotg_7thlegion.0007.opt_professional:0 "The Legion's honor outlasts the accusations. That was always the wager."
 eotg_7thlegion.0007.opt_shadow:0 "The files remain. So does the network. So do we."
 eotg_7thlegion.0007.opt_warstate:0 "No ruler commands us. That is no longer a question."

 # eotg_tradeleague.0007 — The Market That Remained
 eotg_tradeleague.0007.t:0 "The Market That Remained"
 eotg_tradeleague.0007.desc_profit:0 "You extracted everything the ruins had. Some call it reckless, short-sighted, a theft from the next generation. You call it profitable. The market does not grieve. It adjusts. What was stripped is sold. What was sold is gone. The numbers were excellent."
 eotg_tradeleague.0007.desc_commonwealth:0 "The slow investment paid off. The League built something that endures rather than something that extracts. Rughan was right — and you were smart enough to eventually agree. The market that remains is richer for the patience it required."
 eotg_tradeleague.0007.desc_engineers:0 "The ogres built what the goblins could not manage alone. Credit where it belongs. The League's future is in foundries, not scrapyards — and the credit for that belongs to the engineers who were finally given room to work."
 eotg_tradeleague.0007.opt_profit:0 "The numbers were excellent. That is the only record the market keeps."
 eotg_tradeleague.0007.opt_commonwealth:0 "A stable system outlasts its builders. That is the point."
 eotg_tradeleague.0007.opt_engineers:0 "The ogres built it. Let the record say so."

 # eotg_newcauldron_char.0007 — The Republic's Final Shape
 eotg_newcauldron_char.0007.t:0 "The Republic's Final Shape"
 eotg_newcauldron_char.0007.desc_open:0 "Transparency held. When the crisis passed, the Republic emerged with its credibility intact — a rare outcome given how many republics dissolve their own principles in the name of defending them. New Cauldron survived. So did its values."
 eotg_newcauldron_char.0007.desc_watchful:0 "The security apparatus grew beyond the crisis that built it. The monitoring systems are permanent now. A tool or a cage — both, probably, depending on who operates them next. The Republic survived. Whether what it became is worth celebrating is the question you now live with."
 eotg_newcauldron_char.0007.desc_hardened:0 "The Republic survived by becoming something harder than it intended to be. The values held — mostly. The methods expanded. The emergency powers receded slowly, if at all. New Cauldron is safe. Whether it is free is a conversation for the next generation."
 eotg_newcauldron_char.0007.opt_open:0 "The Republic held its values. That was the whole point."
 eotg_newcauldron_char.0007.opt_watchful:0 "Vigilance is the price of a Republic that survives."
 eotg_newcauldron_char.0007.opt_hardened:0 "It survived. Everything else is philosophy."

