l_english:
 # Trade Oligarchy G2 batch TO1 (resource core). Spec: docs/specs/governments_v2_g2_gobcorp.md section 9.
 eotg_gobcorp_market_share_modifier:0 "Market Share"
 eotg_gobcorp_market_share_modifier_desc:0 "Every Prince of the charter takes a cut of the realm's trade. The bigger the cut, the bigger the income."
 eotg_gobcorp_market_share_scale_desc:0 "Your market share, from 0 to 100"
 eotg_story_gobcorp_market:0 "The Charter Market"
 eotg_story_gobcorp_market_info:0 "Market Share is your slice of the trade the charter binds together. Every point of it is a point a partner does not have.\n\nEach year of peace adds 1. Each year at war costs 4. Cornering the market or undercutting a rival takes share from your partners.\n\nThe higher it is, the more you earn. At 30, 60 and 90 it adds to your vote when the next First Prince is chosen.\n\nWhen you die, your successor keeps three quarters of it, or their own if that is higher."
 eotg_story_gobcorp_market_label:0 "Market Share"
 eotg_story_gobcorp_market_min_label:0 "0"
 eotg_story_gobcorp_market_max_label:0 "100"
 eotg_story_gobcorp_market_tt:0 "This counter shows your market share, from 0 to 100."
 # Batches TO3 and TO4 (decisions, transitions)
 eotg_market_cornered_opinion:0 "Cornered My Market"
 eotg_undercut_opinion:0 "Undercut Me"
 eotg_decision_gobcorp_corner_market:0 "Corner the Market"
 eotg_decision_gobcorp_corner_market_desc:0 "Spend heavily to buy up the routes and stock that matter. Your market share rises by 15, and every Prince of the charter who answers to you loses 5 and remembers who took it."
 eotg_decision_gobcorp_corner_market_tooltip:0 "Buy your way ahead of your partners"
 eotg_decision_gobcorp_corner_market_confirm:0 "Buy them out"
 eotg_decision_gobcorp_corner_market_room_tt:0 "Your market share is below 100"
 eotg_decision_gobcorp_corner_market_share_tt:0 "Your market share rises by 15"
 eotg_decision_gobcorp_corner_market_squeeze_tt:0 "Every Trade Oligarchy [vassal|E] of yours loses 5 market share and resents it"
 eotg_decision_gobcorp_undercut_rival:0 "Undercut a Rival Prince"
 eotg_decision_gobcorp_undercut_rival_desc:0 "Sell below a partner's price until their customers come to you. You gain 10 market share and a rival Prince under the same charter loses 10. The bigger the rival, the likelier they are the one you hurt."
 eotg_decision_gobcorp_undercut_rival_tooltip:0 "Take market share from a rival Prince"
 eotg_decision_gobcorp_undercut_rival_confirm:0 "Cut the price"
 eotg_decision_gobcorp_undercut_rival_rival_exists_tt:0 "Another Prince of the charter serves your [liege|E]"
 eotg_decision_gobcorp_undercut_rival_gain_tt:0 "Your market share rises by 10"
 eotg_decision_gobcorp_undercut_rival_rival_tt:0 "A rival Prince loses 10 market share and resents you"
 eotg_decision_gobcorp_undercut_rival_toast:0 "A Rival Undercut"
 eotg_decision_gobcorp_undercut_rival_toast_desc:0 "You have undercut [eotg_gobcorp_rival.GetTitledFirstName] and taken a slice of [eotg_gobcorp_rival.GetHerHis] market"
 eotg_decision_gobcorp_adopt:0 "Sign the Charter"
 eotg_decision_gobcorp_adopt_desc:0 "Bind your realm to a trade charter and rule as its First Prince, first among equals. Only you change: your vassals keep their governments, but land you grant from now on is run under the charter."
 eotg_decision_gobcorp_adopt_tooltip:0 "Rule as a Trade Prince"
 eotg_decision_gobcorp_adopt_confirm:0 "Sign it"
 eotg_decision_gobcorp_adopt_gold_tt:0 "You have the [gold|E] to buy into the market"
 eotg_decision_gobcorp_adopt_stewardship_tt:0 "You have at least 10 [stewardship|E]"
 eotg_decision_gobcorp_dissolve_charter:0 "Dissolve the Charter"
 eotg_decision_gobcorp_dissolve_charter_desc:0 "Sell your book and become Feudal. Your market share turns into [gold|E], 5 for each point up to 500. Your Trade Oligarchy vassals become Feudal with you."
 eotg_decision_gobcorp_dissolve_charter_tooltip:0 "Sell your share of the market"
 eotg_decision_gobcorp_dissolve_charter_confirm:0 "Sell the book"
 eotg_decision_gobcorp_dissolve_charter_share_tt:0 "Your market share falls to 0"
 eotg_decision_gobcorp_dissolve_charter_effect_tt:0 "Your Trade Oligarchy vassals become Feudal with you"
