 eotg_action_frontier_breaking_combined_group_name:0 "Frontiers at Breaking Strain"
 eotg_action_frontier_breaking_combined_group_description:0 "These Frontiers are close to collapse. Find them a founder, keep war away, or invest in them before they fail."
 eotg_action_frontier_founderless:0 "Frontier Without a Founder"
 eotg_action_frontier_founderless_label:0 "[landed_title.GetName] has no founder"
 eotg_action_frontier_founderless_desc:0 "Nobody leads the Frontier in [landed_title.GetName]. Strain will climb every year until a founder is appointed."
 eotg_action_frontier_founderless_click:0 "#I Click to open the Appoint a Founder decision#!"
 eotg_action_frontier_founderless_unimportant:0 "@warning_icon! #X There is no adult, free character at your court to appoint#!"
