l_english:
# Top-bar alerts for the Frontier (common/important_actions/eotg_important_actions.txt). Batch INT1.
 eotg_action_frontier_breaking:0 "Frontier at Breaking Strain"
 eotg_action_frontier_breaking_label:0 "[landed_title.GetName] is breaking"
 eotg_action_frontier_breaking_desc:0 "The settlers of the Frontier in [landed_title.GetName] are at breaking point. Unless the strain eases, the Frontier may fail."
 eotg_action_frontier_breaking_click:0 "#I Click to open the Shoal [landed_title.GetName]#!"
 eotg_action_frontier_breaking_combined_label:0 "[landed_title.GetName]"
