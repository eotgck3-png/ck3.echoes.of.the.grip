 l_english:
 # ── Elven Monarchy Government ──────────────────────────────────────────────────

 eotg_elven_monarchy_government:0 "Elven Monarchy"
 eotg_elven_monarchy_government_adjective:0 "Elven"
 eotg_elven_monarchy_government_realm:0 "Court"
 eotg_elven_monarchy_government_desc:0 "A divine-right monarchy rooted in ancient elven tradition. The Eternal Court ratifies each succession, and non-elven subjects occupy a permanent second-class status. Isolationism scales with power — a county Star Warden is merely snobbish; a Starborn Sovereign actively repels galactic diplomacy."

 # ── Customizable Localization ──────────────────────────────────────────────────

 eotg_holding_name_elven_monarchy:0 "Star Hold"
 eotg_vassal_tier_one_elven_monarchy:0 "Star Warden"
 eotg_vassal_tier_two_elven_monarchy:0 "Celestial Lord"
 eotg_vassal_tier_three_elven_monarchy:0 "Eternal Regent"
 eotg_ruler_title_elven_monarchy:0 "Starborn Sovereign"
 eotg_realm_name_elven_monarchy:0 "The Eternal Court"
 eotg_succession_flavor_elven_monarchy:0 "The stars endure. The Court convenes. Another sovereign takes the ancient throne."
 eotg_faction_name_elven_monarchy:0 "The Old Court"

 # ── Contract Obligations ───────────────────────────────────────────────────────

 eotg_elven_monarchy_vassal:0 "Eternal Court Obligations"
 eotg_elven_monarchy_vassal_desc:0 "The duties owed to the Starborn Sovereign by vassals of the Eternal Court."

 eotg_elven_star_tithe:0 "Star Tithe"
 eotg_elven_star_tithe_desc:0 "Tribute paid to the Eternal Court. A tradition older than any living memory."

 eotg_elven_tithe_modest:0 "Modest Offering"
 eotg_elven_tithe_modest_short:0 "Modest"
 eotg_elven_tithe_modest_desc:0 "A token tribute — enough to acknowledge the Sovereign without strain."

 eotg_elven_tithe_standard:0 "Court Tribute"
 eotg_elven_tithe_standard_short:0 "Standard"
 eotg_elven_tithe_standard_desc:0 "The expected share. Sustainable and tradition-bound."

 eotg_elven_tithe_full:0 "Full Tithe"
 eotg_elven_tithe_full_short:0 "Full"
 eotg_elven_tithe_full_desc:0 "The Sovereign takes the full ancestral share. Vassals remember."

 eotg_elven_court_service:0 "Court Service"
 eotg_elven_court_service_desc:0 "Military service to the Eternal Court. Star Wardens and Celestial Lords field forces for the Sovereign's campaigns."

 eotg_elven_service_minimal:0 "Token Muster"
 eotg_elven_service_minimal_short:0 "Token"
 eotg_elven_service_minimal_desc:0 "A ceremonial force. Enough to show solidarity in the old way."

 eotg_elven_service_standard:0 "Standard Muster"
 eotg_elven_service_standard_short:0 "Standard"
 eotg_elven_service_standard_desc:0 "A meaningful contribution to the Sovereign's military strength."

 eotg_elven_service_full:0 "Full Muster"
 eotg_elven_service_full_short:0 "Full"
 eotg_elven_service_full_desc:0 "Every capable warrior called to the Sovereign's banner."

 eotg_elven_court_standing:0 "Eternal Court Standing"
 eotg_elven_court_standing_desc:0 "Formal recognition as a standing member of the Eternal Court. Increases succession support weight and confers prestige."

 eotg_elven_standing_none:0 "No Standing"
 eotg_elven_standing_none_short:0 "None"
 eotg_elven_standing_none_desc:0 "The vassal holds no formal Court position."

 eotg_elven_standing_granted:0 "Court Member"
 eotg_elven_standing_granted_short:0 "Member"
 eotg_elven_standing_granted_desc:0 "Recognized by the Eternal Court. Voice in ratification proceedings."

 # ── Decisions ─────────────────────────────────────────────────────────────────

 eotg_elven_cultural_appeal:0 "Issue Cultural Appeal"
 eotg_elven_cultural_appeal_confirm:0 "Call on all elven rulers to affirm solidarity with the Eternal Court."
 eotg_elven_cultural_appeal_desc:0 "Elven solidarity runs deeper than faith, politics, or distance. A formal Cultural Appeal from the Starborn Sovereign carries weight that transcends any political alignment."
 eotg_elven_cultural_appeal_tooltip:0 "Send a Cultural Appeal to all elven vassals and nearby independent elven rulers."
 eotg_elven_cultural_appeal_effect_tooltip:0 "Powerful elven vassals and nearby independent elven rulers receive the appeal. Most will affirm solidarity, improving relations and granting prestige."

 eotg_elven_decree_court_purity:0 "Decree of Court Purity"
 eotg_elven_decree_court_purity_confirm:0 "Formally expel all non-elven councillors from the Eternal Court."
 eotg_elven_decree_court_purity_desc:0 "The Eternal Court is an elven institution. Non-elven appointments are a concession to political necessity — one that can be revoked. The Decree is final."
 eotg_elven_decree_court_purity_tooltip:0 "Dismiss all non-elven characters from council positions."
 eotg_elven_decree_court_purity_effect_tooltip:0 "All non-elven councillors are immediately dismissed. The Court Purity modifier is applied for 5 years, preventing further non-elven appointments by tradition."

 # ── Modifiers ─────────────────────────────────────────────────────────────────

 eotg_elven_isolationism_county:0 "Provincial Snobbery"
 eotg_elven_isolationism_county_desc:0 "A Star Warden's instinctive disdain for non-elven customs. Polite but unmistakable."

 eotg_elven_isolationism_duchy:0 "Court Aloofness"
 eotg_elven_isolationism_duchy_desc:0 "A Celestial Lord's measured distance from the lesser races. Diplomatic but cold."

 eotg_elven_isolationism_kingdom:0 "Sovereign Exclusion"
 eotg_elven_isolationism_kingdom_desc:0 "An Eternal Regent's active management of non-elven influence. Outsiders are not welcome at Court."

 eotg_elven_isolationism_empire:0 "Galactic Isolationism"
 eotg_elven_isolationism_empire_desc:0 "A Starborn Sovereign's active repulsion of galactic diplomacy. Non-elven nations are acknowledged only when they cannot be ignored."

 eotg_elven_court_confirmed:0 "Court Mandate"
 eotg_elven_court_confirmed_desc:0 "The Eternal Court has ratified this succession with strong support. The Sovereign's legitimacy is beyond question."

 eotg_elven_court_contested:0 "Contested Succession"
 eotg_elven_court_contested_desc:0 "The Eternal Court's ratification was grudging. Vassals watch for weakness."

 eotg_elven_succession_crisis:0 "Succession Crisis"
 eotg_elven_succession_crisis_desc:0 "A powerful vassal has backed a rival claimant. The Eternal Court is divided. The Sovereign rules on borrowed time."

 eotg_elven_court_purity_active:0 "Court Purity Decree"
 eotg_elven_court_purity_active_desc:0 "The Decree of Court Purity is active. Non-elven appointments to council positions are formally forbidden by ancient law."

 # ── Succession Events ─────────────────────────────────────────────────────────

 eotg_elven_court_0001_title:0 "The Eternal Court Convenes"
 eotg_elven_court_0001_desc_strong:0 "The Court's senior members have gathered. The word from your Eternal Regents is clear — the succession is affirmed, the mandate strong. You begin your reign with the Court's full blessing."
 eotg_elven_court_0001_desc_moderate:0 "The Court has debated. The voices for ratification outnumber those against, but the margin is slim. You will reign — but with questions hanging over the legitimacy of your succession."
 eotg_elven_court_0001_desc_weak:0 "The Court is hostile. No powerful vassal stands to affirm your succession without reservation. The ancient rite becomes a battlefield. Somewhere in the Court, a rival claimant is finding backing."

 eotg_elven_court_0001_opt_accept_strong:0 "The Court has spoken. Long may I reign."
 eotg_elven_court_0001_opt_accept_moderate:0 "I accept the ratification, however conditional."
 eotg_elven_court_0001_opt_crisis:0 "Then I will prove my right through action, not ceremony."

 eotg_elven_court_confirmed_strong_title:0 "A Strong Succession"
 eotg_elven_court_confirmed_strong_desc:0 "The Eternal Court has ratified the new Starborn Sovereign's succession with strong support. The mandate is clear."

 eotg_elven_court_confirmed_weak_title:0 "A Contested Succession"
 eotg_elven_court_confirmed_weak_desc:0 "The Eternal Court has ratified the new Starborn Sovereign's succession, but not without dissent. Watch for opportunists."

 # court.0002 and .0003 were retired 2026-08-28 — see the header of
 # events/eotg_elven_monarchy_succession_events.txt. Their keys are gone with
 # them; .0005 and .0006 below are the reachable replacements.

 eotg_elven_court_0004_title:0 "A Rival Claimant Rises"
 eotg_elven_court_0004_desc:0 "The new Sovereign's ratification was weak enough that an Eternal Regent has found a rival claimant. The Court's blessing is not absolute — it must be fought for."

 eotg_elven_court_0004_opt_back_rival:0 "Back the rival. The Court's judgment is my judgment."
 eotg_elven_court_0004_opt_defer:0 "Defer. The succession is done, however weak."

 # ── Confirmation aftermath ────────────────────────────────────────────────────
 # Fired years later from eotg_on_yearly_elven_flavor, gated on the modifier the
 # confirmation left behind. Replaces retired court.0002/.0003.

 eotg_elven_court_0005_title:0 "The Court's Long Memory"
 eotg_elven_court_0005_desc:0 "An elder of the Eternal Court requests an audience, and does not come to the point quickly. That is not evasion. It is form.\n\nWhen the point arrives it is this: your confirmation was unanimous. Not merely favorable — unanimous, which the Court had not granted in some centuries and did not grant lightly. The elder observes that a mandate of that kind is understood, among elves, to be the opening of an account rather than the closing of one.\n\nThere is a matter before the Court now on which your voice would settle things. No threat is made. None is needed. The Court has waited this long to raise it precisely because it can afford to wait longer."
 eotg_elven_court_0005_opt_honor:0 "The account is real. Settle it."
 eotg_elven_court_0005_opt_refuse:0 "A mandate is not a leash. The Court will learn the difference."
 eotg_elven_court_0005_opt_defer:0 "Let the matter wait. Elves are patient — and so am I."

 eotg_elven_court_0006_title:0 "A Throne the Court Did Not Choose"
 eotg_elven_court_0006_desc:0 "It is not obstruction. Obstruction could be named, and answered.\n\nIt is that your writs are implemented correctly and slowly. That the Court's advice arrives thorough, unhelpful, and after the decision has been made. That every ratification you seek is granted on the last permissible day. Nothing in it is refusal. All of it is the same sentence, repeated: this seat was taken, not given.\n\nAn elven court can sustain a posture like this for longer than most rulers can sustain a reign. That is understood by everyone concerned, and it is the entire point."
 eotg_elven_court_0006_opt_court:0 "Buy the ratification I was denied."
 eotg_elven_court_0006_opt_defy:0 "Let them learn to follow a sovereign they did not choose."
 eotg_elven_court_0006_opt_endure:0 "They measure time in centuries. So do I."

 # ── Opinion modifiers ─────────────────────────────────────────────────────────
 eotg_elven_court_debt_honored:0 "Honored the debt of confirmation"

 # ── Culture Events ────────────────────────────────────────────────────────────

 eotg_elven_culture_0001_title:0 "A Cultural Appeal from the Sovereign"
 eotg_elven_culture_0001_desc:0 "Word arrives from the Starborn Sovereign — a formal Cultural Appeal, invoking the solidarity of ancient elven heritage across all borders. The message is clear: we are one people, regardless of what politics divide us."

 eotg_elven_culture_0001_opt_affirm:0 "Affirm solidarity. We are elven before anything else."
 eotg_elven_culture_0001_opt_acknowledge:0 "Acknowledge the appeal. Nothing more."

 eotg_elven_culture_0002_title:0 "An Appeal Across Borders"
 eotg_elven_culture_0002_desc:0 "The Starborn Sovereign of the Eternal Court has sent a Cultural Appeal directly to your court. An appeal to elven solidarity — and a subtle reminder of where the weight of ancient tradition rests."

 eotg_elven_culture_0002_opt_warm:0 "Respond warmly. Elven bonds run deep."
 eotg_elven_culture_0002_opt_decline:0 "Decline. We chart our own course."

 # ── Opinion Modifiers ─────────────────────────────────────────────────────────

 eotg_elven_cultural_solidarity:0 "Elven Solidarity"
 eotg_elven_cultural_solidarity_desc:0 "Affirmed cultural bonds following the Sovereign's Cultural Appeal."

 eotg_elven_grudging_acceptance:0 "Grudging Acceptance"
 eotg_elven_grudging_acceptance_desc:0 "Accepted the new Sovereign despite personal reservations. The debt of tradition."
