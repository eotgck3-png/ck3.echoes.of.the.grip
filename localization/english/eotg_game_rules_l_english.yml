l_english:
 game_rule_category_eotg:0 "Echoes of the Grip"
 rule_eotg_aug_event_frequency:0 "Cybernetics Events"
 setting_eotg_aug_events_normal:0 "Normal"
 setting_eotg_aug_events_normal_desc:0 "Cybernetics flavour events come at the usual pace."
 setting_eotg_aug_events_low:0 "#high Low#!"
 setting_eotg_aug_events_low_desc:0 "Cybernetics flavour events come less often."
 setting_eotg_aug_events_high:0 "#high High#!"
 setting_eotg_aug_events_high_desc:0 "Cybernetics flavour events come more often."
 setting_eotg_aug_events_off:0 "#high Off#!"
 setting_eotg_aug_events_off_desc:0 "No yearly cybernetics flavour events. Installed hardware still wears, and the Cascade can still come."
 rule_eotg_aug_ai_uptake:0 "AI Augmentation Uptake"
 setting_eotg_aug_ai_uptake_normal:0 "Normal"
 setting_eotg_aug_ai_uptake_normal_desc:0 "AI characters seek implants at the usual rate."
 setting_eotg_aug_ai_uptake_low:0 "#high Low#!"
 setting_eotg_aug_ai_uptake_low_desc:0 "AI characters seek implants much less often."
 setting_eotg_aug_ai_uptake_high:0 "#high High#!"
 setting_eotg_aug_ai_uptake_high_desc:0 "AI characters seek implants more often."
 rule_eotg_frontier_difficulty:0 "Frontier Difficulty"
 setting_eotg_frontier_difficulty_normal:0 "Normal"
 setting_eotg_frontier_difficulty_normal_desc:0 "Frontiers in player-held Shoals are established at the usual pace."
 setting_eotg_frontier_difficulty_easy:0 "#high Easy#!"
 setting_eotg_frontier_difficulty_easy_desc:0 "Frontiers in player-held Shoals are established faster, and quiet years ease their strain more. AI Frontiers are unchanged."
 setting_eotg_frontier_difficulty_hard:0 "#high Hard#!"
 setting_eotg_frontier_difficulty_hard_desc:0 "Frontiers in player-held Shoals are established more slowly, and quiet years ease their strain less. AI Frontiers are unchanged."
 rule_eotg_race_half_races:0 "Half-Races"
 setting_eotg_race_half_races_off:0 "Off"
 setting_eotg_race_half_races_off_desc:0 "Children of two different races are never born as a half-race. They take one parent race or the other, weighted by ancestry. Half-race characters who already exist keep their race."
 setting_eotg_race_half_races_as_own_race:0 "#high A Race of Their Own#!"
 setting_eotg_race_half_races_as_own_race_desc:0 "Some pairings of two races produce a half-race, a race in its own right with its own descendants."
 rule_eotg_race_crossbreeding:0 "Marriage Between Races"
 setting_eotg_race_crossbreeding_free:0 "Free"
 setting_eotg_race_crossbreeding_free_desc:0 "Characters of different races marry and have children like anyone else."
 setting_eotg_race_crossbreeding_discouraged:0 "#high Discouraged#!"
 setting_eotg_race_crossbreeding_discouraged_desc:0 "AI characters are much less willing to arrange marriages between different races."
 setting_eotg_race_crossbreeding_forbidden:0 "#high Forbidden#!"
 setting_eotg_race_crossbreeding_forbidden_desc:0 "Meant to stop characters of different races from marrying or having children together. #high Not yet active:#! for now this works like Free."
