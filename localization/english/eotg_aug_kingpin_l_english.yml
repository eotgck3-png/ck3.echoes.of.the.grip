l_english:
 # The Neurofractured Kingpin, batch A. Spec: docs/specs/cybernetics_v2_kingpin.md section 7.
 # Source order: kingpin_fragments_r1_apply_instructions.md (binding), then kingpin_text_gemini_r1.md as raw material.
 # The organization is named only through Custom(); lines shared across kinds name only the boss.

 # ── eotg_aug_kingpin.001  Word From Below ────────────────────────────────────
 eotg_aug_kingpin.001.t:0 "Word From Below"
 eotg_aug_kingpin.001.desc_reporter:0 "[eotg_kp_reporter.GetFirstName] brings the report in person, and waits while you read it."
 eotg_aug_kingpin.001.desc_none:0 "The captain of the dock watch brings the report up from the underlevels, and waits by the door."
 eotg_aug_kingpin.001.desc_syndicate_patron:0 "\n\nUnvetted crates for [eotg_kp.Custom('eotg_aug_cl_syndicate_offer')], the syndicate you already owe, unload from a hulk past the customs desk that waves them through. The syndicate's boss here, [eotg_kp.GetFirstName], has started missing hand-offs."
 eotg_aug_kingpin.001.desc_crew:0 "\n\n[eotg_kp.Custom('eotg_aug_cl_gang')|U] collect debts across the stacks and the shuttered market level. Their boss, [eotg_kp.GetFirstName], has lately started collecting twice from people who already paid."
 eotg_aug_kingpin.001.desc_syndicate:0 "\n\nUnvetted crates unload from a hulk into bonded warehouses and clear the customs desk that waves them through. [eotg_kp.Custom('eotg_aug_cl_syndicate_offer')|U] moves the cargo, but the syndicate's boss here, [eotg_kp.GetFirstName], has started missing hand-offs."
 eotg_aug_kingpin.001.desc_front:0 "\n\n[eotg_kp.Custom('eotg_aug_cl_company')] fits and services implants in its consulting rooms, and keeps every client's logs in a vault behind recovery. Lately the logs have been selling. The director, [eotg_kp.GetFirstName], has begun to slip."
 eotg_aug_kingpin.001.desc_hired:0 "\n\n[eotg_kp.Custom('eotg_aug_cl_gang')|U] are between contracts on the drill floor of a barracks ship, with pay in hand and nowhere to spend it. Their captain, [eotg_kp.GetFirstName], has begun giving the squads contradictory orders."
 eotg_aug_kingpin.001.desc_m_violence:0 "\n\nBefore the shift ended, two runners turned up broken in a service conduit, and the report gives no reason."
 eotg_aug_kingpin.001.desc_m_bribery:0 "\n\nTwo of your clerks have cleared debts their pay could never cover. Neither will say who paid."
 eotg_aug_kingpin.001.desc_m_blackmail:0 "\n\nA sealed dossier changed hands below. Private logs were read back to the people in them, line by line, until the resistance stopped."
 eotg_aug_kingpin.001.desc_m_infiltration:0 "\n\nThe report ends with names: porters, attendants and dock hands, all passing word below for months."
 eotg_aug_kingpin.001.desc_band_storm:0 "\n\nThe neurofracture is severe. Overheating cranial casing and violent diagnostic surges make [eotg_kp.GetHerHim] a danger to anyone nearby."
 eotg_aug_kingpin.001.desc_band_fracture:0 "\n\nThe breakdown is open now: sudden pauses mid-sentence, severe motor tremors, and irrational accusations levelled at empty corridors."
 eotg_aug_kingpin.001.desc_band_flicker:0 "\n\nThe tells are still small: a hand that moves before the decision does, a step taken a moment early."
 eotg_aug_kingpin.001.a:0 "Bring [eotg_kp.GetFirstName] to me. Quietly."
 eotg_aug_kingpin.001.b:0 "Arrest [eotg_kp.GetFirstName] before the next shift."
 eotg_aug_kingpin.001.c:0 "A quarrel in the underlevels. Leave it."
 eotg_aug_kingpin.001.d:0 "Ask the envoy to deal with [eotg_kp.GetFirstName]."
 eotg_aug_kingpin.001.e:0 "Audit the client records at [eotg_kp.Custom('eotg_aug_cl_company')]."
 eotg_aug_kingpin.001.f:0 "Pay them to keep their boss quiet."
 eotg_aug_kingpin.001.f_hired:0 "Buy out their next contract."
 eotg_aug_kingpin.001.a.tt:0 "[eotg_kp.GetFirstName] is sent for, and will stand in your audience chamber within weeks."
 eotg_aug_kingpin.001.b.tt:0 "The arrest is ordered. Your guards will try to take [eotg_kp.GetFirstName] within days."
 eotg_aug_kingpin.001.d.tt:0 "The envoy is asked to settle it. The syndicate will want something for the quiet."
 eotg_aug_kingpin.001.e.tt:0 "Your auditors go through the client records at [eotg_kp.Custom('eotg_aug_cl_company')]."

 # ── eotg_aug_kingpin.002  The Audience ───────────────────────────────────────
 eotg_aug_kingpin.002.t:0 "The Audience"
 eotg_aug_kingpin.002.desc_purge:0 "[eotg_kp.GetFirstName] enters your audience chamber with tense strides, [eotg_kp.GetHerHis] gaze checking every doorway. "It had me reaching for a sidearm a day before I knew I'd stopped trusting my second," [eotg_kp.GetSheHe] says quietly. "It's been right about me every time.""
 eotg_aug_kingpin.002.desc_grandeur:0 "[eotg_kp.GetFirstName] arrives with an entourage and sits before being invited, spreading [eotg_kp.GetHerHis] arms wide across the chair. "It doesn't show me hesitating any more," [eotg_kp.GetSheHe] remarks with a sharp smile. "You'd be surprised how much that's worth in a room.""
 eotg_aug_kingpin.002.desc_forecast:0 "[eotg_kp.GetFirstName] takes the seat across from you. [eotg_kp.GetSheHe|U] starts to rise before [eotg_kp.GetSheHe] has decided to, sits again, and apologizes for the habit. "Sorry," [eotg_kp.GetSheHe] mutters, rubbing [eotg_kp.GetHerHis] temple. "It ran ahead of me again. I'll let you finish.""
 eotg_aug_kingpin.002.desc_cold:0 "[eotg_kp.GetFirstName] enters without ceremony. [eotg_kp.GetSheHe|U] looks at the floor when spoken to, and replies with prices. Every gesture is flattened, stripped of hesitation or fear, as if the living person were merely an invoice waiting for settlement."
 eotg_aug_kingpin.002.desc_k_crew:0 "\n\n[eotg_kp.GetSheHe|U] drops a cracked debt slate on the table between you, every name on it marked paid, overdue or gone."
 eotg_aug_kingpin.002.desc_k_syndicate:0 "\n\n[eotg_kp.GetSheHe|U] sets down a customs clearance seal and a manifest of unvetted shipments, stamped and counter-signed."
 eotg_aug_kingpin.002.desc_k_front:0 "\n\n[eotg_kp.GetSheHe|U] places a locked diagnostic slate on the table, its display listing encrypted recovery room files."
 eotg_aug_kingpin.002.desc_k_hired:0 "\n\n[eotg_kp.GetSheHe|U] has come in boarding armour, and lays the last contract on the table: paid in full, nothing signed since."
 eotg_aug_kingpin.002.desc_band_storm:0 "\n\nHeat shimmers off the port at the base of [eotg_kp.GetHerHis] skull. [eotg_kp.GetHerHis|U] fingers spasm against [eotg_kp.GetHerHis] sidearm, and your guards shift closer."
 eotg_aug_kingpin.002.desc_band_fracture:0 "\n\nActuator clicks twitch along [eotg_kp.GetHerHis] collar. [eotg_kp.GetSheHe|U] blinks against sudden visual distortion before continuing."
 eotg_aug_kingpin.002.desc_band_flicker:0 "\n\nOne hand moves a moment before the rest of [eotg_kp.GetHerHim], but [eotg_kp.GetHerHis] posture stays under control."
 eotg_aug_kingpin.002.a:0 "Say what you came to say."
 eotg_aug_kingpin.002.b:0 "Guards. Take [eotg_kp.GetFirstName] away. Now."
 eotg_aug_kingpin.002.c:0 "Smile. Agree. Remember all of it."
 eotg_aug_kingpin.002.d:0 "Does yours run ahead of you too?"
 eotg_aug_kingpin.002.a.tt:0 "You hear what [eotg_kp.GetFirstName] has come to offer."
 eotg_aug_kingpin.002.b.tt:0 "You break your word before your own court, and lose a little prestige. The arrest is likelier to hold."
 eotg_aug_kingpin.002.c.tt:0 "You play along, and remember. A later arrest is likelier to succeed."

 # ── eotg_aug_kingpin.003  The Offer ──────────────────────────────────────────
 eotg_aug_kingpin.003.t:0 "The Offer"
 eotg_aug_kingpin.003.desc_crew:0 "[eotg_kp.GetFirstName] leans forward across the table. [eotg_kp.Custom('eotg_aug_cl_gang')|U] can keep the underlevels manageable: protection run quietly, street trouble kept off your corridors, and a share of the take sent up to you, as long as your guards stay out of the stacks."
 eotg_aug_kingpin.003.desc_syndicate:0 "[eotg_kp.GetFirstName] opens a detailed ledger of port receipts. [eotg_kp.Custom('eotg_aug_cl_syndicate_offer')|U] offers a steady percentage of contraband margins and discreet hardware routing if your customs desk looks the other way."
 eotg_aug_kingpin.003.desc_front:0 "[eotg_kp.GetFirstName] sets a locked folder on the table. [eotg_kp.Custom('eotg_aug_cl_company')] will share private client records and recovery logs from the clinic vault, if your law leaves its consulting rooms alone."
 eotg_aug_kingpin.003.desc_hired:0 "[eotg_kp.GetFirstName] rests [eotg_kp.GetHerHis] scarred hands on the table. [eotg_kp.Custom('eotg_aug_cl_gang')|U] can provide veteran boarding squads and disciplined security detachments for your own guard, provided the contract retainer is paid promptly."
 eotg_aug_kingpin.003.desc_noclaim:0 "\n\n"A simple, quiet arrangement," [eotg_kp.GetFirstName] concludes. "You get what you need from below, and the lower levels run without friction.""
 eotg_aug_kingpin.003.a:0 "We can work together. For now."
 eotg_aug_kingpin.003.d:0 "No. Take your offer and get out."
 eotg_aug_kingpin.003.e_crew:0 "Keep the stacks quiet, and we talk again."
 eotg_aug_kingpin.003.e_syndicate:0 "I'll take the cut and look away."
 eotg_aug_kingpin.003.e_front:0 "Your files on [ROOT.Char.GetLiege.GetFirstName]. Hand the files over."
 eotg_aug_kingpin.003.e_hired:0 "I'll keep your guns on retainer."
 eotg_aug_kingpin.003.d.tt:0 "You refuse. [eotg_kp.GetFirstName] will not forget it, and the lower levels may hit back."

 # ── eotg_aug_kingpin.004  The Ledger ─────────────────────────────────────────
 eotg_aug_kingpin.004.t:0 "The Ledger"
 eotg_aug_kingpin.004.desc:0 "A courier from [eotg_kp.GetFirstName] sets a ledger and a closed cargo case on your desk. Every line is an off-the-books movement through the lower docks and corridors, and one column in the margin carries your name beside a figure. It has already been added up for you."
 eotg_aug_kingpin.004.a:0 "Take the full share. Ask nothing."
 eotg_aug_kingpin.004.b:0 "Take half. Log every transaction."
 eotg_aug_kingpin.004.c:0 "Send the courier back with nothing."
 eotg_aug_kingpin.004.d:0 "Ask what the other half buys."
 eotg_aug_kingpin.004.b.tt:0 "You keep a logged half, and copy the ledger. It will matter if you ever move against [eotg_kp.GetFirstName]."

 # ── eotg_aug_kingpin.005  The Errand ─────────────────────────────────────────
 eotg_aug_kingpin.005.t:0 "The Errand"
 eotg_aug_kingpin.005.desc_violence:0 "[eotg_kp.GetFirstName] slides a marked docket across the table: [eotg_kp_errand_target.GetFirstName]. "This courtier stepped into business [eotg_kp_errand_target.GetSheHe] had no right to touch," [eotg_kp.GetSheHe] says flatly. "Look the other way while my people remove [eotg_kp_errand_target.GetHerHim].""
 eotg_aug_kingpin.005.desc_blackmail:0 "[eotg_kp.GetFirstName] sets a file on the table, labelled with one name: [eotg_kp_errand_target.GetFirstName]. "Logs, debts, a few things said in a recovery bay," [eotg_kp.GetSheHe] murmurs. "Use it or burn it. Either way, we understand each other better.""
 eotg_aug_kingpin.005.desc_infiltration:0 "[eotg_kp.GetFirstName] glances toward the door. "One of my people needs a post in your household," [eotg_kp.GetSheHe] says. "Something quiet, with access to the lower transit corridors. You'll find the arrangement useful.""
 eotg_aug_kingpin.005.desc_bribery:0 "[eotg_kp.GetFirstName] lays an uninspected cargo manifest on the table. "A transport from the outer route is sitting at the docks," [eotg_kp.GetSheHe] says. "Have your customs desk wave it through with the seals unbroken, and your cut is paid before the crates are counted.""
 eotg_aug_kingpin.005.a_violence:0 "Look the other way, and say nothing."
 eotg_aug_kingpin.005.b_violence:0 "Warn [eotg_kp_errand_target.GetFirstName] before anyone moves."
 eotg_aug_kingpin.005.c_violence:0 "Have [eotg_kp.GetFirstName] arrested for sending it."
 eotg_aug_kingpin.005.a_blackmail:0 "Keep the file. It may prove useful."
 eotg_aug_kingpin.005.b_blackmail:0 "Burn it. I don't deal in that."
 eotg_aug_kingpin.005.c_blackmail:0 "Use it on [eotg_kp.GetFirstName] instead."
 eotg_aug_kingpin.005.a_infiltration:0 "Give [eotg_kp_lieutenant.GetFirstName] a post in my household."
 eotg_aug_kingpin.005.b_infiltration:0 "I'll fill my own household, thank you."
 eotg_aug_kingpin.005.c_infiltration:0 "Give [eotg_kp_lieutenant.GetFirstName] a post, and watch every move."
 eotg_aug_kingpin.005.a_bribery:0 "Wave the transport through, seals unbroken."
 eotg_aug_kingpin.005.b_bribery:0 "Have the customs desk open every crate."
 eotg_aug_kingpin.005.c_bribery:0 "Seize the cargo under my own law."
 eotg_aug_kingpin.005.c_violence.tt:0 "Your guards move to arrest [eotg_kp.GetFirstName] within days."
 eotg_aug_kingpin.005.c_blackmail.success:0 "You turn the file's own trail back on [eotg_kp.GetFirstName]. [eotg_kp.GetSheHe|U] gives ground, and you keep what you learned."
 eotg_aug_kingpin.005.c_blackmail.failure:0 "[eotg_kp.GetFirstName] sees the move coming and turns it. You owe more than before."
 eotg_aug_kingpin.005.c_infiltration.tt:0 "[eotg_kp_lieutenant.GetFirstName] joins your household, and you know exactly whom [eotg_kp_lieutenant.GetSheHe] reports to."

 # ── eotg_aug_kingpin.006  The Episode ────────────────────────────────────────
 eotg_aug_kingpin.006.t:0 "The Episode"
 eotg_aug_kingpin.006.desc_purge:0 "[eotg_kp.GetFirstName] corners you in the private corridor, [eotg_kp.GetHerHis] jaw locked tight. "It has me going for [eotg_kp_purge_target.GetFirstName]," [eotg_kp.GetSheHe] says, [eotg_kp.GetHerHis] voice strained. "Give [eotg_kp_purge_target.GetHerHim] to me, or it will be me who does it.""
 eotg_aug_kingpin.006.desc_grandeur:0 "[eotg_kp.GetFirstName] steps into your audience unannounced and asks for a seat at your table, in public. "Everyone below already knows my name," [eotg_kp.GetSheHe] declares before your attendants. "It is time your court said it out loud.""
 eotg_aug_kingpin.006.desc_forecast:0 "[eotg_kp.GetFirstName] stops you in the corridor, unhurried, and waits until you are listening. "Every time it runs me forward, I end up on the other side of you," [eotg_kp.GetSheHe] says. "I wanted you to hear that from me.""
 eotg_aug_kingpin.006.desc_cold:0 "[eotg_kp.GetFirstName] recites a ledger of numbers without looking up from the floor. "Maintenance costs, missed shipments, lost patrol hours," [eotg_kp.GetSheHe] says, without inflection. "This is the itemized cost of your patience. Settle it.""
 eotg_aug_kingpin.006.a_purge:0 "I'll take [eotg_kp_purge_target.GetFirstName] into my own cells."
 eotg_aug_kingpin.006.b_purge:0 "Not one of my people. Find another way."
 eotg_aug_kingpin.006.c_purge:0 "Sit down. Talk me through it."
 eotg_aug_kingpin.006.a_grandeur:0 "A seat at my table, then."
 eotg_aug_kingpin.006.b_grandeur:0 "No. That seat is not for you."
 eotg_aug_kingpin.006.c_grandeur:0 "Mock the request in front of the court."
 eotg_aug_kingpin.006.a_forecast:0 "Thank you for the warning."
 eotg_aug_kingpin.006.b_forecast:0 "My physician will see you."
 eotg_aug_kingpin.006.c_forecast:0 "Then I'll plan for it."
 eotg_aug_kingpin.006.a_cold:0 "Pay the itemized cost, and be done."
 eotg_aug_kingpin.006.b_cold:0 "Send back an invoice of my own."
 eotg_aug_kingpin.006.c_cold:0 "No. I do not pay for patience."
 eotg_aug_kingpin.006.c_purge.success:0 "[eotg_kp.GetFirstName] sits. By the end of it, [eotg_kp.GetSheHe] has stopped reaching for anything."
 eotg_aug_kingpin.006.c_purge.failure:0 "[eotg_kp.GetFirstName] will not be talked down, and leaves angrier than [eotg_kp.GetSheHe] came."
 eotg_aug_kingpin.006.c_forecast.tt:0 "You are warned. If [eotg_kp.GetFirstName] ever turns on you, you will be better prepared."

 # ── eotg_aug_kingpin.007  The Informant ──────────────────────────────────────
 eotg_aug_kingpin.007.t:0 "The Informant"
 eotg_aug_kingpin.007.desc:0 "Your agents bring word of a quiet leak. [eotg_kp_informant.GetFirstName] has been passing your household routines and patrol rosters down to [eotg_kp.GetFirstName]'s people, and was seen copying schedule slates near the lower transit passages. Those slates list every change of guard for months. Nobody had thought to look until now."
 eotg_aug_kingpin.007.a:0 "Have [eotg_kp_informant.GetFirstName] arrested before more leaves."
 eotg_aug_kingpin.007.b:0 "Turn [eotg_kp_informant.GetFirstName] and make the leak useful."
 eotg_aug_kingpin.007.c:0 "Let [eotg_kp_informant.GetFirstName] be, for now."
 eotg_aug_kingpin.007.b.success:0 "[eotg_kp_informant.GetFirstName] agrees to report on the underlevels for you."
 eotg_aug_kingpin.007.b.failure:0 "[eotg_kp_informant.GetFirstName] refuses, and word of your offer reaches [eotg_kp.GetFirstName] within the hour."

 # ── eotg_aug_kingpin.008  The Protection Bill ────────────────────────────────
 eotg_aug_kingpin.008.t:0 "The Protection Bill"
 eotg_aug_kingpin.008.desc:0 "A message slate arrives from the lower levels, itemizing the cost of keeping the docks and corridors undisturbed. It is unsigned, and it carries the name of [eotg_kp.GetFirstName] anyway. The demand is blunt: pay the levy, or watch fuel lines and warehouse depots suffer a run of accidents."
 eotg_aug_kingpin.008.a:0 "Pay it, and keep the peace."
 eotg_aug_kingpin.008.b:0 "I pay nothing. Let them try."
 eotg_aug_kingpin.008.c:0 "Send the guard into the lower levels."
 eotg_aug_kingpin.008.c.tt:0 "Your guards go into the lower levels to break the demand by force."

 # ── eotg_aug_kingpin.009  The Lieutenant ─────────────────────────────────────
 eotg_aug_kingpin.009.t:0 "The Lieutenant"
 eotg_aug_kingpin.009.desc:0 "[eotg_kp_lieutenant.GetFirstName] comes to you by the service stair, alone, and will not sit. [eotg_kp_lieutenant.GetSheHe|U] has run errands for [eotg_kp.GetFirstName] and watched what the implant does to [eotg_kp.GetHerHim]. "Nobody below can say what [eotg_kp.GetSheHe] will do next," [eotg_kp_lieutenant.GetSheHe] says. "I can give you the doors and the hours. Afterwards I walk away.""
 eotg_aug_kingpin.009.a:0 "Tell me everything. Names, hours, doors."
 eotg_aug_kingpin.009.b:0 "Tell [eotg_kp.GetFirstName] who came to you."
 eotg_aug_kingpin.009.c:0 "I never heard this. Leave quietly."
 eotg_aug_kingpin.009.a.tt:0 "You act on what [eotg_kp_lieutenant.GetFirstName] gives you. Your guards will move on [eotg_kp.GetFirstName] within days, better prepared."

 # ── eotg_aug_kingpin.010  The Arrest ─────────────────────────────────────────
 eotg_aug_kingpin.010.t:0 "The Arrest"
 eotg_aug_kingpin.010.desc_audience:0 "[eotg_kp.GetFirstName] is still standing in the middle of your audience chamber, and your word is still hanging in the air. Your guards close in from the doors. The court has gone silent. [eotg_kp.GetSheHe|U] does not look surprised, only measuring the distance to the nearest exit."
 eotg_aug_kingpin.010.desc_crew:0 "Your guards have traced the boss, [eotg_kp.GetFirstName], to the stacks: three flights down a rusted stairwell, behind the shuttered market level, where every landing has a lookout and every lookout owes [eotg_kp.Custom('eotg_aug_cl_gang')] money."
 eotg_aug_kingpin.010.desc_syndicate:0 "Your guards have traced the syndicate's boss here, [eotg_kp.GetFirstName], to a cargo hulk moored off the docks. The bonded holds are stacked with crates that never went near the customs desk, and the hands aboard keep odd hours."
 eotg_aug_kingpin.010.desc_front:0 "Your guards have mapped the back rooms of [eotg_kp.Custom('eotg_aug_cl_company')]: consulting rooms in front, recovery behind them, and past recovery the records vault, where the director, [eotg_kp.GetFirstName], works late among the client files."
 eotg_aug_kingpin.010.desc_hired:0 "Your guards have found [eotg_kp.GetFirstName] aboard a barracks ship in a rented hangar. [eotg_kp.Custom('eotg_aug_cl_gang')|U] drill there every shift, armed and in step, and their captain is never far from them. If it comes to a fight, they will fight as one."
 eotg_aug_kingpin.010.a:0 "Take [eotg_kp.GetFirstName] alive, whatever it costs."
 eotg_aug_kingpin.010.b:0 "Quietly, while [eotg_kp.GetSheHe] sleeps."
 eotg_aug_kingpin.010.c:0 "Call it off. Pull the guards back."
 eotg_aug_kingpin.010.a.success:0 "Your guards overpower [eotg_kp.GetFirstName] and take [eotg_kp.GetHerHim] into custody."
 eotg_aug_kingpin.010.a.failure:0 "[eotg_kp.GetFirstName] breaks through your guards and is gone into the lower levels."
 eotg_aug_kingpin.010.b.success:0 "Your agents take [eotg_kp.GetFirstName] in [eotg_kp.GetHerHis] sleep, without an alarm."
 eotg_aug_kingpin.010.b.failure:0 "[eotg_kp.GetFirstName] wakes in time and slips away into the lower levels."

 # ── eotg_aug_kingpin.011  The Crackdown ──────────────────────────────────────
 eotg_aug_kingpin.011.t:0 "The Crackdown"
 eotg_aug_kingpin.011.desc:0 "Your guards assemble at the blast doors into the lower levels, weapons drawn and shields locked. Below, [eotg_kp.GetFirstName]'s people have thrown barricades across the transit hubs, and the corridors echo with shouting as the assault begins. Whatever happens next, it happens level by level, door by door."
 eotg_aug_kingpin.011.a:0 "Every level. Every door. Leave nothing."
 eotg_aug_kingpin.011.b:0 "Seal the blast doors and hold the line."
 eotg_aug_kingpin.011.c:0 "Stand the guard down. It costs too much."
 eotg_aug_kingpin.011.a.success:0 "The guard clears the transit hubs and brings [eotg_kp.GetFirstName] in, restrained."
 eotg_aug_kingpin.011.a.failure:0 "The assault falters against the barricades, and [eotg_kp.GetFirstName] holds the lower levels, for now."

 # ── eotg_aug_kingpin.012  Retaliation ────────────────────────────────────────
 eotg_aug_kingpin.012.t:0 "Retaliation"
 eotg_aug_kingpin.012.desc_crew:0 "Smoke fills the lower levels as incendiary charges detonate along the market stacks. Fire suppression foam coats the charred corridors, leaving several supply bays ruined as a deliberate warning from the street."
 eotg_aug_kingpin.012.desc_syndicate:0 "The guards you posted at the docks have been bought. The customs desk waved a transport through an hour early, and your own watch stood aside while the contraband cleared. The duty roster shows nothing out of place."
 eotg_aug_kingpin.012.desc_front:0 "A courier brings one page from the records vault of [eotg_kp.Custom('eotg_aug_cl_company')]: a recovery log, transcribed word for word, of what one of your courtiers said under sedation. Every file like it goes public unless you back down."
 eotg_aug_kingpin.012.desc_hired:0 "[eotg_kp.Custom('eotg_aug_cl_gang')|U] come off the drill floor in boarding order and push into the corridors below your residence. Volley fire drives your guards back, level by level, until the blast doors close between them."
 eotg_aug_kingpin.012.desc_victim:0 "\n\n[eotg_kp_victim.GetFirstName] was caught in the middle of it, and is wounded."
 eotg_aug_kingpin.012.desc_none:0 "\n\nNobody at your court is hurt, this time. The message is understood anyway."
 eotg_aug_kingpin.012.a:0 "Fight for every level. Give them nothing."
 eotg_aug_kingpin.012.b:0 "Talk. Hear what it would take."
 eotg_aug_kingpin.012.c:0 "Let them fall back to [eotg_kp_county.GetNameNoTier]."
 eotg_aug_kingpin.012.c_hired:0 "Pay their next contract elsewhere."
 eotg_aug_kingpin.012.c_syndicate:0 "Pay what my guards were paid."
 eotg_aug_kingpin.012.a.tt:0 "Your guard is sent through the lower levels in force."
 eotg_aug_kingpin.012.c.tt:0 "The crew falls back to the depots it keeps in [eotg_kp_county.GetNameNoTier] and holds the Region. You keep a claim on it, and lose standing."

 # ── eotg_aug_kingpin.013  In Custody ─────────────────────────────────────────
 eotg_aug_kingpin.013.t:0 "In Custody"
 eotg_aug_kingpin.013.desc:0 "[eotg_kp.GetFirstName] sits in the cells under clamps and restraints, silent under guard. A panel beside the door logs the readings from [eotg_kp.GetHerHis] implant, one line after another. The lower levels are waiting to learn what you will do."
 eotg_aug_kingpin.013.desc_band_storm:0 "\n\nThe panel flags the casing at the base of [eotg_kp.GetHerHis] skull as running hot. [eotg_kp.GetSheHe|U] has stopped responding to the guards, and sometimes stops mid-gesture."
 eotg_aug_kingpin.013.desc_band_fracture:0 "\n\nThe panel's log is ragged now: tremors, long pauses, a sentence begun and dropped halfway."
 eotg_aug_kingpin.013.desc_band_flicker:0 "\n\nThe panel shows only small faults: a hand that twitches before the decision, a step taken early inside the cell."
 eotg_aug_kingpin.013.a:0 "Execute [eotg_kp.GetFirstName]. Now."
 eotg_aug_kingpin.013.b:0 "A public trial, then every level cleared."
 eotg_aug_kingpin.013.c:0 "More use alive. Inside my court."
 eotg_aug_kingpin.013.d:0 "Give [eotg_kp.GetFirstName] a Region to keep quiet."
 eotg_aug_kingpin.013.e:0 "Seize the clinic and its records."
 eotg_aug_kingpin.013.f:0 "Hand [eotg_kp.GetFirstName] to the syndicate."
 eotg_aug_kingpin.013.a.tt:0 "The order is given at once, with no hearing."
 eotg_aug_kingpin.013.c.tt:0 "[eotg_kp.GetFirstName] is brought into your household, under watch, and kept useful."
 eotg_aug_kingpin.013.d.tt:0 "A Region you hold directly goes to [eotg_kp.GetFirstName]. The lower levels stay quiet, and your vassals will not like it."
 eotg_aug_kingpin.013.e.tt:0 "Your guards seize the clinic, its rooms and its records, for your own use."
 eotg_aug_kingpin.013.f.tt:0 "[eotg_kp.GetFirstName] is handed over to the syndicate. What it does next is its business, and it will remember the favour."

 # ── eotg_aug_kingpin.014  Bodies on the Docks ────────────────────────────────
 eotg_aug_kingpin.014.t:0 "Bodies on the Docks"
 eotg_aug_kingpin.014.desc:0 "Nothing was agreed, and nothing was stopped. The dock watch reports bodies across the cargo bays: rival runners and unaligned porters, beaten or worse, as [eotg_kp.GetFirstName] tightens the hold on every route in and out."
 eotg_aug_kingpin.014.desc_county:0 "\n\nWord from [eotg_kp_county.GetNameNoTier] says armed runners are moving cargo through the depots there, and nobody has stopped them."
 eotg_aug_kingpin.014.desc_none:0 "\n\nThe violence stays near the central docks. For now, the outer Regions have heard only rumour."
 eotg_aug_kingpin.014.a:0 "Enough. Send the guard for [eotg_kp.GetFirstName]."
 eotg_aug_kingpin.014.b:0 "Bring [eotg_kp.GetFirstName] in to talk terms."
 eotg_aug_kingpin.014.c:0 "Not my quarrel. Let them settle it."
 eotg_aug_kingpin.014.a.tt:0 "The guard is sent to arrest [eotg_kp.GetFirstName] within days."
 eotg_aug_kingpin.014.b.tt:0 "[eotg_kp.GetFirstName] is summoned to an audience before the violence spreads."

 # ── eotg_aug_kingpin.015  The Audit ──────────────────────────────────────────
 eotg_aug_kingpin.015.t:0 "The Audit"
 eotg_aug_kingpin.015.desc:0 "Your auditors reach [eotg_kp.Custom('eotg_aug_cl_company')] and ask for the records vault and the client files. The attendants stall, and couriers slip out through the recovery rooms. Somewhere behind the consulting rooms, the director, [eotg_kp.GetFirstName], is already deciding how much to hide. By the time the vault opens, it will be tidier than it should be."
 eotg_aug_kingpin.015.a:0 "Audit everything. Every client, every log."
 eotg_aug_kingpin.015.b:0 "Buy the records quietly, before anyone reads them."
 eotg_aug_kingpin.015.c:0 "Leave the records sealed. Withdraw the auditors."
 eotg_aug_kingpin.015.a.success:0 "Your auditors find what the clinic kept off its books, and [eotg_kp.GetFirstName] is taken into custody."
 eotg_aug_kingpin.015.a.failure:0 "[eotg_kp.GetFirstName] locks the vault and turns your auditors out."
 eotg_aug_kingpin.015.b.tt:0 "You buy the records, and keep copies. [eotg_kp.GetFirstName] is no longer the only one who knows what the records say."

 # ── eotg_aug_kingpin.040  The Inheritance ────────────────────────────────────
 eotg_aug_kingpin.040.t:0 "The Inheritance"
 eotg_aug_kingpin.040.desc:0 "[eotg_kp.GetFirstName] sends no condolences. [eotg_kp.GetSheHe|U] sends the ledger, with every entry your predecessor left unsettled, and waits to see whether you read it as a debt or a threat."
 eotg_aug_kingpin.040.desc_collab:0 "\n\nThe arrangement your predecessor made is still running, and the figures in it now carry your name."
 eotg_aug_kingpin.040.desc_custody:0 "\n\n[eotg_kp.GetFirstName] still sits in your cells, and the succession has not changed that. The question is what the cell is for now."
 eotg_aug_kingpin.040.desc_kept:0 "\n\nYour predecessor had stopped refusing [eotg_kp.GetFirstName] anything. The files that made it so are still in [eotg_kp.GetHerHis] hands, and nothing in them has expired."
 eotg_aug_kingpin.040.desc_war:0 "\n\nThe war your predecessor began is still being fought, with [eotg_kp.GetFirstName] at its centre. Now it is yours to finish."
 eotg_aug_kingpin.040.desc_open:0 "\n\nNothing was ever agreed with [eotg_kp.GetFirstName], and nothing was ever stopped. The lower levels run on without a word from you."
 eotg_aug_kingpin.040.desc_band_storm:0 "\n\nThe messenger adds, unasked, that the casing at the base of [eotg_kp.GetHerHis] skull runs hot now, and that [eotg_kp.GetSheHe] loses stretches of conversation."
 eotg_aug_kingpin.040.desc_band_fracture:0 "\n\nThe messenger adds that [eotg_kp.GetFirstName] has begun to stop mid-sentence, and that the tremor in [eotg_kp.GetHerHis] hands is no longer hidden."
 eotg_aug_kingpin.040.desc_band_flicker:0 "\n\nThe messenger sees only the small tells: a hand that moves a moment before the decision, a step taken early."
 eotg_aug_kingpin.040.a:0 "Then [eotg_kp.GetFirstName] will deal with me now."
 eotg_aug_kingpin.040.b:0 "Send word: the arrangement stands."
 eotg_aug_kingpin.040.c:0 "Send word: it ended with the funeral."

 # ── eotg_aug_kingpin.060  L1 A Quick Ending ──────────────────────────────────
 eotg_aug_kingpin.060.t:0 "A Quick Ending"
 eotg_aug_kingpin.060.desc:0 "The order is short, and there is no hearing. [eotg_kp.GetFirstName] is walked to the far end of the cells between two guards, and does not come back. By the next shift the lower levels have heard, and have begun to splinter."
 eotg_aug_kingpin.060.desc_end_storm:0 "\n\nBy the end, the casing at the base of [eotg_kp.GetHerHis] skull ran hot to the touch, and [eotg_kp.GetFirstName] lost whole conversations between one sentence and the next."
 eotg_aug_kingpin.060.desc_end_fracture:0 "\n\nBy the end, [eotg_kp.GetFirstName] suffered violent motor spasms and sensory distortion, the neurofracture tearing through every calculated thought."
 eotg_aug_kingpin.060.desc_end_flicker:0 "\n\nBy the end, [eotg_kp.GetFirstName] still hid it well: only a reflex that fired a moment early, and a step taken before the decision to take it."
 eotg_aug_kingpin.060.a:0 "It's done."
 eotg_aug_kingpin.060.b:0 "Give [eotg_kp.GetHerHim] proper rites."

 # ── eotg_aug_kingpin.061  L2 The Streets Go Quiet ────────────────────────────
 eotg_aug_kingpin.061.t:0 "The Streets Go Quiet"
 eotg_aug_kingpin.061.desc:0 "Weeks later, the trial runs in your own court, under your own law. Records gathered by your archivists are read aloud, and the verdict is given in public. All the while, sweeps clear the transit corridors level by level. What remains is the sentence, and you are the one who says it."
 eotg_aug_kingpin.061.desc_end_storm:0 "\n\nBy the end, the casing at the base of [eotg_kp.GetHerHis] skull ran hot to the touch, and [eotg_kp.GetFirstName] lost whole conversations between one sentence and the next."
 eotg_aug_kingpin.061.desc_end_fracture:0 "\n\nBy the end, [eotg_kp.GetFirstName] suffered violent motor spasms and sensory distortion, the neurofracture tearing through every calculated thought."
 eotg_aug_kingpin.061.desc_end_flicker:0 "\n\nBy the end, [eotg_kp.GetFirstName] still hid it well: only a reflex that fired a moment early, and a step taken before the decision to take it."
 eotg_aug_kingpin.061.a:0 "Execute [eotg_kp.GetFirstName] under the law of this court."
 eotg_aug_kingpin.061.b:0 "Sentence [eotg_kp.GetFirstName] to the cells for life."

 # ── eotg_aug_kingpin.062  L3 The Trade Is Yours ────────────────────────────
 eotg_aug_kingpin.062.t:0 "The Trade Is Yours"
 eotg_aug_kingpin.062.desc:0 "Years of quiet dealing end in one short report. [eotg_kp.GetFirstName] is dead, found in private quarters after a cascade that nobody could have stopped. Every ledger was already in your hands, and the people who ran the business are waiting to hear what you will do with it."
 eotg_aug_kingpin.062.desc_end_storm:0 "\n\nBy the end, the casing at the base of [eotg_kp.GetHerHis] skull ran hot to the touch, and [eotg_kp.GetFirstName] lost whole conversations between one sentence and the next."
 eotg_aug_kingpin.062.desc_end_fracture:0 "\n\nBy the end, [eotg_kp.GetFirstName] suffered violent motor spasms and sensory distortion, the neurofracture tearing through every calculated thought."
 eotg_aug_kingpin.062.desc_end_flicker:0 "\n\nBy the end, [eotg_kp.GetFirstName] still hid it well: only a reflex that fired a moment early, and a step taken before the decision to take it."
 eotg_aug_kingpin.062.a:0 "Keep it running, and keep it quiet."
 eotg_aug_kingpin.062.b:0 "Burn the ledgers. Let it all stop."
 eotg_aug_kingpin.062.c:0 "Expand it. There is more to take."

 # ── eotg_aug_kingpin.068  L9 The Break ───────────────────────────────────────
 eotg_aug_kingpin.068.t:0 "The Break"
 eotg_aug_kingpin.068.desc:0 "The break comes without warning. [eotg_kp.GetFirstName]'s implant runs past every limit, and [eotg_kp.GetSheHe] tears through the lower levels, then comes up to the residence, leaving wreckage in the corridors before retreating below."
 eotg_aug_kingpin.068.desc_victims:0 "\n\n[eotg_kp_victim.GetFirstName] and [eotg_kp_victim_2.GetFirstName] did not survive it. The household guard drove [eotg_kp.GetHerHim] back only after both were down."
 eotg_aug_kingpin.068.desc_victim:0 "\n\n[eotg_kp_victim.GetFirstName] did not survive it. The household guard drove [eotg_kp.GetHerHim] back too late."
 eotg_aug_kingpin.068.desc_none:0 "\n\nNo courtier was killed, though attendants were hurt before the household guard forced [eotg_kp.GetHerHim] back down the stairwells."
 eotg_aug_kingpin.068.desc_end_storm:0 "\n\nBy the end, the casing at the base of [eotg_kp.GetHerHis] skull ran hot to the touch, and [eotg_kp.GetFirstName] lost whole conversations between one sentence and the next."
 eotg_aug_kingpin.068.desc_end_fracture:0 "\n\nBy the end, [eotg_kp.GetFirstName] suffered violent motor spasms and sensory distortion, the neurofracture tearing through every calculated thought."
 eotg_aug_kingpin.068.desc_end_flicker:0 "\n\nBy the end, [eotg_kp.GetFirstName] still hid it well: only a reflex that fired a moment early, and a step taken before the decision to take it."
 eotg_aug_kingpin.068.a:0 "Hunt [eotg_kp.GetFirstName] down. Now."
 eotg_aug_kingpin.068.b:0 "Seal the lower levels and count the dead."
 eotg_aug_kingpin.068.c:0 "I will go down there myself."
 eotg_aug_kingpin.068.a.success:0 "You corner [eotg_kp.GetFirstName] in the lower levels and cut [eotg_kp.GetHerHim] down before more harm is done."
 eotg_aug_kingpin.068.a.failure:0 "[eotg_kp.GetFirstName] slips through your fighters and is gone below. Nobody finds [eotg_kp.GetHerHim] afterwards."

 # ── eotg_aug_kingpin.069  L10 A Seat Under You ───────────────────────────────
 eotg_aug_kingpin.069.t:0 "A Seat Under You"
 eotg_aug_kingpin.069.desc:0 "[eotg_kp.GetFirstName] is brought up and told the terms. A Region you hold directly will go to [eotg_kp.GetHerHim], with the duties of a vassal attached, and the lower levels will be quiet because [eotg_kp.GetSheHe] says so. The court mutters. Your vassals are already counting what this costs you."
 eotg_aug_kingpin.069.desc_end_storm:0 "\n\nBy the end, the casing at the base of [eotg_kp.GetHerHis] skull ran hot to the touch, and [eotg_kp.GetFirstName] lost whole conversations between one sentence and the next."
 eotg_aug_kingpin.069.desc_end_fracture:0 "\n\nBy the end, [eotg_kp.GetFirstName] suffered violent motor spasms and sensory distortion, the neurofracture tearing through every calculated thought."
 eotg_aug_kingpin.069.desc_end_flicker:0 "\n\nBy the end, [eotg_kp.GetFirstName] still hid it well: only a reflex that fired a moment early, and a step taken before the decision to take it."
 eotg_aug_kingpin.069.a:0 "Take it, and keep it quiet."

 # ── eotg_aug_kingpin.070  L11 Brought Inside ─────────────────────────────────
 eotg_aug_kingpin.070.t:0 "Brought Inside"
 eotg_aug_kingpin.070.desc:0 "You decide [eotg_kp.GetFirstName] is too useful to execute and too dangerous to leave outside. [eotg_kp.GetSheHe|U] is given a room and a post in your household, and told how short the lead is. [eotg_kp.GetSheHe|U] takes the room without comment."
 eotg_aug_kingpin.070.desc_end_storm:0 "\n\nBy the end, the casing at the base of [eotg_kp.GetHerHis] skull ran hot to the touch, and [eotg_kp.GetFirstName] lost whole conversations between one sentence and the next."
 eotg_aug_kingpin.070.desc_end_fracture:0 "\n\nBy the end, [eotg_kp.GetFirstName] suffered violent motor spasms and sensory distortion, the neurofracture tearing through every calculated thought."
 eotg_aug_kingpin.070.desc_end_flicker:0 "\n\nBy the end, [eotg_kp.GetFirstName] still hid it well: only a reflex that fired a moment early, and a step taken before the decision to take it."
 eotg_aug_kingpin.070.a:0 "Keep [eotg_kp.GetFirstName] close, and watched."
 eotg_aug_kingpin.070.b:0 "Keep [eotg_kp.GetFirstName] closer: a post where I can see [eotg_kp.GetHerHim]."

 # ── eotg_aug_kingpin.071  L12 The Region Falls ───────────────────────────────
 eotg_aug_kingpin.071.t:0 "The Region Falls"
 eotg_aug_kingpin.071.desc:0 "[eotg_kp.Custom('eotg_aug_cl_gang')|U] fall back to the depots in [eotg_kp_county.GetNameNoTier] and hold the Region from there. Barricades go up at the transit hubs. The people there take orders from [eotg_kp.GetFirstName] now, and your garrison has stopped at the edge of the Region."
 eotg_aug_kingpin.071.desc_end_storm:0 "\n\nBy the end, the casing at the base of [eotg_kp.GetHerHis] skull ran hot to the touch, and [eotg_kp.GetFirstName] lost whole conversations between one sentence and the next."
 eotg_aug_kingpin.071.desc_end_fracture:0 "\n\nBy the end, [eotg_kp.GetFirstName] suffered violent motor spasms and sensory distortion, the neurofracture tearing through every calculated thought."
 eotg_aug_kingpin.071.desc_end_flicker:0 "\n\nBy the end, [eotg_kp.GetFirstName] still hid it well: only a reflex that fired a moment early, and a step taken before the decision to take it."
 eotg_aug_kingpin.071.a:0 "Then I take it back later."

 # ── eotg_aug_kingpin.073  L14 A Standing Arrangement ─────────────────────────
 eotg_aug_kingpin.073.t:0 "A Standing Arrangement"
 eotg_aug_kingpin.073.desc:0 "Nothing has been won, and nothing is likely to be. A share of your revenue goes down to the lower levels on a schedule, and the streets stay quiet in return. [eotg_kp.GetFirstName] does not ask for more, and you do not ask how the quiet is kept."
 eotg_aug_kingpin.073.desc_contract:0 "\n\nThe terms are in writing: their next contract is paid and worked elsewhere, and the figure for each year of peace is set out beside it."
 eotg_aug_kingpin.073.desc_end_storm:0 "\n\nBy the end, the casing at the base of [eotg_kp.GetHerHis] skull ran hot to the touch, and [eotg_kp.GetFirstName] lost whole conversations between one sentence and the next."
 eotg_aug_kingpin.073.desc_end_fracture:0 "\n\nBy the end, [eotg_kp.GetFirstName] suffered violent motor spasms and sensory distortion, the neurofracture tearing through every calculated thought."
 eotg_aug_kingpin.073.desc_end_flicker:0 "\n\nBy the end, [eotg_kp.GetFirstName] still hid it well: only a reflex that fired a moment early, and a step taken before the decision to take it."
 eotg_aug_kingpin.073.a:0 "It's cheaper than a war."
 eotg_aug_kingpin.073.b:0 "Until I find a way."

 # ── eotg_aug_kingpin.074  L15 The Syndicate Settles It ───────────────────────
 eotg_aug_kingpin.074.t:0 "The Syndicate Settles It"
 eotg_aug_kingpin.074.desc:0 "Word comes from the docks, passed on by someone who gives no name. People from the syndicate looked at what the implant was doing to [eotg_kp.GetFirstName], and decided not to wait. The docks will not see the syndicate's boss here again."
 eotg_aug_kingpin.074.desc_patron:0 "\n\nThe envoy confirms it, politely, and notes the favour against your name."
 eotg_aug_kingpin.074.desc_end_storm:0 "\n\nBy the end, the casing at the base of [eotg_kp.GetHerHis] skull ran hot to the touch, and [eotg_kp.GetFirstName] lost whole conversations between one sentence and the next."
 eotg_aug_kingpin.074.desc_end_fracture:0 "\n\nBy the end, [eotg_kp.GetFirstName] suffered violent motor spasms and sensory distortion, the neurofracture tearing through every calculated thought."
 eotg_aug_kingpin.074.desc_end_flicker:0 "\n\nBy the end, [eotg_kp.GetFirstName] still hid it well: only a reflex that fired a moment early, and a step taken before the decision to take it."
 eotg_aug_kingpin.074.a:0 "Then it is settled. Say nothing more."
 eotg_aug_kingpin.074.a.tt:0 "The envoy marks the favour in your account. The syndicate will ask something of you in return, sooner."

 # ── eotg_aug_kingpin.075  L16 The Fracture Finishes It ───────────────────────
 eotg_aug_kingpin.075.t:0 "The Fracture Finishes It"
 eotg_aug_kingpin.075.desc:0 "Nobody ordered this. The implant ran past its limit, and [eotg_kp.GetFirstName] was found in private quarters, the casing cold and dark. The lower levels hear it before you do."
 eotg_aug_kingpin.075.desc_crew:0 "\n\nWith [eotg_kp.GetFirstName] gone, [eotg_kp.Custom('eotg_aug_cl_gang')] come apart into squabbling cliques, fighting over the caches."
 eotg_aug_kingpin.075.desc_syndicate:0 "\n\nThe syndicate closes its local ledger without comment. A manifest is left unclaimed on the dock."
 eotg_aug_kingpin.075.desc_front:0 "\n\nThe consulting rooms of [eotg_kp.Custom('eotg_aug_cl_company')] shut their doors, and the client logs stay in the vault, untouched."
 eotg_aug_kingpin.075.desc_hired:0 "\n\nThe squads break formation and drift toward the starport, looking for berths. Some come to your garrison asking for work."
 eotg_aug_kingpin.075.desc_end_storm:0 "\n\nBy the end, the casing at the base of [eotg_kp.GetHerHis] skull ran hot to the touch, and [eotg_kp.GetFirstName] lost whole conversations between one sentence and the next."
 eotg_aug_kingpin.075.desc_end_fracture:0 "\n\nBy the end, [eotg_kp.GetFirstName] suffered violent motor spasms and sensory distortion, the neurofracture tearing through every calculated thought."
 eotg_aug_kingpin.075.desc_end_flicker:0 "\n\nBy the end, [eotg_kp.GetFirstName] still hid it well: only a reflex that fired a moment early, and a step taken before the decision to take it."
 eotg_aug_kingpin.075.a:0 "So that's how it ends."

 # ── eotg_aug_kingpin.076  L17 The Clinic Changes Hands ───────────────────────
 eotg_aug_kingpin.076.t:0 "The Clinic Changes Hands"
 eotg_aug_kingpin.076.desc:0 "Your guards now hold the consulting rooms and the records vault of [eotg_kp.Custom('eotg_aug_cl_company')]. The staff have been told the posts stay. The client logs are in your archive, and the clinic will run under your law. [eotg_kp.GetFirstName] waits in the cells for the rest."
 eotg_aug_kingpin.076.desc_end_storm:0 "\n\nBy the end, the casing at the base of [eotg_kp.GetHerHis] skull ran hot to the touch, and [eotg_kp.GetFirstName] lost whole conversations between one sentence and the next."
 eotg_aug_kingpin.076.desc_end_fracture:0 "\n\nBy the end, [eotg_kp.GetFirstName] suffered violent motor spasms and sensory distortion, the neurofracture tearing through every calculated thought."
 eotg_aug_kingpin.076.desc_end_flicker:0 "\n\nBy the end, [eotg_kp.GetFirstName] still hid it well: only a reflex that fired a moment early, and a step taken before the decision to take it."
 eotg_aug_kingpin.076.a:0 "Execute [eotg_kp.GetFirstName], and keep the clinic."
 eotg_aug_kingpin.076.b:0 "Let [eotg_kp.GetFirstName] run the clinic for me now."

 # ── debug decision ───────────────────────────────────────────────────────────
 eotg_decision_aug_debug_kingpin:0 "Debug: Start the Boss Below"
 eotg_decision_aug_debug_kingpin_desc:0 "Debug only. Ends any running story of this kind, clears the once-per-life flag, and sends Word From Below. Set the eotg_kp_force variables first to choose the profile."
 eotg_decision_aug_debug_kingpin_tooltip:0 "A new Word From Below arrives within a day."
 eotg_decision_aug_debug_kingpin_confirm:0 "Start It"

 # ── character and county modifiers ───────────────────────────────────────────
 eotg_mod_aug_kp_arrangement:0 "A Quiet Arrangement"
 eotg_mod_aug_kp_arrangement_desc:0 "A share of the lower levels' take reaches your treasury, and your Systems know it. The money is steady. Their patience is not."
 eotg_mod_aug_kp_hired_guns:0 "Guns on Retainer"
 eotg_mod_aug_kp_hired_guns_desc:0 "A hired crew's guns are yours to call on while the retainer holds. They follow the contract, not you."
 eotg_mod_aug_kp_network:0 "Inherited Trade"
 eotg_mod_aug_kp_network_desc:0 "You took over a trade that was never legal. It pays well, it hides your movements from rivals, and your vassals dislike how."
 eotg_mod_aug_kp_kept:0 "Under a Hold"
 eotg_mod_aug_kp_kept_desc:0 "You do what you are told from below. It shows in your temper, in your orders, and in the way your vassals look at you."
 eotg_mod_aug_kp_tribute:0 "Paying for Quiet"
 eotg_mod_aug_kp_tribute_desc:0 "A fixed share of your revenue goes down to the lower levels. The streets stay quiet, and control grows because of it."
 eotg_mod_aug_kp_informants:0 "Keeping Close"
 eotg_mod_aug_kp_informants_desc:0 "Someone from the lower levels sits in your household and tells you what the lower levels are doing. Schemes against you fail more often."
 eotg_mod_aug_kp_seized_clinic:0 "A Clinic of Your Own"
 eotg_mod_aug_kp_seized_clinic_desc:0 "The clinic you seized runs under your law and pays into your treasury. Its client logs are yours to keep."
 eotg_mod_aug_kp_arson:0 "Set Alight"
 eotg_mod_aug_kp_arson_desc:0 "Fires were set in the depots and corridors as a warning. Control of the System slips while they burn out."
 eotg_mod_aug_kp_lockdown:0 "Lower Levels Locked Down"
 eotg_mod_aug_kp_lockdown_desc:0 "The blast doors are shut and the corridors patrolled. Order holds, and trade finds another route."
 eotg_mod_aug_kp_loose_ends:0 "Splintered Crews"
 eotg_mod_aug_kp_loose_ends_desc:0 "The organization has come apart into rival cliques, and none of them takes orders from another."
 eotg_mod_aug_kp_streets_cleared:0 "Streets Cleared"
 eotg_mod_aug_kp_streets_cleared_desc:0 "Every level was swept under your own law, and people can walk the corridors again."
 eotg_mod_aug_kp_massacre:0 "The Break"
 eotg_mod_aug_kp_massacre_desc:0 "A killing in the lower levels, and then in the residence. Trade and growth have not recovered from it."

 # ── opinions ─────────────────────────────────────────────────────────────────
 eotg_opinion_aug_kp_order:0 "Restored Order"
 eotg_opinion_aug_kp_harboured:0 "Sheltered the Killer"
 eotg_opinion_aug_kp_raised_criminal:0 "Raised a Criminal to a Seat"
 eotg_opinion_aug_kp_warned:0 "Warned of the Threat"

 # ── shared tooltips and toasts ───────────────────────────────────────────────
 eotg_aug_kp_leverage_up_tt:0 "[eotg_kp.GetFirstName]'s hold on you deepens."
 eotg_aug_kp_leverage_down_tt:0 "[eotg_kp.GetFirstName]'s hold on you loosens."
 eotg_aug_kingpin_toast_dead:0 "The Figure Below Is Dead"
 eotg_aug_kingpin_toast_gone:0 "The Figure Below Is Beyond Your Reach"

 # ── story panel and band names ───────────────────────────────────────────────
 eotg_aug_kp_band_3:0 "They own the room"
 eotg_aug_kp_band_2:0 "Deep in their pocket"
 eotg_aug_kp_band_1:0 "A favour owed"
 eotg_story_aug_kingpin_info:0 "[Story.Custom('eotg_aug_kp_cl_leverage_band')]. Taking [Story.MakeScope.Var('eotg_kp').Char.GetFirstName]'s money, doing [Story.MakeScope.Var('eotg_kp').Char.GetFirstName]'s errands and keeping [Story.MakeScope.Var('eotg_kp').Char.GetFirstName]'s secrets deepen it. Refusing [Story.MakeScope.Var('eotg_kp').Char.GetHerHim], turning [Story.MakeScope.Var('eotg_kp').Char.GetHerHis] people and gathering evidence loosen it."
 eotg_story_aug_kingpin_kp_label:0 "The Figure Below"
 eotg_story_aug_kingpin_band_label:0 "The Hold on You"
 eotg_story_aug_kingpin_band_min_label:0 "A favour owed"
 eotg_story_aug_kingpin_band_max_label:0 "They own the room"
 eotg_story_aug_kingpin:0 "The Hold From Below"

 # ═══ BATCH B ═══════════════════════════════════════════════════════════════════
 # Events .030-.039, .050, .063-.067, .072 and the batch B keys of .003, .012, .068 and .069.
 # Written in the new voice (event_quality_v1 section 12): the ruler narrates in the first person,
 # appended fragments are neutral or third person, speech uses unescaped straight quotes.
 # Shared lines name only the boss by name; per-kind lines use the kind's noun (spec 7.3 and 7.4).

 # ── eotg_aug_kingpin.003  The Offer (batch B keys) ───────────────────────────
 eotg_aug_kingpin.003.desc_vassal:0 "\n\nThere is more under the offer. [ROOT.Char.GetLiege.GetFirstName] holds the seat above mine, and [eotg_kp.GetFirstName] has worked out what it would take to move [ROOT.Char.GetLiege.GetHerHim] off it. The claim could be raised in my name, or in [eotg_kp.GetHerHis] with my levies behind it."
 eotg_aug_kingpin.003.desc_independent:0 "\n\nThere is more under the offer. [eotg_kp.GetFirstName] has been counting the seats around me that could be moved, inside my borders or across them. [eotg_kp.GetSheHe|U] offers to do the work, if I supply the authority."
 eotg_aug_kingpin.003.b:0 "Put me in [ROOT.Char.GetLiege.GetFirstName]'s seat."
 eotg_aug_kingpin.003.b.tt:0 "The claim on that seat is put in my name. [eotg_kp.GetFirstName] brings a plan within days."
 eotg_aug_kingpin.003.c:0 "Take the seat yourself. I'll hold the door."
 eotg_aug_kingpin.003.c.tt:0 "The claim goes to [eotg_kp.GetFirstName], with my name behind it. A plan for the seat follows within days."
 eotg_aug_kingpin.003.b_indep:0 "Take a neighbour's seat. [eotg_kp.GetFirstName]'s claim, my war."
 eotg_aug_kingpin.003.b_indep.tt:0 "A claim on a neighbour's seat is pressed in [eotg_kp.GetFirstName]'s name. A plan for the war arrives within days."
 eotg_aug_kingpin.003.c_indep:0 "Give a vassal's seat to [eotg_kp.GetFirstName]."
 eotg_aug_kingpin.003.c_indep.tt:0 "A vassal's seat is to pass to [eotg_kp.GetFirstName]. The plan for it arrives within days."

 # ── eotg_aug_kingpin.012  Retaliation (batch B key) ──────────────────────────
 eotg_aug_kingpin.012.c_front:0 "Let them publish."
 eotg_aug_kingpin.012.c_front.tt:0 "The client files are published within days, and the cost of it lands on me."

 # ── eotg_aug_kingpin.030  The Claim ──────────────────────────────────────────
 eotg_aug_kingpin.030.t:0 "The Claim"
 eotg_aug_kingpin.030.desc_own:0 "[eotg_kp.GetFirstName] lays out the claim on [eotg_kp_target.GetName], which [eotg_kp_opponent.GetTitledFirstName] holds over me. It would be mine to raise, and the faction would carry my name. [eotg_kp.GetSheHe|U] has help ready for the first weeks of a war, and does not pretend it comes free."
 eotg_aug_kingpin.030.desc_back_kp:0 "[eotg_kp.GetFirstName] lays out the claim on [eotg_kp_target.GetName], held by [eotg_kp_opponent.GetTitledFirstName] above me. This claim would be [eotg_kp.GetHerHis], not mine. My name would be on the faction and my levies in the field, and if the seat fell, [eotg_kp.GetSheHe] would be the one to fill it."
 eotg_aug_kingpin.030.a:0 "Raise the faction. Strike now."
 eotg_aug_kingpin.030.a.tt:0 "The claim is pressed and the faction raised. The war begins at once, with help from below."
 eotg_aug_kingpin.030.b:0 "Gather support first."
 eotg_aug_kingpin.030.b.tt:0 "The claim is pressed and the faction raised. The war waits, and the secret has to hold until it starts."
 eotg_aug_kingpin.030.c:0 "Walk away from it."

 # ── eotg_aug_kingpin.031  The Neighbour's Seat ───────────────────────────────
 eotg_aug_kingpin.031.t:0 "The Neighbour's Seat"
 eotg_aug_kingpin.031.desc:0 "[eotg_kp.GetFirstName] has been reading my borders. [eotg_kp_rival.GetTitledFirstName] holds [eotg_kp_target.GetName], and holds it more loosely than anyone else I could reach. [eotg_kp.GetSheHe|U] wants a claim on it in [eotg_kp.GetHerHis] own name. I would supply the war, [eotg_kp.GetSheHe] the first weeks of it, and if the seat fell, it would be [eotg_kp.GetHerHis]."
 eotg_aug_kingpin.031.a:0 "Declare it."
 eotg_aug_kingpin.031.b:0 "Not yet."
 eotg_aug_kingpin.031.c:0 "Walk away."
 eotg_aug_kingpin.031.toast_a_no_war:0 "The Claim Came to Nothing"

 # ── eotg_aug_kingpin.032  The Vassal's Seat ──────────────────────────────────
 eotg_aug_kingpin.032.t:0 "The Vassal's Seat"
 eotg_aug_kingpin.032.desc:0 "[eotg_kp.GetFirstName] has a different kind of conquest in mind. [eotg_kp_rival.GetTitledFirstName] holds [eotg_kp_target.GetName] under me, and [eotg_kp.GetSheHe] wants it. I can take it back by decree, or I can buy [eotg_kp_rival.GetHerHim] out, and either way the seat ends up [eotg_kp.GetHerHis]."
 eotg_aug_kingpin.032.a:0 "Revoke it by decree."
 eotg_aug_kingpin.032.a.tt:0 "The seat passes to [eotg_kp.GetFirstName] by decree. [eotg_kp_rival.GetFirstName] loses it, I gain tyranny, and another vassal may take up arms."
 eotg_aug_kingpin.032.b:0 "Buy [eotg_kp_rival.GetFirstName] out."
 eotg_aug_kingpin.032.c:0 "Walk away."
 eotg_aug_kingpin.032.toast_a_war:0 "A Vassal Rises Against the Decree"
 eotg_aug_kingpin.032.toast_a_no_war:0 "The Decree Stands Unchallenged"

 # ── eotg_aug_kingpin.033  The War Below ──────────────────────────────────────
 eotg_aug_kingpin.033.t:0 "The War Below"
 eotg_aug_kingpin.033.desc_crew:0 "The reports from the line are good, and they come from the wrong people. [eotg_kp.Custom('eotg_aug_cl_gang')|U] have been raiding [eotg_kp_opponent.GetFirstName]'s supply stores behind the front, on their own account, and their boss, [eotg_kp.GetFirstName], wants to know whether I mind."
 eotg_aug_kingpin.033.desc_syndicate:0 "The syndicate's boss here, [eotg_kp.GetFirstName], hears most things first at the docks. [eotg_kp.GetSheHe|U] has heard that someone in [eotg_kp_opponent.GetFirstName]'s command can be bought, and brings the price with the news."
 eotg_aug_kingpin.033.desc_front:0 "[eotg_kp.Custom('eotg_aug_cl_company')] keeps a file on everyone who ever sat in its chairs, and the director, [eotg_kp.GetFirstName], has pulled one that touches [eotg_kp_opponent.GetFirstName]'s council. [eotg_kp.GetSheHe|U] sets it on my table, closed, and waits to see what I will do with it."
 eotg_aug_kingpin.033.desc_hired:0 "[eotg_kp.Custom('eotg_aug_cl_gang')|U] want a raise, and the war is the reason. The captain, [eotg_kp.GetFirstName], says it plainly and without heat: the contract was written for a shorter war, and the squads have noticed."
 eotg_aug_kingpin.033.a_crew:0 "Let them."
 eotg_aug_kingpin.033.b_crew:0 "Keep them on the front."
 eotg_aug_kingpin.033.a_syndicate:0 "Buy [eotg_kp_officer.GetFirstName] out of [eotg_kp_opponent.GetFirstName]'s service."
 eotg_aug_kingpin.033.b_syndicate:0 "No. Not that way."
 eotg_aug_kingpin.033.a_front:0 "Keep the file on [eotg_kp_councillor.GetFirstName]."
 eotg_aug_kingpin.033.b_front:0 "Burn it."
 eotg_aug_kingpin.033.a_hired:0 "Pay what they ask."
 eotg_aug_kingpin.033.b_hired:0 "Not in the middle of a war."
 eotg_aug_kingpin.033.c:0 "Keep [eotg_kp.GetFirstName] away from the line."
 eotg_aug_kingpin.033.c.tt:0 "[eotg_kp.GetFirstName] is kept back from the line, and the strain on [eotg_kp.GetHerHim] eases."

 # ── eotg_aug_kingpin.034  Turned Guns ────────────────────────────────────────
 eotg_aug_kingpin.034.t:0 "Turned Guns"
 eotg_aug_kingpin.034.desc:0 "The word from the line is the one I was afraid of. [eotg_kp.Custom('eotg_aug_cl_gang')|U] have stopped taking orders from my commanders, and their captain, [eotg_kp.GetFirstName], is in talks with [eotg_kp_opponent.GetTitledFirstName]'s people. The terms are simple. Either I pay more than the other side, or the guns go to them."
 eotg_aug_kingpin.034.a:0 "Outbid the other side."
 eotg_aug_kingpin.034.b:0 "Let them go."
 eotg_aug_kingpin.034.c:0 "Meet them at the hangar first."
 eotg_aug_kingpin.034.c.success:0 "I reach the hangar before the crew moves. [eotg_kp.GetFirstName] does not leave it."
 eotg_aug_kingpin.034.c.failure:0 "[eotg_kp.GetFirstName] is ready for me. I leave the hangar hurt, and the guns go over anyway."
 eotg_aug_kingpin.034.toast_c_success:0 "The Captain Fell at the Hangar"
 eotg_aug_kingpin.034.toast_c_failure:0 "Hurt at the Hangar"

 # ── eotg_aug_kingpin.036  The Partner's Price ────────────────────────────────
 eotg_aug_kingpin.036.t:0 "The Partner's Price"
 eotg_aug_kingpin.036.desc:0 "The seat is mine. [eotg_kp.GetFirstName] has already asked to be received, and stands in my audience chamber before I have settled into it. [eotg_kp.GetSheHe|U] names a price calmly, the way a bill is read out. It is not small. It was never going to be."
 eotg_aug_kingpin.036.a:0 "A Region of your own."
 eotg_aug_kingpin.036.a.tt:0 "[eotg_kp.GetFirstName] is given a Region to hold under me. My vassals will not like it."
 eotg_aug_kingpin.036.b:0 "A seat at my court."
 eotg_aug_kingpin.036.b.tt:0 "[eotg_kp.GetFirstName] joins my household, on a short lead."
 eotg_aug_kingpin.036.c:0 "Loose ends."
 eotg_aug_kingpin.036.c.success:0 "My plan holds. [eotg_kp.GetFirstName] never gets to collect."
 eotg_aug_kingpin.036.c.failure:0 "[eotg_kp.GetFirstName] has people in my household too. Word of the plan reaches [eotg_kp.GetHerHim] before it is ready, and [eotg_kp.GetSheHe] takes it personally."
 eotg_aug_kingpin.036.toast_c_success:0 "The Loose Ends Were Tied"
 eotg_aug_kingpin.036.toast_c_failure:0 "The Plan Was Seen"
 eotg_aug_kingpin.036.d:0 "You've been paid enough."
 eotg_aug_kingpin.036.d.tt:0 "[eotg_kp.GetFirstName] will not take it quietly. The answer comes within weeks."

 # ── eotg_aug_kingpin.038  Now or Never ───────────────────────────────────────
 eotg_aug_kingpin.038.t:0 "Now or Never"
 eotg_aug_kingpin.038.desc:0 "The faction is raised and waiting on me. [eotg_kp.GetFirstName] says what we both know: every day it waits, someone talks. [eotg_kp_opponent.GetTitledFirstName] has heard nothing so far. That will not last, and it is for me to decide whether to strike first or put it out."
 eotg_aug_kingpin.038.desc_discovered:0 "[eotg_kp_opponent.GetTitledFirstName] knows. Someone talked, and by the time the word reached me it had already reached [eotg_kp_opponent.GetHerHis] court. The faction is finished, and so is the secret."
 eotg_aug_kingpin.038.a:0 "Strike."
 eotg_aug_kingpin.038.a.tt:0 "The faction's war begins now, with help from below."
 eotg_aug_kingpin.038.b:0 "Disband it."
 eotg_aug_kingpin.038.c:0 "Then it's done."
 eotg_aug_kingpin.038.c.tt:0 "The faction ends. The cost of being found out follows within days."

 # ── eotg_aug_kingpin.039  Word From the Docks ────────────────────────────────
 eotg_aug_kingpin.039.t:0 "Word From the Docks"
 eotg_aug_kingpin.039.desc:0 "The word comes up from the docks before it reaches my council. [eotg_kp_owner.GetTitledFirstName] and I are at war, and it was not [eotg_kp_owner.GetHerHis] idea alone. [eotg_kp.GetFirstName] is behind it, working from the lower levels, and the dock hands already know the name."
 eotg_aug_kingpin.039.a:0 "Noted."
 eotg_aug_kingpin.039.b:0 "Put a bounty on [eotg_kp.GetFirstName]."
 eotg_aug_kingpin.039.b.tt:0 "The bounty is posted. The hunt for [eotg_kp.GetFirstName] begins, and it frays [eotg_kp.GetHerHis] nerves."

 # ── eotg_aug_kingpin.050  The Orders ─────────────────────────────────────────
 eotg_aug_kingpin.050.t:0 "The Orders"
 eotg_aug_kingpin.050.desc_show:0 "[eotg_kp.GetFirstName] sends the order by courier, in a hand that never wavers. [eotg_kp.GetSheHe|U] wants honours, in public: a seat at my table when the court gathers, and [eotg_kp.GetHerHis] name read out before mine. It is not a petition any more, and [eotg_kp.GetSheHe] holds enough on me to make that clear."
 eotg_aug_kingpin.050.desc_name:0 "[eotg_kp.GetFirstName] sends a name and nothing else: [eotg_kp_order_target.GetFirstName]. A courtier of mine, in my own household. [eotg_kp.GetSheHe|U] wants the arrest ordered by my hand, in my name, before the next shift. No reason is given, and none is needed."
 eotg_aug_kingpin.050.desc_march:0 "A show of force, [eotg_kp.GetFirstName] writes. [eotg_kp.GetSheHe|U] wants my own levies marched through my own Regions in full kit, so that everyone sees what stands behind [eotg_kp.GetHerHis] name. The orders would be mine to give, and so would the cost."
 eotg_aug_kingpin.050.desc_squeeze:0 "[eotg_kp.GetFirstName] sends a number. It is a sum I am to pay before the next shift, and it will not be the last. There is no argument attached, only a reminder of the file [eotg_kp.GetSheHe] holds, and what is in it."
 eotg_aug_kingpin.050.a:0 "Do as [eotg_kp.GetSheHe] says."
 eotg_aug_kingpin.050.b:0 "Stall."
 eotg_aug_kingpin.050.c:0 "Not this one."
 eotg_aug_kingpin.050.c.tt:0 "[eotg_kp.GetFirstName] counts every refusal, and will answer the second."
 eotg_aug_kingpin.050.d:0 "Do what mine already has me doing."

 # ── eotg_aug_kingpin.063  L4 Kingmaker ───────────────────────────────────────
 eotg_aug_kingpin.063.t:0 "Kingmaker"
 eotg_aug_kingpin.063.desc:0 "The war is over, and the seat is [eotg_kp.GetHerHis]. [eotg_kp.GetFirstName] sits in [eotg_kp_target.GetName] now, and I am [eotg_kp.GetHerHis] vassal, which is a sentence I never meant to say. [eotg_kp.GetSheHe|U] does not gloat. [eotg_kp.GetSheHe|U] sends for me, thanks me in front of the court, and settles accounts the same day."
 eotg_aug_kingpin.063.desc_indep:0 "The war is over. [eotg_kp.GetFirstName] holds [eotg_kp_target.GetName], taken from a neighbour with my levies and [eotg_kp.GetHerHis] claim. The seat sits where I put it, and [eotg_kp.GetFirstName] sits in it. Gratitude is another matter, and [eotg_kp.GetSheHe] has not yet said what [eotg_kp.GetSheHe] thinks I am owed."
 eotg_aug_kingpin.063.desc_purge_half:0 "\n\nThe gold is half what it should have been. [eotg_kp.GetFirstName] keeps a file on me where a shared secret should have been, and does not hide that [eotg_kp.GetSheHe] is keeping it."
 eotg_aug_kingpin.063.desc_syndicate:0 "\n\nThe syndicate has no part in this. [eotg_kp.GetFirstName] acts for [eotg_kp.GetHerselfHimself] now, and has left the cargo trade behind."
 eotg_aug_kingpin.063.desc_end_storm:0 "\n\nThe casing at the base of [eotg_kp.GetHerHis] skull runs hot to the touch, and [eotg_kp.GetSheHe] loses stretches of conversation. The victory has not slowed it."
 eotg_aug_kingpin.063.desc_end_fracture:0 "\n\nSudden pauses, a tremor in the hands, a sentence begun and dropped halfway: [eotg_kp.GetFirstName] is breaking down in plain view, and wears the seat anyway."
 eotg_aug_kingpin.063.desc_end_flicker:0 "\n\nThe tells are small: a hand that moves a moment before the decision does, a step taken early. [eotg_kp.GetFirstName] hides it well."
 eotg_aug_kingpin.063.a:0 "I backed this. Let [eotg_kp.GetHerHim] remember it."

 # ── eotg_aug_kingpin.064  L5 Before the Bill Came ────────────────────────────
 eotg_aug_kingpin.064.t:0 "Before the Bill Came"
 eotg_aug_kingpin.064.desc:0 "The seat is mine, and [eotg_kp.GetFirstName] is still in the building, waiting on my answer. I know what paying would look like: the price [eotg_kp.GetSheHe] named, then the next one, in a currency I would have to keep paying. So I give no answer. The arrangements are made, quietly, with people [eotg_kp.GetSheHe] never counted."
 eotg_aug_kingpin.064.desc_end_storm:0 "\n\nThe casing at the base of [eotg_kp.GetHerHis] skull runs hot now, and [eotg_kp.GetSheHe] loses whole conversations. Nobody will find it odd that [eotg_kp.GetSheHe] is gone."
 eotg_aug_kingpin.064.desc_end_fracture:0 "\n\nTremors in the hands, pauses in the speech. A breakdown makes a good cover."
 eotg_aug_kingpin.064.desc_end_flicker:0 "\n\nStill only the small tells: a reflex that fires early, a step ahead of the decision. [eotg_kp.GetFirstName] suspects nothing."
 eotg_aug_kingpin.064.a:0 "No partners. No bill. Not after this."

 # ── eotg_aug_kingpin.065  L6 Sold to the Winner ──────────────────────────────
 eotg_aug_kingpin.065.t:0 "Sold to the Winner"
 eotg_aug_kingpin.065.desc:0 "The war is over, and I have nothing to show for it. [eotg_kp.GetFirstName] saw the end before I did, and was already selling by the time I looked: what [eotg_kp.GetSheHe] knows about me has gone to the winner, with a fee attached that I will be paying. I find out last what I was worth."
 eotg_aug_kingpin.065.desc_indep:0 "The war is over, and I have nothing to show for it. [eotg_kp.GetFirstName] had crossed the border in [eotg_kp.GetHerHis] head long before the end, and sold what [eotg_kp.GetSheHe] knows of my holdings. The winner now knows where I am thinnest."
 eotg_aug_kingpin.065.desc_end_storm:0 "\n\nThe casing at the base of [eotg_kp.GetHerHis] skull ran hot through the whole sale, and [eotg_kp.GetSheHe] still never missed a figure."
 eotg_aug_kingpin.065.desc_end_fracture:0 "\n\nThe tremors were in [eotg_kp.GetHerHis] hands the whole time, and [eotg_kp.GetSheHe] still signed [eotg_kp.GetHerHis] name clean."
 eotg_aug_kingpin.065.desc_end_flicker:0 "\n\nThere were only the small tells: a hand early to the table, a step ahead of the decision. I should have read more into them."
 eotg_aug_kingpin.065.a:0 "Then I know what [eotg_kp.GetFirstName] was worth."

 # ── eotg_aug_kingpin.066  L7 Every Level Burning ─────────────────────────────
 eotg_aug_kingpin.066.t:0 "Every Level Burning"
 eotg_aug_kingpin.066.desc:0 "The war has stopped being about the seat. Neither side can win it, and neither will stop. Fires run through the lower levels of both realms, fuel lines and transit hubs and sealed corridors, and the smoke comes up through my own vents. I can no longer say who lit the first one."
 eotg_aug_kingpin.066.desc_lost:0 "The war is over and the seat is lost, but the burning is not. Fires still run through the lower levels of both realms, through fuel lines and transit hubs and sealed corridors, and nobody is left whose work it is to put them out."
 eotg_aug_kingpin.066.desc_end_storm:0 "\n\nIn the middle of it the casing at the base of [eotg_kp.GetHerHis] skull runs hot, and [eotg_kp.GetFirstName] gives orders that no longer match the map."
 eotg_aug_kingpin.066.desc_end_fracture:0 "\n\n[eotg_kp.GetFirstName] is in it too, with a tremor in the hands and a sentence dropped halfway, and the fighting does not slow for it."
 eotg_aug_kingpin.066.desc_end_flicker:0 "\n\n[eotg_kp.GetFirstName] is calm through all of it, with only a hand that moves early to show the strain."
 eotg_aug_kingpin.066.a:0 "End it. Any terms."
 eotg_aug_kingpin.066.b:0 "Burn it all down."
 eotg_aug_kingpin.066.toast_a_killed:0 "The Figure Below Died in the Fighting"

 # ── eotg_aug_kingpin.067  L8 The Turn ────────────────────────────────────────
 eotg_aug_kingpin.067.t:0 "The Turn"
 eotg_aug_kingpin.067.desc:0 "[eotg_kp.GetFirstName] has sold me to [eotg_kp_liege.GetTitledFirstName]. The proof comes by courier, in [eotg_kp_liege.GetHerHis] own hand: the ledgers, the meetings, the names I would not say aloud. [eotg_kp.GetFirstName] sold it quietly, and sold it whole."
 eotg_aug_kingpin.067.desc_indep:0 "[eotg_kp.GetFirstName] has sold me, and not to a neighbour. What [eotg_kp.GetSheHe] knew has gone to my own vassals, the angriest of them first. It may come back to me as a demand, or as a war."
 eotg_aug_kingpin.067.desc_front:0 "\n\nThe client files are published. They go out in full, with names, dates and what was said under sedation, and anyone who cares to read them can."
 eotg_aug_kingpin.067.desc_end_storm:0 "\n\nThe casing at the base of [eotg_kp.GetHerHis] skull ran hot through all of it, and [eotg_kp.GetSheHe] lost whole stretches of the meeting. It was enough."
 eotg_aug_kingpin.067.desc_end_fracture:0 "\n\nThe betrayal was not clean: a tremor in the hands, a sentence begun and dropped halfway, and the trail shows it. The damage is done anyway."
 eotg_aug_kingpin.067.desc_end_flicker:0 "\n\nThe tells were small: a hand early, a step ahead of the decision. [eotg_kp.GetFirstName] kept the tells out of the room."
 eotg_aug_kingpin.067.a:0 "Let it land."
 eotg_aug_kingpin.067.b:0 "Pay [eotg_kp.GetFirstName] to soften it."
 eotg_aug_kingpin.067.c:0 "Hunt [eotg_kp.GetFirstName] down."
 eotg_aug_kingpin.067.c.success:0 "I reach [eotg_kp.GetFirstName] first. The sale ends there."
 eotg_aug_kingpin.067.c.failure:0 "[eotg_kp.GetFirstName] is gone before I arrive, and I have only made it louder."
 eotg_aug_kingpin.067.toast_c_success:0 "The Hunt Found Its Mark"
 eotg_aug_kingpin.067.toast_c_failure:0 "The Hunt Came Up Empty"

 # ── eotg_aug_kingpin.068  The Break (batch B key) ────────────────────────────
 eotg_aug_kingpin.068.desc_war:0 "\n\nAll of this in the middle of a war [eotg_kp.GetFirstName] helped to start. Whatever [eotg_kp.GetSheHe] brought to it will not survive the news."

 # ── eotg_aug_kingpin.069  A Seat Under You (batch B keys) ────────────────────
 eotg_aug_kingpin.069.desc_held:0 "The war is over, and the seat held. [eotg_kp.GetFirstName] kept [eotg_kp_target.GetName] through every week of it, with my levies behind. [eotg_kp.GetSheHe|U] is brought up and told the terms: the seat stays [eotg_kp.GetHerHis], under me, and the lower levels will be quiet because [eotg_kp.GetSheHe] says so. The court mutters. My vassals are already counting what this costs me."
 eotg_aug_kingpin.069.desc_decree:0 "[eotg_kp.GetFirstName] is brought up and told the terms. [eotg_kp_target.GetName] passed to [eotg_kp.GetHerHim] by my own hand, and [eotg_kp.GetSheHe] holds it under me from here. The lower levels will be quiet because [eotg_kp.GetSheHe] says so. The court mutters. My vassals are already counting what this costs me."

 # ── eotg_aug_kingpin.072  L13 The Hold Closes ────────────────────────────────
 eotg_aug_kingpin.072.t:0 "The Hold Closes"
 eotg_aug_kingpin.072.desc_purge:0 "[eotg_kp.GetFirstName] comes in without being sent for, and with no one to announce [eotg_kp.GetHerHim]. [eotg_kp.GetSheHe|U] sets the files down one at a time, each in front of me, with a courtesy that is worse than shouting. "It has been right about me every time," [eotg_kp.GetSheHe] says. "It has me reaching for my own people already. Do as I ask, or I start with yours.""
 eotg_aug_kingpin.072.desc_grandeur:0 "[eotg_kp.GetFirstName] arrives with an entourage and does not wait to be announced. "It never shows me hesitating now," [eotg_kp.GetSheHe] says, taking my chair. "So I will not hesitate here. Do as I ask, and do it where they can see. Kneel, if that is what it takes.""
 eotg_aug_kingpin.072.desc_forecast:0 "[eotg_kp.GetFirstName] crosses the room and puts out a hand. "It already has me shaking your hand," [eotg_kp.GetSheHe] says, and does, once. "It is usually right about me." I take the hand, because the court is watching. The papers [eotg_kp.GetSheHe] lays down after that are not a request."
 eotg_aug_kingpin.072.desc_cold:0 "[eotg_kp.GetFirstName] enters without ceremony and sets three slates in a row on my table, each with a price at the foot. They are my options, priced: what I pay if I agree, what I pay if I stall, and what I pay if I refuse. [eotg_kp.GetSheHe|U] does not look up while I read."
 eotg_aug_kingpin.072.a:0 "Do as [eotg_kp.GetSheHe] says."
 eotg_aug_kingpin.072.b:0 "No."
 eotg_aug_kingpin.072.b.tt:0 "[eotg_kp.GetFirstName] will answer the refusal within days."
 eotg_aug_kingpin.072.c:0 "Do what mine already has me doing."

 # ── batch B modifiers, opinions and the army ─────────────────────────────────
 eotg_mod_aug_kp_exposed:0 "Dealings Exposed"
 eotg_mod_aug_kp_exposed_desc:0 "What I did with the lower levels is known. My vassals think less of me for it, and so does everyone else."
 eotg_mod_aug_kp_crisis:0 "Orders From Below"
 eotg_mod_aug_kp_crisis_desc:0 "The lower levels give orders to the capital now. Development slows, the people think less of their ruler, and the levies refill slowly."
 eotg_mod_aug_kp_burned_levels:0 "Burned Levels"
 eotg_mod_aug_kp_burned_levels_desc:0 "Fire ran through the lower levels. Development has slowed, and the levy is smaller than it was."
 eotg_opinion_aug_kp_kingmaker:0 "Backed My Claim"
 eotg_opinion_aug_kp_conspired:0 "Conspired With the Lower Levels"
 eotg_aug_kp_army_name:0 "Guns From the Lower Levels"
