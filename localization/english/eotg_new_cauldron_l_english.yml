l_english:
 # ── New Cauldron Democracy Government ─────────────────────────────────────────

 eotg_new_cauldron_government:0 "New Cauldron Democracy"
 eotg_new_cauldron_government_adjective:0 "Democratic"
 eotg_new_cauldron_government_realm:0 "Republic"
 eotg_new_cauldron_government_desc:0 "New Cauldron's democratic republic, founded in 131 AG by Mikey the Great from the ruins of Orrin's Grip. Constituent States elect a President every fifteen years. The Senate provides institutional checks on executive power. Two-term limits are strictly enforced."

 # ── Customizable Localization ──────────────────────────────────────────────────

 eotg_holding_name_nc:0 "District"
 eotg_vassal_tier_one_nc:0 "Governor"
 eotg_vassal_tier_two_nc:0 "Senator"
 eotg_vassal_tier_three_nc:0 "State Leader"
 eotg_ruler_title_nc:0 "President"
 eotg_realm_name_nc:0 "The Republic"
 eotg_succession_flavor_nc:0 "The election concludes. New Cauldron passes its mandate forward."
 eotg_faction_name_nc:0 "The Opposition Bloc"

 # ── Vassal Contract Group ─────────────────────────────────────────────────────

 eotg_new_cauldron_vassal:0 "State Obligations"
 eotg_new_cauldron_vassal_desc:0 "The civic, military, and administrative duties owed to the federal government of New Cauldron by its constituent States."

 # ── Contract Obligations ───────────────────────────────────────────────────────

 eotg_nc_civic_contribution:0 "Civic Contribution"
 eotg_nc_civic_contribution_desc:0 "The State's tax obligation to the federal government of New Cauldron. Democratic governance requires shared investment."

 eotg_nc_contribution_minimal:0 "Minimal Contribution"
 eotg_nc_contribution_minimal_short:0 "Minimal"
 eotg_nc_contribution_minimal_desc:0 "A token contribution. Enough to claim federal membership."

 eotg_nc_contribution_standard:0 "Standard Contribution"
 eotg_nc_contribution_standard_short:0 "Standard"
 eotg_nc_contribution_standard_desc:0 "A fair share of the federal budget. Sustainable and expected."

 eotg_nc_contribution_elevated:0 "Elevated Contribution"
 eotg_nc_contribution_elevated_short:0 "Elevated"
 eotg_nc_contribution_elevated_desc:0 "Above-market rates. States remember when the federal government asks too much."

 eotg_nc_senate_representation:0 "Senate Representation"
 eotg_nc_senate_representation_desc:0 "Military contribution expected from constituent States. New Cauldron's professional forces carry the main burden; State levies supplement them."

 eotg_nc_levy_reduced:0 "Reduced Levy"
 eotg_nc_levy_reduced_short:0 "Reduced"
 eotg_nc_levy_reduced_desc:0 "A minimal military commitment. States are not militarized under democratic governance."

 eotg_nc_levy_standard:0 "Standard Levy"
 eotg_nc_levy_standard_short:0 "Standard"
 eotg_nc_levy_standard_desc:0 "A meaningful contribution to federal military capacity."

 eotg_nc_state_authority:0 "State Authority"
 eotg_nc_state_authority_desc:0 "The degree of economic and administrative autonomy granted to a constituent State."

 eotg_nc_authority_none:0 "No Special Authority"
 eotg_nc_authority_none_short:0 "None"
 eotg_nc_authority_none_desc:0 "Standard federal terms. No special autonomous rights."

 eotg_nc_authority_autonomous:0 "Autonomous State"
 eotg_nc_authority_autonomous_short:0 "Autonomous"
 eotg_nc_authority_autonomous_desc:0 "Recognized as an autonomous State with expanded self-governance. Local income improves."

 # ── Campaign Decisions ─────────────────────────────────────────────────────────

 eotg_nc_make_campaign_promise:0 "Make Campaign Promise"
 eotg_nc_make_campaign_promise_confirm:0 "Make a formal public commitment to your constituents."
 eotg_nc_make_campaign_promise_desc:0 "Promises move votes. A public commitment now will carry weight in the election — and an obligation afterward. The States are watching to see if you follow through."
 eotg_nc_make_campaign_promise_tooltip:0 "Make a campaign promise. Boosts your vote weight in the election. Breaking it after victory will damage your reputation."
 eotg_nc_make_campaign_promise_effect_tooltip:0 "You have made a public campaign promise. Your vote weight is increased. If you win the election, there will be an expectation of follow-through."

 eotg_nc_rally_districts:0 "Rally the Districts"
 eotg_nc_rally_districts_confirm:0 "Spend gold mobilizing grassroots support across your State."
 eotg_nc_rally_districts_desc:0 "Elections are won on the ground. A well-funded mobilization campaign can shift the balance in your favor — if you can afford the effort."
 eotg_nc_rally_districts_tooltip:0 "Spend gold to boost your vote weight. Can be repeated, but each rally costs more than the last."
 eotg_nc_rally_districts_effect_tooltip:0 "Your district network is mobilized. Vote weight increased. Subsequent rallies will cost more."

 eotg_nc_attack_rivals_record:0 "Attack Rival's Record"
 eotg_nc_attack_rivals_record_confirm:0 "Use your intelligence network to damage the leading rival's standing."
 eotg_nc_attack_rivals_record_desc:0 "Every candidate has a record. Some have skeletons worth surfacing. A well-placed revelation can collapse a rival's support — but if it backfires, the exposure could land on you."
 eotg_nc_attack_rivals_record_tooltip:0 "Attempt to damage the leading rival's vote weight. Success depends on intrigue. Failure risks political scandal."
 eotg_nc_attack_rivals_success_tooltip:0 "The exposure lands. Your rival's standing is damaged for two years."
 eotg_nc_attack_rivals_fail_tooltip:0 "The operation backfires. Political scandal incoming."

 eotg_nc_public_address:0 "Public Address"
 eotg_nc_public_address_confirm:0 "Deliver a realm-wide address to rally support."
 eotg_nc_public_address_desc:0 "A public address can move thousands — if delivered well. High diplomacy turns a speech into a mandate. Poor delivery turns it into a gift for your rivals."
 eotg_nc_public_address_tooltip:0 "Spend prestige. High diplomacy boosts your vote weight significantly. Low diplomacy backfires."
 eotg_nc_public_address_success_tooltip:0 "An exceptional address. The States rally behind your candidacy."
 eotg_nc_public_address_partial_tooltip:0 "A competent address. Modest support gains across the districts."
 eotg_nc_public_address_fail_tooltip:0 "The address landed badly. A scandal event has been triggered."

 eotg_nc_forge_alliance:0 "Forge Alliance"
 eotg_nc_forge_alliance_confirm:0 "Offer a council position to secure a major State's Senate vote."
 eotg_nc_forge_alliance_desc:0 "Democracy runs on deals. Offering a council seat to a powerful State leader is transparent political currency — publicly visible, but effective. They know it. You know it. The voters know it."
 eotg_nc_forge_alliance_tooltip:0 "Spend prestige. Requires diplomacy 10+. Secures a significant vote weight boost and creates an obligation to award a council position if you win."
 eotg_nc_forge_alliance_effect_tooltip:0 "You have committed to a post-election council appointment. Your vote weight is significantly increased."

 # ── Senate Decisions ───────────────────────────────────────────────────────────

 eotg_nc_call_senate_war_vote:0 "Call Senate War Vote"
 eotg_nc_call_senate_war_vote_confirm:0 "Bring an offensive war declaration to a Senate vote."
 eotg_nc_call_senate_war_vote_desc:0 "The constitution is clear: offensive wars require Senate approval. A favorable vote gives you a war mandate. An unfavorable one forces you to either stand down or invoke Emergency Powers."
 eotg_nc_call_senate_war_vote_tooltip:0 "Requires Senate support >= 40 to approve. If approved, grants Senate war mandate for one year."

 eotg_nc_invoke_emergency_powers:0 "Invoke Emergency Powers"
 eotg_nc_invoke_emergency_powers_confirm:0 "Bypass Senate approval for one offensive war. Once per term."
 eotg_nc_invoke_emergency_powers_desc:0 "In extreme circumstances, the President may act unilaterally. This power exists precisely because democracy sometimes cannot move fast enough. Using it is costly — and the Senate will not forget."
 eotg_nc_invoke_emergency_powers_tooltip:0 "Requires 200 prestige. Bypasses Senate war vote requirement for two years. Cannot be used again for the remainder of this term. Senate members will react with opinion penalties."
 eotg_nc_invoke_emergency_powers_effect_tooltip:0 "Emergency powers are active. You may declare an offensive war without Senate approval for two years. Senators have been notified."

 eotg_nc_buy_senate_support:0 "Buy Senate Support"
 eotg_nc_buy_senate_support_confirm:0 "Spend gold to improve Senate opinion through back-channel negotiation."
 eotg_nc_buy_senate_support_desc:0 "Political capital comes in many forms. Quiet investment in Senate relationships — favors, access, financial support for constituent projects — can shift the balance of power. Just don't get caught."
 eotg_nc_buy_senate_support_tooltip:0 "Spend gold to boost Senate support. Small chance of discovery and scandal."
 eotg_nc_buy_senate_support_effect_tooltip:0 "Senate support has increased."
 eotg_nc_buy_senate_scandal_tooltip:0 "The transaction was discovered. A scandal event fires."

 # ── Modifiers ──────────────────────────────────────────────────────────────────

 eotg_former_president:0 "Former President"
 eotg_former_president_desc:0 "A former President of New Cauldron. Their political experience and public standing make them a significant force in Senate affairs and a natural kingmaker in future elections."

 eotg_nc_vp_succession_mourning:0 "Mourning Republic"
 eotg_nc_vp_succession_mourning_desc:0 "The galaxy mourns the President. New Cauldron's new leader inherits a moment of rare solidarity — respect flows from unlikely quarters."

 # ── Opinion Modifiers ──────────────────────────────────────────────────────────

 eotg_nc_emergency_powers_anger:0 "Emergency Powers Resentment"
 eotg_nc_emergency_powers_anger_desc:0 "The President bypassed the Senate. This is a poor precedent."

 # ── Election Events ────────────────────────────────────────────────────────────

 eotg_nc_election_0001_title:0 "The Campaign Season Opens"
 eotg_nc_election_0001_desc:0 "Two years remain in your term. The campaign season has begun — eligible State leaders and Senators are already maneuvering for position. The Republic will have its election. The question is who shapes it."
 eotg_nc_election_0001_opt_noted:0 "The work of the Republic continues."

 eotg_nc_election_0002_title:0 "The Election Is Concluded"
 eotg_nc_election_0002_desc:0 "The States have voted. The Senate has certified the results. [nc_election_winner.GetTitledFirstName] has won the presidency. New Cauldron demands a transfer of power."
 eotg_nc_election_0002_opt_transfer:0 "Transfer the presidency. This is how democracy works."
 eotg_nc_election_0002_opt_crisis:0 "No eligible successor. Extend the campaign season."
 eotg_nc_election_0002_crisis_tooltip:0 "No eligible candidates were found. The campaign season is extended by one year. Legitimacy is damaged."

 eotg_nc_election_0003_title:0 "You Are the New President"
 eotg_nc_election_0003_desc:0 "The States have spoken. New Cauldron's presidency passes to you. The weight of a 735-year-old republic now rests on your choices."
 eotg_nc_election_0003_opt_accept:0 "New Cauldron endures. We move forward."

 eotg_nc_election_0004_title:0 "You Are the Vice President"
 eotg_nc_election_0004_desc:0 "The election was close. [nc_election_runner_up.GetTitledFirstName] carries the second mandate of New Cauldron's democracy. Should anything happen to the President, the Republic looks to you."
 eotg_nc_election_0004_opt_serve:0 "I serve in the capacity the Republic requires."

 eotg_nc_election_0005_title:0 "The President Is Dead"
 eotg_nc_election_0005_desc:0 "The President is gone. New Cauldron has no time to mourn — the succession protocol passes the executive mandate to the Vice President. You did not expect this. The Republic needs you anyway."
 eotg_nc_election_0005_opt_assume_duty:0 "I assume the duties of the presidency."

 # ── Senate Events ──────────────────────────────────────────────────────────────

 eotg_nc_senate_0001_title:0 "Senate Dissatisfaction"
 eotg_nc_senate_0001_desc:0 "The Senate is restless. Support is below the threshold where your decisions carry comfortable authority. Senators are signaling that significant policy choices will face resistance."
 eotg_nc_senate_0001_opt_address:0 "Address their concerns. Spend prestige and rebuild."
 eotg_nc_senate_0001_opt_hold:0 "Ignore them. The presidency has authority they do not."

 eotg_nc_senate_0002_title:0 "Senate War Vote"
 eotg_nc_senate_0002_desc_approved:0 "The Senate has approved the war declaration. You have a mandate to act. New Cauldron's military stands ready."
 eotg_nc_senate_0002_desc_denied:0 "The Senate has blocked the war declaration. The votes were not there. You may invoke Emergency Powers to override — at significant cost."
 eotg_nc_senate_0002_opt_approved:0 "The mandate is in hand. We move."
 eotg_nc_senate_0002_opt_denied:0 "Denied. We consider our options."

 eotg_nc_senate_0003_title:0 "Emergency Powers Declared"
 eotg_nc_senate_0003_desc:0 "The President has invoked Emergency Powers, bypassing Senate approval for an offensive war. This is legal — and deeply unpopular with the chamber."
 eotg_nc_senate_0003_opt_protest:0 "We register our objection."

 eotg_nc_senate_0004_title:0 "Political Exposure"
 eotg_nc_senate_0004_desc:0 "Your methods have been exposed. The opposition is using this to damage your credibility with the public. The districts are watching."
 eotg_nc_senate_0004_opt_endure:0 "Endure the fallout. Prestige and legitimacy will suffer."
