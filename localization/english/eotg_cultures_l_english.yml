\ufeffl_english:

 # ── XERIC SPHERE ───────────────────────────────────────────────────────────

 eotg_culture_aelvaryn:0 "Aelvaryn"
 eotg_culture_aelvaryn_desc:0 "Restorationist elves of the Xerxes system — surviving through memory, isolation, and the defensive reconstruction of what was lost."

 eotg_culture_thalassyr:0 "Thalassyr"
 eotg_culture_thalassyr_desc:0 "Sea-altered elf descendants who survived the great flooding through adaptation, fragmented navigation, and constant environmental pressure."

 eotg_culture_brackwateri:0 "Brackwateri"
 eotg_culture_brackwateri_desc:0 "Hybridized flood survivors drawn from multiple displaced populations — pragmatic, community-oriented, and deeply comfortable with impermanence."

 # ── HELIX SPHERE ───────────────────────────────────────────────────────────

 eotg_culture_virens:0 "Virens"
 eotg_culture_virens_desc:0 "Post-corporate survivors who rebuilt their social structures around violence-networks, opportunistic raiding, and adaptive martial culture."

 eotg_culture_veltrani:0 "Veltrani"
 eotg_culture_veltrani_desc:0 "Industrial rural survivors who rebuilt through collective labor, disciplined production, and the shared maintenance of critical infrastructure."

 eotg_culture_caldryx:0 "Caldryx"
 eotg_culture_caldryx_desc:0 "Militarized border populations who survived through force projection, resource extraction, and the fortification of contested frontier sectors."

 eotg_culture_duskvein:0 "Duskvein"
 eotg_culture_duskvein_desc:0 "Nomadic criminal salvagers who drift through unstable regions — acquiring resources through opportunism, isolation, and calculated violence."

 # ── CAULDRON SPHERE ────────────────────────────────────────────────────────

 eotg_culture_cauldrani:0 "Cauldrani"
 eotg_culture_cauldrani_desc:0 "Civic republicans shaped by New Cauldron's 735-year democratic tradition — institutional, disciplined, and fiercely proud of their political inheritance."

 eotg_culture_halrethi:0 "Halrethi"
 eotg_culture_halrethi_desc:0 "Military settlers who colonized the marches on behalf of Cauldron's institutions — loyal, defensive, and built around the culture of the frontier garrison."

 eotg_culture_tangentine:0 "Tangentine"
 eotg_culture_tangentine_desc:0 "Warp-route scavengers and transit corridor drifters — adaptive, mobile, and deeply fluent in the informal economies of dangerous space."

 # ── COLDIRON SPHERE ────────────────────────────────────────────────────────

 eotg_culture_khadrashi:0 "Khadrashi"
 eotg_culture_khadrashi_desc:0 "A theocratic industrial civilization built on the twin foundations of doctrinal discipline and productive order — survival through structured hierarchy."

 eotg_culture_sternstahl:0 "Sternstahl"
 eotg_culture_sternstahl_desc:0 "Defensive fortress populations who treat fortification as civilization itself — enduring, stoic, and sustained by the culture of the hardened garrison."

 eotg_culture_noctivar:0 "Noctivar"
 eotg_culture_noctivar_desc:0 "Paranoid frontier observers who survive through intelligence networks, mercenary contracts, and the careful preservation of operational knowledge."

 # ── LANIUS SPHERE ──────────────────────────────────────────────────────────

 eotg_culture_solvari:0 "Solvari"
 eotg_culture_solvari_desc:0 "Descendants of the Elrossi colonial aristocracy — performing legitimacy through ceremony, codified law, and the careful management of institutional memory."

 eotg_culture_istrovan:0 "Istrovan"
 eotg_culture_istrovan_desc:0 "Sacred military frontier peoples for whom military service and ideological duty are inseparable — wardens of the pilgrim routes and frontier sanctuaries."

 eotg_culture_zeladani:0 "Zeladani"
 eotg_culture_zeladani_desc:0 "Isolated noble houses preserving old-world lineages and aesthetic traditions — withdrawn, oath-bound, and deeply invested in cultural continuity."

 eotg_culture_nyssari:0 "Nyssari"
 eotg_culture_nyssari_desc:0 "Ancient remnant descendants in visible decline — custodians of knowledge and ceremony, fading slowly as the world moves past them."

 # ── TRADE LEAGUE SPHERE ────────────────────────────────────────────────────

 eotg_culture_geldmark:0 "Geldmark"
 eotg_culture_geldmark_desc:0 "Goblin oligarchs who transformed mercantile aggression into a complete civilization — wealth as power, commerce as warfare, profit as survival."

 eotg_culture_brokari:0 "Brokari"
 eotg_culture_brokari_desc:0 "Human transit administrators who made themselves indispensable by managing the complex logistics of Trade League corridor networks."

 eotg_culture_kelmori:0 "Kelmori"
 eotg_culture_kelmori_desc:0 "Independent goblin shipping clans who operate semi-lawlessly through frontier corridors — loyal to clan, contract, and no one else."

 # ── OGRE SPHERE ────────────────────────────────────────────────────────────

 eotg_culture_drogmari:0 "Drogmari"
 eotg_culture_drogmari_desc:0 "Ogre engineer-workers for whom construction, fabrication, and collective industrial labor are the foundations of civilization and cultural identity."

 eotg_culture_thrakani:0 "Thrakani"
 eotg_culture_thrakani_desc:0 "Independent ogre frontier clans who combine industrial self-reliance with aggressive territorial expansion and doctrinal survival culture."

 # ── RATFOLK SPHERE ─────────────────────────────────────────────────────────

 eotg_culture_skarrin:0 "Skarrin"
 eotg_culture_skarrin_desc:0 "Revolutionary ratfolk collectivists who rebuilt shattered systems through disciplined industrial production, meritocratic organization, and collective labor."

 eotg_culture_veskari:0 "Veskari"
 eotg_culture_veskari_desc:0 "Traditionalist ratfolk who maintained social cohesion through doctrinal adherence, lineage structures, and the defensive preservation of community memory."

 # ── OUTER MARCHES ──────────────────────────────────────────────────────────

 eotg_culture_gnashvok:0 "Gnashvok"
 eotg_culture_gnashvok_desc:0 "Violent goblin scrap-raider culture from the Outer Marches — organized around salvage operations, opportunistic raiding, and the logic of aggressive survival."

 eotg_culture_uvreki:0 "Uvreki"
 eotg_culture_uvreki_desc:0 "Cross-cultural frontier drifters who built a mixed identity from the intersection of many surviving traditions — adaptable and defined by no single origin."

 eotg_culture_vanthari:0 "Vanthari"
 eotg_culture_vanthari_desc:0 "Isolated void populations who retreated deep into frontier space — self-sufficient, secretive, and shaped by generations of deliberate separation."

 eotg_culture_orovane:0 "Orovane"
 eotg_culture_orovane_desc:0 "Descendants of a fallen administrative elite who preserved bureaucratic form long after its substance disappeared — structured, proud, and quietly obsolete."
