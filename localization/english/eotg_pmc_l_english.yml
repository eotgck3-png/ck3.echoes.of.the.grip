l_english:
 # PMC G2 batch P1 (resource core). Spec: docs/specs/governments_v2_g2_pmc.md section 9.
 eotg_pmc_standing_modifier:0 "The Company's Name"
 eotg_pmc_standing_modifier_desc:0 "Clients pay for a record, not a promise. The better the company's standing, the more its name is worth."
 eotg_pmc_standing_scale_desc:0 "Your company's standing, from 0 to 100"
 eotg_story_pmc_standing:0 "The Company's Name"
 eotg_story_pmc_standing_info:0 "Standing is your company's reputation among those who pay for force. Results earn it, and failures cost it.\n\nTaking a contract pays more the higher your standing, and raises it by 10. Each battle your side wins under your lead adds 2; each one it loses costs 3. Above 60, standing slips by 2 a year unless it is earned again.\n\nThe higher your standing, the more [prestige|E] the company earns each month and the better its best fighters perform.\n\nWhen you die, your heir keeps three quarters of your standing, or their own if that is higher."
 eotg_story_pmc_standing_label:0 "Standing"
 eotg_story_pmc_standing_min_label:0 "0"
 eotg_story_pmc_standing_max_label:0 "100"
 eotg_story_pmc_standing_tt:0 "This counter shows your company's standing, from 0 to 100."
 # Batches P3 and P4 (decisions, transitions)
 eotg_pmc_under_contract_modifier:0 "Under Contract"
 eotg_pmc_under_contract_modifier_desc:0 "Much of the company's force is away on a client's business."
 eotg_decision_pmc_take_contract:0 "Take a Contract"
 eotg_decision_pmc_take_contract_desc:0 "A client needs force and will pay for it. The better your company's standing, the more the contract is worth: 50 [gold|E], plus 3 for every point of standing. For two years much of your force will be away on the client's business."
 eotg_decision_pmc_take_contract_tooltip:0 "Sell your company's force for a fee"
 eotg_decision_pmc_take_contract_confirm:0 "Sign the contract"
 eotg_decision_pmc_take_contract_free_tt:0 "Your company is not already under contract"
 eotg_decision_pmc_take_contract_standing_tt:0 "Your company's standing rises by 10"
 eotg_decision_pmc_deliver_results:0 "Deliver Results"
 eotg_decision_pmc_deliver_results_desc:0 "Pay your crews a bonus and make sure the job is done well. A contractor who delivers earns a name, and a good name travels up the chain of command."
 eotg_decision_pmc_deliver_results_tooltip:0 "Earn standing by results"
 eotg_decision_pmc_deliver_results_confirm:0 "Get it done"
 eotg_decision_pmc_deliver_results_standing_tt:0 "Your standing rises by 15"
 eotg_decision_pmc_deliver_results_liege_tt:0 "Your [liege|E]'s standing rises by 5"
 eotg_decision_pmc_recruit_on_reputation:0 "Recruit on Reputation"
 eotg_decision_pmc_recruit_on_reputation_desc:0 "The best fighters go where the name is good. Spend some of your company's standing to bring a seasoned Operator to your court."
 eotg_decision_pmc_recruit_on_reputation_tooltip:0 "Trade standing for a seasoned fighter"
 eotg_decision_pmc_recruit_on_reputation_confirm:0 "Send word"
 eotg_decision_pmc_recruit_on_reputation_cost_tt:0 "Your company has at least 20 standing"
 eotg_decision_pmc_recruit_on_reputation_standing_tt:0 "Your company's standing falls by 20"
 eotg_decision_pmc_recruit_on_reputation_effect_tt:0 "A seasoned Operator joins your court"
 eotg_decision_pmc_recruit_on_reputation_toast:0 "A New Operator"
 eotg_decision_pmc_recruit_on_reputation_toast_desc:0 "[eotg_pmc_recruit.GetTitledFirstName] has heard of your company and joins your court"
 eotg_decision_pmc_adopt:0 "Run the Realm as a Company"
 eotg_decision_pmc_adopt_desc:0 "You already command. Run your realm as a company that sells force, and earn standing by results. Only you change: your vassals keep their governments, but land you grant from now on is run the company way."
 eotg_decision_pmc_adopt_tooltip:0 "Turn your command into a company"
 eotg_decision_pmc_adopt_confirm:0 "Open for business"
 eotg_decision_pmc_adopt_martial_tt:0 "You have at least 12 [martial|E]"
 eotg_decision_pmc_adopt_knights_tt:0 "You have at least 3 [ROOT.Char.Custom('KnightCulturePluralNoTooltipLowercase')]"
 eotg_decision_pmc_stand_down:0 "Stand Down the Company"
 eotg_decision_pmc_stand_down_desc:0 "Leave the business of force behind and become Feudal. Your company's standing turns into [prestige|E], 4 for each point up to 400, and the name is spent. Your PMC vassals become Feudal with you."
 eotg_decision_pmc_stand_down_tooltip:0 "Trade the company's name for your own"
 eotg_decision_pmc_stand_down_confirm:0 "Stand down"
 eotg_decision_pmc_stand_down_contract_tt:0 "Your company is not under contract"
 eotg_decision_pmc_stand_down_standing_tt:0 "Your company's standing falls to 0"
 eotg_decision_pmc_stand_down_effect_tt:0 "Your PMC vassals become Feudal with you"
