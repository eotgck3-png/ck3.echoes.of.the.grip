 l_english:
 # ── PMC Government ─────────────────────────────────────────────────────────────

 eotg_pmc_government:0 "Private Military Company"
 eotg_pmc_government_adjective:0 "PMC"
 eotg_pmc_government_realm:0 "Command"
 eotg_pmc_government_desc:0 "A proto-corporate military state built on contracts, operational capability, and the personal authority of the Contractor-General. Knights are called Operators. Power is measured in gold and martial reputation. Given sufficient wealth and territory, a PMC can be restructured into a full Corporation."

 # ── Customizable Localization ──────────────────────────────────────────────────

 eotg_holding_name_pmc:0 "Garrison"
 eotg_vassal_tier_one_pmc:0 "Contractor"
 eotg_vassal_tier_two_pmc:0 "Field Director"
 eotg_vassal_tier_three_pmc:0 "Executive Commander"
 eotg_ruler_title_pmc:0 "Contractor-General"
 eotg_realm_name_pmc:0 "The Command"
 eotg_succession_flavor_pmc:0 "The contract transfers. Command is assumed. The operation continues."
 eotg_faction_name_pmc:0 "The Withdrawal Bloc"

 # ── Contract Obligations ───────────────────────────────────────────────────────

 eotg_pmc_vassal:0 "PMC Contract Obligations"
 eotg_pmc_vassal_desc:0 "The operational and financial duties owed to the Contractor-General by subordinate PMC commands."

 eotg_pmc_operational_levy:0 "Operational Levy"
 eotg_pmc_operational_levy_desc:0 "Military contribution required from subordinate commands. The PMC runs on boots, not just gold."

 eotg_pmc_levy_minimal:0 "Token Commitment"
 eotg_pmc_levy_minimal_short:0 "Token"
 eotg_pmc_levy_minimal_desc:0 "A minimal force contribution. Enough to show the flag."

 eotg_pmc_levy_standard:0 "Standard Deployment"
 eotg_pmc_levy_standard_short:0 "Standard"
 eotg_pmc_levy_standard_desc:0 "A meaningful portion of the subordinate command's operational strength."

 eotg_pmc_levy_full:0 "Full Mobilization"
 eotg_pmc_levy_full_short:0 "Full"
 eotg_pmc_levy_full_desc:0 "Every available operator deployed. Subordinate commands resent the strain."

 eotg_pmc_contractor_fee:0 "Contractor Fee"
 eotg_pmc_contractor_fee_desc:0 "Operational overhead payments to the Contractor-General's central command. The price of operating under the PMC banner."

 eotg_pmc_fee_low:0 "Reduced Rate"
 eotg_pmc_fee_low_short:0 "Reduced"
 eotg_pmc_fee_low_desc:0 "A discounted fee — granted as incentive or concession."

 eotg_pmc_fee_standard:0 "Standard Rate"
 eotg_pmc_fee_standard_short:0 "Standard"
 eotg_pmc_fee_standard_desc:0 "The expected fee. Sustainable and operationally sound."

 eotg_pmc_fee_high:0 "Full Assessment"
 eotg_pmc_fee_high_short:0 "Full"
 eotg_pmc_fee_high_desc:0 "Maximum extraction. Central command profits; subordinates remember it."

 eotg_pmc_field_commission:0 "Field Commission"
 eotg_pmc_field_commission_desc:0 "Formal operational authorization granting tactical autonomy and martial support to the subordinate command."

 eotg_pmc_commission_none:0 "No Commission"
 eotg_pmc_commission_none_short:0 "None"
 eotg_pmc_commission_none_desc:0 "The subordinate command operates without formal commission. No additional martial authority."

 eotg_pmc_commission_granted:0 "Field Commission Granted"
 eotg_pmc_commission_granted_short:0 "Commissioned"
 eotg_pmc_commission_granted_desc:0 "A formal operational commission. The holder gains additional martial authority and tactical resources."

 # ── Decisions ──────────────────────────────────────────────────────────────────

 eotg_pmc_withdraw_forces:0 "Declare Force Withdrawal"
 eotg_pmc_withdraw_forces_confirm:0 "Formally withdraw your forces from the Contractor-General's command authority."
 eotg_pmc_withdraw_forces_desc:0 "The Contractor-General's position is untenable. Withdrawing your forces sends a clear message — their authority over your command is suspended until they demonstrate the strength to hold it."
 eotg_pmc_withdraw_forces_tooltip:0 "Withdraw your forces from the Contractor-General's command. If enough Executive Commanders do the same, it triggers a Loss of Command crisis."
 eotg_pmc_withdraw_forces_effect_tooltip:0 "Your forces are withdrawn. If the withdrawal threshold is reached, the Contractor-General enters a Loss of Command crisis."

 eotg_pmc_buy_back_loyalty:0 "Buy Back Loyalty"
 eotg_pmc_buy_back_loyalty_confirm:0 "Spend gold to restore vassal loyalty and end the Loss of Command crisis."
 eotg_pmc_buy_back_loyalty_desc:0 "The withdrawals are a crisis, not a verdict. Gold can still speak where authority has faltered. Pay what you must — recover command before the window closes."
 eotg_pmc_buy_back_loyalty_tooltip:0 "Spend gold to restore loyalty of withdrawing Executive Commanders and end the Loss of Command crisis."
 eotg_pmc_buy_back_loyalty_effect_tooltip:0 "All withdrawal flags are cleared. Restored vassals receive an opinion bonus."

 eotg_pmc_extend_command:0 "Purchase Command Extension"
 eotg_pmc_extend_command_confirm:0 "Spend gold and prestige to extend the Loss of Command window by one year."
 eotg_pmc_extend_command_desc:0 "You cannot fully restore loyalty yet, but you can buy time. A visible display of resources and resolve will make even the most skeptical Executive Commander hesitate before moving against you."
 eotg_pmc_extend_command_tooltip:0 "Spend gold and prestige to extend the Loss of Command window by one year. Each extension costs more than the last."
 eotg_pmc_extend_command_effect_tooltip:0 "The Loss of Command window is extended by one year. Extension costs will increase further."

 eotg_pmc_evolve_corporation:0 "Formalize as Corporation"
 eotg_pmc_evolve_corporation_confirm:0 "Restructure the PMC into a full Corporation, adopting corporate governance and identity."
 eotg_pmc_evolve_corporation_desc:0 "The PMC has grown beyond its origins. The wealth, territory, and operational reach of a true corporation are within grasp. Formalizing the transition changes everything — the structure, the culture, and the name."
 eotg_pmc_evolve_corporation_tooltip:0 "Requires 1000 gold, 500 prestige, realm size 10+, and at least one kingdom-tier holding."
 eotg_pmc_evolve_corporation_effect_tooltip:0 "Government switches to Corporation. Prestige reward. Gold investment required."

 # ── Modifiers ──────────────────────────────────────────────────────────────────

 eotg_pmc_controversy_minor:0 "Operational Controversy"
 eotg_pmc_controversy_minor_desc:0 "Minor backlash from an active PMC contract. Some holdings are restless; most adapt."

 eotg_pmc_controversy_standard:0 "Significant Controversy"
 eotg_pmc_controversy_standard_desc:0 "A PMC contract has drawn meaningful public backlash. Vassal opinion is affected and revolt risk rises in contested counties."

 eotg_pmc_controversy_exclusive:0 "Exclusive Contract Lock"
 eotg_pmc_controversy_exclusive_desc:0 "An exclusive PMC contract is active. The Contractor-General has committed all operational resources to a single client. Offensive wars are an honor violation for the duration. Controversy is at its peak."

 eotg_pmc_command_collapsed:0 "Collapsed Command"
 eotg_pmc_command_collapsed_desc:0 "The Loss of Command crisis expired without resolution. Legitimacy and vassal trust are severely damaged. Rebuilding authority will take years."

 eotg_pmc_high_fee_extraction:0 "Full Assessment Active"
 eotg_pmc_high_fee_extraction_desc:0 "The Contractor-General is extracting maximum contractor fees. Income is elevated; vassal goodwill is not."

 eotg_pmc_field_commission_active:0 "Field Commission"
 eotg_pmc_field_commission_active_desc:0 "A formal operational commission from the Contractor-General. Grants tactical authority and additional martial resources."

 eotg_pmc_loyalty_restored:0 "Loyalty Restored"
 eotg_pmc_loyalty_restored_desc:0 "The Contractor-General paid to restore trust after a period of doubt. A practical arrangement — for now."

 # ── Council Position ───────────────────────────────────────────────────────────

 eotg_pmc_logistics_officer:0 "Logistics Officer"
 eotg_pmc_logistics_officer_possessive:0 "Logistics Officer's"
 eotg_pmc_logistics_officer_name:0 "Logistics Officer"
 eotg_pmc_logistics_officer_tooltip:0 "The Logistics Officer manages supply lines, resource acquisition, and contract oversight for the PMC. Uses Stewardship skill."

 task_eotg_pmc_manage_supply_lines:0 "Manage Supply Lines"
 task_eotg_pmc_manage_supply_lines_effect_desc:0 "The Logistics Officer maintains efficient supply chains across the PMC's operational theater, reducing army maintenance costs."
 task_eotg_pmc_manage_supply_lines_modifier:0 "Managing Supply Lines"

 task_eotg_pmc_secure_resources:0 "Secure Resources"
 task_eotg_pmc_secure_resources_effect_desc:0 "The Logistics Officer identifies and secures resource streams for the Contractor-General's domain, boosting gold income."
 task_eotg_pmc_secure_resources_modifier:0 "Securing Resources"

 task_eotg_pmc_audit_contracts:0 "Audit Contracts"
 task_eotg_pmc_audit_contracts_effect_desc:0 "The Logistics Officer manages the public perception of active contracts, reducing controversy pressure and maintaining vassal relations."
 task_eotg_pmc_audit_contracts_modifier:0 "Auditing Contracts"

 # ── Contract Events ────────────────────────────────────────────────────────────

 eotg_pmc_contract_0001_title:0 "A Contract Opportunity"
 eotg_pmc_contract_0001_desc_named:0 "[scope:eotg_client.GetTitledFirstName] has entered a war. Word reaches your command that they seek operational support — paid, professional, and deniable. The terms are yours to set."
 eotg_pmc_contract_0001_desc_generic:0 "A nearby ruler has entered a war and seeks professional military support. A contract opportunity has been identified by your intelligence network."

 eotg_pmc_contract_0001_opt_minor:0 "Accept a minor engagement. Quick gold, low commitment."
 eotg_pmc_contract_0001_opt_standard:0 "Accept a standard contract. Meaningful reward, meaningful commitment."
 eotg_pmc_contract_0001_opt_exclusive:0 "Accept an exclusive contract. Maximum payout — but we commit everything."
 eotg_pmc_contract_0001_opt_decline:0 "Decline. We are not available."

 eotg_pmc_contract_0003_title:0 "Controversy Spreads"
 eotg_pmc_contract_0003_desc:0 "PMC activities on your behalf have created friction with local populations and neighboring powers. The Contractor-General's operators do not go unnoticed — and neither does your association with them."

 eotg_pmc_contract_0003_opt_tolerate:0 "It is a cost of doing business. We tolerate it."
 eotg_pmc_contract_0003_opt_demand:0 "Demand the PMC curtail their visibility. The association is becoming a liability."

 eotg_pmc_contract_0004_title:0 "Controversy Is Building"
 eotg_pmc_contract_0004_desc_exclusive:0 "The exclusive contract has brought significant scrutiny. Holdings are restless, and powerful vassals are asking questions. The gold was worth it — but the pressure is real."
 eotg_pmc_contract_0004_desc_standard:0 "Standard contract activity has drawn attention. Some holdings report increased unrest. This is manageable, but it requires active attention."
 eotg_pmc_contract_0004_desc_minor:0 "A minor ripple of controversy from recent contract activity. Barely noticeable — but your officers have flagged it."

 eotg_pmc_contract_0004_opt_manage:0 "Manage the situation. Spend prestige to smooth it over."
 eotg_pmc_contract_0004_opt_ignore:0 "Ignore it. This is the cost of operating."

 # ── Command Events ─────────────────────────────────────────────────────────────

 eotg_pmc_command_0001_title:0 "Loss of Command"
 eotg_pmc_command_0001_desc:0 "Enough Executive Commanders have formally withdrawn their forces from your authority to constitute a crisis. The Loss of Command clock is running. You have one year to restore their loyalty — through gold, through concessions, or through displays of strength. If the window closes without resolution, the Command collapses."

 eotg_pmc_command_0001_opt_negotiate:0 "Buy back their loyalty immediately. This ends now."
 eotg_pmc_command_0001_opt_hold:0 "Hold firm. Use the window to negotiate on your terms."

 eotg_pmc_command_0002_title:0 "An Ally Steps Forward"
 eotg_pmc_command_0002_desc:0 "[scope:eotg_ally_vassal.GetTitledFirstName] has not joined the withdrawal. More than that — they are actively working to bring the withdrawing commanders back in line, buying your command more time."

 eotg_pmc_command_0002_opt_accept:0 "Accept their support. The window extends."
 eotg_pmc_command_0002_opt_decline:0 "Thank them, but decline. We handle this ourselves."

 eotg_pmc_command_0003_title:0 "Command Has Collapsed"
 eotg_pmc_command_0003_desc:0 "The Loss of Command window has expired. The withdrawing Executive Commanders have not returned. Your legitimacy as Contractor-General is severely damaged. The Command structure holds — but only because no one has moved to formalize the alternative. Yet."

 eotg_pmc_command_0003_opt_endure:0 "Endure. Rebuild from the wreckage."

 eotg_pmc_command_0004_title:0 "Force Withdrawal Declared"
 eotg_pmc_command_0004_desc:0 "[scope:eotg_withdrawing_commander.GetTitledFirstName] has formally declared a withdrawal of forces from your command authority. They are not alone in their grievances — watch for others to follow."

 eotg_pmc_command_0004_opt_noted:0 "Noted. We will address this."

 eotg_pmc_command_0005_title:0 "The Corporation Takes Shape"
 eotg_pmc_command_0005_desc:0 "The PMC has outgrown its origins. The wealth, the territory, the reach — all of it points toward a more formal structure. Today, the Private Military Company becomes something more. The articles of incorporation are drafted. The Command dissolves into a Board. The Contractor-General becomes a CEO."

 eotg_pmc_command_0005_opt_evolve:0 "Sign the articles. We are a Corporation now."

 # ── PMC Legitimacy Modifiers ─────────────────────────────────────────────────
 eotg_pmc_proven_legitimacy:0 "Proven Effectiveness"
 eotg_pmc_proven_legitimacy_desc:0 "This PMC is actively at war or under contract. Their military effectiveness is on display — and their legitimacy as a fighting force is beyond question."
 eotg_pmc_legitimacy_questioned:0 "Legitimacy Questioned"
 eotg_pmc_legitimacy_questioned_desc:0 "This PMC has sat idle without a war or active contract for too long. Questions are circulating: are you a legitimate military force, or just a raider band with better paperwork?"

 # ── PMC Legitimacy Flavor Events (0018–0023) ──────────────────────────────────

 # 0018 — The Record Speaks for Itself
 eotg_pmc_flavor_0018_title:0 "The Record Speaks for Itself"
 eotg_pmc_flavor_0018_desc:0 "Independent analysts and prospective clients are reviewing the PMC's operational history — contracts completed, casualties sustained, objectives achieved. The review will shape how outside powers classify your organization: professional force or licensed raider fleet."

 eotg_pmc_flavor_0018_opt_publish:0 "Publish a full performance dossier. Transparency earns credibility."
 eotg_pmc_flavor_0018_opt_quiet:0 "Let the record speak quietly. Professionals do not advertise."
 eotg_pmc_flavor_0018_opt_market:0 "License the record as marketing copy. The brand has value."

 # 0019 — War Crimes Tribunal
 eotg_pmc_flavor_0019_title:0 "War Crimes Tribunal"
 eotg_pmc_flavor_0019_desc:0 "A formal inquiry has been lodged — civilian casualties, property destruction, excessive force. The tribunal represents parties who have standing and the will to pursue this. The question is not whether they are wrong. The question is how you answer."

 eotg_pmc_flavor_0019_opt_cooperate:0 "Cooperate fully with the investigation. Accountability costs us today. It pays us forever."
 eotg_pmc_flavor_0019_opt_stonewall:0 "Stonewall — attorney access only. They will find nothing they can use."
 eotg_pmc_flavor_0019_opt_buy:0 "Buy the tribunal. These things can be managed."

 # 0020 — A Rival Command Rises
 eotg_pmc_flavor_0020_title:0 "A Rival Command Rises"
 eotg_pmc_flavor_0020_desc:0 "Another private military command has been building a name in the same operational markets. Their operators speak well of conditions. Their clients speak well of results. You are sharing a market that does not expand to accommodate rivalry indefinitely."

 eotg_pmc_flavor_0020_opt_compete:0 "Compete openly. Let the record of operations decide who leads this market."
 eotg_pmc_flavor_0020_opt_poach:0 "Poach their best operators. The talent is the organization."
 eotg_pmc_flavor_0020_opt_undermine:0 "Undermine their reputation through back channels. Quietly."

 # 0021 — The Old Client's Endorsement
 eotg_pmc_flavor_0021_title:0 "The Old Client's Endorsement"
 eotg_pmc_flavor_0021_desc:0 "One of our most significant past employers has issued a formal public endorsement — delivery, professionalism, results, no unauthorized escalation. The endorsement carries weight in markets we have not yet entered."

 eotg_pmc_flavor_0021_opt_accept:0 "Accept and publish it widely. This is what the record has earned."
 eotg_pmc_flavor_0021_opt_leverage:0 "Accept privately. Use it as a negotiating credential, not a press release."
 eotg_pmc_flavor_0021_opt_decline:0 "Decline. Our reputation speaks without intermediaries."

 # 0022 — A Dirty Contract
 eotg_pmc_flavor_0022_title:0 "A Dirty Contract"
 eotg_pmc_flavor_0022_desc:0 "The offer is substantial — gold, access, resupply rights. The target is a civilian transit hub, a refugee settlement, a medical convoy. The client frames it as logistics interdiction. Every operator with field experience will recognize it for what it is."

 eotg_pmc_flavor_0022_opt_refuse:0 "Refuse. These are not military targets, and we are not executioners."
 eotg_pmc_flavor_0022_opt_conditions:0 "Accept with conditions — civilian exclusion zones, documented rules of engagement."
 eotg_pmc_flavor_0022_opt_accept:0 "Accept without reservation. The client's war is our war."

 # 0023 — The Industry Symposium
 eotg_pmc_flavor_0023_title:0 "The Industry Symposium"
 eotg_pmc_flavor_0023_desc:0 "Major military organizations across the sector have extended a formal invitation to a summit on standards, contracts, and the role of private military commands in state-level conflicts. Our inclusion on the invitation list represents institutional recognition. How we respond defines what kind of institution we intend to be."

 eotg_pmc_flavor_0023_opt_attend:0 "Attend and present the PMC's doctrine. We helped shape this industry. We will shape its standards."
 eotg_pmc_flavor_0023_opt_send:0 "Send representatives. Observe and report. Commit to nothing yet."
 eotg_pmc_flavor_0023_opt_decline:0 "Decline. We answer to our clients, not to symposia."
