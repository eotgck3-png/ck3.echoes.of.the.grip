 # ── FP1/FP2/FP3 DLC — EotG Setting Overrides ─────────────────────────────────
 # Sources (FP1): dlc_fp1_modifiers_l_english.yml,
 #                dlc_fp1_jomsviking_events_l_english.yml,
 #                dlc_fp1_shieldmaiden_events_l_english.yml,
 #                dlc_fp1_other_decisions_events_l_english.yml,
 #                dlc_fp1_custom_loc_l_english.yml
 # Sources (FP2): dlc_fp2_events_amalgamated_l_english.yml,
