l_english:
 # ── Burgher, Corvée & Government Concepts — EotG Setting Overrides ────────────
 # Sources: buildings_l_english.yml,
 #          culture/culture_eras_l_english.yml,
 #          decisions_l_english.yml,
 #          game_concepts_l_english.yml,
 #          government_l_english.yml,
 #          event_localization/decisions/major_decisions_middle_europe_l_english.yml,
 #          event_localization/lifestyle/governance/stewardship_domain_events_l_english.yml,
 #          event_localization/stress_events/stress_threshold_events_1_l_english.yml
 # Replaces: "burgher/burghers" → "contractor/contractors",
 #            "corvée" → "labor duties",
 #            "peasant" → "commoner" (in corvée context),
 #            "sin" → "failing" (in stress event).
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Buildings ─────────────────────────────────────────────────────────────────

 # "a large number of burghers, merchants, and hard-working townsfolk"
 building_type_city_01_desc:0 "A populous city which houses a large number of contractors, merchants, and hard-working townsfolk."

 # "major guilds and burgher families"
 building_type_guild_halls_01_desc:0 "The city provides all major guilds and contractor families with ample locale to organize and practice their crafts."

 # ── Culture Eras ──────────────────────────────────────────────────────────────

 # "the rise of the burgher class"
 culture_era_high_medieval_desc:0 "The High Medieval Era is a time of great technological and administrative progress, seeing towns grow into cities and the rise of the contractor class even as the aristocracy reigns supreme."

 # ── Decisions ─────────────────────────────────────────────────────────────────

 # "Nobility, Clergy and Burghers with the old Roman infrastructure"
 empower_sicilian_parliament_decision_desc:0 "By balancing the representative of Nobility, Clergy and Contractors with the old Roman infrastructure, a new advisory body could be organized, for the benefit of both monarch and subjects."

 # "sow dissent amongst the neighboring burghers"
 middle_europe_decisions.0002.desc.emperor:0 "After years of strife and uneasy diplomatic deals, I was forced to grant the Swiss Cantons imperial immediacy.\n\nThis collection of alpine towns has united in a large Confederation to protect themselves from the predations of the Burgundians and the German lords. I must be careful to keep them in check, lest their accomplishment sow dissent amongst the neighboring contractors."

 # ── Game Concepts ─────────────────────────────────────────────────────────────

 # "government form of burghers and merchants"
 game_concept_republic_desc:0 "$game_concept_republic_government$ is an unplayable [government_form|E] where an elected citizen rules for life — the $game_concept_government_form$ of contractors and merchants.\n\n$game_concept_republican$ [vassals|E] have static [obligations|E] that cannot be changed, and thus always provide a dependable and predictable amount of [levies|E] and [taxes|E]."

 # ── Government Description ────────────────────────────────────────────────────

 # "the privileged citizens of the burgher class"
 republic_government_desc:0 "\n$game_concept_republic_desc$\n\n#F Towns are ruled by the privileged citizens of the contractor class, among whom one is chosen as mayor. While the mayor has significant influence, they depend on popularity to be re-elected.#!"

 # ── Stress Events: Burgher Insults ────────────────────────────────────────────

 # "wheedle a royal stamp out of me, burgher?"
 stress_threshold.1711.desc.ambitious:0 "\"You think you can wheedle a royal stamp out of me, contractor? I am a [ROOT.GetCharacter.GetTitleAsNameNoTooltip|L]!\""

 # "the reek of sin upon you, burgher!"
 stress_threshold.1711.desc.zealous:0 "\"I can practically smell the reek of failing upon you, contractor!\""

 # "Help yourself to the treasury, burgher."
 stress_threshold.1711.d.improvident.gain:0 "Help yourself to the treasury, contractor. You need it."

 # ── Stewardship Domain: Corvée ────────────────────────────────────────────────

 # "Levy more peasants for the corvée."
 stewardship_domain_special.8012.b:0 "Levy more commoners for labor duties."
