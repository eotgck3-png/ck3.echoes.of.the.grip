 hunt_peasants_eaten_log:0 "[CHARACTER.GetShortUIName|U] hunted and ate some foraging commoners in the hunting grounds"
 hunt_peasants_donation_log:0 "[CHARACTER.GetShortUIName|U] gave some foraging commoners a donation to keep them out of the hunting grounds"
 hunt_peasants_dismiss_log:0 "[CHARACTER.GetShortUIName|U] dismissed some foraging commoners"
 hunt_peasant_kill_cover_log:0 "[CHARACTER.GetShortUIName|U] helped [TARGET_CHARACTER.GetShortUIName] cover up [TARGET_CHARACTER.GetHerHis] murder of a commoner"
 hunt_peasant_kill_expose_log:0 "[CHARACTER.GetShortUIName|U] exposed [TARGET_CHARACTER.GetShortUINamePossessive] murder of a commoner"
