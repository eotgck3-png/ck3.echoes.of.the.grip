 # ── Hunt Encounter: Forest Hermit ─────────────────────────────────────────────

 # "Stay with you, a filthy peasant?!" — cruel rejection of the forest hermit
 hunt.1021.b.cruel:0 "Stay with you, a filthy commoner?!"

 # "Even if it was only a peasant..." — callous dismissal after soldier kills hermit
 hunt.4008.c.flavor:0 "Even if it was only a commoner..."

 # "[hunt_participant.GetSheHe] fought valiantly to save [peasant.GetHerHim]"
 hunt.4008.a:0 "[hunt_participant.GetSheHe|U] fought valiantly to save [peasant.GetHerHim], I saw it!"

 # "I pray that it will never end!" — athletic character musing about the hunt
 hunt.9001.desc_hunter_2:0 "The [ROOT.Char.Custom('TerrainType')] are like my second home – to feel the wind in my hair, to spend time with my courtiers, to feel the excitement as I close in on my prey... I hope it will never end!"

 # ── Hunt Log Strings ──────────────────────────────────────────────────────────
