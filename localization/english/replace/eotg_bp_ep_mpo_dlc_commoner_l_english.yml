 # ── BP1: Yearly Events ────────────────────────────────────────────────────────

 # "I labor hard alongside the unsuspecting peasants"
 bp1_yearly.5304.desc:0 "The waterlogged, marshy land I have volunteered to help with makes for sweaty work. I labor hard alongside the unsuspecting commoners with a pickaxe, digging trenches and depositing sacks of wet mud away from the area.\n\n[concerned_friend.GetFirstName] and I are taking a break, standing at rest on the narrow strip between two patches of bog, when [waterboy.GetFirstName], one of the children tasked with keeping the workers hydrated, wanders towards me offering a flask. No sooner have I taken a swig than [waterboy.GetFirstNameNoTooltip], reaching for the bottle, overbalances and falls directly into the bog!"

 # "I bid farewell to the peasants I had been working alongside"
 bp1_yearly.5305.desc:0 "With my tasks completed, I bid farewell to the commoners I had been working alongside with [concerned_friend.GetFirstName] — they cheerily waved me off, completely unsuspecting as to my noble origins — and returned to my usual lodgings. Though my muscles are sore, I feel flush with strength and vitality.\n\nSpying a large basin of water on the other side of the room, I haul myself to my feet and approach it. Taking off my shirt, in the flicker of the candlelight I regard myself in the water's reflection."

 # ── BP2: Adult Education ──────────────────────────────────────────────────────

 # "A Party of Peasants" — event title
 bp2_adult_education.9100.t:0 "A Party of Commoners"

 # "two peasants ... ravenously gulping down a barrel"
 bp2_adult_education.9100.desc:0 "I am suddenly distracted from my midnight studies by a loud #EMP *Crash*#!, an ear-deafening #EMP *SLAM*#! and an expensive-sounding #EMP *Shatter*#!. What in the world is going on!?\n\nThe source of disturbance appears to be two commoners, [ROOT.Char.GetFaith.HighGodName] knows how they got in here, ravenously gulping down a barrel of the university's [ROOT.Char.Custom('GetExpensiveDrink_Singular')]!\n\n"This'll #EMP *hic*#! teach them!" One of them shouts. "Yeah, they think they're better than us just because they can #EMP read!#!" The other follows."

 # ""Peasants — get us more cups" — option text
 bp2_adult_education.9100.b:0 ""Commoners — get us more cups, I'm getting the other students!""

 # ── BP2: Yearly Events ────────────────────────────────────────────────────────

 # "I come upon a sickly-looking peasant child"
 bp2_yearly.2130.desc:0 "It is a rare occasion that I manage to slip by all my attendants unnoticed and secure a few precious moments to myself — a chance to finally feel like other children must.\n\nClutching my [ROOT.Char.Custom( 'child_favorite_toy' )], I walk the streets of [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] taking in all the sights and smells. People are bustling about; merchants hawking their wares.\n\nI come upon a sickly-looking commoner child holed up in the corner of an alleyway."

 # "Just yesterday an old peasant was praising [dead_parent]"
 bp2_yearly.4011.desc:0 "My [famous_dead_parent.GetMotherFather], the great [famous_dead_parent.GetTitledFirstName], [famous_dead_parent.GetDeathReason] a long time ago. Yet the flame of [famous_dead_parent.GetHerHis] life still shines bright. What surrounded [famous_dead_parent.GetHerHim] everywhere now seems to follow me.\n\nMany still consider me [famous_dead_parent.GetHerHis] [ROOT.Char.Custom('GetDaughterSon')], rather than a [ROOT.Char.GetWomanMan] in my own right! Just yesterday an old commoner was praising [famous_dead_parent.GetHerHim] as if [famous_dead_parent.GetSheHe] was still alive!\n\nThe time has come to step out of [famous_dead_parent.GetHerHis] shadow! To make my mark on the world! To be recognized as the great [ROOT.Char.GetTitledFirstName]!"

 # ── BP3: Travel Events ────────────────────────────────────────────────────────

 # ""Hold your tongue, vile peasant!"" — option text
 travel_events_bp3.15.c:0 ""Hold your tongue, vile commoner!""

 # "a throng of little peasant kids gathered around"
 travel_events_bp3.35.desc.home:0 "Whilst walking through the streets of [ROOT.Char.GetCurrentLocation.GetName], we see a throng of little commoner kids gathered around an old [soldier_character.GetWomanMan] down a small side street. Several of them are waving around little misshaped wooden swords and are yelling excitedly as they are trying to hit [soldier_character.GetHerHim].\n\n"Who would be impressed by footwork like that, eh?" [soldier_character.GetSheHe|U] turns to us, after teasing one of the kids,"

 # "a small peasant kid struggling to breathe"
 travel_events_bp3.105.desc.physician:0 "[lifestyle_character.GetSheHe|U] often helps others with small wounds and scratches, putting together small poultices like it was nothing.\n\nWhen we pass through [ROOT.Char.GetCurrentLocation.GetName] I see [lifestyle_character.GetHerHim] suddenly run to a small commoner kid struggling to breathe and turning an unnatural color in a back alley, and before you know it the kid's face returns to normal. How did [lifestyle_character.GetSheHe] do it?"

 # "a ribald story about four peasants"
 travel_events_bp3.115.desc.outro:0 "I didn't know [character_number_1.GetSheHe] had it in [character_number_1.GetHerHim], but [character_number_1.GetFirstNameNoTooltip] ends up telling a particularly ribald story about four commoners [character_number_1.GetSheHe] had seen in [ROOT.Char.GetCapitalLocation.GetName].\n\nAfter drying my eyes from the laughter, and drinking a bit to clear my throat, I will..."

 # ── EP1: Flavor Events ────────────────────────────────────────────────────────

 # "every other word is spelled like it was written by an illiterate peasant"
 ep1_flavor.0021.desc:0 "Giggling confronts me as I walk into the chamber: a gaggle of courtiers, led by [nitpicker.GetTitledFirstName], are all crowded around a recent letter from [rival_monarch.GetTitledFirstName].\n\n[nitpicker.GetFirstNameNoTooltip] waves me over with a shout of laughter.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], you simply #EMP must#! read this! It has the official seal of [rival_realm.GetNameNoTier], but every other word is spelled like it was written by an illiterate commoner. Those scatterbrained sluggards can't even use the right consonants, much less speak good [ROOT.Char.GetCourtLanguage.GetName], and it's #EMP hilarious#!.""

 # ── EP1: Fund Inspiration Events ──────────────────────────────────────────────

 # ""Here, some coin to abduct a few peasants.""
 fund_inspiration.2002.b:0 ""Here, some coin to abduct a few commoners.""

 # ""The border isn't far. Go kidnap some foreign peasants.""
 fund_inspiration.2002.c:0 ""The border isn't far. Go kidnap some foreign commoners.""

 # "Evidence leads to you as the cause of the missing peasants"
 fund_inspiration.2002.toast_outcome.negative:0 "Evidence leads to you as the cause of the missing commoners"

 # "You get away with the kidnapping of peasants"
 fund_inspiration.2002.toast_outcome.positive:0 "You get away with the kidnapping of commoners"

 # ── EP2: Locale Events ────────────────────────────────────────────────────────

 # "what seems to be a peasant brawl"
 ep2_locale_events.5510.desc:0 "The locals at [ROOT.Char.GetCurrentLocation.GetNameNoTooltip] seem equally interested in the tournament as the nobles attending it: some have improvised temporary shops in the ground floor of their houses, and the [ROOT.Char.Custom('GetLocalStreetFoodPlural')] smell delicious.\n\nAbove all the revelry and the chatter I hear some more... violent noises coming from one of the alleys; as I approach it I observe what seems to be a commoner brawl, but one of them is more skilled than the rest."

 # ── EP2: Tournament Events (dlc_ep2_tournament_events_l_english.yml) ──────────

 # "those fickle peasants are eating it up!"
 ep2_tournament_events.0002.desc:0 "#EMP Thunk!#!\n\nMy body thuds into the wooden wall at the edge of the arena, [versus_contestant.GetFirstName] having bodily hurled me there with a snarl. No sooner has [versus_contestant.GetSheHe] done so than [versus_contestant.GetFirstNamePossessiveNoTooltip] face morphs into a smug smile, and to my astonishment [versus_contestant.GetSheHe] turns away from me completely.\n\nRaising [versus_contestant.GetHerHis] arms to the baying crowd, [versus_contestant.GetSheHe] curls [versus_contestant.GetHerHis] arms up and flexes in the imitation of a traveling strong[versus_contestant.GetWomanMan]. The cheers from the crowd redouble; those fickle commoners are eating it up!"

 # "an unfortunate peasant need only move aside"
 ep2_tournament_events.1001.desc:0 "Amidst the blood and thunder of the melee, it is almost impossible to keep your bearings. The mass of competitors heave and sway - an uncontrollable pile of humanity. Woe betide anyone who should stand in its way! Of course, an unfortunate commoner need only move aside with haste to avoid the brawl. The issue is a little more pronounced, I consider, when the victim is a building.\n\nThe melee has spilled over into [activity.GetCurrentPhase.GetLocation.GetBaronyNameExplicitly] proper, and even now I can see contestants from both sides ripping off pieces of building facade to use as rudimentary shields or even missiles. I fancy I can even hear the crackling of flames in the middle distance..."

 # ── EP2: Contest Events ───────────────────────────────────────────────────────

 # "the peasant is quite dead" — archery accident
 contest_events.1520.desc:0 "A gasp rises from the spectators, and after what seems an eternity, the form keels over, groaning feebly. A valet soon confirms the worst: the commoner is quite dead — no points for #EMP that#! arrow..."

 # ── EP2: Tournament Events (tournament/dlc_ep2_tournament_events_l_english.yml) 

 # ""I am but a peasant, nothing more."" — peasant fighter reveals origins
 tournament_events.1230.desc:0 "As I do my rounds of the tourney grounds, taking in the atmosphere and debating the various practicing contestant's techniques, a particular [battle_peasant.GetWomanMan] catches my eye.\n\n[battle_peasant.GetHerHis|U] every movement is pregnant with grace, efficiency, and poise, making short work of stuffing-straw and sparring partner alike.\n\nWhen I call to [battle_peasant.GetHerHim] to reveal which noble house [battle_peasant.GetSheHe] descends from, [battle_peasant.GetHerHis] eyes widen, before dropping to the floor. "M-my [ROOT.Char.GetLadyLord]! I am but a commoner, nothing more." he stammers, bowing deeply."

 # "Ack, a #EMP peasant?!#!" — dismissal option
 tournament_events.1230.d:0 "Ack, a #EMP commoner?!#! What a shame..."

 # Log keys: "Peasant Champion/Knight/Sponsor"
 tournament_champion_battle_peasant_log_title:0 "Commoner Champion"
 tournament_champion_battle_peasant_log:0 "[CHARACTER.GetTitledFirstName] appointed [TARGET_CHARACTER.GetTitledFirstName], a commoner, [CHARACTER.GetHerHis] champion"
 tournament_recruited_battle_peasant_log_title:0 "Commoner Knight"
 tournament_recruited_battle_peasant_log:0 "[CHARACTER.GetTitledFirstName] knighted [TARGET_CHARACTER.GetTitledFirstName], a commoner"
 tournament_sponsored_battle_peasant_log_title:0 "Commoner Sponsor"
 tournament_sponsored_battle_peasant_log:0 "[CHARACTER.GetTitledFirstName] sponsored [TARGET_CHARACTER.GetTitledFirstName], a commoner, to compete"
 tournament_contest_1520_log:0 "[CHARACTER.GetTitledFirstName] accidentally killed a commoner on the $tournament_phase_archery$ butts"

 # "the life of a local peasant was treated" — tragedy modifier desc
 tournament_butt_tragedy_modifier_desc:0 "The cheapness with which the life of a local commoner was treated when accidentally shot has appalled the commoners."

 # "The promotion of a lowly peasant from the locality"
 tournament_battle_peasant_county_modifier_desc:0 "The promotion of a lowly commoner from the locality has inspired the commoners with aspirational hope."

 # "Elevated Peasant Knight" — opinion modifier name
 tournament_elevated_peasant_knight_opinion:0 "Elevated Commoner Knight"

 # ── EP2: Wedding Events ───────────────────────────────────────────────────────

 # "haggard-looking peasants"
 ep2_wedding.1160.desc:0 "Nobility weddings are always a great show for the common people, who gather in hope of getting a glimpse of their ruler and a taste of their riches.\n\nIn particular, I can't help but notice that the underway preparations for the grand banquet are being followed with rapt attention by a group of extremely haggard-looking commoners..."

 # "The peasants are driven out" — outcome text
 ep2_wedding.1161.success:0 "The commoners are driven out"

 # "[host] drove the peasants out" — outcome tooltip
 ep2_wedding.1161.success.tt2:0 "[host.GetFirstName] drove the commoners out."

 # "[host] let the peasants stay" — option tooltip
 ep2_wedding.1161.b.tt:0 "[host.GetFirstName] let the commoners stay."

 # ── EP2: Wedding Modifiers ────────────────────────────────────────────────────

 # "Peasant Connections" — modifier name
 wedding_peasants_connections_county_modifier:0 "Commoner Connections"

 # "Overwhelmed by Peasants" — modifier name
 wedding_peasants_overrun_modifier:0 "Overwhelmed by Commoners"

 # ── MPO: Decisions ────────────────────────────────────────────────────────────

 # "You gather a group of peasants, and try to convince them to do your bidding"
 mpo_decisions_events.0201.intrigue_1_tt:0 "You gather a group of commoners, and try to convince them to do your bidding"

 # ── MPO: Tova Events ──────────────────────────────────────────────────────────

 # "They are peasant rebels posing as actors"
 mpo_events_tova.0003.desc:0 "The ominous caw of a carrion call greets me as I clear the forest edge, where I am met with the sight of empty nooses swaying slightly from the [unruly_province.Custom('GetRandomRegionalWood')] branches. Three men in chains kneel below the nooses. One of them looks almost like [unruly_province_owner.GetTitledFirstName]. \n\n"These lowly curs mocked the rightful rule of our [unruly_province_owner.GetTitleTierName]!" cries the executioner. "They are commoner rebels posing as actors, and their campaign of slander will end in their deaths." \n\n"Please help us," one of the accused call out to me."

 # ── MPO: Feast Events ─────────────────────────────────────────────────────────

 # "peasants [bringing] small sacks of valuables"
 feast_tsagaan_sar_events.0002.desc:0 "The festivities have begun, and while I am grateful to [host.GetName] for [host.GetHerHis] invitation, I ponder the gift I must give [host.GetHerHim]. This is beyond a matter of tradition: it is one of honor.\n\nI observe other nobles bringing chests of foreign coin, and commoners small sacks of valuables. Others trot on horses, and tend to them in preparation for meeting their new owner. A few guests grant a intangible offering, speaking precious oaths of fidelity.\n\nBut the question arises, what can I give up for my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('host'))], [host.GetFirstNameNoTooltip]?"