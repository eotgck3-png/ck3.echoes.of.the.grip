l_english:
# County tier displays as Shoal (owner ruling 2026-10-20). Each key is overridden here only.
# Key list: vanilla 1.20.1.1 game_concepts, culture_titles, land_tier, map_modes. Links ([county|E], $game_concept_county$) are untouched and resolve to the new names.

 game_concept_county:0 "Shoal"
 game_concept_counties:0 "Shoals"
 game_concept_county_desc:0 "A $game_concept_county$ is a [title|E] one [title_tier|E] below a [duchy|E] and one above a [barony|E].\n\nThe $game_concept_title$ includes the [county_capital|E] in the $game_concept_county$, as well as [de_jure|E] rights to all the [baronies|E] in the $game_concept_county$.\n\n$game_concept_counties$ always have [holders|E] because $game_concept_county_capitals$ cannot be destroyed."
 game_concept_county_capital:0 "Shoal Capital"
 game_concept_county_capitals:0 "Shoal Capitals"
 game_concept_county_capital_desc:0 "The $game_concept_county_capital$ is the main [holding|E] of a [county|E]. This Holding can never be destroyed or [leased|E] out and is always owned by the [ruler|E] who holds the Shoal [title|E].\n\nA $game_concept_county_capital$ allows the construction of an additional [building|E] compared to a lesser Holding."
 game_concept_county_control:0 "Shoal Control"
 game_concept_county_control_desc:0 "$game_concept_county_control$ measures the grip that the government has on the population of a [county|E]. It is crucial especially for collecting [taxes|E] from the [holdings|E].\n\nWhen a Shoal changes hands through [war|E], Control goes down drastically, which is a good reason to vassalize the current [holder|E] instead (if the [casus_belli|E] allows). Shoal Control can also be damaged by [sieges|E] and [Concept( 'peasant_faction', 'Peasant Uprisings' )|E].\n\nLow Control may lead to [county_corruption|E], and the primary way of increasing Control is a [councillor_task|E] available to your [marshal|E]."
 game_concept_county_corruption:0 "Shoal Corruption"
 game_concept_county_corruption_desc:0 "While a [county|E] has low [control|E] or its [holder|E] is in [debt|E], the Shoal might acquire $game_concept_county_corruption$. These are various kinds of negative [county_modifiers|E].\n\n$game_concept_county_corruption$ will fade over time, but if the root cause persists ([debt|E] or low [control|E]), it may reappear.\n\nThe $councillor_marshal$'s $task_increase_control$ $game_concept_councillor_task$ can clear out $game_concept_county_corruption$ faster."
 game_concept_county_modifier:0 "Shoal Modifier"
 game_concept_county_modifiers:0 "Shoal Modifiers"
 game_concept_county_modifier_desc:0 "$game_concept_county_modifiers$ are modifiers that affect a [county|E]'s various values.\n\n[baronies|E] can have modifiers of their own, and they can be viewed in the [holdings|E] of the $game_concept_county$."
 game_concept_county_opinion_desc:0 "The general populace of each [county|E] has an [opinion|E] of the [character|E] who holds their $game_concept_county$. If the population is unhappy, they might start or join a [peasant_faction|E] or [popular_faction|E], either of which can soon spread throughout an entire [realm|E].\n\nThe easiest way of controlling $game_concept_county_opinion$ is to ensure that the $game_concept_county$ [holder|E] is of the same [culture|E] and [faith|E] as the population.\n\n$game_concept_county_opinion$ from having a different [faith|E] is modified by both the Shoal's [faith_hostility|E] and its [fervor|E], scaling linearly between 0 and 100 $game_concept_fervor$."
 game_concept_tribal_desc:0 "Tribal realms have stunted Shoal [development|E], cannot advance past Tribal Era [innovations|E], cannot construct new [holdings|E], and are usually unable to change their [succession_law|E].\n\nHowever, they can make use of [prestige|E] rather than [gold|E] to build their realms and hire [men_at_arms|E], and have access to more [casus_belli|E] compared to [feudal|E] Realms. Non-Tribal armies suffer a [supply_limit|E] penalty in hostile Tribal territory."
 game_concept_complete_control_desc:0 "This condition is fulfilled when all [de_jure|E] vassal [titles|E] of the targeted title are held by either the [ruler|E] or by their [vassals|E] and none of its Shoals are [occupied|E] by hostile [armies|E]."
 county_feudal:0 "Shoal"
 county_feudal_roman:0 "Shoal"
 county_feudal_tibetan_group:0 "Shoal"
 county:0 "Shoal"
 county_plural:0 "Shoals"
 counties:0 "Shoal Titles"
