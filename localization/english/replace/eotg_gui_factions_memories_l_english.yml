 # ── Factions View ─────────────────────────────────────────────────────────────

 # "Peasant Revolt" — faction type name
 FACTION_PEASANT_REVOLT:0 "Commoner Revolt"

 # "#T Peasants from [county]" — faction window county member tooltip
 FACTION_WINDOW_COUNTY_MEMBER_TT:0 "#S Faction Member#!\n#T Commoners from [FactionCountyMember.GetMember.GetNameNoTooltip]#!\n[faction_military_power|E] Contribution: [FactionCountyMember.CalcPower|%1V]\n#weak Contribution is based on the [county|E]'s [levies|E] and [county_opinion|E]#!\n\n#S Faction Commitment: [FactionCountyMember.CalcJoinScore|V0]#! #weak (leaves if less than [GetDefine('NFaction', 'COUNTY_LEAVE_SCORE_THRESHOLD')])#!\n[FactionCountyMember.CalcJoinBreakdown]\n\n#I Click to view County#!"

 # ── Levy View ─────────────────────────────────────────────────────────────────

 # "peasant militias" — levy flavour text
 LV_FLAVOR:0 "Levies consist of commoner militias, ruffians, local sellswords, and destitute nobles equipped with motley tools and improvised weapons — their sheer numbers make up the bulk of most armies."

 # ── Potential Agents ──────────────────────────────────────────────────────────

 # "peasant's pitchfork" — assassin agent description
 agent_assassin_desc:0 "#WEAK Knife, poison, or commoner's pitchfork — as long as they're not breathing by daybreak, it's all the same to me.#!\n$EFFECT_LIST_BULLET$ Provides [success_chance_max_i] [scheme_potential|E]\n$EFFECT_LIST_BULLET$ Requires [prowess_i] [prowess|E] & [intrigue_i] [intrigue|E]\n$EFFECT_LIST_BULLET$ #P Benefits#! from [traits|E] like [GetTrait('sadistic').GetName( GetNullCharacter )] and [GetTrait('patient').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$ #N Suffers#! from [traits|E] like [GetTrait('compassionate').GetName( GetNullCharacter )] and [GetTrait('impatient').GetName( GetNullCharacter )]"

 # ── Event Window Widgets ──────────────────────────────────────────────────────

 # "Local Peasants are in a constant struggle" + "peasants from all supported counties"
 event_window_widget_peasant_leader_tooltip:0 "Local Commoners are in a constant struggle against their overlords. As an [adventurer|E], you are just a bystander. However, if you wish, you can take action into your own hands. Decide who's right and who's wrong, choose a side and support it."

 # "peasants from all supported counties will join your banners"
 event_window_widget_peasant_leader_tooltip_widget:0 "Reminder for how many [counties|E] you decided to support or control. If it comes down to a war, commoners from all supported counties will join your banners!"

