 # "Peasant's Straw Hat" — portrait modifier name
 PORTRAIT_MODIFIER_custom_headgear_m_headgear_sec_fp4_western_era3_com_01:0 "@legendsofthedead_icon! Commoner's Straw Hat"

 # ── Tutorial ──────────────────────────────────────────────────────────────────

 # "including the many unwashed peasants across the world"
 lesson_basics_religion_3_desc:0 "All [faiths|E] have [fervor|E], which waxes and wanes over time depending on the number of adherents to the $game_concept_faith$, how [holy_wars|E] are going, and more. $game_concept_fervor$ represents how fanatical most members of the $game_concept_faith$ are feeling currently, including the many common folk across the world.\n\nWhen your $game_concept_faith$'s $game_concept_fervor$ is high, it is easier to convert [counties|E] (using [convert_county|E]) to your $game_concept_faith$, and $game_concept_counties$ of your $game_concept_faith$ #EMP resist#! conversion to other $game_concept_faiths$.\n\nWhen $game_concept_fervor$ is low, however, $game_concept_rulers$ might decide to abandon their current $game_concept_faith$ in favor of another from the same [religion|E], spawning a [heresy|E]. \n\n#TUT Heretical $game_concept_rulers$ will convert along with their closest territory and vassals, and are free to spread their new $game_concept_faith$ in place of the old.#!"

 # "put the peasants in their place" + "Peasant Factions" — faction tutorial tip
 reactive_advice_protect_against_factions_2_desc:0 "Counties with a low [county_opinion|E] tend to join the [peasant_faction|E]. Unlike other factions, this Faction will rise up no matter if they have a chance of winning or not!\n\nSometimes, you simply have to put the commoners in their place...\n\n#TUT You should always keep an eye on Commoner Factions. If they strike while you're at war they can do significant damage to your [control|E].#!"

 # ── Party Baron ───────────────────────────────────────────────────────────────

 # "like a giddy peasant [GirlBoy]" — wedding happiness description
 party_baron.9003.desc_positive:0 "I cannot believe how lucky I am, to have this [party_baron.GetWomanMan] at my side. I never thought I would feel as happy as I did on my wedding day, like a giddy commoner [ROOT.Char.Custom('GirlBoy')]. And [party_baron.GetFirstName] seemed radiant.\n\nWhen [party_baron.GetSheHe] looks me in the eyes and says [party_baron.GetSheHe] can think of no greater joy than to be with me forever, I believe [party_baron.GetHerHim]."
