# UNVERIFIED-VANILLA: keys ported from v1 (CK3 1.19); the local session diffs them against 1.20.1.1
# Spec: docs/specs/reflavour_v2.md. County tier = Shoal (owner ruling 2026-10-20). One definition per key across
# localization/, replace/ included: county keys stay in eotg_county_term_l_english.yml. Held keys are listed in the spec.

 FACTION_PEASANT_REVOLT:0 "Commoner Revolt"
 FACTION_WINDOW_COUNTY_MEMBER_TT:0 "#S Faction Member#!\n#T Commoners from [FactionCountyMember.GetMember.GetNameNoTooltip]#!\n[faction_military_power|E] Contribution: [FactionCountyMember.CalcPower|%1V]\n#weak Contribution is based on the [county|E]'s [levies|E] and [county_opinion|E]#!\n\n#S Faction Commitment: [FactionCountyMember.CalcJoinScore|V0]#! #weak (leaves if less than [GetDefine('NFaction', 'COUNTY_LEAVE_SCORE_THRESHOLD')])#!\n[FactionCountyMember.CalcJoinBreakdown]\n\n#I Click to view Shoal#!"
 LV_FLAVOR:0 "Levies consist of commoner militias, ruffians, local sellswords, and destitute nobles equipped with motley tools and improvised weapons, their sheer numbers make up the bulk of most armies."
 event_window_widget_peasant_leader_tooltip:0 "Local Commoners are in a constant struggle against their overlords. As an [adventurer|E], you are just a bystander. However, if you wish, you can take action into your own hands. Decide who's right and who's wrong, choose a side and support it."
 event_window_widget_peasant_leader_tooltip_widget:0 "Reminder for how many [counties|E] you decided to support or control. If it comes down to a war, commoners from all supported Shoals will join your banners!"
 found_my_clone_desc_1:0 "I found a commoner who looked exactly like me and I beat [doppelganger.GetHerHim] to death"
 found_my_clone_desc_2:0 "I saw a commoner who looked exactly like a better version of me"
 found_my_clone_desc_second_perspective_1:0 "you found a commoner who looked exactly like you and you beat [doppelganger.GetHerHim] to death"
 found_my_clone_desc_second_perspective_2:0 "you saw a commoner who looked exactly like a better version of you"
 found_my_clone_desc_third_perspective_1:0 "[owner.GetName] found a commoner who looked exactly like [owner.GetHerHim] and [owner.GetSheHe] beat [doppelganger.GetHerHim] to death"
 found_my_clone_desc_third_perspective_2:0 "[owner.GetName] saw a commoner who looked exactly like a better version of [owner.GetHerHim]"
 offensive_war_desc_peasant:0 "I led a commoner revolt against [other_party.GetTitledFirstName]"
 offensive_war_desc_second_perspective_peasant:0 "you led a commoner revolt against [other_party.GetTitledFirstName]"
 offensive_war_desc_third_perspective_peasant:0 "[owner.GetFirstName] led a commoner revolt against [other_party.GetTitledFirstName]"
 defensive_war_desc_peasant:0 "A commoner revolt, led by [other_party.GetFirstName], rose up against me"
 defensive_war_desc_second_perspective_peasant:0 "A commoner revolt, led by [other_party.GetFirstName], rose up against you"
 defensive_war_desc_third_perspective_peasant:0 "A commoner revolt, led by [other_party.GetFirstName], rose up against [owner.GetFullName]"
