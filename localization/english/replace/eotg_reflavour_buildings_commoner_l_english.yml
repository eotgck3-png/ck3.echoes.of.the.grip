l_english:
# Vanilla-UI reflavour, ported from v1 (OLD PROJECT VERSION/localization/english/replace/eotg_buildings_commoner_l_english.yml).
# UNVERIFIED-VANILLA: keys ported from v1 (CK3 1.19); the local session diffs them against 1.20.1.1
# Spec: docs/specs/reflavour_v2.md. County tier = Shoal (owner ruling 2026-10-20). One definition per key across
# localization/, replace/ included: county keys stay in eotg_county_term_l_english.yml. Held keys are listed in the spec.

 building_type_temple_01_desc:0 "A place of worship ruled by the clergy, surrounded by a town of faithful commoners."
 building_city_04_desc:0 "This city is known far and wide for the bountiful opportunities that lie within, it is said that even the lowliest commoner can find fortune here. Houses line the streets for as far as the eye can see, with carts and animals busy transporting goods wherever you look."
 building_pastures_01_desc:0 "Pastures are used by local commoners to keep smaller animals, such as sheep or goats."
 building_pastures_02_desc:0 "Homesteads house commoner farmers, who grow grain and keep animals for their own use."
 building_farm_estates_01_desc:0 "Mansions house land-owning families, their staff, and the commoners who work their fields."
 building_farm_estates_04_desc:0 "The massive hundred-acre fields employ scores of commoners, and brings vast wealth upon the family who owns the land."
 building_curtain_walls_01_desc:0 "The first step for any respectable fortification is the erection of bastions and curtain walls. They do a decent job of keeping enemies and rioting commoners at bay."
 building_curtain_walls_03_desc:0 "Wall towers act as excellent vantage points, allowing our soldiers to snipe away at approaching armies safely. When not at war, they're excellent to gloat at commoners from."
 building_cereal_fields_02_desc:0 "The construction of more hamlets means that more commoners can be put to work in the fields, increasing the local production and taxation."
 building_cereal_fields_03_desc:0 "The erection of barns and larger storehouses allows commoners to preserve hay and straw, gives them a place to store their tools, and acts as an impromptu roof for travelling armies and vagabonds alike."
 building_cereal_fields_04_desc:0 "Larger farmsteads support larger commoner families. When families have space and means to grow, they will generate more children that can be put to toil in the fields."
 building_cereal_fields_07_desc:0 "By encouraging the commonfolk to till more and larger fields close to each other's lands, we can increase productivity, although encroaching on each other's lands might bring conflict between the farmers."
 building_type_camel_farms_01_desc:0 "These yards are dedicated to the building and refitting of dust-crawlers for use by the military, as well as by local commoners in their daily toil. Crawlers are flexible and sturdy machines, ideally suited to a harsh dead-zone climate."
 building_peat_quarries_06_desc:0 "The unique properties of the wetlands allow commoners to successfully grow many plants they wouldn't otherwise be able to, such as hemp or flax."
 building_outposts_05_desc:0 "Near each tower now lies a levying post. In times of muster, levied commoners can safely gather near where they can find both weapon and protection."
 building_watchtowers_04_desc:0 "The refined mudbrick keeps, while small, offer superior protection to more mundane watchtowers. In times of war, they can protect a host of commoners from raiders, and even contain a small granary for leaner times."
 building_monastic_schools_08_desc:0 "The cloister forms a solid barrier against the outside world, effectively separating the life of those within its walls from the commoners outside."
 building_type_horse_pastures_01_desc:0 "Anybody can wield a crude weapon and strike their fellow. Almost anybody can gather a crude-weapon-wielding commoner mob. But only from the delicate harmony of a well-tuned airframe, a skillful pilot, and a suitable gun, led by the finest of commanders, an unrivaled fighting force to sweep across a cluster can arise."
 building_royal_armory_03_desc:0 "A Royal Arsenal hosts and maintains a huge amount of weapons, enough to field uncountable commoner levies on short notice and to attract the best mercenaries in the land."
 building_archery_ranges_01_desc:0 "Everyone is welcome at the archery range, regardless of if you're wealthy or poor. The reason is twofold; commoners that can fire a bow are more useful in war, and experienced marksmen keep themselves in top shape when they can compete in tournaments."
 building_type_tax_assessor_01_desc:0 "Collecting money from the commonfolk is a "taxing" venture. By assigning offices to a cohort of tax-collecting officials, we are sure to get what's due!"
 building_tax_assessor_01_desc:0 "It is every commoner's duty to pay the crown a proportionate tax in coin or produce. Our tax assessors ensure that what they pay is sufficiently "proportionate" for our needs, and fortunately for us most commoners are illiterate."
 building_tax_assessor_03_desc:0 "While commoners might be easy to tax, the wealthier landholders are harder to coerce. By establishing a complex administrative web run by loyal magistrates, we can ensure that even the richest of our subjects pay their dues."
 building_leisure_palace_01_desc:0 "When the burdens of responsibility become too much (or an angry mob of commoners is storming the gates), there's no place like the rural, far-away chateau for some impromptu relaxation!"
 building_oath_poor_building_04_desc:0 "All through the land, the needy want for nought. Gracious accommodations house would-be vagrants, hospitals tend to the sick and elderly, and generous allowances are made for poor commoners."
