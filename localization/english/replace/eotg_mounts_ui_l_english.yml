 # ── Village modifiers → settlements ──────────────────────────────────────────
 village_destroyed_modifier:0 "Settlement Destroyed"
 village_destroyed_modifier_desc:0 "This holding is near a settlement that suffered significant damage after a Tournament's Melee rampaged through it."
 village_rebuilt_modifier:0 "Settlement Rebuilt"
