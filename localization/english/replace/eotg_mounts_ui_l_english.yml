 horse_archer_attribute:0 "Speeder Ace"
 accolade_horse_archer:0 "Speeder Ace"

 # ── Trait track ──────────────────────────────────────────────────────────────
 trait_track_horse:0 "The Wing"
 trait_track_horse_desc:0 "Pilot and airframe in perfect agreement, glorious and free against the open dark."

 # ── Chivalry → Valor ─────────────────────────────────────────────────────────
 # A martial lifestyle focus and its councillor task; shown in the lifestyle
 # tree and on the council screen.
 martial_chivalry_focus_short:0 "Valor"
