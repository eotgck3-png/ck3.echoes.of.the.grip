l_english:
 # ── Yearly Events — EotG Setting Overrides ────────────────────────────────────
 # Sources: yearly_events_l_english.yml, yearly_events_5_l_english.yml,
 #          bp1_james_yearly_events_l_english.yml, bp1_dan_yearly_l_english.yml,
 #          mpo_ariana_yearly_l_english.yml,
 #          yearly_events_sahara_l_english.yml,
 #          yearly_feud_l_english.yml (culture tradition events),
 #          story_cycles/hunt_mystical_animal_events_l_english.yml
 # Replaces: "peasant/peasantry" class references, "sin" used as a noun,
 #            "serf" as a class term, "exorcised" in a non-ritual context,
 #            "prayer" as a hardcoded standalone verb, modifier name overrides.
 # ─────────────────────────────────────────────────────────────────────────────

 # ── yearly_events_l_english ───────────────────────────────────────────────────

 # "every uppity peasant" — comet event
 yearly.0011.desc:0 "The appearance of a comet in the heavens causes all mortals to pause. What could this strange apparition mean, wandering across our skies so unexpectedly?\n\nWiser [ROOT.Char.GetWomenMen] than I have spent their lifetimes pondering less, but every commoner in [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip] seems to have their own ill-thought theory..."

 # "congealed peasant-gas" — cynical comet opinion option
 yearly.0011.cynical:0 "It's probably just atmospheric interference."

 # "make these peasants feel like kings and queens" — generosity event option
 yearly.0027.c:0 "I'll make these commoners feel like royalty"

 # "simple-minded peasants" — jester entertainment result
 yearly.0029.entertainment_jester_average:0 "The jester managed to make the atmosphere a bit lighter within the inn, but at the cost of some occasional awkward silences and jokes that went over the heads of simple-minded — and simply inebriated — commoners.\n\n"

 # ── yearly_events_5_l_english ─────────────────────────────────────────────────

 # "Ecstatic Peasantry" — event title
 yearly.8100.t:0 "Ecstatic Commonfolk"

 # "The peasants in the [county] are in a good mood" + "The peasants are praising"
 yearly.8100.desc:0 "The commoners in the [county.GetName] are in a good mood. The harvest is bountiful, the roads are safe, and the village elders are telling nonsensical stories of cows producing honey-laden milk and geese laying golden eggs.\n\nThe commoners are praising #emphasis me#! for their fortune, and have sent a delegation carrying gifts!"

 # "exorcised from my dreams" — metaphorical but uses religious ritual language
 yearly.5004.desc:0 "[scoped_ruler.GetFirstName] has finally granted me [scoped_ruler.GetHerHis] forgiveness, and with it, I have found peace once more. The ghost of [bickering_loser.GetFirstName] has been banished from my dreams once and for all."

 # ── bp1_james_yearly_events_l_english ────────────────────────────────────────

 # "The true sin would be" — metaphorical but uses religious moral framing
 bp1_yearly.7000.b:0 "The true waste would be letting this opportunity pass."

 # "pray [she/he] forgives me" — reclusive character destroying another's diary
 bp1_yearly.9002.c:0 "I'll destroy it and hope [bp1_yearly_9001_shy_kid.GetSheHe] forgives me."

 # "the real sin would be not sampling it all" — gluttonous cooking passion
 bp1_yearly.9006.desc.gluttonous:0 "share a passion for the countless flavors and textures this world has to offer us in the wonderful art that is cooking. The world holds so much wonderful food — not sampling it all would be a true waste!"

 # "A peasant beggar" + "this lowborn" — ruler meets their doppelganger
 bp1_yearly.9007.desc:0 "As I tour the streets of [ROOT.Char.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip], surrounded by my usual entourage of guards and courtiers, I see something which gives me cause to stop and gasp.\n\nA destitute beggar with nothing to protect [bp1_yearly_9007_doppelganger.GetHerselfHimself] from the elements but mud and rags stares back at me with desperate pleading eyes. I would have moved on, but there was something almost familiar about this poor soul.\n\nIt is then that a member of my procession points out that [bp1_yearly_9007_doppelganger.GetSheHe] is the spitting image of me! It is harrowing to see my mirror image wallowing in filth, but perhaps I can do something to correct this cosmic injustice."

 # "prayer and service from my wonderful [chaplain]" — court chaplain event
 bp1_yearly.9043.desc:0 "It's another lovely day of counsel and service from my wonderful [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName], and as I prepare to leave, [bp1_yearly_9043_chaplain.GetName] stops in my way. [bp1_yearly_9043_chaplain.GetSheHe|U] waits until everyone else is gone and then leans in close to my ear.\n\n"My [ROOT.Char.GetTitleAsNameNoTooltip] I must tell you, I am no stranger to life's pleasures. No form of perversion is too deprived for me: animal, vegetable, or mineral. Frankly, I'll do anything to anything, and there's no joy in this life finer than consuming the flesh of young 'uns. You've not lived until you've tasted human flesh, my [ROOT.Char.GetTitleAsNameNoTooltip], and I'd love nothing more than to have you for dinner this evening!"\n\nSurprised doesn't begin to describe what I feel to hear this, but what in the world am I meant to say?"

 # "I pray many more glories to come" — old friends swapping war stories
 bp1_yearly.9050.desc:0 "One of [bp1_yearly_9050_friend.GetNamePossessive] favorite things to do with me is to sit by the fire and exchange war stories on a beautiful night, and this night we have been reminiscing from sun until moon until sun again!\n\nI begin by telling of the time when [bp1_yearly_9050_my_memory.GetDescription], prompting [bp1_yearly_9050_friend.GetFirstNameNoTooltip] to clasp [bp1_yearly_9050_friend.GetHerHis] hands and laugh.\n\n"A fine tale! Though truly, I tell you friend, there's no event more glorious in all of history than when [bp1_yearly_9050_friend_memory.GetDescription]! Ha! What glorious days we've had, and I hope for many more glories to come!""

 # "Living as a Peasant" modifier — ruler escaping court to live among common folk
 bp1_living_as_peasant_modifier:0 "Living Among Commoners"
 bp1_living_as_peasant_modifier_desc:0 "This character is spending extensive amounts of time living among the local populace to escape the pressures of rulership."

 # ── mpo_ariana_yearly_l_english ───────────────────────────────────────────────

 # "Let the peasants drink!" — festival event option
 mpo_events_ariana.0030.ignore:0 "Let the commoners drink!"

 # "Pleased Peasants" modifier — county modifier for happy common folk
 buzzed_peasants_county_modifier:0 "Content Commoners"
 buzzed_peasants_county_modifier_desc:0 "The common folk of this county are quite pleased with the recent festivities."

 # ── yearly_events_sahara_l_english ────────────────────────────────────────────

 # "even the peasants are familiar with the sound of clinking gold"
 yearly_saharan.0003.desc:0 "and it seems that they have integrated fairly well into the existing community.\n\nAs a result, trade is flooding through the area, revenues are at an all-time high, and even the commoners are familiar with the sound of clinking gold!"

 # ── bp1_dan_yearly_l_english ─────────────────────────────────────────────────

 # "The peasant hanging out of the window screams before fleeing"
 bp1_yearly.7100.desc:0 "One moment I was enjoying a nice walk in the sunshine around the [owned_county.GetName] and the next I am covered in excrement and wallowing in the mud. Once I have furiously wiped the excreta from my [ROOT.Char.Custom('EyeEyes')], I find the culprit with ease.\n\n\"[potential_nemesis.GetTitledFirstName] sends [potential_nemesis.GetHerHis] regards!\" The commoner hanging out of the window screams before fleeing the scene.\n\nPathetically, I try washing one article of clothing I particularly treasure in a nearby stream, but it's clear that it is beyond saving."

 # "fashion of peasantry from three hundred years ago"
 bp1_yearly.9039.desc:0 "[bp1_yearly_9037_guardian.GetName] seems just as shocked and horrified as I am to see this body in the bog, but [bp1_yearly_9037_guardian.GetHerHis] look of horror soon melts into one of fascination.\n\n\"My [ROOT.Char.Custom('GirlBoy')], do you recognize these clothes? This is undoubtedly fashion of commonfolk from three hundred years ago! There's no doubt about it, this body has been preserved like none I've ever seen before! Why, it's a miracle from [bp1_yearly_9037_guardian.GetFaith.HighGodName|U]! Of that there is no doubt! Allow me to collect these bones and make a fine gift for you.\"\n\n[bp1_yearly_9037_guardian.GetFaith.HighGodName|U] seems to have a strange way of showing 'miracles', but if [bp1_yearly_9037_guardian.GetNameNoTooltip] says it's so, then it must be."

 # ── hunt_mystical_animal_events_l_english ────────────────────────────────────

 # "What about all the peasants who litter the [terrain]?"
 hunt_mystical_animal.1008.desc:0 "As the days pass I hear nothing about the [ROOT.Char.Custom('GetLegendaryColor')] [ROOT.Char.Custom('GetAnimalType')], and I grow restless...\n\nSurely someone must have seen it? What about all the commoners who litter the [legendary_county.GetCountyData.GetCapital.Custom('GetTerrainTypePlural')]? Maybe I should appeal for their assistance..."

 # "A local peasant has sent you a gift"
 hunt_mystical_animal.9002.desc:0 "\"[ROOT.Char.Custom('FormOfAddressForLiege')|U]!\" [m_hunt.GetTitledFirstName] broaches hesitantly, \"A local commoner has sent you a gift. [dummy_gender.GetSheHe|U] claims this [activity.Custom('GetLegendaryColor')] coloring is natural, but I have never seen anything like it!\"\n\nWith rising trepidation I approach the bundle — and there it lies: the [activity.Custom('GetLegendaryColor')] [activity.Custom('GetAnimalType')] I have spent years hunting."

 # ── yearly_feud_l_english (culture tradition events) ─────────────────────────

 # "the local peasants appear content" — resolving a vassal conflict
 culture_tradition_events.2001.desc:0 "A recent conflict between my vassal, [targeted_vassal.GetTitledFirstName] and [targeted_vassal.GetHerHis] own subjects have necessitated a sudden visit to [targeted_vassal.GetCapitalLocation.GetTitle.GetNameNoTierNoTooltip]. My mere presence seemingly resolved the matter and the local commoners appear content that their complaints have been heard by me.\n\nAs I wander empty corridors late at night I ponder my disappointing relationship with my own liege, [ROOT.Char.GetLiege.GetTitledFirstName]. [ROOT.Char.GetLiege.GetSheHe|U] has always been quick to demand my obedience but rarely has [ROOT.Char.GetLiege.GetSheHe] come to my aid like I just did for [targeted_vassal.GetTitledFirstNameNoTooltip]."
