 RONIN_GLOSS:0 "#bold Rōnin#!, literally #EMP wave-person#!, originated as a term in the late Nara period, referring to a bonded worker who had fled their master's land. It later came to refer to samurai who had no master, either due to their death or the loss of their favour or status. Being unemployed, with few skills beyond fighting, many Rōnin resorted to crime in order to survive."
