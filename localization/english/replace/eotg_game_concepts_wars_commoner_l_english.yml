l_english:
 # ── Game Concepts, Wars & Misc — EotG Setting Overrides ──────────────────────
 # Sources: game_concepts_l_english.yml,
 #          council_tasks_l_english.yml,
 #          core_l_english.yml,
 #          wars_l_english.yml,
 #          schemes_l_english.yml
 # Replaces: "peasant/peasants/peasantry" → "commoner/commoners/commonfolk".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── Game Concepts: Levies ─────────────────────────────────────────────────────

 # "(peasant militias, ruffians..."
 game_concept_levies_desc:0 "The bulk of most [armies|E] is made up of $game_concept_levies$.\n\nEach [holding|E] provides a set number of $game_concept_levies$ to their [holder|E]. [vassals|E] in turn provide a part of their $game_concept_levies$ to their [liege|E].\n\n$game_concept_levies$ are made up of mostly poorly-armed fighters #weak (commoner militias, ruffians, local sellswords, destitute nobles, minor landowners, etc.)#! and are considered their own unit type.\n\nA $game_concept_levy$ has [GetDefine('NCombat', 'LEVY_ATTACK')|0] [damage|E] and [GetDefine('NCombat', 'LEVY_TOUGHNESS')|0] [toughness|E]. The other type of [soldiers|E] in the game are [men_at_arms|E] — expensive trained professionals."

 # ── Game Concepts: Factions ───────────────────────────────────────────────────

 # "such as the Peasant Faction"
 game_concept_faction_desc:0 "A $game_concept_faction$ is a group of [vassals|E] with common political interests. The local population of [counties|E] can also join certain types of Factions, such as the Commoner Faction.\n\nFactions become dangerous once their [faction_discontent|E] reaches a certain point, at which time they will issue an ultimatum.\n\nIf the [liege|E] does not comply, the Faction will rise up in revolt, sparking a [civil_war|E]. If the Faction dissolves, the Liege must have at least [GetDefine( 'NFaction', 'MIN_WARSCORE_FOR_VICTORY_ON_FACTION_INVALIDATION' )|V0] [war_score|E] to win the War."

 # "Peasant Militia" — concept name
 game_concept_peasant_militia:0 "Commoner Militia"

 # "Peasant Militias" — concept name (plural)
 game_concept_peasant_militias:0 "Commoner Militias"

 # "Peasant Militias are [men_at_arms]" (×3 instances)
 game_concept_peasant_militia_desc:0 "Commoner Militias are [men_at_arms|E] who are armed with pitchforks and spears.\n\nWhile each kind of Militia is unique, they generally [counter|E] [heavy_cavalry|E] and [light_cavalry|E], and are in turn Countered by [heavy_infantry|E].\n\nCommoner Militias are strong in mountainous and fertile [terrain|E]."

 # ── Game Concepts: Special Troops ────────────────────────────────────────────

 # "ambitious peasantry"
 game_concept_special_troops_desc:0 "$game_concept_special_troops$ are not like regular [armies|E], as they are not raised from a [holding|E]. $game_concept_special_troops$ can be gained through Events, and represent various things such as retinues, ravenous hordes and ambitious commonfolk.\n\nNormally they do not cost maintenance, and do not reinforce. Use them wisely if you have them.\n\nSeveral historical [rulers|E] start with $game_concept_special_troops$."

 # ── Game Concepts: County Control ────────────────────────────────────────────

 # "[Concept('peasant_faction', 'Peasant Uprisings')]"
 game_concept_county_control_desc:0 "$game_concept_county_control$ measures the grip that the government has on the population of a [county|E]. It is crucial especially for collecting [taxes|E] from the [holdings|E].\n\nWhen a County changes hands through [war|E], Control goes down drastically, which is a good reason to vassalize the current [holder|E] instead (if the [casus_belli|E] allows). County Control can also be damaged by [sieges|E] and [Concept( 'peasant_faction', 'Commoner Uprisings' )|E].\n\nLow Control may lead to [county_corruption|E], and the primary way of increasing Control is a [councillor_task|E] available to your [marshal|E]."

 # ── Game Concepts: Grudge ─────────────────────────────────────────────────────

 # "a king leaving a peasant in their dungeon"
 game_concept_grudge_desc:0 "A $game_concept_grudge$ is a $game_concept_relation$ indicating unilateral hatred and resentment. The target of a grudge does not return the feelings and may not even know.\n\n#WEAK $game_concept_grudges$ are most commonly formed when one [character|E] does something horrible to another without even realizing they exist — for instance, a king leaving a commoner in their [dungeon|E] for forty years.#!"

 # ── Game Concepts: Peasant Faction ───────────────────────────────────────────

 # "Peasant Factions" — concept plural name
 game_concept_peasant_factions:0 "Commoner Factions"

 # "peasants are generally both optimistic and illiterate" + "Peasant Revolts"
 game_concept_peasant_faction_desc:0 "The $game_concept_peasant_faction$ is populated by [counties|E] with low [county_opinion|E]. Unlike other [factions|E], this one will always revolt even if [faction_military_power|E] is low, as commoners are generally both optimistic and illiterate... Successful Commoner Revolts will significantly lower Control in your [realm|E]."

 # "Escalated Peasant Factions" — concept plural name
 game_concept_escalated_peasant_factions:0 "Escalated Commoner Factions"

 # ── Council Tasks ─────────────────────────────────────────────────────────────

 # "Subdues Local Peasantry" — task effect bullet
 task_increase_control_acclaimed_knight_subdues_peasantry:0 "\n$EFFECT_LIST_BULLET$#P [acclaimed_knight] Subdues Local Commonfolk#!"

 # ── Core ──────────────────────────────────────────────────────────────────────

 # "Peasant Uprising" — event troops label
 peasant_faction_event_troops:0 "Commoner Uprising"

 # ── Wars ──────────────────────────────────────────────────────────────────────

 # "Peasant Uprising" — war name
 PEASANT_WAR_NAME:0 "Commoner Uprising"

 # "Peasant War" — war type name
 peasant_war:0 "Commoner War"

 # ── Schemes ───────────────────────────────────────────────────────────────────

 # "ten wandering peasants"
 scheme_apa_positive_0591_modifier_desc:0 "The take from a single rich victim is worth that of ten wandering commoners."

 # "many peasants on scutage"
 scheme_apa_positive_1061_modifier_desc:0 "Affairs amongst the noblesse aren't something that many commoners on scutage or hired mercenaries will stick their necks out to prove."

 # "a lying peasant"
 scheme_apa_negative_5421_modifier_desc:0 "A misremembered tidbit or a lying commoner can quickly waste hours of tracking."