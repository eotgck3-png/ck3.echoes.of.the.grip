\ufeffl_english:

 # ── TERRAIN / ENVIRONMENTAL ───────────────────────────────────────────────────

 tradition_seafaring_name:0 "Voidfarers"
 tradition_seafaring_desc:0 "Generations spent navigating unstable voidlanes and isolated transit corridors have made these people exceptionally skilled at surviving long-distance travel between scattered systems."

 tradition_maritime_mercantilism_name:0 "Voidlane Commerce"
 tradition_maritime_mercantilism_desc:0 "Trade flows through fortified transit routes, relay nexuses, and protected void corridors linking distant worlds across the clusters."

 tradition_forest_fighters_name:0 "Debris Field Navigators"
 tradition_forest_fighters_desc:0 "These warriors are trained to maneuver through dense wreck fields, shattered orbital graveyards, and hazardous debris regions where conventional armies lose cohesion."

 tradition_jungle_dwellers_name:0 "Dense Drift Adapted"
 tradition_jungle_dwellers_desc:0 "Life within unstable drift regions and heavily cluttered transit sectors forged a culture accustomed to confusion, isolation, and environmental unpredictability."

 tradition_hill_dwellers_name:0 "Belt Settlers"
 tradition_hill_dwellers_desc:0 "Generations raised among unstable asteroid regions and fractured resource belts developed exceptional resilience and adaptability."

 tradition_mountain_homes_name:0 "Fortified Sector Dwellers"
 tradition_mountain_homes_desc:0 "Isolated defensive sectors and heavily fortified transit regions shaped a people accustomed to enduring sieges and surviving in difficult environments."

 tradition_dryland_dwellers_name:0 "Sparse Zone Survivors"
 tradition_dryland_dwellers_desc:0 "Life in resource-poor sectors taught these people how to survive scarcity, environmental instability, and logistical isolation."

 tradition_winter_warriors_name:0 "Cryozone Veterans"
 tradition_winter_warriors_desc:0 "Frozen systems, failing thermal infrastructure, and dead frontier regions hardened these people into survivors capable of enduring brutal conditions."

 tradition_warriors_of_the_dry_name:0 "Expanse Raiders"
 tradition_warriors_of_the_dry_desc:0 "These warriors specialize in operating across sparse frontier expanses where supply lines collapse and only disciplined mobility ensures survival."

 tradition_fishermen_name:0 "Void Trawlers"
 tradition_fishermen_desc:0 "Precision salvage crews and debris harvesters developed extraordinary coordination while extracting resources from dangerous void regions."

 # ── ECONOMIC ─────────────────────────────────────────────────────────────────

 tradition_artisans_name:0 "Systems Engineers"
 tradition_artisans_desc:0 "Technical expertise and systems maintenance are treated as essential cultural responsibilities necessary for civilization's survival."

 tradition_metal_craftsmanship_name:0 "Alloy Forgers"
 tradition_metal_craftsmanship_desc:0 "Industrial fabrication and structural metallurgy remain deeply embedded traditions passed down through generations of skilled laborers."

 tradition_hard_working_name:0 "Industrial Discipline"
 tradition_hard_working_desc:0 "Labor efficiency, productive output, and disciplined work structures are viewed as necessary safeguards against collapse."

 tradition_frugal_armorsmiths_name:0 "Resource Reclaimers"
 tradition_frugal_armorsmiths_desc:0 "Nothing is wasted. Salvaged materials, recovered technology, and reclaimed infrastructure are carefully repurposed for survival."

 tradition_caravaneers_name:0 "Transit Enclaves"
 tradition_caravaneers_desc:0 "Protected transit hubs and secure relay stations provide refuge, commerce, and logistical stability across dangerous regions of space."

 tradition_agrarian_name:0 "Hydroponic Foundations"
 tradition_agrarian_desc:0 "Maintaining stable food production systems is considered a sacred responsibility necessary for sustaining civilization across isolated sectors."

 tradition_pastoralists_name:0 "Nutrient Syndicates"
 tradition_pastoralists_desc:0 "Mobile agricultural operations and nutrient-production convoys allow these people to survive in regions where conventional food systems cannot endure."

 # ── SOCIAL / GOVERNANCE ──────────────────────────────────────────────────────

 tradition_legalistic_name:0 "Codified Governance"
 tradition_legalistic_desc:0 "Stability depends on written law, procedural continuity, and administrative systems capable of surviving political upheaval."

 tradition_republican_legacy_name:0 "Civic Directorate"
 tradition_republican_legacy_desc:0 "Civic institutions, public administration, and collective governance remain central to this culture's political identity."

 tradition_collective_lands_name:0 "Communal Infrastructure"
 tradition_collective_lands_desc:0 "Shared labor obligations and cooperative maintenance of infrastructure are considered necessary duties owed to the broader community."

 tradition_talent_acquisition_name:0 "Merit Ascension"
 tradition_talent_acquisition_desc:0 "Ability and competence are valued above inherited status when determining leadership and administrative responsibility."

 tradition_court_eunuchs_name:0 "Chamber Custodians"
 tradition_court_eunuchs_desc:0 "Isolated administrative castes safeguard institutional continuity by separating governance from dynastic ambition."

 tradition_fp2_ritualised_friendship_name:0 "Oath Networks"
 tradition_fp2_ritualised_friendship_desc:0 "Formalized bonds of loyalty and obligation structure both political alliances and personal relationships across vast distances."

 tradition_parochialism_name:0 "Sector Isolationism"
 tradition_parochialism_desc:0 "Loyalty to local sectors and regional communities outweighs broader political or cultural unity."

 # ── SPIRITUAL / IDEOLOGICAL ──────────────────────────────────────────────────

 tradition_hereditary_hierarchy_name:0 "Lineage Reverence"
 tradition_hereditary_hierarchy_desc:0 "The deeds and judgments of previous generations continue to shape political authority and cultural identity."

 tradition_mystical_ancestors_name:0 "Archive Reverence"
 tradition_mystical_ancestors_desc:0 "Preserved records, ancestral archives, and historical memory are treated with near-sacred importance."

 tradition_zealous_people_name:0 "Doctrinal Adherents"
 tradition_zealous_people_desc:0 "Ideological unity and unwavering adherence to doctrine are considered essential safeguards against societal collapse."

 tradition_warrior_monks_name:0 "Sanctified Wardens"
 tradition_warrior_monks_desc:0 "Military authority and ideological duty are inseparable responsibilities entrusted to disciplined guardians of the people."

 # ── MARTIAL ──────────────────────────────────────────────────────────────────

 tradition_stalwart_defenders_name:0 "Bulkhead Defenders"
 tradition_stalwart_defenders_desc:0 "Defensive warfare within fortified corridors, hardened installations, and constrained battle zones defines this culture's military traditions."

 tradition_castle_keepers_name:0 "Bastion Keepers"
 tradition_castle_keepers_desc:0 "Massive defensive strongholds and fortified transit sectors are viewed as the backbone of civilization itself."

 tradition_by_the_sword_name:0 "Through Force Alone"
 tradition_by_the_sword_desc:0 "Political legitimacy is earned through strength, discipline, and the willingness to impose order through force."

 tradition_horse_lords_name:0 "Rapid Assault Corps"
 tradition_horse_lords_desc:0 "Highly mobile strike formations dominate this culture's military doctrine, allowing rapid assaults across vast operational distances."

 tradition_lords_of_the_elephant_name:0 "Siege Behemoths"
 tradition_lords_of_the_elephant_desc:0 "Massive assault platforms and heavily armored breakthrough formations symbolize military prestige and battlefield supremacy."

 tradition_practiced_pirates_name:0 "Raid Fleets"
 tradition_practiced_pirates_desc:0 "Organized raiding operations, salvage strikes, and aggressive void assaults are accepted methods of acquiring wealth and influence."

 # ── ADDITIONAL ───────────────────────────────────────────────────────────────

 tradition_philosopher_culture_name:0 "Archive Tradition"
 tradition_philosopher_culture_desc:0 "The preservation of knowledge, historical continuity, and intellectual inquiry are considered essential defenses against civilizational decline."

 tradition_reverence_for_veterans_name:0 "Survivor Lineages"
 tradition_reverence_for_veterans_desc:0 "Those who endured catastrophe and conflict are honored as living reminders of the sacrifices required for survival."

 tradition_esteemed_hospitality_name:0 "Port Sanctuary Codes"
 tradition_esteemed_hospitality_desc:0 "Longstanding docking customs ensure shelter and protection for travelers crossing dangerous transit regions."

 tradition_hunters_name:0 "Salvage Pursuers"
 tradition_hunters_desc:0 "Skilled pursuit teams track fugitives, drifting wreckage, and hidden resource caches across unstable sectors."

 tradition_hit_and_run_name:0 "Stationbreaker Doctrine"
 tradition_hit_and_run_desc:0 "These warriors specialize in disrupting logistics, destabilizing navigation routes, and creating confusion within enemy operational zones."
