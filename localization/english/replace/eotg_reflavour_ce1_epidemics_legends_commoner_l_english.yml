l_english:
# Vanilla-UI reflavour, ported from v1 (OLD PROJECT VERSION/localization/english/replace/eotg_ce1_epidemics_legends_commoner_l_english.yml).
# UNVERIFIED-VANILLA: keys ported from v1 (CK3 1.19); the local session diffs them against 1.20.1.1
# Spec: docs/specs/reflavour_v2.md. County tier = Shoal (owner ruling 2026-10-20). One definition per key across
# localization/, replace/ included: county keys stay in eotg_county_term_l_english.yml. Held keys are listed in the spec.

 ce1_legendary_performance_desc:0 "This character recently put on a dramatic performance of their legend. While it failed to reach its intended audience, the commonfolk seemed very impressed by it."
 epidemic_pressed_levies_desc:0 "This province is pressing commoners into their Men-At-Arms regiments."
 ce1_gone_dancing_desc:0 "This character has joined the commoners in their never-ending dance."
 legend_chapter_injured_evangelising_bad:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] was preaching heresy among the commoners and was injured by a group of true-believers."
 legend_commoners_celebrated_desc:0 "This tale focuses on the hard-working commoners, bolstering their spirits."
 legend_peasant_emperor:0 "From Commoner to Basileus"
 legend_chapter_motivation_peasant:0 "When a tearful, desperate, poor commoner requested an audience with [ROOT.Legend.GetProtagonist.GetHerHim], the pious [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] could not leave his pleas unattended and quickly set out on an adventure."
 legend_chapter_battle_maiden_kiss:0 "Upon encountering a helpless, but truly striking, commoner amidst the melee in battle, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] swooped in to carry them away. Our hero was promptly rewarded with a kiss, as truly befits a [ROOT.Legend.GetProtagonist.GetWomanMan] of such gallantry!"
 legend_chronicle_conclusion_exotic_backstory:0 "Much had changed since [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] had arrived. Where once commoners rolled around in squalor and barbarians bled the land dry, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] had spread the light of civilization. Though there were many rocks in [ROOT.Legend.GetProtagonist.GetHerHis] path, he collected them all as means to build a new [ROOT.Legend.GetProperty( 'location' ).GetFlagName]. All across the realm, babes are named for [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] and the masses sing out in grateful chorus for the stranger from [ROOT.Legend.GetProperty( 'location' ).GetFlagName] who built their great port."
