l_english:
 # ── CE1 Epidemics & Legends — EotG Setting Overrides ─────────────────────────
 # Sources: ce1_epidemic_events_l_english.yml,
 #          ce1_epidemic_physician_events_l_english.yml,
 #          ce1_modifiers_l_english.yml,
 #          ce1_legend_spread_events_l_english.yml,
 #          legends_l_english.yml
 # Replaces: "peasant/peasants/peasantry" → "commoner/commoners/commonfolk".
 # ─────────────────────────────────────────────────────────────────────────────

 # ── CE1: Epidemic Events ──────────────────────────────────────────────────────

 # ""They angered the heavens," peasants say"
 epidemic_events.1060.desc.mid.faith:0 "The [faith_to_blame.GetAdherentNamePlural] — long tolerated — are now seen as a curse. "They angered the heavens," commoners say, "and now we suffer for it." Their temples are defaced. Their prayers turned against them."

 # "Have the peasants set the town ablaze?"
 epidemic_events.1061.desc.intro:0 "I wake to the sky glowing orange and smoke choking the air. Have the commoners set the town ablaze?\n\n"

 # "No words will sway the peasantry"
 epidemic_events.1066.desc:0 "No words will sway the commonfolk — they blame the [faith_blamed.GetAdherentNamePlural] for [epidemic_scope.GetName]. Their traders are harassed, their homes defaced. Many have fled, and trade has withered.\n\nWorse still, in some villages, they are being hunted.\n\nIf this persecution continues, my realm may bleed itself dry — not from plague, but from fear."

 # "the peasantry there has been insistent on blaming"
 epidemic_events.1067.desc:0 "As [epidemic_scope.GetName] ravages [bigoted_ruler_that_everyone_hates.GetNamePossessive] realm, the commonfolk there has been insistent on blaming [faith_blamed.GetAdherentNamePlural]. This problem has become so widespread that many have even begun fleeing [bigoted_ruler_that_everyone_hates.GetPrimaryTitle.GetNameNoTierNoTooltip|U] and coming to my lands."

 # "half of the peasant population have been infected"
 epidemic_events.1100.desc.mid2.major:0 "At least half of the commoner population have been infected, and it's only a matter of time until it spreads to the nobility."

 # "Those poor sick peasants..."
 epidemic_events.1100.a.compassionate:0 "Those poor sick commoners..."

 # "only peasants and plague"
 epidemic_events.2003.desc:0 ""Our soldiers fall without a fight. [epidemic_scope.GetName|U] has taken more than any blade."\n\n[marshal.GetName] speaks harshly, but he's right. From [first_epidemic_province.GetName] to [second_epidemic_province.GetName], the barracks lie empty. There are no warriors left — only commoners and plague."

 # "Drag peasants from the fields if we must."
 epidemic_events.2003.b:0 "Drag commoners from the fields if we must."

 # "A peasant writhes in my courtyard"
 epidemic_events.2006.desc:0 "A commoner writhes in my courtyard, feet pounding the earth in a ceaseless, maddening rhythm.\n\n"Forgive [dance_victim.GetHerHim], my liege," says an onlooker. "[dance_victim.GetFirstName] has danced for days without rest — others have even joined [dance_victim.GetHerHim]! [dance_victim.GetSheHe|U] won't stop."\n\nThe woman moans, [dance_victim.GetHerHim] face contorting with pain and joy. Madness, or something worse, grips [dance_victim.GetHerHim]."

 # "the peasant who throws [peasant.GetHerselfHimself] before my horse"
 epidemic_events.5003.desc:0 "Mud and misery cling to the streets of [location.GetName] — and to the commoner who throws [peasant.GetHerselfHimself] before my horse, clutching a frail child.\n\n"My [ROOT.Char.Custom('FormOfAddressForLiege')], please," [peasant.GetSheHe] begs. "[child.GetSheHe|U] is so ill. But your royal touch could heal [child.GetHerHim]..."\n\nThe rain drums down. The child sways."

 # "The peasants believing a royal's touch heals"
 epidemic_events.5003.b.tt:0 "The commoners believing a royal's touch heals has its benefits and drawbacks..."

 # "a flood of peasants surges in"
 epidemic_events.5004.desc:0 "A roar, a crash — the throne room doors burst open, and a flood of commoners surges in. Old, young, sick, scared — all eyes are on me.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U]," one of them pleads, "protect us from [epidemic_scope.GetName]. You must."\n\nMy guards stand ready, awaiting my word."

 # ── CE1: Physician Epidemic Events ───────────────────────────────────────────

 # "The peasants, already weak from the ravages of disease"
 physician_epidemic_events.1024.desc:0 "As well as taking a tremendous toll on the economy, [physician.GetNamePossessive] treatments have lead to countless lives being lost. The commoners, already weak from the ravages of disease, couldn't withstand the onslaught of bloodletting and leeches. This loss of life seems to have brought with it an increase in spread of the disease, as the miasma clings to the corpses and infests the lungs of the healthy."

 # ── CE1: Modifiers ────────────────────────────────────────────────────────────

 # "the peasantry seemed very impressed" — legendary performance modifier
 ce1_legendary_performance_desc:0 "This character recently put on a dramatic performance of their legend. While it failed to reach its intended audience, the commonfolk seemed very impressed by it."

 # "pressing peasants into their Men-At-Arms regiments"
 epidemic_pressed_levies_desc:0 "This province is pressing commoners into their Men-At-Arms regiments."

 # "joined the peasants in their never-ending dance"
 ce1_gone_dancing_desc:0 "This character has joined the commoners in their never-ending dance."

 # ── CE1: Legend Spread Events ─────────────────────────────────────────────────

 # "attending that peasant's desperate pleas?"
 legend_spread_events.0040.desc.outro:0 "attending that commoner's desperate pleas?" [chronicler.GetSheHe] says, with an eloquent wink."

 # ""Would #EMP I#! ever listen to a peasant?""
 legend_spread_events.0040.a:0 ""Would #EMP I#! ever listen to a commoner?""

 # "every peasant in this realm will believe it a lie"
 legend_spread_events.0060.desc.outro:0 "legend... [bad_vassal.GetTitledFirstName] has been heard doubting it, the court gossip has started to echo [bad_vassal.GetHerHim]."\n\n"If you don't stop it in time, I'm afraid every commoner in this realm will believe it a lie.""

 # "a lost and confused but truly beautiful peasant, wandering the battlefield"
 legend_spread_events.5250.desc:0 ""[ROOT.Char.Custom('FormOfAddressForLiege')|U]! Oh my [ROOT.Char.GetLadyLord]!" [chronicler.GetFirstNamePossessive] passionate beseeching gives me pause. "I just heard tell of your romantic travails on the field of battle! A lost and confused but truly beautiful commoner, wandering the battlefield, and #EMP you#! saved [ROOT.Char.Custom('GetHerHimOpposite')]!"\n\nIt is clear [chronicler.GetFirstNameNoTooltip] will not be dissuaded from this particular line of enquiry."

 # "even the peasantry are fat with the abundance of the land"
 legend_spread_events.8120.desc:0 "I am given courteous greetings by [chronicler.Custom2('MyCharacterIntroduction', ROOT.Char)] who seems to be abuzz with excitement.\n\n[chronicler.GetSheHe|U] tells me of a mystical land known simply as "[distant_title.GetBaseNameNoTooltip|U]", and [chronicler.GetSheHe] unfurls a map to this wonderful land in front of me. [chronicler.GetSheHe|U] tells me that the rivers run with milk and honey, and even the commonfolk are fat with the abundance of the land. Though usually I would never venture so far, tales of my heroic journey would certainly have an effect on [legend.GetName]!"

 # "[ROOT] was preaching heresy among the peasants" — chapter description
 legend_chapter_injured_evangelising_bad:0 "[ROOT.Legend.GetProtagonist.GetNameNoTooltip|U] was preaching heresy among the commoners and was injured by a group of true-believers."

 # "This tale focuses on the hard-working peasants" — commoners log desc
 legend_commoners_celebrated_desc:0 "This tale focuses on the hard-working commoners, bolstering their spirits."

 # ── CE1: Legends ──────────────────────────────────────────────────────────────

 # "From Peasant to Basileus" — legend name
 legend_peasant_emperor:0 "From Commoner to Basileus"

 # "born to peasant farmers"
 legend_peasant_emperor_desc:0 "Basil was born to common farmers and entered the employ of the Emperor before marrying his daughter and ascending to the rank of Basileus himself."

 # "began life as a mere peasant in the village"
 legend_premysl_desc:0 "Our ancestor began life as a mere commoner in the village of Stadice, but he soon caught the eye of Libuše and married her to become Prince of the Czechs."

 # "a tearful, desperate, poor peasant requested an audience"
 legend_chapter_motivation_peasant:0 "When a tearful, desperate, poor commoner requested an audience with [ROOT.Legend.GetProtagonist.GetHerHim], the pious [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] could not leave his pleas unattended and quickly set out on an adventure."

 # "a helpless — but truly striking — peasant amidst the melee"
 legend_chapter_battle_maiden_kiss:0 "Upon encountering a helpless — but truly striking — commoner amidst the melee in battle, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip|U] swooped in to carry them away. Our hero was promptly rewarded with a kiss, as truly befits a [ROOT.Legend.GetProtagonist.GetWomanMan] of such gallantry!"

 # "Where once peasants rolled around in squalor"
 legend_chronicle_conclusion_exotic_backstory:0 "Much had changed since [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] had arrived. Where once commoners rolled around in squalor and barbarians bled the land dry, [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] had spread the light of civilization. Though there were many rocks in [ROOT.Legend.GetProtagonist.GetHerHis] path, he collected them all as means to build a new [ROOT.Legend.GetProperty( 'location' ).GetFlagName]. All across the realm, babes are named for [ROOT.Legend.GetProtagonist.GetFirstNameNoTooltip] and the masses sing out in grateful chorus for the stranger from [ROOT.Legend.GetProperty( 'location' ).GetFlagName] who built their great city."

 # "what [culture] peasants gurgle about" — dismissal option
 legend_events.0020.c:0 "A [ROOT.Char.GetCulture.GetPrefixNoTooltip] ruler does not care for what [seed_presenter.GetCulture.GetCollectiveNounNoTooltip] commoners gurgle about."