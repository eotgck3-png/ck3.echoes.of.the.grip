\ufeffl_english:

 # ── HERITAGES ──────────────────────────────────────────────────────────────

 eotg_heritage_elf:0 "Ancient Kindred"
 eotg_heritage_elf_desc:0 "The surviving lineages of a people whose civilization predates the Grip itself — scattered across the clusters but bound by long memory and cultural continuity."

 eotg_heritage_goblin:0 "Scrap Clans"
 eotg_heritage_goblin_desc:0 "Opportunistic and adaptable peoples who built their societies from salvage, trade, and aggressive mobility across unstable regions of the clusters."

 eotg_heritage_ogre:0 "Builder Clans"
 eotg_heritage_ogre_desc:0 "Powerful and industrious peoples whose cultural identity is inseparable from construction, fabrication, and the maintenance of civilization's physical infrastructure."

 eotg_heritage_ratfolk:0 "Warren Kin"
 eotg_heritage_ratfolk_desc:0 "Highly organized peoples who survived post-collapse conditions through collective discipline, tight community bonds, and adaptive institutional structures."

 eotg_heritage_xeric:0 "Xeric Sphere"
 eotg_heritage_xeric_desc:0 "Survivors of the catastrophic flooding and ecological collapse of the Xerxes system — pragmatic, adaptive, and shaped by generations of displacement."

 eotg_heritage_helix:0 "Helix Sphere"
 eotg_heritage_helix_desc:0 "Populations who rebuilt their societies from the wreckage of the corporate collapse — hardened by violence, scarcity, and the constant struggle for survival."

 eotg_heritage_cauldron:0 "Cauldron Sphere"
 eotg_heritage_cauldron_desc:0 "Peoples shaped by the long shadow of New Cauldron's democratic institutions — civic-minded, disciplined, and deeply conscious of their political inheritance."

 eotg_heritage_coldiron:0 "Coldiron Sphere"
 eotg_heritage_coldiron_desc:0 "Cultures forged in the frozen frontier systems of the Coldiron cluster — resistant to hardship, structured by doctrine, and defended by fortified populations."

 eotg_heritage_lanius:0 "Lanius Sphere"
 eotg_heritage_lanius_desc:0 "Descendants of the old Elrossi colonial network — aristocratic, conscious of legitimacy, and deeply invested in preserving the cultural memory of a lost order."

 eotg_heritage_trade:0 "Trade League"
 eotg_heritage_trade_desc:0 "Peoples whose identity was defined by commerce, transit administration, and the maintenance of the Trade League's vast interstellar networks."

 eotg_heritage_frontier:0 "Outer Marches"
 eotg_heritage_frontier_desc:0 "Mixed populations at the edges of known space — shaped by isolation, cross-cultural contact, and the constant pressure of survival far from any established center."

 # ── LANGUAGES ──────────────────────────────────────────────────────────────

 eotg_language_elven:0 "High Elven"
 eotg_language_elven_desc:0 "The ancient tongue preserved by elven kindreds across the clusters — formal, precise, and older than most written records."

 eotg_language_goblin:0 "Gob-Cant"
 eotg_language_goblin_desc:0 "A fast, pragmatic trade language evolved from a dozen salvage-culture dialects — useful, unpoetic, and widely understood near Trade League space."

 eotg_language_ogre:0 "Forgeborn"
 eotg_language_ogre_desc:0 "A deep, consonant-heavy language whose structure reflects industrial hierarchy and collective labor — spoken across ogre workshops and engineering clans."

 eotg_language_ratfolk:0 "Warren Speak"
 eotg_language_ratfolk_desc:0 "A rapid, layered dialect system evolved in close-quarters collective environments — dense with implication and difficult for outsiders to fully comprehend."

 eotg_language_xeric:0 "Xerish"
 eotg_language_xeric_desc:0 "The survivor dialect of the Xerxes sphere — a creolized language shaped by displacement, flood migration, and centuries of cultural mixing."

 eotg_language_helix:0 "Helix Standard"
 eotg_language_helix_desc:0 "The rough working language of the post-corporate Helix sphere — blunt, efficient, and carrying the marks of a society rebuilt from violence."

 eotg_language_cauldron:0 "Cauldric"
 eotg_language_cauldron_desc:0 "The civic language of New Cauldron's democratic tradition — structured, formal in official use, and spread across Cauldron sphere institutions."

 eotg_language_coldiron:0 "Coldtongue"
 eotg_language_coldiron_desc:0 "The austere and heavily structured language of the Coldiron sphere — reflecting a culture built around discipline, doctrine, and endurance."

 eotg_language_lanius:0 "Lanius Court"
 eotg_language_lanius_desc:0 "The prestige language of the old Elrossi colonial aristocracy — ornate, deliberate, and still used as a marker of legitimacy in Lanius sphere courts."

 eotg_language_common:0 "Cluster Common"
 eotg_language_common_desc:0 "The simplified trade lingua franca spoken across frontier space and Transit League corridors — practical, flexible, and belonging to no one in particular."
