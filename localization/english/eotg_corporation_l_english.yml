l_english:
 # Corporation G2 batch CO1 (resource core). Spec: docs/specs/governments_v2_g2_corporation.md section 9.
 eotg_corporation_board_modifier:0 "Hold on the Board"
 eotg_corporation_board_modifier_desc:0 "A chief who holds the board is paid well and obeyed. One who loses it is neither."
 eotg_corporation_board_scale_desc:0 "Your hold on the board, from 0 to 100"
 eotg_story_corporation_board:0 "The Board"
 eotg_story_corporation_board_info:0 "Board Influence is your hold on the board that really runs the company.\n\nEach year a company that is solvent and at peace gains 3. One in debt loses 5. Every director who courts the board takes 5 from you.\n\nThe higher it is, the more the company earns and the more your [vassals|E] trust you. At 40 and again at 75 it adds to your vote when the next chief is chosen.\n\nWhen you die, your successor keeps half of it, or their own if that is higher. A new chief has to win the board again."
 eotg_story_corporation_board_label:0 "Board Influence"
 eotg_story_corporation_board_min_label:0 "0"
 eotg_story_corporation_board_max_label:0 "100"
 eotg_story_corporation_board_tt:0 "This counter shows your hold on the board, from 0 to 100."
 # Batches CO3 and CO4 (decisions, transitions)
 eotg_corporation_restructured_modifier:0 "Restructured"
 eotg_corporation_restructured_modifier_desc:0 "The board has approved a restructuring. The company earns more and builds for less, and the directors resent it."
 eotg_restructured_opinion:0 "Restructured Over My Head"
 eotg_decision_corporation_restructure:0 "Push Through a Restructuring"
 eotg_decision_corporation_restructure_desc:0 "Spend some of your hold on the board to force a restructuring through. For 5 years the company earns more and builds for less, but every director who answers to you resents having it imposed from above."
 eotg_decision_corporation_restructure_tooltip:0 "Spend your hold on the board on a restructuring"
 eotg_decision_corporation_restructure_confirm:0 "Force it through"
 eotg_decision_corporation_restructure_influence_tt:0 "You have at least 25 Board Influence"
 eotg_decision_corporation_restructure_spend_tt:0 "Your Board Influence falls by 25"
 eotg_decision_corporation_restructure_effect_tt:0 "Every Corporation [vassal|E] of yours resents the restructuring"
 eotg_decision_corporation_court_board:0 "Court the Board"
 eotg_decision_corporation_court_board_desc:0 "Spend [gold|E] where it counts and win friends on the board. Your own hold on it grows, and your chief's hold loosens a little. A strong hold on the board carries weight when the next chief is chosen."
 eotg_decision_corporation_court_board_tooltip:0 "Buy favour on the board"
 eotg_decision_corporation_court_board_confirm:0 "Make the rounds"
 eotg_decision_corporation_court_board_gain_tt:0 "Your Board Influence rises by 15"
 eotg_decision_corporation_court_board_erosion_tt:0 "Your [liege|E]'s Board Influence falls by 5"
 eotg_decision_corporation_adopt:0 "Incorporate the Realm"
 eotg_decision_corporation_adopt_desc:0 "Put your realm on the books and run it as a company, with a board above you and directors below. Only you change: your vassals keep their governments, but land you grant from now on is run the company way."
 eotg_decision_corporation_adopt_tooltip:0 "Run your realm as a company"
 eotg_decision_corporation_adopt_confirm:0 "Incorporate"
 eotg_decision_corporation_adopt_stewardship_tt:0 "You have at least 12 [stewardship|E]"
 eotg_decision_corporation_adopt_gold_tt:0 "You have the capital to put on the books"
 eotg_decision_corporation_dissolve_board:0 "Dissolve the Board"
 eotg_decision_corporation_dissolve_board_desc:0 "Send the board home and become Feudal. Your hold on it turns into [legitimacy|E], 2 for each point of Board Influence up to 200. Your Corporation vassals become Feudal with you."
 eotg_decision_corporation_dissolve_board_tooltip:0 "Rule in your own name"
 eotg_decision_corporation_dissolve_board_confirm:0 "Dissolve it"
 eotg_decision_corporation_dissolve_board_influence_tt:0 "Your Board Influence falls to 0"
 eotg_decision_corporation_dissolve_board_effect_tt:0 "Your Corporation vassals become Feudal with you"
