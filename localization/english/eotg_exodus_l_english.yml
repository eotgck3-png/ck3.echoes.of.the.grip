l_english:
 # ═══════════════════════════════════════════════════════════════════════════════
 # THE TITAN EXODUS — refugee arrival localization
 #
 # The Exodus began in 131 AG and is still running at the 866 AG bookmark. The
 # Titanworld is not dead, only steadily less survivable, and the fleets have been
 # coming for seven centuries. Some carry whole cultures; most carry whoever could
 # reach a hull in time.
 #
 # From 1000 AG the arrivals thin to a trickle (eotg_exodus.0009 marks the turn,
 # eotg_exodus.0010 is the long tail).
 # ═══════════════════════════════════════════════════════════════════════════════

 # ── County modifiers ─────────────────────────────────────────────────────────
 eotg_exodus_refugee_strain:0 "Refugee Influx"
 eotg_exodus_refugee_strain_desc:0 "A refugee wave is being absorbed faster than the county can comfortably manage. The camps are orderly, for now. Everything else is stretched — grain, housing, patience, and the authority of anyone trying to administer it."
 eotg_exodus_integrated_refugees:0 "Integrated Refugees"
 eotg_exodus_integrated_refugees_desc:0 "The refugee quarter has stopped being a camp and become a district. Titanworld trades, Titanworld hands, and a generation of children who will describe themselves as locals. The gamble of shelter has paid out."
 eotg_exodus_raider_scourge:0 "Refugee Raiders"
 eotg_exodus_raider_scourge_desc:0 "The fleet that was turned away did not sail on to die quietly. Its hulks work the shipping lanes now, taking what they were refused. They were refugees. They are something else."
 eotg_exodus_fever_outbreak:0 "Exodus Fever"
 eotg_exodus_fever_outbreak_desc:0 "Sickness came ashore with the refugee ships and found a population with no resistance to it. The physicians have a name for the fever and nothing else useful to offer."
 eotg_exodus_pressed_levies:0 "Pressed Refugees"
 eotg_exodus_pressed_levies_desc:0 "Refugees who bought their landfall with service. The levies are fuller than they have been in years, and every man in those ranks knows precisely what the arrangement was."
 eotg_exodus_haven_reputation:0 "Haven of the Exodus"
 eotg_exodus_haven_reputation_desc:0 "Word travels between the fleets, and the fleets talk to everyone. This is a realm that opened its ports when it did not have to, and seven centuries of refugees have long memories for which ones did."

 # ═══════════════════════════════════════════════════════════════════════════════
 # EVENTS — eotg_exodus
 # ═══════════════════════════════════════════════════════════════════════════════

 # ── eotg_exodus.0001 — a ragged fleet arrives ────────────────────────────────
 eotg_exodus_0001_title:0 "Ragged Survivors"
 eotg_exodus_0001_desc:0 "They come out of the void at the edge of your systems, and the first thing your pickets report is that half of them are under tow. Scorched hulls, failed drives, atmosphere venting from compartments nobody has been able to seal since the Titanworld.\n\nThe manifests are worse than the ships. Families, mostly. Holds packed past any rating a shipwright would sign, rationed down to nothing weeks ago, and asking — through a relay that keeps cutting out — for permission to make landfall.\n\nThey have been asking someone for seven hundred years. This season they are asking you."
 eotg_exodus_0001_opt_shelter:0 "Make landfall. We will find room."
 eotg_exodus_0001_opt_refuse:0 "Turn them back into the void."
 eotg_exodus_0001_opt_press:0 "Their passage has a price: service."

 # ── eotg_exodus.0002 — sheltered refugees integrate ──────────────────────────
 eotg_exodus_0002_title:0 "Roots in New Soil"
 eotg_exodus_0002_desc:0 "It took a year and a half, and for most of it your stewards were certain it had been a mistake.\n\nThen the refugee quarter opened a forge. Then three more. The fields beyond the camps came under plough by people who had farmed the Titanworld and knew things about thin soil your own tenants did not. There are children now who were born under this sky and know no other, and they are not called refugees by anyone who lives near them.\n\nThe camp is a district. It pays tax."
 eotg_exodus_0002_opt_good:0 "They are our people now."

 # ── eotg_exodus.0003 — the spurned turn feral ────────────────────────────────
 eotg_exodus_0003_title:0 "The Spurned Turn Feral"
 eotg_exodus_0003_desc:0 "The fleet you refused did not sail on to die quietly.\n\nIt is working your shipping lanes now — striking convoys on the approach, taking food and fuel and hulls, and vanishing into the drift before anything armed can be brought to bear. Your captains report that the raiders hail them first. They use the same relay frequency they used when they were asking for landfall.\n\nThey are not asking any more."
 eotg_exodus_0003_opt_hunt:0 "Hunt them down."
 eotg_exodus_0003_opt_pay:0 "Buy them off."
 eotg_exodus_0003_opt_ignore:0 "Let them burn themselves out."

 # ── eotg_exodus.0004 — a skilled specialist ──────────────────────────────────
 eotg_exodus_0004_title:0 "A Master of the Old Arts"
 eotg_exodus_0004_desc:0 "Among the latest arrivals is one the other refugees make room for without being asked — a grey-haired artisan-engineer who came up through the last working guilds of the Titanworld, back when there still were guilds.\n\nWhat they carry is not in any archive you hold. Techniques, tolerances, the reasons behind methods your own craftsmen perform without understanding. Knowledge that predates the Grip and has been handed down by people who never had the leisure to write it out.\n\nThey are travelling on with the fleet, they say, unless there is a reason to stop."
 eotg_exodus_0004_opt_recruit:0 "Such knowledge belongs at my court."
 eotg_exodus_0004_opt_fund:0 "Fund their onward passage."
 eotg_exodus_0004_opt_pass:0 "Let them drift on with the fleet."

 # ── eotg_exodus.0005 — an organized remnant ──────────────────────────────────
 eotg_exodus_0005_title:0 "An Organized Remnant"
 eotg_exodus_0005_desc:0 "This is no ragged flotilla.\n\nThe convoy enters your space in parade formation, transponders answering correctly, escorts positioned exactly as a competent staff officer would place them. Old banners, well kept. Soldiers still under discipline and still armed.\n\nIt is the surviving court of a Titanworld domain that no longer has a domain — a lord, a household, a treasury of sorts, and rather more warships than a guest ideally arrives with. Their message requests an audience. It is phrased as a courtesy between equals."
 eotg_exodus_0005_opt_welcome:0 "Honored guests. My court is open to you."
 eotg_exodus_0005_opt_extort:0 "Passage through my systems is not free."
 eotg_exodus_0005_opt_expel:0 "Turn them out — every last ship."

 # ── eotg_exodus.0006 — the remnant's grudge ──────────────────────────────────
 eotg_exodus_0006_title:0 "The Remnant's Grudge"
 eotg_exodus_0006_desc:0 "The exiled lord you drove off at gunpoint has not spent the intervening months reflecting on their manners.\n\nThose same warships — the ones you refused harbor, still crewed, still disciplined — are raiding your holdings. Not indiscriminately. They strike supply, they strike revenue, and they withdraw before a response can form, which is what a professional staff does when it has decided to repay a specific insult rather than merely to steal.\n\nThey are returning your hospitality, measure for measure."
 eotg_exodus_0006_opt_crush:0 "Crush them. Utterly."
 eotg_exodus_0006_opt_settle:0 "Offer them the settlement I refused before."
 eotg_exodus_0006_opt_endure:0 "Let them spend their rage."

 # ── eotg_exodus.0007 — pilgrims of the Firstlight ────────────────────────────
 eotg_exodus_0007_title:0 "Pilgrims of the Firstlight"
 eotg_exodus_0007_desc:0 "Temple-ships, under the banners of the Firstlight, moving slowly because what they carry cannot be moved any faster.\n\nAn entire monastic order has come out of the Titanworld — its relics, its archives, its novices, and an abbess who has spent the voyage cataloguing what was saved and what was not. They have brought no soldiers and very little of value to anyone who does not share their creed.\n\nThey are asking for ground. Not wealth, not protection, not a place at your table. Ground to pray on, and leave to keep praying."
 eotg_exodus_0007_opt_sanctuary:0 "There is holy ground here for you."
 eotg_exodus_0007_opt_refuse:0 "We have no room for foreign creeds."
 eotg_exodus_0007_opt_redirect:0 "I know just the place — in my rival's systems."

 # ── eotg_exodus.0008 — the fever ships ───────────────────────────────────────
 eotg_exodus_0008_title:0 "The Fever Ships"
 eotg_exodus_0008_desc:0 "The convoy hailing your ports is flying quarantine-black, which at least means they are honest.\n\nFever is moving through the holds. It has been for three weeks, in conditions that could not have been better designed to spread it. Your harbormasters have submitted a written recommendation that no ship be permitted to dock under any circumstances, and they are not wrong.\n\nThe ships' criers are broadcasting on open channel. They are not arguing with the harbormasters. They are simply reading out, one after another, the names and ages of the children aboard."
 eotg_exodus_0008_opt_quarantine:0 "Hold them in orbit. Send doctors and supplies up."
 eotg_exodus_0008_opt_admit:0 "Mercy has no quarantine. Let them land."
 eotg_exodus_0008_opt_refuse:0 "Seal the ports. Turn them away."

 # ── eotg_exodus.0009 — the Exodus wanes (one-time, ~1000 AG) ─────────────────
 eotg_exodus_0009_title:0 "The Last Fleets"
 eotg_exodus_0009_desc:0 "It is the harbormasters' ledgers that tell it, not any proclamation. The columns have been thinning for a decade — fewer hulls each season, smaller manifests, longer gaps — and this year only a handful of sails came out of the dark.\n\nThe Titanworld has not ended. It has simply been emptied. Eight and a half centuries after the generation of Mikey the Great fled it, there is almost no one left there to leave.\n\nThe Exodus built every nation in settled space. It fed New Cauldron's founding, carried the faiths, seeded half the cultures a map of this galaxy can name. And it is ending — not with a catastrophe, but with a quiet season in which the ships stopped coming."
 eotg_exodus_0009_opt_ok:0 "An age ends. We remain."

 # ── eotg_exodus.0010 — stragglers (rare, post-1000 AG) ───────────────────────
 eotg_exodus_0010_title:0 "Stragglers of a Dead World"
 eotg_exodus_0010_desc:0 "One ship. No fleet behind it and none coming after.\n\nThe crew are scavengers — the last of them, working the ruins of the Titanworld long after anyone sensible had gone. They describe what they left behind carefully, because they have clearly been asked before and clearly hate the question. Cities intact and empty. Orbital lanes with nothing moving in them. No signals on any band, anywhere, for as long as they listened.\n\nThey are not asking for shelter, or work, or charity. They are asking for somewhere to stop running, because there is no longer anything behind them to run from."
 eotg_exodus_0010_opt_harbor:0 "The last of them deserve harbor."
 eotg_exodus_0010_opt_away:0 "We stopped taking refugees long ago."
