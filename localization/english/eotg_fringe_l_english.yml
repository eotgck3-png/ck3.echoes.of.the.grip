 l_english:
 # ── Fringe Government ──────────────────────────────────────────────────────────

 eotg_fringe_government:0 "Fringe"
 eotg_fringe_government_adjective:0 "Fringe"
 eotg_fringe_government_realm:0 "Domain"
 eotg_fringe_government_desc:0 "A loose coalition of raiders, warlords, and outlaw fleets held together by fear, loot, and the personal authority of the Overlord. Fringe realms expand aggressively and collapse without constant warfare. Not sustainable long-term — either reform into a stable state or face cyclical fragmentation."

 # ── Customizable Localization ──────────────────────────────────────────────────

 eotg_holding_name_fringe:0 "Outpost"
 eotg_vassal_tier_one_fringe:0 "Raider"
 eotg_vassal_tier_two_fringe:0 "Captain"
 eotg_vassal_tier_three_fringe:0 "Warlord"
 eotg_ruler_title_fringe:0 "Overlord"
 eotg_realm_name_fringe:0 "The Fringe"
 eotg_succession_flavor_fringe:0 "The strongest takes command. The rest fall in line or fall away."
 eotg_faction_name_fringe:0 "The Breakaway Bloc"

 # ── Vassal Contract Group ─────────────────────────────────────────────────────

 eotg_fringe_vassal:0 "Fringe Alliance"
 eotg_fringe_vassal_desc:0 "The tribute and warband duties owed to the Overlord by subordinate captains and warlords."

 # ── Contract Obligations ───────────────────────────────────────────────────────

 eotg_fringe_loyalty_oath:0 "Loyalty Oath"
 eotg_fringe_loyalty_oath_desc:0 "Tribute paid to the Overlord. Captains keep most of their loot — the Overlord takes a share as a sign of submission."

 eotg_fringe_tribute_minimal:0 "Token Tribute"
 eotg_fringe_tribute_minimal_short:0 "Token"
 eotg_fringe_tribute_minimal_desc:0 "Barely enough to acknowledge the Overlord's authority. Captains keep almost everything."

 eotg_fringe_tribute_standard:0 "Standard Tribute"
 eotg_fringe_tribute_standard_short:0 "Standard"
 eotg_fringe_tribute_standard_desc:0 "A fair share. The Overlord takes their cut; captains are not pleased but accept it."

 eotg_fringe_tribute_blood:0 "Blood Tribute"
 eotg_fringe_tribute_blood_short:0 "Blood"
 eotg_fringe_tribute_blood_desc:0 "Maximum extraction. The Overlord takes the lion's share. Captains resent it — and remember."

 eotg_fringe_raiding_obligation:0 "Warband Duty"
 eotg_fringe_raiding_obligation_desc:0 "Contribution of fighters to the Overlord's campaigns. Fringe realms live by the warband."

 eotg_fringe_warband_token:0 "Token Force"
 eotg_fringe_warband_token_short:0 "Token"
 eotg_fringe_warband_token_desc:0 "A minimal contribution. Captains send enough fighters to show the flag."

 eotg_fringe_warband_full:0 "Full Warband"
 eotg_fringe_warband_full_short:0 "Full"
 eotg_fringe_warband_full_desc:0 "Every available fighter deployed under the Overlord's banner. Captains expect to be rewarded."

 # ── Decisions ──────────────────────────────────────────────────────────────────

 eotg_fringe_distribute_spoils:0 "Distribute the Spoils"
 eotg_fringe_distribute_spoils_confirm:0 "Share the gains of war with your captains to maintain loyalty."
 eotg_fringe_distribute_spoils_desc:0 "Your captains fought alongside you. They expect a share of what was taken. Generosity now buys compliance later. Holding back breeds resentment — and resentment breeds rebellion."
 eotg_fringe_distribute_spoils_tooltip:0 "Spend gold proportional to your number of captains. Boosts Grip and captain opinion. Requires recent war activity."
 eotg_fringe_distribute_spoils_effect_tooltip:0 "Spoils distributed. Captains are satisfied for now. Their loyalty has been refreshed."

 eotg_fringe_rule_through_fear:0 "Rule Through Fear"
 eotg_fringe_rule_through_fear_confirm:0 "Make an example. Fear is cheaper than gold."
 eotg_fringe_rule_through_fear_desc:0 "Gold is not always available. But dread is free. A public display of ruthless authority can silence doubters and reinforce your grip over the coalition — at the cost of resentment that festers in the dark."
 eotg_fringe_rule_through_fear_tooltip:0 "Spend prestige. Gain Grip and a fear modifier. Captain opinion worsens. Gain tyranny."
 eotg_fringe_rule_through_fear_effect_tooltip:0 "Your authority is enforced through fear. Captains comply — but they haven't forgotten."

 eotg_fringe_call_warbands:0 "Call the Warbands"
 eotg_fringe_call_warbands_confirm:0 "Mobilize the captains' forces for an imminent campaign."
 eotg_fringe_call_warbands_desc:0 "The Fringe runs on war. Calling the warbands signals that action is coming — and keeps your captains focused on something other than your weaknesses."
 eotg_fringe_call_warbands_tooltip:0 "Spend prestige. Grants a temporary levy and knight effectiveness modifier. Reduces income and county control."
 eotg_fringe_call_warbands_effect_tooltip:0 "The warbands are called. Your forces are ready. The captains are watching to see if you actually use them."

 eotg_fringe_suppress_captains:0 "Suppress Breakaway Captains"
 eotg_fringe_suppress_captains_confirm:0 "Confront a disloyal captain before the situation escalates."
 eotg_fringe_suppress_captains_desc:0 "One of your captains is pushing boundaries. Left unchecked, defiance spreads. Confronting the problem now — peacefully or violently — is cheaper than managing the fallout later."
 eotg_fringe_suppress_captains_tooltip:0 "Requires a captain with opinion below -10. Fires a confrontation event with peaceful or violent resolution paths."

 eotg_fringe_forge_unified:0 "Forge a Unified Fringe"
 eotg_fringe_forge_unified_confirm:0 "Bind the captains into a single, unified coalition under your absolute authority."
 eotg_fringe_forge_unified_desc:0 "The Fringe has never been one thing. That changes today. Through fear, gold, and sheer force of will, you bind every warlord under a single banner. It will not last forever — but while it holds, it will be formidable."
 eotg_fringe_forge_unified_tooltip:0 "Requires High Grip, 500 prestige, 30 dread, realm size 20+. Grants a powerful stabilization modifier. Severe succession consequences on death."
 eotg_fringe_forge_unified_effect_tooltip:0 "The Fringe is unified. Your captains are bound. On your death, this coalition will fracture — plan accordingly."

 eotg_fringe_reform_cartel:0 "Reform as Cartel State"
 eotg_fringe_reform_cartel_confirm:0 "Transform the raider coalition into an organized criminal syndicate."
 eotg_fringe_reform_cartel_desc:0 "The raiding days have built something. Not a kingdom — something more flexible, more profitable. What you have can be structured into a Cartel: networks, extortion, controlled markets. The captains who adapt will prosper. The ones who don't will be dealt with."
 eotg_fringe_reform_cartel_tooltip:0 "Requires 20 dread, 300 gold, prestige scales with realm size. Triggers a reform crisis event. Converts government to Cartel."

 eotg_fringe_reform_pmc:0 "Reform as PMC"
 eotg_fringe_reform_pmc_confirm:0 "Transform the warlord coalition into a professional military company."
 eotg_fringe_reform_pmc_desc:0 "Warlords for hire. That is what you already are — just without the structure. Formalizing the contracts, the command hierarchy, and the logistics turns a raider mob into something that other rulers will pay for. The captains become Operators. The raids become contracts."
 eotg_fringe_reform_pmc_tooltip:0 "Requires martial 10+, 300 gold, prestige scales with realm size. Triggers a reform crisis event. Converts government to PMC."

 eotg_fringe_reform_corporation:0 "Reform as Corporate Frontier State"
 eotg_fringe_reform_corporation_confirm:0 "Transform the frontier coalition into an exploitative industrial state."
 eotg_fringe_reform_corporation_desc:0 "The raiding has identified where the wealth is. Now is the time to extract it systematically. Strip the frontier's resources through corporate structure — turn warlord territories into revenue streams, captains into directors, and raids into market operations."
 eotg_fringe_reform_corporation_tooltip:0 "Requires stewardship 10+, 500 gold, prestige scales with realm size. Triggers a reform crisis event. Converts government to Corporation."

 eotg_fringe_reform_feudal:0 "Feudalize the Realm"
 eotg_fringe_reform_feudal_confirm:0 "Legitimize your rule through traditional feudal structures."
 eotg_fringe_reform_feudal_desc:0 "The raiding can't go on forever. Building something that survives past your death requires laws, titles, and institutions. The captains will become vassals. The outposts will become holdings. The Fringe will become a realm."
 eotg_fringe_reform_feudal_tooltip:0 "Requires diplomacy 10+, 200 gold, prestige scales with realm size. Triggers a reform crisis event. Converts government to Feudal."

 # ── Modifiers ──────────────────────────────────────────────────────────────────

 eotg_fringe_high_grip:0 "Strong Grip"
 eotg_fringe_high_grip_desc:0 "The Overlord's authority over the captains is firm. Faction pressure is reduced and vassals operate within clearly enforced limits."

 eotg_fringe_low_grip:0 "Failing Grip"
 eotg_fringe_low_grip_desc:0 "The Overlord's hold over the captains is slipping. Factions grow bolder, schemes multiply, and the coalition is at risk of splintering."

 eotg_fringe_peace_decay_minor:0 "Restless Captains"
 eotg_fringe_peace_decay_minor_desc:0 "The warbands have been idle for two years. Captains grow restless without the promise of raids or conquest."

 eotg_fringe_peace_decay_major:0 "Growing Unrest"
 eotg_fringe_peace_decay_major_desc:0 "Five years of peace has bred serious instability. The captains question why they follow an Overlord who does not raid."

 eotg_fringe_peace_decay_severe:0 "Severe Instability"
 eotg_fringe_peace_decay_severe_desc:0 "A decade of peace has nearly destroyed the coalition's coherence. The Fringe is fracturing. War or reform is now the only path forward."

 eotg_fringe_overextension_minor:0 "Overextended"
 eotg_fringe_overextension_minor_desc:0 "The realm has grown faster than the Overlord's authority can follow. Border territories are drifting beyond effective control."

 eotg_fringe_overextension_major:0 "Severely Overextended"
 eotg_fringe_overextension_major_desc:0 "The realm is far too large for the Overlord's grip to hold. Fragmentation is a matter of when, not if."

 eotg_fringe_chaos_succession:0 "Succession Chaos"
 eotg_fringe_chaos_succession_desc:0 "The previous Overlord's death has shaken the coalition. Captains are testing their new ruler's limits. Grip is weakened and the realm is vulnerable to breakaway attempts."

 eotg_fringe_unified:0 "Unified Fringe"
 eotg_fringe_unified_desc:0 "The Overlord has bound every captain under a single banner through force of will, gold, and dread. The coalition holds for now — but the Overlord's death will shatter it."

 eotg_fringe_fear_ruling:0 "Ruling by Fear"
 eotg_fringe_fear_ruling_desc:0 "The Overlord has made clear that defiance will be punished severely. Authority is maintained through intimidation rather than loyalty."

 eotg_fringe_warbands_called:0 "Warbands Called"
 eotg_fringe_warbands_called_desc:0 "The Overlord has mobilized the captains' forces. Levies are reinforced and knights are ready — but the sustained mobilization strains the realm's economy."

 eotg_fringe_captain_defiant:0 "Defiant Captain"
 eotg_fringe_captain_defiant_desc:0 "This captain has publicly challenged or defied the Overlord's authority. They are a focal point for resentment in the coalition."

 eotg_fringe_captain_hunted:0 "Under the Overlord's Eye"
 eotg_fringe_captain_hunted_desc:0 "The Overlord has signaled interest in eliminating this captain. Other captains are watching to see what happens next."

 # ── Events ─────────────────────────────────────────────────────────────────────

 eotg_fringe_0001_title:0 "The Captains Demand Their Share"
 eotg_fringe_0001_desc:0 "The war is over. The captains who bled for you are making it clear they expect something in return. [scope:eotg_demanding_captain.GetTitledFirstName] speaks for them all. The spoils are there. The question is how much of it you keep."
 eotg_fringe_0001_opt_generous:0 "Share generously. Buy their loyalty."
 eotg_fringe_0001_opt_keep:0 "Keep most for yourself. Let them grumble."
 eotg_fringe_0001_opt_favor:0 "Favor one captain. A dangerous game."

 eotg_fringe_0002_title:0 "A Captain Refuses Orders"
 eotg_fringe_0002_desc:0 "[scope:eotg_defiant_captain.GetTitledFirstName] has refused a direct order. Not quietly — publicly. Other captains are watching. How you respond defines the shape of your authority."
 eotg_fringe_0002_opt_tolerate:0 "Let it go. Pick a better battle."
 eotg_fringe_0002_opt_punish:0 "Make a public example of them."
 eotg_fringe_0002_opt_eliminate:0 "Mark them for elimination."

 eotg_fringe_0003_title:0 "Confronting the Defiant"
 eotg_fringe_0003_desc:0 "[scope:eotg_suppressed_captain.GetTitledFirstName] has been pushing boundaries long enough. The confrontation is here. Force or gold — choose your method."
 eotg_fringe_0003_opt_peaceful:0 "Pay them off. Expensive, but clean."
 eotg_fringe_0003_opt_violent:0 "Make an example. The hard way."

 eotg_fringe_0004_title:0 "Mutiny in the Void"
 eotg_fringe_0004_desc:0 "Your authority has collapsed to almost nothing. [scope:eotg_mutiny_leader.GetTitledFirstName] is openly organizing the other captains. This is the edge of rebellion. You must act now or accept the consequences."
 eotg_fringe_0004_opt_concede:0 "Offer everything you have. Buy another chance."
 eotg_fringe_0004_opt_hold:0 "Hold firm. Show no weakness."

 eotg_fringe_0005_title:0 "Who Commands the Fleet?"
 eotg_fringe_0005_desc:0 "The Overlord is dead. You have inherited the title — but not the authority. The captains are watching, testing, waiting to see if you are worth following. The Fringe does not grant power. It reveals it."
 eotg_fringe_0005_opt_establish:0 "Assert authority. Make them believe in you."

 eotg_fringe_0006_title:0 "The Outer Clans Break Away"
 eotg_fringe_0006_desc:0 "The realm is large. The succession is chaotic. The border captains have seen their opportunity — distant territories are drifting toward independence, loyalty dissolving in the wake of the old Overlord's death."
 eotg_fringe_0006_opt_endure:0 "Endure the fracturing. Hold what you can."

 eotg_fringe_0007_title:0 "A Blood Feud"
 eotg_fringe_0007_desc:0 "Two of your captains have developed a genuine hatred for each other. It started as rivalry. Now it is threatening to become something that destabilizes your entire coalition."
 eotg_fringe_0007_opt_mediate:0 "Mediate between them. Spend prestige to calm the situation."
 eotg_fringe_0007_opt_let_fight:0 "Let them work it out. The stronger captain survives."
 eotg_fringe_0007_opt_exploit:0 "Exploit the feud. Play both sides for personal advantage."
 eotg_fringe_exploit_feud_success_tt:0 "You played both sides successfully. Grip improved."
 eotg_fringe_exploit_feud_fail_tt:0 "The captains noticed your manipulation. Grip damaged."

 eotg_fringe_0008_title:0 "Loot Riots"
 eotg_fringe_0008_desc:0 "War without pay breeds riot. Your captains and levies expected reward from the last campaign. With the gold depleted, they are taking what they are owed — from your counties, your garrisons, your subjects."
 eotg_fringe_0008_opt_endure:0 "Let it burn itself out. Accept the loss."

 eotg_fringe_0009_title:0 "The Captains Grow Restless"
 eotg_fringe_0009_desc:0 "Peace has lasted long enough to become a problem. The warbands are idle. The captains are talking among themselves — and what they are saying is not flattering to your leadership."
 eotg_fringe_0009_opt_plan:0 "Begin planning the next campaign. Show them action is coming."
 eotg_fringe_0009_opt_dismiss:0 "Dismiss their restlessness. A ruler is not defined by war alone."

 eotg_fringe_0010_title:0 "The Cartel Reform"
 eotg_fringe_0010_desc:0 "The old ways are ending. The Fringe is restructuring — not into a kingdom, but into something more modern, more dangerous. Organized crime scaled to statehood. Some captains will embrace it. Others will resist."
 eotg_fringe_0010_opt_proceed:0 "The Cartel rises. Reform begins."

 eotg_fringe_0011_title:0 "The PMC Reform"
 eotg_fringe_0011_desc:0 "The warbands become contracts. The raids become operations. The Fringe disciplines itself into a professional military company — with all the structure and accountability that entails. Some captains will see opportunity. Others will see a leash."
 eotg_fringe_0011_opt_proceed:0 "The PMC is formalized. Reform begins."

 eotg_fringe_0012_title:0 "The Corporate Reform"
 eotg_fringe_0012_desc:0 "The frontier has resources. The Corporate Frontier State exploits them systematically. Directors replace warlords. Revenue streams replace raiding grounds. Some captains will grow rich. Others will not survive the transition."
 eotg_fringe_0012_opt_proceed:0 "The Corporation takes shape. Reform begins."

 eotg_fringe_0013_title:0 "The Feudal Reform"
 eotg_fringe_0013_desc:0 "Laws. Titles. Institutions. The Fringe becomes something legitimate. It is slower, more constrained, and far more durable. For some captains, this is an opportunity. For others, it is the end of everything they built their reputation on."
 eotg_fringe_0013_opt_proceed:0 "The realm is feudalized. The Fringe is history."

 # ── Opinion Modifier Names ─────────────────────────────────────────────────────

 eotg_fringe_spoils_distributed:0 "Spoils Received"
 eotg_fringe_spoils_distributed_desc:0 "The Overlord shared the gains of war fairly. This is what loyalty is built on."

 eotg_fringe_spoils_kept:0 "Spoils Withheld"
 eotg_fringe_spoils_kept_desc:0 "The Overlord kept most of the spoils. This is remembered."

 eotg_fringe_public_punishment:0 "Publicly Punished"
 eotg_fringe_public_punishment_desc:0 "Made an example of by the Overlord. Resentment runs deep."

 eotg_fringe_fear_rule_resentment:0 "Ruled by Fear"
 eotg_fringe_fear_rule_resentment_desc:0 "The Overlord rules through intimidation. Compliance is not loyalty."

 eotg_fringe_reform_resentment:0 "Reform Resentment"
 eotg_fringe_reform_resentment_desc:0 "The old ways are gone. Not everyone who thrived under the Fringe will thrive under the new order."

 eotg_fringe_succession_chaos_opinion:0 "Post-Succession Instability"
 eotg_fringe_succession_chaos_opinion_desc:0 "The succession was chaotic. The new Overlord has not yet proven themselves."

 eotg_fringe_unified_fear:0 "Unified Under the Banner"
 eotg_fringe_unified_fear_desc:0 "The Overlord has forged a unified coalition. Resistance feels futile — for now."

 # ── Extended Modifier Names (Phase 1 expansion) ────────────────────────────

 eotg_fringe_cracking_authority:0 "Authority Cracking"
 eotg_fringe_cracking_authority_desc:0 "The Overlord's grip on the captains is visibly slipping. Discipline is maintained through inertia alone."

 eotg_fringe_bought_loyalty:0 "Bought Loyalty"
 eotg_fringe_bought_loyalty_desc:0 "Gold has purchased what respect could not. A precarious arrangement, but it holds — for now."

 eotg_fringe_promised_glory:0 "Promised Glory"
 eotg_fringe_promised_glory_desc:0 "The captains have been promised the next campaign will be legendary. They are waiting. Impatiently."

 eotg_fringe_restless_captains:0 "Restless Warbands"
 eotg_fringe_restless_captains_desc:0 "The warbands have been idle too long. They are looking for other lords who might give them war."

 eotg_fringe_great_plunder:0 "Great Plunder"
 eotg_fringe_great_plunder_desc:0 "The last raid returned extraordinary wealth. The realm is fat with spoils and the captains are satisfied."

 eotg_fringe_personal_following:0 "Personal Following"
 eotg_fringe_personal_following_desc:0 "This captain has cultivated the personal loyalty of their warbands. Their crew follows them, not the Overlord."

 eotg_fringe_captain_entrenched:0 "Entrenched Captain"
 eotg_fringe_captain_entrenched_desc:0 "This captain has accumulated enough power and allies that removing them would cost more than tolerating them."

 eotg_fringe_public_terror:0 "Reign of Terror"
 eotg_fringe_public_terror_desc:0 "The Overlord's cruelty has become the defining feature of their rule. Fear is the currency of loyalty here."

 eotg_fringe_great_unifier:0 "The Great Unifier"
 eotg_fringe_great_unifier_desc:0 "The Overlord forged the fractious captains into a single banner. The frontier knows this name."

 eotg_fringe_fragmentation:0 "Realm Fragmentation"
 eotg_fringe_fragmentation_desc:0 "The edges of the realm are slipping away. Distance has become the enemy of authority."

 eotg_fringe_old_blood:0 "Old Blood"
 eotg_fringe_old_blood_desc:0 "The old raider traditions have been given institutional weight. Veterans fight harder when they fight for the old ways."

 eotg_fringe_modernized_state:0 "Modernized Fringe"
 eotg_fringe_modernized_state_desc:0 "The Fringe has borrowed the tools of civilization. It is more efficient now — and perhaps more fragile."

 eotg_fringe_butcher_reputation:0 "Butcher of the Frontier"
 eotg_fringe_butcher_reputation_desc:0 "Songs of this ruler's cruelty spread faster than their armies. It is a reputation that cannot be unearned."

 eotg_fringe_loot_flood:0 "Loot Flood"
 eotg_fringe_loot_flood_desc:0 "Enormous plunder wealth is flooding the realm's economy. The markets are overwhelmed. The captains are satisfied."

 # ── Phase 1 Expanded Events ────────────────────────────────────────────────

 eotg_fringe_0014_title:0 "The Grip Weakens"
 eotg_fringe_0014_desc:0 "Rumors travel faster than orders. Your captains are whispering among themselves — the Overlord is losing their edge. Tribute arrives late. Commands are acknowledged with less urgency than they once were. If this is not addressed, the whispers will become something louder."
 eotg_fringe_0014_opt_discipline:0 "Remind them who built this realm."
 eotg_fringe_0014_opt_squabble:0 "Let the captains settle their own hierarchy."
 eotg_fringe_0014_opt_buy:0 "Gold speaks louder than reputation."

 eotg_fringe_0015_title:0 "The Captains Smell Weakness"
 eotg_fringe_0015_desc:0 "The defeat has not gone unremarked. Captains who once bowed their heads now meet your eyes directly. One of them — [scope:eotg_challenger_captain.GetName] — has been heard saying openly that the Overlord's time may be ending. This cannot be allowed to fester."
 eotg_fringe_0015_opt_execute:0 "Make an example. Publicly."
 eotg_fringe_0015_opt_challenge:0 "Challenge them in front of the assembled captains."
 eotg_fringe_0015_opt_ignore:0 "Ignore it. Dignity does not require response."
 eotg_fringe_0015_challenge_win_tt:0 "You dominated the challenger. The captains fell silent."
 eotg_fringe_0015_challenge_loss_tt:0 "The challenge went badly. The captains saw everything."

 eotg_fringe_0016_title:0 "The Fringe Hungers"
 eotg_fringe_0016_desc:0 "Three years without a real campaign. The loot stores run dry and the captains grow restless. They come to you with the same look in their eyes — the look of people who are reconsidering their allegiances. The Fringe cannot survive on promises."
 eotg_fringe_0016_opt_promise:0 "Promise them the next campaign will be legendary."
 eotg_fringe_0016_opt_mobilize:0 "Mobilize the warbands. War is coming."
 eotg_fringe_0016_opt_rations:0 "Tighten rations. Discipline over comfort."

 eotg_fringe_0017_title:0 "Raiders Desert the Cause"
 eotg_fringe_0017_desc:0 "Warbands are leaving. Not in rebellion — in disappointment. They came to the Fringe for war and wealth, and found neither. Your coffers are thin, your campaigns absent, and the captains who remain grow quieter by the month. The ships at the frontier dock are fewer than they were last season."
 eotg_fringe_0017_opt_pay:0 "Empty the treasury. Pay them to stay."
 eotg_fringe_0017_opt_leave:0 "Let them go. Only the loyal remain."
 eotg_fringe_0017_opt_threaten:0 "Anyone who leaves will not be welcomed back alive."

 eotg_fringe_0018_title:0 "The Heir Is Challenged"
 eotg_fringe_0018_desc:0 "The body of your predecessor is barely cold and already [scope:eotg_heir_challenger.GetName] is questioning whether the heir has the strength to lead. This is the Fringe. Succession is decided by the living, not documents."
 eotg_fringe_0018_opt_duel:0 "Meet the challenge. Steel answers steel."
 eotg_fringe_0018_opt_assassinate:0 "Remove the problem before it becomes a crisis."
 eotg_fringe_0018_opt_buy:0 "Their loyalty has a price. Pay it."
 eotg_fringe_0018_duel_win_tt:0 "You proved yourself in single combat. The captains accepted the result."
 eotg_fringe_0018_duel_loss_tt:0 "The duel went against you. The captains are watching to see what happens next."
 eotg_fringe_0018_assassinate_success_tt:0 "The challenger's accident was very convincing."
 eotg_fringe_0018_assassinate_fail_tt:0 "The attempt failed. The challenger knows."

 eotg_fringe_0019_title:0 "The Realm Fractures"
 eotg_fringe_0019_desc:0 "The realm has grown too large for the current Grip to hold. Messages take too long. Captains at the frontier do not hear orders until it is too late to follow them. The outer territories are operating independently — not in rebellion, but in drift. If this is not addressed, the drift becomes permanent."
 eotg_fringe_0019_opt_abandon:0 "Abandon the distant holdings. Consolidate around the core."
 eotg_fringe_0019_opt_centralize:0 "Centralize everything. No more local authority."
 eotg_fringe_0019_opt_delegate:0 "Formally delegate authority to trusted captains."

 eotg_fringe_0020_title:0 "Supply Lines Collapse"
 eotg_fringe_0020_desc:0 "The armies at the frontier have not received supply shipments in weeks. The logistical chain that was supposed to sustain the campaign has broken down somewhere between the core worlds and the advance positions. Soldiers are beginning to forage. Foraging becomes raiding. Raiding becomes something else."
 eotg_fringe_0020_opt_divert:0 "Redirect treasury resources to emergency supply runs."
 eotg_fringe_0020_opt_delegate:0 "Let the local captains manage their own logistics."
 eotg_fringe_0020_opt_push:0 "The armies can survive on what they can take. Push forward."

 eotg_fringe_0021_title:0 "The Great Plunder"
 eotg_fringe_0021_desc:0 "The raid returned with more than anyone expected. Ships sit heavy in the harbor. The captains are in remarkably good spirits. The question is not whether to celebrate, but how — and who benefits most from the outcome."
 eotg_fringe_0021_opt_celebrate:0 "Celebrate the victory openly. Share the glory."
 eotg_fringe_0021_opt_hoard:0 "Divert the bulk of the wealth to the treasury."
 eotg_fringe_0021_opt_reward:0 "Reward the captains beyond their expectations."

 eotg_fringe_0022_title:0 "Raid Gone Wrong"
 eotg_fringe_0022_desc:0 "The raid was a disaster. Bad intelligence, bad weather, or bad luck — the result is the same: the fleet returned without loot, without glory, and with fewer ships than it left with. The captains need to hear something that makes sense of this."
 eotg_fringe_0022_opt_blame:0 "Blame the scouts. Their intelligence was wrong."
 eotg_fringe_0022_opt_accept:0 "Accept responsibility. A ruler owns their decisions."
 eotg_fringe_0022_opt_another:0 "Demand an immediate second raid. We correct this now."

 eotg_fringe_0023_title:0 "Refugees Join the Fringe"
 eotg_fringe_0023_desc:0 "Displaced peoples from the neighboring war zone are arriving at your frontier. They are frightened, skilled, and desperate — which makes them both useful and difficult to manage. They are not here out of loyalty. They are here because your realm is not currently on fire."
 eotg_fringe_0023_opt_accept:0 "Accept them. More hands, more fighters."
 eotg_fringe_0023_opt_press:0 "Press them into service. Their labor has value."
 eotg_fringe_0023_opt_refuse:0 "Turn them away. We have enough complications."

 eotg_fringe_0024_title:0 "The Raiders Grow Fat"
 eotg_fringe_0024_desc:0 "Success has made some of your captains comfortable. Too comfortable. They talk about stability now — about markets and trade and less expensive ways to accumulate wealth. A few have even begun negotiating directly with merchants. The Fringe may be entering a new phase."
 eotg_fringe_0024_opt_cartel:0 "Organize the criminal trade networks. Profit, not plunder."
 eotg_fringe_0024_opt_old_ways:0 "Keep the old ways. The Fringe is built on war."
 eotg_fringe_0024_opt_secret:0 "Quietly prepare new institutions. Change on our terms."
 eotg_fringe_0024_cartel_tt:0 "The Cartel and PMC reform paths are now available."
 eotg_fringe_0024_secret_tt:0 "Both reform paths have been quietly opened."

 eotg_fringe_0025_title:0 "Discipline Over Chaos"
 eotg_fringe_0025_desc:0 "Your veteran commanders have begun discussing professionalization. Not the old warband structure — something with ranks, contracts, clear chains of command. Several of them have drawn up proposals. This would change the nature of the Fringe military fundamentally."
 eotg_fringe_0025_opt_officers:0 "Establish a formal officer corps. Structure over chaos."
 eotg_fringe_0025_opt_reject:0 "Reject the proposal. The warband traditions are what made us."
 eotg_fringe_0025_pmc_tt:0 "The PMC reform path is now available."

 eotg_fringe_0026_title:0 "The Old Ways Die Hard"
 eotg_fringe_0026_desc:0 "The traditionalist captains have organized. They are not calling it a rebellion — they are calling it a reminder. The Fringe was built on raiding and strength. Every step toward structure is a step away from what made the warbands loyal. [scope:eotg_traditionalist_captain.GetName] speaks for them."
 eotg_fringe_0026_opt_suppress:0 "Suppress the dissidents. Reform continues."
 eotg_fringe_0026_opt_compromise:0 "Compromise. Keep the traditions while building the structure."
 eotg_fringe_0026_opt_abandon:0 "Abandon the reform. The captains win."

 eotg_fringe_0027_title:0 "A Warlord of Legend Emerges"
 eotg_fringe_0027_desc:0 "[scope:eotg_legend_captain.GetName] has become something the warbands follow with a devotion that makes your own position look uncertain by comparison. They did not set out to overshadow you — it simply happened. Victories, songs, loyalty. The question is what you do with someone who has become nearly as powerful as the Overlord."
 eotg_fringe_0027_opt_promote:0 "Promote them. Their glory reflects on the realm."
 eotg_fringe_0027_opt_suppress:0 "Suppress their fame. One sun in this sky."
 eotg_fringe_0027_opt_marry:0 "Bind them through alliance. Their loyalty, formalized."

 eotg_fringe_0028_title:0 "Songs of the Fringe"
 eotg_fringe_0028_desc:0 "Stories are spreading. Not just across the Fringe — beyond it. Your victories, your ruthlessness, your reputation. The frontier worlds tell their children your name. This is the raw material of legend. The question is what kind of legend you want to be."
 eotg_fringe_0028_opt_embrace:0 "Embrace the legend. Let the songs spread."
 eotg_fringe_0028_opt_fear:0 "Ensure the songs are warnings, not celebrations."

 eotg_fringe_0029_title:0 "The Ghost Fleet"
 eotg_fringe_0029_desc:0 "The ships from the failed mutiny were never recovered. Now stories spread that they haunt the frontier — derelict hulks crewed by the dead, still flying your colors, appearing before disasters strike. This is superstition. But superstition has its uses."
 eotg_fringe_0029_opt_exploit:0 "Exploit the legend. Let them fear the ghost fleet."
 eotg_fringe_0029_opt_investigate:0 "Investigate. Ghost or not, those were my ships."
 eotg_fringe_0029_opt_ignore:0 "Ignore the stories. Chasing legends is undignified."
 eotg_fringe_0029_investigate_find_tt:0 "The investigation recovered salvage and useful intelligence."
 eotg_fringe_0029_investigate_nothing_tt:0 "The investigation found nothing. Some mysteries stay mysteries."
