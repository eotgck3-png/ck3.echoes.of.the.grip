l_english:
 eotg_aug_inherit.001.t:0 "The Report"
 eotg_aug_inherit.001.desc_rage:0 "The report lists a broken service tray, a bruised attendant and a fitting torn from the corridor wall. I read it twice. [eotg_inh_heir.GetFirstName] struck out before anyone saw a reason, then stood in the wreckage looking at [eotg_inh_heir.GetHerHis] own hands, and apologized to the attendant."
 eotg_aug_inherit.001.desc_ledger:0 "My household staff bring me slates found in [eotg_inh_heir.GetFirstName]'s quarters: names, shift times, who stands where, some entries struck through. [eotg_inh_heir.GetFirstName] has started keeping lists, in a neat, sure hand. [eotg_inh_heir.GetSheHe|U] has begun to treat what [eotg_inh_heir.GetSheHe] expects of other people as settled."
 eotg_aug_inherit.001.desc_cold:0 "I read the report, and it is mostly an absence. [eotg_inh_heir.GetFirstName] has stopped eating with the court and replies to every message in complete, courteous sentences. The plates come back full. The staff cannot say what [eotg_inh_heir.GetSheHe] wants, because [eotg_inh_heir.GetSheHe] has not said."
 eotg_aug_inherit.001.desc_certain:0 "The guard captain reports to me that [eotg_inh_heir.GetFirstName] has been giving orders to my guards, and that twice the orders were carried out before anyone checked the roster. [eotg_inh_heir.GetSheHe|U] speaks of what will change when the seat is [eotg_inh_heir.GetHerHis], and says it as plain fact."
 eotg_aug_inherit.001.bond_rival:0 "\n\n[eotg_inh_heir.GetFirstName] is my rival, so I read the report for what it gains [eotg_inh_heir.GetHerHim]."
 eotg_aug_inherit.001.bond_estranged:0 "\n\n[eotg_inh_heir.GetFirstName] has had no warmth for me for some time, and I have had none to spare."
 eotg_aug_inherit.001.bond_claimant:0 "\n\n[eotg_inh_heir.GetFirstName] has always wanted the seat, and an ambitious heir with a failing implant is a danger to me."
 eotg_aug_inherit.001.bond_favourite:0 "\n\nI am fond of [eotg_inh_heir.GetFirstName], and that makes the report harder to read."
 eotg_aug_inherit.001.bond_dutiful:0 "\n\n[eotg_inh_heir.GetFirstName] has always kept to the duties of the heir's place, which makes the report harder for me to wave away."
 eotg_aug_inherit.001.src_cascade:0 "\n\nThe break was sudden. [eotg_inh_heir.GetFirstName] came out of a neural cascade changed, and I have not seen [eotg_inh_heir.GetHerHim] settled since."
 eotg_aug_inherit.001.src_report:0 "\n\nIt came as small reports over months, until my staff pieced the picture together."
 eotg_aug_inherit.001.a:0 "Summon [eotg_inh_heir.GetFirstName] to my quarters."
 eotg_aug_inherit.001.a.tt:0 "[eotg_inh_heir.GetFirstName] will be brought before you."
 eotg_aug_inherit.001.b:0 "Send for the physicians before anyone else."
 eotg_aug_inherit.001.c:0 "Say nothing. Watch [eotg_inh_heir.GetFirstName] closely."
 eotg_aug_inherit.001.d:0 "I'll go to [eotg_inh_heir.GetFirstName] myself, before the next watch."
 eotg_aug_inherit.001.e:0 "The succession is mine to settle. Convene the council."
 eotg_aug_inherit.002.t:0 "The Conversation"
 eotg_aug_inherit.002.desc_rage:0 "[eotg_inh_heir.GetFirstName] will not sit. I see [eotg_inh_heir.GetHerHim] walk the length of the room and back, working a hand that has split at the knuckles. A dented cup sits on the table where it was thrown. "My hand closed before I decided," [eotg_inh_heir.GetSheHe] says. "I watched it close.""
 eotg_aug_inherit.002.desc_ledger:0 "[eotg_inh_heir.GetFirstName] lays slates across the table in front of me and squares the edges. [eotg_inh_heir.GetSheHe|U] does not look up. "The shift gaps are all here," [eotg_inh_heir.GetSheHe] says, tapping a column of names. "I know how I will move, so I know how the rest will. It is only arithmetic.""
 eotg_aug_inherit.002.desc_cold:0 "[eotg_inh_heir.GetFirstName] sits with both hands flat on [eotg_inh_heir.GetHerHis] knees, and the cup beside [eotg_inh_heir.GetHerHim] is full and cold. I put each question, and each time [eotg_inh_heir.GetSheHe] replies in one complete, courteous sentence. "I am attending to my duties," [eotg_inh_heir.GetSheHe] says. "There is nothing I need.""
 eotg_aug_inherit.002.desc_certain:0 "[eotg_inh_heir.GetFirstName] takes the chair in front of me without being asked and settles back into it. "The guards already do as I say," [eotg_inh_heir.GetSheHe] says pleasantly. "You will see how little changes when the seat is mine.""
 eotg_aug_inherit.002.bond_rival:0 "\n\nThe room has an edge to it. [eotg_inh_heir.GetFirstName] and I are rivals, and each of us is waiting to hear what the other will concede."
 eotg_aug_inherit.002.bond_estranged:0 "\n\nI have not sat this close to [eotg_inh_heir.GetFirstName] in a long time. Neither of us has found the first sentence."
 eotg_aug_inherit.002.bond_claimant:0 "\n\n[eotg_inh_heir.GetFirstName] watches me throughout, with the patience of someone who expects to inherit the room."
 eotg_aug_inherit.002.bond_favourite:0 "\n\nIt is hard for me to look at [eotg_inh_heir.GetFirstName] and see only a problem to be managed."
 eotg_aug_inherit.002.bond_dutiful:0 "\n\n[eotg_inh_heir.GetFirstName] keeps to the forms of the heir's place even now, and that makes the talk harder for me, not easier."
 eotg_aug_inherit.002.a:0 "Stay. We face this together."
 eotg_aug_inherit.002.b:0 "You will see the physicians. Not a request."
 eotg_aug_inherit.002.c:0 "Give up the succession. Quietly."
 eotg_aug_inherit.002.p_rage:0 "Sit with [eotg_inh_heir.GetFirstName] until it passes."
 eotg_aug_inherit.002.p_ledger:0 "Show me the list you made."
 eotg_aug_inherit.002.p_cold:0 "Do you want to stop this?"
 eotg_aug_inherit.002.p_certain:0 "You do not rule here yet."
 eotg_aug_inherit.002.d:0 "Get out of my sight."
 eotg_aug_inherit.003.t:0 "The Physicians"
 eotg_aug_inherit.003.desc_refused:0 "The physician has laid out the instruments and has nobody to examine. [eotg_inh_heir.GetFirstName] sent word that the answer was no, and has not come. I stand near the door beside the physician, waiting. Neither of us says what [eotg_inh_heir.GetSheHe] might do next."
 eotg_aug_inherit.003.desc_storm:0 "The physician has the portable unit running and does not like what it shows. I stand close enough to feel the heat coming off the port at the base of [eotg_inh_heir.GetFirstName]'s skull. "The casing is past its tolerances," the physician says quietly. "Any strain could set off a seizure, and I cannot promise it stops there.""
 eotg_aug_inherit.003.desc_fracture:0 "The consultation room smells of antiseptic and warm housings. [eotg_inh_heir.GetFirstName] grips the edge of the couch while I watch the physician read the panel. "The insulation is failing," the physician says. "The episodes are getting longer, and if this is left alone the clear stretches between episodes will shrink. I cannot tell you how fast.""
 eotg_aug_inherit.003.desc_flicker:0 "The physician runs the diagnostics twice while I wait. [eotg_inh_heir.GetFirstName] sits very still on the couch, and the panel shows only small faults: a twitch in a hand, a reading that arrives late. "It is early," the physician says. "Act now, and there is still a great deal that can be saved.""
 eotg_aug_inherit.003.a:0 "Have the implant cut out of [eotg_inh_heir.GetFirstName]."
 eotg_aug_inherit.003.b:0 "Hold it down. Sedation, and a locked ward."
 eotg_aug_inherit.003.c:0 "Find a back-street fitter who charges less."
 eotg_aug_inherit.003.d:0 "I'll stand at the table myself."
 eotg_aug_inherit.003.a_ref:0 "Find [eotg_inh_heir.GetFirstName]. Bring [eotg_inh_heir.GetHerHim] back."
 eotg_aug_inherit.003.b_ref:0 "Let [eotg_inh_heir.GetFirstName] go, and send no one after."
 eotg_aug_inherit.004.t:0 "The Watch"
 eotg_aug_inherit.004.desc_rage:0 "[eotg_inh_heir.GetFirstName] paced the maintenance spaces under the residence for hours, then put a fist through an environmental panel and sat against the conduit with coolant hissing from the broken housing, shaking. When the watch reached [eotg_inh_heir.GetHerHim], the pacing had stopped."
 eotg_aug_inherit.004.desc_ledger:0 "The watch recovered a slate from the waste chute outside [eotg_inh_heir.GetFirstName]'s quarters. It is another list, and this one carries the names of people close to the seat, with transit times and guard response times written beside each. Whatever [eotg_inh_heir.GetSheHe] is working out, [eotg_inh_heir.GetSheHe] is working it out about those people."
 eotg_aug_inherit.004.desc_cold:0 "The watch reports that [eotg_inh_heir.GetFirstName] sat in an unlit antechamber for a full shift, hands folded, and did not look up when the door opened. Attendants offered food and adjusted the vents. [eotg_inh_heir.GetSheHe|U] thanked each attendant, and asked only that the door be closed."
 eotg_aug_inherit.004.desc_certain:0 "[eotg_inh_heir.GetFirstName] stopped a group of petitioners in the passage outside the audience chamber and heard the grievances with every sign of authority, then told the petitioners to come back once the seat is [eotg_inh_heir.GetHerHis]. The petitioners left unsure whether it had been a joke, the watch reports."
 eotg_aug_inherit.004.a:0 "Keep the watch posted and see what comes."
 eotg_aug_inherit.004.b:0 "Put [eotg_inh_heir.GetFirstName] on the next ship out."
 eotg_aug_inherit.004.b.tt:0 "A berth on an outbound ship will be found for [eotg_inh_heir.GetFirstName]."
 eotg_aug_inherit.004.c:0 "Take this to the council."
 eotg_aug_inherit.004.c.tt:0 "The council will be called to sit on it."
 eotg_aug_inherit.004.d:0 "Let [eotg_inh_heir.GetFirstName] be lost in transit."
 eotg_aug_inherit.005.t:0 "The Council"
 eotg_aug_inherit.005.desc:0 "The council sits behind closed doors with the reports laid out. The question is the line: who stands where if [eotg_inh_heir.GetFirstName] cannot be trusted with the seat, and what the realm is told in the meantime. Each councillor chooses words with care, and watches the others for the effect."
 eotg_aug_inherit.005.desc_second:0 "\n\nThe council is aware that the next name in the line after [eotg_inh_heir.GetFirstName] is [eotg_inh_second.GetTitledFirstName]'s, and avoids saying so."
 eotg_aug_inherit.005.a:0 "Strike [eotg_inh_heir.GetFirstName] from the line."
 eotg_aug_inherit.005.b:0 "I'll step down while I can still set terms."
 eotg_aug_inherit.005.c:0 "Nothing changes. [eotg_inh_heir.GetFirstName] stays first."
 eotg_aug_inherit.005.d:0 "Hear what [eotg_inh_second.GetFirstName] proposes, in private."
 eotg_aug_inherit.006.t:0 "The Terms"
 eotg_aug_inherit.006.desc_accept:0 "I lay out the terms: a course of sedation, and a standing check on the readings. [eotg_inh_heir.GetFirstName] reads them through, and the tremor in [eotg_inh_heir.GetHerHis] hands does not stop. "I will keep to it," [eotg_inh_heir.GetSheHe] says. "Hold me to it." Neither of us says that it will be easy."
 eotg_aug_inherit.006.refuse_rage:0 "[eotg_inh_heir.GetFirstName] pushes the slate back across the table to me. [eotg_inh_heir.GetSheHe|U] is not shouting. The cords of [eotg_inh_heir.GetHerHis] neck stand out, and the hand flat on the table is shaking. "I'll break the terms. You know I will," [eotg_inh_heir.GetSheHe] says, and outside the door the staff have stopped pretending not to listen."
 eotg_aug_inherit.006.refuse_ledger:0 "[eotg_inh_heir.GetFirstName] reads the terms through once and sets the slate down in front of me, squared to the edge of the table. "You'd only be next on it," [eotg_inh_heir.GetSheHe] says, almost gently. "I have already worked out how this goes. It does not help either of us.""
 eotg_aug_inherit.006.refuse_cold:0 "[eotg_inh_heir.GetFirstName] looks at the slate, then past it. "There's nothing to agree to," [eotg_inh_heir.GetSheHe] says, in the same level voice as before. "I will not oppose you. I will not promise anything either." I wait for the rest of it. There is no rest of it."
 eotg_aug_inherit.006.refuse_certain:0 "[eotg_inh_heir.GetFirstName] smiles at me and does not pick the terms up. "Terms are for people who might lose," [eotg_inh_heir.GetSheHe] says. "Save the effort for someone who needs it." [eotg_inh_heir.GetSheHe|U] stands, straightens [eotg_inh_heir.GetHerHis] collar, and leaves as though the meeting had gone well. The guards at the door step aside without being told."
 eotg_aug_inherit.006.a:0 "Then we hold each other to it."
 eotg_aug_inherit.006.b:0 "And the physicians are part of the terms."
 eotg_aug_inherit.006.c:0 "Then I'll meet you where you are."
 eotg_aug_inherit.006.ra:0 "Then the council decides."
 eotg_aug_inherit.006.rb:0 "I will give you time to think it over."
 eotg_aug_inherit.007.t:0 "The Answer"
 eotg_aug_inherit.007.desc:0 "I put the hardest question the line allows to [eotg_inh_heir.GetFirstName]: whether [eotg_inh_heir.GetSheHe] will step aside, quietly, before it is taken out of [eotg_inh_heir.GetHerHis] hands. I ask it plainly, with the guard sent out of the room, and I wait."
 eotg_aug_inherit.007.accept:0 "\n\n[eotg_inh_heir.GetFirstName] is silent for a long moment, and I let it run. "Yes," [eotg_inh_heir.GetSheHe] says. "I am tired of fighting my own skull. Let someone else carry it.""
 eotg_aug_inherit.007.refuse:0 "\n\n[eotg_inh_heir.GetFirstName] shakes [eotg_inh_heir.GetHerHis] head once, looking straight at me. "No," [eotg_inh_heir.GetSheHe] says. "Not this. Ask me for anything else.""
 eotg_aug_inherit.007.a:0 "Thank you. The line will be changed."
 eotg_aug_inherit.007.b:0 "No. Stay my heir. I only had to know."
 eotg_aug_inherit.007.ra:0 "Then I'll do it for you."
 eotg_aug_inherit.007.rb:0 "Forget I asked. We will speak later."
 eotg_aug_inherit.008.t:0 "The Ward"
 eotg_aug_inherit.008.desc:0 "The sedation is drawn up and the guard captain has a detail waiting. All that is left for me to set is the ward: [eotg_inh_heir.GetFirstName] confined to quarters, with a medic on call, or put in the cells and left there."
 eotg_aug_inherit.008.a:0 "Confine [eotg_inh_heir.GetFirstName] to quarters, with a medic on call."
 eotg_aug_inherit.008.b:0 "Restraints, and a guard who does not talk."
 eotg_aug_inherit.009.t:0 "The Pattern"
 eotg_aug_inherit.009.desc_kill_ruler:0 "The guard captain brings me the roster. [eotg_inh_heir.GetFirstName] has been asking the watch about the rotation outside my quarters: who holds the access codes, and when the shifts change. Nothing [eotg_inh_heir.GetSheHe] has asked is forbidden. All of it adds up to one question, and the asking was careful."
 eotg_aug_inherit.009.desc_massacre:0 "The staff have begun to leave a room when [eotg_inh_heir.GetFirstName] comes into it. My reports have [eotg_inh_heir.GetHerHim] pacing the lower corridors for hours, one hand opening and closing, stopping at each sealed door as if it were a question. Nothing has happened yet, and I find myself listening for it."
 eotg_aug_inherit.009.desc_next_two:0 "A records clerk brings me something small and wrong. [eotg_inh_heir.GetFirstName] has asked for the movement records and medical files of the people next in the line, and has read the files with care. Every request is within [eotg_inh_heir.GetHerHis] rights. Together the requests are no accident."
 eotg_aug_inherit.009.desc_self:0 "[eotg_inh_heir.GetFirstName]'s quarters have gone quiet in a way the staff do not like, and they have told me so. Accounts have been settled. Small belongings have been given to junior attendants, with thanks. [eotg_inh_heir.GetSheHe|U] replies to every message on the first try, and asks for nothing. Nothing has been said, and I have noticed."
 eotg_aug_inherit.009.a:0 "Arrest [eotg_inh_heir.GetFirstName] before the next watch."
 eotg_aug_inherit.009.a.tt:0 "An arrest will be attempted. It may fail."
 eotg_aug_inherit.009.a_fail_tt:0 "The arrest failed."
 eotg_aug_inherit.009.b:0 "Double the guard and wait."
 eotg_aug_inherit.009.b.tt:0 "The guard is doubled. Whatever comes, comes later."
 eotg_aug_inherit.009.c:0 "Go to [eotg_inh_heir.GetFirstName]. Talk [eotg_inh_heir.GetHerHim] down."
 eotg_aug_inherit.009.c.tt:0 "The talk may or may not reach [eotg_inh_heir.GetFirstName]."
 eotg_aug_inherit.009.d:0 "Choose the ground. If it comes for me, it meets me there."
 eotg_aug_inherit.009.d.tt:0 "If [eotg_inh_heir.GetFirstName] comes for me or the residence, the guard is set on ground I chose."
 eotg_aug_inherit.009.e:0 "End it before [eotg_inh_heir.GetFirstName] does."
 eotg_aug_inherit.010.t:0 "The Table"
 eotg_aug_inherit.010.desc_physician:0 "The surgical suite is prepped and the diagnostics are up. The surgeon is plain with me about it: there are three ways this goes, clean, costly or fatal, and the lights over the table will not say which until it is done. The surgeon has asked me twice whether I am sure."
 eotg_aug_inherit.010.desc_back:0 "The clinic is two levels below the docks, and the fitter cleans the tools with antiseptic spray while talking to me about the price. It is modest. The fitter does not say how often it has gone well. There are three ways this goes, clean, costly or fatal, and here I think the last is likelier."
 eotg_aug_inherit.010.desc_self:0 "I scrub in and check the calibration of the probes myself. The sedation is already in. I know [eotg_inh_heir.GetFirstName]'s case better than any hired fitter would. That helps. It does not change how this can end. My hands are steady. I check anyway."
 eotg_aug_inherit.010.coerced:0 "\n\n[eotg_inh_heir.GetFirstName] is here because I ordered it, and says nothing as the straps are checked."
 eotg_aug_inherit.010.a:0 "Begin. Take the time it needs."
 eotg_aug_inherit.010.b:0 "Begin. I will stay beside [eotg_inh_heir.GetFirstName] throughout."
 eotg_aug_inherit.010.c:0 "Not yet. Step away from the table."
 eotg_aug_inherit.010.tt:0 "The excision begins. How it ends is decided on the table."
 eotg_aug_inherit.011.t:0 "Passage Out"
 eotg_aug_inherit.011.desc:0 "A berth is booked on an outbound ship. [eotg_inh_heir.GetFirstName] waits at the boarding ramp with one bag, not under arrest and not quite free. Nobody has said where the ship is bound. "Is that the whole of it?" [eotg_inh_heir.GetSheHe] asks. [eotg_inh_heir.GetFirstName] is still in the line, and the departure changes nothing about that unless I say it does."
 eotg_aug_inherit.011.a:0 "Take the berth. Don't come back."
 eotg_aug_inherit.011.b:0 "Go, with passage and credit, and my word."
 eotg_aug_inherit.011.c:0 "Take the berth. You are no longer my heir."
 eotg_aug_inherit.012.t:0 "The Shuttle That Never Docked"
 eotg_aug_inherit.012.desc:0 "I have the story ready: a shuttle between waypoints, a drive fault, no distress call. I have written the residence logs to match. The truth is a berth on a freighter for [eotg_inh_heir.GetFirstName], and a court that will mourn an empty place. "How long do I stay dead?" [eotg_inh_heir.GetSheHe] asks from the doorway. Once I seal the logs, there is no taking it back."
 eotg_aug_inherit.012.a:0 "Do it. Seal the logs."
 eotg_aug_inherit.012.b:0 "No. I cannot do this."
 eotg_aug_inherit.012.exposed_tt:0 "A dockhand saw the heir alive."
 eotg_aug_inherit.013.t:0 "Struck from the Line"
 eotg_aug_inherit.013.desc_accept:0 "The order is read aloud in the council chamber, and [eotg_inh_heir.GetFirstName] stands through it without argument. When it is done, [eotg_inh_heir.GetSheHe] nods once. "Put it in the record plainly," [eotg_inh_heir.GetSheHe] says, and sits down. The line has a gap where [eotg_inh_heir.GetSheHe] was, and the room does not quite look at it. The council records the change and moves on, too quickly."
 eotg_aug_inherit.013.desc_leave:0 "The order is read aloud. [eotg_inh_heir.GetFirstName] listens to the end, turns, and walks out without a word. By the time the guard goes looking, [eotg_inh_heir.GetSheHe] is packing: a kit bag, a few things from the quarters, a berth on the next ship from the docks."
 eotg_aug_inherit.013.desc_violent:0 "I have the order read aloud, and [eotg_inh_heir.GetFirstName] moves before it is finished, lunging at the one reading it. My guards reach [eotg_inh_heir.GetHerHim] first and put [eotg_inh_heir.GetHerHim] on the floor, and the rest of the room backs to the walls. "Take it back!" [eotg_inh_heir.GetSheHe] shouts, still fighting."
 eotg_aug_inherit.013.a:0 "It is settled. Note the change in the line."
 eotg_aug_inherit.013.la:0 "Let [eotg_inh_heir.GetFirstName] leave without hindrance."
 eotg_aug_inherit.013.lb:0 "Bring [eotg_inh_heir.GetFirstName] back under guard."
 eotg_aug_inherit.013.va:0 "Post extra guards around the new line."
 eotg_aug_inherit.013.va.tt:0 "The new line is guarded. [eotg_inh_heir.GetFirstName] has not finished."
 eotg_aug_inherit.013.vb:0 "Lock [eotg_inh_heir.GetFirstName] in the cells before anything worse."
 eotg_aug_inherit.013.vc:0 "End this. Quietly, and for good."
 eotg_aug_inherit.014.t:0 "The Hand-Off"
 eotg_aug_inherit.014.desc:0 "The documents are laid out between me and [eotg_inh_heir.GetFirstName]: the transfer of the seat, ready for both our signatures. "I'll sign whichever you put in front of me," [eotg_inh_heir.GetSheHe] says. I can step aside now and stay on as warden over [eotg_inh_heir.GetHerHis] hand, or give it over clean and leave. Neither can be taken back. I have thought about it long enough to know both outcomes."
 eotg_aug_inherit.014.a:0 "Step down, and stay on as warden."
 eotg_aug_inherit.014.b:0 "Quietly. No warden. It's [eotg_inh_heir.GetHerHis] now."
 eotg_aug_inherit.014.c:0 "Not yet. I need more time."
 eotg_aug_inherit.015.t:0 "The Offer"
 eotg_aug_inherit.015.desc:0 "[eotg_inh_second.GetTitledFirstName] asks me for a private audience and closes the door. [eotg_inh_second.GetSheHe|U] has clearly rehearsed this. "We both see what [eotg_inh_heir.GetFirstName] is becoming," [eotg_inh_second.GetSheHe] says, low. "There are quiet ways to end it. Say the word, and you need never hear how.""
 eotg_aug_inherit.015.a:0 "Do what you must. I don't want to know."
 eotg_aug_inherit.015.b:0 "No. If [eotg_inh_heir.GetFirstName] dies, I will know whose hand."
 eotg_aug_inherit.015.b.tt:0 "[eotg_inh_second.GetFirstName] may act anyway."
 eotg_aug_inherit.015.c:0 "Say that to [eotg_inh_heir.GetFirstName]'s face."
 eotg_aug_inherit.016.t:0 "The List"
 eotg_aug_inherit.016.desc_ledger:0 "A list was left where it happened: the people between [eotg_inh_heir.GetFirstName] and the seat, set down in [eotg_inh_heir.GetHerHis] own neat hand, and marked in turn. [eotg_inh_heir.GetSheHe|U] had not hurried. The residence learned of it by report, in pieces, and by the time the pieces agreed there was no undoing any of it. When I ask why, [eotg_inh_heir.GetFirstName] says only: "It was settled before I wrote the first name.""
 eotg_aug_inherit.016.desc_neutral:0 "[eotg_inh_heir.GetFirstName] had worked out who stood between [eotg_inh_heir.GetHerHim] and the seat, and had acted on it. The alarms came late. The residence learned of it from reports that arrived one after another and did not agree, until the last one settled the question. When I ask why, [eotg_inh_heir.GetFirstName] says only: "I knew I would.""
 eotg_aug_inherit.016.count_two:0 "\n\n[eotg_inh_killed_a.GetTitledFirstName] and [eotg_inh_killed_b.GetTitledFirstName] are both dead."
 eotg_aug_inherit.016.spared:0 "\n\n[eotg_inh_killed_a.GetTitledFirstName] is dead. [eotg_inh_spared.GetTitledFirstName] was hurt, and lives."
 eotg_aug_inherit.016.desc_one:0 "\n\n[eotg_inh_killed_a.GetTitledFirstName] is dead."
 eotg_aug_inherit.016.child:0 "\n\n[eotg_inh_child_victim.GetFirstName] was a child."
 eotg_aug_inherit.016.a:0 "Have the guards take [eotg_inh_heir.GetFirstName] into custody."
 eotg_aug_inherit.016.b:0 "Have [eotg_inh_heir.GetFirstName] executed for what was done."
 eotg_aug_inherit.016.c:0 "Keep [eotg_inh_heir.GetFirstName] in the line, whatever it costs."
 eotg_aug_inherit.017.t:0 "Blast Doors"
 eotg_aug_inherit.017.desc:0 "The alarms went first, then the blast doors. By the time the guards and I reached the corridor it was over, and [eotg_inh_heir.GetFirstName] stood in the middle of it, shaking. The guards hold at the sealed doors, waiting for my word."
 eotg_aug_inherit.017.from_ward:0 "\n\nThe ward did not hold. My guards found the door open."
 eotg_aug_inherit.017.ready:0 "\n\nI had been waiting for this, and so had my guard."
 eotg_aug_inherit.017.killed:0 "\n\n[eotg_inh_dead_1.GetTitledFirstName] is among the dead, and the count that has reached me stands at [ROOT.Char.MakeScope.Var('eotg_inh_dead_count').GetValue|0]."
 eotg_aug_inherit.017.none:0 "\n\nThe corridors were nearly empty, and the fury found me instead. I am hurt."
 eotg_aug_inherit.017.wounded:0 "\n\n[eotg_inh_wounded.GetTitledFirstName] was hurt as well, and lives. My guards say so before anything else."
 eotg_aug_inherit.017.a:0 "Subdue [eotg_inh_heir.GetFirstName] and take [eotg_inh_heir.GetHerHim] alive."
 eotg_aug_inherit.017.b:0 "Cut [eotg_inh_heir.GetFirstName] down where [eotg_inh_heir.GetSheHe] stands."
 eotg_aug_inherit.017.c:0 "Hold [eotg_inh_heir.GetFirstName] until the shaking stops."
 eotg_aug_inherit.018.t:0 "The Last Audience"
 eotg_aug_inherit.018.desc_rival:0 "[eotg_inh_heir.GetFirstName] comes into my audience chamber without announcement and shuts the door. There is a weapon in [eotg_inh_heir.GetHerHis] hand, held low and steady. [eotg_inh_heir.GetSheHe|U] has not raised it yet. The few steps between us are closing slowly. "We have done this long enough," [eotg_inh_heir.GetSheHe] says. "It ends here, one way.""
 eotg_aug_inherit.018.desc_estranged:0 "[eotg_inh_heir.GetFirstName] stands just inside my door, unsummoned. The weapon at [eotg_inh_heir.GetHerHis] side is held loosely, like something borrowed. Neither of us moves. "You stopped looking at me a long time ago," [eotg_inh_heir.GetSheHe] says. "Look at me now.""
 eotg_aug_inherit.018.desc_claimant:0 "[eotg_inh_heir.GetFirstName] crosses my audience chamber toward my seat with a weapon drawn and no hurry at all. The chamber has never seemed so large to me. "You have held it long enough," [eotg_inh_heir.GetSheHe] says, as if reading from a schedule."
 eotg_aug_inherit.018.desc_favourite:0 "[eotg_inh_heir.GetFirstName] stands before my seat with a weapon in a shaking hand and tears on [eotg_inh_heir.GetHerHis] face. The weapon is not raised. It is shaking too much to be raised, yet. "Forgive me," [eotg_inh_heir.GetSheHe] says. "My hand moved before I did. It always does now.""
 eotg_aug_inherit.018.desc_dutiful:0 "[eotg_inh_heir.GetFirstName] comes to attention before my seat, the weapon held correctly, as if it were any other duty. The weapon is not raised yet. "Someone must secure the line," [eotg_inh_heir.GetSheHe] says, in the even cadence of a report. "Better that it is me.""
 eotg_aug_inherit.018.a:0 "Shout for the guards and step back."
 eotg_aug_inherit.018.tt:0 "What happens next is not yours to decide."
 eotg_aug_inherit.018.b:0 "Say [eotg_inh_heir.GetFirstName]'s name. Make [eotg_inh_heir.GetHerHim] hear it."
 eotg_aug_inherit.018.c:0 "Face [eotg_inh_heir.GetFirstName] yourself."
 eotg_aug_inherit.018.fail_tt:0 "The attempt failed. You are hurt, and alive."
 eotg_aug_inherit.019.t:0 "The Quiet Room"
 eotg_aug_inherit.019.desc_cold:0 "The attendants found [eotg_inh_heir.GetFirstName]'s quarters in perfect order. [eotg_inh_heir.GetFirstName] had replied to every message and settled every account, and left nothing unfinished but [eotg_inh_heir.GetHerselfHimself]. The medic confirmed the death within the hour. There was nothing else in the room to learn."
 eotg_aug_inherit.019.desc_cascade:0 "[eotg_inh_heir.GetFirstName] died in a neural cascade. The attendants found [eotg_inh_heir.GetHerHim] within the hour, and the medic confirmed it: the implant had failed all at once, as the reports had said it might. There was no time in it for anyone to help, and nothing anyone could have done."
 eotg_aug_inherit.019.a:0 "Lay [eotg_inh_heir.GetFirstName] to rest as my heir."
 eotg_aug_inherit.019.b:0 "Tell the court it was a cascade."
 eotg_aug_inherit.019.c:0 "Say nothing. It settled itself."
 eotg_aug_inherit.020.t:0 "Two Machines"
 eotg_aug_inherit.020.desc:0 "[eotg_inh_heir.GetFirstName] and I are alone in the diagnostic bay, each reading the other's panel. "Your numbers hold steadier than mine," [eotg_inh_heir.GetSheHe] says. My own implants are heavy enough that I know what [eotg_inh_heir.GetSheHe] is feeling. There is a way to meet [eotg_inh_heir.GetHerHim] there: take the limits off, and let mine run as far ahead as [eotg_inh_heir.GetHerHis] do. It would cost me what it has cost [eotg_inh_heir.GetHerHim]."
 eotg_aug_inherit.020.a:0 "Take the limits off. Meet [eotg_inh_heir.GetFirstName] there."
 eotg_aug_inherit.020.b:0 "No. One of us is enough."
 eotg_aug_inherit.021.t:0 "After the Table"
 eotg_aug_inherit.021.desc_dead:0 "The surgical team comes out slowly, and one look says it. The excision went wrong on the table, and [eotg_inh_heir.GetFirstName] did not come back from it. The team tried for as long as there was anything to try, and said so before I could ask. The table is being cleaned now."
 eotg_aug_inherit.021.desc_maimed:0 "The excision succeeded, and it cost. The implant is out, and the fracture is gone with it. [eotg_inh_heir.GetFirstName] will wake, and will not be the same: the surgeon says the damage is permanent. Whatever recovery there is will take years. The surgeon has asked to speak with me privately."
 eotg_aug_inherit.021.desc_clean:0 "The excision went clean. The implant is out and the fracture is gone with it. [eotg_inh_heir.GetFirstName] is awake and slow and entirely [eotg_inh_heir.GetHerselfHimself], and the scans are clear. Recovery will take years, but there is nothing left in the readings to fear. The surgeon sets down the probe and, for once, has nothing to add."
 eotg_aug_inherit.021.a:0 "[eotg_inh_heir.GetFirstName] is still [eotg_inh_heir.GetFirstName], and that matters."
 eotg_aug_inherit.021.b:0 "Whatever [eotg_inh_heir.GetSheHe] is now, the line can use it."
 eotg_aug_inherit.021.da:0 "Lay [eotg_inh_heir.GetFirstName] to rest with an heir's honours."
 eotg_aug_inherit.021.db:0 "The table had its odds. I chose them."
 eotg_aug_inherit.022.t:0 "Kept Terms"
 eotg_aug_inherit.022.desc_holding:0 "A year on, [eotg_inh_heir.GetFirstName] is keeping to the terms. The checks are attended, the sedation taken, the readings steady for the first time in a long while. The staff have stopped watching the doors when [eotg_inh_heir.GetSheHe] passes. "Don't let me get used to it," [eotg_inh_heir.GetSheHe] says at the check. This is no cure, only a year without a fall."
 eotg_aug_inherit.022.desc_slipping:0 "A year on, the terms are fraying. [eotg_inh_heir.GetFirstName] has missed checks and snapped at attendants, and the readings climb again whatever the sedation does. The medic does not use the word failure. The medic does not need to. The terms lie on the table unchanged. "I know what the slate says," [eotg_inh_heir.GetFirstName] tells the medic, and does not look at it."
 eotg_aug_inherit.022.a:0 "Another year on the same terms."
 eotg_aug_inherit.022.b:0 "Tighten the terms. Check more often."
 eotg_aug_inherit.022.sa:0 "Then we start again. Now."
 eotg_aug_inherit.022.sb:0 "I cannot carry both of us through this."
 eotg_aug_inherit.023.t:0 "The Locked Wing"
 eotg_aug_inherit.023.desc_quarters:0 "Months on, the ward has held. [eotg_inh_heir.GetFirstName] spends the days in the quarters, sedated and quiet, at the viewport or on the bunk, with an attendant posted outside and the panel by the door reading steady. "How many days now?" [eotg_inh_heir.GetSheHe] asks the attendant at the door. The residence is calmer. Nobody calls it peace, and nobody says why."
 eotg_aug_inherit.023.desc_cells:0 "Months on, the ward has held. [eotg_inh_heir.GetFirstName] is in the cells behind a sealed door, with a panel outside that reads steady and a guard who changes every shift. "Leave the light on," [eotg_inh_heir.GetSheHe] tells each new guard. I was told the cells would hold, and the doors have held. The residence is safe. It does not feel like it."
 eotg_aug_inherit.023.a:0 "Keep the ward as it is."
 eotg_aug_inherit.023.b:0 "Go and sit with [eotg_inh_heir.GetFirstName] a while."
 eotg_aug_inherit.024.t:0 "Still Breathing"
 eotg_aug_inherit.024.desc:0 "I am on the floor with my back to the wall, bleeding, and my guards have [eotg_inh_heir.GetFirstName] face down on the deck. The weapon lies across the room where it landed. [eotg_inh_heir.GetSheHe|U] has stopped struggling, and watches me, waiting to hear what I will say. "Is it over?" [eotg_inh_heir.GetSheHe] asks."
 eotg_aug_inherit.024.a:0 "Order the execution of [eotg_inh_heir.GetFirstName]."
 eotg_aug_inherit.024.b:0 "Put [eotg_inh_heir.GetFirstName] in the cells and leave [eotg_inh_heir.GetHerHim] there."
 eotg_aug_inherit.024.c:0 "I forgive you. Don't make me regret it."
 eotg_aug_inherit.025.t:0 "The Seat"
 eotg_aug_inherit.025.desc_ledger:0 "The [ROOT.Char.Custom('eotg_court_seat')] is quiet now. It all went the way I had written it down, name by name, and the list is still folded in my hand. I was sure of every line. I am still sure. The guards at the doors have not decided how to look at me."
 eotg_aug_inherit.025.desc_certain:0 "The [ROOT.Char.Custom('eotg_court_seat')] is quiet, and it is mine. It went the way I'd already decided it would. [eotg_inh_old_ruler_s.GetTitledFirstName] is dead, and the room has begun to arrange itself around the fact. The guards at the doors look at me as before, only more attentively. The staff bring me the first papers without being asked."
 eotg_aug_inherit.025.desc_shared:0 "It is over. [eotg_inh_old_ruler_s.GetTitledFirstName] is dead, and I cannot say with confidence when I decided. The guards are looking at me to learn what I am now. The [ROOT.Char.Custom('eotg_court_seat')] is mine, and the first order is waiting for me."
 eotg_aug_inherit.025.a:0 "The seat was always going to be mine."
 eotg_aug_inherit.025.b:0 "That wasn't a forecast. That was me."
 eotg_aug_inherit.025.c:0 "Take the seat, and give the first order."
 eotg_aug_inherit.026.t:0 "The Warden's Hand"
 eotg_aug_inherit.026.desc_warden:0 "I hold the [ROOT.Char.Custom('eotg_court_seat')], and [eotg_inh_old_ruler.GetTitledFirstName] holds the controls. Every paper crosses [eotg_inh_old_ruler.GetFirstName]'s desk before it reaches mine, and the staff still bring questions to the older hand first. "Ask me when you need to. Don't ask me when you don't," [eotg_inh_old_ruler.GetFirstName] says, and slides the day's first paper across to me. I have the title. The routine has not caught up. I may keep that arrangement or end it, and the staff are watching which I choose."
 eotg_aug_inherit.026.desc_none:0 "I hold the [ROOT.Char.Custom('eotg_court_seat')], and no warden stands beside me. [eotg_inh_old_ruler.GetTitledFirstName] has stepped back. The first paper on the table is waiting for my mark, and the staff are waiting to see what kind of ruler signs it. "Whatever you mark first, mean it," [eotg_inh_old_ruler.GetFirstName] says from the door. The room expects me to say something."
 eotg_aug_inherit.026.a:0 "Let [eotg_inh_old_ruler.GetFirstName] hold the controls a while."
 eotg_aug_inherit.026.b:0 "I don't need a keeper."
 eotg_aug_inherit.026.na:0 "Mine. Now it's mine."
 eotg_aug_inherit.026.nb:0 "Ask [eotg_inh_old_ruler.GetFirstName] to stay close."
 eotg_aug_inherit.027.t:0 "The Line Shortens"
 eotg_aug_inherit.027.desc_leave:0 "[eotg_inh_second.GetTitledFirstName] comes to me in person, standing, in the voice of someone reporting a repair. [eotg_inh_heir.GetFirstName] is dead. It was done quietly, with my leave. "You will not have to think of it again," [eotg_inh_second.GetSheHe] says, and waits to be told that it was well done. The residence will ask no questions that I do not ask myself."
 eotg_aug_inherit.027.desc_no_leave:0 "[eotg_inh_second.GetTitledFirstName] comes to me before anyone else does. [eotg_inh_heir.GetFirstName] is dead, and it was done without my leave. "The line needed shortening, and I shortened it," [eotg_inh_second.GetSheHe] says, and does not apologize. The residence has already begun to talk. Whatever it is told, I know whose hand it was."
 eotg_aug_inherit.027.a:0 "Let it stand and say nothing more."
 eotg_aug_inherit.027.b:0 "Have [eotg_inh_second.GetFirstName] arrested for it."
 eotg_aug_inherit.027.c:0 "Have [eotg_inh_second.GetFirstName] executed for the killing."
 eotg_aug_inherit.ward_breakout_tt:0 "The ward's door was found open."
 eotg_aug_inherit.route_threat_tt:0 "Whatever [eotg_inh_heir.GetFirstName] is building will not wait."
 eotg_aug_inherit.ward_tt:0 "The ward may not hold [eotg_inh_heir.GetFirstName]."
 eotg_mod_aug_inh_terms:0 "Succession on Terms"
 eotg_mod_aug_inh_terms_desc:0 "The realm's vassals do not trust a succession that rests on your heir's terms holding."
 eotg_mod_aug_inh_emptied_court:0 "Emptied Court"
 eotg_mod_aug_inh_emptied_court_desc:0 "The court saw a killing it could not stop. People keep close to the exits now, and the residence is quieter than it was."

 # event_quality_v1 W3: outcome toasts and messages (title-only)
 eotg_aug_inherit.002.toast_p_rage_hurt:0 "Hurt Sitting Through the Rage"
 eotg_aug_inherit.003.msg_b_ref:0 "Having refused the physicians, you are sent away from court."
 eotg_aug_inherit.006.msg_a:0 "The terms are agreed, and they bind you."
 eotg_aug_inherit.007.msg_a:0 "Your renunciation of the succession is accepted."
 eotg_aug_inherit.007.msg_b:0 "Terms are set instead."
 eotg_aug_inherit.011.msg_a:0 "You are given passage out."
 eotg_aug_inherit.011.msg_b:0 "You are given passage out, and credit to start again."
 eotg_aug_inherit.011.msg_c:0 "You are sent out and struck from the line."
 eotg_aug_inherit.013.msg:0 "You are struck from the line of succession."
 eotg_aug_inherit.013.msg_la:0 "You walked out, and you are let go."
 eotg_aug_inherit.017.toast_c_hurt:0 "Hurt Holding the Heir Through It"
 eotg_aug_inherit.020.msg_b:0 "The terms are agreed, machine to machine, and they bind you."
 eotg_aug_inherit.024.msg_c:0 "After the failed attempt, terms are set instead of punishment."
